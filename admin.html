<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Le catalogue a déménagé</title>
  <!-- La page du catalogue s'appelait admin.html. Ce fichier ne sert plus qu'aux
       signets pris avant le renommage : il renvoie vers catalogue.html et n'a
       aucun contenu propre. Le rafraîchissement META fait le travail même sans
       JavaScript ; le script, lui, remplace l'entrée d'historique plutôt que
       d'en ajouter une, pour que « Précédent » ne revienne pas ici en boucle. -->
  <meta http-equiv="refresh" content="0; url=catalogue.html" />
  <link rel="canonical" href="catalogue.html" />
  <link rel="stylesheet" href="assets/design-system/styles.css" />
  <style>
    .redirection {
      min-height: 100vh; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: var(--sp-4);
      padding: var(--sp-8); text-align: center;
    }
    .redirection p { font-size: var(--fs-body-sm); font-weight: var(--fw-medium); color: var(--text-body); }
  </style>
  <script>
    location.replace('catalogue.html' + location.search + location.hash);
  </script>
</head>
<body>
  <main class="redirection">
    <h2>Le catalogue a déménagé</h2>
    <p>Cette page s’appelle maintenant <b>catalogue.html</b>. Pensez à corriger votre signet.</p>
    <a class="btn btn--pri" href="catalogue.html">Ouvrir le catalogue</a>
  </main>
</body>
</html>
