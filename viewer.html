<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Activité interactive</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Inter', system-ui, sans-serif; background: #0f1117; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }

    .bar {
      background: var(--bar-color, #171922); border-bottom: 1px solid rgba(255,255,255,.08);
      padding: 0 20px; height: 52px; display: flex; align-items: center;
      justify-content: space-between; gap: 16px; flex-shrink: 0;
    }
    .bar-title { font-size: 14px; font-weight: 600; color: #f1f5f9; letter-spacing: -.2px; }
    .bar-right { display: flex; align-items: center; gap: 12px; }

    .status-badges { display: flex; gap: 8px; }
    .badge {
      display: flex; align-items: center; gap: 5px;
      font-size: 11px; font-weight: 600; padding: 4px 10px; border-radius: 20px;
      border: 1px solid; transition: all .3s ease;
    }
    .badge.pending { color: #64748b; border-color: #1e293b; background: #0f172a; }
    .badge.done { color: #22c55e; border-color: #14532d; background: #052e16; }
    .badge svg { width: 11px; height: 11px; }

    /* Infobulle. Même comportement et même texte que
       assets/design-system/components/infobulle.css ; les règles sont
       recopiées ici parce que cette page-ci est autonome (elle ne lie pas
       le système de design, elle est en thème sombre et n'a que sa propre
       feuille). Si vous touchez à l'une, touchez à l'autre.
       Elle DESCEND sous la barre : la barre est tout en haut de l'écran,
       une bulle qui monterait sortirait de la fenêtre. */
    [data-info] { position: relative; }
    [data-info]::after {
      content: attr(data-info);
      position: absolute; top: calc(100% + 11px); left: 50%;
      transform: translateX(-50%) translateY(-2px);
      z-index: 90; width: max-content; max-width: 260px;
      padding: 8px 12px; border-radius: 8px;
      background: #f8fafc; color: #0f172a;
      box-shadow: 0 8px 24px rgba(0,0,0,.45);
      font-size: 12px; font-weight: 500; line-height: 1.45;
      text-align: left; white-space: normal;
      opacity: 0; visibility: hidden; pointer-events: none;
      transition: opacity .15s ease, transform .15s ease;
    }
    [data-info]::before {
      content: ''; position: absolute; top: calc(100% + 5px); left: 50%;
      transform: translateX(-50%) translateY(-2px); z-index: 91;
      border: 6px solid transparent; border-bottom-color: #f8fafc;
      opacity: 0; visibility: hidden; pointer-events: none;
      transition: opacity .15s ease, transform .15s ease;
    }
    [data-info-cote="droite"]::after { left: auto; right: 0; transform: translateY(-2px); }
    [data-info]:hover::after, [data-info]:hover::before,
    [data-info]:focus-visible::after, [data-info]:focus-visible::before,
    [data-info][tabindex]:focus::after, [data-info][tabindex]:focus::before {
      opacity: 1; visibility: visible; transform: translateX(-50%) translateY(0);
    }
    [data-info-cote="droite"]:hover::after,
    [data-info-cote="droite"]:focus-visible::after,
    [data-info-cote="droite"][tabindex]:focus::after { transform: translateY(0); }
    [data-info][tabindex] { cursor: help; }
    [data-info][tabindex]:focus-visible { outline: 2px solid #38bdf8; outline-offset: 3px; border-radius: 20px; }
    @media (prefers-reduced-motion: reduce) {
      [data-info]::after, [data-info]::before { transition: none; }
    }

    .btn-back {
      font-size: 12px; font-weight: 600; color: #94a3b8;
      background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.1);
      border-radius: 6px; padding: 5px 12px; cursor: pointer;
      font-family: inherit; transition: all .15s; text-decoration: none;
      display: flex; align-items: center; gap: 6px;
    }
    .btn-back:hover { background: rgba(255,255,255,.12); color: #f1f5f9; }

    iframe {
      flex: 1; width: 100%; border: none; background: #fff;
    }
  </style>
</head>
<body>

<div class="bar">
  <span class="bar-title" id="actTitle">Activité interactive</span>
  <div class="bar-right">
    <div class="status-badges">
      <span class="badge pending" id="badgeDialogue" tabindex="0"
            data-info="Pas encore écouté. Ce voyant passe au vert dès que vous avez écouté le dialogue en entier.">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/></svg>
        Dialogue
      </span>
      <span class="badge pending" id="badgeExercise" tabindex="0"
            data-info="Pas encore terminé. Ce voyant passe au vert quand vous avez fait tous les exercices de l'activité.">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
        Exercices
      </span>
    </div>
    <a href="#" class="btn-back" id="btnBack" data-info-cote="droite"
       data-info="Ferme cet onglet et vous ramène à votre portail. Votre travail est déjà enregistré.">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="15 18 9 12 15 6"/></svg>
      Retour
    </a>
  </div>
</div>

<iframe id="actFrame" src="" allow="autoplay; fullscreen" allowfullscreen></iframe>

<script>
  const params = new URLSearchParams(location.search);
  const src        = params.get('src') || '';
  const activityId = parseInt(params.get('activityId')) || null;
  const title      = params.get('title') || 'Activité interactive';
  const code       = params.get('code') || '';
  const color      = params.get('color') || '';

  document.getElementById('actTitle').textContent = title;
  if (color) document.documentElement.style.setProperty('--bar-color', color);

  // Cette page s'ouvre toujours dans un nouvel onglet (window.open depuis
  // eleve.html), donc history.back() n'a rien à faire et ne réagit pas.
  // On ferme l'onglet (ça fonctionne car il a été ouvert par script) et,
  // si ça échoue (onglet ouvert autrement), on retombe sur eleve.html.
  document.getElementById('btnBack').addEventListener('click', (e) => {
    e.preventDefault();
    window.close();
    setTimeout(() => { location.href = 'eleve.html'; }, 250);
  });

  // Charger l'activité dans l'iframe.
  //
  // Deux paramètres sont ajoutés à l'URL :
  //   code — relaie le code élève (ex. pour authentifier un appel API fait
  //          depuis l'activité, comme la correction assistée par IA) ;
  //   v    — date de dernière modification du fichier, obtenue par une requête
  //          HEAD (en-têtes seulement, sans le corps). Elle sert d'empreinte de
  //          version : quand on met une activité à jour, l'URL change, donc le
  //          navigateur va forcément rechercher le fichier. Sans ça, Chrome
  //          resservait la version en cache de l'iframe — un simple
  //          rechargement de la page ne suffit pas à rafraîchir une iframe, et
  //          l'élève travaillait sur une ancienne version sans le savoir.
  async function loadActivity() {
    const frame = document.getElementById('actFrame');
    if (!src) { frame.src = ''; return; }
    let v = '';
    try {
      const head = await fetch(src, { method: 'HEAD', cache: 'no-store' });
      const lm = head.headers.get('Last-Modified');
      // Pas d'en-tête (assets servis depuis le volume) : on retombe sur la
      // date du jour, ce qui rafraîchit au moins une fois par jour.
      v = String(Date.parse(lm) || new Date().toDateString());
    } catch (e) {
      v = String(new Date().toDateString());
    }
    const params = new URLSearchParams();
    if (code) params.set('code', code);
    params.set('v', v);
    frame.src = src + (src.includes('?') ? '&' : '?') + params.toString();
  }
  loadActivity();

  // ── Suivi d'événements ──────────────────────────────────────────────────

  const tracked = { dialogue_listened: false, exercise_completed: false };

  async function track(event, extra = {}) {
    if (tracked[event]) return;
    tracked[event] = true;

    // Mise à jour visuelle immédiate
    if (event === 'dialogue_listened') markDone('badgeDialogue');
    if (event === 'exercise_completed') markDone('badgeExercise');

    try {
      await fetch('/api/student/progress', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ code, activityId, activityTitle: title, event, ...extra }),
      });
    } catch(e) { /* silencieux */ }
  }

  // L'explication suit l'état du voyant : « ce qu'il vous reste à faire »
  // tant qu'il est gris, « c'est acquis » une fois vert. Un texte figé au
  // futur devant un voyant vert se lirait comme un reproche.
  const INFO_FAIT = {
    badgeDialogue: "C'est fait : vous avez écouté le dialogue.",
    badgeExercise: "C'est fait : vous avez terminé les exercices de l'activité.",
  };

  function markDone(id) {
    const el = document.getElementById(id);
    el.classList.remove('pending');
    el.classList.add('done');
    if (INFO_FAIT[id]) el.setAttribute('data-info', INFO_FAIT[id]);
  }

  // Écouter les messages postMessage venant de l'iframe
  window.addEventListener('message', e => {
    const d = e.data;
    if (!d || !d.lms) return;
    if (d.event === 'dialogue_listened') track('dialogue_listened');
    if (d.event === 'exercise_completed') markDone('badgeExercise');
  });

  // Enregistrer l'ouverture (si pas déjà fait par eleve.html)
  if (code && activityId) {
    fetch('/api/student/progress', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ code, activityId, activityTitle: title, event: 'file_opened' }),
    }).catch(() => {});
  }
</script>
</body>
</html>
