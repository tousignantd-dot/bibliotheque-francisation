<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Activité interactive</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    /* La hauteur se prend sur le viewport DYNAMIQUE. Sur iPhone, `100vh`
       vaut la fenêtre barres masquées : le bas du cadre passait sous la
       barre d'outils de Safari, donc le bas du module restait inatteignable
       et la bande « Mes outils » du module — collée en bas du cadre —
       ne s'affichait jamais. `100dvh` suit les barres du navigateur ;
       `100vh` reste écrit d'abord pour les navigateurs qui l'ignorent. */
    body { font-family: 'Inter', system-ui, sans-serif; background: #0f1117; display: flex; flex-direction: column; height: 100vh; height: 100dvh; overflow: hidden; }

    .bar {
      background: var(--bar-color, #171922); border-bottom: 1px solid rgba(255,255,255,.08);
      padding: 0 20px; height: 52px; display: flex; align-items: center;
      justify-content: space-between; gap: 16px; flex-shrink: 0;
    }
    .bar-title { font-size: 14px; font-weight: 600; color: #f1f5f9; letter-spacing: -.2px;
                 min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .bar-right { display: flex; align-items: center; gap: 12px; flex-shrink: 0; }

    .status-badges { display: flex; gap: 8px; }
    .badge {
      display: flex; align-items: center; gap: 5px;
      font-size: 11px; font-weight: 600; padding: 4px 10px; border-radius: 20px;
      border: 1px solid; transition: all .3s ease;
    }
    .badge.pending { color: #64748b; border-color: #1e293b; background: #0f172a; }
    .badge.done { color: #22c55e; border-color: #14532d; background: #052e16; }
    .badge svg { width: 11px; height: 11px; }

    /* Infobulle. Même comportement et même texte que
       assets/design-system/components/infobulle.css ; les règles sont
       recopiées ici parce que cette page-ci est autonome (elle ne lie pas
       le système de design, elle est en thème sombre et n'a que sa propre
       feuille). Si vous touchez à l'une, touchez à l'autre.
       Elle DESCEND sous la barre : la barre est tout en haut de l'écran,
       une bulle qui monterait sortirait de la fenêtre. */
    [data-info] { position: relative; }
    [data-info]::after {
      content: attr(data-info);
      position: absolute; top: calc(100% + 11px); left: 50%;
      transform: translateX(-50%) translateY(-2px);
      z-index: 90; width: max-content; max-width: 260px;
      padding: 8px 12px; border-radius: 8px;
      background: #f8fafc; color: #0f172a;
      box-shadow: 0 8px 24px rgba(0,0,0,.45);
      font-size: 12px; font-weight: 500; line-height: 1.45;
      text-align: left; white-space: normal;
      opacity: 0; visibility: hidden; pointer-events: none;
      transition: opacity .15s ease, transform .15s ease;
    }
    [data-info]::before {
      content: ''; position: absolute; top: calc(100% + 5px); left: 50%;
      transform: translateX(-50%) translateY(-2px); z-index: 91;
      border: 6px solid transparent; border-bottom-color: #f8fafc;
      opacity: 0; visibility: hidden; pointer-events: none;
      transition: opacity .15s ease, transform .15s ease;
    }
    [data-info-cote="droite"]::after { left: auto; right: 0; transform: translateY(-2px); }
    [data-info]:hover::after, [data-info]:hover::before,
    [data-info]:focus-visible::after, [data-info]:focus-visible::before,
    [data-info][tabindex]:focus::after, [data-info][tabindex]:focus::before {
      opacity: 1; visibility: visible; transform: translateX(-50%) translateY(0);
    }
    [data-info-cote="droite"]:hover::after,
    [data-info-cote="droite"]:focus-visible::after,
    [data-info-cote="droite"][tabindex]:focus::after { transform: translateY(0); }
    [data-info][tabindex] { cursor: help; }
    [data-info][tabindex]:focus-visible { outline: 2px solid #38bdf8; outline-offset: 3px; border-radius: 20px; }
    @media (prefers-reduced-motion: reduce) {
      [data-info]::after, [data-info]::before { transition: none; }
    }

    .btn-back {
      font-size: 12px; font-weight: 600; color: #94a3b8;
      background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.1);
      border-radius: 6px; padding: 5px 12px; cursor: pointer;
      font-family: inherit; transition: all .15s; text-decoration: none;
      display: flex; align-items: center; gap: 6px;
    }
    .btn-back:hover { background: rgba(255,255,255,.12); color: #f1f5f9; }

    /* Le cadre qui rogne. Une activité plus large que le téléphone est
       réduite à l'échelle (voir « ajusterLechelle » plus bas) : la mise à
       l'échelle ne change pas la place prise dans la mise en page, donc sans
       ce conteneur en `overflow: hidden` la page entière se mettrait à
       défiler de côté. */
    .fit { flex: 1; min-height: 0; display: flex; position: relative; overflow: hidden; }

    iframe {
      flex: 1; width: 100%; border: none; background: #fff;
    }

    /* ── Téléphone ──────────────────────────────────────────────
       Le nom du module passe avant les voyants : les deux mots
       « Dialogue » et « Exercices » se retirent, le glyphe et sa
       couleur suffisent, et la place gagnée revient au titre. Sans
       ça, le titre était comprimé à trois lignes dans une barre
       haute de 52 px, donc coupé. */
    @media (max-width: 640px) {
      .bar { padding: 0 12px; gap: 8px; }
      .bar-title { font-size: 13.5px; }
      .bar-right { gap: 6px; }
      .badge { font-size: 0; gap: 0; padding: 6px; }
      .badge svg { width: 14px; height: 14px; }
      .btn-back { padding: 5px 8px; gap: 4px; }
    }
  </style>
</head>
<body>

<div class="bar">
  <span class="bar-title" id="actTitle">Activité interactive</span>
  <div class="bar-right">
    <div class="status-badges">
      <span class="badge pending" id="badgeDialogue" tabindex="0"
            data-info="Pas encore écouté. Ce voyant passe au vert dès que vous avez écouté le dialogue en entier.">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/></svg>
        Dialogue
      </span>
      <span class="badge pending" id="badgeExercise" tabindex="0"
            data-info="Pas encore terminé. Ce voyant passe au vert quand vous avez fait tous les exercices de l'activité.">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
        Exercices
      </span>
    </div>
    <a href="#" class="btn-back" id="btnBack" data-info-cote="droite"
       data-info="Ferme cet onglet et vous ramène à votre portail. Votre travail est déjà enregistré.">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="15 18 9 12 15 6"/></svg>
      Retour
    </a>
  </div>
</div>

<div class="fit" id="actFit">
  <iframe id="actFrame" src="" allow="autoplay; fullscreen" allowfullscreen></iframe>
</div>

<script>
  const params = new URLSearchParams(location.search);
  const src        = params.get('src') || '';
  const activityId = parseInt(params.get('activityId')) || null;
  const title      = params.get('title') || 'Activité interactive';
  const code       = params.get('code') || '';
  // Où mène « Retour ». Le portail élève par défaut ; une séance sans compte
  // passe son propre chemin, parce qu'il n'y a pas de compte au bout et que
  // l'élève tomberait sur un écran de connexion qui ne le concerne pas.
  const retourBrut = params.get('retour') || '';
  // Chemin relatif du site seulement : jamais « // », jamais de schéma. Cette
  // valeur vient de l'adresse, et une adresse se fabrique.
  const retour = /^[A-Za-z0-9_.-]+\.html(\?[^#]*)?$/.test(retourBrut)
    ? retourBrut : 'eleve.html';
  const color      = params.get('color') || '';

  document.getElementById('actTitle').textContent = title;
  if (color) document.documentElement.style.setProperty('--bar-color', color);

  // Cette page s'ouvre toujours dans un nouvel onglet (window.open depuis
  // eleve.html), donc history.back() n'a rien à faire et ne réagit pas.
  // On ferme l'onglet (ça fonctionne car il a été ouvert par script) et,
  // si ça échoue (onglet ouvert autrement), on retombe sur eleve.html.
  document.getElementById('btnBack').addEventListener('click', (e) => {
    e.preventDefault();
    // Une séance sans compte arrive ici **dans le même onglet** : le fermer
    // emporterait tout le contexte de l'élève, et il n'a pas de portail où
    // revenir ensuite. Quand un retour explicite est demandé, on navigue.
    if (retourBrut) { location.href = retour; return; }
    window.close();
    setTimeout(() => { location.href = retour; }, 250);
  });

  // Charger l'activité dans l'iframe.
  //
  // Deux paramètres sont ajoutés à l'URL :
  //   code — relaie le code élève (ex. pour authentifier un appel API fait
  //          depuis l'activité, comme la correction assistée par IA) ;
  //   v    — date de dernière modification du fichier, obtenue par une requête
  //          HEAD (en-têtes seulement, sans le corps). Elle sert d'empreinte de
  //          version : quand on met une activité à jour, l'URL change, donc le
  //          navigateur va forcément rechercher le fichier. Sans ça, Chrome
  //          resservait la version en cache de l'iframe — un simple
  //          rechargement de la page ne suffit pas à rafraîchir une iframe, et
  //          l'élève travaillait sur une ancienne version sans le savoir.
  async function loadActivity() {
    const frame = document.getElementById('actFrame');
    if (!src) { frame.src = ''; return; }
    let v = '';
    try {
      const head = await fetch(src, { method: 'HEAD', cache: 'no-store' });
      const lm = head.headers.get('Last-Modified');
      // Pas d'en-tête (assets servis depuis le volume) : on retombe sur la
      // date du jour, ce qui rafraîchit au moins une fois par jour.
      v = String(Date.parse(lm) || new Date().toDateString());
    } catch (e) {
      v = String(new Date().toDateString());
    }
    const params = new URLSearchParams();
    if (code) params.set('code', code);
    params.set('v', v);
    frame.src = src + (src.includes('?') ? '&' : '?') + params.toString();
  }
  loadActivity();

  /* ── Les activités qui ne connaissent pas le téléphone ──────────────
     Vingt-sept ateliers de la première époque sont mis en page pour un
     écran large : pas une seule media query dans leur feuille de style.
     Leur poser un `<meta name="viewport">` ne sert à rien — **une iframe
     ignore le viewport de son document**, sa largeur de mise en page est
     la taille du cadre. Le remède ne peut donc vivre que dans le cadre.

     On mesure la largeur naturelle du contenu et, si elle dépasse la
     place, on donne à l'iframe cette largeur-là puis on la réduit à
     l'échelle. Le navigateur transporte les coordonnées du pointeur à
     travers la transformation : le glisser-déposer, qui est le geste
     principal de ces ateliers, continue de tomber juste — ce qu'un
     `zoom` ou une réécriture des largeurs ne garantissaient pas.

     Trois mesures échelonnées : ces fichiers sortent d'un bundler et
     **réécrivent le document entier** après leur chargement, si bien que
     mesurer au seul événement `load` donne la largeur d'une page vide. */
  const MIN_LARGEUR = 320, MAX_LARGEUR = 2000;

  /* La feuille qui replie les vieux ateliers. Elle ne peut pas être liée
     depuis leurs fichiers : ils réécrivent leur document au démarrage et
     emporteraient le lien. On la repose donc ici, après eux, à chaque
     mesure — deux lignes qui valent quinze ateliers rendus lisibles. */
  function poserLaFeuilleMobile(doc) {
    if (doc.getElementById('feuille-ateliers-mobile')) return;
    const lien = doc.createElement('link');
    lien.id = 'feuille-ateliers-mobile';
    lien.rel = 'stylesheet';
    lien.href = '/assets/design-system/ateliers-mobile.css';
    (doc.head || doc.documentElement).appendChild(lien);
  }

  function ajusterLechelle() {
    const frame = document.getElementById('actFrame');
    const boite = document.getElementById('actFit');
    if (!frame || !boite) return;
    let doc;
    try { doc = frame.contentDocument; } catch (e) { return; }  // autre origine
    if (!doc || !doc.documentElement) return;
    poserLaFeuilleMobile(doc);

    const dispo = boite.clientWidth;
    const hauteur = boite.clientHeight;
    if (!dispo || !hauteur) return;

    frame.style.cssText = '';
    const naturel = Math.max(doc.documentElement.scrollWidth,
                             doc.body ? doc.body.scrollWidth : 0);
    // Le repli d'abord : si la feuille a fait entrer l'atelier, on ne réduit
    // rien et le texte garde sa taille. La réduction ne sert plus qu'aux
    // douze ateliers hors de la famille, qui n'ont pas de vocabulaire commun.
    if (naturel <= dispo + 4) return;
    if (naturel < MIN_LARGEUR || naturel > MAX_LARGEUR) return;

    const k = dispo / naturel;
    frame.style.position = 'absolute';
    frame.style.top = '0';
    frame.style.left = '0';
    frame.style.flex = 'none';
    frame.style.width = naturel + 'px';
    frame.style.height = Math.round(hauteur / k) + 'px';
    frame.style.transformOrigin = '0 0';
    frame.style.transform = 'scale(' + k.toFixed(4) + ')';
  }

  /* ── La transcription fermée par l'enseignant ───────────────────────
     Les 87 modules portent eux-mêmes ce verrou (build/greffe_transcription.py).
     Les activités d'avant le gabarit, non : ce sont des fichiers uniques, et
     les douze qui sortent d'un bundler **réécrivent leur document** au
     démarrage — un bloc greffé dans leur `<head>` serait emporté. Le cadre est
     donc le seul endroit d'où on peut les atteindre, comme pour la feuille
     mobile.

     Deux formes de dialogue, un seul mot commun : `dial-txt`, identifiant chez
     les douze, classe chez les autres et chez le gabarit. Le lecteur audio est
     laissé intact — c'est tout l'objet de la consigne : écouter sans lire. */
  const NOTE_FERMEE = 'Ton enseignante a fermé la transcription : écoute le dialogue.';
  let TRANSCRIPTION_FERMEE = false;

  function fermerLaTranscription(doc) {
    if (!TRANSCRIPTION_FERMEE || !doc) return;

    // Le bouton qui l'ouvrait s'en va **sans phrase** : l'explication se met là
    // où était le texte, et une seule fois. Deux messages pour un dialogue
    // (un dans l'en-tête, un dans le corps) se lisaient comme un bégaiement.
    doc.querySelectorAll('[onclick^="toggleScript"]').forEach(function (b) {
      b.parentNode.removeChild(b);
    });
    // Les douze ateliers du bundler n'ont pas d'`onclick` : leur bouton se
    // reconnaît à son texte, et il est redessiné à chaque rendu.
    doc.querySelectorAll('button, [role="button"]').forEach(function (b) {
      if (!/(Cacher|Afficher|Montrer) le dialogue/i.test(b.textContent || '')) return;
      if (b.children.length > 2) return;
      b.parentNode.removeChild(b);
    });

    const textes = doc.querySelectorAll('#dial-txt, .dial-txt');
    textes.forEach(function (el) {
      if (el.dataset.transcriptionFermee) return;
      el.dataset.transcriptionFermee = '1';
      el.style.display = 'none';
      const det = el.closest ? el.closest('details') : null;
      if (det) det.style.display = 'none';
      const note = doc.createElement('div');
      note.className = 'transcription-fermee';
      note.style.cssText = 'font-size:13px;font-weight:700;opacity:.75;padding:8px 0';
      note.textContent = NOTE_FERMEE;
      el.parentNode.insertBefore(note, el);
    });
  }

  function surveillerTranscription(doc) {
    fermerLaTranscription(doc);
    // Ces applications se redessinent : sans observation, la transcription
    // revient au premier changement d'écran.
    if (!doc.body || doc.body.dataset.transcriptionObservee) return;
    doc.body.dataset.transcriptionObservee = '1';
    let enAttente = false;
    new (doc.defaultView.MutationObserver)(function () {
      if (enAttente) return;
      enAttente = true;
      doc.defaultView.setTimeout(function () {
        enAttente = false;
        fermerLaTranscription(doc);
      }, 120);
    }).observe(doc.body, { childList: true, subtree: true });
  }

  (function demanderLaTranscription() {
    if (!code || !activityId) return;   // hors session : rien à demander
    fetch('/api/student/sections?code=' + encodeURIComponent(code)
          + '&activityId=' + activityId)
      .then(function (r) { return r.ok ? r.json() : null; })
      .then(function (d) {
        // Seul un `false` franc ferme quelque chose : un serveur qui ne connaît
        // pas le champ n'enlève rien à l'élève.
        if (!d || d.transcription !== false) return;
        TRANSCRIPTION_FERMEE = true;
        const frame = document.getElementById('actFrame');
        try {
          if (frame.contentDocument) surveillerTranscription(frame.contentDocument);
        } catch (e) { /* autre origine */ }
        frame.addEventListener('load', function () {
          try { surveillerTranscription(frame.contentDocument); } catch (e) {}
          setTimeout(function () {
            try { surveillerTranscription(frame.contentDocument); } catch (e) {}
          }, 1200);
        });
      })
      .catch(function () { /* serveur muet : la transcription reste offerte */ });
  })();

  (function surveillerLechelle() {
    const frame = document.getElementById('actFrame');
    if (!frame) return;
    frame.addEventListener('load', () => {
      ajusterLechelle();
      setTimeout(ajusterLechelle, 300);
      setTimeout(ajusterLechelle, 1500);
    });
    window.addEventListener('resize', ajusterLechelle);
    window.addEventListener('orientationchange',
                            () => setTimeout(ajusterLechelle, 250));
  })();


  // ── Suivi d'événements ──────────────────────────────────────────────────

  const tracked = { dialogue_listened: false, exercise_completed: false };

  async function track(event, extra = {}) {
    if (tracked[event]) return;
    tracked[event] = true;

    // Mise à jour visuelle immédiate
    if (event === 'dialogue_listened') markDone('badgeDialogue');
    if (event === 'exercise_completed') markDone('badgeExercise');

    try {
      await fetch('/api/student/progress', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ code, activityId, activityTitle: title, event, ...extra }),
      });
    } catch(e) { /* silencieux */ }
  }

  // L'explication suit l'état du voyant : « ce qu'il vous reste à faire »
  // tant qu'il est gris, « c'est acquis » une fois vert. Un texte figé au
  // futur devant un voyant vert se lirait comme un reproche.
  const INFO_FAIT = {
    badgeDialogue: "C'est fait : vous avez écouté le dialogue.",
    badgeExercise: "C'est fait : vous avez terminé les exercices de l'activité.",
  };

  function markDone(id) {
    const el = document.getElementById(id);
    el.classList.remove('pending');
    el.classList.add('done');
    if (INFO_FAIT[id]) el.setAttribute('data-info', INFO_FAIT[id]);
  }

  // Écouter les messages postMessage venant de l'iframe
  window.addEventListener('message', e => {
    const d = e.data;
    if (!d || !d.lms) return;
    if (d.event === 'dialogue_listened') track('dialogue_listened');
    if (d.event === 'exercise_completed') markDone('badgeExercise');
  });

  // Enregistrer l'ouverture (si pas déjà fait par eleve.html)
  if (code && activityId) {
    fetch('/api/student/progress', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ code, activityId, activityTitle: title, event: 'file_opened' }),
    }).catch(() => {});
  }
</script>
</body>
</html>
