*{box-sizing:border-box}
[hidden]{display:none!important}

.secteur{display:flex;flex-direction:column;align-items:flex-end;text-align:right;line-height:1.15}
.secteur small{font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--text-muted)}
.secteur b{font-size:17px;font-weight:900;color:var(--ville)}

main{max-width:760px;margin:0 auto;padding:14px 16px 90px}
h1{font-size:28px;line-height:1.15;margin:6px 0 6px;color:var(--text-strong)}
h2{font-size:21px;line-height:1.2;margin:22px 0 10px;color:var(--text-strong)}
p{margin:0 0 10px}
.muted{color:var(--text-muted)}
.surtitre{font-size:13px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--text-muted);margin:0}
button{font:inherit}
.btn{font-weight:800;font-size:16px;cursor:pointer;border-radius:12px;padding:10px 16px;min-height:48px;
  border:1px solid var(--line-300,#D6D6D2);background:var(--surface-card,#fff);color:var(--text-strong);
  display:inline-flex;gap:8px;align-items:center;justify-content:center;text-decoration:none}
.btn--pri{background:var(--accent);border-color:var(--accent);color:#fff}
.btn--large{width:100%;white-space:normal;line-height:1.25}
.btn--son{background:var(--audio);border-color:var(--audio);color:#fff;min-width:48px;padding:10px 12px}
.btn--petit{min-height:44px;padding:6px 12px;font-size:14.5px}
.btn svg{width:20px;height:20px;flex:none}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.rangee{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.carte{background:var(--surface-card,#fff);border:1px solid var(--line-200,#E8E8E4);border-radius:16px;padding:16px}
.retour{display:inline-flex;align-items:center;gap:6px;font-weight:800;font-size:15px;color:var(--text-muted);
  background:none;border:0;padding:8px 0;cursor:pointer;min-height:44px}
.retour svg{width:18px;height:18px}
#app a{color:var(--text-accent)}
.acc{background:#fff;border:1px solid var(--line-200);border-radius:18px;padding:16px;margin:14px 0}
.acc--carte{background:var(--carte-bg);border-color:#E7D3C3}
.acc h2{margin:2px 0 6px}
.valise{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;margin:10px 0}
.valise span{aspect-ratio:3/2;border:1.5px dashed #D7BFAE;border-radius:6px;display:grid;place-items:center;font-weight:900;color:#B79A86;background:#fff}
.valise span.fait{border:1.5px solid var(--carte);background:var(--carte);color:#fff}
.ariane{list-style:none;padding:0;margin:12px 0 14px;display:flex}
.ariane li{flex:1;position:relative;text-align:center;min-width:0}
.ariane li+li::before{content:"";position:absolute;top:17px;right:calc(50% + 19px);left:calc(-50% + 19px);height:3px;border-radius:2px;background:var(--line-200)}
.ariane li.relie::before{background:var(--ok-line,#2E7D4F)}
.ariane button{background:none;border:0;padding:0;font:inherit;color:inherit;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:5px;width:100%}
.ariane button:disabled{cursor:not-allowed}
.ariane .rond{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-weight:900;font-size:16px;background:#fff;border:2px solid var(--carte);color:var(--carte);position:relative;z-index:1}
.ariane .lib{font-size:13px;font-weight:800;line-height:1.2}
.ariane li.fait .rond{background:var(--ok-line,#2E7D4F);border-color:var(--ok-line,#2E7D4F);color:#fff}
.ariane li.ici .rond{background:var(--carte);color:#fff;box-shadow:0 0 0 4px rgba(122,59,29,.2)}
.ariane li.ferme .rond{border-color:var(--line-300);color:var(--text-muted);background:#F3F0E8}
.ariane li.ferme .lib{color:var(--text-muted);font-weight:700}
.fil-legende{font-size:14.5px;color:var(--text-muted);margin:-4px 0 12px;text-align:center}
.meca{background:#fff;border:1px solid var(--line-200);border-left:4px solid var(--carte);border-radius:12px;padding:10px 14px;margin:10px 0 14px}
.meca ul{margin:6px 0 0;padding-left:18px}.meca li{margin:5px 0;font-size:15.5px;line-height:1.5}
.objectif{background:var(--carte-bg);border:1px solid #E7D3C3;border-radius:12px;padding:10px 12px;margin:10px 0;font-size:15.5px;color:#4A2412}
.etapes-j{list-style:none;padding:0;margin:14px 0 0;display:flex;flex-direction:column;gap:8px}
.etapes-j button{width:100%;display:flex;align-items:center;gap:12px;text-align:left;background:#fff;border:1px solid var(--line-200);
  border-radius:14px;padding:12px 14px;cursor:pointer;min-height:60px}
.etapes-j .num{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:900;
  background:var(--surface-sunken,#FBFBFA);border:1px solid var(--line-200);flex:none;font-size:14px}
.etapes-j .fait .num{background:var(--ok-bg);border-color:var(--ok-line);color:var(--ok-ink)}
.etapes-j b{display:block;color:var(--text-strong)}
.etapes-j span.d{font-size:13.5px;color:var(--text-muted);display:block;line-height:1.3}
.etat{margin-left:auto;font-size:12.5px;font-weight:800;color:var(--ok-ink);white-space:nowrap}
.ph{display:flex;gap:10px;align-items:center;padding:10px 14px;border-top:1px solid var(--line-200)}
.ph:first-child{border-top:0}
.ph .t{flex:1;min-width:0}
.ph .t b{display:block;color:var(--text-strong);font-size:16.5px;line-height:1.25}
.ph .t span{font-size:14px;color:var(--text-muted)}
.liste-ecoute{padding:4px 0}
.grille{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}

.mot{background:#fff;border:1px solid var(--line-200);border-radius:14px;padding:10px;display:flex;flex-direction:column;gap:4px;cursor:pointer;text-align:left;min-width:0;font:inherit}
.mot img{width:100%;aspect-ratio:1;object-fit:contain}
.mot .en{font-weight:900;font-size:16.5px;color:var(--text-strong);line-height:1.2;overflow-wrap:anywhere}
.mot .fr{font-size:14px;color:var(--text-muted);line-height:1.25}
.mot .piege{font-size:11.5px;font-weight:900;letter-spacing:.06em;text-transform:uppercase;color:var(--warn-ink);background:var(--warn-bg);

.consigne{font-size:15.5px;color:var(--text-muted);margin:0 0 10px}
.progres{height:8px;background:#EEE9DA;border-radius:99px;overflow:hidden;margin:6px 0 14px}
.progres i{display:block;height:100%;background:var(--carte);border-radius:99px;transition:width .3s}
.choix{display:flex;flex-direction:column;gap:8px;margin:10px 0}
.choix button{text-align:left;background:#fff;border:1.5px solid var(--line-300,#D6D6D2);border-radius:12px;padding:12px 14px;

.choix button.juste::before{content:"✓ ";font-weight:900}
.choix button.juste{border-color:var(--ok-line);background:var(--ok-bg);color:var(--ok-ink)}
.choix button.faux::before{content:"✕ ";font-weight:900}
.choix button.faux{border-color:var(--no-line);background:var(--no-bg);color:var(--no-ink);cursor:default}
.retro{border-radius:10px;padding:10px 12px;margin:8px 0;font-size:15.5px}
.retro.ok{background:var(--ok-bg);border:1px solid var(--ok-line);color:var(--ok-ink)}
.retro.no{background:var(--no-bg);border:1px solid var(--no-line);color:var(--no-ink)}

.phrase-en{font-size:21px;font-weight:900;color:var(--text-strong);line-height:1.3;margin:6px 0}
.micro{display:flex;flex-direction:column;align-items:center;gap:8px;margin:12px 0}

.entendu{font-size:15.5px;min-height:24px;text-align:center;color:var(--text-body)}
.scene-tete{display:flex;gap:12px;align-items:center;margin:4px 0 10px}
.rappel{font-size:12.5px;font-weight:900;letter-spacing:.06em;text-transform:uppercase;color:#7A5A45;background:var(--carte-bg);border:1px solid #E7D3C3;border-radius:99px;padding:2px 10px;display:inline-block;margin-bottom:6px}
.regle{border:1px dashed var(--warn-line);background:var(--warn-bg);color:var(--warn-ink);border-radius:12px;padding:10px 12px;font-size:15px;margin:8px 0}

.pied a{color:var(--text-muted)}
.avis-local{font-size:13px;color:var(--text-muted)}

st/1-9-m.mp3"],"prep":{"seances":[{"id":"p1","titre":"Les sons de l'anglais qui trompent","obj":"P1","minutes":15,"intro":"Vous connaissez déjà beaucoup de mots anglais. Ce qui vous trahit, ce sont cinq ou six sons que le français n'a pas, et la syllabe forte. Une fois ceux-là apprivoisés, on vous comprend du premier coup.","meca":["<b>th</b> : la langue entre les dents, jamais un s, un t, un z ni un d — <i>thanks</i>, <i>the</i>, <i>three</i>.","<b>h</b> se dit, comme un souffle : <i>hotel</i>, <i>help</i>. Sans lui, <i>hat</i> devient <i>at</i>.","<b>i court, ee long</b> : <i>ship</i> (un bateau) n'est pas <i>sheep</i> (un mouton) ; <i>live</i> n'est pas <i>leave</i>.","<b>La syllabe forte</b> : l'anglais en appuie une et avale les autres — <i>ho·TEL</i>, <i>DIN·ner</i>, <i>de·SSERT</i>.","<b>Les lettres muettes</b> : le k de <i>knife</i>, le p de <i>receipt</i>, le s de <i>island</i>.","<b>-ed</b> ne fait pas une syllabe de plus, sauf après t ou d : <i>closed</i> (une syllabe), <i>wanted</i> (deux)."],"ecoute":[["Thanks!","Merci ! — la langue entre les dents"],["the hotel","l'hôtel — le h soufflé, ho·TEL"],["a ship, a sheep","un bateau, un mouton — i court, ee long"],["to live, to leave","habiter, partir"],["dinner, dessert","le souper, le dessert — DIN·ner, de·SSERT"],["a knife","un couteau — le k ne se dit pas"],["the receipt","le reçu — le p ne se dit pas"],["the island","l'île — le s ne se dit pas"],["It's closed.","C'est fermé — closed en une syllabe"]],"mots":["knife","receipt","island","dessert","closed","dinner"],"quiz":[{"type":"mot","en":"three","choix":[["three",null],["tree","Tree (un arbre) commence par un t franc. Ici, la langue passait entre les dents : three, trois."],["free","Free commence par un f, les lèvres sur les dents. Ici : three, la langue entre les dents."]]},{"type":"mot","en":"hat","choix":[["hat",null],["at","At commence par une voyelle. Ici, on entendait un souffle avant : hat, le h se dit."],["hut","Hut a un son plus sourd, comme « eu ». Ici : hat, un chapeau."]]},{"type":"mot","en":"leave","choix":[["leave",null],["live","Live a un i court, bref. Ici, le son était long, tiré : leave, partir."],["leaf","Leaf finit par un f soufflé. Ici, la fin vibrait : leave."]]},{"type":"mot","en":"ship","choix":[["ship",null],["sheep","Sheep a un ee long. Ici, le i était court : ship, un bateau."],["chip","Chip commence par tch. Ici : ship, avec ch doux."]]},{"type":"mot","en":"hotel","q":"Où est la syllabe forte ?","choix":[["ho·TEL",null],["HO·tel","En anglais, hotel appuie sur la fin : ho·TEL, comme en français."],["les deux pareilles","L'anglais n'égalise jamais : une syllabe est forte, l'autre s'efface. Ici : ho·TEL."]]},{"type":"mot","en":"dinner","q":"Où est la syllabe forte ?","choix":[["DIN·ner",null],["din·NER","Dinner appuie sur le début : DIN·ner. La fin s'avale presque."],["les deux pareilles","Une syllabe est forte, l'autre s'efface : DIN·ner."]]},{"type":"mot","en":"closed","q":"Combien de syllabes ?","choix":[["une",null],["deux","Après un s, -ed ne fait pas de syllabe : closed se dit en une seule."],["trois","Closed se dit d'un coup : une seule syllabe."]]}],"dire":[["Dites « merci ».","Thanks!",["thanks|thank you|thank"]],["Dites « l'hôtel ».","The hotel.",["hotel"]],["Dites « trois ».","Three.",["three|3"]],["Dites « un couteau ».","A knife.",["knife"]]]},{"id":"p2","titre":"Saluer, remercier, faire répéter","obj":"P1","minutes":15,"intro":"Les formules qui ouvrent toutes les portes, et celles qui sauvent quand on ne comprend pas. Au Canada anglais, on les dit sans arrêt : bonjour, merci, désolé, bonne journée.","meca":["<b>Hi, how are you?</b> n'est pas une vraie question : on répond <i>Good, thanks! And you?</i>, même fatigué.","<b>Excuse me</b> pour attirer l'attention ; <b>sorry</b> pour s'excuser — et les Canadiens le disent même quand c'est vous qui les bousculez.","<b>You're welcome</b> répond à <i>thank you</i> ; on entend aussi <i>no problem</i>, <i>no worries</i>.","Les phrases qui sauvent : <i>Sorry, could you say that again?</i> et <i>More slowly, please.</i>","Pour partir : <i>Have a good one!</i> (bonne journée, bonne soirée — à toute heure)."],"ecoute":[["Sorry, I don't understand.","Pardon, je ne comprends pas."],["Hi! How are you?","Bonjour ! Comment ça va ?"],["Good, thanks! And you?","Bien, merci ! Et vous ?"],["Excuse me…","Excusez-moi… (pour attirer l'attention)"],["Sorry!","Pardon ! Désolé !"],["Thank you so much. — You're welcome.","Merci beaucoup. — De rien."],["No worries!","C'est correct ! (pas de problème)"],["Sorry, could you say that again?","Pardon, pouvez-vous répéter ?"],["More slowly, please.","Plus lentement, s'il vous plaît."],["Have a good one!","Bonne journée ! (ou bonne soirée)"]],"mots":["hi","thanks","welcome","sorry","excuse_me","again","slowly","dont_understand"],"quiz":[{"type":"rep","qui":"liam","en":"Hi there, how are you doing today?","q":"Que répondez-vous ?","choix":[["Good, thanks! And you?",null],["I'm tired, I slept badly.","C'est vrai, peut-être, mais la question est une salutation : on répond « Good, thanks! And you? »."],["I'm doing the CN Tower today.","Doing, ici, veut dire « comment ça va », pas « ce que vous faites »."]]},{"type":"dire","fr":"Vous voulez attirer l'attention d'un employé du musée.","choix":[["Excuse me…",null],["Attention, please!","C'est une annonce au haut-parleur ; pour un employé : « Excuse me… »."],["Hello you!","Trop brusque : « Excuse me… » est la porte polie."]]},{"type":"rep","qui":"harper","en":"No worries!","choix":[["C'est correct ! (pas de problème)",null],["Je suis inquiète.","No worries, c'est le contraire : ce n'est rien, c'est correct."],["Je n'ai pas compris.","Elle a compris : no worries, c'est correct."]]},{"type":"dire","fr":"On vous parle trop vite.","choix":[["More slowly, please.",null],["Speak French, please.","C'est permis, mais rarement possible à Toronto. Demandez plutôt « More slowly, please »."],["Faster, please.","Faster, ce serait plus vite. Plus lentement : more slowly."]]},{"type":"rep","qui":"andrew","en":"Have a good one!","choix":[["Bonne journée !",null],["Prenez-en un bon !","C'est une formule : have a good one, bonne journée (ou soirée)."],["Vous en voulez un autre ?","Il vous salue : have a good one, bonne journée."]]},{"type":"dire","fr":"Vous n'avez pas compris la réponse. Demandez de répéter.","choix":[["Sorry, could you say that again?",null],["Sorry, can you say me that again?","Say ne prend pas « me » : « say that again »."],["Sorry, can you repeat me, please?","Repeat ne prend pas « me » non plus : « could you say that again? »."]]}],"dire":[["Répondez à « How are you? ».","Good, thanks! And you?",["good|fine|great|well|not bad","~(^| )(and you|and yourself|how about you|how about yourself|what about you|what about yourself|how are you|are you from|do you (live|work|like)|have you (ever )?been|what do you do|where do you live|what s your name)( |$)|^you$| you$"]],["Remerciez beaucoup.","Thank you so much!",["thank|thanks"]],["Demandez de répéter, poliment.","Sorry, could you say that again?",["~(say (that|it) again|repeat|pardon|sorry|excuse me|come again|again|one more time|speak up|louder|(don t|didn t|do not|did not) (understand|get it|get that))"]],["Demandez de parler plus lentement.","More slowly, please.",["~slow"]]]},{"id":"p3","titre":"Les nombres et les prix","obj":"P2","minutes":15,"intro":"Un café, un billet, un sandwich : tout a un prix, il se dit vite, et la taxe s'ajoute à la caisse. On apprend les nombres dont on a besoin, et surtout ceux qui se ressemblent à l'oreille.","meca":["<b>Les prix se disent en deux nombres</b> : 4,99 $ = <i>four ninety-nine</i> ; 12,50 $ = <i>twelve fifty</i>. Le mot « dollars » tombe souvent.","<b>Les paires qui trompent</b> : <i>thirteen</i> (13) / <i>thirty</i> (30) · <i>fifteen</i> (15) / <i>fifty</i> (50). Écoutez la fin : -teen finit long, sur un « n » (thir-tiiin) ; -ty finit court, et au Canada le t s'adoucit presque en d après une voyelle ou un r (thir-di, for-di) ; fifty garde son t, mais finit court. Seul, 13 appuie sur la fin ; devant un autre nombre, l'accent peut remonter : fiez-vous au « n ».","<b>La taxe</b> (13 % en Ontario) s'ajoute à la caisse : <i>plus tax</i>. Le prix affiché n'est presque jamais le prix payé.","<b>Pour payer</b> : <i>Cash or card?</i> · <i>Debit or credit?</i> · <i>Tap or insert?</i> (touchez ou insérez la carte)."],"ecoute":[["thirteen, thirty","13, 30 — le « n » de thirteen"],["fifteen, fifty","15, 50 — le « n » de fifteen"],["four ninety-nine","4,99 $"],["twelve fifty","12,50 $"],["How much is it?","C'est combien ?"],["That's six twenty-five, plus tax.","C'est 6,25 $, plus les taxes."],["Cash or card?","Comptant ou carte ?"],["You can tap.","Vous pouvez toucher le lecteur avec votre carte."]],"mots":["how_much","price_four99","thirteen","fifteen","tax","cash","card","terminal","loonie","toonie"],"quiz":[{"type":"rep","qui":"liam","en":"That's thirteen fifty.","choix":[["13,50 $",null],["30,50 $","Ici, on entend le « n » de thirteen : 13."],["30,15 $","Thirty fifteen n'a pas été dit : thirteen fifty, 13,50 $."]]},{"type":"rep","qui":"harper","en":"It's fifty, plus tax.","choix":[["50 $, plus les taxes",null],["15 $, plus les taxes","Fifteen finirait sur un « n ». Ici, fifty finit court : 50."],["15 $, taxes comprises","Ni 15 ni compris : fifty, plus tax."]]},{"type":"rep","qui":"andrew","en":"Four ninety-nine.","choix":[["4,99 $",null],["499 $","Un prix se dit en deux nombres : four, puis ninety-nine — 4,99 $."],["49,90 $","Ce serait forty-nine ninety. Ici : four ninety-nine, 4,99 $."]]},{"type":"dire","fr":"Le caissier dit « Tap or insert? ». Vous voulez toucher le lecteur avec votre carte.","choix":[["Tap, please.",null],["Cash, please.","Cash, c'est comptant ; on vous demandait comment utiliser la carte."],["Insert, please.","Insert, c'est insérer la carte (la puce) dans le lecteur. Pour toucher : tap."]]},{"type":"rep","qui":"liam","en":"Your total is twenty-six thirteen.","choix":[["26,13 $",null],["26,30 $","Ici, on entend le « n » de thirteen : 26,13 $."],["36,30 $","Ni trente-six ni trente : twenty-six thirteen, 26,13 $."]]},{"type":"mot","en":"receipt","choix":[["receipt",null],["recipe","Recipe (une recette) se dit en trois syllabes. Ici : re·CEIPT, le reçu, le p muet."],["receive","Receive (recevoir) finit par un v. Ici : receipt, le reçu."]]}],"dire":[["Demandez combien c'est.","How much is it?",["how much"]],["Demandez si vous pouvez payer par carte.","Can I pay by card?",["~(card|debit|credit|visa|tap)","~(can i|do you|is it|could i)"]],["On vous annonce 13 $. Vérifiez en le répétant.","Thirteen?",["~(^| )(thirteen|13)( |$)"]],["Commandez deux cafés.","Two coffees, please.",["two|2","coffee|coffees"]]]},{"id":"p4","titre":"L'heure et les jours","obj":"P2","minutes":15,"intro":"Le dernier traversier, l'entrée de la tour, la fermeture du musée : en voyage, beaucoup de choses se jouent à un quart d'heure près — et l'anglais compte les quarts autrement.","meca":["<b>Deux façons de dire l'heure</b> : <i>ten thirty</i> = <i>half past ten</i> (10 h 30).","<b>Quarter past ten</b> = 10 h 15 ; <b>quarter to ten</b> = 9 h 45 (dix heures moins quart).","<b>Pas de 21 h</b> : on dit <i>nine p.m.</i> (le soir) ou <i>nine a.m.</i> (le matin), ou <i>nine tonight</i>.","<b>Until</b> = jusqu'à : <i>open until six</i>. <b>From… to…</b> : de… à…","Les jours prennent la majuscule : <i>Monday, Tuesday…</i>"],"ecoute":[["What time is it?","Quelle heure est-il ?"],["It's ten thirty.","Il est 10 h 30."],["quarter past ten","10 h 15"],["quarter to ten","9 h 45 — dix heures moins quart"],["We close at nine p.m.","Nous fermons à 21 h."],["Open until six.","Ouvert jusqu'à 18 h."],["What time does it open?","À quelle heure ça ouvre ?"],["Monday, Tuesday, Wednesday, Thursday","lundi, mardi, mercredi, jeudi"],["Friday, Saturday, Sunday","vendredi, samedi, dimanche"]],"mots":["oclock","quarter_past","half_past","quarter_to","am_pm","open","closed","today","tonight","tomorrow"],"quiz":[{"type":"rep","qui":"harper","en":"The last ferry leaves at quarter to eleven.","choix":[["Le dernier traversier part à 22 h 45.",null],["Le dernier traversier part à 23 h 15.","Quarter past, ce serait et quart. Quarter TO : moins quart — 22 h 45."],["Le dernier traversier part à 23 h 45.","Quarter to eleven, c'est onze heures moins quart : 22 h 45."]]},{"type":"rep","qui":"liam","en":"Your tour starts at quarter past two.","choix":[["La visite commence à 14 h 15.",null],["La visite commence à 13 h 45.","Quarter to, ce serait moins quart. Quarter PAST : et quart — 14 h 15."],["La visite commence à 14 h 45.","Quarter past two, c'est deux heures et quart : 14 h 15."]]},{"type":"rep","qui":"harper","en":"Breakfast is from seven thirty to ten.","choix":[["Le déjeuner est servi de 7 h 30 à 10 h.",null],["Le déjeuner est servi de 7 h à 10 h 30.","Le thirty va avec seven : de 7 h 30 à 10 h."],["Le dîner est servi de 7 h 30 à 10 h.","Breakfast, c'est notre déjeuner, le repas du matin."],["Le dîner est servi de 7 h à 10 h 30.","Breakfast, c'est le déjeuner ; et le thirty va avec seven."]]},{"type":"rep","qui":"andrew","en":"We're open until six.","choix":[["C'est ouvert jusqu'à 18 h.",null],["Ça ouvre à 18 h.","Until, c'est « jusqu'à » : on ferme à six heures."],["C'est ouvert dès 6 h.","Until : jusqu'à. On ferme à 18 h."]]},{"type":"dire","fr":"Demandez à quelle heure ferme le musée.","choix":[["What time does the museum close?",null],["What time does the museum closes?","Après does, close reste sans s."],["What time the museum closes?","Il manque does : « What time does the museum close? »."]]}],"dire":[["Demandez à quelle heure ça ouvre.","What time does it open?",["what time|when","open|opens|opening"]],["Demandez l'heure.","What time is it?",["what time|the time"]],["Dites « à dix heures et demie ».","At ten thirty.",["ten|10","thirty|30|half"]],["Dites « demain matin ».","Tomorrow morning.",["tomorrow","morning"]]]},{"id":"p5","titre":"Quatre formes qui font presque tout","obj":"P3","minutes":15,"intro":"Pas besoin de grammaire pour se débrouiller : quatre débuts de phrase tout faits suffisent pour demander presque tout, au café, à l'hôtel, à la pharmacie.","meca":["<b>Can I get…?</b> ou <b>Could I have…?</b> + la chose : pour commander — <i>Can I get a coffee?</i> C'est poli au Canada.","<b>Do you have…?</b> + la chose : vous avez… ? — <i>Do you have a map?</i>","<b>I need…</b> : j'ai besoin de (l'urgence) — <i>I need a pharmacy.</i>","<b>I have a…</b> + le mal : <i>I have a headache</i> (j'ai mal à la tête) ; ou <b>My … hurts</b> : <i>My foot hurts</i>.","<b>Please</b> à la fin adoucit tout : <i>A large coffee, please.</i>"],"ecoute":[["Can I get a medium coffee?","Je pourrais avoir un café moyen ?"],["Could I have the bill, please?","Pourrais-je avoir l'addition ?"],["Do you have a map?","Avez-vous une carte (de la ville) ?"],["Do you have a room for tonight?","Avez-vous une chambre pour ce soir ?"],["I need a pharmacy.","J'ai besoin d'une pharmacie."],["I need help.","J'ai besoin d'aide."],["I have a headache.","J'ai mal à la tête."],["My foot hurts.","J'ai mal au pied."]],"mots":["coffee","the_bill","room","pharmacy","help","headache","fever","blister","sunburn","water","towel"],"quiz":[{"type":"dire","fr":"Au café, commandez un grand café.","choix":[["Can I get a large coffee, please?",null],["Can I get a coffee large, please?","L'adjectif se place avant : a large coffee."],["Can you get a large coffee, please?","Can YOU : vous lui demanderiez d'aller en acheter un. Pour commander : Can I get…"]]},{"type":"dire","fr":"À la réception, demandez s'il reste une chambre pour ce soir.","choix":[["Do you have a room for tonight?",null],["I have a room for tonight.","I have, c'est « j'ai » : vous affirmez avoir une chambre. Demandez : « Do you have…? »."],["Do you have a room for this night?","This night calque « cette nuit » ; pour ce soir, on dit « for tonight »."]]},{"type":"dire","fr":"À la pharmacie, dites que vous avez mal à la tête.","choix":[["I have a headache.",null],["I am a headache.","I am, c'est « je suis » : vous seriez un mal de tête ! On dit « I have a headache »."],["My head is hurting me very.","« Hurting me very » calque le français ; on dit « My head hurts » ou « I have a headache »."]]},{"type":"rep","qui":"rosa","en":"Do you need a bag?","choix":[["Voulez-vous un sac ?",null],["Avez-vous un sac ?","Do you HAVE, ce serait « avez-vous ». Need : en avez-vous besoin ?"],["Il vous faut payer le sac.","Elle demande seulement : do you need a bag ?"]]},{"type":"dire","fr":"Au restaurant, demandez l'addition.","choix":[["Could I have the bill, please?",null],["Could I have the note?","The note n'est pas l'addition au restaurant : « the bill »."],["Could I have the addition, please?","Addition, en anglais, c'est une somme ; l'addition du resto : « the bill »."]]},{"type":"dire","fr":"Vous avez une ampoule au pied. Dites que votre pied vous fait mal.","choix":[["My foot hurts.",null],["My foot makes me hurt.","C'est le calque de « mon pied me fait mal » : on dit « My foot hurts »."],["I have hurt at the foot.","C'est le calque de « j'ai mal au pied » : « My foot hurts »."]]}],"dire":[["Commandez un café moyen.","Can I get a medium coffee, please?",["~^((hi|hello|hey|excuse me|good morning|yes|um|uh|okay|ok|so) )*(just )?(a|one) [a-z ]{0,12}(tea|coffee)( |$)|give me|(^| )(can|could|may) (i|we)( please)? (get|have)|(can|could) you( please)? (give|get) (me|us)|(i|we) d like|(i|we)d like|(i|we) would like|(i|we) ll (have|take|get|go with)|(i|we) want|do you have|(^| )please( |$)","coffee"]],["Demandez s'ils ont une carte de la ville.","Do you have a map?",["~(do you have|have you got|can i (get|have)|could i (get|have)|is there)","map"]],["Dites que vous avez besoin d'une pharmacie.","I need a pharmacy.",["need","pharmacy|drugstore"]],["Dites que vous avez mal à la tête.","I have a headache.",["~(headache|head hurts|head is hurting)"]]]},{"id":"p6","titre":"Poser une question","obj":"P3","minutes":15,"intro":"Où, combien, à quelle heure, est-ce qu'il y a, comment je m'y rends : avec cinq débuts de question, on trouve presque tout dans une ville.","meca":["<b>Where is…?</b> où est… ? — <i>Where is the subway?</i>","<b>How much is…?</b> combien coûte… ? · <b>What time…?</b> à quelle heure… ?","<b>Is there a… near here?</b> y a-t-il un… près d'ici ? — <i>Is there a pharmacy near here?</i>","<b>How do I get to…?</b> comment je me rends à… ? — <i>How do I get to the CN Tower?</i>","<b>Does this… go to…?</b> est-ce que ce… va à… ? — <i>Does this streetcar go to Kensington?</i>"],"ecoute":[["Where is the subway?","Où est le métro ?"],["Where are the washrooms?","Où sont les toilettes ?"],["Is there a pharmacy near here?","Y a-t-il une pharmacie près d'ici ?"],["How much is a ticket?","Combien coûte un billet ?"],["What time is the last ferry?","À quelle heure est le dernier traversier ?"],["How do I get to the CN Tower?","Comment je me rends à la tour CN ?"],["Does this streetcar go to Kensington?","Ce tramway va-t-il à Kensington ?"],["Is breakfast included?","Le déjeuner est-il inclus ?"]],"mots":["subway","streetcar","ticket","pharmacy","tower","market","ferry","breakfast_incl","exit","bus_stop"],"quiz":[{"type":"dire","fr":"Demandez où sont les toilettes.","choix":[["Where are the washrooms?",null],["Where is the toilets?","Toilets est au pluriel : where ARE ; et au Canada, on dit washrooms."],["What are the washrooms?","What, c'est « quoi ». Où : where."]]},{"type":"dire","fr":"Demandez s'il y a une pharmacie près d'ici.","choix":[["Is there a pharmacy near here?",null],["Is it a pharmacy near here?","Ce serait « est-ce une pharmacie ? ». Pour « y a-t-il » : Is there…?"],["Is there a pharmacy near of here?","Near, sans of : near here."]]},{"type":"dire","fr":"Au tramway, demandez s'il va à Kensington.","choix":[["Does this streetcar go to Kensington?",null],["Does this streetcar goes to Kensington?","Après does, le verbe reste go."],["Is this streetcar go to Kensington?","Is ne va pas avec go : « Does this streetcar go to Kensington? »."]]},{"type":"dire","fr":"Demandez combien coûte un billet.","choix":[["How much is a ticket?",null],["How many is a ticket?","How many compte des choses ; pour un prix : how much."],["How is a ticket?","Ce serait « comment va le billet ? » : how MUCH."]]},{"type":"dire","fr":"Au café, vous voulez savoir si vous pouvez utiliser les toilettes.","choix":[["Is there a washroom I could use?",null],["Is it possible to use the washer?","A washer est une laveuse ; les toilettes : a washroom."],["Is there a washer I could use?","A washer est une laveuse. Les toilettes, au Canada : a washroom."]]},{"type":"dire","fr":"Demandez comment vous rendre à la tour CN.","choix":[["How do I get to the CN Tower?",null],["How do I get the CN Tower?","Sans « to », ce serait « comment j'obtiens la tour » ! « How do I get TO the CN Tower? »."],["Where do I go CN Tower?","Il manque des mots : « How do I get to the CN Tower? »."]]}],"dire":[["Demandez où est le métro.","Where is the subway?",["~(where|is there|how (do|can) (i|we) get to)","subway|ttc|metro|station"]],["Demandez s'il y a une pharmacie près d'ici.","Is there a pharmacy near here?",["is there|where","pharmacy|drugstore|drug store"]],["Demandez combien coûte un billet.","How much is a ticket?",["how much","ticket"]],["Demandez si le déjeuner est inclus.","Is breakfast included?",["breakfast","~(includ|come with|comes with)"]]]},{"id":"p7","titre":"Parler de soi, et relancer","obj":"P4","minutes":15,"intro":"À Toronto, on vous demandera d'où vous venez avant même de vous rendre la monnaie. Préparez vos trois phrases, et surtout la question qui relance : sans elle, la conversation s'arrête.","meca":["<b>I'm from…</b> pour l'origine : <i>I'm from Quebec</i>, <i>I'm from Montreal</i>.","<b>I'm here for…</b> pour la durée : <i>for a week</i>, <i>for the weekend</i>, <i>for three days</i>.","<b>I'm…</b> pour le métier : <i>I'm a nurse</i>, <i>I'm retired</i> (à la retraite). Attention : <i>a nurse</i>, avec « a ».","<b>It's my first time in Toronto</b> : c'est ma première fois.","<b>And you?</b> ou <b>How about you?</b> : la relance. Une réponse sans relance ferme la porte."],"ecoute":[["I'm from Quebec.","Je viens du Québec."],["I'm here for a week.","Je suis ici pour une semaine."],["It's my first time in Toronto.","C'est ma première fois à Toronto."],["I'm retired.","Je suis à la retraite."],["I'm a nurse.","Je suis infirmière."],["Where are you from?","D'où venez-vous ?"],["How about you?","Et vous ?"],["Nice to meet you!","Enchanté !"]],"mots":["where_from","from_quebec","how_long","first_time","what_do_you_do","and_you","nice_to_meet"],"quiz":[{"type":"rep","qui":"harper","en":"So, where are you from?","q":"Que répondez-vous ?","choix":[["I'm from Quebec. How about you?",null],["I'm Quebec. How about you?","Ce serait « je suis le Québec » : I'm FROM Quebec."],["Yes, I'm from. And you?","Il manque le lieu : I'm from Quebec."]]},{"type":"rep","qui":"harper","en":"How long are you here for?","choix":[["Combien de temps restez-vous ?",null],["Depuis quand êtes-vous ici ?","Depuis quand, ce serait « How long have you been here? ». Ici : combien de temps vous restez."],["Êtes-vous ici pour longtemps, au travail ?","Rien sur le travail : how long, combien de temps."]]},{"type":"dire","fr":"On vous demande ce que vous faites dans la vie. Vous êtes à la retraite.","choix":[["I'm retired.",null],["I'm retreat.","Retreat est une retraite fermée, spirituelle. À la retraite : retired."],["I do retirement.","On dit simplement « I'm retired »."]]},{"type":"rep","qui":"harper","en":"Is it your first time in Toronto?","choix":[["C'est votre première fois à Toronto ?",null],["C'est votre premier jour à Toronto ?","First day, ce serait le premier jour. First time : la première fois."],["Êtes-vous arrivé à temps à Toronto ?","Time, ici, c'est « fois »."]]},{"type":"dire","fr":"Vous venez de répondre d'où vous venez. Relancez la conversation.","choix":[["And you? Where are you from?",null],["And you? Where you are from?","L'ordre de la question : where ARE you from?"],["And you? From where you are?","La question se construit : Where are you from?"]]}],"dire":[["Dites d'où vous venez.","I'm from Quebec.",["~(^| )(i m|i am|im|we re|we are|i come|we come|i m coming|we re coming|coming) from [a-z]+|(^| )(i|we) live in (?!toronto)[a-z]+|(^| )from (quebec|montreal|canada|france)|(^| )i m (quebecois|quebecoise|french canadian)( |$)"]],["Dites combien de temps vous restez — par exemple, une semaine.","I'm here for a week.",["~^(?!.*(^| )(since|ago|depuis)( |$))(?!.*(^| )(i|we) (ve|have) been (here|in [a-z]+) (for|since)( |$)).*?(?:(^| )(for|until|till|leave|leaving|stay|staying|here|just|only|one|two|three|four|five|six|seven|eight|nine|ten|eleven|twelve|fourteen|couple)( (?!since|ago)[a-z]+){0,3} (week|weeks|weekend|day|days|night|nights|month|monday|tuesday|wednesday|thursday|friday|saturday|sunday)(?! ago)( |$)|(^| )a (week|weekend|few days)( |$))"]],["Dites que c'est votre première fois à Toronto.","It's my first time in Toronto.",["first time"]],["Présentez-vous en trois phrases : d'où vous venez, combien de temps vous restez, et relancez.","I'm from Quebec. I'm here for a week. How about you?",["~(^| )(i m|i am|im|we re|we are|i come|we come|i m coming|we re coming|coming) from [a-z]+|(^| )(i|we) live in (?!toronto)[a-z]+|(^| )from (quebec|montreal|canada|france)|(^| )i m (quebecois|quebecoise|french canadian)( |$)","~^(?!.*(^| )(since|ago|depuis)( |$))(?!.*(^| )(i|we) (ve|have) been (here|in [a-z]+) (for|since)( |$)).*?(?:(^| )(for|until|till|leave|leaving|stay|staying|here|just|only|one|two|three|four|five|six|seven|eight|nine|ten|eleven|twelve|fourteen|couple)( (?!since|ago)[a-z]+){0,3} (week|weeks|weekend|day|days|night|nights|month|monday|tuesday|wednesday|thursday|friday|saturday|sunday)(?! ago)( |$)|(^| )a (week|weekend|few days)( |$))","~(^| )(and you|and yourself|how about you|how about yourself|what about you|what about yourself|how are you|are you from|do you (live|work|like)|have you (ever )?been|what do you do|where do you live|what s your name)( |$)|^you$| you$"]]]},{"id":"p8","titre":"Comprendre la réponse","obj":"P5","minutes":15,"intro":"Le plus dur n'est pas de demander : c'est d'entendre la réponse, dite vite, parfois avec un accent. Le secret : guetter le mot qui décide, et laisser filer le reste.","meca":["<b>Sure</b>, <b>of course</b>, <b>absolutely</b> : oui. <b>Sorry, …</b> au début annonce souvent un non.","<b>We're out of…</b> : il n'en reste plus · <b>We're full</b> : c'est complet.","<b>On your left / on your right</b> : à votre gauche / droite · <b>right there</b> : juste là.","<b>It's not included</b> : ce n'est pas compris · <b>It comes with…</b> : c'est servi avec…","<b>You're all set!</b> : c'est réglé, vous pouvez y aller.","Le reste de la phrase peut vous échapper : ce mot-là, non."],"ecoute":[["Sure, no problem.","Oui, pas de problème."],["Sorry, we're out of muffins.","Désolé, il n'y a plus de muffins."],["Sorry, we're full tonight.","Désolé, c'est complet ce soir."],["It's on your left.","C'est à votre gauche."],["It's right there.","C'est juste là."],["Two blocks down, then right.","Deux coins de rue plus loin, puis à droite."],["Tax isn't included.","La taxe n'est pas comprise."],["Sorry, your card didn't go through.","Désolé, votre carte n'est pas passée."],["You're all set!","C'est réglé !"]],"mots":["left","right","straight","block","corner","north","south","anything_else","tax","line"],"quiz":[{"type":"rep","qui":"aarti","en":"Sorry, we're out of bagels, but we have muffins.","choix":[["Plus de bagels, mais il y a des muffins.",null],["Les bagels sont dehors, avec les muffins.","Out of ne veut pas dire dehors : il n'en reste plus."],["Plus de muffins, il reste des bagels.","C'est l'inverse : out of bagels, il reste des muffins."]]},{"type":"rep","qui":"liam","en":"Go two blocks north, it's on your left.","choix":[["Deux coins de rue vers le nord, à votre gauche.",null],["Deux rues à gauche, puis vers le nord.","On ne tourne pas : two blocks NORTH, puis c'est à gauche."],["Deux coins de rue vers le nord, à votre droite.","On your LEFT : à votre gauche."]]},{"type":"rep","qui":"ezinne","en":"Sorry, we're full tonight. Try the hotel across the street.","choix":[["C'est complet ; essayez l'hôtel d'en face.",null],["Il reste une chambre ce soir.","Full : complet. Sorry, au début, annonçait un non."],["C'est complet ; l'hôtel d'en face aussi.","Rien n'est dit de l'autre hôtel, sinon d'essayer."]]},{"type":"rep","qui":"andrew","en":"Your room isn't ready yet. It'll be ready at three.","choix":[["La chambre n'est pas prête ; elle le sera à 15 h.",null],["La chambre est prête depuis 15 h.","Isn't ready yet : pas encore prête."],["Vous devez partir à 15 h.","On parle de la chambre prête, pas du départ."]]},{"type":"rep","qui":"arjun","en":"The soup doesn't have any nuts.","choix":[["La soupe ne contient pas de noix.",null],["La soupe contient des noix.","Doesn't have : ne contient pas."],["Il n'y a plus de soupe.","La soupe existe ; ce sont les noix qui n'y sont pas."]]},{"type":"rep","qui":"andrew","en":"The museum is closed on Monday, but it's open late on Thursday.","choix":[["Fermé le lundi ; ouvert tard le jeudi.",null],["Fermé le lundi ; ouvert tard le mardi.","Thursday : jeudi. Mardi, ce serait Tuesday — écoutez le th."],["Fermé le dimanche ; ouvert tard le jeudi.","Monday : lundi. Dimanche, ce serait Sunday."],["Fermé le dimanche ; ouvert tard le mardi.","Monday, lundi ; et Thursday, jeudi : deux mots qui décident."]]},{"type":"rep","qui":"rosa","en":"Your room is ready, but the pool is closed today.","choix":[["Chambre prête ; piscine fermée aujourd'hui.",null],["Chambre pas prête ; piscine fermée aujourd'hui.","Your room IS ready : elle est prête."],["Chambre prête ; piscine ouverte aujourd'hui.","But the pool is closed : la   r.onerror = e => { if (e && e.error && e.error !== 'aborted' && e.error !== 'no-speech') micErreur = e.error; setTimeout(terminer, 300); };

/* La reconnaissance anglaise écrit les nombres en chiffres (« 2 coffees », « $13.50 »,
   « 10:30 ») : on les remet en lettres avant de comparer, comme preparation.py le fait. */
const UN = 'zero one two three four five six seven eight nine ten eleven twelve thirteen fourteen fifteen sixteen seventeen eighteen nineteen'.split(' ');
const DIZ = {2:'twenty',3:'thirty',4:'forty',5:'fifty',6:'sixty',7:'seventy',8:'eighty',9:'ninety'};
function nombreEn(n){ n = +n; if (n < 20) return UN[n]; if (n < 100) return DIZ[Math.floor(n / 10)] + (n % 10 ? ' ' + UN[n % 10] : ''); return String(n); }
const enLettres = t => String(t)
  .replace(/(\d{1,2}):(\d{2})/g, (_, h, m) => nombreEn(h) + (+m ? ' ' + nombreEn(m) : ''))
  .replace(/\$\s*(\d+)\.(\d{2})/g, (_, a, b) => nombreEn(a) + ' ' + nombreEn(b))
  .replace(/\d+/g, n => ' ' + nombreEn(n) + ' ');
const plat = t => enLettres(String(t).replace(/['’]/g, ' ')).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^a-z0-9 ]+/g, ' ').replace(/\s+/g, ' ').trim();
// Une clé qui commence par « ~ » est une expression régulière sur le texte aplati.
const trouve = (t, cle) => cle.startsWith('~') ? new RegExp(cle.slice(1)).test(plat(t)) : cle.split('|').some(a => new RegExp('(^| )' + plat(a).replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + '(s|es)?( |$)').test(plat(t)));
/* ---------- ordre des choix : jamais la bonne toujours au même rang ---------- */
// Audit tour 2 : une rotation garde l'ordre cyclique (la bonne précède toujours le leurre). Mélange à graine stable.
function ordre(n, g){ const o = [...Array(n).keys()]; g = g + 1; for (let i = n - 1; i > 0; i--) { g = (g * 16807) % 2147483647; const j = g % (i + 1); [o[i], o[j]] = [o[j], o[i]]; } return o; }

    $('#modele').onclick = montrer;
    $('#suite').onclick = () => { n++; tour(); };
    $('#passer').onclick = () => { n++; tour(); };
    $('#dit').onclick = () => { essaye(); montrer(); };
    if (Reco) $('#mic').onclick = () => {
      const mic = $('#mic'); if (recoActive) { arreterMicro(); return; }
      mic.classList.add('ecoute'); mic.innerHTML = ICO.stop; $('#micEtat').textContent = 'Je vous écoute… touchez pour arrêter.';
      ecouterMicro(t => { $('#entendu').textContent = '« ' + t + ' »'; }, final => {
        mic.classList.remove('ecoute'); mic.innerHTML = ICO.micro; $('#micEtat').textContent = 'Touchez le micro pour réessayer.';
        if (!final) { poserR(`<div class="retro info">${rienEntendu('Je n’ai rien entendu. Vérifiez que le micro est permis, ou dites-le et touchez « C’est dit ! ».')}</div>`); return; }
        essais++;
        const manque = cles.filter(c => !trouve(final, c));
        if (!manque.length) { if (essais <= 2 && !modeleVu) comprises++;
          poserR(`<div class="retro ok">✓ Well done! On vous a compris.</div>`); essaye(); setTimeout(montrer, 600); return; }
        const presque = manque.length <= cles.length / 2;
        poserR(`<div class="retro no">${presque ? `Presque. Il manque : <b lang="en">${manque.map(c => E(motDuModele(en, c))).join(', ')}</b>. ` : 'Je n’ai pas reconnu la phrase. '}${essais < 2 && !modeleVu ? 'Réessayez, sans regarder le modèle.' : 'Comparez avec le modèle.'}</div>`);
        essaye();
        if (essais >= 2) montrer(); else $('#modele').disabled = false;
      });
    };
  }
  tour();
}
function vuePrepTest(){
  const T = S.prep.test || (S.prep.test = {});
  const f = T.prochaine != null ? T.prochaine : Math.floor(Math.random() * 2);
  const items = D.prep.test[f]; let k = 0; const res = {}, nonVerif = {}, manquees = {};
  function intro(){
    app.innerHTML = `${retour('accueil', 'Accueil')}<p class="surtitre">Le test de la maison</p><h1>Prêt à partir ?</h1>
      <p>${items.length} questions, un quart d'heure, avec le son et le micro. Pour chacun des cinq objectifs, quelques questions — des phrases
      nouvelles : les mêmes outils que dans les séances, d'autres mots.</p>
      <div class="regle"><b>Comme à Toronto.</b> Les phrases qu'on vous dit ne s'écoutent <b>qu'une fois</b>, au débit normal. Au micro, <b>deux essais</b>.
      ${E(D.prep.seuil.replace(" Au micro, deux essais au plus ; les phrases entendues ne s'écoutent qu'une fois.", ''))} C'est un repère, pas une note : il ne vous empêche de rien.</div>
      ${Reco ? '' : '<div class="sans-son">Ce navigateur ne reconnaît pas la voix : ouvrez la page dans Chrome ou Safari pour mesurer l’oral. Sans cela, les questions au micro ne compteront pas.</div>'}
      <button class="btn btn--pri btn--large" id="go">Commencer</button>`;
    // Tour 3 : la forme suivante est fixée dès le départ — un test abandonné ne retombe pas sur la même.
    // Tour 5 : une forme vue, même abandonnée, est « revue » au passage suivant.
    $('#go').onclick = () => { T.prochaine = 1 - f; T.vues = T.vues || {}; T.revu = !!T.vues[f]; T.vues[f] = true; sauver(); tour(); };
  }
  function tour(){
    if (k >= items.length) return bilan();
    const it = items[k]; let compte = false;
    const noter = ok => { if (compte) return; compte = true; const r = res[it.obj] || (res[it.obj] = [0, 0]); r[1]++; if (ok) r[0]++;
      else (manquees[it.obj] || (manquees[it.obj] = [])).push(it.en || it.modele || it.choix[0][0]); };
    const suite = () => { const b = document.createElement('button'); b.className = 'btn btn--pri btn--large'; b.textContent = 'Suivant'; b.onclick = () => { k++; tour(); }; $('#r').appendChild(b); };
    const tete2 = `${retour('accueil', 'Accueil')}<p class="surtitre">Question ${k + 1} sur ${items.length}</p><div class="progres"><i style="width:${100 * k / items.length}%"></i></div>`;
    if (it.type === 'oral') {
      // Audit tour 1 (M3) : la présentation se compte par parties (2 sur 3 = en route), pas tout ou rien.
      let prises = 0, bons = 0;
      app.innerHTML = `${tete2}<h1>Dites-le</h1><div class="carte"><p style="font-size:18px;font-weight:800;margin:0">${E(it.fr)}</p></div>
        ${Reco ? `<div class="micro"><button class="btn-micro" id="mic" aria-label="Parler">${ICO.micro}</button><div class="muted" id="micEtat" style="font-size:14px">Deux essais.</div><div class="entendu" id="entendu"></div></div>` : ''}
        <div id="r" aria-live="polite"></div><button class="btn btn--large" id="sansmic" style="margin-top:8px">${Reco ? 'Sans micro : c’est dit !' : 'C’est dit !'}</button>`;
      const fin = (ok, verifie) => {
        if (verifie && it.parties) { compte = true; const r = res[it.obj] || (res[it.obj] = [0, 0]); r[0] += ok ? it.cles.length : bons; r[1] += it.cles.length;
          if (!ok) (manquees[it.obj] || (manquees[it.obj] = [])).push(it.modele); }
        else if (verifie) noter(ok); else { compte = true; nonVerif[it.obj] = (nonVerif[it.obj] || 0) + 1; }
        if ($('#sansmic')) $('#sansmic').remove(); if ($('#mic')) $('#mic').disabled = true;
        $('#r').insertAdjacentHTML('beforeend', `<div class="retro ${!verifie ? 'info' : ok ? 'ok' : 'no'}">${!verifie ? 'Non vérifié : sans le micro, cet objectif ne pourra pas être « Solide ».' : ok ? '✓ On vous a compris.' : 'Deux essais sans qu’on vous comprenne tout à fait.'}</div>
          <div class="retro info"><span class="surtitre">Le modèle</span><div class="phrase-en" lang="en">${E(it.modele)}</div></div>`);
        jouer(`prep/test/${f}-${k}-m.mp3`); suite(); };
      $('#sansmic').onclick = () => fin(false, false);
      if (Reco) $('#mic').onclick = () => { const mic = $('#mic'); if (recoActive) { arreterMicro(); return; }
        mic.classList.add('ecoute'); mic.innerHTML = ICO.stop;
        ecouterMicro(t => { $('#entendu').textContent = '« ' + t + ' »'; }, final => {
          mic.classList.remove('ecoute'); mic.innerHTML = ICO.micro;
          if (!final) { $('#r').innerHTML = `<div class="retro info">${rienEntendu($('#sansmic') ? 'Je n’ai rien entendu. Vérifiez que le micro est permis et réessayez — ou touchez « Sans micro : c’est dit ! ».' : 'Je n’ai rien entendu. Vérifiez que le micro est permis et réessayez.')}</div>`; return; }
          const manque = it.cles.map((c, i) => [c, i]).filter(([c]) => !trouve(final, c));
          prises++; bons = Math.max(bons, it.cles.length - manque.length);
          // Une fois le micro entendu, « sans micro » n'est plus une issue (Compostelle, tour 2, F1).
          if ($('#sansmic')) $('#sansmic').remove();
          if (!manque.length) { $('#r').innerHTML = ''; return fin(true, true); }
          const quoi = it.parties ? 'Il manque : ' + manque.map(([, i]) => E(it.parties[i])).join(', ') + '.' : `J'ai entendu « ${E(final)} ».`;
          if (prises >= 2) { $('#r').innerHTML = `<div class="retro no">${quoi}</div>`; return fin(false, true); }
          $('#r').innerHTML = `<div class="retro no">${quoi} Réessayez (dernier essai).</div>`;
        }); };
      return;
    }
    // Au test, le premier choix compte. P2 et P5 : une seule écoute, au débit naturel.
    const fichier = `prep/test/${f}-${k}` + (it.type === 'dire' ? '-c0' : '') + '.mp3';
    const unefois = it.obj === 'P2' || it.obj === 'P5';
    // Tour 4 : un tirage indépendant à chaque affichage. Une graine fixe mettait la bonne au même bouton
    // (tour 3) ; une permutation posée dans les données se déduisait des places déjà montrées (tour 4).
    const o = ordre(it.choix.length, Math.floor(Math.random() * 9973)).filter(i => i !== 0);
    o.splice(Math.floor(Math.random() * it.choix.length), 0, 0);
    const estEn = it.type !== 'rep', p = it.qui ? D.perso[it.qui] : null;
    const titre = it.type === 'rep' ? 'Que veut dire la phrase ?' : it.type === 'mot' ? 'Quel mot entendez-vous ?' : 'Que dites-vous ?';
    app.innerHTML = `${tete2}<h1>${titre}</h1>
      ${it.type === 'dire' ? `<div class="carte"><p style="font-size:18px;font-weight:800;margin:0">${E(it.fr)}</p></div>` :
        `${p ? `<div class="scene-tete"><div><b>${E(p.nom)}</b><div class="muted" style="font-size:14px">${unefois ? 'Une seule écoute, comme au comptoir : touchez le haut-parleur quand vous êtes prêt.' : 'Vous pouvez réécouter.'}</div></div></div>` : ''}
         <div class="gros-son"><button class="btn btn--son" aria-label="Écouter" id="ecoute1">${ICO.son}</button></div>`}
      <div class="choix">${o.map(i => `<button data-i="${i}" ${estEn ? 'lang="en"' : ''}>${E(it.choix[i][0])}</button>`).join('')}</div><div id="r" aria-live="polite"></div>`;
    if (it.type !== 'dire') {
      let joue = false;
      // Une seule écoute : elle part au toucher, jamais toute seule (Compostelle, 27 sept. 2026).
      const une = () => { if (unefois && joue) return; if (unefois) { joue = true; $('#ecoute1').disabled = true; }
        jouer(fichier, unefois).then(ok => { if (!ok && unefois) { joue = false; $('#ecoute1').disabled = false; } }); };
      $('#ecoute1').onclick = une; if (!unefois) setTimeout(une, 250);
    }
    app.querySelectorAll('.choix button').forEach(b => b.onclick = () => {
      if (compte) return; const i = +b.dataset.i; noter(i === 0);
      b.classList.add(i === 0 ? 'juste' : 'faux'); if (i !== 0) app.querySelector('.choix button[data-i="0"]').classList.add('juste');
      $('#r').innerHTML = `<div class="retro ${i === 0 ? 'ok' : 'no'}">${i === 0 ? '✓' + (it.en ? ' « ' + E(it.en) + ' »' : '') : E(it.choix[i][1]) + (it.en ? ' « ' + E(it.en) + ' »' : '')}</div>`;
      if ($('#ecoute1')) { $('#ecoute1').disabled = false; $('#ecoute1').onclick = () => jouer(fichier); }
      if (it.type === 'dire') jouer(fichier); suite();
    });
  }
  function bilan(){
    // Tour 4 : deux formes seulement ; dès le 3e passage, on a déjà vu les réponses de la forme.
    const revu = !!T.revu;
    let solides = 0;
    const lignes = Object.keys(D.prep.objectifs).map(o => {
      const [ok, tot] = res[o] || [0, 0], nv = nonVerif[o] || 0, lieu = LIEUX[D.prep.lieu[o]];
      if (!tot) return `<div class="carte" style="margin:8px 0"><b>${E(D.prep.objectifs[o])}</b><div class="retro info" style="margin:6px 0">Non vérifié au micro : refaites ces questions avec le micro.</div><p class="muted" style="margin:0;font-size:15px">${E(D.prep.conseils[o])}</p></div>`;
      // Audit tour 2 : une question passée sans micro empêche « Solide » (sinon on saute l'item difficile).
      const r = ok / tot, solideIci = r >= D.prep.solide && !nv; if (solideIci) solides++;
      const etat = solideIci ? ['ok', '✓ Solide'] : r >= .5 ? ['info', '→ En route'] : ['no', '— À reprendre'];
      return `<div class="carte" style="margin:8px 0"><b>${E(D.prep.objectifs[o])}</b><div class="retro ${etat[0]}" style="margin:6px 0">${etat[1]} — ${ok} sur ${tot}${nv ? ` (et ${nv} non vérifiée${nv > 1 ? 's' : ''} au micro)` : ''}</div>
        ${!solideIci ? `<p class="muted" style="margin:0;font-size:15px">${E(D.prep.conseils[o])}</p>` : ''}
        ${(manquees[o] || []).length ? `<p class="muted" style="margin:4px 0 0;font-size:14px">À revoir : ${manquees[o].map(t => '<i lang="en">' + E(t) + '</i>').join(' · ')}</p>` : ''}
        ${lieu ? `<p class="muted" style="margin:4px 0 0;font-size:14px">Vous en aurez besoin ${E(lieu)}.</p>` : ''}</div>`;
    }).join('');
    T.prochaine = 1 - f; T.passages = (T.passages || 0) + 1; T.dernier = aujourdhui(); sauver();
    const tous = solides === Object.keys(D.prep.objectifs).length;
    app.innerHTML = `${retour('accueil', 'Accueil')}<h1>Où vous en êtes</h1>
      <p>Un repère sur un échantillon, pas une note. La prochaine fois — la veille du départ, par exemple — ce sera l'autre forme.</p>
      ${tous ? (revu ? '<div class="retro info">Vous connaissiez déjà ces questions : ce résultat dit surtout que vous vous en souvenez. Pour vous situer pour vrai, faites une séance que vous n’avez pas faite.</div>' : '<div class="retro ok">✓ Solide partout : vous pouvez sauter les séances, ou n’y revenir que pour vous rafraîchir la mémoire.</div>') : ''}${lignes}
      <button class="btn btn--pri btn--large" onclick="aller('prep')">${tous ? 'Ma valise' : 'Aux séances'}</button>`;
  }
  intro();
}

/* ---------- réglages ---------- */
function vueReglages(){
  app.innerHTML = `${retour('accueil', 'Accueil')}<h1>Réglages</h1>
    <label class="aide-bascule"><input type="checkbox" id="lent" ${S.lent ? 'checked' : ''}> Les voix plus lentes (sauf au test)</label>
    <label class="aide-bascule"><input type="checkbox" id="aide" ${S.aide ? 'checked' : ''}> Montrer le sens en français dès l'arrivée</label>
    <p class="muted" style="font-size:14.5px">Votre progression reste dans ce téléphone : rien n'est envoyé.</p>
    <button class="btn" id="raz">Tout recommencer</button>`;
  $('#lent').onchange = e => { S.lent = e.target.checked; sauver(); };
  $('#aide').onchange = e => { S.aide = e.target.checked; sauver(); };
  $('#raz').onclick = () => { if (confirm('Effacer votre progression dans ce téléphone ?')) { S = {lent:false, aide:false, prep:{}}; sauver(); aller('accueil'); } };
}

// Le contrôle par programme (leçon de Compostelle : jouer chaque temps trouve ce qu'aucune relecture ne voit).
window.__toronto = {D, S: () => S, trouve, plat, extraits: () => D.sons,
  controle: () => [...D.controle.refus.filter(([c, t]) => trouve(t, c)).map(([, t]) => 'accepte à tort : ' + t),
                   ...D.controle.accepte.filter(([c, t]) => !trouve(t, c)).map(([, t]) => 'refuse à tort : ' + t)]};
rendre();
</script>
