],["Son cuatro con cincuenta.",[["C'est 4,50 €.",null],["C'est 14,50 €.","Cuatro = 4. Catorce = 14."],["C'est 4,15 €.","Cincuenta = 50. Quince = 15."]]],["Lo siento, la tortilla se acaba de terminar.",[["Désolée, il n'y a plus de tortilla.",null],["Désolée, la tortilla vient d'être faite.","« Se acaba de terminar » : elle vient d'être finie, il n'y en a plus."],["Désolée, la tortilla sera prête à la fin.","Acabar de + verbe = venir de. Terminar = finir."]]],["¿El café, con leche fría o caliente?",[["Le café, avec du lait froid ou chaud ?",null],["Le café, avec ou sans sucre ?","Leche = lait. Le sucre, c'est el azúcar."],["Le café, petit ou grand ?","Fría = froide ; caliente = chaude. Grand se dirait grande."]]],["Este bocadillo es de jamón, no lleva frutos secos.",[["Ce sandwich est au jambon ; il ne contient pas de noix.",null],["Ce sandwich est au jambon ; il contient des noix.","« No lleva » : il n'en contient pas. Si vous êtes allergique aux noix, vous pouvez le manger."],["Ce sandwich est au fromage ; il ne contient pas de noix.","Jamón = jambon. Le fromage : queso."]]]],"dire":[["Vous commandez un café au lait et une rôtie.","Un café con leche y una tostada, por favor.",["café","leche","tostada"]],["Vous demandez l'addition.","La cuenta, por favor.",["cuenta"]],["Vous demandez si on peut payer par carte.","¿Puedo pagar con tarjeta?",["pagar","tarjeta"]],["Vous demandez où sont les toilettes.","Perdone, ¿dónde está el baño?",["dónde|donde","baño|servicio|aseo"]]],"scene":{"titre":"Au comptoir, à 7 h du matin","qui":"ainhoa","tours":[{"dit":"ainhoa","es":"¡Buenos días! ¿Qué te pongo?","fr":"Bonjour ! Qu'est-ce que je te sers ?"},{"choix":[["Un café con leche y una tostada, por favor.","Un café au lait et une rôtie, s'il vous plaît.",null],["Un café con leche y la carta, por favor.","Un café au lait et le menu, s'il vous plaît.","Pour un café et une rôtie, pas besoin de la carta (le menu). Commandez directement."],["Una caña y una tostada, por favor.","Une bière en fût et une rôtie, s'il vous plaît.","Una caña, c'est une petite bière… À 7 h du matin, le café est plus sage."]]},{"dit":"ainhoa","es":"¿La tostada, con tomate o con mantequilla y mermelada?","fr":"La rôtie, avec de la tomate ou avec du beurre et de la confiture ?"},{"choix":[["Con mantequilla y mermelada.","Avec du beurre et de la confiture.",null],["Con burro y mermelada.","Avec un âne et de la confiture.","Burro, c'est un âne ! Le beurre : la mantequilla."],["Con tomate y con mermelada.","Avec de la tomate et de la confiture.","Elle propose l'un OU l'autre : tomate, ou beurre et confiture. Pas les deux."]]},{"dit":"ainhoa","es":"Muy bien. ¿Para tomar aquí o para llevar?","fr":"Très bien. Pour prendre ici ou pour emporter ?"},{"choix":[["Para tomar aquí, gracias.","Pour prendre ici, merci.",null],["Para llevar aquí, gracias.","Pour emporter ici, merci.","Para llevar = pour emporter. Pour rester : para tomar aquí."],["Para tomar el sol, gracias.","Pour prendre le soleil, merci.","Tomar el sol, c'est se faire bronzer…"]]},{"dit":"ainhoa","es":"Aquí tienes. Son cuatro con cincuenta.","fr":"Voilà. C'est 4,50 €."},{"choix":[["¿Puedo pagar con tarjeta?","Je peux payer par carte ?",null],["¿Catorce con cincuenta?","14,50 € ?","Elle a dit cuatro (4), pas catorce (14)."],["¿Puedo pagar con carta?","Je peux payer avec le menu ?","La carta, c'est le menu. La carte de paiement : la tarjeta."]]},{"dit":"ainhoa","es":"Claro, acerca la tarjeta aquí. ¡Que aproveche, y buen Camino!","fr":"Bien sûr, approche la carte ici. Bon appétit, et bon chemin !"},{"choix":[["¡Muchas gracias! ¡Hasta luego!","Merci beaucoup ! À plus tard !",null],["¡De nada! ¡Hasta luego!","De rien ! À plus tard !","« De nada » répond à un merci. Ici, remerciez : gracias."],["¡Igualmente! ¡Que aproveche!","Pareillement ! Bon appétit !","C'est vous qui mangez : on répond simplement « gracias »."]]}]},"soir":{"titre":"Pintxos dans le vieux quartier","tours":[{"dit":"marta","emo":"excited","es":"¡Vamos de pintxos! En Pamplona es obligatorio. ¿Te gustan los pimientos?","fr":"On va manger des pintxos ! À Pamplona, c'est obligatoire. Tu aimes les poivrons ?"},{"choix":[["Sí, me gustan mucho.","Oui, je les aime beaucoup.",null],["Sí, me gusto mucho.","Oui, je m'aime beaucoup.","Avec gustar, c'est la chose qui plaît qui décide : me gustan (los pimientos)."],["Sí, les gustan mucho.","Oui, ils leur plaisent beaucoup.","Pour vous : ME gustan. Les gustan = ils leur plaisent."]]},{"dit":"marta","emo":"friendlycheerful","es":"Prueba este de txistorra. Es una salchicha de aquí, de Navarra.","fr":"Goûte celui-ci, à la txistorra. C'est une saucisse d'ici, de Navarre."},{"choix":[["¡Qué rico! ¿Cómo se llama otra vez?","Que c'est bon ! Comment ça s'appelle, déjà ?",null],["¡Qué rico! ¿Cuánto se llama otra vez?","Que c'est bon ! Combien ça s'appelle, déjà ?","Cómo = comment. Cuánto = combien."],["¡Qué rico! ¿Cómo te llamas otra vez?","Que c'est bon ! Comment tu t'appelles, déjà ?","Te llamas, c'est Marta elle-même ! Pour le plat : ¿cómo se llama?"]]},{"dit":"marta","emo":"curious","es":"Txis-to-rra. Oye, ¿y mañana hasta dónde vas?","fr":"Txis-to-rra. Dis donc, et demain, tu vas jusqu'où ?"},{"choix":[["Hasta Puente la Reina, creo.","Jusqu'à Puente la Reina, je crois.",null],["Desde Puente la Reina, creo.","Depuis Puente la Reina, je crois.","Desde = depuis. Hasta = jusqu'à."],["Hasta mañana, creo que sí.","À demain, je crois que oui.","Elle demande jusqu'où : un lieu, pas un moment."]]},{"dit":"marta","emo":"excited","es":"¡Yo también! Así caminamos junt{os|as} un rato. ¿A qué hora sales?","fr":"Moi aussi ! Comme ça, on marche ensemble un bout. Tu pars à quelle heure ?"},{"choix":[["A las siete, más o menos.","Vers 7 h, à peu près.",null],["A las siete de la tarde.","À 7 h du soir.","Personne ne part marcher à 19 h ! Le matin : a las siete de la mañana."],["Salgo con la siesta.","Je pars avec la sieste.","La siesta, c'est le repos du début d'après-midi. On part tôt, pas pendant la sieste."]]}]},"vignette":true},{"id":"puente-la-reina","objectif":"Demander son chemin, faire ralentir, et suivre l'indication même dite vite.","n":3,"lieu":"Puente la Reina","km":92,"region":"Navarra","img":"puente-la-reina","titre":"Perdu à la sortie du village","intro":["Puente la Reina doit son nom à son pont roman, bâti pour les pèlerins il y a près de mille ans : six arches sur la rivière Arga.","Juste avant la ville, le chemin qui vient de France par l'Aragon rejoint le nôtre. À partir d'ici, il n'y a plus qu'un seul Camino francés.","Le lendemain, après Estella, la bodega d'Irache, au pied du monastère, offre aux pèlerins une fontaine… à vin. Une gorgée, pas une gourde !"],"voir":[["el puente románico","le pont roman"],["la iglesia del Crucifijo","l'église du Crucifix"],["la fuente del vino de Irache","la fontaine à vin d'Irache"]],"mots":["flecha","mojon","cruce","izquierda","derecha","recto","puente","salida","subida","pueblo","fuente"],"local":"fermin","ecoute":[["Siga todo recto hasta la iglesia y luego a la izquierda.",[["Tout droit jusqu'à l'église, puis à gauche.",null],["Tout droit jusqu'à l'église, puis à droite.","Izquierda = gauche ; derecha = droite."],["À gauche jusqu'à l'église, puis tout droit.","L'ordre : d'abord todo recto, luego (ensuite) a la izquierda."]]],["No tiene pérdida, está a cinco minutos.",[["Vous ne pouvez pas le manquer, c'est à cinq minutes.",null],["Vous êtes perdu, c'est à cinq minutes.","« No tiene pérdida » : impossible de se perdre."],["Il n'y a rien à perdre, c'est à quinze minutes.","Cinco = 5. Quince = 15."]]],["Cuando vea la fuente, cruce el puente.",[["Quand vous verrez la fontaine, traversez le pont.",null],["Quand vous verrez le pont, traversez la fontaine.","Écoutez l'ordre : cuando vea la fuente (la fontaine), cruce el puente (le pont)."],["Quand vous verrez la fontaine, buvez.","Cruzar = traverser. Beber = boire."]]],["Hay una flecha pintada en la pared, a mano derecha.",[["Il y a une flèche peinte sur le mur, sur votre droite.",null],["Il y a une flèche peinte sur la main droite.","« A mano derecha » veut dire : du côté droit."],["Il y a une flèche peinte sur le mur, sur votre gauche.","Derecha = droite."]]]],"dire":[["Vous abordez un habitant poliment.","Perdone, señor.",["perdone|perdón|disculpe"]],["Vous demandez où est le chemin.","¿Dónde está el Camino?",["dónde|donde","camino"]],["Vous demandez de parler plus lentement.","Más despacio, por favor.",["despacio"]],["Vous vérifiez : à droite ?","¿A la derecha?",["derecha"]]],"scene":{"titre":"Sur la place, un vieil homme sur un banc","qui":"fermin","tours":[{"dit":"fermin","es":"¡Buenos días! ¿Se ha perdido, peregrin{o|a}? Aquí se pierden todos, ¿eh?","fr":"Bonjour ! Vous êtes perdu, pèlerin ? Ici, tout le monde se perd, hein !"},{"choix":[["Sí, perdone. ¿Dónde está el Camino?","Oui, pardon. Où est le chemin ?",null],["Sí, perdone. ¿Dónde está la cena?","Oui, pardon. Où est le souper ?","Vous cherchez le chemin : el Camino."],["No, gracias. ¿Dónde está el Camino?","Non, merci. Où est le chemin ?","Il vous demande si vous êtes perdu… et vous l'êtes : dites sí."]]},{"dit":"fermin","es":"Mire, siga todo recto hasta la iglesia, luego a la izquierda, cruce el puente, y a la derecha verá una flecha en la pared.","fr":"Regardez : continuez tout droit jusqu'à l'église, ensuite à gauche, traversez le pont, et à droite vous verrez une flèche sur le mur."},{"choix":[["Más despacio, por favor. No entiendo.","Plus lentement, s'il vous plaît. Je ne comprends pas.",null],["Más deprisa, por favor. No entiendo.","Plus vite, s'il vous plaît. Je ne comprends pas.","Deprisa = vite. Pour qu'il ralentisse : más despacio."],["Más despacio, por favor. No entiende.","Plus lentement, s'il vous plaît. Il ne comprend pas.","No entiende = il (ou vous) ne comprend pas. Pour vous : no entiendo."]]},{"dit":"fermin","es":"Ay, perdone. Todo recto. Hasta la iglesia. Luego, a la izquierda.","fr":"Oh, pardon. Tout droit. Jusqu'à l'église. Ensuite, à gauche."},{"choix":[["Todo recto y luego a la izquierda. ¿Y después?","Tout droit, puis à gauche. Et après ?",null],["Todo recto y luego a la derecha. ¿Y después?","Tout droit, puis à droite. Et après ?","Il a dit a la izquierda : à gauche."],["A la izquierda y luego recto. ¿Y después?","À gauche, puis tout droit. Et après ?","L'ordre compte : d'abord tout droit jusqu'à l'église, ensuite à gauche."]]},{"dit":"fermin","es":"Después cruce el puente, el grande, el románico. Y a mano derecha, la flecha amarilla. No tiene pérdida.","fr":"Après, vous traversez le pont, le grand, le roman. Et sur votre droite, la flèche jaune. Impossible de la manquer."},{"choix":[["¡Muchísimas gracias, señor! Muy amable.","Merci mille fois, monsieur ! Vous êtes très aimable.",null],["¡Muchísimas gracias, señor! Muy amarillo.","Merci mille fois, monsieur ! Très jaune.","Amarillo = jaune. Aimable : amable."],["¡Muchísimas gracias, señor! Lo siento.","Merci mille fois, monsieur ! Je suis désolé.","Lo siento sert à s'excuser. Pour remercier chaleureusement : muy amable."]]},{"dit":"fermin","es":"De nada, hombre. ¡Y buen Camino! Y no beba mucho en Irache, ¿eh?","fr":"De rien, voyons. Et bon chemin ! Et ne buvez pas trop à Irache, hein !"}]},"soir":{"titre":"Le lendemain, à la fontaine à vin d'Irache","tours":[{"dit":"marta","emo":"excited","es":"¡Mira, la fuente del vino! De un lado sale agua y del otro, vino. ¿Quieres probar?","fr":"Regarde, la fontaine à vin ! D'un côté sort de l'eau, de l'autre, du vin. Tu veux goûter ?"},{"libre":true,"choix":[["¡Sí, un poquito!","Oui, un tout petit peu !",null],["No, gracias, prefiero agua.","Non merci, je préfère l'eau.",null],["Solo para la foto.","Seulement pour la photo.",null]]},{"dit":"marta","emo":"friendlycheerful","es":"¡Ja, ja! ¿Y en Quebec qué se bebe? ¿Vino también?","fr":"Ha, ha ! Et au Québec, qu'est-ce qu'on boit ? Du vin aussi ?"},{"choix":[["Sobre todo cerveza, y también vino.","Surtout de la bière, et aussi du vin.",null],["Sobre todo cerveza, y tampoco vino.","Surtout de la bière, et non plus du vin.","Tampoco ne s'emploie que dans une phrase négative. Pour ajouter : también."],["Sobre todo cerveza, pero sin agua.","Surtout de la bière, mais sans eau.","La phrase ne dit plus rien du vin : c'était la question."]]},{"dit":"marta","emo":"curious","es":"¿Y hace mucho frío allí en invierno? He oído que muchísimo.","fr":"Et il fait très froid là-bas en hiver ? J'ai entendu dire que oui, énormément."},{"choix":[["Sí, mucho. A veces menos treinta grados.","Oui, beaucoup. Parfois moins trente degrés.",null],["Sí, mucho. A veces más treinta grados.","Oui, beaucoup. Parfois plus trente degrés.","Más treinta, c'est +30 ! Le grand froid se dit menos treinta (ou treinta bajo cero)."],["Sí, mucha. A veces menos treinta grados.","Oui, beaucoup (fém.). Parfois moins trente degrés.","Mucho s'accorde avec el frío : sí, mucho."]]},{"dit":"marta","emo":"friendlycheerful","es":"¡Madre mía! Aquí nos quejamos con cinco grados. Venga, que se hace tarde.","fr":"Ma parole ! Ici, on se plaint à cinq degrés. Allez, il se fait tard."},{"choix":[["¡Vamos! Hasta luego, fuente.","Allons-y ! Au revoir, fontaine.",null],["¡Vamos! Hasta luego, puente.","Allons-y ! Au revoir, pont.","Fuente = fontaine ; puente = pont. Les deux se ressemblent : écoutez le f et le p."],["¡Vamos! Hasta luego, suerte.","Allons-y ! Au revoir, chance.","Suerte = la chance (¡Suerte! = bonne chance). La fontaine : la fuente."]]}]},"vignette":true},{"id":"logrono","objectif":"Dire où l'on a mal, et comprendre comment prendre le médicament.","n":4,"lieu":"Logroño","km":163,"region":"La Rioja","img":"rioja","titre":"La pharmacie","intro":["On quitte la Navarre pour La Rioja, le pays du vin : des vignes jusqu'à l'horizon, sur une terre rouge.","À Logroño, la rue Laurel aligne des dizaines de petits bars ; chacun a sa spécialité, des champignons grillés aux brochettes.","Après une semaine de marche, c'est aussi l'endroit où beaucoup de pèlerins découvrent la pharmacie espagnole — et sa croix verte."],"voir":[["la calle Laurel","la rue Laurel (des bars à tapas)"],["las viñas de La Rioja","les vignes de La Rioja"],["la concatedral de la Redonda","la cocathédrale de la Redonda"]],"mots":["farmacia","ampolla","pie","rodilla","tobillo","tirita","aguja","crema","ibuprofeno","me_duele","tendinitis","constipado"],"local":"pilar","ecoute":[["Ponga una tirita especial para ampollas y no la quite en tres días.",[["Mettez un pansement pour ampoules et ne l'enlevez pas avant trois jours.",null],["Mettez un pansement pour ampoules et enlevez-le après trois heures.","Días = jours. Heures se dirait horas."],["Mettez une crème sur les ampoules trois fois par jour.","Una tirita, c'est un pansement ; la crème, c'est la crema."]]],["Tómese una pastilla cada ocho horas, siempre después de las comidas.",[["Un comprimé toutes les huit heures, toujours après avoir mangé.",null],["Un comprimé toutes les huit heures, toujours avant de manger.","Después = après ; antes = avant."],["Huit comprimés par jour, après les repas.","Cada ocho horas : toutes les huit heures, un seul à la fois."]]],["Si mañana le sigue doliendo, vaya al centro de salud.",[["Si ça fait encore mal demain, allez à la clinique.",null],["Si ça fait encore mal ce matin, allez à la clinique.","Mañana, seul, veut dire demain."],["Si demain vous allez mieux, allez à la clinique.","« Le sigue doliendo » : ça continue de vous faire mal."]]],["Hoy descanse, no camine más de diez kilómetros.",[["Aujourd'hui, reposez-vous : pas plus de dix kilomètres.",null],["Aujourd'hui, marchez au moins dix kilomètres.","« No camine más de » : ne marchez pas plus de…"],["Aujourd'hui, reposez-vous : pas plus de douze kilomètres.","Diez = 10. Doce = 12."]]]],"dire":[["Vous dites que vous avez une ampoule au pied.","Tengo una ampolla en el pie.",["ampolla","pie"]],["Vous dites que vous avez mal au genou.","Me duele la rodilla.",["duele","rodilla"]],["Vous demandez quelque chose contre la douleur.","¿Tiene algo para el dolor?",["algo","dolor"]],["Vous demandez combien de fois par jour.","¿Cuántas veces al día?",["cuántas|cuantas","veces","día|dia"]],["On vous demande ce que vous faites dans la vie : répondez pour vous.","Estoy jubilad{o|a}.",["soy|estoy|trabajo"]]],"scene":{"titre":"Derrière la croix verte","qui":"pilar","tours":[{"dit":"pilar","es":"Buenas tardes. ¿Qué le pasa?","fr":"Bonjour. Qu'est-ce qui vous arrive ?"},{"choix":[["Tengo una ampolla muy grande en el pie.","J'ai une très grosse ampoule au pied.",null],["Tengo una bombilla muy grande en el pie.","J'ai une très grosse ampoule électrique au pied.","La bombilla, c'est l'ampoule qui éclaire ! Celle du pied : la ampolla."],["Tengo una ampolla muy grande en la pie.","J'ai une très grosse ampoule au pied (fém.).","El pie est masculin : en el pie."]]},{"dit":"pilar","es":"A ver… Uy, sí. ¿Está abierta o cerrada?","fr":"Voyons… Oh oui. Elle est ouverte ou fermée ?"},{"choix":[["Cerrada, pero me duele mucho.","Fermée, mais elle me fait très mal.",null],["Cerrado, pero me duelo mucho.","Fermé, mais je me fais très mal.","C'est l'ampoule qui fait mal : me duele (elle me fait mal). Et cerrada, au féminin, comme la ampolla."],["Cerrada, pero me gusta mucho.","Fermée, mais je l'aime beaucoup.","Me gusta = ça me plaît. Mal : me duele."]]},{"dit":"pilar","es":"Le pongo un apósito especial para ampollas. No lo quite en tres días. ¿Algo más?","fr":"Je vous mets un pansement spécial pour ampoules. Ne l'enlevez pas avant trois jours. Autre chose ?"},{"choix":[["Sí, también me duele la rodilla.","Oui, j'ai aussi mal au genou.",null],["Sí, también me duele la rodaja.","Oui, j'ai aussi mal à la tranche.","La rodaja, c'est une tranche (de citron…). Le genou : la rodilla."],["Sí, tampoco me duele la rodilla.","Oui, je n'ai pas mal au genou non plus.","Tampoco nie. Pour ajouter une douleur : también."]]},{"dit":"pilar","es":"Entonces, ibuprofeno. Una pastilla cada ocho horas, después de las comidas. Y si mañana le sigue doliendo, al centro de salud.","fr":"Alors, de l'ibuprofène. Un comprimé toutes les huit heures, après avoir mangé. Et si ça fait encore mal demain, à la clinique."},{"choix":[["Cada ocho horas, después de las comidas. Entendido.","Toutes les huit heures, après les repas. Compris.",null],["Ocho pastillas, antes de las comidas. Entendido.","Huit comprimés, avant les repas. Compris.","Un comprimé toutes les huit heures (cada ocho horas), et après (después) le repas."],["Cada ocho días, después de las comidas. Entendido.","Tous les huit jours, après les repas. Compris.","Horas = heures ; días = jours."]]},{"dit":"pilar","es":"Son once euros con veinte. ¡Y cuídese esos pies!","fr":"C'est 11,20 €. Et prenez soin de ces pieds !"},{"choix":[["Muchas gracias. Aquí tiene.","Merci beaucoup. Voici.",null],["Muchas gracias. Aquí tengo.","Merci beaucoup. Ici, j'ai.","Pour tendre l'argent : aquí tiene (voici pour vous)."],["Muchas gracias. Aquí viene.","Merci beaucoup. Ici, il vient.","Aquí tiene : voici. Viene = il vient."]]}]},"soir":{"titre":"Rue Laurel, entre deux bars","tours":[{"dit":"marta","emo":"caringempathy","es":"¿Qué tal el pie? Te he visto entrar en la farmacia.","fr":"Comment va ton pied ? Je t'ai vu entrer à la pharmacie."},{"choix":[["Mejor, gracias. Tengo una tirita especial.","Mieux, merci. J'ai un pansement spécial.",null],["Peor, gracias. Tengo una tirita especial.","Pire, merci. J'ai un pansement spécial.","Peor = pire. Si ça va mieux : mejor."],["Mejor, gracias. Tengo una tortilla especial.","Mieux, merci. J'ai une omelette spéciale.","Tortilla, c'est l'omelette. Le pansement : la tirita."]]},{"dit":"marta","emo":"curious","es":"Oye, el otro día me dijiste lo de tu trabajo. ¿Lo echas de menos?","fr":"Dis donc, l'autre jour tu m'as parlé de ton travail. Il te manque ?"},{"libre":true,"choix":[["No, para nada. Aquí estoy muy bien.","Non, pas du tout. Ici, je suis très bien.",null],["Un poco, sí. Y a mis compañeros.","Un peu, oui. Et mes collègues aussi.",null],["Echo de menos a mi familia, sobre todo.","C'est surtout ma famille qui me manque.",null]]},{"dit":"marta","emo":"nostalgic","es":"Te entiendo. Yo tengo dos hijos y tres nietos. El pequeño me llama todas las noches.","fr":"Je te comprends. J'ai deux enfants et trois petits-enfants. Le plus petit m'appelle tous les soirs."},{"choix":[["¡Qué bonito! ¿Cuántos años tiene?","Comme c'est beau ! Il a quel âge ?",null],["¡Qué bonito! ¿Cuántos años tienes?","Comme c'est beau ! Tu as quel âge ?","Tienes, c'est toi. Pour le petit-fils : ¿cuántos años tiene?"],["¡Qué bonito! ¿Cuántos nietos tiene?","Comme c'est beau ! Il a combien de petits-enfants ?","Le petit a… des années, pas des petits-enfants. ¿Cuántos años tiene?"]]},{"dit":"marta","emo":"friendlycheerful","es":"Seis. Dice que la abuela está loca por caminar tanto. ¡Y tiene razón! Venga, otro pincho.","fr":"Six ans. Il dit que mamie est folle de marcher autant. Et il a raison ! Allez, encore un pincho (une bouchée)."},{"choix":[["¡Venga! Pero esta vez pago yo.","Allez ! Mais cette fois, c'est moi qui paie.",null],["¡Venga! Pero esta vez pagas yo.","Allez ! Mais cette fois, tu paies moi.","Pago yo : c'est moi qui paie. Pagas, c'est toi qui paies."],["¡Venga! Pero esta vez pesca yo.","Allez ! Mais cette fois, pêche moi.","Pescar, c'est pêcher. Payer : pagar — pago yo."]]}]},"vignette":true},{"id":"burgos","objectif":"Comprendre « complet » et la solution proposée ; réserver une chambre au téléphone ; retrouver l'adresse.","n":5,"lieu":"Burgos","km":285,"region":"Castilla y León","img":"burgos","titre":"« Completo »","intro":["Burgos arrive après une longue entrée par la banlieue industrielle — puis, d'un coup, la cathédrale : l'une des plus grandes cathédrales gothiques d'Espagne, inscrite au patrimoine mondial.","Le Cid, héros de la Reconquête, y est enterré. Beaucoup de pèlerins s'y accordent un jour de repos.","Et c'est souvent ici qu'on entend pour la première fois le mot qu'on redoute : « completo »."],"voir":[["la catedral de Burgos","la cathédrale de Burgos"],["la tumba del Cid","le tombeau du Cid"],["el arco de Santa María","l'arche Sainte-Marie (la porte de la ville)"]],"mots":["completo","pension","catedral","entrada","descuento","horario","cerrado","abierto","a_que_hora","donativo","misa"],"local":"rocio","ecoute":[["Lo siento, está completo desde las tres.",[["Désolée, c'est complet depuis 15 h.",null],["Désolée, c'est complet jusqu'à 15 h.","Desde = depuis. Jusqu'à se dirait hasta."],["Désolée, il reste trois lits.","Completo : il n'y a plus de place. Las tres, c'est l'heure."]]],["Hay una pensión aquí al lado, a la vuelta de la esquina.",[["Il y a une pension juste à côté, au coin de la rue.",null],["Il y a une pension au retour, sur le chemin.","« A la vuelta de la esquina » : juste au coin de la rue."],["Il y a une église juste à côté, au coin de la rue.","Una pensión, c'est un petit hôtel."]]],["La catedral abre a las nueve y media, y los peregrinos tienen descuento.",[["La cathédrale ouvre à 9 h 30 ; tarif réduit pour les pèlerins.",null],["La cathédrale ferme à 9 h 30 ; tarif réduit pour les pèlerins.","Abre = ouvre ; cierra = ferme."],["La cathédrale ouvre à 9 h 30 ; les pèlerins entrent gratuitement.","Descuento = réduction, pas gratuité (gratis)."]]],["Llame usted y diga que va de mi parte.",[["Appelez et dites que c'est moi qui vous envoie.",null],["Appelez et dites que vous partez demain.","« De mi parte » : de ma part."],["Allez-y et dites que vous êtes pèlerin.","Llame = appelez (au téléphone)."]]],["Salga por esta puerta, gire a la derecha y es el segundo portal.",[["Sortez par cette porte, tournez à droite : c'est la deuxième porte d'entrée.",null],["Sortez par cette porte, tournez à gauche : c'est la deuxième porte d'entrée.","Derecha = droite. Gauche : izquierda."],["Sortez par cette porte, tournez à droite : c'est la douzième porte d'entrée.","Segundo = deuxième."]]]],"dire":[["Au téléphone, vous demandez s'il reste une chambre pour ce soir.","¿Tiene una habitación para esta noche?",["habitación|habitacion","noche"]],["Vous demandez le prix.","¿Cuánto cuesta?",["cuánto|cuanto","cuesta"]],["Au téléphone, vous demandez de répéter, s'il vous plaît.","¿Puede repetir, por favor?",["repetir"]],["Vous demandez à quelle heure ouvre la cathédrale.","¿A qué hora abre la catedral?",["hora","abre","catedral"]]],"scene":{"titre":"À l'albergue municipal, puis au téléphone","qui":"rocio","tours":[{"dit":"rocio","es":"Hola, buenas tardes. Lo siento mucho, estamos completos desde las tres.","fr":"Bonjour. Je suis vraiment désolée, nous sommes complets depuis 15 h."},{"choix":[["¿Completo? ¿Y hay otro albergue cerca?","Complet ? Et il y a un autre albergue près d'ici ?",null],["¿Completo? Entonces una cama, por favor.","Complet ? Alors un lit, s'il vous plaît.","Completo : il n'y a plus de lit. Demandez plutôt une autre adresse."],["¿Completo? ¿Y hay otro albergue lejos?","Complet ? Et il y a un autre albergue loin d'ici ?","Lejos = loin. Vous cherchez près : cerca."]]},{"dit":"rocio","es":"Los albergues están todos llenos hoy. Pero hay una pensión a la vuelta de la esquina. Llame usted y diga que va de mi parte.","fr":"Les albergues sont tous pleins aujourd'hui. Mais il y a une pension au coin de la rue. Appelez et dites que c'est moi qui vous envoie."},{"choix":[["Muchas gracias. ¿Me da el número?","Merci beaucoup. Vous me donnez le numéro ?",null],["Muchas gracias. ¿Me da el nombre de usted?","Merci beaucoup. Vous me donnez votre nom à vous ?","Pour appeler, il vous faut le numéro de la pension : el número."],["Muchas gracias. ¿Me da la esquina?","Merci beaucoup. Vous me donnez le coin ?","La esquina, c'est le coin de la rue. Pour téléphoner : el número."]]},{"dit":"gomez","es":"Pensión Gómez, ¿dígame?","fr":"Pension Gómez, j'écoute ?","tel":true},{"choix":[["Buenas tardes. ¿Tiene una habitación para esta noche?","Bonjour. Avez-vous une chambre pour ce soir ?",null],["Buenas tardes. ¿Tiene una habitación para mañana noche?","Bonjour. Avez-vous une chambre pour demain soir ?","C'est pour ce soir : para esta noche."],["Buenas tardes. ¿Tiene una litera para esta noche?","Bonjour. Avez-vous un lit superposé pour ce soir ?","Dans une pension, on demande une chambre : una habitación."]]},{"dit":"gomez","es":"Sí, me queda una individual. Son treinta y cinco euros, sin desayuno.","fr":"Oui, il me reste une chambre simple. C'est 35 €, sans déjeuner.","tel":true},{"choix":[["Perfecto. Me la quedo. Vengo de parte de Rocío.","Parfait. Je la prends. C'est Rocío qui m'envoie.",null],["Perfecto. Me la quedo. Voy de parte de Burgos.","Parfait. Je la prends. J'y vais de la part de Burgos.","C'est l'hospitalière qui vous envoie : de parte de Rocío."],["¿Setenta y cinco euros? Es mucho.","75 € ? C'est beaucoup.","Il a dit treinta y cinco (35), pas setenta y cinco (75)."]]},{"dit":"gomez","es":"¡Ah, de Rocío! Muy bien. ¿A nombre de quién?","fr":"Ah, de la part de Rocío ! Très bien. À quel nom ?","tel":true},{"choix":[["A nombre de Tremblay. Se escribe: te, erre, e…","Au nom de Tremblay. Ça s'écrit : T, R, E…",null],["A nombre de Tremblay. Se llama: te, erre, e…","Au nom de Tremblay. Ça s'appelle : T, R, E…","Pour épeler : se escribe… (ça s'écrit…)."],["A hombre de Tremblay. Se escribe: te, erre, e…","À l'homme de Tremblay. Ça s'écrit : T, R, E…","A nombre de : au nom de. Hombre, c'est un homme."]]},{"dit":"gomez","es":"Tremblay. Perfecto, le espero. Es el portal verde, el número doce.","fr":"Tremblay. Parfait, je vous attends. C'est la porte verte, le numéro 12.","tel":true}]},"soir":{"titre":"Un jour de repos, ou pas ?","tours":[{"dit":"marta","emo":"curious","es":"¡Aquí estás! ¿Has encontrado cama al final?","fr":"Te voilà ! Tu as trouvé un lit, finalement ?"},{"choix":[["Sí, en una pensión. Una habitación para mí sol{o|a}.","Oui, dans une pension. Une chambre pour moi tout seul.",null],["Sí, en una pensión. Una litera para mí sol{o|a}.","Oui, dans une pension. Un lit superposé pour moi tout seul.","Dans une pension, c'est una habitación (une chambre). La litera, c'est à l'albergue."],["No, en una pensión. Una habitación para mí sol{o|a}.","Non, dans une pension. Une chambre pour moi tout seul.","Vous avez trouvé un lit : commencez par sí."]]},{"dit":"marta","emo":"adventurous","es":"¡Qué lujo! Oye, yo mañana me quedo un día en Burgos. ¿Tú sigues o descansas?","fr":"Quel luxe ! Dis, moi, demain je reste un jour à Burgos. Toi, tu continues ou tu te reposes ?"},{"libre":true,"var":"descanso","choix":[["Me quedo yo también. Quiero ver la catedral.","Je reste moi aussi. Je veux voir la cathédrale.",null],["Sigo. Me siento bien y quiero caminar.","Je continue. Je me sens bien et je veux marcher.",null]]},{"dit":"marta","emo":"friendlycheerful","es":"{var:descanso}","fr":"","var":{"Me quedo yo también. Quiero ver la catedral.":["¡Genial! La catedral abre a las nueve y media. Vamos junt{os|as}, y con la credencial hay descuento.","Génial ! La cathédrale ouvre à 9 h 30. On y va ensemble. Avec la credencial, il y a une réduction."],"Sigo. Me siento bien y quiero caminar.":["Vale, tú a tu ritmo. Ya nos veremos más adelante: en el Camino siempre te vuelves a encontrar con la gente.","D'accord, toi à ton rythme. On se reverra plus loin : sur le Chemin, on retrouve toujours les gens."]}},{"choix":[["¡Seguro que nos vemos! Buenas noches, Marta.","C'est sûr, on se revoit ! Bonne nuit, Marta.",null],["¡Seguro que nos vamos! Buenas noches, Marta.","C'est sûr, on s'en va ! Bonne nuit, Marta.","Nos vemos = on se voit. Nos vamos = on s'en va."],["¡Seguro que nos vemos! Buenos días, Marta.","C'est sûr, on se revoit ! Bonjour, Marta.","C'est le soir : buenas noches."]]}]},"vignette":true},{"id":"carrion","objectif":"Dire d'où l'on vient et pourquoi l'on marche ; écouter l'autre et réagir.","n":6,"lieu":"Carrión de los Condes","km":369,"region":"Castilla y León","img":"meseta","titre":"Sur la Meseta","intro":["Entre Burgos et León, la Meseta : un haut plateau de blé, plat jusqu'à l'horizon, presque sans arbres. Certains la craignent, d'autres disent que c'est là que le Chemin commence vraiment.","On passe par Castrojeriz et son château en ruine, par Frómista et son église romane parfaite, avant d'arriver à Carrión de los Condes.","Il n'y a plus rien à regarder que le ciel. Alors on parle — et c'est souvent sur la Meseta qu'on se demande enfin pourquoi on marche."],"voir":[["la iglesia de San Martín de Frómista","l'église Saint-Martin de Frómista"],["el castillo de Castrojeriz","le château de Castrojeriz"],["los campos de trigo","les champs de blé"]],"mots":["calor","sol","gorra","crema_solar","agua","fuente","peregrino","cansado","por_que","kilometros","estas_bien"],"local":"marta","ecoute":[["¡Qué calor! No hay ni una sombra en diez kilómetros.",[["Quelle chaleur ! Pas une seule ombre sur dix kilomètres.",null],["Quelle chaleur ! Pas un seul nuage sur dix kilomètres.","Sombra = ombre. Nuage : nube."],["Quelle chaleur ! Pas une seule fontaine sur dix kilomètres.","Fontaine se dirait fuente. Ici : sombra, l'ombre."]]],["La próxima fuente está en el pueblo, a dos horas.",[["La prochaine fontaine est au village, à deux heures de marche.",null],["La prochaine fontaine est au village, à 2 h de l'après-midi.","« A dos horas » : à deux heures de distance, pas à 14 h."],["La prochaine fontaine est à deux kilomètres.","Horas = heures, pas kilomètres."]]],["¿Llevas crema solar? Te estás poniendo roj{o|a}.",[["Tu as de la crème solaire ? Tu deviens tout rouge.",null],["Tu as de la crème solaire ? Tu mets ton chapeau rouge.","« Te estás poniendo rojo » : tu es en train de rougir."],["Tu as de la crème ? Tu as l'air fatigué.","Rojo = rouge. Fatigué : cansado."]]],["Yo hago unos veinticinco kilómetros al día, más o menos.",[["Je fais environ 25 km par jour.",null],["Je fais environ 35 km par jour.","Veinticinco = 25. Treinta y cinco = 35."],["Je fais 25 km le matin, pas plus.","Al día : par jour."]]]],"dire":[["Vous dites qu'il fait très chaud.","¡Hace mucho calor!",["calor"]],["Vous demandez à Marta si elle va bien.","¿Estás bien, Marta?",["estás|estas","bien"]],["Vous demandez pourquoi elle fait le Chemin.","¿Por qué haces el Camino?",["por qué|porque|por que","camino"]],["Vous dites que vous êtes fatigué, fatiguée.","Estoy cansad{o|a}.",["cansado|cansada"]],["Dites pourquoi, vous, vous faites le Chemin.","Hago el Camino para pensar.",["camino|hago|para|por"]]],"scene":{"titre":"Des kilomètres sans village","qui":"marta","tours":[{"dit":"marta","emo":"reflective","es":"Kilómetros y kilómetros sin un pueblo… Aquí solo hay trigo y cielo. ¿Te gusta la Meseta?","fr":"Des kilomètres et des kilomètres sans un village… Ici, il n'y a que du blé et du ciel. Tu aimes la Meseta ?"},{"libre":true,"choix":[["Sí, me gusta el silencio.","Oui, j'aime le silence.",null],["No mucho. Es muy larga.","Pas tellement. Elle est très longue.",null],["No sé todavía. Es raro.","Je ne sais pas encore. C'est étrange.",null]]},{"dit":"marta","emo":"reflective","es":"Es un camino largo, sí… Oye, ¿puedo preguntarte algo? ¿Por qué haces el Camino?","fr":"C'est un long chemin, oui… Dis, je peux te demander quelque chose ? Pourquoi tu fais le Chemin ?"},{"libre":true,"var":"razon","choix":[["Por la fe. Soy creyente.","Pour la foi. Je suis croyant.",null],["Para pensar. Mi vida ha cambiado mucho.","Pour réfléchir. Ma vie a beaucoup changé.",null],["Por el reto. Quería caminar mucho.","Pour le défi. Je voulais marcher beaucoup.",null]]},{"dit":"marta","emo":"caringempathy","es":"{var:razon}","fr":"","var":{"Por la fe. Soy creyente.":["¡Qué bonito! Yo no sé muy bien si creo, pero en las iglesias del Camino siento algo especial.","C'est beau. Moi, je ne sais pas trop si je crois, mais dans les églises du Chemin, je sens quelque chose de spécial."],"Para pensar. Mi vida ha cambiado mucho.":["Te entiendo muy bien. Aquí, con tantas horas de silencio, las cosas se ordenan solas.","Je te comprends très bien. Ici, avec tant d'heures de silence, les choses se mettent en ordre toutes seules."],"Por el reto. Quería caminar mucho.":["¡Pues mucho es! Ochocientos kilómetros… Eres más valiente que yo.","Eh bien, c'est beaucoup ! Huit cents kilomètres… Tu es plus courageux que moi."]}},{"dit":"marta","emo":"nostalgic","es":"Yo camino por mi marido. Murió hace dos años. Él siempre había querido hacer el Camino, y nunca tuvimos tiempo.","fr":"Moi, je marche pour mon mari. Il est mort il y a deux ans. Il voulait toujours faire le Chemin, et nous n'avons jamais eu le temps."},{"choix":[["Lo siento mucho, Marta.","Je suis vraiment désolé, Marta.",null],["De nada, Marta.","De rien, Marta.","De nada répond à un merci. Devant une peine : lo siento mucho."],["¡Qué bien, Marta!","Super, Marta !","¡Qué bien! se dit d'une bonne nouvelle. Pour compatir : lo siento mucho."]]},{"dit":"marta","emo":"caringempathy","es":"Gracias. Llevo su foto en la mochila. Y en la Cruz de Ferro voy a dejar una piedra por él.","fr":"Merci. J'ai sa photo dans mon sac. Et à la Cruz de Ferro, je vais laisser une pierre pour lui."},{"choix":[["Es un viaje muy bonito, entonces.","Alors c'est un très beau voyage.",null],["Es un viaje muy barato, entonces.","Alors c'est un voyage très bon marché.","Barato = bon marché. Beau : bonito."],["Es una viaje muy bonita, entonces.","Alors c'est une très belle voyage.","El viaje est masculin : un viaje muy bonito."]]},{"dit":"marta","emo":"friendlycheerful","es":"Sí. Y además, conozco gente como tú. Venga, que en Carrión hay un albergue de monjas que cantan por la noche.","fr":"Oui. Et en plus, je rencontre des gens comme toi. Allez, à Carrión il y a un albergue tenu par des religieuses qui chantent le soir."}]},"soir":{"titre":"Les religieuses chantent","tours":[{"dit":"marta","emo":"excited","es":"¿Has oído? Nos invitan a cantar una canción de nuestro país. ¿Cantas tú una de Quebec?","fr":"Tu as entendu ? On nous invite à chanter une chanson de notre pays. Tu en chantes une du Québec ?"},{"libre":true,"choix":[["¡Vale! Pero canto muy mal.","D'accord ! Mais je chante très mal.",null],["Me da vergüenza… Canta tú primero.","Je suis gêné… Chante d'abord, toi.",null]]},{"dit":"marta","emo":"friendlycheerful","es":"¡Ja, ja! Aquí nadie canta bien, eso da igual. Lo importante es estar juntos.","fr":"Ha, ha ! Ici, personne ne chante bien, ça n'a pas d'importance. L'important, c'est d'être ensemble."},{"choix":[["Tienes razón. Da igual.","Tu as raison. Ça n'a pas d'importance.",null],["Tienes ración. Da igual.","Tu as une portion. Ça n'a pas d'importance.","Una ración est une portion (au bar). Avoir raison : tener razón."],["Tienes razón. Da agua.","Tu as raison. Ça donne de l'eau.","« Da igual » : c'est pareil, ça n'a pas d'importance."]]},{"dit":"marta","emo":"reflective","es":"Hoy ha sido un día largo… pero bonito. Gracias por escucharme en la Meseta.","fr":"Aujourd'hui a été une longue journée… mais belle. Merci de m'avoir écoutée sur la Meseta."},{"choix":[["Gracias a ti, Marta. Buenas noches.","Merci à toi, Marta. Bonne nuit.",null],["De nada a ti, Marta. Buenas noches.","De rien à toi, Marta. Bonne nuit.","Pour renvoyer un merci : gracias a ti."],["Gracias a usted, Marta. Buenas noches.","Merci à vous, Marta. Bonne nuit.","Entre pèlerins, on se tutoie : gracias a ti."]]}]},"vignette":true},{"id":"leon","objectif":"Dire votre allergie, et comprendre si le plat en contient. C'est l'erreur éliminatoire du chemin.","n":7,"lieu":"León","km":463,"region":"Castilla y León","img":"leon","titre":"Le menu du pèlerin","intro":["León, la grande ville de la fin de la Meseta. Sa cathédrale gothique est surnommée « la maison de lumière » : près de 1 800 m² de vitraux.","À deux pas, la basilique Saint-Isidore garde des peintures romanes qu'on appelle « la chapelle Sixtine de l'art roman ». Et Gaudí y a bâti une maison, la Casa Botines.","Le soir, au restaurant, on découvre le menu du pèlerin : entrée, plat, dessert, pain et vin, pour un prix fixe. Et si l'on a une allergie, c'est le moment de le dire."],"voir":[["las vidrieras de la catedral","les vitraux de la cathédrale"],["la basílica de San Isidoro","la basilique Saint-Isidore"],["la Casa Botines de Gaudí","la Casa Botines, de Gaudí"]],"mots":["menu_peregrino","primero","segundo","postre","carta","vino","agua","pan","alergico","frutos_secos","sin_gluten","vegetariano","cuenta","propina"],"local":"alex","ecoute":[["De primero hay sopa castellana o ensalada mixta.",[["En entrée : soupe castillane ou salade composée.",null],["Comme plat : soupe castillane ou salade composée.","De primero = en entrée. Le plat : de segundo."],["En entrée : soupe ou salade de fruits.","Ensalada mixta : une salade composée (laitue, tomate, thon…)."]]],["El menú lleva pan, bebida y postre.",[["Le menu comprend le pain, la boisson et le dessert.",null],["Le menu ne comprend pas le pain ni la boisson.","« Lleva » : il comprend, il inclut."],["Le menu apporte le pain ; la boisson est en plus.","Pan, bebida y postre : les trois sont compris."]]],["Esto lleva nueces, ¿no era usted alérgic{o|a}?",[["Ça contient des noix : vous n'étiez pas allergique ?",null],["Ça contient des noix : vous n'aimiez pas ça ?","Alérgico = allergique ; pas une question de goût."],["Ça ne contient pas de noix, vous pouvez en manger.","« Esto lleva nueces » : ça EN contient."]]],["Son doce euros por persona, todo incluido.",[["C'est 12 € par personne, tout compris.",null],["C'est 2 € par personne, tout compris.","Doce = 12. Dos = 2."],["C'est 12 € par personne, la boisson en plus.","Todo incluido : tout compris."]]]],"dire":[["Vous dites que vous êtes allergique aux noix.","Soy alérgic{o|a} a los frutos secos.",["alérgico|alérgica|alergico|alergica","frutos secos|nueces"]],["Vous demandez si le plat contient des noix.","¿Esto lleva frutos secos?",["lleva","frutos secos|nueces"]],["Vous commandez le menu du pèlerin.","El menú del peregrino, por favor.",["menú|menu","peregrino"]],["Vous demandez à quelle heure ouvre la cathédrale demain.","¿A qué hora abre la catedral mañana?",["hora","abre","catedral"]]],"eliminatoire":"L'allergie : dans cette scène, ne pas la dire — ou mal comprendre la réponse du serveur — fait recommencer la scène. Sur le chemin, cette erreur-là se paie à l'hôpital.","scene":{"titre":"Au restaurant, le menu du pèlerin","qui":"alex","tours":[{"dit":"alex","es":"Buenas noches. ¿Van a tomar el menú del peregrino?","fr":"Bonsoir. Vous prenez le menu du pèlerin ?"},{"choix":[["Sí, por favor. Pero soy alérgic{o|a} a los frutos secos.","Oui, s'il vous plaît. Mais je suis allergique aux noix.",null],["Sí, por favor. Pero soy alérgic{o|a} a los frutos rojos.","Oui, s'il vous plaît. Mais je suis allergique aux petits fruits.","Los frutos rojos, ce sont les petits fruits (fraises…). Les noix : los frutos secos."],["Sí, por favor. Y me gustan los frutos secos.","Oui, s'il vous plaît. Et j'aime les noix.","Vous êtes allergique : il faut le dire clairement — soy alérgico, soy alérgica."]],"critique":true},{"dit":"alex","es":"Muy bien, lo apunto. De primero hay sopa castellana o ensalada de la casa. La ensalada lleva nueces.","fr":"Très bien, je le note. En entrée, il y a la soupe castillane ou la salade de la maison. La salade contient des noix."},{"choix":[["Entonces, de primero, la sopa castellana.","Alors, en entrée, la soupe castillane.",null],["Entonces, de primero, la ensalada de la casa.","Alors, en entrée, la salade de la maison.","Il vient de dire : « la ensalada lleva nueces » — la salade contient des noix !"],["Entonces, de segundo, la ensalada de la casa.","Alors, comme plat, la salade de la maison.","La salade contient des noix (lleva nueces) — et c'était l'entrée, de primero."]],"critique":true},{"dit":"alex","es":"De segundo: trucha a la navarra o pollo asado. Y de postre, flan, fruta o helado.","fr":"Comme plat : truite à la navarraise ou poulet rôti. Et comme dessert : flan, fruits ou crème glacée."},{"libre":true,"choix":[["De segundo, trucha. Y de postre, flan.","Comme plat, la truite. Et en dessert, le flan.",null],["De segundo, pollo. Y de postre, fruta.","Comme plat, le poulet. Et en dessert, des fruits.",null],["De segundo, pollo. Y de postre, helado.","Comme plat, le poulet. Et en dessert, la crème glacée.",null]]},{"dit":"alex","es":"¿Y para beber? El menú lleva vino o agua.","fr":"Et pour boire ? Le menu comprend du vin ou de l'eau."},{"libre":true,"choix":[["Vino tinto, por favor.","Du vin rouge, s'il vous plaît.",null],["Agua, por favor. Sin gas.","De l'eau, s'il vous plaît. Plate.",null]]},{"dit":"alex","es":"Aquí tienen. ¡Que aproveche!","fr":"Voilà. Bon appétit !"},{"choix":[["Gracias. ¿Nos trae la cuenta después?","Merci. Vous nous apporterez l'addition après ?",null],["Gracias. ¿Nos trae la carta después?","Merci. Vous nous apporterez le menu après ?","La carta, c'est la liste des plats. L'addition : la cuenta."],["Gracias. ¿Nos trae la cuesta después?","Merci. Vous nous apporterez la côte après ?","La cuesta, c'est une côte, une montée ! L'addition : la cuenta."]]},{"dit":"alex","es":"Claro. Son doce euros por persona, todo incluido.","fr":"Bien sûr. C'est 12 € par personne, tout compris."}]},"soir":{"titre":"Sous les vitraux","tours":[{"dit":"marta","emo":"excited","es":"¿Has visto las vidrieras? ¡Cuando entra el sol, parece que estás dentro de un arcoíris!","fr":"Tu as vu les vitraux ? Quand le soleil entre, on dirait qu'on est dans un arc-en-ciel !"},{"choix":[["¡Sí! Es lo más bonito del Camino.","Oui ! C'est la plus belle chose du Chemin.",null],["¡Sí! Es lo más bonito del camión.","Oui ! C'est la plus belle chose du camion.","Camión = camion. Le Chemin : el Camino."],["¡Sí! Es lo más bonita del Camino.","Oui ! C'est la plus belle chose (fém.) du Chemin.","Avec lo, l'adjectif reste au masculin : lo más bonito."]]},{"dit":"marta","emo":"saddisappointed","es":"Oye, ¿sabes lo de Klaus, el alemán? Tiene una tendinitis. Se vuelve a casa mañana.","fr":"Dis, tu sais pour Klaus, l'Allemand ? Il a une tendinite. Il rentre chez lui demain."},{"choix":[["¡Qué pena! ¿Le duele mucho?","Quel dommage ! Il a très mal ?",null],["¡Qué pena! ¿Te duele mucho?","Quel dommage ! Tu as très mal ?","Te duele = tu as mal, toi. Pour Klaus : le duele."],["¡Qué bien! ¿Le duele mucho?","Super ! Il a très mal ?","Une mauvaise nouvelle : ¡qué pena! (quel dommage)."]]},{"dit":"marta","emo":"reflective","es":"Sí, la pierna entera. Dice que volverá el año que viene, desde aquí. ¿Tú volverías?","fr":"Oui, toute la jambe. Il dit qu'il reviendra l'an prochain, à partir d'ici. Toi, tu reviendrais ?"},{"libre":true,"choix":[["Sí, seguro. El Camino engancha.","Oui, c'est sûr. Le Chemin, ça rend accro.",null],["No sé… Primero quiero llegar.","Je ne sais pas… D'abord, je veux arriver.",null]]},{"dit":"marta","emo":"encouraging","es":"Ya hemos pasado la mitad del Camino. ¡Venga, que llegamos!","fr":"On a passé la moitié du Chemin. Allez, on va y arriver !"}]},"vignette":true},{"id":"o-cebreiro","objectif":"Comprendre la météo annoncée, faire porter son sac, et trouver la pharmacie.","n":8,"lieu":"O Cebreiro","km":617,"region":"Galicia","img":"o-cebreiro","titre":"La pluie et le sac","intro":["Avant O Cebreiro, il y a eu la Cruz de Ferro : une croix de fer sur un mât, au sommet des monts de León, où chacun dépose une pierre apportée de chez soi.","Puis la dernière grande montée, et l'entrée en Galice. À O Cebreiro, les pallozas — maisons rondes au toit de chaume — sortent du brouillard.","Ici, les panneaux sont d'abord en galicien : « rúa » pour la rue, « igrexa » pour l'église. Et il pleut souvent : il faut savoir lire la météo… et faire porter son sac."],"voir":[["las pallozas","les maisons rondes au toit de chaume"],["la iglesia de Santa María la Real","l'église Sainte-Marie-la-Royale"],["la Cruz de Ferro","la Croix de fer (avant O Cebreiro)"]],"mots":["lluvia","niebla","viento","barro","chubasquero","frio","transporte","mochila","manana","bajada"],"local":"uxia","ecoute":[["Mañana va a llover toda la mañana, y por la tarde, niebla.",[["Demain, il va pleuvoir toute la matinée ; l'après-midi, du brouillard.",null],["Ce matin, il va pleuvoir ; demain après-midi, du brouillard.","Mañana (seul) = demain. Toda la mañana = toute la matinée."],["Demain, il va faire soleil le matin ; l'après-midi, du brouillard.","Llover = pleuvoir. Soleil : sol."]]],["El transporte de mochilas cuesta cinco euros por etapa.",[["Le transport des sacs coûte 5 € par étape.",null],["Le transport des sacs coûte 5 € pour tout le chemin.","Por etapa : pour chaque étape."],["Le transport des sacs coûte 15 € par étape.","Cinco = 5. Quince = 15."]]],["Deje la mochila aquí antes de las ocho, con la etiqueta puesta.",[["Laissez le sac ici avant 8 h, avec l'étiquette attachée.",null],["Prenez le sac ici après 8 h, avec l'étiquette.","Deje = laissez. Antes = avant."],["Laissez le sac ici avant 8 h, sans l'étiquette.","« Con la etiqueta puesta » : avec l'étiquette mise."]]],["En gallego, «rúa» es «calle» e «igrexa» es «iglesia».",[["En galicien, « rúa », c'est la rue, et « igrexa », l'église.",null],["En galicien, « rúa », c'est la route, et « igrexa », la gare.","Calle = rue ; iglesia = église."],["En basque, « rúa », c'est la rue, et « igrexa », l'église.","Gallego = galicien. Le basque : euskera."]]],["La farmacia está bajando la calle, al lado de la iglesia.",[["La pharmacie est en descendant la rue, à côté de l'église.",null],["La pharmacie est en montant la rue, à côté de l'église.","Bajando = en descendant. En montant : subiendo."],["La pharmacie est en descendant la rue, en face de l'église.","Al lado de = à côté de. En face : enfrente de."]]],["Para las ampollas, póngase vaselina en los pies cada mañana, antes de caminar.",[["Pour les ampoules : de la vaseline sur les pieds chaque matin, avant de marcher.",null],["Pour les ampoules : de la vaseline sur les pieds chaque soir, après avoir marché.","Cada mañana = chaque matin ; antes = avant."],["Pour les ampoules : un pansement sur les pieds chaque matin, avant de marcher.","La vaselina, c'est la vaseline. Le pansement : la tirita."]]]],"dire":[["Vous demandez quel temps il fera demain.","¿Qué tiempo va a hacer mañana?",["tiempo","mañana|manana"]],["Vous demandez combien coûte le transport du sac.","¿Cuánto cuesta el transporte de la mochila?",["cuánto|cuanto","mochila"]],["Vous dites que votre sac va jusqu'à Triacastela.","Mi mochila va hasta Triacastela.",["mochila","hasta","triacastela"]],["Vous demandez comment on dit « merci » en galicien.","¿Cómo se dice «gracias» en gallego?",["cómo|como","dice","gallego"]]],"scene":{"titre":"Au comptoir de l'albergue, dans le brouillard","qui":"uxia","tours":[{"dit":"uxia","es":"¡Bos días! Buenos días, quiero decir. ¡Qué niebla, eh!","fr":"Bonjour ! (en galicien) Bonjour, je veux dire. Quel brouillard, hein !"},{"choix":[["Buenos días. ¿Qué tiempo va a hacer mañana?","Bonjour. Quel temps va-t-il faire demain ?",null],["Buenos días. ¿Qué tiempo va a hacer ayer?","Bonjour. Quel temps va-t-il faire hier ?","Ayer = hier. Demain : mañana."],["Buenos días. ¿Qué hora va a hacer mañana?","Bonjour. Quelle heure va-t-il faire demain ?","Le temps qu'il fait : el tiempo. La hora, c'est l'heure."]]},{"dit":"uxia","es":"Mañana va a llover toda la mañana. Y la bajada a Triacastela, con barro, es peligrosa.","fr":"Demain, il va pleuvoir toute la matinée. Et la descente vers Triacastela, avec la boue, est dangereuse."},{"choix":[["Entonces, ¿puedo mandar la mochila con el transporte?","Alors, je peux envoyer mon sac avec le transport ?",null],["Entonces, ¿puedo mandar la mochila en autobús solo?","Alors, je peux envoyer mon sac tout seul en autobus ?","Le service qui porte les sacs d'une étape à l'autre : el transporte de mochilas."],["Entonces, ¿puedo mandar la bajada con el transporte?","Alors, je peux envoyer la descente avec le transport ?","C'est le sac qu'on envoie : la mochila."]]},{"dit":"uxia","es":"Claro. Son cinco euros. Deje la mochila aquí antes de las ocho, con esta etiqueta. ¿Hasta dónde va?","fr":"Bien sûr. C'est 5 €. Laissez le sac ici avant 8 h, avec cette étiquette. Jusqu'où allez-vous ?"},{"choix":[["Hasta Triacastela, al albergue municipal.","Jusqu'à Triacastela, à l'albergue municipal.",null],["Desde Triacastela, al albergue municipal.","Depuis Triacastela, à l'albergue municipal.","Hasta = jusqu'à. Desde = depuis."],["Hasta las ocho, al albergue municipal.","Jusqu'à 8 h, à l'albergue municipal.","Elle demande jusqu'où va le sac : un lieu."]]},{"dit":"uxia","es":"Perfecto. Y llévese el chubasquero en la mochila pequeña, ¿eh? Aquí el tiempo cambia en cinco minutos.","fr":"Parfait. Et emportez votre imperméable dans le petit sac, hein ! Ici, le temps change en cinq minutes."},{"choix":[["Vale. ¿Y cómo se dice «gracias» en gallego?","D'accord. Et comment on dit « merci » en galicien ?",null],["Vale. ¿Y cómo se llama «gracias» en gallego?","D'accord. Et comment s'appelle « merci » en galicien ?","Pour demander un mot : ¿cómo se dice…?"],["Vale. ¿Y cómo se dice «gracias» en gallega?","D'accord. Et comment on dit « merci » en galicienne ?","La langue se dit au masculin : el gallego, en gallego."]]},{"dit":"uxia","es":"¡Grazas! Se dice «grazas». ¡Y bo Camiño!","fr":"Grazas ! On dit « grazas ». Et bon chemin (en galicien) !"}]},"soir":{"titre":"Ce qu'on a laissé à la Cruz de Ferro","tours":[{"dit":"marta","emo":"reflective","es":"Hace unos días dejé la piedra en la Cruz de Ferro. La de mi marido. Lloré un poco… bueno, mucho.","fr":"Il y a quelques jours, j'ai laissé la pierre à la Cruz de Ferro. Celle de mon mari. J'ai pleuré un peu… enfin, beaucoup."},{"choix":[["Es normal, Marta. ¿Cómo te sientes hoy?","C'est normal, Marta. Comment te sens-tu aujourd'hui ?",null],["Es normal, Marta. ¿Cómo te sientas hoy?","C'est normal, Marta. Comment t'assois-tu aujourd'hui ?","Sentirse = se sentir (te sientes). Sentarse = s'asseoir (te sientas)."],["Es normal, Marta. ¿Cómo te llamas hoy?","C'est normal, Marta. Comment t'appelles-tu aujourd'hui ?","Pour prendre des nouvelles : ¿cómo te sientes?"]]},{"dit":"marta","emo":"caringempathy","es":"Más ligera. Como si la mochila pesara menos. ¿Y tú? ¿Dejaste algo allí?","fr":"Plus légère. Comme si le sac pesait moins. Et toi ? Tu as laissé quelque chose là-bas ?"},{"libre":true,"choix":[["Sí, una piedra de mi jardín.","Oui, une pierre de mon jardin.",null],["Sí, una preocupación. Por dentro.","Oui, un souci. À l'intérieur.",null],["No, prefiero guardar mis piedras.","Non, je préfère garder mes pierres.",null]]},{"dit":"marta","emo":"friendlycheerful","es":"Cada uno lleva su propio Camino. Oye, ¿has visto? ¡Ya estamos en Galicia! Solo quedan ciento cincuenta kilómetros.","fr":"Chacun porte son propre Chemin. Dis, tu as vu ? On est en Galice ! Il ne reste que cent cinquante kilomètres."},{"choix":[["¡Ciento cincuenta! Ya casi llegamos.","Cent cinquante ! On y est presque.",null],["¡Ciento quince! Ya casi llegamos.","Cent quinze ! On y est presque.","Cincuenta = 50 : ciento cincuenta = 150."],["¡Mil quinientos! Ya casi llegamos.","Mille cinq cents ! On y est presque.","Ciento cincuenta = 150. Mil quinientos = 1 500."]]}]},"vignette":true},{"id":"sarria","objectif":"Acheter au poids, comprendre le prix, vérifier ce qu'un aliment contient, faire tamponner la credencial.","n":9,"lieu":"Sarria","km":659,"region":"Galicia","img":"sarria","titre":"Les cent derniers kilomètres","intro":["Sarria est à un peu plus de cent kilomètres de Santiago — le minimum à pied pour recevoir la Compostela. Beaucoup de pèlerins partent d'ici : le chemin se remplit d'un coup.","Sur les cent derniers kilomètres, il faut deux tampons par jour dans la credencial : un à l'albergue, un autre au bar, à l'église, en chemin.","Plus loin, à Melide, on mange le poulpe à la galicienne, servi sur une planche de bois avec du paprika. Et à Arzúa, le fromage."],"voir":[["el pulpo a feira de Melide","le poulpe à la galicienne de Melide"],["el queso de Arzúa","le fromage d'Arzúa"],["el mojón del kilómetro 100","la borne du kilomètre 100"]],"mots":["tienda","fruta","platano","queso","jamon","pan","bolsa","kilo","cuanto","efectivo","sello","pulpo"],"local":"manolo","ecoute":[["Las manzanas están a dos euros el kilo.",[["Les pommes sont à 2 € le kilo.",null],["Les pommes sont à 12 € le kilo.","Dos = 2. Doce = 12."],["Les pommes sont à 2 € la pièce.","El kilo : au kilo."]]],["¿Le pongo medio kilo o uno entero?",[["Je vous en mets un demi-kilo ou un kilo entier ?",null],["Je vous en mets un quart ou un demi-kilo ?","Medio = demi. Entero = entier."],["Vous en voulez une ou deux ?","Medio kilo, un kilo entero : ce sont des poids."]]],["Aquí también le pongo el sello, si quiere.",[["Ici aussi, je vous mets le tampon, si vous voulez.",null],["Ici, je ne mets pas de tampon.","« Le pongo el sello » : je vous mets le tampon."],["Ici aussi, je vous vends des timbres, si vous voulez.","Un sello peut être un timbre… mais pour un pèlerin, c'est le tampon de la credencial."]]],["Son seis con ochenta. ¿Tiene suelto?",[["C'est 6,80 €. Vous avez de la monnaie ?",null],["C'est 7,80 €. Vous avez de la monnaie ?","Seis = 6. Siete = 7."],["C'est 6,80 €. Vous avez un sac ?","Suelto : de la petite monnaie."]]],["Cuidado, este queso lleva nueces por dentro.",[["Attention, ce fromage contient des noix à l'intérieur.",null],["Attention, ce fromage ne contient pas de noix.","« Lleva » : il en contient. Il n'en contient pas : no lleva."],["Attention, ce fromage est très cher.","Nueces = noix. Cuidado = attention."]]]],"dire":[["Vous demandez le prix des bananes.","¿Cuánto cuestan los plátanos?",["cuánto|cuanto","plátanos|platanos"]],["Vous demandez un demi-kilo de fromage.","Medio kilo de queso, por favor.",["medio","kilo","queso"]],["Vous demandez un tampon pour votre credencial.","¿Me pone un sello en la credencial?",["sello","credencial"]],["Vous dites que c'est tout.","Nada más, gracias.",["nada más|nada mas"]]],"scene":{"titre":"Pique-nique à l'épicerie","qui":"manolo","tours":[{"dit":"manolo","es":"¡Buenos días! ¿Qué le pongo, peregrin{o|a}?","fr":"Bonjour ! Qu'est-ce que je vous sers, pèlerin ?"},{"choix":[["Buenos días. ¿Cuánto cuestan los plátanos?","Bonjour. Combien coûtent les bananes ?",null],["Buenos días. ¿Cuánto cuesta los plátanos?","Bonjour. Combien coûte les bananes ?","Los plátanos est au pluriel : ¿cuánto cuestan?"],["Buenos días. ¿Cuándo cuestan los plátanos?","Bonjour. Quand coûtent les bananes ?","Cuándo = quand. Combien : cuánto."]]},{"dit":"manolo","es":"Uno veinte el kilo. Son de Canarias, buenísimos.","fr":"1,20 € le kilo. Elles viennent des Canaries, excellentes."},{"choix":[["Pues tres plátanos y medio kilo de queso.","Alors trois bananes et un demi-kilo de fromage.",null],["Pues tres plátanos y medio queso de kilo.","Alors trois bananes et un demi fromage de kilo.","L'ordre : medio kilo de queso."],["Pues tres plátanos y medio kilo de beso.","Alors trois bananes et un demi-kilo de baisers.","Beso = un baiser ! Le fromage : el queso."]]},{"dit":"manolo","es":"¿Queso de Arzúa? Es de aquí, suave. ¿Algo más?","fr":"Du fromage d'Arzúa ? Il est d'ici, doux. Autre chose ?"},{"choix":[["Sí, ¿me pone un sello en la credencial?","Oui, vous me mettez un tampon dans ma credencial ?",null],["Sí, ¿me pone un sello en la carta?","Oui, vous me mettez un tampon sur le menu ?","Le tampon va dans la credencial."],["No, ¿me pone un sello en la credencial?","Non, vous me mettez un tampon dans ma credencial ?","Vous demandez encore quelque chose : c'est donc sí."]]},{"dit":"manolo","es":"¡Claro! Desde Sarria hacen falta dos al día. Aquí tiene. Son seis con ochenta.","fr":"Bien sûr ! À partir de Sarria, il en faut deux par jour. Voilà. C'est 6,80 €."},{"choix":[["Aquí tiene. Nada más, gracias.","Voici. Ce sera tout, merci.",null],["Aquí tiene. Nada menos, gracias.","Voici. Rien de moins, merci.","Pour dire que c'est tout : nada más."],["Aquí tiene. Nada mucho, gracias.","Voici. Rien beaucoup, merci.","Pour dire que c'est tout : nada más."]]},{"dit":"manolo","es":"Gracias a usted. ¡Buen Camino, y ya queda poco!","fr":"Merci à vous. Bon chemin, et il ne reste plus grand-chose !"}]},"soir":{"titre":"Les nouveaux arrivés","tours":[{"dit":"marta","emo":"curious","es":"¡Cuánta gente nueva desde Sarria! Mochilas limpias, botas nuevas… ¿Se nota, eh?","fr":"Que de nouvelles têtes depuis Sarria ! Sacs propres, bottes neuves… Ça se voit, hein ?"},{"choix":[["¡Sí! Y nosotr{os|as}, con las botas destrozadas.","Oui ! Et nous, avec nos bottes en lambeaux.",null],["¡Sí! Y vosotr{os|as}, con las botas destrozadas.","Oui ! Et vous autres, avec vos bottes en lambeaux.","Vosotros, c'est « vous autres ». Pour Marta et vous : nosotr{os|as}."],["¡Sí! Y nosotr{os|as}, con las bocas destrozadas.","Oui ! Et nous, avec la bouche en lambeaux.","La boca, c'est la bouche. Les bottes : las botas."]]},{"dit":"marta","emo":"friendlycheerful","es":"Una chica me ha preguntado si es duro. ¿Qué le dirías tú?","fr":"Une jeune fille m'a demandé si c'est dur. Toi, qu'est-ce que tu lui dirais ?"},{"libre":true,"choix":[["Que sí, pero que merece la pena.","Que oui, mais que ça vaut la peine.",null],["Que vaya despacio, a su ritmo.","Qu'elle y aille lentement, à son rythme.",null],["Que se cuide mucho los pies.","Qu'elle prenne bien soin de ses pieds.",null]]},{"dit":"marta","emo":"excited","es":"¡Muy bien dicho! Cuando lleguemos a Melide, te invito a una ración de pulpo. Es lo típico. ¿Lo has probado alguna vez?","fr":"Bien dit ! Quand on arrivera à Melide, je t'invite à une portion de poulpe. C'est la spécialité. Tu en as déjà goûté ?"},{"libre":true,"choix":[["Nunca. Tengo curiosidad.","Jamais. Je suis curieux.",null],["Sí, y me encanta.","Oui, et j'adore ça.",null],["No, y me da un poco de miedo.","Non, et ça me fait un peu peur.",null]]},{"dit":"marta","emo":"friendlycheerful","es":"¡Ya verás! Con pimentón y aceite… ¡Buenas noches!","fr":"Tu verras ! Avec du paprika et de l'huile… Bonne nuit !"}]},"vignette":true},{"id":"santiago","objectif":"Répondre aux questions du bureau du pèlerin, et se dire au revoir.","n":10,"lieu":"Santiago de Compostela","km":775,"region":"Galicia","img":"santiago","titre":"La Compostela","intro":["On entre dans Santiago par la vieille ville, on passe sous une arche où joue souvent un joueur de cornemuse, et l'on débouche sur la place de l'Obradoiro : la façade baroque de la cathédrale, et des pèlerins assis par terre, qui pleurent ou qui rient.","Dans la cathédrale : le Portique de la Gloire, le tombeau de l'apôtre, et l'accolade à sa statue. Certains jours, le botafumeiro, un énorme encensoir, vole d'un bout à l'autre du transept.","Au bureau du pèlerin, on montre sa credencial pleine de tampons, et l'on reçoit la Compostela, écrite en latin. Beaucoup continuent jusqu'à Finisterre, « la fin de la terre », au bord de l'océan."],"voir":[["la plaza del Obradoiro","la place de l'Obradoiro"],["el Pórtico de la Gloria","le Portique de la Gloire"],["el botafumeiro","le botafumeiro (l'encensoir géant)"],["Finisterre, el fin de la tierra","Finisterre, la fin de la terre"]],"mots":["catedral","misa","credencial","sello","desde_donde","por_que","peregrino","nos_vemos","encantado"],"local":"carmen","ecoute":[["¿Desde dónde ha empezado usted el Camino?",[["D'où êtes-vous parti pour faire le Chemin ?",null],["Jusqu'où allez-vous continuer le Chemin ?","Desde = depuis. Jusqu'où : hasta dónde."],["Depuis combien de jours marchez-vous ?","« Desde dónde » demande un lieu, pas une durée."]]],["¿Ha hecho el Camino a pie, en bicicleta o a caballo?",[["Avez-vous fait le Chemin à pied, à vélo ou à cheval ?",null],["Avez-vous fait le Chemin seul, en groupe ou en famille ?","A pie = à pied ; bicicleta = vélo ; caballo = cheval."],["Avez-vous fait le Chemin en autobus ou en taxi ?","Il faut l'avoir fait à pied, à vélo ou à cheval."]]],["Escriba aquí su nombre tal como aparece en el pasaporte.",[["Écrivez ici votre nom tel qu'il apparaît dans le passeport.",null],["Écrivez ici le nom de votre pays.","Nombre = nom (le vôtre)."],["Montrez-moi ici votre passeport.","Escriba = écrivez."]]],["La misa del peregrino es a las doce, en la catedral.",[["La messe des pèlerins est à midi, à la cathédrale.",null],["La messe des pèlerins est à 2 h, à la cathédrale.","Doce = 12 : a las doce, c'est midi."],["Le souper des pèlerins est à midi, à la cathédrale.","La misa, c'est la messe. Le souper : la cena."]]]],"dire":[["Vous dites que vous êtes parti de Saint-Jean-Pied-de-Port.","Empecé en Saint-Jean-Pied-de-Port.",["empecé|empece|salí|sali","saint"]],["Vous dites que vous l'avez fait à pied.","Lo he hecho a pie.",["pie"]],["Vous demandez à quelle heure est la messe des pèlerins.","¿A qué hora es la misa del peregrino?",["hora","misa"]],["Vous dites : « On l'a fait ! »","¡Lo hemos conseguido!",["conseguido|hecho"]]],"scene":{"titre":"Au bureau du pèlerin","qui":"carmen","tours":[{"dit":"carmen","es":"¡Bienvenid{o|a} a Santiago! ¿Me enseña su credencial, por favor?","fr":"Bienvenue à Santiago ! Vous me montrez votre credencial, s'il vous plaît ?"},{"choix":[["Aquí tiene. Está llena de sellos.","Voici. Elle est pleine de tampons.",null],["Aquí tiene. Está llena de sellas.","Voici. Elle est pleine de tamponnes.","El sello est masculin : los sellos."],["Aquí tiene. Está lleno de sellos.","Voici. Il est plein de tampons.","La credencial est féminine : está llena."]]},{"dit":"carmen","es":"¡Muy bien! Dos sellos al día desde Sarria, perfecto. ¿Desde dónde ha empezado el Camino?","fr":"Très bien ! Deux tampons par jour depuis Sarria, parfait. D'où avez-vous commencé le Chemin ?"},{"choix":[["Desde Saint-Jean-Pied-de-Port, en Francia.","De Saint-Jean-Pied-de-Port, en France.",null],["Hasta Saint-Jean-Pied-de-Port, en Francia.","Jusqu'à Saint-Jean-Pied-de-Port, en France.","Vous en êtes parti : desde."],["Desde Quebec, en Francia.","Depuis Québec, en France.","Elle demande où vous avez commencé à marcher — et Québec n'est pas en France !"]]},{"dit":"carmen","es":"¡Ochocientos kilómetros! ¿Y lo ha hecho a pie?","fr":"Huit cents kilomètres ! Et vous l'avez fait à pied ?"},{"choix":[["Sí, todo a pie. Treinta y tres días.","Oui, tout à pied. Trente-trois jours.",null],["Sí, todo a pie. Treinta y tres años.","Oui, tout à pied. Trente-trois ans.","Años = années. Días = jours."],["Sí, todo a pies. Treinta y tres días.","Oui, tout à pieds. Trente-trois jours.","On dit a pie, au singulier."]]},{"dit":"carmen","es":"¡Enhorabuena! Una última pregunta: ¿por qué motivo ha hecho el Camino?","fr":"Félicitations ! Une dernière question : pour quelle raison avez-vous fait le Chemin ?"},{"libre":true,"choix":[["Por motivos religiosos.","Pour des raisons religieuses.",null],["Por motivos espirituales.","Pour des raisons spirituelles.",null],["Por motivos espirituales y culturales.","Pour des raisons spirituelles et culturelles.",null]]},{"dit":"carmen","es":"Muy bien. Escriba aquí su nombre, tal como aparece en el pasaporte. Aquí tiene su Compostela. ¡Enhorabuena, peregrin{o|a}!","fr":"Très bien. Écrivez ici votre nom, tel qu'il apparaît dans le passeport. Voici votre Compostela. Félicitations, pèlerin !"},{"choix":[["¡Muchísimas gracias! Estoy muy emocionad{o|a}.","Merci mille fois ! Je suis très ému.",null],["¡Muchísimas gracias! Estoy muy embarazad{o|a}.","Merci mille fois ! Je suis très enceinte.","Embarazada = enceinte… Ému : emocionado, emocionada."],["¡Muchísimas gracias! Estoy muy constipad{o|a}.","Merci mille fois ! Je suis très enrhumé.","Constipado = enrhumé. Ému : emocionado, emocionada."]]}]},"soir":{"titre":"Sur la place de l'Obradoiro","tours":[{"dit":"marta","emo":"excited","es":"¡Lo hemos conseguido! ¡Lo hemos conseguido! Déjame darte un abrazo.","fr":"On l'a fait ! On l'a fait ! Laisse-moi te serrer dans mes bras."},{"choix":[["¡Sí! ¡Lo hemos conseguido, Marta!","Oui ! On l'a fait, Marta !",null],["¡Sí! ¡Lo habéis conseguido, Marta!","Oui ! Vous l'avez fait, Marta !","Habéis, c'est « vous autres ». Vous deux ensemble : hemos (nous)."],["¡Sí! ¡Lo hemos perdido, Marta!","Oui ! On l'a perdu, Marta !","Perdido = perdu. Réussi : conseguido."]]},{"dit":"marta","emo":"nostalgic","es":"¿Te acuerdas de la Meseta? Me dijiste que caminabas… {var:razon}","fr":"","var":{"Por la fe. Soy creyente.":["¿Te acuerdas de la Meseta? Me dijiste que caminabas por la fe. ¿Has encontrado lo que buscabas?","Tu te souviens de la Meseta ? Tu m'as dit que tu marchais pour la foi. As-tu trouvé ce que tu cherchais ?"],"Para pensar. Mi vida ha cambiado mucho.":["¿Te acuerdas de la Meseta? Me dijiste que caminabas para pensar. ¿Has encontrado lo que buscabas?","Tu te souviens de la Meseta ? Tu m'as dit que tu marchais pour réfléchir. As-tu trouvé ce que tu cherchais ?"],"Por el reto. Quería caminar mucho.":["¿Te acuerdas de la Meseta? Me dijiste que caminabas por el reto. ¡Pues reto conseguido! ¿Y has encontrado algo más?","Tu te souviens de la Meseta ? Tu m'as dit que tu marchais pour le défi. Eh bien, défi relevé ! Et tu as trouvé autre chose ?"]},"defaut":["¿Te acuerdas de la Meseta? ¡Cuántas cosas nos hemos contado! ¿Has encontrado lo que buscabas?","Tu te souviens de la Meseta ? Tout ce qu'on s'est raconté ! As-tu trouvé ce que tu cherchais ?"]},{"libre":true,"choix":[["Creo que sí. Y mucho más.","Je crois que oui. Et bien plus.",null],["Todavía no lo sé. Necesito tiempo.","Je ne le sais pas encore. J'ai besoin de temps.",null],["He encontrado amigos. Como tú.","J'ai trouvé des amis. Comme toi.",null]]},{"dit":"marta","emo":"caringempathy","es":"Yo también, ¿sabes? Mañana voy a Finisterre, a ver el mar. ¿Y tú? ¿Qué vas a hacer ahora?","fr":"Moi aussi, tu sais ? Demain, je vais à Finisterre, voir la mer. Et toi ? Qu'est-ce que tu vas faire maintenant ?"},{"libre":true,"choix":[["Vuelvo a Quebec el jueves.","Je rentre au Québec jeudi.",null],["¡Voy contigo a Finisterre!","Je vais avec toi à Finisterre !",null],["Me quedo unos días en Santiago.","Je reste quelques jours à Santiago.",null]]},{"dit":"marta","emo":"nostalgic","es":"Pues escríbeme, ¿eh? Y cuando vuelvas al Camino, avísame. Ha sido un honor caminar contigo.","fr":"Alors écris-moi, hein ? Et quand tu reviendras sur le Chemin, fais-moi signe. Ça a été un honneur de marcher avec toi."},{"choix":[["Para mí también, Marta. ¡Buen Camino, siempre!","Pour moi aussi, Marta. Bon chemin, toujours !",null],["Para mí tampoco, Marta. ¡Buen Camino, siempre!","Pour moi non plus, Marta. Bon chemin, toujours !","Tampoco nie ! Pour dire « moi aussi » : para mí también."],["Para ti también, Marta. ¡Buen Camino, siempre!","Pour toi aussi, Marta. Bon chemin, toujours !","C'est pour vous que ce fut un honneur : para mí también."]]}]},"vignette":true}],"poche":[{"cle":"urgences","titre":"Urgences","items":[{"es":"¡Socorro! ¡Ayuda, por favor!","fr":"Au secours ! À l'aide, s'il vous plaît !","son":"poche/ayuda"},{"es":"Llame a una ambulancia, por favor.","fr":"Appelez une ambulance, s'il vous plaît.","son":"poche/ambulancia"},{"es":"Me he perdido. ¿Dónde está el Camino?","fr":"Je me suis perdu. Où est le chemin ?","son":"poche/perdido"},{"es":"He perdido el pasaporte.","fr":"J'ai perdu mon passeport.","son":"poche/pasaporte"},{"es":"¿Dónde está el hospital más cercano?","fr":"Où est l'hôpital le plus proche ?","son":"poche/hospital"},{"es":"Me he caído y me duele mucho el tobillo.","fr":"Je suis tombé et j'ai très mal à la cheville.","son":"poche/caido"},{"es":"Tomo este medicamento todos los días.","fr":"Je prends ce médicament tous les jours.","son":"poche/medicamento"},{"es":"Tengo una alergia grave. Es urgente.","fr":"J'ai une allergie grave. C'est urgent.","son":"poche/alergia_grave"},{"es":"Me han robado la cartera.","fr":"On m'a volé mon portefeuille.","son":"poche/robo"},{"es":"¿Dónde está la comisaría?","fr":"Où est le poste de police ?","son":"poche/policia"}]},{"cle":"comprendre","titre":"Comprendre et se faire comprendre","items":[{"es":"buenos días","fr":"bonjour (le matin)","son":"mots/buenos_dias"},{"es":"buenas tardes","fr":"bonjour (l'après-midi et jusqu'au souper)","son":"mots/buenas_tardes"},{"es":"buenas noches","fr":"bonsoir, bonne nuit","son":"mots/buenas_noches"},{"es":"¡Buen Camino!","fr":"Bon chemin ! (le salut des pèlerins)","son":"mots/buen_camino"},{"es":"vale","fr":"d'accord, correct","son":"mots/vale"},{"es":"perdone, perdona","fr":"pardon, excusez-moi","son":"mots/perdone"},{"es":"no entiendo","fr":"je ne comprends pas","son":"mots/no_entiendo"},{"es":"más despacio, por favor","fr":"plus lentement, s'il vous plaît","son":"mots/despacio"},{"es":"¿Puede repetir?","fr":"Pouvez-vous répéter ?","son":"mots/repetir"},{"es":"¿Cómo se dice…?","fr":"Comment dit-on… ?","son":"mots/como_se_dice"},{"es":"lo siento","fr":"je suis désolé, désolée","son":"mots/lo_siento"},{"es":"de nada","fr":"de rien, bienvenue","son":"mots/de_nada"}]},{"cle":"albergue","titre":"À l'albergue","items":[{"es":"Buenas tardes.","fr":"Vous saluez l'hospitalier en arrivant, l'après-midi.","son":"roncesvalles/dire-0"},{"es":"¿Quedan camas?","fr":"Vous demandez s'il reste des lits.","son":"roncesvalles/dire-1"},{"es":"Aquí tiene mi credencial. ¿Me pone el sello?","fr":"Vous tendez votre credencial et demandez le tampon.","son":"roncesvalles/dire-2"},{"es":"¿Dónde están las duchas?","fr":"Vous demandez où sont les douches.","son":"roncesvalles/dire-3"},{"es":"Soy de Quebec, de Canadá.","fr":"À votre tour de vous présenter : dites d'où vous venez.","son":"roncesvalles/dire-4"}],"reponses":[{"es":"La cena es a las siete y la puerta se cierra a las diez.","fr":"Le souper est à 7 h ; la porte ferme à 22 h.","son":"roncesvalles/ecoute-0"},{"es":"Te toca la litera de arriba, la número ochenta y dos.","fr":"Tu as le lit du haut, le numéro 82.","son":"roncesvalles/ecoute-1"},{"es":"Son catorce euros, y el desayuno va aparte.","fr":"C'est 14 € ; le déjeuner se paie à part.","son":"roncesvalles/ecoute-2"},{"es":"Las botas se dejan abajo, en el zapatero.","fr":"Les bottes restent en bas, au range-chaussures.","son":"roncesvalles/ecoute-3"}]},{"cle":"bar","titre":"Au bar","items":[{"es":"Un café con leche y una tostada, function horloge(h, m){
  const a = (h % 12) * 30 + m / 2, b = m * 6, r = x => (x - 90) * Math.PI / 180;
  const p = (ang, L) => `${32 + L * Math.cos(r(ang))},${32 + L * Math.sin(r(ang))}`;
  let t = ''; for (let i = 0; i < 12; i++) { const q = i * 30; t += `<line x1="${p(q,24).split(',')[0]}" y1="${p(q,24).split(',')[1]}" x2="${p(q,27).split(',')[0]}" y2="${p(q,27).split(',')[1]}" stroke="#333" stroke-width="2"/>`; }
  return `<svg viewBox="0 0 64 64"><circle cx="32" cy="32" r="29" fill="#fff" stroke="#333" stroke-width="3"/>${t}
    <line x1="32" y1="32" x2="${p(a,15).split(',')[0]}" y2="${p(a,15).split(',')[1]}" stroke="#111" stroke-width="4" stroke-linecap="round"/>
    <line x1="32" y1="32" x2="${p(b,23).split(',')[0]}" y2="${p(b,23).split(',')[1]}" stroke="#111" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="32" cy="32" r="2.5" fill="#111"/></svg>`;
}

}

/* ---------- le son ---------- */
const lecteur = $('#lecteur');
function jouer(fichier){
  return new Promise(res => {
    if (!fichier || !SONS.has(fichier)) { res(false); return; }
    arreterMicro();
    lecteur.pause();
    lecteur.src = BASE + 'sons/' + fichier + '?v=' + D.v;
    // Le ralenti étire dans le navigateur, sans changer la hauteur (mémoire
    // bouton-vitesse-voix) : les fichiers restent ceux du débit naturel.
    lecteur.playbackRate = S.lent ? 0.8 : 1; lecteur.preservesPitch = true;
    lecteur.onended = () => res(true); lecteur.onerror = () => res(false);
    const p = lecteur.play(); if (p && p.catch) p.catch(() => res(false));
  });
}

  r.onresult = ev => {
    parle = true; let prov = '';
    for (let i = ev.resultIndex; i < ev.results.length; i++) {
      if (ev.results[i].isFinal) final += ev.results[i][0].transcript + ' ';
      else prov += ev.results[i][0].transcript;
    }
    surTexte((final + prov).trim()); relancer(4000);
  };
  r.onerror = () => {};
  r.onend = () => { clearTimeout(minuterie); recoActive = null; surFin(final.trim()); };
  recoActive = r; lecteur.pause();
  try { r.start(); relancer(9000); } catch(e) { recoActive = null; surFin(''); }
}
const plat = t => t.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^a-z0-9ñ ]+/g, ' ').replace(/\s+/g, ' ').trim();

/* ---------- ordre des choix : jamais la bonne toujours au même rang ---------- */
function ordre(n, graine){ const o = [...Array(n).keys()]; const d = graine % n; return o.slice(d).concat(o.slice(0, d)); }
