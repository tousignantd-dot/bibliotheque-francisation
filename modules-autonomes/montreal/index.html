n": "Montréal winters are long and cold, often below minus 10 degrees, with snow from December to March. Dress in layers, with a toque, mittens and boots. To stay warm, the RÉSO, also called the underground city, links metro stations, shopping centres and downtown towers through indoor passages. Summer is hot and humid, and it's festival season: something is happening almost every weekend.", "es": "El invierno de Montreal es largo y frío, a menudo por debajo de los 10 grados bajo cero, con nieve de diciembre a marzo. Vístase por capas, con gorro, guantes y botas. Para moverse sin frío, el RÉSO, también llamado la ciudad subterránea, une por pasillos estaciones de metro, centros comerciales y torres del centro. El verano, caluroso y húmedo, es la temporada de festivales: hay algo casi cada fin de semana."}}, {"id": "pietons", "titre": {"fr": "Piétons et voitures", "en": "Pedestrians and Cars", "es": "Peatones y autos"}, "texte": {"fr": "Sur l'île de Montréal, le virage à droite au feu rouge est interdit, contrairement au reste du Québec et à la plupart de l'Amérique du Nord. Si vous conduisez, attendez le feu vert. À pied, traversez aux intersections et suivez la silhouette blanche ; le décompte indique le temps qui reste. Méfiez-vous aussi des cyclistes : les pistes cyclables sont nombreuses, souvent à côté du trottoir, et les vélos y roulent vite.", "en": "On the island of Montréal, turning right on a red light is not allowed, unlike the rest of Québec and most of North America. If you're driving, wait for the green. On foot, cross at intersections and follow the white walking figure; the countdown shows how much time is left. Watch out for cyclists too: bike lanes are everywhere, often right next to the sidewalk, and riders move fast.", "es": "En la isla de Montreal está prohibido girar a la derecha con el semáforo en rojo, a diferencia del resto de Quebec y de casi toda América del Norte. Si maneja, espere la luz verde. A pie, cruce en las intersecciones y siga la silueta blanca; la cuenta regresiva indica el tiempo que queda. Cuidado también con los ciclistas: hay muchas ciclovías, a menudo junto a la acera, y las bicicletas van rápido."}}, {"id": "alcool", "titre": {"fr": "L'alcool", "en": "Buying Alcohol", "es": "El alcohol"}, "texte": {"fr": "Au Québec, on peut acheter de l'alcool dès 18 ans. Les vins et les spiritueux se vendent surtout à la SAQ, la société d'État, dont les succursales sont nombreuses. La bière et une sélection de vins se trouvent aussi à l'épicerie et au dépanneur du coin. Enfin, cherchez les restaurants marqués « Apportez votre vin » : on y arrive avec sa propre bouteille, et le serveur l'ouvre pour vous. C'est une tradition bien montréalaise.", "en": "In Québec, the legal drinking age is 18. Wine and spirits are sold mainly at the SAQ, the provincial liquor stores, which you'll find all over town. Beer and a selection of wines are also sold at grocery stores and at the dépanneur, the corner store. And look for restaurants marked \"Apportez votre vin\", bring your own wine: you arrive with your own bottle and the server opens it for you. It's a true Montréal tradition.", "es": "En Quebec se puede comprar alcohol a partir de los 18 años. Los vinos y licores se venden sobre todo en la SAQ, la tienda estatal, con muchas sucursales. La cerveza y una selección de vinos también se encuentran en el supermercado y en el dépanneur, la tienda de la esquina. Y busque los restaurantes marcados «Apportez votre vin», traiga su vino: usted llega con su propia botella y el mesero la abre. Es una tradición muy montrealesa."}}, {"id": "securite", "titre": {"fr": "Sécurité et urgences", "en": "Safety and Emergencies", "es": "Seguridad y emergencias"}, "texte": {"fr": "Montréal est une ville où l'on se promène facilement, de jour comme de soir, avec les précautions habituelles d'une grande ville : surveillez vos sacs dans le métro et les foules des festivals. En cas d'urgence, composez le 911, gratuit depuis n'importe quel téléphone, pour la police, les ambulances et les pompiers. Pour un problème de santé moins pressant, le 811 met en contact avec une infirmière. L'eau du robinet est potable partout.", "en": "Montréal is an easy city to walk around, by day or evening, with the usual big-city care: keep an eye on your bags in the metro and in festival crowds. In an emergency, dial 911, free from any phone, for police, ambulance and fire. For a less urgent health question, 811 connects you with a nurse. Tap water is safe to drink everywhere.", "es": "Montreal es una ciudad por la que se pasea con facilidad, de día y de noche, con las precauciones normales de una gran ciudad: vigile sus bolsas en el metro y entre la multitud de los festivales. En caso de emergencia, marque el 911, gratis desde cualquier teléfono, para policía, ambulancia y bomberos. Para un problema de salud menos urgente, el 811 lo comunica con una enfermera. El agua del grifo es potable en toda la ciudad."}}, {"id": "24-juin-1er-juillet", "titre": {"fr": "Le 24 juin et le 1er juillet", "en": "June 24 and July 1", "es": "El 24 de junio y el 1 de julio"}, "texte": {"fr": "Le 24 juin, c'est la Fête nationale du Québec, qu'on appelle aussi la Saint-Jean-Baptiste : spectacles en plein air, drapeaux bleus et blancs, feux de joie. Une semaine plus tard, le 1er juillet, c'est la fête du Canada, mais aussi, à Montréal, le jour du déménagement : de nombreux baux se terminent ce jour-là. Attendez-vous à des camions partout, des rues encombrées et des meubles sur les trottoirs.", "en": "June 24 is Québec's Fête nationale, also known as Saint-Jean-Baptiste Day: outdoor concerts, blue and white flags, bonfires. A week later, July 1 is Canada Day, and in Montréal it's also Moving Day, because many leases end that day. Expect moving trucks on every block, crowded streets and furniture out on the sidewalks. If you're driving that day, allow plenty of extra time, and book your hotel early for the whole week.", "es": "El 24 de junio es la Fiesta Nacional de Quebec, también llamada San Juan Bautista: conciertos al aire libre, banderas azules y blancas, fogatas. Una semana después, el 1 de julio, es el Día de Canadá y, en Montreal, también el día de la mudanza, porque muchos contratos de alquiler terminan ese día. Espere camiones por todas partes, calles llenas y muebles en las aceras."}}], "mots": [{"fr": "un dépanneur", "sens": {"fr": "La petite épicerie du coin, ouverte tard, où l'on trouve du lait, des collations, de la bière et du vin.", "en": "The corner store, open late, selling milk, snacks, beer and wine.", "es": "La tiendita de la esquina, abierta hasta tarde, donde se compra leche, botanas, cerveza y vino."}, "exemple": "Je vais faire un saut au dépanneur, veux-tu quelque chose?", "son": true}, {"fr": "une liqueur", "sens": {"fr": "Au Québec, une boisson gazeuse sucrée, et non un alcool fort.", "en": "In Québec, a soft drink or soda, not a spirit.", "es": "En Quebec, un refresco con gas, no un licor fuerte."}, "exemple": "Une poutine pis une liqueur, s'il vous plaît.", "son": true}, {"fr": "un breuvage", "sens": {"fr": "Une boisson, n'importe laquelle ; le mot revient souvent dans les menus et au comptoir.", "en": "Any drink or beverage; you'll see it on menus and hear it at the counter.", "es": "Una bebida, cualquiera; aparece a menudo en los menús y en el mostrador."}, "exemple": "Le trio vient avec des frites et un breuvage.", "son": true}, {"fr": "la Main", "sens": {"fr": "Le surnom du boulevard Saint-Laurent, l'artère qui sépare l'est et l'ouest de la ville.", "en": "The nickname for boulevard Saint-Laurent, the street that divides the city into east and west.", "es": "El apodo del bulevar Saint-Laurent, la avenida que divide la ciudad entre este y oeste."}, "exemple": "On se rejoint sur la Main, en face de chez Schwartz's.", "son": true}, {"fr": "magasiner", "sens": {"fr": "Faire les boutiques, aller acheter ou simplement regarder dans les magasins.", "en": "To go shopping, whether to buy or just to browse.", "es": "Ir de compras, ya sea para comprar o solo para mirar."}, "exemple": "Cet après-midi, on va magasiner sur la rue Sainte-Catherine.", "son": true}, {"fr": "un char", "sens": {"fr": "Une voiture, dans la langue de tous les jours.", "en": "A car, in everyday speech.", "es": "Un auto, en el habla de todos los días."}, "exemple": "Pas besoin de char, le métro t'amène partout.", "son": true}, {"fr": "c'est correct", "sens": {"fr": "Ça va, pas de problème ; on le dit pour accepter, rassurer ou refuser poliment.", "en": "It's fine, no problem; used to agree, to reassure, or to politely decline.", "es": "Está bien, no hay problema; se usa para aceptar, tranquilizar o rechazar con cortesía."}, "exemple": "Non merci, c'est correct, j'ai déjà mangé.", "son": true}, {"fr": "bienvenue", "sens": {"fr": "En réponse à « merci », l'équivalent de « de rien ».", "en": "Said in reply to \"merci\"; it means \"you're welcome\".", "es": "Se dice en respuesta a «merci»; equivale a «de nada»."}, "exemple": "Merci pour le plan! — Bienvenue, bonne visite!", "son": true}, {"fr": "un chum, une blonde", "sens": {"fr": "Le copain et la copine ; « un chum » veut aussi dire un ami.", "en": "Boyfriend and girlfriend; \"un chum\" can also simply mean a friend.", "es": "El novio y la novia; «un chum» también puede significar un amigo."}, "exemple": "Je suis venue avec mon chum, pis ma sœur avec sa blonde.", "son": true}, {"fr": "déjeuner, dîner, souper", "sens": {"fr": "Les trois repas de la journée : le matin, le midi et le soir.", "en": "The three meals of the day: breakfast, lunch and dinner.", "es": "Las tres comidas del día: desayuno, almuerzo y cena."}, "exemple": "On déjeune au café, on dîne au marché pis on soupe dans le Plateau.", "son": true}, {"fr": "une tuque", "sens": {"fr": "Le bonnet de laine qu'on porte tout l'hiver, souvent avec un pompon.", "en": "A woolly winter hat, a toque, often with a pompom.", "es": "El gorro de lana que se usa todo el invierno, a menudo con pompón."}, "exemple": "Mets ta tuque, il fait moins vingt dehors.", "son": true}, {"fr": "il fait frette", "sens": {"fr": "Il fait très froid ; « frette » est plus fort que « froid ».", "en": "It's freezing; \"frette\" is stronger than plain \"cold\".", "es": "Hace muchísimo frío; «frette» es más fuerte que «frío»."}, "exemple": "Il fait frette à matin, on prend le métro.", "son": true}, {"fr": "pas pire", "sens": {"fr": "Pas mal du tout, plutôt bien ; c'est souvent un vrai compliment.", "en": "Not bad at all, pretty good; often a genuine compliment.", "es": "Nada mal, bastante bien; muchas veces es un verdadero elogio."}, "exemple": "Pis, la poutine? — Pas pire pantoute!", "son": true}, {"fr": "c'est plate", "sens": {"fr": "C'est ennuyeux ou c'est dommage, selon le contexte.", "en": "It's boring, or it's too bad, depending on the context.", "es": "Es aburrido, o es una lástima, según el contexto."}, "exemple": "C'est plate, le musée est fermé aujourd'hui.", "son": true}], "scenes": [{"id": "schwartz", "lieu": "schwartz", "titre": {"fr": "Commander un smoked meat", "en": "Ordering a smoked meat sandwich", "es": "Pedir un sándwich de smoked meat"}, "but": {"fr": "Commander un smoked meat medium, un cornichon et une cerise noire, sur place, puis payer.", "en": "Order a medium smoked meat, a pickle and a black cherry soda, to eat here, then pay.", "es": "Pedir un smoked meat medio, un pepinillo y un refresco de cereza negra, para comer ahí, y pagar."}, "perso": {"nom": "Le serveur", "voix": "thierry"}, "tours": [{"dit": "Bonjour ! C'est pour manger ici ?", "sens": {"en": "Hi! Is it to eat here?", "es": "¡Hola! ¿Es para comer aquí?"}}, {"choix": [["Oui, sur place, s'il vous plaît.", {"en": "Yes, to eat in, please.", "es": "Sí, para comer aquí, por favor."}, null], ["Oui, pour rester, s'il vous plaît.", {"en": "Yes, to stay, please.", "es": "Sí, para quedarme, por favor."}, {"fr": "« Pour rester » est un calque de l'anglais « to stay ». On dit « sur place » ou « pour manger ici ».", "en": "« Pour rester » copies the English “to stay”. In French, say « sur place » or « pour manger ici ».", "es": "« Pour rester » calca el inglés «to stay». En francés se dice « sur place » o « pour manger ici »."}], ["Non, pour emporter, merci.", {"en": "No, to go, thanks.", "es": "No, para llevar, gracias."}, {"fr": "« Pour emporter » veut dire que vous partez avec la commande. Vous vouliez manger sur place.", "en": "« Pour emporter » means to go. You wanted to eat here: « sur place ».", "es": "« Pour emporter » significa para llevar. Usted quería comer ahí: « sur place »."}]]}, {"dit": "Parfait. Qu'est-ce que je vous sers ?", "sens": {"en": "Great. What can I get you?", "es": "Perfecto. ¿Qué le sirvo?"}}, {"choix": [["Un smoked meat medium, s'il vous plaît.", {"en": "A medium smoked meat, please.", "es": "Un smoked meat medio, por favor."}, null], ["Un smoked meat à point, s'il vous plaît.", {"en": "A smoked meat, cooked medium, please.", "es": "Un smoked meat término medio, por favor."}, {"fr": "« À point » parle de la cuisson d'un steak. Pour le smoked meat, on choisit le gras : maigre, medium ou gras.", "en": "« À point » is about how a steak is cooked. Smoked meat is ordered by fat: lean, medium or fatty.", "es": "« À point » es el término de cocción de un bistec. El smoked meat se pide según la grasa: magro, medio o graso."}], ["Je veux un smoked meat, medium.", {"en": "I want a smoked meat, medium.", "es": "Quiero un smoked meat, medio."}, {"fr": "On vous comprend, mais « je veux » sonne sec au comptoir. Ajoutez « s'il vous plaît » ou dites « Je vais prendre… ».", "en": "Understood, but « je veux » sounds abrupt at a counter. Add « s'il vous plaît » or say « Je vais prendre… ».", "es": "Se entiende, pero « je veux » suena brusco en el mostrador. Agregue « s'il vous plaît » o diga « Je vais prendre… »."}]]}, {"dit": "Avec un cornichon ? Et comme breuvage ?", "sens": {"en": "With a pickle? And to drink?", "es": "¿Con un pepinillo? ¿Y de bebida?"}}, {"choix": [["Oui, un cornichon et une cerise noire.", {"en": "Yes, a pickle and a black cherry soda.", "es": "Sí, un pepinillo y un refresco de cereza negra."}, null], ["Oui, un pickle et une cerise noire.", {"en": "Yes, a pickle and a black cherry soda.", "es": "Sí, un pepinillo y un refresco de cereza negra."}, {"fr": "Beaucoup de Montréalais comprendront, mais le mot français est « cornichon ».", "en": "Many Montrealers will understand, but the French word is « cornichon ».", "es": "Muchos montrealeses lo entenderán, pero la palabra francesa es « cornichon »."}], ["Oui, un concombre et une cerise noire.", {"en": "Yes, a cucumber and a black cherry soda.", "es": "Sí, un pepino y un refresco de cereza negra."}, {"fr": "Le « concombre » est le légume frais. Mariné dans le vinaigre, c'est un « cornichon ».", "en": "A « concombre » is a fresh cucumber. Pickled in vinegar, it's a « cornichon ».", "es": "El « concombre » es el pepino fresco. Encurtido en vinagre, es un « cornichon »."}]]}, {"dit": "Parfait. Ça fait à peu près vingt dollars. Comptant ou carte ?", "sens": {"en": "Great. That's about twenty dollars. Cash or card?", "es": "Perfecto. Son unos veinte dólares. ¿Efectivo o tarjeta?"}}, {"choix": [["Par carte, s'il vous plaît.", {"en": "By card, please.", "es": "Con tarjeta, por favor."}, null], ["Avec crédit, s'il vous plaît.", {"en": "With credit, please.", "es": "Con crédito, por favor."}, {"fr": "On ne dit pas « avec crédit ». Dites « par carte » ou « par carte de crédit ».", "en": "« Avec crédit » isn't used. Say « par carte » or « par carte de crédit ».", "es": "No se dice « avec crédit ». Diga « par carte » o « par carte de crédit »."}], ["En cash, s'il vous plaît.", {"en": "In cash, please.", "es": "En efectivo, por favor."}, {"fr": "« Cash » s'entend au Québec, mais le mot du serveur, « comptant », est le plus sûr. Et vous vouliez payer par carte.", "en": "« Cash » is heard in Quebec, but the waiter's word, « comptant », is safer. And you meant to pay by card.", "es": "« Cash » se oye en Quebec, pero la palabra del mesero, « comptant », es más segura. Y usted quería pagar con tarjeta."}]]}, {"dit": "Merci ! Bon appétit !", "sens": {"en": "Thank you! Enjoy your meal!", "es": "¡Gracias! ¡Buen provecho!"}}], "phrases": [["Un smoked meat medium, s'il vous plaît.", {"en": "A medium smoked meat, please.", "es": "Un smoked meat medio, por favor."}], ["Oui, sur place, s'il vous plaît.", {"en": "Yes, to eat in, please.", "es": "Sí, para comer aquí, por favor."}], ["Et comme breuvage ?", {"en": "And to drink?", "es": "¿Y de bebida?"}], ["Par carte, s'il vous plaît.", {"en": "By card, please.", "es": "Con tarjeta, por favor."}]], "note": {"fr": "Au Québec, « breuvage » veut simplement dire boisson. Le smoked meat se commande selon le gras : maigre, medium ou gras.", "en": "In Quebec, « breuvage » just means a drink. Smoked meat is ordered by fat: lean, medium or fatty.", "es": "En Quebec, « breuvage » significa simplemente bebida. El smoked meat se pide según la grasa: magro, medio o graso."}, "img": "schwartz", "son": true}, {"id": "bagels", "lieu": "bagels", "titre": {"fr": "Acheter des bagels chauds", "en": "Buying warm bagels", "es": "Comprar bagels calientes"}, "but": {"fr": "Acheter une demi-douzaine de bagels chauds, sésame et pavot, et payer.", "en": "Buy half a dozen warm bagels, sesame and poppy seed, and pay.", "es": "Comprar media docena de bagels calientes, de sésamo y de amapola, y pagar."}, "perso": {"nom": "La vendeuse", "voix": "sylvie"}, "tours": [{"dit": "Bonjour ! Qu'est-ce que je vous donne ?", "sens": {"en": "Hi! What can I get you?", "es": "¡Hola! ¿Qué le doy?"}}, {"choix": [["Une demi-douzaine de bagels, s'il vous plaît.", {"en": "Half a dozen bagels, please.", "es": "Media docena de bagels, por favor."}, null], ["Une moitié de douzaine, s'il vous plaît.", {"en": "A half of a dozen, please.", "es": "Una mitad de docena, por favor."}, {"fr": "On comprend, mais l'expression toute faite est « une demi-douzaine ».", "en": "Understood, but the set phrase is « une demi-douzaine ».", "es": "Se entiende, pero la expresión fija es « une demi-douzaine »."}], ["Un demi-dozen de bagels, s'il vous plaît.", {"en": "A half-dozen bagels, please.", "es": "Media docena de bagels, por favor."}, {"fr": "« Dozen » est anglais. En français : « une douzaine », et donc « une demi-douzaine ».", "en": "“Dozen” is English. In French: « une douzaine », so « une demi-douzaine ».", "es": "«Dozen» es inglés. En francés: « une douzaine », o sea « une demi-douzaine »."}]]}, {"dit": "Sésame ou pavot ?", "sens": {"en": "Sesame or poppy seed?", "es": "¿Sésamo o amapola?"}}, {"choix": [["Moitié sésame, moitié pavot, s'il vous plaît.", {"en": "Half sesame, half poppy seed, please.", "es": "Mitad sésamo, mitad amapola, por favor."}, null], ["Moitié sésame, moitié amapola, s'il vous plaît.", {"en": "Half sesame, half poppy seed, please.", "es": "Mitad sésamo, mitad amapola, por favor."}, {"fr": "« Amapola » est espagnol. La graine de pavot, c'est « pavot ».", "en": "« Amapola » is Spanish. Poppy seed is « pavot ».", "es": "« Amapola » es español. En francés, la semilla de amapola es « pavot »."}], ["Moitié sésame, moitié poppy, s'il vous plaît.", {"en": "Half sesame, half poppy, please.", "es": "Mitad sésamo, mitad amapola, por favor."}, {"fr": "« Poppy » est anglais. Au comptoir, on dit « pavot ».", "en": "“Poppy” is English. At the counter, say « pavot ».", "es": "«Poppy» es inglés. En el mostrador se dice « pavot »."}]]}, {"dit": "Ils sortent du four. Je vous prends des chauds ?", "sens": {"en": "They're just out of the oven. Shall I give you warm ones?", "es": "Acaban de salir del horno. ¿Le doy calientes?"}}, {"choix": [["Oui, des chauds, s'il vous plaît !", {"en": "Yes, warm ones, please!", "es": "¡Sí, calientes, por favor!"}, null], ["Oui, des chaleureux, s'il vous plaît !", {"en": "Yes, friendly ones, please!", "es": "¡Sí, cálidos, por favor!"}, {"fr": "« Chaleureux » se dit d'une personne accueillante. Pour du pain, on dit « chaud ».", "en": "« Chaleureux » describes a warm, welcoming person. For bread, say « chaud ».", "es": "« Chaleureux » se dice de una persona acogedora. Para el pan se dice « chaud »."}], ["Oui, des tièdes, s'il vous plaît !", {"en": "Yes, lukewarm ones, please!", "es": "¡Sí, tibios, por favor!"}, {"fr": "« Tiède » veut dire ni chaud ni froid. Pour des bagels qui sortent du four, dites « chauds ».", "en": "« Tiède » means lukewarm. For bagels fresh from the oven, say « chauds ».", "es": "« Tiède » significa tibio. Para bagels recién salidos del horno, diga « chauds »."}]]}, {"dit": "Ça vous fait environ neuf dollars. Comptant ou carte ?", "sens": {"en": "That comes to about nine dollars. Cash or card?", "es": "Son unos nueve dólares. ¿Efectivo o tarjeta?"}}, {"choix": [["Comptant. Voici dix dollars.", {"en": "Cash. Here's ten dollars.", "es": "En efectivo. Aquí tiene diez dólares."}, null], ["En effectif. Voici dix dollars.", {"en": "In staff. Here's ten dollars.", "es": "En efectivo. Aquí tiene diez dólares."}, {"fr": "« Effectif » veut dire le personnel d'une entreprise. « En efectivo » se dit « comptant ».", "en": "« Effectif » means a company's staff. Cash is « comptant ».", "es": "« Effectif » significa el personal de una empresa. « En efectivo » se dice « comptant »."}], ["Par monnaie. Voici dix dollars.", {"en": "By change. Here's ten dollars.", "es": "Con cambio. Aquí tiene diez dólares."}, {"fr": "« La monnaie », ce sont les pièces ou l'argent qu'on vous rend. Pour payer en billets, dites « comptant ».", "en": "« La monnaie » is coins or the change you get back. To pay in cash, say « comptant ».", "es": "« La monnaie » son las monedas o el cambio que le devuelven. Para pagar en efectivo, diga « comptant »."}]]}, {"dit": "Et voilà votre monnaie. Bonne journée !", "sens": {"en": "Here's your change. Have a nice day!", "es": "Aquí tiene su cambio. ¡Que tenga buen día!"}}], "phrases": [["Une demi-douzaine de bagels, s'il vous plaît.", {"en": "Half a dozen bagels, please.", "es": "Media docena de bagels, por favor."}], ["Moitié sésame, moitié pavot.", {"en": "Half sesame, half poppy seed.", "es": "Mitad sésamo, mitad amapola."}], ["Des chauds, s'il vous plaît.", {"en": "Warm ones, please.", "es": "Calientes, por favor."}], ["Comptant ou carte ?", {"en": "Cash or card?", "es": "¿Efectivo o tarjeta?"}]], "note": {"fr": "Le bagel de Montréal est bouilli dans l'eau au miel, puis cuit au four à bois. Il se mange souvent chaud, tel quel, en marchant.", "en": "Montreal bagels are boiled in honey water, then baked in a wood oven. People often eat them warm and plain, on the go.", "es": "El bagel de Montreal se hierve en agua con miel y se hornea en horno de leña. Se suele comer caliente, solo, caminando."}, "img": "bagels", "son": true}, {"id": "cafe-olimpico", "lieu": "cafe-olimpico", "titre": {"fr": "Commander un café", "en": "Ordering a coffee", "es": "Pedir un café"}, "but": {"fr": "Commander un latte et une pâtisserie, pour boire sur place.", "en": "Order a latte and a pastry, to have here.", "es": "Pedir un latte y un pastelito, para tomar ahí."}, "perso": {"nom": "Le barista", "voix": "thierry"}, "tours": [{"dit": "Salut ! Qu'est-ce que je te sers ?", "sens": {"en": "Hi! What can I get you?", "es": "¡Hola! ¿Qué te sirvo?"}}, {"choix": [["Un latte, s'il vous plaît.", {"en": "A latte, please.", "es": "Un latte, por favor."}, null], ["Un lait, s'il vous plaît.", {"en": "A milk, please.", "es": "Una leche, por favor."}, {"fr": "« Un lait », c'est un verre de lait. Pour le café au lait mousseux, dites « un latte ».", "en": "« Un lait » is a glass of milk. For the coffee drink, say « un latte ».", "es": "« Un lait » es un vaso de leche. Para el café con leche espumosa, diga « un latte »."}], ["Un café con leche, s'il vous plaît.", {"en": "A café con leche, please.", "es": "Un café con leche, por favor."}, {"fr": "« Con leche » est espagnol. En français : « un café au lait » ou « un latte ».", "en": "« Con leche » is Spanish. In French: « un café au lait » or « un latte ».", "es": "« Con leche » es español. En francés: « un café au lait » o « un latte »."}]]}, {"dit": "Parfait. Pour ici ou pour emporter ?", "sens": {"en": "Great. For here or to go?", "es": "Perfecto. ¿Para aquí o para llevar?"}}, {"choix": [["Pour ici, s'il vous plaît.", {"en": "For here, please.", "es": "Para aquí, por favor."}, null], ["Pour aller, s'il vous plaît.", {"en": "To go, please.", "es": "Para ir, por favor."}, {"fr": "« Pour aller » ne se dit pas. « To go » ou « para llevar » se dit « pour emporter ». Et vous vouliez rester.", "en": "« Pour aller » isn't used: “to go” is « pour emporter ». And you wanted to stay.", "es": "« Pour aller » no se usa: «para llevar» es « pour emporter ». Y usted quería quedarse."}], ["Pour rester, s'il vous plaît.", {"en": "To stay, please.", "es": "Para quedarme, por favor."}, {"fr": "C'est un calque de « to stay ». Reprenez les mots du barista : « pour ici ».", "en": "That copies “to stay”. Reuse the barista's words: « pour ici ».", "es": "Es un calco de «to stay». Repita las palabras del barista: « pour ici »."}]]}, {"dit": "Autre chose avec ça ? On a des croissants aux amandes.", "sens": {"en": "Anything else? We have almond croissants.", "es": "¿Algo más? Tenemos cruasanes de almendra."}}, {"choix": [["Oui, un croissant aux amandes, s'il vous plaît.", {"en": "Yes, an almond croissant, please.", "es": "Sí, un cruasán de almendra, por favor."}, null], ["Oui, un croissant avec amandes, s'il vous plaît.", {"en": "Yes, a croissant with almonds, please.", "es": "Sí, un cruasán con almendras, por favor."}, {"fr": "Pour une saveur, on dit « aux » : « aux amandes », « au chocolat ».", "en": "For a flavour, French uses « aux » or « au »: « aux amandes », « au chocolat ».", "es": "Para un sabor, el francés usa « aux » o « au »: « aux amandes », « au chocolat »."}], ["Oui, une pâte aux amandes, s'il vous plaît.", {"en": "Yes, some almond paste, please.", "es": "Sí, una pasta de almendra, por favor."}, {"fr": "« Une pâte », c'est une pâte à cuire ou une pâte à tartiner. Le gâteau, c'est « une pâtisserie ».", "en": "« Une pâte » is dough or a paste. A pastry is « une pâtisserie ».", "es": "« Une pâte » es una masa o una pasta. Un pastelito es « une pâtisserie »."}]]}, {"dit": "Parfait, je t'apporte ça. Bonne journée !", "sens": {"en": "Great, I'll bring it to you. Have a nice day!", "es": "Perfecto, te lo llevo. ¡Que tengas buen día!"}}], "phrases": [["Un latte, s'il vous plaît.", {"en": "A latte, please.", "es": "Un latte, por favor."}], ["Pour ici ou pour emporter ?", {"en": "For here or to go?", "es": "¿Para aquí o para llevar?"}], ["Un croissant aux amandes.", {"en": "An almond croissant.", "es": "Un cruasán de almendra."}], ["Un allongé, s'il vous plaît.", {"en": "A long espresso, please.", "es": "Un café alargado, por favor."}]], "note": {"fr": "Un jeune barista vous tutoie souvent : c'est amical, pas impoli. Vous pouvez répondre avec « vous » sans problème.", "en": "A young barista will often use « tu » with you: it's friendly, not rude. You can still answer with « vous ».", "es": "Un barista joven suele tutearle: es amistoso, no descortés. Usted puede responder con « vous » sin problema."}, "img": "cafe-olimpico", "son": true}, {"id": "la-banquise", "lieu": "la-banquise", "titre": {"fr": "Commander une poutine", "en": "Ordering a poutine", "es": "Pedir una poutine"}, "but": {"fr": "Commander une poutine moyenne avec du bacon, demander l'addition et laisser un pourboire.", "en": "Order a medium poutine with bacon, ask for the bill and leave a tip.", "es": "Pedir una poutine mediana con tocino, pedir la cuenta y dejar propina."}, "perso": {"nom": "La serveuse", "voix": "sylvie"}, "tours": [{"dit": "Bonsoir ! Qu'est-ce que je vous sers ?", "sens": {"en": "Good evening! What can I get you?", "es": "¡Buenas noches! ¿Qué le sirvo?"}}, {"choix": [["Une poutine moyenne, s'il vous plaît.", {"en": "A medium poutine, please.", "es": "Una poutine mediana, por favor."}, null], ["Une poutine moyen, s'il vous plaît.", {"en": "A medium poutine, please.", "es": "Una poutine mediana, por favor."}, {"fr": "« Poutine » est féminin : on dit « une poutine moyenne », avec le son « enne ».", "en": "« Poutine » is feminine, so it's « moyenne », with the “enn” sound at the end.", "es": "« Poutine » es femenino: se dice « moyenne », con el sonido «en» al final."}], ["Je vais avoir une poutine moyenne.", {"en": "I'll have a medium poutine.", "es": "Voy a tener una poutine mediana."}, {"fr": "C'est un calque de « I'll have ». En français : « Je vais prendre une poutine moyenne ».", "en": "That copies “I'll have”. In French: « Je vais prendre une poutine moyenne ».", "es": "Es un calco del inglés «I'll have». En francés: « Je vais prendre une poutine moyenne »."}]]}, {"dit": "Vous voulez ajouter une garniture ? Du bacon, des saucisses ?", "sens": {"en": "Would you like to add a topping? Bacon, sausages?", "es": "¿Quiere agregar algo? ¿Tocino, salchichas?"}}, {"choix": [["Oui, avec du bacon, s'il vous plaît.", {"en": "Yes, with bacon, please.", "es": "Sí, con tocino, por favor."}, null], ["Oui, avec bacon, s'il vous plaît.", {"en": "Yes, with bacon, please.", "es": "Sí, con tocino, por favor."}, {"fr": "Le français garde l'article : « avec du bacon », « avec des saucisses ».", "en": "French keeps the article: « avec du bacon », « avec des saucisses ».", "es": "El francés conserva el artículo: « avec du bacon », « avec des saucisses »."}], ["Oui, avec des bacons, s'il vous plaît.", {"en": "Yes, with bacons, please.", "es": "Sí, con tocinos, por favor."}, {"fr": "Le bacon ne se compte pas : on dit « du bacon », au singulier.", "en": "Bacon isn't counted: say « du bacon », singular.", "es": "El tocino no se cuenta: se dice « du bacon », en singular."}]]}, {"dit": "Voilà votre poutine. Tout est correct ?", "sens": {"en": "Here's your poutine. Is everything all right?", "es": "Aquí tiene su poutine. ¿Todo bien?"}}, {"choix": [["Oui, c'est très bon. L'addition, s'il vous plaît.", {"en": "Yes, it's very good. The bill, please.", "es": "Sí, está muy rico. La cuenta, por favor."}, null], ["Oui, c'est très bon. Le chèque, s'il vous plaît.", {"en": "Yes, it's very good. The check, please.", "es": "Sí, está muy rico. El cheque, por favor."}, {"fr": "« Le chèque » vient de l'anglais « check ». Dites « l'addition » ou, au Québec, « la facture ».", "en": "« Le chèque » comes from the English “check”. Say « l'addition » or, in Quebec, « la facture ».", "es": "« Le chèque » viene del inglés «check». Diga « l'addition » o, en Quebec, « la facture »."}], ["Oui, c'est très bon. Le compte, s'il vous plaît.", {"en": "Yes, it's very good. The account, please.", "es": "Sí, está muy rico. La cuenta, por favor."}, {"fr": "« Le compte » est un compte en banque. « La cuenta » du restaurant, c'est « l'addition ».", "en": "« Le compte » is a bank account. At a restaurant, the bill is « l'addition ».", "es": "« Le compte » es una cuenta bancaria. La cuenta del restaurante es « l'addition »."}]]}, {"dit": "Voici le terminal. Vous choisissez le pourboire à l'écran.", "sens": {"en": "Here's the card machine. You choose the tip on the screen.", "es": "Aquí tiene la terminal. Elija la propina en la pantalla."}}, {"choix": [["Quinze pour cent, c'est parfait.", {"en": "Fifteen percent is perfect.", "es": "Quince por ciento está perfecto."}, null], ["Cinquante pour cent, c'est parfait.", {"en": "Fifty percent is perfect.", "es": "Cincuenta por ciento está perfecto."}, {"fr": "Attention : « cinquante », c'est cinquante. Quinze se dit « quinze ». L'usage est de quinze à vingt pour cent.", "en": "Careful: « cinquante » is fifty. Fifteen is « quinze ». The usual tip is fifteen to twenty percent.", "es": "Cuidado: « cinquante » es cincuenta. Quince se dice « quinze ». Lo usual es del quince al veinte por ciento."}], ["Pas de pourboire, c'est inclus.", {"en": "No tip, it's included.", "es": "Sin propina, está incluida."}, {"fr": "Au Québec, le pourboire n'est presque jamais inclus. On l'ajoute, en général de quinze à vingt pour cent.", "en": "In Quebec, the tip is almost never included. People add it, usually fifteen to twenty percent.", "es": "En Quebec la propina casi nunca está incluida. Se agrega, en general del quince al veinte por ciento."}]]}, {"dit": "Merci beaucoup ! Bonne soirée !", "sens": {"en": "Thank you very much! Have a good evening!", "es": "¡Muchas gracias! ¡Buenas noches!"}}], "phrases": [["Une poutine moyenne, s'il vous plaît.", {"en": "A medium poutine, please.", "es": "Una poutine mediana, por favor."}], ["Avec du bacon.", {"en": "With bacon.", "es": "Con tocino."}], ["L'addition, s'il vous plaît.", {"en": "The bill, please.", "es": "La cuenta, por favor."}], ["Quinze pour cent, c'est parfait.", {"en": "Fifteen percent is perfect.", "es": "Quince por ciento está perfecto."}]], "note": {"fr": "Au restaurant, on vous apporte le terminal à la table et vous choisissez le pourboire à l'écran. Quinze à vingt pour cent, c'est l'usage.", "en": "At restaurants, the card machine comes to your table and you pick the tip on screen. Fifteen to twenty percent is customary.", "es": "En el restaurante le traen la terminal a la mesa y usted elige la propina en la pantalla. Lo usual es del quince al veinte por ciento."}, "img": "la-banquise", "son": true}, {"id": "marche-jean-talon", "lieu": "marche-jean-talon", "titre": {"fr": "Acheter des fruits au marché", "en": "Buying fruit at the market", "es": "Comprar fruta en el mercado"}, "but": {"fr": "Acheter un casseau de fraises et des pommes, goûter, et demander le prix.", "en": "Buy a basket of strawberries and some apples, taste, and ask the price.", "es": "Comprar una cajita de fresas y manzanas, probar, y preguntar el precio."}, "perso": {"nom": "Le marchand", "voix": "jean"}, "tours": [{"dit": "Bonjour ! Qu'est-ce qui vous ferait plaisir ?", "sens": {"en": "Hello! What would you like?", "es": "¡Buenos días! ¿Qué le gustaría?"}}, {"choix": [["Un casseau de fraises, s'il vous plaît.", {"en": "A basket of strawberries, please.", "es": "Una cajita de fresas, por favor."}, null], ["Un casseau de framboises, s'il vous plaît.", {"en": "A basket of raspberries, please.", "es": "Una cajita de frambuesas, por favor."}, {"fr": "« Framboise », c'est la framboise. La fraise se dit « fraise ».", "en": "« Framboise » is a raspberry. A strawberry is « fraise ».", "es": "« Framboise » es frambuesa. La fresa se dice « fraise »."}], ["Une casserole de fraises, s'il vous plaît.", {"en": "A pot of strawberries, please.", "es": "Una cacerola de fresas, por favor."}, {"fr": "« Une casserole » est un chaudron pour cuisiner. La petite boîte de fruits, c'est « un casseau ».", "en": "« Une casserole » is a cooking pot. The little fruit basket is « un casseau ».", "es": "« Une casserole » es una olla. La cajita de fruta es « un casseau »."}]]}, {"dit": "Goûtez, elles viennent de l'île d'Orléans.", "sens": {"en": "Have a taste, they're from Île d'Orléans.", "es": "Pruebe, son de la isla de Orléans."}}, {"choix": [["Mmm, elles sont vraiment bonnes !", {"en": "Mmm, they're really good!", "es": "¡Mmm, están muy ricas!"}, null], ["Mmm, elles sont vraiment bons !", {"en": "Mmm, they're really good!", "es": "¡Mmm, están muy ricas!"}, {"fr": "« Fraise » est féminin : on dit « elles sont bonnes ».", "en": "« Fraise » is feminine: say « elles sont bonnes ».", "es": "« Fraise » es femenino: se dice « elles sont bonnes »."}], ["Mmm, elles sont vraiment douces !", {"en": "Mmm, they're really soft!", "es": "¡Mmm, son muy suaves!"}, {"fr": "Pour « dulce » ou « sweet », on dit plutôt « sucrées ». « Doux » veut surtout dire tendre ou léger.", "en": "For “sweet”, French says « sucrées ». « Doux » mostly means soft or mild.", "es": "Para «dulce», el francés dice « sucrées ». « Doux » significa sobre todo suave."}]]}, {"dit": "Avec ça ?", "sens": {"en": "Anything else?", "es": "¿Algo más?"}}, {"choix": [["Des pommes aussi. C'est combien, le sac ?", {"en": "Some apples too. How much is the bag?", "es": "Manzanas también. ¿Cuánto cuesta la bolsa?"}, null], ["Des pommes de terre aussi. C'est combien ?", {"en": "Some potatoes too. How much is it?", "es": "Papas también. ¿Cuánto es?"}, {"fr": "Attention : « pommes de terre », ce sont des patates. Le fruit, c'est « pommes ».", "en": "Careful: « pommes de terre » are potatoes. The fruit is just « pommes ».", "es": "Cuidado: « pommes de terre » son papas. La fruta es « pommes »."}], ["Des pommes aussi. Combien est le sac ?", {"en": "Some apples too. How much is the bag?", "es": "Manzanas también. ¿Cuánto es la bolsa?"}, {"fr": "L'ordre des mots suit l'anglais ou l'espagnol. Dites « C'est combien, le sac ? ».", "en": "The word order follows English. Say « C'est combien, le sac ? ».", "es": "El orden sigue el español. Diga « C'est combien, le sac ? »."}]]}, {"dit": "Le sac, c'est environ cinq dollars. Ce sera tout ?", "sens": {"en": "The bag is about five dollars. Will that be all?", "es": "La bolsa cuesta unos cinco dólares. ¿Es todo?"}}, {"choix": [["Oui, ce sera tout, merci.", {"en": "Yes, that'll be all, thanks.", "es": "Sí, es todo, gracias."}, null], ["Oui, c'est complet, merci.", {"en": "Yes, it's full, thanks.", "es": "Sí, está lleno, gracias."}, {"fr": "« Complet » veut dire plein, sans place. Pour finir vos achats, dites « c'est tout ».", "en": "« Complet » means full, no room left. To finish your order, say « c'est tout ».", "es": "« Complet » significa lleno, sin lugar. Para terminar la compra, diga « c'est tout »."}], ["Oui, c'est assez, merci.", {"en": "Yes, that's enough, thanks.", "es": "Sí, ya basta, gracias."}, {"fr": "« C'est assez » peut sonner impatient, comme « ça suffit ! ». Préférez « ce sera tout ».", "en": "« C'est assez » can sound impatient, like “that's enough!”. Prefer « ce sera tout ».", "es": "« C'est assez » puede sonar impaciente, como «¡ya basta!». Mejor « ce sera tout »."}]]}, {"dit": "Parfait ! Ça fait une douzaine de dollars en tout. Bonne journée !", "sens": {"en": "Great! That's about twelve dollars in all. Have a nice day!", "es": "¡Perfecto! Son unos doce dólares en total. ¡Que tenga buen día!"}}], "phrases": [["Un casseau de fraises, s'il vous plaît.", {"en": "A basket of strawberries, please.", "es": "Una cajita de fresas, por favor."}], ["Je pourrais goûter ?", {"en": "Could I taste?", "es": "¿Podría probar?"}], ["C'est combien, le sac ?", {"en": "How much is the bag?", "es": "¿Cuánto cuesta la bolsa?"}], ["Oui, ce sera tout, merci.", {"en": "Yes, that'll be all, thanks.", "es": "Sí, es todo, gracias."}]], "note": {"fr": "Au Québec, le « casseau » est la petite boîte de fruits. Au marché, les marchands offrent souvent de goûter : c'est normal d'accepter.", "en": "In Quebec, a « casseau » is the little fruit basket. Market vendors often offer a taste: it's normal to accept.", "es": "En Quebec, el « casseau » es la cajita de fruta. En el mercado suelen ofrecer probar: es normal aceptar."}, "img": "marche-jean-talon", "son": true}, {"id": "dieu-du-ciel", "lieu": "dieu-du-ciel", "titre": {"fr": "Commander une bière", "en": "Ordering a beer", "es": "Pedir una cerveza"}, "but": {"fr": "Demander une recommandation, choisir une bière plus légère en verre, puis demander l'addition.", "en": "Ask for a recommendation, pick a lighter beer by the glass, then ask for the bill.", "es": "Pedir una recomendación, elegir una cerveza más ligera en vaso y luego pedir la cuenta."}, "perso": {"nom": "Le serveur", "voix": "thierry"}, "tours": [{"dit": "Bonsoir ! Vous savez ce que vous voulez boire ?", "sens": {"en": "Good evening! Do you know what you'd like to drink?", "es": "¡Buenas noches! ¿Ya sabe qué quiere tomar?"}}, {"choix": [["Pas encore. Qu'est-ce que vous me conseillez ?", {"en": "Not yet. What do you recommend?", "es": "Todavía no. ¿Qué me recomienda?"}, null], ["Pas encore. Qu'est-ce que vous m'avisez ?", {"en": "Not yet. What do you notify me?", "es": "Todavía no. ¿Qué me avisa?"}, {"fr": "Faux ami : « aviser », c'est informer. Pour une recommandation, dites « conseiller ».", "en": "False friend: « aviser » means to notify. To ask for advice, say « conseiller ».", "es": "Falso amigo: « aviser » es avisar, informar. Para pedir consejo, diga « conseiller »."}], ["Pas du tout. Qu'est-ce que vous me conseillez ?", {"en": "Not at all. What do you recommend?", "es": "Para nada. ¿Qué me recomienda?"}, {"fr": "« Pas du tout » veut dire « absolument pas » et sonne brusque. Ici : « pas encore ».", "en": "« Pas du tout » means “not at all” and sounds abrupt. Here: « pas encore », not yet.", "es": "« Pas du tout » significa «para nada» y suena brusco. Aquí: « pas encore », todavía no."}]]}, {"dit": "La Péché Mortel est très populaire. C'est une stout au café, assez forte.", "sens": {"en": "The Péché Mortel is very popular. It's a coffee stout, fairly strong.", "es": "La Péché Mortel es muy popular. Es una stout de café, bastante fuerte."}}, {"choix": [["Hmm, je voudrais quelque chose de plus léger.", {"en": "Hmm, I'd like something lighter.", "es": "Mmm, quisiera algo más ligero."}, null], ["Hmm, je voudrais quelque chose plus léger.", {"en": "Hmm, I'd like something lighter.", "es": "Mmm, quisiera algo más ligero."}, {"fr": "Après « quelque chose », il faut « de » : « quelque chose de plus léger ».", "en": "After « quelque chose », French needs « de »: « quelque chose de plus léger ».", "es": "Después de « quelque chose » hace falta « de »: « quelque chose de plus léger »."}], ["Hmm, je voudrais quelque chose de plus light.", {"en": "Hmm, I'd like something more light.", "es": "Mmm, quisiera algo más light."}, {"fr": "« Light » s'entend au Québec, mais pour le goût, « plus léger » est plus clair.", "en": "“Light” is heard in Quebec, but for taste « plus léger » is clearer.", "es": "«Light» se oye en Quebec, pero para el sabor « plus léger » es más claro."}]]}, {"dit": "Alors, la Rosée d'hibiscus. Un verre ou une pinte ?", "sens": {"en": "Then the Rosée d'hibiscus. A glass or a pint?", "es": "Entonces, la Rosée d'hibiscus. ¿Un vaso o una pinta?"}}, {"choix": [["Un verre, s'il vous plaît, pour goûter.", {"en": "A glass, please, to try it.", "es": "Un vaso, por favor, para probar."}, null], ["Une tasse, s'il vous plaît, pour goûter.", {"en": "A cup, please, to try it.", "es": "Una taza, por favor, para probar."}, {"fr": "« Une tasse », c'est pour le café ou le thé. Pour la bière, on dit « un verre ».", "en": "« Une tasse » is a cup, for coffee or tea. For beer, say « un verre ».", "es": "« Une tasse » es una taza, para café o té. Para la cerveza se dice « un verre »."}], ["Une pinte, s'il vous plaît, pour goûter.", {"en": "A pint, please, to try it.", "es": "Una pinta, por favor, para probar."}, {"fr": "Une pinte, c'est un grand verre. Pour simplement goûter, choisissez « un verre ».", "en": "A « pinte » is a big glass. Just to taste, choose « un verre ».", "es": "Una « pinte » es un vaso grande. Solo para probar, elija « un verre »."}]]}, {"dit": "Et voilà. Je vous en sers une autre ?", "sens": {"en": "There you go. Can I get you another one?", "es": "Aquí tiene. ¿Le sirvo otra?"}}, {"choix": [["Non merci, je vais prendre l'addition.", {"en": "No thanks, I'll take the bill.", "es": "No, gracias, voy a pedir la cuenta."}, null], ["Non merci, je suis plein. L'addition ?", {"en": "No thanks, I'm full. The bill?", "es": "No, gracias, estoy lleno. ¿La cuenta?"}, {"fr": "Au Québec, « je suis plein » peut vouloir dire « j'ai trop bu ». Dites plutôt « ça va aller, merci ».", "en": "In Quebec, « je suis plein » can mean “I'm drunk”. Say « ça va aller, merci » instead.", "es": "En Quebec, « je suis plein » puede significar «estoy borracho». Mejor diga « ça va aller, merci »."}], ["Non merci, je vais prendre le bill.", {"en": "No thanks, I'll take the bill.", "es": "No, gracias, voy a pedir la cuenta."}, {"fr": "« Le bill » se dit entre amis au Québec, mais « l'addition » est le mot sûr partout.", "en": "« Le bill » is heard casually in Quebec, but « l'addition » is the safe word everywhere.", "es": "« Le bill » se oye entre amigos en Quebec, pero « l'addition » es la palabra segura en todas partes."}]]}, {"dit": "Parfait, je vous apporte ça. Bonne soirée !", "sens": {"en": "Great, I'll bring it to you. Have a good evening!", "es": "Perfecto, se la traigo. ¡Buenas noches!"}}], "phrases": [["Qu'est-ce que vous me conseillez ?", {"en": "What do you recommend?", "es": "¿Qué me recomienda?"}], ["Je voudrais quelque chose de plus léger.", {"en": "I'd like something lighter.", "es": "Quisiera algo más ligero."}], ["Un verre, s'il vous plaît.", {"en": "A glass, please.", "es": "Un vaso, por favor."}], ["Je vais prendre l'addition.", {"en": "I'll take the bill.", "es": "Voy a pedir la cuenta."}]], "note": {"fr": "Dans les microbrasseries, on peut souvent goûter en petit format ou prendre une planche de dégustation. Au Québec, une bière se dit aussi « une broue », familièrement.", "en": "Brewpubs often serve small pours or a tasting flight, « une planche de dégustation ». Casually, Quebecers also call a beer « une broue ».", "es": "En las microcervecerías se puede probar en vaso pequeño o pedir una tabla de degustación. Coloquialmente, en Quebec una cerveza es « une broue »."}, "img": "dieu-du-ciel", "son": true}, {"id": "metro", "lieu": null, "titre": {"fr": "Acheter un titre au métro", "en": "Buying a Metro Pass", "es": "Comprar un pase de metro"}, "but": {"fr": "À la loge de la station Berri-UQAM, achetez un titre de vingt-quatre heures et demandez comment aller à la station Mont-Royal.", "en": "At the booth in Berri-UQAM station, buy a twenty-four-hour pass and ask how to get to Mont-Royal station.", "es": "En la taquilla de la estación Berri-UQAM, compre un pase de veinticuatro horas y pregunte cómo llegar a la estación Mont-Royal."}, "perso": {"nom": "La préposée", "voix": "sylvie"}, "tours": [{"dit": "Bonjour ! Je peux vous aider ?", "sens": {"en": "Hello! Can I help you?", "es": "¡Hola! ¿Le puedo ayudar?"}}, {"choix": [["Bonjour, je voudrais un titre de vingt-quatre heures.", {"en": "Hello, I'd like a twenty-four-hour pass.", "es": "Hola, quisiera un pase de veinticuatro horas."}, null], ["Bonjour, je veux un billet de vingt-quatre heures.", {"en": "Hello, I want a twenty-four-hour ticket.", "es": "Hola, quiero un boleto de veinticuatro horas."}, {"fr": "On vous comprend, mais « je veux » sonne sec au guichet. « Je voudrais » est plus poli.", "en": "You'll be understood, but « je veux » sounds abrupt at a counter. « Je voudrais » is more polite.", "es": "Se entiende, pero « je veux » suena brusco en la taquilla. « Je voudrais » es más cortés."}], ["Bonjour, je voudrais un boleto de vingt-quatre heures.", {"en": "Hello, I'd like a “boleto” for twenty-four hours.", "es": "Hola, quisiera un « boleto » de veinticuatro horas."}, {"fr": "« Boleto » est un mot espagnol. Au métro, on dit « un titre » ou « un billet ».", "en": "« Boleto » is Spanish. In the metro, say « un titre » or « un billet ».", "es": "« Boleto » es español. En el metro se dice « un titre » o « un billet »."}]]}, {"dit": "Parfait. Avez-vous déjà une carte OPUS ?", "sens": {"en": "Great. Do you already have an OPUS card?", "es": "Perfecto. ¿Ya tiene una tarjeta OPUS?"}}, {"choix": [["Non, je n'en ai pas. Il faut en acheter une ?", {"en": "No, I don't have one. Do I need to buy one?", "es": "No, no tengo. ¿Hay que comprar una?"}, null], ["Non, je n'ai pas une. Il faut acheter une ?", {"en": "No, I don't have one. Do I need to buy one?", "es": "No, no tengo una. ¿Hay que comprar una?"}, {"fr": "Pour remplacer « une carte », le français utilise « en » : « je n'en ai pas », « il faut en acheter une ».", "en": "To replace « une carte », French uses « en »: « je n'en ai pas », « il faut en acheter une ».", "es": "Para reemplazar « une carte », el francés usa « en »: « je n'en ai pas », « il faut en acheter une »."}], ["Non. Vous pouvez me charger pour la carte ?", {"en": "No. Can you load me for the card?", "es": "No. ¿Me puede recargar por la tarjeta?"}, {"fr": "« Charger » veut dire mettre des titres sur la carte, pas faire payer. Demandez plutôt : « Il faut en acheter une ? »", "en": "« Charger » means loading fares onto the card, not billing you. Ask instead: « Il faut en acheter une ? »", "es": "« Charger » significa cargar pasajes en la tarjeta, no cobrar. Pregunte mejor: « Il faut en acheter une ? »"}]]}, {"dit": "Oui, la carte coûte quelques dollars. Avec le titre, ça fait environ seize dollars.", "sens": {"en": "Yes, the card costs a few dollars. With the pass, it comes to about sixteen dollars.", "es": "Sí, la tarjeta cuesta unos dólares. Con el pase, son unos dieciséis dólares."}}, {"choix": [["Par carte. Pour aller à Mont-Royal, je prends quelle ligne ?", {"en": "By card. To get to Mont-Royal, which line do I take?", "es": "Con tarjeta. Para ir a Mont-Royal, ¿qué línea tomo?"}, null], ["Par carte. Pour aller à Mont-Royal, je prends quelle route ?", {"en": "By card. To get to Mont-Royal, which road do I take?", "es": "Con tarjeta. Para ir a Mont-Royal, ¿qué carretera tomo?"}, {"fr": "Faux ami : une « route », c'est une grande rue pour les voitures. Au métro, on parle de « ligne ».", "en": "False friend: a « route » is a road for cars. In the metro, you talk about a « ligne ».", "es": "Falso amigo: una « route » es una carretera. En el metro se habla de « ligne »."}], ["Avec crédit. Pour aller à Mont-Royal, c'est quelle ligne ?", {"en": "With credit. To get to Mont-Royal, which line is it?", "es": "Con crédito. Para ir a Mont-Royal, ¿qué línea es?"}, {"fr": "En français, on paie « par carte » ou « par carte de crédit ». « Avec crédit » ne se dit pas.", "en": "In French you pay « par carte » or « par carte de crédit ». « Avec crédit » isn't used.", "es": "En francés se paga « par carte » o « par carte de crédit ». « Avec crédit » no se dice."}]]}, {"dit": "Prenez la ligne orange, direction Côte-Vertu. C'est la deuxième station.", "sens": {"en": "Take the orange line, towards Côte-Vertu. It's the second stop.", "es": "Tome la línea naranja, dirección Côte-Vertu. Es la segunda estación."}}, {"choix": [["Direction Côte-Vertu, la deuxième station. Merci !", {"en": "Towards Côte-Vertu, the second stop. Thanks!", "es": "Dirección Côte-Vertu, la segunda estación. ¡Gracias!"}, null], ["Direction Montmorency, la deuxième station. Merci !", {"en": "Towards Montmorency, the second stop. Thanks!", "es": "Dirección Montmorency, la segunda estación. ¡Gracias!"}, {"fr": "Attention : Montmorency est l'autre bout de la ligne orange. La préposée a dit « direction Côte-Vertu ».", "en": "Careful: Montmorency is the other end of the orange line. She said « direction Côte-Vertu ».", "es": "Cuidado: Montmorency es el otro extremo de la línea naranja. Ella dijo « direction Côte-Vertu »."}], ["Direction Mont-Royal, la deuxième station. Merci !", {"en": "Towards Mont-Royal, the second stop. Thanks!", "es": "Dirección Mont-Royal, la segunda estación. ¡Gracias!"}, {"fr": "La direction porte le nom du terminus, la dernière station de la ligne, pas celui de votre arrêt.", "en": "The direction is named after the terminus, the last station on the line, not after your stop.", "es": "La dirección lleva el nombre de la terminal, la última estación de la línea, no el de su parada."}]]}, {"dit": "C'est ça. Bon séjour à Montréal !", "sens": {"en": "That's it. Enjoy your stay in Montréal!", "es": "Eso es. ¡Buena estancia en Montreal!"}}], "phrases": [["Je voudrais un titre de vingt-quatre heures.", {"en": "I'd like a twenty-four-hour pass.", "es": "Quisiera un pase de veinticuatro horas."}], ["Je n'en ai pas. Il faut en acheter une ?", {"en": "I don't have one. Do I need to buy one?", "es": "No tengo. ¿Hay que comprar una?"}], ["Pour aller à Mont-Royal, je prends quelle ligne ?", {"en": "To get to Mont-Royal, which line do I take?", "es": "Para ir a Mont-Royal, ¿qué línea tomo?"}], ["Direction Côte-Vertu.", {"en": "Towards Côte-Vertu.", "es": "Dirección Côte-Vertu."}]], "note": {"fr": "Dans le métro de Montréal, chaque ligne a une couleur et ses deux directions portent le nom de leur terminus. Repérez le nom de la dernière station avant de descendre sur le quai.", "en": "In the Montréal metro, each line has a colour and its two directions are named after the terminus. Find the name of the last station before you head down to the platform.", "es": "En el metro de Montreal, cada línea tiene un color y sus dos direcciones llevan el nombre de la terminal. Busque el nombre de la última estación antes de bajar al andén."}, "img": "metro", "son": true}, {"id": "demander-chemin", "lieu": "place-jacques-cartier", "titre": {"fr": "Demander son chemin", "en": "Asking for Directions", "es": "Preguntar el camino"}, "but": {"fr": "Sur la place Jacques-Cartier, demandez à une passante comment aller à la basilique Notre-Dame.", "en": "On Place Jacques-Cartier, ask a passer-by how to get to Notre-Dame Basilica.", "es": "En la Place Jacques-Cartier, pregunte a una transeúnte cómo llegar a la basílica de Notre-Dame."}, "perso": {"nom": "Une passante", "voix": "sylvie"}, "tours": [{"dit": "Vous avez l'air perdu. Je peux vous aider ?", "sens": {"en": "You look lost. Can I help you?", "es": "Parece perdido. ¿Le puedo ayudar?"}}, {"choix": [["Oui, merci. Où est la basilique Notre-Dame, s'il vous plaît ?", {"en": "Yes, thank you. Where is Notre-Dame Basilica, please?", "es": "Sí, gracias. ¿Dónde está la basílica de Notre-Dame, por favor?"}, null], ["Oui, merci. Où reste la basilique Notre-Dame, s'il vous plaît ?", {"en": "Yes, thank you. Where does Notre-Dame Basilica live, please?", "es": "Sí, gracias. ¿Dónde vive la basílica de Notre-Dame, por favor?"}, {"fr": "« Rester » ne veut pas dire « quedar ». Au Québec, « rester » veut même dire habiter. Dites : « Où est… ? »", "en": "« Rester » means to stay, and in Québec even to live somewhere. For a place, say « Où est… ? »", "es": "« Rester » no equivale a « quedar »: en Quebec significa incluso vivir. Para un lugar, diga « Où est… ? »"}], ["Oui, merci. Tu sais où est la basilique Notre-Dame ?", {"en": "Yes, thanks. Do you know where Notre-Dame Basilica is?", "es": "Sí, gracias. ¿Sabes dónde está la basílica de Notre-Dame?"}, {"fr": "Avec une inconnue qui vous vouvoie, répondez aussi avec « vous ». Le « tu » est pour les amis.", "en": "She's a stranger and she's using « vous », so use « vous » too. « Tu » is for friends.", "es": "Es una desconocida y le habla de « vous »: use « vous » también. « Tu » es para los amigos."}]]}, {"dit": "Ce n'est pas loin. Montez la place jusqu'à la rue Notre-Dame, puis tournez à gauche.", "sens": {"en": "It's not far. Walk up the square to rue Notre-Dame, then turn left.", "es": "No está lejos. Suba la plaza hasta la calle Notre-Dame y luego gire a la izquierda."}}, {"choix": [["Je monte, puis je tourne à gauche sur Notre-Dame ?", {"en": "I go up, then turn left on Notre-Dame?", "es": "¿Subo y luego giro a la izquierda en Notre-Dame?"}, null], ["Je monte, puis je tourne à droite sur Notre-Dame ?", {"en": "I go up, then turn right on Notre-Dame?", "es": "¿Subo y luego giro a la derecha en Notre-Dame?"}, {"fr": "Elle a dit « à gauche ». Retenez : « gauche », c'est left ; « droite », c'est right.", "en": "She said « à gauche ». Remember: « gauche » is left, « droite » is right.", "es": "Ella dijo « à gauche ». Recuerde: « gauche » es izquierda y « droite » es derecha."}], ["Je descends, puis je tourne à gauche sur Notre-Dame ?", {"en": "I go down, then turn left on Notre-Dame?", "es": "¿Bajo y luego giro a la izquierda en Notre-Dame?"}, {"fr": "Elle a dit « montez ». Dans le Vieux-Montréal, on descend vers le fleuve et on monte en s'en éloignant.", "en": "She said « montez », go up. In Old Montréal, you go down towards the river and up away from it.", "es": "Ella dijo « montez », suba. En el Viejo Montreal se baja hacia el río y se sube al alejarse de él."}]]}, {"dit": "C'est ça. Ensuite, continuez tout droit. La basilique est au coin de la rue Saint-Sulpice.", "sens": {"en": "That's right. Then keep going straight. The basilica is at the corner of rue Saint-Sulpice.", "es": "Eso es. Después, siga todo recto. La basílica está en la esquina de la calle Saint-Sulpice."}}, {"choix": [["Tout droit jusqu'au coin de Saint-Sulpice. C'est loin ?", {"en": "Straight to the corner of Saint-Sulpice. Is it far?", "es": "Todo recto hasta la esquina de Saint-Sulpice. ¿Está lejos?"}, null], ["Tout de suite jusqu'au coin de Saint-Sulpice. C'est loin ?", {"en": "Right away to the corner of Saint-Sulpice. Is it far?", "es": "Enseguida hasta la esquina de Saint-Sulpice. ¿Está lejos?"}, {"fr": "« Tout de suite » veut dire immédiatement. Pour la direction, c'est « tout droit ».", "en": "« Tout de suite » means right away, immediately. For direction, it's « tout droit », straight ahead.", "es": "« Tout de suite » significa enseguida. Para la dirección, es « tout droit », todo recto."}], ["Tout droit jusqu'au coin de Saint-Sulpice. C'est combien loin ?", {"en": "Straight to the corner of Saint-Sulpice. How far is it?", "es": "Todo recto hasta la esquina de Saint-Sulpice. ¿A qué distancia?"}, {"fr": "« Combien loin » est un calque de l'anglais. Dites simplement « C'est loin ? ».", "en": "« Combien loin » is a word-for-word copy of “how far”. Just say « C'est loin ? ».", "es": "« Combien loin » es una traducción literal del inglés. Diga simplemente « C'est loin ? »."}]]}, {"dit": "Non, c'est à cinq minutes à pied. Vous allez voir la place d'Armes juste devant.", "sens": {"en": "No, it's a five-minute walk. You'll see Place d'Armes right in front of it.", "es": "No, está a cinco minutos a pie. Va a ver la Place d'Armes justo enfrente."}}, {"choix": [["Cinq minutes à pied, parfait. Merci beaucoup, madame !", {"en": "A five-minute walk, perfect. Thank you very much, ma'am!", "es": "Cinco minutos a pie, perfecto. ¡Muchas gracias, señora!"}, null], ["Quinze minutes à pied, parfait. Merci beaucoup, madame !", {"en": "A fifteen-minute walk, perfect. Thank you very much, ma'am!", "es": "Quince minutos a pie, perfecto. ¡Muchas gracias, señora!"}, {"fr": "Elle a dit « cinq ». « Cinq » et « quinze » se ressemblent : écoutez bien le son « z » de « quinze ».", "en": "She said « cinq », five. « Cinq » and « quinze » sound alike: listen for the “z” in « quinze ».", "es": "Ella dijo « cinq », cinco. « Cinq » y « quinze » se parecen: fíjese en el sonido « z » de « quinze »."}], ["Cinq minutes sur pied, parfait. Merci beaucoup, madame !", {"en": "Five minutes “on foot”, word for word, perfect. Thank you, ma'am!", "es": "Cinco minutos « sobre pie », perfecto. ¡Gracias, señora!"}, {"fr": "En français, on dit « à pied ». « Sur pied » veut dire debout, ou remis d'une maladie.", "en": "In French, “on foot” is « à pied ». « Sur pied » means standing, or back on your feet after being sick.", "es": "En francés se dice « à pied », a pie. « Sur pied » significa de pie o recuperado de una enfermedad."}]]}, {"dit": "Avec plaisir. Bonne visite !", "sens": {"en": "My pleasure. Enjoy your visit!", "es": "Con mucho gusto. ¡Buena visita!"}}], "phrases": [["Où est la basilique Notre-Dame, s'il vous plaît ?", {"en": "Where is Notre-Dame Basilica, please?", "es": "¿Dónde está la basílica de Notre-Dame, por favor?"}], ["Je tourne à gauche ou à droite ?", {"en": "Do I turn left or right?", "es": "¿Giro a la izquierda o a la derecha?"}], ["Continuez tout droit jusqu'au coin de la rue.", {"en": "Keep going straight to the street corner.", "es": "Siga todo recto hasta la esquina."}], ["C'est à cinq minutes à pied.", {"en": "It's a five-minute walk.", "es": "Está a cinco minutos a pie."}]], "note": {"fr": "Dans le Vieux-Montréal, les rues montent en s'éloignant du fleuve. Les Montréalais disent donc « monter » et « descendre » autant que « à gauche » et « à droite ».", "en": "In Old Montréal, the streets rise as you move away from the river. So Montrealers say « monter » and « descendre », up and down, as often as left and right.", "es": "En el Viejo Montreal, las calles suben al alejarse del río. Por eso los montrealeses dicen « monter » y « descendre », subir y bajar, tanto como izquierda y derecha."}, "img": "place-jacques-cartier", "son": true}, {"id": "depanneur", "lieu": null, "titre": {"fr": "Au dépanneur", "en": "At the Corner Store", "es": "En la tienda de la esquina"}, "but": {"fr": "Au dépanneur, payez une bouteille d'eau, achetez deux timbres pour l'étranger et comptez votre monnaie.", "en": "At the corner store, pay for a bottle of water, buy two stamps for abroad and check your change.", "es": "En la tienda de la esquina, pague una botella de agua, compre dos sellos para el extranjero y revise su cambio."}, "perso": {"nom": "Le commis", "voix": "jean"}, "tours": [{"dit": "Bonjour ! C'est tout ce que vous prenez ?", "sens": {"en": "Hi! Is that everything you're getting?", "es": "¡Hola! ¿Es todo lo que lleva?"}}, {"choix": [["Oui, juste la bouteille d'eau. Vous vendez des timbres ?", {"en": "Yes, just the bottle of water. Do you sell stamps?", "es": "Sí, solo la botella de agua. ¿Vende sellos?"}, null], ["Oui, juste la bouteille d'eau. Vous vendez des tampons ?", {"en": "Yes, just the bottle of water. Do you sell tampons?", "es": "Sí, solo la botella de agua. ¿Vende tampones?"}, {"fr": "Un « tampon » sert à marquer un papier à l'encre, ou c'est un produit d'hygiène. Pour la poste, dites « des timbres ».", "en": "A « tampon » is a rubber stamp, or a hygiene product. For mail, say « des timbres ».", "es": "Un « tampon » es un sello de goma, o un producto de higiene. Para el correo, diga « des timbres »."}], ["Oui, juste la bouteille d'eau. Vous vendez des stamps ?", {"en": "Yes, just the bottle of water. Do you sell “stamps”?", "es": "Sí, solo la botella de agua. ¿Vende « stamps »?"}, {"fr": "« Stamp » est un mot anglais. En français, on dit « un timbre ».", "en": "« Stamp » is English. In French, it's « un timbre ».", "es": "« Stamp » es inglés. En francés se dice « un timbre »."}]]}, {"dit": "Oui. C'est pour le Canada ou pour l'étranger ?", "sens": {"en": "Yes. Is it for Canada or for abroad?", "es": "Sí. ¿Es para Canadá o para el extranjero?"}}, {"choix": [["Pour l'étranger. Deux timbres, s'il vous plaît.", {"en": "For abroad. Two stamps, please.", "es": "Para el extranjero. Dos sellos, por favor."}, null], ["Pour le Canada. Deux timbres, s'il vous plaît.", {"en": "For Canada. Two stamps, please.", "es": "Para Canadá. Dos sellos, por favor."}, {"fr": "Vos cartes partent hors du pays : c'est « pour l'étranger ». Ici, « étranger » veut dire abroad, pas strange.", "en": "Your cards are leaving the country, so it's « pour l'étranger ». Here « étranger » means abroad, not strange.", "es": "Sus postales salen del país: es « pour l'étranger ». Aquí « étranger » significa extranjero."}], ["Pour l'étranger. Donnez-moi deux timbres.", {"en": "For abroad. Give me two stamps.", "es": "Para el extranjero. Deme dos sellos."}, {"fr": "L'impératif seul sonne comme un ordre. Ajoutez « s'il vous plaît », tout simplement.", "en": "The bare command sounds like an order. Just add « s'il vous plaît ».", "es": "El imperativo solo suena a orden. Añada simplemente « s'il vous plaît »."}]]}, {"dit": "Voilà vos timbres. Voulez-vous un sac ?", "sens": {"en": "Here are your stamps. Would you like a bag?", "es": "Aquí tiene sus sellos. ¿Quiere una bolsa?"}}, {"choix": [["Non merci, pas besoin de sac. Je paie comptant.", {"en": "No thanks, I don't need a bag. I'll pay cash.", "es": "No, gracias, no necesito bolsa. Pago en efectivo."}, null], ["Non merci, pas besoin de bourse. Je paie comptant.", {"en": "No thanks, I don't need a stock exchange. I'll pay cash.", "es": "No, gracias, no necesito una bolsa de valores. Pago en efectivo."}, {"fr": "Faux ami : la « bourse », c'est la Bourse des valeurs ou une aide d'études. Pour vos achats, c'est « un sac ».", "en": "False friend for Spanish speakers: « bourse » is the stock exchange or a scholarship. For shopping, it's « un sac ».", "es": "Falso amigo: « bourse » es la bolsa de valores o una beca. Para las compras, es « un sac »."}], ["Non merci, pas besoin de sac. Je paie en effectif.", {"en": "No thanks, no bag. I'll pay in “effectif”.", "es": "No, gracias, no necesito bolsa. Pago « en effectif »."}, {"fr": "« En efectivo » ne se traduit pas mot à mot. En français, on paie « comptant ».", "en": "Spanish « en efectivo » doesn't translate word for word. In French, you pay « comptant », cash.", "es": "« En efectivo » no se traduce palabra por palabra. En francés se paga « comptant »."}]]}, {"dit": "Ça fait six dollars cinquante, avec les taxes.", "sens": {"en": "That's six fifty, with tax.", "es": "Son seis dólares con cincuenta, con impuestos."}}, {"choix": [["Six dollars cinquante. Voici un billet de dix.", {"en": "Six fifty. Here's a ten-dollar bill.", "es": "Seis con cincuenta. Aquí tiene un billete de diez."}, null], ["Seize dollars cinquante ? Voici un billet de vingt.", {"en": "Sixteen fifty? Here's a twenty-dollar bill.", "es": "¿Dieciséis con cincuenta? Aquí tiene un billete de veinte."}, {"fr": "Il a dit « six », pas « seize ». C'est le son « z » de « seize » qui fait la différence.", "en": "He said « six », not « seize », which is sixteen. The “z” sound makes the difference.", "es": "Dijo « six », seis, no « seize », dieciséis. El sonido « z » marca la diferencia."}], ["Six dollars cinquante. Voici une facture de dix.", {"en": "Six fifty. Here's an invoice for ten.", "es": "Seis con cincuenta. Aquí tiene una factura de diez."}, {"fr": "Faux ami : une « facture », c'est une note à payer. L'argent en papier, c'est « un billet ».", "en": "False friend: a « facture » is an invoice. A paper “bill” of money is « un billet ».", "es": "Una « facture » es una factura por pagar. El dinero en papel es « un billet »."}]]}, {"dit": "Merci. Voici votre monnaie, trois dollars cinquante. Bonne journée !", "sens": {"en": "Thanks. Here's your change, three fifty. Have a good day!", "es": "Gracias. Aquí tiene su cambio, tres con cincuenta. ¡Buen día!"}}], "phrases": [["Vous vendez des timbres ?", {"en": "Do you sell stamps?", "es": "¿Vende sellos?"}], ["Deux timbres pour l'étranger, s'il vous plaît.", {"en": "Two stamps for abroad, please.", "es": "Dos sellos para el extranjero, por favor."}], ["Non merci, pas besoin de sac.", {"en": "No thanks, I don't need a bag.", "es": "No, gracias, no necesito bolsa."}], ["Voici votre monnaie.", {"en": "Here's your change.", "es": "Aquí tiene su cambio."}]], "note": {"fr": "Le dépanneur, c'est l'épicerie du coin, souvent ouverte tard. On y trouve de la bière et du vin, mais les spiritueux se vendent à la Société des alcools du Québec.", "en": "The « dépanneur » is the corner store, often open late. It sells beer and wine, but spirits are sold at the Société des alcools du Québec.", "es": "El « dépanneur » es la tienda de la esquina, a menudo abierta hasta tarde. Vende cerveza y vino, pero los licores fuertes se venden en la Société des alcools du Québec."}, "img": "depanneur", "son": true}, {"id": "mbam", "lieu": "mbam", "titre": {"fr": "À la billetterie du musée", "en": "At the Museum Ticket Desk", "es": "En la taquilla del museo"}, "but": {"fr": "Achetez un billet adulte et un billet à tarif réduit, puis demandez où sont le vestiaire et l'exposition.", "en": "Buy one adult ticket and one reduced-price ticket, then ask where the coat check and the exhibition are.", "es": "Compre una entrada de adulto y una con tarifa reducida, y luego pregunte dónde están el guardarropa y la exposición."}, "perso": {"nom": "Le préposé à la billetterie", "voix": "thierry"}, "tours": [{"dit": "Bonjour, bienvenue au musée ! Combien de billets ?", "sens": {"en": "Hello, welcome to the museum! How many tickets?", "es": "¡Hola, bienvenido al museo! ¿Cuántas entradas?"}}, {"choix": [["Un billet adulte et un billet étudiant, s'il vous plaît.", {"en": "One adult ticket and one student ticket, please.", "es": "Una entrada de adulto y una de estudiante, por favor."}, null], ["Une billet adulte et une billet étudiant, s'il vous plaît.", {"en": "One adult ticket and one student ticket, please.", "es": "Una entrada de adulto y una de estudiante, por favor."}, {"fr": "« Billet » est masculin : on dit « un billet ».", "en": "« Billet » is masculine: say « un billet ».", "es": "« Billet » es masculino: se dice « un billet »."}], ["Un billet adulte et un billet estudiant, s'il vous plaît.", {"en": "One adult ticket and one “estudiant” ticket, please.", "es": "Una entrada de adulto y una « estudiant », por favor."}, {"fr": "Presque ! En français, on dit « étudiant », sans le « s » de l'espagnol.", "en": "Almost! In French the word is « étudiant », with no extra “s”.", "es": "¡Casi! En francés la palabra es « étudiant », sin la « s » del español."}]]}, {"dit": "Pour le tarif réduit, j'ai besoin de voir votre carte étudiante.", "sens": {"en": "For the reduced price, I need to see your student card.", "es": "Para la tarifa reducida, necesito ver su carné de estudiante."}}, {"choix": [["Bien sûr, la voici. Elle est encore valide.", {"en": "Of course, here it is. It's still valid.", "es": "Claro, aquí está. Todavía es válido."}, null], ["Bien sûr, le voici. Il est encore valide.", {"en": "Of course, here it is. It's still valid.", "es": "Claro, aquí está. Todavía es válido."}, {"fr": "« Carte » est féminin : « la voici », « elle est valide ».", "en": "« Carte » is feminine: « la voici », « elle est valide ».", "es": "« Carte » es femenino: « la voici », « elle est valide »."}], ["Bien sûr, la voici. Elle est encore vigente.", {"en": "Of course, here it is. It's still “vigente”.", "es": "Claro, aquí está. Todavía es « vigente »."}, {"fr": "« Vigente » est un mot espagnol. En français, une carte est « valide ».", "en": "« Vigente » is Spanish. In French, a card is « valide ».", "es": "« Vigente » es español. En francés, una tarjeta es « valide »."}]]}, {"dit": "Merci, c'est parfait. Voulez-vous laisser vos manteaux au vestiaire ?", "sens": {"en": "Thanks, that's fine. Would you like to leave your coats at the coat check?", "es": "Gracias, perfecto. ¿Quieren dejar sus abrigos en el guardarropa?"}}, {"choix": [["Oui. Où est le vestiaire, s'il vous plaît ?", {"en": "Yes. Where is the coat check, please?", "es": "Sí. ¿Dónde está el guardarropa, por favor?"}, null], ["Oui. Où est le vestibule, s'il vous plaît ?", {"en": "Yes. Where is the entrance hall, please?", "es": "Sí. ¿Dónde está el vestíbulo, por favor?"}, {"fr": "Le « vestibule », c'est l'entrée du bâtiment. Pour les manteaux, c'est le « vestiaire ».", "en": "The « vestibule » is the entrance hall. For coats, it's the « vestiaire ».", "es": "El « vestibule » es la entrada del edificio. Para los abrigos, es el « vestiaire »."}], ["Oui. Où est la garde-robe, s'il vous plaît ?", {"en": "Yes. Where is the closet, please?", "es": "Sí. ¿Dónde está el ropero, por favor?"}, {"fr": "Au Québec, la « garde-robe » est le placard de la maison. Dans un musée, on dit « le vestiaire ».", "en": "In Québec, a « garde-robe » is a closet at home. In a museum, it's « le vestiaire ».", "es": "En Quebec, la « garde-robe » es el armario de la casa. En un museo se dice « le vestiaire »."}]]}, {"dit": "Juste là, à votre gauche. Autre chose ?", "sens": {"en": "Right there, on your left. Anything else?", "es": "Justo ahí, a su izquierda. ¿Algo más?"}}, {"choix": [["Oui. L'exposition temporaire, c'est par où ?", {"en": "Yes. Which way is the temporary exhibition?", "es": "Sí. ¿Por dónde está la exposición temporal?"}, null], ["Oui. L'exhibition temporaire, c'est par où ?", {"en": "Yes. Which way is the temporary showing-off?", "es": "Sí. ¿Por dónde está la exhibición temporal?"}, {"fr": "Faux ami : une « exhibition » est une façon de se montrer. Au musée, on dit « une exposition ».", "en": "False friend: « exhibition » in French means showing off. At a museum, it's « une exposition ».", "es": "Falso amigo: « exhibition » en francés es exhibirse. En un museo se dice « une exposition »."}], ["Oui. L'exposition temporelle, c'est par où ?", {"en": "Yes. Which way is the time-related exhibition?", "es": "Sí. ¿Por dónde está la exposición del tiempo?"}, {"fr": "« Temporelle » parle du temps. Une exposition qui ne dure pas est « temporaire ».", "en": "« Temporelle » is about time itself. An exhibition that doesn't last is « temporaire ».", "es": "« Temporelle » se refiere al tiempo. Una exposición que no dura es « temporaire »."}]]}, {"dit": "Au deuxième étage. Prenez l'ascenseur au fond. Bonne visite !", "sens": {"en": "On the second floor. Take the elevator at the back. Enjoy your visit!", "es": "En el segundo piso. Tome el ascensor al fondo. ¡Buena visita!"}}], "phrases": [["Un billet adulte, s'il vous plaît.", {"en": "One adult ticket, please.", "es": "Una entrada de adulto, por favor."}], ["Avez-vous un tarif réduit ?", {"en": "Do you have a reduced price?", "es": "¿Tienen tarifa reducida?"}], ["Où est le vestiaire ?", {"en": "Where is the coat check?", "es": "¿Dónde está el guardarropa?"}], ["L'exposition, c'est par où ?", {"en": "Which way is the exhibition?", "es": "¿Por dónde está la exposición?"}]], "note": {"fr": "Dans les musées, le tarif réduit vise souvent les étudiants, les aînés et les jeunes : ayez une pièce d'identité avec vous. Le vestiaire est souvent obligatoire pour les gros sacs.", "en": "In museums, reduced prices often apply to students, seniors and young people, so carry ID. The coat check is often required for large bags.", "es": "En los museos, la tarifa reducida suele ser para estudiantes, personas mayores y jóvenes: lleve una identificación. El guardarropa suele ser obligatorio para las bolsas grandes."}, "img": "mbam", "son": true}, {"id": "restaurant", "lieu": "plateau", "titre": {"fr": "Souper au restaurant", "en": "Dinner at a Restaurant", "es": "Cenar en un restaurante"}, "but": {"fr": "Dans un restaurant « Apportez votre vin » du Plateau, demandez une table pour deux, commandez le plat du jour, signalez que vous ne mangez pas de noix et demandez l'addition séparée.", "en": "In a bring-your-own-wine restaurant on the Plateau, ask for a table for two, order the daily special, mention that you don't eat nuts and ask for separate bills.", "es": "En un restaurante « traiga su vino » del Plateau, pida una mesa para dos, pida el plato del día, avise que no come nueces y pida la cuenta por separado."}, "perso": {"nom": "La serveuse", "voix": "sylvie"}, "tours": [{"dit": "Bonsoir ! Vous êtes combien ?", "sens": {"en": "Good evening! How many of you are there?", "es": "¡Buenas noches! ¿Cuántos son?"}}, {"choix": [["Bonsoir ! Une table pour deux, s'il vous plaît.", {"en": "Good evening! A table for two, please.", "es": "¡Buenas noches! Una mesa para dos, por favor."}, null], ["Bonsoir ! Une mesa pour deux, s'il vous plaît.", {"en": "Good evening! A “mesa” for two, please.", "es": "¡Buenas noches! Una « mesa » para dos, por favor."}, {"fr": "« Mesa » est un mot espagnol. En français, c'est « une table ».", "en": "« Mesa » is Spanish. In French, it's « une table ».", "es": "« Mesa » es español. En francés es « une table »."}], ["Salut ! Une table pour deux, s'il vous plaît.", {"en": "Hi there! A table for two, please.", "es": "¡Hola! Una mesa para dos, por favor."}, {"fr": "« Salut » est familier, pour les amis. Avec une serveuse qui vous accueille, « Bonsoir » convient mieux.", "en": "« Salut » is casual, for friends. When a server greets you, « Bonsoir » fits better.", "es": "« Salut » es familiar, para amigos. Con una mesera que lo recibe, « Bonsoir » es mejor."}]]}, {"dit": "Suivez-moi. Ici, c'est « Apportez votre vin ». Avez-vous une bouteille ?", "sens": {"en": "Follow me. This is a bring-your-own-wine place. Do you have a bottle?", "es": "Síganme. Aquí es « traiga su vino ». ¿Tienen una botella?"}}, {"choix": [["Oui, on a apporté une bouteille de rouge.", {"en": "Yes, we brought a bottle of red.", "es": "Sí, trajimos una botella de tinto."}, null], ["Non, on veut acheter le vin ici, s'il vous plaît.", {"en": "No, we'd like to buy the wine here, please.", "es": "No, queremos comprar el vino aquí, por favor."}, {"fr": "« Apportez votre vin » veut dire que le restaurant ne vend pas d'alcool : on arrive avec sa bouteille.", "en": "« Apportez votre vin » means the restaurant doesn't sell alcohol: you bring your own bottle.", "es": "« Apportez votre vin » significa que el restaurante no vende alcohol: uno trae su botella."}], ["Oui, on a apporté un bouteille de rouge.", {"en": "Yes, we brought a bottle of red.", "es": "Sí, trajimos una botella de tinto."}, {"fr": "« Bouteille » est féminin : « une bouteille ».", "en": "« Bouteille » is feminine: « une bouteille ».", "es": "« Bouteille » es femenino: « une bouteille »."}]]}, {"dit": "Je vais l'ouvrir. Ce soir, le plat du jour, c'est un saumon grillé avec des légumes.", "sens": {"en": "I'll open it. Tonight's special is grilled salmon with vegetables.", "es": "Se la abro. Esta noche, el plato del día es salmón a la parrilla con verduras."}}, {"choix": [["Le plat du jour pour moi. Je ne mange pas de noix, par contre.", {"en": "The special for me. I don't eat nuts, though.", "es": "El plato del día para mí. Eso sí, no como nueces."}, null], ["Le plat du jour pour moi. Je ne mange pas des noix, par contre.", {"en": "The special for me. I don't eat nuts, though.", "es": "El plato del día para mí. Eso sí, no como nueces."}, {"fr": "Après une négation, « des » devient « de » : « je ne mange pas de noix ».", "en": "After a negative, « des » becomes « de »: « je ne mange pas de noix ».", "es": "Después de una negación, « des » se vuelve « de »: « je ne mange pas de noix »."}], ["L'entrée du jour pour moi. Je ne mange pas de noix, par contre.", {"en": "The starter of the day for me. I don't eat nuts, though.", "es": "La entrada del día para mí. Eso sí, no como nueces."}, {"fr": "Au Québec, « l'entrée » est le petit plat avant le repas, pas le plat principal. Dites « le plat du jour ».", "en": "In Québec, « l'entrée » is the starter, not the main course as in the United States. Say « le plat du jour ».", "es": "En Quebec, « l'entrée » es el entrante, no el plato principal. Diga « le plat du jour »."}]]}, {"dit": "C'est noté, il n'y a pas de noix dans ce plat. Pour l'addition, ce sera ensemble ou séparé ?", "sens": {"en": "Got it, there are no nuts in this dish. For the bill, together or separate?", "es": "Anotado, este plato no lleva nueces. Para la cuenta, ¿junta o por separado?"}}, {"choix": [["Séparé, s'il vous plaît. On paie chacun notre part.", {"en": "Separate, please. We'll each pay our share.", "es": "Por separado, por favor. Cada uno paga lo suyo."}, null], ["Séparé, s'il vous plaît. On va payer à la hollandaise.", {"en": "Separate, please. We'll go Dutch.", "es": "Por separado, por favor. Vamos a pagar a la holandesa."}, {"fr": "« Go Dutch » ne se traduit pas en français. Dites : « On paie chacun notre part. »", "en": "“Go Dutch” doesn't translate into French. Say « On paie chacun notre part ».", "es": "La expresión inglesa « go Dutch » no existe en francés. Diga « On paie chacun notre part »."}], ["La cuenta séparée, s'il vous plaît. Chacun sa part.", {"en": "The “cuenta” separate, please. Each our share.", "es": "La cuenta por separado, por favor. Cada uno lo suyo."}, {"fr": "« Cuenta » est un mot espagnol. Au restaurant, on dit « l'addition » ou, au Québec, « la facture ».", "en": "« Cuenta » is Spanish. At a restaurant, say « l'addition », or « la facture » in Québec.", "es": "« Cuenta » es español. En el restaurante se dice « l'addition » o, en Quebec, « la facture »."}]]}, {"dit": "Parfait, deux additions. Bon appétit !", "sens": {"en": "Perfect, two bills. Enjoy your meal!", "es": "Perfecto, dos cuentas. ¡Buen provecho!"}}], "phrases": [["Une table pour deux, s'il vous plaît.", {"en": "A table for two, please.", "es": "Una mesa para dos, por favor."}], ["Le plat
