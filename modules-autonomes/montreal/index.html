is-Hippolyte La Fontaine, un des pères du gouvernement responsable au Canada.", "en": "La Fontaine Park is not named after the French fable writer but after Louis-Hippolyte La Fontaine, one of the fathers of responsible government in Canada.", "es": "El parque La Fontaine no debe su nombre al famoso fabulista francés, sino a Louis-Hippolyte La Fontaine, uno de los padres del gobierno responsable en Canadá."}, "son": ["fr", "en", "es"]}, {"id": "mile-end", "cat": "quartier", "quartier": "Le Plateau-Mont-Royal", "metro": "Laurier", "adresse": "", "geo": [45.5235, -73.5995], "duree": 150, "nom": {"fr": "Le Mile End", "en": "Mile End", "es": "El Mile End"}, "bref": {"fr": "Murales, bagels chauds et cafés d'artistes : le quartier le plus créatif de la ville.", "en": "Murals, hot bagels and artists' cafés in the city's most creative corner.", "es": "Murales, bagels calientes y cafés de artistas en el rincón más creativo de la ciudad."}, "texte": {"fr": "Le Mile End est un village dans la ville, où plusieurs mondes se croisent sur le même trottoir. Des familles hassidiques, vêtues de noir, pressent le pas vers la synagogue. Des Italiens installés depuis des générations discutent au café. Et des musiciens, des graphistes et des créateurs de jeux vidéo travaillent dans les anciennes usines de textile.\n\nLevez les yeux : de grandes murales couvrent les murs de brique, surtout autour du boulevard Saint-Laurent. Puis suivez la rue Saint-Viateur et la rue Bernard, avec leurs petits cafés, leurs disquaires et leurs boutiques de seconde main.\n\nSurtout, goûtez un bagel de Montréal. Plus petit et plus dense que celui de New York, il est bouilli dans de l'eau miellée, puis cuit au four à bois. Deux boulangeries rivales, rue Saint-Viateur et rue Fairmount, les sortent chauds jour et nuit. Chaque Montréalais a sa préférée, et le débat ne sera jamais réglé.", "en": "Mile End is a village inside the city, where several worlds share the same sidewalk. Hasidic families dressed in black hurry to synagogue. Italian families who settled here generations ago argue over espresso. And musicians, graphic designers and video game makers work in old textile factories.\n\nLook up: huge murals cover the brick walls, especially around Saint-Laurent Boulevard. Then follow Saint-Viateur and Bernard streets, with their small cafés, record shops and second-hand boutiques.\n\nAbove all, taste a Montreal bagel. Smaller and denser than the New York kind, it is boiled in honey-sweetened water and then baked in a wood-fired oven. Two rival bakeries, on Saint-Viateur Street and on Fairmount Avenue, pull them out hot around the clock. Every Montrealer has a favourite, and the debate will never be settled. Buy one of each and decide for yourself.", "es": "El Mile End es un pueblo dentro de la ciudad, donde varios mundos comparten la misma acera. Familias jasídicas vestidas de negro caminan deprisa hacia la sinagoga. Familias italianas instaladas aquí hace generaciones conversan frente a un café. Y músicos, diseñadores gráficos y creadores de videojuegos trabajan en antiguas fábricas textiles.\n\nLevante la vista: grandes murales cubren las paredes de ladrillo, sobre todo cerca del bulevar Saint-Laurent. Luego siga las calles Saint-Viateur y Bernard, con sus pequeños cafés, tiendas de discos y locales de segunda mano.\n\nSobre todo, pruebe un bagel de Montreal. Más pequeño y denso que el de Nueva York, se hierve en agua con miel y luego se hornea en horno de leña. Dos panaderías rivales, en la calle Saint-Viateur y en la avenida Fairmount, los sacan calientes a toda hora. Cada montrealés tiene su favorita, y el debate nunca terminará."}, "conseil": {"fr": "Demandez vos bagels « sésame » ou « graines de pavot », mangez-en un tout de suite, encore tiède, et gardez les autres pour le lendemain au grille-pain.", "en": "Ask for sesame or poppy seed, eat one right away while it is still warm, and save the rest for tomorrow's toaster.", "es": "Pida los bagels de sésamo o de amapola, coma uno enseguida, todavía tibio, y guarde los demás para tostarlos al día siguiente."}, "anecdote": {"fr": "Fairmount Bagel, la doyenne des deux boulangeries rivales, a fêté ses cent ans en 2019.", "en": "Fairmount Bagel, the older of the two rival bakeries, celebrated its hundredth birthday in 2019.", "es": "Fairmount Bagel, la más antigua de las dos panaderías rivales, cumplió cien años en 2019."}, "son": ["fr", "en", "es"]}, {"id": "quartier-chinois", "cat": "quartier", "quartier": "Ville-Marie", "metro": "Place-d'Armes", "adresse": "", "geo": [45.5077, -73.5608], "duree": 90, "nom": {"fr": "Le Quartier chinois", "en": "Chinatown", "es": "El Barrio Chino"}, "bref": {"fr": "Portes monumentales, lanternes et dim sum à deux pas du Vieux-Montréal.", "en": "Grand ornamental gates, lanterns and dim sum steps from Old Montreal.", "es": "Puertas monumentales, farolillos y dim sum a dos pasos del Viejo Montreal."}, "texte": {"fr": "Vous entrez dans le Quartier chinois par l'une de ses grandes portes décorées, qu'on appelle des paifang. Il y en a quatre, et elles marquent les limites de ce petit quartier coincé entre le centre-ville et le Vieux-Montréal. Il est né à la fin du dix-neuvième siècle, quand des travailleurs chinois venus de l'Ouest canadien se sont installés ici.\n\nLe cœur du quartier, c'est la rue De La Gauchetière, piétonne sur sa partie la plus animée, et le boulevard Saint-Laurent. Flânez entre les épiceries remplies de fruits inconnus, les boulangeries de brioches au porc et les herboristes aux mille tiroirs.\n\nPour vivre le quartier comme ses habitants, venez le midi, surtout la fin de semaine, pour le dim sum. Des chariots passent entre les tables, chargés de petits paniers de vapeur. Vous pointez ce qui vous tente, et la serveuse coche votre carte. Simple, rapide, délicieux.", "en": "You enter Chinatown through one of its great ornamental gates, known as paifang. There are four of them, and they mark the edges of this small neighbourhood squeezed between downtown and Old Montreal. It took shape at the end of the nineteenth century, when Chinese workers arriving from Western Canada settled here.\n\nThe heart of the district is De La Gauchetière Street, pedestrian along its busiest stretch, and Saint-Laurent Boulevard. Wander past grocery stores full of fruit you may never have seen, bakeries selling barbecue pork buns, and herbalists with walls of tiny drawers.\n\nTo experience it like a local, come at midday, especially on the weekend, for dim sum. Carts roll between the tables, stacked with little bamboo steamers. You point at whatever looks good, and the server stamps your card. Simple, quick and delicious.", "es": "Usted entra al Barrio Chino por una de sus grandes puertas decoradas, llamadas paifang. Son cuatro, y marcan los límites de este pequeño barrio encajado entre el centro y el Viejo Montreal. Nació a finales del siglo diecinueve, cuando trabajadores chinos llegados del oeste de Canadá se establecieron aquí.\n\nEl corazón del barrio es la calle De La Gauchetière, peatonal en su tramo más animado, y el bulevar Saint-Laurent. Pasee entre tiendas de comestibles llenas de frutas desconocidas, panaderías de bollos de cerdo y herboristerías con cientos de cajoncitos.\n\nPara vivir el barrio como sus habitantes, venga al mediodía, sobre todo el fin de semana, a comer dim sum. Unos carritos pasan entre las mesas cargados de canastitas de vapor. Usted señala lo que le apetece y la mesera marca su tarjeta. Sencillo, rápido y delicioso."}, "conseil": {"fr": "Pour le dim sum de fin de semaine, arrivez avant onze heures trente : après, l'attente peut dépasser une demi-heure. Venez à plusieurs, vous goûterez plus de plats.", "en": "For weekend dim sum, arrive before eleven thirty, or expect to wait half an hour or more. Come as a group so you can try more dishes.", "es": "Para el dim sum del fin de semana, llegue antes de las once y media; después, la espera puede pasar de media hora. Venga en grupo para probar más platos."}, "anecdote": {"fr": "Au tournant des années 1980, la construction du complexe Guy-Favreau et du Palais des congrès a rasé une bonne partie de l'ancien Quartier chinois.", "en": "Around 1980, the construction of the Guy-Favreau federal complex and the Convention Centre flattened a large part of the old Chinatown.", "es": "Hacia 1980, la construcción del complejo federal Guy-Favreau y del Palacio de Congresos arrasó una gran parte del antiguo Barrio Chino."}, "son": ["fr", "en", "es"]}, {"id": "marche-jean-talon", "cat": "manger", "quartier": "Rosemont–La Petite-Patrie", "metro": "De Castelnau", "adresse": "7070, avenue Henri-Julien", "geo": [45.5363, -73.6148], "duree": 75, "nom": {"fr": "Marché Jean-Talon", "en": "Jean-Talon Market", "es": "Mercado Jean-Talon"}, "bref": {"fr": "Le plus grand marché à ciel ouvert de la ville, au cœur de la Petite-Italie.", "en": "The city's biggest open-air market, in the heart of Little Italy.", "es": "El mayor mercado al aire libre de la ciudad, en el corazón de la Pequeña Italia."}, "texte": {"fr": "Ouvert au début des années 1930, le marché Jean-Talon est le garde-manger des Montréalais. Des producteurs de partout au Québec y installent leurs étals toute l'année. L'été, les allées débordent de fraises, de maïs et de tomates. L'automne, place aux courges, aux pommes et aux paniers de champignons sauvages.\n\nPromenez-vous lentement, les vendeurs offrent souvent des morceaux à goûter. Autour des étals, des boutiques permanentes proposent fromages d'ici, charcuteries, épices du monde et produits de l'érable. Demandez un fromage québécois au lait cru : les fromagers adorent en parler.\n\nEn sortant, marchez quelques minutes vers le boulevard Saint-Laurent. Vous voilà dans la Petite-Italie, avec ses cafés où l'on boit l'espresso debout au comptoir, ses épiceries fines et ses terrasses animées les soirs de match de soccer. Visitez aussi l'église Notre-Dame-de-la-Défense et levez les yeux vers son plafond peint.", "en": "Opened in the early 1930s, Jean-Talon Market is Montreal's pantry. Farmers from all over Quebec set up their stalls here all year round. In summer, the aisles overflow with strawberries, corn and tomatoes. In autumn, it is squash, apples and baskets of wild mushrooms.\n\nTake your time: vendors often hand out samples. Around the open stalls, permanent shops sell local cheeses, cured meats, spices from around the world and maple products. Ask for a raw-milk Quebec cheese, since the cheesemongers love to talk about them.\n\nWhen you leave, walk a few minutes toward Saint-Laurent Boulevard. You are now in Little Italy, with cafés where people drink espresso standing at the counter, fine grocery stores, and patios that erupt on soccer nights. Step inside the church of Our Lady of the Defence and look up at its painted ceiling.", "es": "Inaugurado a principios de los años 1930, el mercado Jean-Talon es la despensa de los montrealeses. Productores de todo Quebec instalan aquí sus puestos durante todo el año. En verano, los pasillos rebosan de fresas, maíz y tomates. En otoño llegan las calabazas, las manzanas y las canastas de hongos silvestres.\n\nPasee sin prisa: los vendedores suelen ofrecer muestras. Alrededor de los puestos, tiendas permanentes venden quesos locales, embutidos, especias del mundo y productos de arce. Pida un queso quebequense de leche cruda; a los queseros les encanta hablar de ellos.\n\nAl salir, camine unos minutos hacia el bulevar Saint-Laurent. Estará en la Pequeña Italia, con sus cafés donde se toma el espresso de pie en la barra, sus tiendas gourmet y sus terrazas que estallan de alegría en las noches de fútbol. Entre también a la iglesia de Nuestra Señora de la Defensa y mire su techo pintado."}, "conseil": {"fr": "Venez en semaine le matin : les étals sont pleins, les allées calmes, et les producteurs ont le temps de vous parler. Apportez un sac réutilisable.", "en": "Come on a weekday morning, when the stalls are full, the aisles are calm and the farmers have time to chat. Bring a reusable bag.", "es": "Venga un día entre semana por la mañana: los puestos están llenos, los pasillos tranquilos y los productores tienen tiempo para conversar. Traiga una bolsa reutilizable."}, "commander": {"fr": "Un casseau de petits fruits de saison et un morceau de fromage québécois. Au comptoir : « Bonjour ! Qu'est-ce qui est bon cette semaine ? Je pourrais goûter, s'il vous plaît ? »", "en": "A basket of whatever berries are in season and a piece of Quebec cheese. At the stall, try: \"Bonjour ! Qu'est-ce qui est bon cette semaine ?\" — What's good this week?", "es": "Una cajita de frutos rojos de temporada y un trozo de queso quebequense. En el puesto, diga: «Bonjour ! Qu'est-ce qui est bon cette semaine ?», es decir, ¿qué está bueno esta semana?"}, "anecdote": {"fr": "Au plafond de l'église Notre-Dame-de-la-Défense, tout près, une fresque des années 1930 montre Mussolini à cheval, un vestige qui étonne encore les visiteurs.", "en": "On the ceiling of the nearby church of Our Lady of the Defence, a fresco from the 1930s shows Mussolini on horseback, a relic that still startles visitors.", "es": "En el techo de la cercana iglesia de Nuestra Señora de la Defensa, un fresco de los años 1930 muestra a Mussolini a caballo, un vestigio que todavía sorprende a los visitantes."}, "son": ["fr", "en", "es"]}, {"id": "marche-atwater", "cat": "manger", "quartier": "Le Sud-Ouest", "metro": "Lionel-Groulx", "adresse": "138, avenue Atwater", "geo": [45.4806, -73.5776], "duree": 60, "nom": {"fr": "Marché Atwater", "en": "Atwater Market", "es": "Mercado Atwater"}, "bref": {"fr": "Une tour Art déco, des bouchers de métier et le canal juste derrière.", "en": "An Art Deco clock tower, master butchers and the canal right out back.", "es": "Una torre art déco, carniceros de oficio y el canal justo detrás."}, "texte": {"fr": "On repère le marché Atwater de loin grâce à sa haute tour à horloge. Le bâtiment a été inauguré en 1933, en pleine crise économique, dans le style Art déco alors à la mode. Il se dresse entre le quartier Saint-Henri et le canal de Lachine, à deux pas du métro.\n\nÀ l'intérieur, le rez-de-chaussée appartient aux bouchers, aux poissonniers, aux fromagers et aux boulangers. Certains commerces sont des affaires de famille depuis longtemps. Dehors, dès le printemps, les producteurs installent leurs fleurs, leurs fruits et leurs légumes le long des halles.\n\nLe marché est plus petit et plus tranquille que celui de Jean-Talon, et c'est son charme. Composez-vous un repas : un pain croûté, un fromage, quelques tranches de charcuterie. Puis traversez vers le canal et installez-vous sur la pelouse, face à l'eau. Les cyclistes passent, les bateaux aussi, et le temps ralentit.", "en": "You can spot Atwater Market from a distance thanks to its tall clock tower. The building opened in 1933, in the middle of the Great Depression, in the Art Deco style that was fashionable at the time. It stands between the Saint-Henri neighbourhood and the Lachine Canal, a short walk from the metro.\n\nInside, the ground floor belongs to butchers, fishmongers, cheesemongers and bakers. Some of these shops have been family businesses for a long time. Outside, from spring onward, farmers line the building with flowers, fruit and vegetables.\n\nThe market is smaller and calmer than Jean-Talon, and that is part of its charm. Put together a meal: a crusty loaf, a local cheese, a few slices of charcuterie. Then cross over to the canal and settle on the grass facing the water. Cyclists pedal by, boats drift past, and time slows down.", "es": "El mercado Atwater se reconoce de lejos por su alta torre con reloj. El edificio se inauguró en 1933, en plena Gran Depresión, con el estilo art déco que estaba de moda. Se levanta entre el barrio de Saint-Henri y el canal de Lachine, a pocos pasos del metro.\n\nAdentro, la planta baja es territorio de carniceros, pescaderos, queseros y panaderos. Algunos de estos negocios son empresas familiares desde hace mucho tiempo. Afuera, a partir de la primavera, los productores rodean el edificio con flores, frutas y verduras.\n\nEl mercado es más pequeño y tranquilo que el de Jean-Talon, y ahí está su encanto. Arme su propio almuerzo: un pan crujiente, un queso local, unas lonchas de embutido. Luego cruce hacia el canal y siéntese en el césped frente al agua. Pasan los ciclistas, pasan los barcos, y el tiempo se detiene."}, "conseil": {"fr": "Les bouchers d'Atwater sont réputés pour leurs saucisses maison : achetez-en quelques-unes pour un pique-nique ou un barbecue.", "en": "Atwater's butchers are known for their house-made sausages: pick up a few for a picnic or a barbecue.", "es": "Los carniceros de Atwater son famosos por sus salchichas caseras: compre algunas para un pícnic o una parrillada."}, "commander": {"fr": "Une saucisse maison, un morceau de cheddar vieilli du Québec et une baguette. Au comptoir : « Bonjour ! Je vais prendre deux saucisses, s'il vous plaît. Lesquelles me conseillez-vous ? »", "en": "A house-made sausage, a wedge of aged Quebec cheddar and a baguette. At the counter: \"Bonjour ! Lesquelles me conseillez-vous ?\" — Which ones do you recommend?", "es": "Una salchicha casera, un trozo de cheddar añejo de Quebec y una baguette. En el mostrador: «Bonjour ! Lesquelles me conseillez-vous ?», es decir, ¿cuáles me recomienda?"}, "anecdote": {"fr": "À l'étage, une immense salle a longtemps accueilli des expositions, des matchs de lutte et des assemblées politiques enflammées.", "en": "Upstairs, a huge hall once hosted exhibitions, wrestling matches and fiery political rallies.", "es": "En el piso de arriba, un enorme salón acogió durante años exposiciones, combates de lucha libre y mítines políticos encendidos."}, "son": ["fr", "en", "es"]}, {"id": "romados", "cat": "manger", "quartier": "Le Plateau-Mont-Royal", "metro": "Mont-Royal", "adresse": "115, rue Rachel Est", "geo": [45.5194, -73.5806], "duree": 45, "nom": {"fr": "Romados", "en": "Romados", "es": "Romados"}, "bref": {"fr": "Le poulet grillé portugais que tout le Plateau fait la file pour manger.", "en": "The Portuguese grilled chicken the whole Plateau lines up for.", "es": "El pollo asado portugués por el que todo el Plateau hace fila."}, "texte": {"fr": "Au coin de la rue Rachel, à deux pas du boulevard Saint-Laurent, se trouve l'une des adresses les plus aimées du Plateau. Romados est une rôtisserie et une boulangerie portugaise, dans ce qui fut longtemps le cœur de la communauté portugaise de Montréal. Tout près, le petit parc du Portugal rappelle cette histoire.\n\nIci, pas de décor chic. On fait la file, on commande au comptoir, et on regarde les poulets griller sur le charbon de bois. Ils arrivent dorés, un peu fumés, et arrosés de sauce piquante si vous le voulez. Avec des frites assaisonnées et une salade, c'est un repas simple et généreux.\n\nGardez de la place pour le dessert. Dans la vitrine, les pastéis de nata, ces petits flans à la crème dans une pâte feuilletée croustillante, sortent du four toute la journée. Plusieurs Montréalais traversent la ville juste pour eux. Les places assises sont rares : emportez votre repas au parc Jeanne-Mance, à quelques rues.", "en": "On Rachel Street, just off Saint-Laurent Boulevard, you will find one of the Plateau's best-loved spots. Romados is a Portuguese rotisserie and bakery, in what was long the heart of Montreal's Portuguese community. Nearby, the little Parc du Portugal still tells that story.\n\nThere is no fancy decor. You line up, order at the counter and watch the chickens sizzle over charcoal. They come out golden and a little smoky, brushed with hot sauce if you like. With seasoned fries and a salad, it is a simple, generous meal.\n\nSave room for dessert. In the display case, pastéis de nata, small custard tarts in crisp, flaky pastry, come out of the oven all day long. Plenty of Montrealers cross the city just for them. Seats are scarce, so take your meal to Jeanne-Mance Park, a few blocks away, and eat on the grass with a view of the mountain.", "es": "En la calle Rachel, junto al bulevar Saint-Laurent, está uno de los lugares más queridos del Plateau. Romados es una rosticería y panadería portuguesa, en lo que fue durante mucho tiempo el corazón de la comunidad portuguesa de Montreal. Muy cerca, el pequeño Parc du Portugal recuerda esa historia.\n\nAquí no hay decoración elegante. Se hace fila, se pide en el mostrador y se mira cómo los pollos se asan sobre el carbón. Salen dorados, un poco ahumados y, si usted quiere, bañados en salsa picante. Con papas fritas sazonadas y ensalada, es una comida sencilla y abundante.\n\nGuarde lugar para el postre. En la vitrina, los pastéis de nata, pequeñas tartas de crema en un hojaldre crujiente, salen del horno todo el día. Muchos montrealeses cruzan la ciudad solo por ellos. Hay pocos asientos: lleve su comida al parque Jeanne-Mance, a unas cuadras, y coma sobre el césped frente a la montaña."}, "conseil": {"fr": "Évitez l'heure du souper : la file sort souvent sur le trottoir. Venez en milieu d'après-midi et prévoyez de l'argent comptant, au cas où.", "en": "Avoid the dinner rush, when the line often spills onto the sidewalk. Come mid-afternoon, and carry some cash just in case.", "es": "Evite la hora de la cena, cuando la fila suele salir hasta la acera. Venga a media tarde y lleve algo de efectivo, por si acaso."}, "commander": {"fr": "Un demi-poulet grillé avec frites et salade, sauce piquante à part, et deux pastéis de nata. Au comptoir : « Bonjour ! Un demi-poulet, frites et salade, avec la sauce piquante à part, s'il vous plaît. Et deux pastéis de nata. »", "en": "A half chicken with fries and salad, hot sauce on the side, plus two pastéis de nata. At the counter: \"Un demi-poulet, frites et salade, s'il vous plaît.\" — Half a chicken with fries and salad, please.", "es": "Medio pollo con papas fritas y ensalada, salsa picante aparte, y dos pastéis de nata. En el mostrador: «Un demi-poulet, frites et salade, s'il vous plaît», es decir, medio pollo con papas y ensalada, por favor."}, "anecdote": {"fr": "Le parc du Portugal, à l'angle de Saint-Laurent et de Marie-Anne, est orné d'azulejos, ces carreaux de céramique bleus typiques de Lisbonne.", "en": "Parc du Portugal, at the corner of Saint-Laurent and Marie-Anne, is decorated with azulejos, the blue ceramic tiles typical of Lisbon.", "es": "El Parc du Portugal, en la esquina de Saint-Laurent y Marie-Anne, está decorado con azulejos, las baldosas azules de cerámica típicas de Lisboa."}, "son": ["fr", "en", "es"]}, {"id": "schwartz", "cat": "manger", "quartier": "Plateau-Mont-Royal", "metro": "Sherbrooke", "adresse": "3895, boulevard Saint-Laurent", "geo": [45.5163, -73.5777], "duree": 60, "nom": {"fr": "Schwartz's", "en": "Schwartz's", "es": "Schwartz's"}, "bref": {"fr": "Le smoked meat le plus célèbre de la Main, tranché à la main depuis 1928.", "en": "The Main's most famous smoked meat, hand-sliced since 1928.", "es": "El smoked meat más famoso de la Main, cortado a mano desde 1928."}, "texte": {"fr": "Sur le boulevard Saint-Laurent, que les Montréalais appellent la Main, une file s'allonge presque chaque jour devant une devanture modeste. C'est Schwartz's, une charcuterie hébraïque ouverte en 1928 par un immigrant juif de Roumanie. On y sert le smoked meat, une poitrine de bœuf marinée dans les épices pendant plusieurs jours, puis fumée et cuite à la vapeur.\n\nLa salle est étroite et bruyante. On s'assoit souvent à côté d'inconnus, et le serveur arrive vite. La viande est tranchée à la main, empilée haut entre deux tranches de pain de seigle, avec un peu de moutarde. Le secret, disent les habitués, c'est le choix du gras : maigre, medium ou gras. Le medium offre le meilleur équilibre entre tendreté et saveur.\n\nLe rituel se complète avec un gros cornichon à l'aneth, des frites, et une boisson gazeuse à la cerise noire, le compagnon traditionnel de la maison. Ici, rien n'a vraiment changé depuis des générations, et c'est exactement ce que l'on vient chercher.", "en": "On Saint-Laurent Boulevard, which locals simply call the Main, a line forms almost every day outside a plain little storefront. This is Schwartz's, a Hebrew delicatessen opened in 1928 by a Jewish immigrant from Romania. Its specialty is smoked meat: beef brisket cured in spices for days, then smoked and steamed until it practically melts.\n\nThe room is narrow, noisy and wonderfully cramped. You will probably share a table with strangers, and the waiter will not keep you waiting. The meat is sliced by hand and piled high on rye bread with a thin layer of yellow mustard. Regulars will tell you that the real decision is the fat: lean, medium or fatty. Medium is the classic choice, tender and full of flavour.\n\nComplete the ritual with a big dill pickle, a side of fries and a black cherry soda, the house's traditional pairing. Very little has changed here in generations, and that is exactly the point.", "es": "Sobre el bulevar Saint-Laurent, que los montrealeses llaman simplemente la Main, casi todos los días se forma una fila frente a una fachada muy sencilla. Es Schwartz's, una charcutería judía abierta en 1928 por un inmigrante llegado de Rumania. Su especialidad es el smoked meat: pecho de res marinado varios días en especias, luego ahumado y cocido al vapor.\n\nEl local es angosto y ruidoso. Es muy probable que usted comparta la mesa con desconocidos, y el mesero llega enseguida. La carne se corta a mano y se apila bien alto sobre pan de centeno, con un poco de mostaza. Según los clientes de toda la vida, la verdadera decisión es la grasa: magra, media o grasosa. La media es la elección clásica, tierna y llena de sabor.\n\nPara completar el ritual, pida un pepinillo grande al eneldo, papas fritas y un refresco de cereza negra, el acompañante tradicional de la casa. Aquí casi nada ha cambiado en varias generaciones, y eso es justamente lo que uno viene a buscar."}, "conseil": {"fr": "Évitez l'heure du dîner et le samedi soir. Si vous êtes pressé, le comptoir de la boutique d'à côté vend le même smoked meat pour emporter.", "en": "Skip the lunch rush and Saturday nights. In a hurry? The take-out counter next door sells the same smoked meat to go.", "es": "Evite la hora del almuerzo y los sábados por la noche. Si tiene prisa, el mostrador para llevar de al lado vende el mismo smoked meat."}, "commander": {"fr": "Un sandwich smoked meat medium, un cornichon, des frites et un cola à la cerise noire. Au serveur : « Un smoked meat medium, s'il vous plaît, avec un cornichon. »", "en": "A medium smoked meat sandwich, a pickle, fries and a black cherry soda. Tell the waiter: \"Un smoked meat medium, s'il vous plaît, avec un cornichon.\"", "es": "Un sándwich de smoked meat medio, un pepinillo, papas fritas y un refresco de cereza negra. Diga al mesero: « Un smoked meat medium, s'il vous plaît, avec un cornichon. »"}, "anecdote": {"fr": "En 2012, un groupe d'investisseurs comprenant René Angélil et Céline Dion a racheté Schwartz's.", "en": "In 2012, a group of investors including René Angélil and Céline Dion bought Schwartz's.", "es": "En 2012, un grupo de inversionistas que incluía a René Angélil y Céline Dion compró Schwartz's."}, "son": ["fr", "en", "es"]}, {"id": "bagels", "cat": "manger", "quartier": "Mile End", "metro": "Laurier", "adresse": "263, rue Saint-Viateur Ouest", "geo": [45.5228, -73.6027], "duree": 30, "nom": {"fr": "Les bagels du Mile End : St-Viateur et Fairmount", "en": "Mile End Bagels: St-Viateur and Fairmount", "es": "Los bagels del Mile End: St-Viateur y Fairmount"}, "bref": {"fr": "Deux fours à bois, deux rivaux, et le bagel le plus montréalais qui soit.", "en": "Two wood-fired ovens, two rivals, and the most Montreal bagel there is.", "es": "Dos hornos de leña, dos rivales y el bagel más montrealés que existe."}, "texte": {"fr": "Le bagel de Montréal ne ressemble pas à celui de New York. Il est plus petit, plus dense, un peu sucré, avec un grand trou au centre. Sa recette a été apportée par des boulangers juifs d'Europe de l'Est, installés dans le Mile End au siècle dernier.\n\nTout se joue en deux gestes. D'abord, la pâte roulée à la main est plongée quelques instants dans une eau bouillante sucrée au miel. Ensuite, les bagels sont enfournés sur de longues planches dans un four à bois, qui leur donne une croûte dorée et un goût légèrement fumé. Derrière le comptoir, vous verrez les boulangers travailler sans relâche, souvent jour et nuit.\n\nDeux adresses se disputent le titre du meilleur bagel : St-Viateur Bagel, sur la rue du même nom, et Fairmount Bagel, à quelques rues de là. Les Montréalais ont chacun leur camp. Le plus simple est de goûter aux deux, encore chauds, et de décider vous-même.", "en": "A Montreal bagel is nothing like its New York cousin. It is smaller, denser and slightly sweet, with a generous hole in the middle. The recipe came with Jewish bakers from Eastern Europe who settled in Mile End in the last century.\n\nEverything happens in two steps. First, hand-rolled dough is dipped briefly in boiling water sweetened with honey. Then the bagels slide into a wood-fired oven on long wooden planks, which gives them a golden crust and a faint smoky taste. From the counter, you can watch the bakers at work, often around the clock.\n\nTwo shops compete for the title of best bagel in town: St-Viateur Bagel, on the street of the same name, and Fairmount Bagel, just a few blocks away. Every Montrealer has picked a side. The best plan is to try both while they are still warm, and settle the debate yourself.", "es": "El bagel de Montreal no se parece al de Nueva York. Es más pequeño, más denso y ligeramente dulce, con un agujero grande en el centro. La receta llegó con panaderos judíos de Europa del Este que se instalaron en el Mile End el siglo pasado.\n\nTodo ocurre en dos pasos. Primero, la masa enrollada a mano se sumerge unos instantes en agua hirviendo endulzada con miel. Después, los bagels entran en un horno de leña sobre largas tablas de madera, que les da una corteza dorada y un sabor apenas ahumado. Desde el mostrador, usted puede ver a los panaderos trabajar sin descanso, muchas veces día y noche.\n\nDos panaderías se disputan el título del mejor bagel: St-Viateur Bagel, en la calle del mismo nombre, y Fairmount Bagel, a pocas cuadras. Cada montrealés tiene su favorito. Lo mejor es probar los dos, todavía calientes, y decidir usted mismo."}, "conseil": {"fr": "Achetez une douzaine et mangez-en un tout de suite, dans la rue : un bagel se goûte chaud. Apportez de l'argent comptant, au cas où.", "en": "Buy a dozen and eat one right away on the sidewalk: a bagel is best warm. Bring some cash, just in case.", "es": "Compre una docena y coma uno enseguida en la acera: el bagel se disfruta caliente. Lleve algo de efectivo, por si acaso."}, "commander": {"fr": "Le sésame est le classique, le pavot vient juste après. Au comptoir : « Une douzaine au sésame, s'il vous plaît, avec un petit pot de fromage à la crème. »", "en": "Sesame is the classic, poppy seed the runner-up. At the counter: \"Une douzaine au sésame, s'il vous plaît.\"", "es": "El de sésamo es el clásico; el de amapola, la alternativa. En el mostrador: « Une douzaine au sésame, s'il vous plaît. »"}, "anecdote": {"fr": "En 2008, l'astronaute Gregory Chamitoff, qui a grandi à Montréal, a emporté des bagels de Fairmount jusqu'à la Station spatiale internationale.", "en": "In 2008, astronaut Gregory Chamitoff, who grew up in Montreal, took Fairmount bagels with him to the International Space Station.", "es": "En 2008, el astronauta Gregory Chamitoff, que creció en Montreal, llevó bagels de Fairmount a la Estación Espacial Internacional."}, "son": ["fr", "en", "es"]}, {"id": "la-banquise", "cat": "manger", "quartier": "Plateau-Mont-Royal", "metro": "Mont-Royal", "adresse": "994, rue Rachel Est", "geo": [45.5254, -73.5746], "duree": 45, "nom": {"fr": "La Banquise", "en": "La Banquise", "es": "La Banquise"}, "bref": {"fr": "La poutine à toute heure, à deux pas du parc La Fontaine.", "en": "Poutine at any hour, steps from La Fontaine Park.", "es": "Poutine a cualquier hora, a dos pasos del parque La Fontaine."}, "texte": {"fr": "Impossible de quitter le Québec sans goûter à la poutine. C'est un plat tout simple : des frites, des morceaux de fromage en grains et une sauce brune bien chaude versée par-dessus. Le fromage doit être frais, assez pour faire « squick squick » sous la dent, et la sauce le fait fondre juste un peu.\n\nNée dans les campagnes du Québec à la fin des années cinquante, la poutine a longtemps été moquée avant de devenir un symbole national. À Montréal, l'adresse la plus connue est La Banquise, rue Rachel, tout près du parc La Fontaine. Ouverte jour et nuit, elle nourrit aussi bien les familles du dimanche que les fêtards de trois heures du matin.\n\nLe menu propose des dizaines de versions, garnies de saucisse, de bacon, de légumes ou de viande fumée. La salle est colorée, sans prétention, et souvent pleine. Commencez par la classique : c'est elle qui vous fera comprendre pourquoi les Québécois en sont si fiers.", "en": "You cannot leave Quebec without trying poutine. It is a simple dish: French fries, fresh cheese curds and hot brown gravy poured over the top. The curds should be fresh enough to squeak against your teeth, and the gravy should melt them only a little.\n\nPoutine was born in rural Quebec in the late nineteen fifties. For years it was mocked, and today it is a point of national pride. In Montreal, the best-known address is La Banquise, on Rachel Street, right by La Fontaine Park. It is open day and night, feeding Sunday families and three in the morning party crowds alike.\n\nThe menu lists dozens of versions, topped with sausage, bacon, vegetables or smoked meat. The dining room is bright, casual and usually packed. Start with the classic: one bite and you will understand why Quebecers are so proud of it.", "es": "No se puede salir de Quebec sin probar la poutine. Es un plato muy sencillo: papas fritas, trocitos de queso fresco en grano y una salsa oscura bien caliente por encima. El queso debe estar tan fresco que rechine un poco al morderlo, y la salsa apenas debe derretirlo.\n\nLa poutine nació en el campo quebequense a finales de los años cincuenta. Durante mucho tiempo fue objeto de burlas, y hoy es un orgullo nacional. En Montreal, la dirección más conocida es La Banquise, en la calle Rachel, junto al parque La Fontaine. Abre día y noche, y recibe tanto a familias el domingo como a quienes salen de fiesta a las tres de la mañana.\n\nEl menú ofrece decenas de versiones, con salchicha, tocino, verduras o carne ahumada. El local es colorido, informal y casi siempre está lleno. Empiece por la clásica: con un bocado entenderá por qué los quebequenses están tan orgullosos de ella."}, "conseil": {"fr": "Une petite portion suffit souvent pour une personne. Passez ensuite digérer au parc La Fontaine, à deux minutes à pied.", "en": "A small portion is usually plenty for one. Walk it off afterwards in La Fontaine Park, two minutes away.", "es": "Una porción pequeña suele bastar para una persona. Después, camine un poco por el parque La Fontaine, a dos minutos."}, "commander": {"fr": "La poutine classique pour commencer, puis une version garnie si vous êtes plusieurs. Au serveur : « Une poutine classique, petite, s'il vous plaît. »", "en": "The classic poutine first, then a loaded version to share. Tell the server: \"Une poutine classique, petite, s'il vous plaît.\"", "es": "Primero la poutine clásica, luego una con ingredientes para compartir. Diga al mesero: « Une poutine classique, petite, s'il vous plaît. »"}, "anecdote": {"fr": "La Banquise a commencé en 1968 comme simple comptoir à crème glacée, d'où son nom.", "en": "La Banquise, French for \"ice floe\", opened in 1968 as an ice cream stand.", "es": "La Banquise, que significa \"banco de hielo\", abrió en 1968 como heladería."}, "son": ["fr", "en", "es"]}, {"id": "wilenskys", "cat": "manger", "quartier": "Mile End", "metro": "Laurier", "adresse": "34, avenue Fairmount Ouest", "geo": [45.5233, -73.5948], "duree": 20, "nom": {"fr": "Wilensky's Light Lunch", "en": "Wilensky's Light Lunch", "es": "Wilensky's Light Lunch"}, "bref": {"fr": "Un comptoir figé dans le temps et un sandwich qui a ses propres règles.", "en": "A lunch counter frozen in time, and a sandwich with rules of its own.", "es": "Un mostrador detenido en el tiempo y un sándwich con reglas propias."}, "texte": {"fr": "Au coin de la rue Clark et de l'avenue Fairmount, un petit casse-croûte semble avoir oublié de changer d'époque. Wilensky's Light Lunch occupe ce local depuis 1952. Quelques tabourets devant un long comptoir, une vieille caisse, des bouteilles de soda qu'on prépare encore à la main : le décor n'a presque pas bougé.\n\nLa vedette de la maison s'appelle le Special. C'est un pain kaiser garni de salami et de saucisson de bologne, pressé et grillé sur la plaque. Il obéit à deux règles célèbres. On ne le coupe jamais en deux, et on y met toujours de la moutarde. Si vous la refusez, on vous le fera payer un peu plus cher, avec le sourire.\n\nL'endroit a inspiré le romancier Mordecai Richler, qui a grandi dans le quartier, et il est apparu au cinéma. Ici, on vient moins pour un repas que pour un moment de l'histoire du Mile End.", "en": "At the corner of Clark Street and Fairmount Avenue, a tiny lunch counter seems to have forgotten to change with the times. Wilensky's Light Lunch has been in this spot since 1952. A few stools along a long counter, an old cash register, sodas still mixed by hand: the place has barely changed.\n\nThe star of the house is the Special. It is a kaiser roll filled with salami and bologna, pressed and grilled on the flat top. It comes with two famous rules. It is never cut in half, and it always gets mustard. Ask for it without mustard and you will pay a little extra, with a smile.\n\nThe counter inspired the novelist Mordecai Richler, who grew up in the neighbourhood, and it has appeared on the big screen. People come here less for a meal than for a small, delicious piece of Mile End history.", "es": "En la esquina de la calle Clark y la avenida Fairmount, un pequeño local de comidas parece haberse olvidado de cambiar de época. Wilensky's Light Lunch ocupa este lugar desde 1952. Unos cuantos taburetes frente a un largo mostrador, una caja registradora antigua y refrescos que todavía se preparan a mano: casi nada ha cambiado.\n\nLa estrella de la casa se llama el Special. Es un pan kaiser relleno de salami y mortadela, prensado y dorado en la plancha. Tiene dos reglas famosas. Nunca se corta por la mitad, y siempre lleva mostaza. Si usted la rechaza, le cobrarán un poco más, eso sí, con una sonrisa.\n\nEl lugar inspiró al novelista Mordecai Richler, que creció en el barrio, y ha aparecido en el cine. Aquí uno viene menos por la comida que por un pedacito sabroso de la historia del Mile End."}, "conseil": {"fr": "La place est limitée : prenez votre Special au comptoir ou pour emporter, et marchez jusqu'aux bagels de la rue voisine.", "en": "Seating is limited: eat at the counter or take it to go, then walk over to the bagel shops nearby.", "es": "Hay poco espacio: coma en el mostrador o pídalo para llevar, y luego camine hasta las panaderías de bagels cercanas."}, "commander": {"fr": "Un Special, un cornichon et un soda à la fontaine, cerise ou cola. Au comptoir : « Un Special et un soda à la cerise, s'il vous plaît. »", "en": "A Special, a pickle and a fountain soda, cherry or cola. At the counter: \"Un Special et un soda à la cerise, s'il vous plaît.\"", "es": "Un Special, un pepinillo y un refresco de fuente, de cereza o cola. En el mostrador: « Un Special et un soda à la cerise, s'il vous plaît. »"}, "anecdote": {"fr": "Le casse-croûte apparaît dans le film L'apprentissage de Duddy Kravitz, tiré du roman de Mordecai Richler.", "en": "The counter appears in The Apprenticeship of Duddy Kravitz, the film based on Mordecai Richler's novel.", "es": "El local aparece en la película The Apprenticeship of Duddy Kravitz, basada en la novela de Mordecai Richler."}, "son": ["fr", "en", "es"]}, {"id": "orange-julep", "cat": "manger", "quartier": "Côte-des-Neiges–Notre-Dame-de-Grâce", "metro": "Namur", "adresse": "7700, boulevard Décarie", "geo": [45.4957, -73.6568], "duree": 30, "nom": {"fr": "L'Orange Julep", "en": "Orange Julep", "es": "Orange Julep"}, "bref": {"fr": "Une orange géante au bord de l'autoroute, et une boisson mousseuse au goût d'été.", "en": "A giant orange by the expressway, and a frothy drink that tastes like summer.", "es": "Una naranja gigante junto a la autopista y una bebida espumosa con sabor a verano."}, "texte": {"fr": "Le long du boulevard Décarie, entre deux voies rapides, surgit une énorme boule orange de trois étages. Ce n'est pas une œuvre d'art contemporain, c'est l'Orange Julep, un casse-croûte devenu l'un des repères les plus aimés de Montréal.\n\nL'histoire commence dans les années trente avec la famille Gibeau, qui invente une boisson à l'orange, douce, crémeuse et mousseuse. Sa recette exacte est restée un secret de famille. La grosse orange actuelle, construite dans les années soixante, a remplacé une première version plus petite. On y commande au comptoir, comme dans les années cinquante, des hot-dogs, des frites, des poutines et, bien sûr, le fameux julep.\n\nLes soirs d'été, le stationnement se transforme en musée à ciel ouvert. Les amateurs de voitures anciennes s'y donnent rendez-vous pour montrer leurs chromes et leurs moteurs. C'est l'endroit parfait pour une pause simple, un peu kitsch, et profondément montréalaise.", "en": "Along Décarie Boulevard, squeezed between busy expressways, a three-storey orange ball rises out of nowhere. It is not a piece of modern art. It is the Orange Julep, a roadside snack bar that has become one of Montreal's best-loved landmarks.\n\nThe story begins in the nineteen thirties with the Gibeau family, who created a sweet, creamy, frothy orange drink. The exact recipe remains a family secret. The big orange you see today was built in the sixties, replacing a smaller first version. You order at the window, fifties style: hot dogs, fries, poutine and, of course, the famous julep.\n\nOn summer evenings, the parking lot turns into an open-air car museum. Classic car fans gather to show off their chrome and polished engines. It is the perfect stop for something simple, a little kitschy and deeply Montreal.", "es": "A lo largo del bulevar Décarie, entre dos autopistas, aparece de pronto una enorme bola anaranjada de tres pisos. No es una obra de arte contemporáneo. Es el Orange Julep, un puesto de comida que se ha convertido en uno de los íconos más queridos de Montreal.\n\nLa historia empieza en los años treinta con la familia Gibeau, que inventó una bebida de naranja dulce, cremosa y espumosa. La receta exacta sigue siendo un secreto de familia. La gran naranja que usted ve hoy se construyó en los años sesenta y reemplazó a una primera versión más pequeña. Se pide en la ventanilla, como en los años cincuenta: perros calientes, papas fritas, poutine y, claro, el famoso julep.\n\nEn las noches de verano, el estacionamiento se convierte en un museo al aire libre. Los aficionados a los autos clásicos se reúnen para lucir sus cromados y sus motores. Es la parada perfecta para algo sencillo, un poco kitsch y muy montrealés."}, "conseil": {"fr": "Venez un mercredi soir d'été pour voir les voitures anciennes. C'est à la belle saison que l'endroit est le plus animé.", "en": "Come on a summer Wednesday evening for the classic cars. The place is at its liveliest in the warm months.", "es": "Venga un miércoles por la noche en verano para ver los autos clásicos. El lugar tiene más ambiente en la temporada cálida."}, "commander": {"fr": "Un julep, bien sûr, avec un hot-dog steamé. Au comptoir : « Un grand julep et un hot-dog steamé, s'il vous plaît. »", "en": "A julep, of course, with a steamed hot dog, a \"steamé\" as locals say. At the window: \"Un grand julep et un hot-dog steamé, s'il vous plaît.\"", "es": "Un julep, claro, con un perro caliente al vapor, un « steamé » como dicen aquí. En la ventanilla: « Un grand julep et un hot-dog steamé, s'il vous plaît. »"}, "anecdote": {"fr": "La grosse orange mesure environ douze mètres de diamètre, soit à peu près la hauteur d'un immeuble de trois étages.", "en": "The big orange is about twelve metres across, roughly the height of a three-storey building.", "es": "La gran naranja mide unos doce metros de diámetro, casi la altura de un edificio de tres pisos."}, "son": ["fr", "en", "es"]}, {"id": "cafe-olimpico", "cat": "boire", "quartier": "Mile End", "metro": "Laurier", "adresse": "124, rue Saint-Viateur Ouest", "geo": [45.5241, -73.6003], "duree": 30, "nom": {"fr": "Café Olimpico", "en": "Café Olimpico", "es": "Café Olimpico"}, "bref": {"fr": "L'espresso du Mile End, servi sans chichi depuis des décennies.", "en": "Mile End's espresso, served without fuss for decades.", "es": "El espresso del Mile End, servido sin rodeos desde hace décadas."}, "texte": {"fr": "Rue Saint-Viateur, au cœur du Mile End, un café de quartier fondé par des immigrants italiens est devenu une institution. Au Café Olimpico, on commande au comptoir, on paie, on trouve une place si on peut. Aucun menu compliqué, aucune mise en scène : seulement un espresso serré, un cappuccino mousseux et quelques pâtisseries.\n\nLa salle est un vrai portrait du quartier. Des retraités italiens y discutent de soccer, des étudiants y lisent, des musiciens et des familles se croisent au comptoir. Les écrans diffusent souvent un match, et quand l'Italie joue, l'ambiance monte d'un cran.\n\nAux beaux jours, tout se passe dehors. Les bancs le long du trottoir et la terrasse se remplissent dès le matin, et le café devient le salon à ciel ouvert du Mile End. C'est l'arrêt idéal entre deux boutiques, ou juste après un bagel acheté un peu plus loin sur la même rue.", "en": "On Saint-Viateur Street, in the heart of Mile End, a neighbourhood café opened by Italian immigrants has become an institution. At Café Olimpico, you order at the counter, pay, and grab a seat if you can find one. No complicated menu, no show: just a tight espresso, a foamy cappuccino and a few pastries.\n\nThe room is a portrait of the neighbourhood. Retired Italian men argue about soccer, students read, musicians and young families cross paths at the counter. The screens often show a match, and when Italy plays, the volume goes way up.\n\nIn warm weather, everything moves outside. The benches along the sidewalk and the terrace fill up from early morning, and the café becomes Mile End's open-air living room. It is the ideal stop between two shops, or right after a warm bagel bought a little farther down the same street.", "es": "En la calle Saint-Viateur, en pleno Mile End, un café de barrio abierto por inmigrantes italianos se ha convertido en una institución. En el Café Olimpico, se pide en el mostrador, se paga y se busca un lugar si lo hay. No hay menú complicado ni espectáculo: solo un espresso corto, un capuchino espumoso y algunos pasteles.\n\nEl salón es un retrato del barrio. Jubilados italianos discuten de fútbol, estudiantes leen, músicos y familias se cruzan en el mostrador. Las pantallas suelen transmitir un partido, y cuando juega Italia, el ambiente se enciende.\n\nCuando hace buen tiempo, todo sucede afuera. Las bancas junto a la acera y la terraza se llenan desde temprano, y el café se vuelve la sala al aire libre del Mile End. Es la parada ideal entre dos tiendas, o justo después de un bagel comprado un poco más adelante en la misma calle."}, "conseil": {"fr": "Le matin de semaine est le moment le plus calme. La file avance vite : sachez ce que vous voulez avant d'arriver au comptoir.", "en": "Weekday mornings are the calmest. The line moves fast, so know your order before you reach the counter.", "es": "Las mañanas entre semana son las más tranquilas. La fila avanza rápido: tenga su pedido listo al llegar al mostrador."}, "commander": {"fr": "Un espresso ou un cappuccino, avec une pâtisserie si le cœur vous en dit. Au comptoir : « Un cappuccino, s'il vous plaît, pour ici. »", "en": "An espresso or a cappuccino, with a pastry if you like. At the counter: \"Un cappuccino, s'il vous plaît, pour ici.\"", "es": "Un espresso o un capuchino, con algún pastelito si se le antoja. En el mostrador: « Un cappuccino, s'il vous plaît, pour ici. »"}, "anecdote": {"fr": "À son ouverture en 1970, le café s'annonçait « Open Da Night », une façon bien à lui de dire « ouvert jour et nuit ».", "en": "When it opened in 1970, the café billed itself as \"Open Da Night\", its own way of saying open day and night.", "es": "Cuando abrió en 1970, el café se anunciaba como \"Open Da Night\", su manera de decir abierto día y noche."}, "son": ["fr", "en", "es"]}, {"id": "cafe-italia", "cat": "boire", "quartier": "Rosemont–La Petite-Patrie", "metro": "Jean-Talon", "adresse": "6840, boulevard Saint-Laurent", "geo": [45.5327, -73.6143], "duree": 30, "nom": {"fr": "Caffè Italia", "en": "Caffè Italia", "es": "Caffè Italia"}, "bref": {"fr": "Le café de la Petite-Italie, inchangé depuis 1956, et bruyant les soirs de match.", "en": "Little Italy's café, unchanged since 1956 and roaring on match nights.", "es": "El café de la Pequeña Italia, igual desde 1956 y ruidoso en noches de partido."}, "texte": {"fr": "Sur le boulevard Saint-Laurent, au cœur de la Petite-Italie, le Caffè Italia sert le même espresso depuis 1956. À l'époque, il accueillait la grande vague d'immigrants italiens arrivés à Montréal après la guerre. Pour eux, c'était un morceau du pays, un endroit où l'on parlait sa langue et où l'on buvait un vrai café.\n\nLe décor a très peu changé. Un long comptoir, une machine à espresso qui siffle, des photos d'équipes de soccer, quelques tables serrées. La maison est toujours tenue par la même famille, et les habitués s'y saluent par leur prénom.\n\nLe vrai spectacle commence les soirs de match. Quand l'équipe d'Italie joue, la salle se remplit, les chaises débordent sur le trottoir et chaque but fait trembler le quartier. Même sans match, prenez le temps d'un espresso debout au comptoir, à l'italienne, avant d'aller marcher jusqu'au marché Jean-Talon, tout près.", "en": "On Saint-Laurent Boulevard, in the heart of Little Italy, Caffè Italia has been pulling the same espresso since 1956. Back then, it welcomed the great wave of Italian immigrants who came to Montreal after the war. For them, it was a piece of home, a place to speak their language and drink real coffee.\n\nThe décor has barely changed. A long counter, a hissing espresso machine, photos of soccer teams and a few tightly packed tables. The same family still runs the place, and regulars greet each other by first name.\n\nThe real show starts on match nights. When Italy plays, the room fills up, chairs spill onto the sidewalk and every goal shakes the whole neighbourhood. Even without a game, take a moment for an espresso standing at the bar, Italian style, before strolling over to the Jean-Talon Market, just a few blocks away.", "es": "Sobre el bulevar Saint-Laurent, en el corazón de la Pequeña Italia, el Caffè Italia sirve el mismo espresso desde 1956. En aquella época recibía a la gran ola de inmigrantes italianos que llegaron a Montreal después de la guerra. Para ellos era un pedazo de su tierra, un lugar para hablar su idioma y tomar un café de verdad.\n\nLa decoración casi no ha cambiado. Un largo mostrador, una cafetera que silba, fotos de equipos de fútbol y unas cuantas mesas muy juntas. La misma familia sigue al frente del negocio, y los clientes de siempre se saludan por su nombre.\n\nEl verdadero espectáculo empieza las noches de partido. Cuando juega Italia, el local se llena, las sillas salen a la acera y cada gol hace vibrar al barrio entero. Aun sin partido, tómese un espresso de pie en la barra, al estilo italiano, antes de caminar hasta el mercado Jean-Talon, a pocas cuadras."}, "conseil": {"fr": "Consultez le calendrier de l'équipe d'Italie : un soir de grand match, arrivez tôt pour avoir une place.", "en": "Check Italy's match schedule: on a big game night, come early to get a spot.", "es": "Revise el calendario de la selección italiana: en noche de gran partido, llegue temprano."}, "commander": {"fr": "Un espresso bu debout au comptoir, à l'italienne. Au comptoir : « Un espresso, s'il vous plaît. »", "en": "An espresso, drunk standing at the bar, Italian style. At the counter: \"Un espresso, s'il vous plaît.\"", "es": "Un espresso tomado de pie en la barra, al estilo italiano. En el mostrador: « Un espresso, s'il vous plaît. »"}, "anecdote": {"fr": "Après la victoire de l'Italie à la Coupe du monde de 2006, le boulevard Saint-Laurent a été envahi de drapeaux jusqu'au petit matin.", "en": "When Italy won the 2006 World Cup, Saint-Laurent Boulevard filled with flags and car horns until dawn.", "es": "Cuando Italia ganó el Mundial de 2006, el bulevar Saint-Laurent se llenó de banderas y bocinas hasta el amanecer."}, "son": ["fr", "en", "es"]}, {"id": "santropol", "cat": "boire", "quartier": "Plateau-Mont-Royal", "metro": "Mont-Royal", "adresse": "3990, rue Saint-Urbain", "geo": [45.5156, -73.5805], "duree": 60, "nom": {"fr": "Café Santropol", "en": "Café Santropol", "es": "Café Santropol"}, "bref": {"fr": "Un jardin secret derrière une façade de briques, et des sandwichs de géant.", "en": "A secret garden behind a brick façade, and giant sandwiches.", "es": "Un jardín secreto detrás de una fachada de ladrillo, y sándwiches gigantes."}, "texte": {"fr": "Au coin des rues Saint-Urbain et Duluth, une maison de briques un peu bohème cache un secret. Le Café Santropol est ouvert depuis 1976. Son histoire commence avec une bonne cause : ses fondateurs voulaient sauver l'édifice de la démolition, et ils y ont installé un café.\n\nÀ l'intérieur, les chaises sont dépareillées, les murs colorés, et l'atmosphère rappelle un salon d'étudiants. Mais c'est à l'arrière que le charme opère. Un jardin plein d'arbres, de fleurs et de petites fontaines forme une oasis de verdure, loin du bruit de la ville. Aux beaux jours, c'est l'une des terrasses les plus douces du Plateau.\n\nLa maison est réputée pour ses sandwichs très épais, préparés sur du pain maison et garnis de fromage à la crème, de fruits ou de légumes. On y trouve aussi des soupes, du chili et un grand choix de thés. Les options végétariennes y sont nombreuses, et on peut partager sans gêne.", "en": "At the corner of Saint-Urbain and Duluth, a slightly bohemian brick house hides a secret. Café Santropol has been open since 1976. It all began with a good cause: its founders wanted to save the building from demolition, so they opened a café inside.\n\nIndoors, the chairs are mismatched, the walls are colourful, and the mood feels like a student living room. The real magic, though, is out back. A garden full of trees, flowers and little fountains creates a green oasis, far from the noise of the city. On a sunny day, it is one of the gentlest terraces on the Plateau.\n\nThe house is famous for its towering sandwiches, built on homemade bread and filled with cream cheese, fruit or vegetables. There are also soups, chili and a long list of teas. Vegetarians have plenty of choice, and sharing a sandwich is perfectly acceptable.", "es": "En la esquina de las calles Saint-Urbain y Duluth, una casa de ladrillo algo bohemia esconde un secreto. El Café Santropol abrió en 1976. Su historia empieza con una buena causa: sus fundadores querían salvar el edificio de la demolición, y decidieron abrir un café en él.\n\nAdentro, las sillas no combinan, las paredes son de colores y el ambiente recuerda a una sala de estudiantes. Pero la verdadera magia está en la parte de atrás. Un jardín lleno de árboles, flores y pequeñas fuentes forma un oasis verde, lejos del ruido de la ciudad. En los días soleados, es una de las terrazas más apacibles del Plateau.\n\nLa casa es famosa por sus sándwiches altísimos, hechos con pan casero y rellenos de queso crema, frutas o verduras. También hay sopas, chili y una larga lista de tés. Las opciones vegetarianas abundan, y compartir un sándwich es de lo más normal."}, "conseil": {"fr": "Demandez tout de suite une table au jardin, même s'il faut attendre un peu. Un sandwich suffit largement pour deux appétits moyens.", "en": "Ask for a garden table right away, even if it means a short wait. One sandwich easily feeds two moderate appetites.", "es": "Pida de inmediato una mesa en el jardín, aunque tenga que esperar un poco. Un sándwich alcanza para dos personas sin mucha hambre."}, "commander": {"fr": "Un sandwich au fromage à la crème, à partager, avec un thé. Au serveur : « Une table au jardin, s'il vous plaît, pour deux. »", "en": "A cream cheese sandwich to share, with a pot of tea. Ask the host: \"Une table au jardin, s'il vous plaît, pour deux.\"", "es": "Un sándwich de queso crema para compartir, con un té. Pida: « Une table au jardin, s'il vous plaît, pour deux. »"}, "anecdote": {"fr": "Le café a donné naissance à Santropol Roulant, un organisme qui livre des repas à des personnes âgées en perte d'autonomie.", "en": "The café gave rise to Santropol Roulant, a non-profit that delivers meals to seniors and people with reduced mobility.", "es": "Del café nació Santropol Roulant, una organización sin fines de lucro que lleva comidas a personas mayores."}, "son": ["fr", "en", "es"]}, {"id": "dieu-du-ciel", "cat": "boire", "quartier": "Plateau-Mont-Royal", "metro": "Laurier", "adresse": "29, avenue Laurier Ouest", "geo": [45.5226, -73.5934], "duree": 90, "nom": {"fr": "Dieu du Ciel!", "en": "Dieu du Ciel!", "es": "Dieu du Ciel!"}, "bref": {"fr": "La microbrasserie culte de Montréal, où chaque bière est brassée sur place.", "en": "Montreal's cult brewpub, where every beer is brewed on site.", "es": "La cervecería artesanal de culto de Montreal, donde todo se elabora en casa."}, "texte": {"fr": "Le Québec est l'un des endroits les plus vivants d'Amérique du Nord pour la bière artisanale. Depuis les années quatre-vingt, des centaines de microbrasseries ont ouvert dans la province, des grandes villes jusqu'aux petits villages, et chaque région a désormais ses bières locales.\n\nÀ Montréal, Dieu du Ciel! est l'une des pionnières. Ce broue-pub, c'est-à-dire un bar qui brasse lui-même ce qu'il sert, a ouvert en 1998 sur l'avenue Laurier. Le succès a été tel qu'une usine a ensuite été construite à Saint-Jérôme, au nord de la ville. Mais c'est ici, dans cette salle chaleureuse et souvent bondée, que tout se goûte en premier.\n\nLe menu change au fil des saisons. On y trouve des bières légères, des bières acidulées, des blanches parfumées et des stouts très sombres. Si vous hésitez, demandez conseil : le personnel adore guider les curieux, et une planche de dégustation permet de tout essayer.", "en": "Quebec is one of the liveliest places in North America for craft beer. Since the nineteen eighties, hundreds of microbreweries have opened across the province, from big cities to tiny villages, and every region now has beers of its own.\n\nIn Montreal, Dieu du Ciel! is one of the pioneers. This brewpub, or broue-pub as Quebecers say, opened on Laurier Avenue in 1998 and brews everything it pours. It became so popular that a full brewery was later built in Saint-Jérôme, north of the city. Still, this warm and often crowded room is where every new beer is tasted first.\n\nThe menu changes with the seasons. You will find light ales, tart sour beers, fragrant wheat beers and stouts as dark as night. If you are unsure, just ask: the staff love guiding curious drinkers, and a tasting flight lets you try a little of everything.", "es": "Quebec es uno de los lugares más vivos de América del Norte para la cerveza artesanal. Desde los años ochenta, cientos de microcervecerías han abierto en la provincia, desde las grandes ciudades hasta los pueblos más pequeños, y cada región tiene ya sus propias cervezas.\n\nEn Montreal, Dieu du Ciel! es una de las pioneras. Este brewpub, o broue-pub como dicen los quebequenses, abrió en la avenida Laurier en 1998 y elabora todo lo que sirve. Tuvo tanto éxito que más tarde construyó una fábrica en Saint-Jérôme, al norte de la ciudad. Aun así, en este salón cálido y casi siempre lleno es donde cada nueva cerveza se prueba primero.\n\nLa carta cambia con las estaciones. Hay cervezas ligeras, cervezas ácidas, cervezas de trigo aromáticas y stouts oscurísimas. Si duda, pida consejo: al personal le encanta orientar a los curiosos, y una tabla de degustación permite probar un poco de todo."}, "conseil": {"fr": "Le bar ne prend pas de réservation et se remplit vite en soirée : venez en fin d'après-midi. Les bières sont souvent fortes, prenez des demi-pintes.", "en": "No reservations, and it fills up fast at night: come in the late afternoon. Many beers are strong, so order half pints.", "es": "No aceptan reservaciones y se llena rápido por la noche: venga al final de la tarde. Muchas cervezas son fuertes; pida medias pintas."}, "commander": {"fr": "La Péché Mortel, stout au café devenue célèbre, ou la Rosée d'hibiscus, rafraîchissante. Au bar : « Une planche de dégustation, s'il vous plaît. »", "en": "Péché Mortel, the famous coffee stout, or the refreshing Rosée d'hibiscus. At the bar: \"Une planche de dégustation, s'il vous plaît.\"", "es": "La Péché Mortel, famosa stout de café, o la refrescante Rosée d'hibiscus. En la barra: « Une planche de dégustation, s'il vous plaît. »"}, "anecdote": {"fr": "La Péché Mortel, une stout impériale au café, figure depuis des années parmi les bières les mieux notées au monde par les amateurs.", "en": "Péché Mortel, an imperial coffee stout, has ranked for years among the world's top-rated beers on enthusiast sites.", "es": "La Péché Mortel, una stout imperial de café, figura desde hace años entre las cervezas mejor valoradas del mundo por los aficionados."}, "son": ["fr", "en", "es"]}], "circuits": [{"id": "vieux-montreal", "nom": {"fr": "Le Vieux-Montréal à pied", "en": "Old Montréal on Foot", "es": "El Viejo Montreal a pie"}, "duree": {"fr": "une demi-journée", "en": "half a day", "es": "medio día"}, "intro": {"fr": "La ville est née ici, au bord du fleuve, et ses rues de pierre racontent quatre siècles d'histoire en quelques pas. Vous commencez là où Montréal a été fondée, vous passez par la basilique et la place la plus animée du quartier, puis vous descendez au Vieux-Port. Pour finir, une courte montée vers le quartier chinois, où le dîner vous attend.", "en": "This is where the city was born, on the riverbank, and its stone streets pack four centuries of history into a short stroll. You start where Montréal was founded, take in the basilica and the liveliest square in the district, then wander down to the Old Port. To finish, a short walk uphill to Chinatown, where lunch is waiting.", "es": "Aquí nació la ciudad, a orillas del río, y sus calles de piedra condensan cuatro siglos de historia en pocos pasos. Usted empieza donde se fundó Montreal, pasa por la basílica y la plaza más animada del barrio, y luego baja al Viejo Puerto. Para terminar, una breve subida hasta el barrio chino, donde lo espera el almuerzo."}, "etapes": ["pointe-a-calliere", "notre-dame", "place-jacques-cartier", "vieux-port", "quartier-chinois"], "liaisons": {"fr": ["Environ 7 minutes à pied en remontant la rue Saint-Sulpice jusqu'à la place d'Armes.", "Environ 8 minutes à pied vers l'est par la rue Notre-Dame, en passant devant l'hôtel de ville.", "Quelques minutes à pied en descendant la place jusqu'à la rue de la Commune et aux quais.", "Environ 15 minutes à pied vers le nord par le boulevard Saint-Laurent, ou le métro, ligne orange, de Champ-de-Mars à Place-d'Armes, une station plus loin."], "en": ["About 7 minutes on foot up rue Saint-Sulpice to Place d'Armes.", "About 8 minutes east along rue Notre-Dame, past City Hall.", "A few minutes downhill through the square to rue de la Commune and the quays.", "About 15 minutes north on foot along boulevard Saint-Laurent, or take the orange line one stop, from Champ-de-Mars to Place-d'Armes."], "es": ["Unos 7 minutos a pie subiendo por la calle Saint-Sulpice hasta la Place d'Armes.", "Unos 8 minutos a pie hacia el este por la calle Notre-Dame, pasando frente al ayuntamiento.", "Pocos minutos a pie bajando por la plaza hasta la calle de la Commune y los muelles.", "Unos 15 minutos a pie hacia el norte por el bulevar Saint-Laurent, o una estación en la línea naranja del metro, de Champ-de-Mars a Place-d'Armes."]}}, {"id": "plateau-mile-end", "nom": {"fr": "Le Plateau et le Mile End gourmands", "en": "A Food Lover's Plateau and Mile End", "es": "El Plateau y el Mile End para golosos"}, "duree": {"fr": "une journée, sans se presser", "en": "a full day, at an easy pace", "es": "un día completo, sin prisa"}, "intro": {"fr": "Voici le circuit des classiques qu'on mange debout, au comptoir ou sur un banc : smoked meat, poutine, poulet portugais, bagels sortis du four à bois. Entre deux bouchées, vous marchez dans les rues aux escaliers extérieurs qui font la réputation du Plateau. Partagez les assiettes : la liste est longue et chaque arrêt mérite qu'on garde un peu de place.", "en": "This is the tour of the classics you eat standing up, at a counter or on a park bench: smoked meat, poutine, Portuguese chicken, bagels straight from the wood oven. Between bites, you walk the streets of outdoor staircases that made the Plateau famous. Share your plates: the list is long, and every stop deserves a little room.", "es": "Este es el recorrido de los clásicos que se comen de pie, en la barra o en un banco: smoked meat, poutine, pollo portugués, bagels recién salidos del horno de leña. Entre bocado y bocado, usted camina por las calles de escaleras exteriores que dieron fama al Plateau. Comparta los platos: la lista es larga y cada parada merece que le guarde un poco de espacio."}, "etapes": ["schwartz", "plateau", "la-banquise", "romados", "mile-end", "wilenskys", "bagels", "cafe-olimpico"], "liaisons": {"fr": ["Environ 10 minutes à pied vers l'est par la rue Duluth, jusqu'à la rue Saint-Denis.", "Environ 10 minutes à pied par la rue Rachel, vers le parc La Fontaine.", "Environ 20 minutes à pied vers l'ouest par la rue Rachel, presque jusqu'au boulevard Saint-Laurent.", "Environ 20 minutes à pied vers le nord par le boulevard Saint-Laurent, ou l'autobus 55.", "Quelques minutes à pied jusqu'au coin des rues Fairmount et Clark.", "Deux minutes à pied vers l'ouest par la rue Fairmount, ou cinq de plus jusqu'à la rue Saint-Viateur.", "Quelques minutes à pied par la rue Saint-Viateur."], "en": ["About 10 minutes east on foot along rue Duluth to rue Saint-Denis.", "About 10 minutes on foot along rue Rachel toward La Fontaine Park.", "About 20 minutes west on foot along rue Rachel, almost to boulevard Saint-Laurent.", "About 20 minutes north on foot up boulevard Saint-Laurent, or take the 55 bus.", "A few minutes on foot to the corner of Fairmount and Clark.", "Two minutes west along rue Fairmount, or five more to rue Saint-Viateur.", "A few minutes on foot along rue Saint-Viateur."], "es": ["Unos 10 minutos a pie hacia el este por la calle Duluth, hasta la calle Saint-Denis.", "Unos 10 minutos a pie por la calle Rachel, hacia el parque La Fontaine.", "Unos 20 minutos a pie hacia el oeste por la calle Rachel, casi hasta el bulevar Saint-Laurent.", "Unos 20 minutos a pie hacia el norte por el bulevar Saint-Laurent, o el autobús 55.", "Pocos minutos a pie hasta la esquina de las calles Fairmount y Clark.", "Dos minutos a pie hacia el oeste por la calle Fairmount, o cinco más hasta la calle Saint-Viateur.", "Pocos minutos a pie por la calle Saint-Viateur."]}}, {"id": "la-montagne", "nom": {"fr": "La montagne", "en": "The Mountain", "es": "La montaña"}, "duree": {"fr": "une demi-journée", "en": "half a day", "es": "medio día"}, "intro": {"fr": "Les Montréalais disent « la montagne » pour parler du mont Royal, et c'est elle qui donne son nom à la ville. Vous partez de l'Oratoire, le plus haut point de Montréal, vous traversez le parc jusqu'au belvédère qui domine le centre-ville, puis vous descendez à pied vers le musée des beaux-arts. Prévoyez de bonnes chaussures : ça monte, puis ça descend.", "en": "Montrealers simply say \"the mountain\" when they mean Mount Royal, the hill that gave the city its name. You start at the Oratory, the highest point in Montréal, cross the park to the lookout above downtown, then walk down to the Museum of Fine Arts. Wear good shoes: it climbs, then it drops.", "es": "Los montrealeses dicen simplemente «la montaña» para hablar del monte Royal, la colina que dio su nombre a la ciudad. Usted sale del Oratorio, el punto más alto de Montreal, cruza el parque hasta el mirador que domina el centro y luego baja a pie hacia el Museo de Bellas Artes. Lleve buen calzado: primero se sube y después se baja."}, "etapes": ["oratoire", "mont-royal", "mbam"], "liaisons": {"fr": ["Une quinzaine de minutes à pied jusqu'au chemin Remembrance, puis l'autobus 11 jusqu'au lac aux Castors ; le chalet et le belvédère sont ensuite à une quinzaine de minutes de marche.", "Environ 30 minutes à pied : l'escalier qui part du chalet descend vers l'avenue des Pins, puis la rue Peel mène à la rue Sherbrooke."], "en": ["About fifteen minutes on foot to chemin Remembrance, then the 11 bus to Beaver Lake; the chalet and the lookout are about fifteen minutes' walk from there.", "About 30 minutes on foot: the staircase below the chalet leads down to avenue des Pins, then rue Peel takes you to rue Sherbrooke."], "es": ["Unos quince minutos a pie hasta el camino Remembrance y luego el autobús 11 hasta el lago de los Castores; el chalet y el mirador quedan a unos quince minutos de caminata.", "Unos 30 minutos a pie: la escalera que baja del chalet lleva a la avenida des Pins, y luego la calle Peel lo conduce hasta la calle Sherbrooke."]}}, {"id": "est-et-fleuve", "nom": {"fr": "De l'Olympique au fleuve", "en": "From the Olympic Park to the River", "es": "Del Parque Olímpico al río"}, "duree": {"fr": "une journée", "en": "a full day", "es": "un día completo"}, "intro": {"fr": "Ce circuit relie les grands gestes de Montréal : le stade des Jeux de 1976, l'un des plus grands jardins botaniques du monde, puis les deux icônes de l'Expo 67 posées au bord du fleuve. Le métro fait le gros du trajet, et la fin se fait à pied, sur un pont, avec la ville en face de vous. Gardez cette journée pour le beau temps.", "en": "This tour links Montréal's grandest gestures: the stadium of the 1976 Games, one of the largest botanical gardens in the world, then the two icons of Expo 67 standing by the river. The metro does most of the travelling, and the last stretch is on foot, across a bridge, with the skyline in front of you. Save this one for a fine day.", "es": "Este recorrido une los grandes gestos de Montreal: el estadio de los Juegos de 1976, uno de los jardines botánicos más grandes del mundo y luego los dos íconos de la Expo 67 a orillas del río. El metro hace la mayor parte del trayecto, y el final se hace a pie, sobre un puente, con la ciudad enfrente. Reserve este día para el buen tiempo."}, "etapes": ["parc-olympique", "jardin-botanique", "biosphere", "habitat-67"], "liaisons": {"fr": ["Environ 10 minutes à pied en traversant la rue Sherbrooke, vers le nord.", "Environ 35 minutes en métro : ligne verte depuis Pie-IX jusqu'à Berri-UQAM, puis ligne jaune jusqu'à Jean-Drapeau ; la Biosphère est à quelques minutes de la station.", "Environ 40 minutes à pied ou 15 minutes à vélo par le pont de la Concorde, jusqu'à la Cité du Havre."], "en": ["About 10 minutes on foot, north across rue Sherbrooke.", "About 35 minutes by metro: green line from Pie-IX to Berri-UQAM, then the yellow line to Jean-Drapeau; the Biosphere is a few minutes from the station.", "About 40 minutes on foot, or 15 by bike, over the Concorde Bridge to Cité du Havre."], "es": ["Unos 10 minutos a pie hacia el norte, cruzando la calle Sherbrooke.", "Unos 35 minutos en metro: línea verde desde Pie-IX hasta Berri-UQAM y luego línea amarilla hasta Jean-Drapeau; la Biosfera está a pocos minutos de la estación.", "Unos 40 minutos a pie, o 15 en bicicleta, por el puente de la Concorde hasta la Cité du Havre."]}}], "pratique": [{"id": "se-deplacer", "titre": {"fr": "Se déplacer", "en": "Getting Around", "es": "Cómo moverse"}, "texte": {"fr": "Le métro de la STM compte quatre lignes, qu'on désigne par leur couleur : verte, orange, jaune et bleue. On paie avec la carte OPUS, rechargeable aux distributeurs des stations, ou avec un titre de transport occasionnel ; les passes d'une journée ou de trois jours sont souvent les plus avantageuses. Le même titre vaut pour l'autobus. Aux beaux jours, les vélos en libre-service BIXI sont partout au centre de la ville. Et beaucoup de quartiers se découvrent simplement à pied.", "en": "The STM metro has four lines, known by their colour: green, orange, yellow and blue. You pay with an OPUS card, which you can top up at station machines, or with an occasional-use fare; one-day and three-day passes are often the best deal. The same fare works on buses. In the warmer months, BIXI bike-share stations are everywhere in the central neighbourhoods. And many parts of the city are best explored simply on foot.", "es": "El metro de la STM tiene cuatro líneas, que se nombran por su color: verde, naranja, amarilla y azul. Se paga con la tarjeta OPUS, recargable en las máquinas de las estaciones, o con un boleto ocasional; los pases de un día o de tres días suelen ser la mejor opción. El mismo boleto sirve en el autobús. En la temporada templada, las bicicletas compartidas BIXI están por todo el centro. Y muchos barrios se descubren simplemente a pie."}}, {"id": "aeroport", "titre": {"fr": "De l'aéroport au centre-ville", "en": "From the Airport to Downtown", "es": "Del aeropuerto al centro"}, "texte": {"fr": "L'autobus 747 de la STM relie l'aéroport Montréal-Trudeau au centre-ville jour et nuit, toute l'année. Le trajet dure souvent entre 45 minutes et une heure, selon la circulation. Achetez votre titre au distributeur de la zone des arrivées : il donne aussi accès au métro et aux autobus pendant 24 heures. Les taxis appliquent un tarif fixe entre l'aéroport et le centre-ville, ce qui évite les mauvaises surprises.", "en": "The STM's 747 bus runs between Montréal-Trudeau airport and downtown around the clock, all year. The ride usually takes 45 minutes to an hour, depending on traffic. Buy your fare at the machine in the arrivals area: it also covers the metro and city buses for 24 hours. Taxis charge a flat rate between the airport and downtown, so there are no surprises on the meter.", "es": "El autobús 747 de la STM une el aeropuerto Montréal-Trudeau con el centro día y noche, todo el año. El trayecto suele durar entre 45 minutos y una hora, según el tráfico. Compre su boleto en la máquina de la zona de llegadas: también le da acceso al metro y a los autobuses durante 24 horas. Los taxis cobran una tarifa fija entre el aeropuerto y el centro, así que no hay sorpresas."}}, {"id": "langue", "titre": {"fr": "« Bonjour-Hi » et la langue", "en": "\"Bonjour-Hi\" and Language", "es": "«Bonjour-Hi» y el idioma"}, "texte": {"fr": "Au Québec, le français est la seule langue officielle, et c'est la langue de la rue, des affiches et des commerces. Dans les boutiques du centre, on vous accueille souvent d'un « Bonjour-Hi » : vous répondez dans la langue de votre choix, et la conversation suit. Commencez toujours par « Bonjour », même si vous passez ensuite à l'anglais : le geste est remarqué. Les Montréalais changent de langue volontiers, et beaucoup passeront à l'anglais sans que vous le demandiez.", "en": "In Québec, French is the only official language, and it's the language of the street, the signs and the shops. Downtown, clerks often greet you with a \"Bonjour-Hi\": answer in the language you prefer and the conversation follows. Always start with \"Bonjour\", even if you switch to English right after; people notice and appreciate it. Montrealers switch languages easily, and many are happy to carry on in English.", "es": "En Quebec, el francés es el único idioma oficial, y es la lengua de la calle, de los letreros y de los comercios. En las tiendas del centro suelen recibirlo con un «Bonjour-Hi»: usted responde en el idioma que prefiera y la conversación sigue. Empiece siempre con «Bonjour», aunque luego pase al inglés: el gesto se nota y se agradece. Los montrealeses cambian de idioma con facilidad, y muchos pasarán al inglés sin que usted lo pida."}}, {"id": "pourboire", "titre": {"fr": "Le pourboire", "en": "Tipping", "es": "La propina"}, "texte": {"fr": "Au restaurant et au bar, le service n'est pas compris dans l'addition. L'usage est de laisser de 15 à 20 %, calculé sur le montant avant les taxes. Le terminal de paiement vous propose souvent des pourcentages : vous pouvez aussi entrer le montant vous-même. Au bar, on laisse environ un dollar par consommation si l'on paie à chaque verre. On donne aussi un pourboire au chauffeur de taxi, au coiffeur et au livreur.", "en": "In restaurants and bars, service isn't included in the bill. The custom is to leave 15 to 20 percent, calculated on the amount before taxes. The card terminal will often suggest percentages, but you can also enter your own amount. At a bar, leave about a dollar a drink if you pay as you go. Taxi drivers, hairdressers and delivery people are tipped as well.", "es": "En restaurantes y bares, el servicio no está incluido en la cuenta. Lo habitual es dejar entre el 15 y el 20 %, calculado sobre el monto antes de impuestos. La terminal de pago suele proponer porcentajes, pero usted también puede escribir la cantidad. En el bar se deja alrededor de un dólar por bebida si paga cada vez. También se da propina al taxista, al peluquero y al repartidor."}}, {"id": "taxes", "titre": {"fr": "Les taxes à la caisse", "en": "Taxes at the Till", "es": "Los impuestos en la caja"}, "texte": {"fr": "Le prix affiché sur l'étiquette ou au menu n'inclut presque jamais les taxes : elles s'ajoutent au moment de payer. Il y en a deux, la TPS, taxe fédérale, et la TVQ, taxe du Québec, qui font ensemble un peu moins de 15 %. Un article affiché à 20 dollars vous coûtera donc environ 23 dollars. Au restaurant, le pourboire s'ajoute par-dessus. Le prix de l'alcool et des billets de spectacle suit la même logique.", "en": "The price on the tag or the menu almost never includes tax: it's added when you pay. There are two, the GST, a federal tax, and the QST, Québec's tax, which together come to just under 15 percent. An item marked 20 dollars will cost you about 23. At a restaurant, the tip goes on top of that. Drinks and concert tickets work the same way.", "es": "El precio de la etiqueta o del menú casi nunca incluye los impuestos: se suman al momento de pagar. Son dos, la TPS, impuesto federal, y la TVQ, impuesto de Quebec, que juntos suman un poco menos del 15 %. Un artículo marcado a 20 dólares le costará unos 23. En el restaurante, la propina se añade encima. Con las bebidas y las entradas de espectáculos pasa lo mismo."}}, {"id": "saisons", "titre": {"fr": "Les saisons", "en": "The Seasons", "es": "Las estaciones"}, "texte": {"fr": "L'hiver montréalais est long et froid, souvent sous les moins 10 degrés, avec de la neige de décembre à mars. Habillez-vous en couches, avec tuque, mitaines et bottes. Pour circuler au chaud, le RÉSO, qu'on appelle aussi la ville souterraine, relie par des couloirs des stations de métro, des centres commerciaux et des tours du centre-ville. L'été, chaud et humide, est la saison des festivals : il se passe quelque chose presque chaque fin de semaine.", "e
