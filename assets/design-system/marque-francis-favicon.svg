<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="francis">
  <!-- Le favicon de « francis » est **le point du i**, seul — jamais une
       lettre. Cadre mauve, disque blanc centré, rayon du cadre 8 px
       (remise : 32 px → disque de 11 px). -->
  <rect width="32" height="32" rx="8" fill="#6B4FBB"/>
  <circle cx="16" cy="16" r="5.5" fill="#FFFFFF"/>
</svg>
