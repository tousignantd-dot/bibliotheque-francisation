<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="SAAF">
  <!-- Monogramme SAAF : le « à » accentué, aplat #6B4FBB, pastille ronde.
       Sous 44 px, la règle est l'aplat et non le contour. Le glyphe est
       remonté de 1 px (dy) pour compenser optiquement l'accent. -->
  <circle cx="16" cy="16" r="16" fill="#6B4FBB"/>
  <text x="16" y="16" dy="7" text-anchor="middle"
        font-family="Nunito, 'Arial Rounded MT Bold', system-ui, sans-serif"
        font-size="18" font-weight="900" fill="#FFFFFF">à</text>
</svg>
