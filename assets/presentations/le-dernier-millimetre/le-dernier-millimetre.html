<!doctype html>
<html lang="fr">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>[hidden]{display:none!important}</style>
<title>Le dernier millimètre</title>
<meta name="description" content="Formation « Remplacer les plaquettes de frein avant », conçue et révisée avec la boucle didactique : chaque diapositive, avant et après, avec le critère qui justifie le changement.">
<style>
/* ============================================================
   CALQUE — système de design pour formations révisées
   ------------------------------------------------------------
   Deux couches, comme sur une table à dessin :
   · la FEUILLE  — ce que l'apprenant voit (la formation) ;
   · le CALQUE   — la couche de révision posée par-dessus, tracée
                   au crayon bleu non photographique : critères,
                   constats, avant/après. L'apprenant ne la voit
                   jamais ; le lecteur du portfolio, oui.
   Et un troisième registre, BROUILLON, qui reproduit fidèlement
   la diapositive « par défaut » de la version zéro.

   Règles :
   1. Le bleu calque n'appartient QU'à la couche de révision.
      Il ne sert jamais à la formation elle-même.
   2. Les trois verdicts (légitime / à vérifier / frauduleux)
      portent toujours une forme ET une couleur (G1).
   3. Toute adresse et tout lien s'affichent en mono : c'est là
      que se cachent les lettres jumelles (rn/m, l/I, 0/o).
   ============================================================ */

@import url("https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=IBM+Plex+Mono:wght@400;500&family=Schibsted+Grotesk:wght@500;700;800&family=Kalam:wght@400;700&display=swap");

:root {
  color-scheme: light;

  /* ---------- Feuille (formation) ---------- */
  --cq-papier:      #EEF1F3;  /* fond de page : gris-bleu d'une boîte de réception */
  --cq-feuille:     #FFFFFF;  /* la diapositive */
  --cq-retrait:     #F5F7F8;  /* surface en retrait : en-tête de courriel, encart */
  --cq-filet:       #D5DCE1;
  --cq-sourdine:    #5A6873;  /* texte secondaire — 5,7:1 sur blanc */
  --cq-encre:       #13212C;  /* texte principal — bleu nuit */
  --cq-action:      #13212C;  /* bouton principal : l'encre elle-même */
  --cq-action-ink:  #FFFFFF;
  --cq-focus:       #E8A317;
  --cq-lien:        #1A5FB4;  /* lien et bouton du courriel simulé — 6,3:1 */

  /* ---------- Verdicts (sémantiques, forme + couleur) ---------- */
  --cq-sur:         #1D7A4C;  --cq-sur-fond:     #E3F2EA;   /* ✓ légitime   */
  --cq-doute:       #9A6206;  --cq-doute-fond:   #FBF0D9;   /* ? à vérifier */
  --cq-fraude:      #B3261E;  --cq-fraude-fond:  #FBE4E1;   /* ✕ frauduleux */

  /* ---------- Calque (révision) ---------- */
  --cq-calque:      #4C9BD6;  /* bleu non photographique : traits, repères */
  --cq-calque-ink:  #0B4A7A;  /* texte du calque — 9,2:1 sur blanc */
  --cq-calque-voile: rgba(76, 155, 214, 0.08);
  --cq-calque-trame: rgba(76, 155, 214, 0.18);

  /* Gravités du constat d'origine — graduées dans le bleu du calque,
     pour ne jamais se confondre avec les verdicts de la formation. */
  --cq-grav-bloquant: #0B4A7A;
  --cq-grav-majeur:   #2F7EBB;
  --cq-grav-mineur:   #9CC7E8;

  /* ---------- Brouillon (version zéro) ---------- */
  --br-fond:   #FFFFFF;
  --br-titre:  #1F4E9A;
  --br-texte:  #222222;
  --br-barre:  #1F4E9A;
  --br-police: Calibri, Carlito, "Segoe UI", Arial, sans-serif;

  /* ---------- Typographie ---------- */
  --cq-police-titre: "Schibsted Grotesk", "Helvetica Neue", Arial, sans-serif;
  --cq-police-texte: "Atkinson Hyperlegible", Verdana, Tahoma, sans-serif;
  --cq-police-mono:  "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
  --cq-police-main:  "Kalam", "Segoe Print", "Comic Neue", cursive;

  /* Échelle des diapositives, en unités de conteneur :
     la diapo est une scène 16:9 ; tout y est proportionnel à sa largeur. */
  --cq-d-mega:  5.6cqw;
  --cq-d-titre: 3.6cqw;
  --cq-d-inter: 2.3cqw;
  --cq-d-texte: 1.75cqw;
  --cq-d-petit: 1.35cqw;
  --cq-d-micro: 1.1cqw;
  /* Planchers : sous ces tailles, la diapo passe en mode « feuille qui
     s'allonge » (voir @container plus bas) plutôt que de rapetisser. */

  /* Échelle de l'interface autour (rem) */
  --cq-t-xl: 2rem;
  --cq-t-l:  1.375rem;
  --cq-t-m:  1.0625rem;
  --cq-t-s:  0.9375rem;
  --cq-t-xs: 0.8125rem;

  --cq-rayon:   6px;
  --cq-rayon-l: 12px;
  --cq-ombre:   0 1px 2px rgba(19,33,44,.06), 0 8px 24px rgba(19,33,44,.08);
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --cq-papier:   #0E171E;
    --cq-feuille:  #16222B;
    --cq-retrait:  #1C2A34;
    --cq-filet:    #2B3B47;
    --cq-sourdine: #9AABB8;
    --cq-encre:    #E6EDF2;
    --cq-action:   #E6EDF2;
    --cq-action-ink: #13212C;
    --cq-lien: #7DB3F0;
    --cq-sur:    #5FCB93;  --cq-sur-fond:    #173327;
    --cq-doute:  #E9B454;  --cq-doute-fond:  #3A2D12;
    --cq-fraude: #F08A80;  --cq-fraude-fond: #3E1B18;
    --cq-calque: #6FB6EA;
    --cq-calque-ink: #9FD0F5;
    --cq-calque-voile: rgba(111, 182, 234, 0.08);
    --cq-calque-trame: rgba(111, 182, 234, 0.22);
    --cq-grav-bloquant: #9FD0F5;
    --cq-grav-majeur:   #5A9FD4;
    --cq-grav-mineur:   #2F5C80;
    --cq-ombre: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --cq-papier:   #0E171E;
  --cq-feuille:  #16222B;
  --cq-retrait:  #1C2A34;
  --cq-filet:    #2B3B47;
  --cq-sourdine: #9AABB8;
  --cq-encre:    #E6EDF2;
  --cq-action:   #E6EDF2;
  --cq-action-ink: #13212C;
  --cq-lien: #7DB3F0;
  --cq-sur:    #5FCB93;  --cq-sur-fond:    #173327;
  --cq-doute:  #E9B454;  --cq-doute-fond:  #3A2D12;
  --cq-fraude: #F08A80;  --cq-fraude-fond: #3E1B18;
  --cq-calque: #6FB6EA;
  --cq-calque-ink: #9FD0F5;
  --cq-calque-voile: rgba(111, 182, 234, 0.08);
  --cq-calque-trame: rgba(111, 182, 234, 0.22);
  --cq-grav-bloquant: #9FD0F5;
  --cq-grav-majeur:   #5A9FD4;
  --cq-grav-mineur:   #2F5C80;
  --cq-ombre: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.35);
}

/* ============================================================
   Base
   ============================================================ */
.cq, .cq * { box-sizing: border-box; }
.cq {
  font-family: var(--cq-police-texte);
  color: var(--cq-encre);
  background: var(--cq-papier);
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}
.cq :focus-visible { outline: 3px solid var(--cq-focus); outline-offset: 2px; border-radius: 3px; }
.cq-mono { font-family: var(--cq-police-mono); font-size: .95em; letter-spacing: 0; }
.cq-visuel-cache { position: absolute !important; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

@media (prefers-reduced-motion: reduce) {
  .cq *, .cq *::before, .cq *::after { animation: none !important; transition: none !important; }
}

/* ============================================================
   Scène — la diapositive 16:9, en unités de conteneur
   ============================================================ */
.scene {
  container-type: inline-size;
  width: 100%;
  max-width: 100%;
  position: relative;
  overflow: hidden;
  border-radius: var(--cq-rayon-l);
  background: var(--cq-feuille);
  box-shadow: var(--cq-ombre);
}
.plateau { position: relative; aspect-ratio: 16 / 9; max-width: 100%; }
.scene--vide {
  aspect-ratio: 16 / 9;
  display: grid; place-items: center;
  background: repeating-linear-gradient(135deg, var(--cq-calque-voile) 0 10px, transparent 10px 20px), var(--cq-feuille);
  box-shadow: inset 0 0 0 2px var(--cq-calque-trame);
}
.scene--vide p {
  font-family: var(--cq-police-main); color: var(--cq-calque-ink);
  font-size: var(--cq-d-inter); margin: 0; text-align: center; max-width: 70%;
}

/* ============================================================
   Feuille — composition d'une diapo de formation
   ============================================================ */
.diapo {
  position: absolute; inset: 0;
  padding: 4.2cqw 5cqw 3.6cqw;
  display: flex; flex-direction: column; gap: 1.8cqw;
  font-size: var(--cq-d-texte);
}
.diapo__entete {
  display: flex; align-items: baseline; justify-content: space-between; gap: 2cqw;
  font-size: var(--cq-d-micro); color: var(--cq-sourdine);
  letter-spacing: .06em; text-transform: uppercase;
}
.diapo__titre {
  font-family: var(--cq-police-titre); font-weight: 800;
  font-size: var(--cq-d-titre); line-height: 1.05; letter-spacing: -.02em;
  margin: 0; text-wrap: balance;
}
.diapo__corps { flex: 1; min-height: 0; display: flex; gap: 3cqw; }
.diapo__corps--pile { flex-direction: column; gap: 1.4cqw; }
.diapo__col { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 1.2cqw; }
.diapo__col--etroite { flex: 0 0 34%; }
.diapo p { margin: 0; max-width: 60ch; }
.diapo__mega {
  font-family: var(--cq-police-titre); font-weight: 800;
  font-size: var(--cq-d-mega); line-height: 1; letter-spacing: -.035em; margin: 0; text-wrap: balance;
}
.diapo__chapeau { font-size: var(--cq-d-inter); line-height: 1.3; margin: 0; max-width: 34ch; }
.diapo__pied { font-size: var(--cq-d-petit); color: var(--cq-sourdine); }

/* Diapo d'ouverture de module : fond encre, plein cadre */
.diapo--ouverture { background: var(--cq-encre); color: var(--cq-feuille); justify-content: flex-end; }
.diapo--ouverture .diapo__entete { color: color-mix(in srgb, var(--cq-feuille) 70%, transparent); }

/* ---------- Verdict : pastille forme + couleur ---------- */
.verdict {
  display: inline-flex; align-items: center; gap: .45em;
  padding: .2em .7em .2em .35em; border-radius: 999px;
  font-weight: 700; font-size: .9em; line-height: 1.4; white-space: nowrap;
}
.verdict::before {
  content: ""; width: 1.15em; height: 1.15em; flex: none;
  display: inline-grid; place-items: center; border-radius: 50%;
  font-size: .8em; line-height: 1.15em; text-align: center; color: var(--cq-feuille);
}
.verdict--sur    { background: var(--cq-sur-fond);    color: var(--cq-sur); }
.verdict--doute  { background: var(--cq-doute-fond);  color: var(--cq-doute); }
.verdict--fraude { background: var(--cq-fraude-fond); color: var(--cq-fraude); }
.verdict--sur::before    { content: "✓"; background: var(--cq-sur); }
.verdict--doute::before  { content: "?"; background: var(--cq-doute); border-radius: 3px; }
.verdict--fraude::before { content: "✕"; background: var(--cq-fraude); border-radius: 2px; transform: rotate(0deg); }

/* ---------- Vérification : les trois questions ---------- */
.verif { display: grid; gap: 1cqw; margin: 0; padding: 0; list-style: none; counter-reset: verif; }
.verif__item {
  counter-increment: verif;
  display: grid; grid-template-columns: 3.2cqw 1fr; gap: .2cqw 1.2cqw; align-items: baseline;
}
.verif__item::before {
  content: counter(verif);
  grid-row: span 2;
  font-family: var(--cq-police-titre); font-weight: 800; font-size: var(--cq-d-inter);
  width: 3.2cqw; height: 3.2cqw; border-radius: 50%;
  display: grid; place-items: center; border: .2cqw solid currentColor;
}
.verif__q { font-weight: 700; font-size: var(--cq-d-inter); line-height: 1.2; }
.verif__r { color: var(--cq-sourdine); font-size: var(--cq-d-petit); }
.verif__item[data-actif="false"] { opacity: .35; }

/* ============================================================
   Courriel simulé — imite un client de messagerie
   ============================================================ */
.courriel {
  background: var(--cq-feuille);
  border: 1px solid var(--cq-filet);
  border-radius: var(--cq-rayon);
  font-size: var(--cq-d-petit);
  display: flex; flex-direction: column; min-height: 0; position: relative;
  overflow: hidden;
}
.courriel__entete {
  background: var(--cq-retrait); border-bottom: 1px solid var(--cq-filet);
  padding: 1.1cqw 1.4cqw; display: grid; gap: .35cqw;
}
.courriel__objet { font-weight: 700; font-size: var(--cq-d-texte); line-height: 1.25; }
.courriel__de { display: flex; flex-wrap: wrap; align-items: center; gap: .3cqw .8cqw; }
.courriel__avatar {
  width: 2.4cqw; height: 2.4cqw; border-radius: 50%; flex: none;
  display: grid; place-items: center; font-weight: 700; font-size: var(--cq-d-micro);
  background: var(--cq-filet); color: var(--cq-encre);
}
.courriel__nom {
  font-weight: 700; background: none; border: 0; padding: 0; color: inherit; font: inherit; font-weight: 700;
  cursor: pointer; text-decoration: underline dotted; text-underline-offset: .25em;
}
.courriel__adresse { font-family: var(--cq-police-mono); color: var(--cq-sourdine); font-size: .92em; }
.courriel__adresse[hidden] { display: none; }
.courriel__meta { color: var(--cq-sourdine); font-size: var(--cq-d-micro); }
.courriel__corps { padding: 1.3cqw 1.4cqw; display: grid; gap: .8cqw; align-content: start; overflow: auto; }
.courriel__corps p { margin: 0; }
.courriel__lien {
  color: var(--cq-lien); text-decoration: underline; cursor: pointer;
  background: none; border: 0; padding: 0; font: inherit; text-align: left;
}
.courriel__bouton {
  justify-self: start; background: var(--cq-lien); color: var(--cq-feuille); border: 0; border-radius: 4px;
  padding: .6cqw 1.4cqw; font: inherit; font-weight: 700; cursor: pointer;
}
.courriel__pj {
  display: inline-flex; gap: .6cqw; align-items: center; justify-self: start;
  border: 1px solid var(--cq-filet); border-radius: 4px; padding: .5cqw .9cqw;
  font-family: var(--cq-police-mono); font-size: var(--cq-d-micro);
}
/* Barre d'état : là où le client affiche la destination réelle d'un lien */
.courriel__etat {
  position: absolute; left: 0; bottom: 0; max-width: 90%;
  background: var(--cq-encre); color: var(--cq-feuille);
  font-family: var(--cq-police-mono); font-size: var(--cq-d-micro);
  padding: .35cqw .9cqw; border-top-right-radius: 4px;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.courriel__etat[hidden] { display: none; }

/* Repère : l'endroit à regarder, pointé sur l'objet (C3) */
.repere {
  position: relative; border-radius: 3px;
  box-shadow: 0 0 0 .22cqw var(--cq-focus);
  background: color-mix(in srgb, var(--cq-focus) 16%, transparent);
}
.repere[data-n]::after {
  content: attr(data-n);
  position: absolute; top: -1.2cqw; right: -1.2cqw;
  width: 2cqw; height: 2cqw; border-radius: 50%;
  background: var(--cq-focus); color: #13212C;
  font: 800 var(--cq-d-micro)/2cqw var(--cq-police-titre); text-align: center;
}

/* ============================================================
   Tri — l'apprenant décide
   ============================================================ */
.tri { display: flex; flex-wrap: wrap; gap: .9cqw; }
.tri__choix {
  font: inherit; font-weight: 700; font-size: var(--cq-d-petit);
  border: .15cqw solid var(--cq-filet); background: var(--cq-feuille); color: var(--cq-encre);
  border-radius: 999px; padding: .7cqw 1.5cqw; cursor: pointer;
  display: inline-flex; align-items: center; gap: .6cqw;
  transition: border-color .15s, background .15s;
}
.tri__choix:hover { border-color: var(--cq-encre); }
.tri__choix[aria-pressed="true"] { background: var(--cq-action); color: var(--cq-action-ink); border-color: var(--cq-action); }
.tri__choix:disabled { cursor: default; }
.tri__choix:disabled:not([aria-pressed="true"]) { opacity: .45; }

.options { display: grid; gap: .8cqw; }
.options__choix {
  font: inherit; font-size: var(--cq-d-petit); text-align: left; cursor: pointer;
  border: .15cqw solid var(--cq-filet); background: var(--cq-feuille); color: var(--cq-encre);
  border-radius: var(--cq-rayon); padding: .9cqw 1.2cqw; line-height: 1.35;
}
.options__choix:hover { border-color: var(--cq-encre); }
.options__choix[aria-pressed="true"] { border-color: var(--cq-encre); box-shadow: inset .4cqw 0 0 var(--cq-encre); }

/* ---------- Rétroaction ---------- */
.retro {
  border-radius: var(--cq-rayon); padding: 1cqw 1.3cqw;
  font-size: var(--cq-d-petit); display: grid; gap: .4cqw;
  border-left: .45cqw solid currentColor;
}
.retro[hidden] { display: none; }
.retro--juste  { background: var(--cq-sur-fond);    color: var(--cq-sur); }
.retro--rate   { background: var(--cq-fraude-fond); color: var(--cq-fraude); }
.retro--neutre { background: var(--cq-retrait);     color: var(--cq-encre); }
.retro__titre { font-weight: 700; }
.retro__texte { color: var(--cq-encre); }

/* ---------- Aide-mémoire ---------- */
.memo {
  border: .2cqw solid var(--cq-encre); border-radius: var(--cq-rayon-l);
  padding: 1.6cqw 2cqw; display: grid; gap: 1cqw; background: var(--cq-feuille);
}
.memo__titre { font-family: var(--cq-police-titre); font-weight: 800; font-size: var(--cq-d-inter); margin: 0; }

/* ---------- Encart consigne ---------- */
.consigne {
  display: flex; gap: 1cqw; align-items: baseline;
  font-size: var(--cq-d-petit); font-weight: 700;
}
.consigne::before {
  content: "À vous"; flex: none;
  font-size: var(--cq-d-micro); letter-spacing: .08em; text-transform: uppercase;
  background: var(--cq-encre); color: var(--cq-feuille); border-radius: 3px; padding: .15cqw .6cqw;
}

/* ============================================================
   Brouillon — reproduit la diapo par défaut de la version zéro
   ============================================================ */
.brouillon {
  position: absolute; inset: 0; background: var(--br-fond); color: var(--br-texte);
  font-family: var(--br-police); font-size: 1.9cqw; line-height: 1.3;
  padding: 3.4cqw 5cqw; display: flex; flex-direction: column; gap: 1.6cqw;
  color-scheme: light;
}
.brouillon::after {
  content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 1.3cqw; background: var(--br-barre);
}
.brouillon__titre { color: var(--br-titre); font-size: 3.4cqw; font-weight: 400; margin: 0; line-height: 1.1; }
.brouillon ul { margin: 0; padding-left: 1.4em; display: grid; gap: .5cqw; }
.brouillon p { margin: 0; }
.brouillon__image {
  flex: 1; min-height: 5cqw; max-height: 18cqw;
  border: .15cqw dashed #9AA3AD; border-radius: 4px; display: grid; place-items: center;
  font-size: 1.3cqw; color: #6B7580; font-style: italic; padding: 1cqw; text-align: center;
  background: repeating-linear-gradient(45deg, #F3F5F7 0 8px, #fff 8px 16px);
}
.brouillon__chiffres { display: grid; grid-template-columns: repeat(3, 1fr); gap: 2cqw; margin-top: 1cqw; }
.brouillon__chiffres b { display: block; color: var(--br-titre); font-size: 4cqw; }
.brouillon__chiffres span { font-size: 1.4cqw; }
.brouillon__note { font-style: italic; color: #B00020; }
.brouillon__grand { font-size: 4.2cqw; color: var(--br-titre); text-align: center; margin-top: 6cqw; }
.brouillon__quiz { display: grid; gap: .9cqw; font-size: 1.45cqw; }
.brouillon__quiz ol { padding-left: 1.3em; margin: 0; display: grid; gap: .7cqw; }
.brouillon__quiz ol ol { list-style: lower-alpha; margin-top: .2cqw; gap: 0; color: #444; }
.brouillon .courriel { font-size: 1.35cqw; }
.brouillon__legende { font-size: 1.4cqw; color: #444; font-style: italic; }

/* ============================================================
   Calque — la couche de révision
   ============================================================ */
.critere {
  display: inline-flex; align-items: baseline; gap: .45em;
  font-family: var(--cq-police-mono); font-size: var(--cq-t-xs); font-weight: 500;
  color: var(--cq-calque-ink); background: var(--cq-calque-voile);
  border: 1px solid var(--cq-calque-trame); border-radius: 3px; padding: .1em .5em;
  white-space: nowrap;
}
.critere__code { font-weight: 500; }
.critere__nom { font-family: var(--cq-police-texte); font-weight: 400; }

/* Gravité : trois épaisseurs de trait, pas seulement trois teintes */
.gravite {
  display: inline-flex; align-items: center; gap: .4em;
  font-size: var(--cq-t-xs); color: var(--cq-calque-ink); white-space: nowrap;
}
.gravite::before { content: ""; width: 1.6em; border-top: 2px solid var(--cq-grav-mineur); }
.gravite--majeur::before { border-top: 4px solid var(--cq-grav-majeur); }
.gravite--bloquant::before { border-top: 6px solid var(--cq-grav-bloquant); }

.statut {
  font-family: var(--cq-police-mono); font-size: var(--cq-t-xs); text-transform: uppercase; letter-spacing: .08em;
  color: var(--cq-calque-ink); border: 1px dashed var(--cq-calque); border-radius: 3px; padding: .1em .5em;
}
.statut--ajoutee  { border-style: solid; }
.statut--retiree  { text-decoration: line-through; }

.note-marge {
  font-family: var(--cq-police-main); color: var(--cq-calque-ink);
  font-size: 1.05rem; line-height: 1.35;
}

/* Journal de révision d'une diapo */
.journal { display: grid; gap: .9rem; }
.journal__ligne {
  display: grid; gap: .35rem; padding: .8rem .9rem;
  border-left: 3px solid var(--cq-calque);
  background: var(--cq-calque-voile); border-radius: 0 var(--cq-rayon) var(--cq-rayon) 0;
}
.journal__tete { display: flex; flex-wrap: wrap; gap: .4rem .6rem; align-items: center; }
.journal__texte { font-size: var(--cq-t-s); margin: 0; }

/* Superposition : le calque posé sur la diapo */
.surcouche {
  position: absolute; inset: 0; pointer-events: none;
  background-image:
    linear-gradient(var(--cq-calque-trame) 1px, transparent 1px),
    linear-gradient(90deg, var(--cq-calque-trame) 1px, transparent 1px);
  background-size: 2.5cqw 2.5cqw;
  mix-blend-mode: multiply; opacity: .5;
}

/* Étiquette « avant » / « après » sur une scène */
.marque {
  position: absolute; top: 1.2cqw; left: 1.2cqw; z-index: 2;
  font-family: var(--cq-police-mono); font-size: max(10px, var(--cq-d-micro)); letter-spacing: .1em; text-transform: uppercase;
  padding: .2em .6em; border-radius: 3px;
  background: var(--cq-calque-ink); color: #fff;
}
.marque--avant { background: #6B7580; }

/* ---------- Bilan d'une série ---------- */
.bilan { overflow: auto; gap: .9cqw; }
.bilan__cas { border: 1px solid var(--cq-filet); border-radius: var(--cq-rayon); padding: .9cqw 1.1cqw; display: grid; gap: .3cqw; font-size: var(--cq-d-petit); }
.bilan__tete { display: flex; justify-content: space-between; gap: 1cqw; align-items: baseline; font-weight: 700; }
.bilan__adresse { color: var(--cq-sourdine); font-size: var(--cq-d-micro); margin: 0; }

/* ---------- Correctifs de composition ---------- */
.diapo__corps > .diapo__col { overflow: auto; padding: .4cqw; margin: -.4cqw; }  /* place pour le focus et les pastilles de repère */
.courriel__bouton.repere { background: var(--cq-lien); }
.lien-discret {
  font: inherit; font-size: var(--cq-d-micro); background: none; border: 0; padding: 0; cursor: pointer;
  color: var(--cq-sourdine); text-decoration: underline; text-underline-offset: .2em; align-self: flex-start;
}

/* Le brouillon reste une diapo claire par défaut, même en thème sombre :
   il fige les jetons de la feuille pour ses enfants (courriel compris). */
.brouillon {
  --cq-feuille: #FFFFFF; --cq-retrait: #F5F7F8; --cq-filet: #D5DCE1;
  --cq-encre: #13212C; --cq-sourdine: #5A6873; --cq-lien: #1A5FB4;
}


/* ============================================================
   Mode étroit — la diapo cesse d'être une scène 16:9
   ------------------------------------------------------------
   Sous 760 px de large (téléphone, demi-écran), le plateau perd
   son format fixe, les tailles passent en rem avec un plancher,
   et les colonnes s'empilent : courriel, décision, rétroaction.
   Au-dessus, les tailles proportionnelles ont un plancher lisible.
   ============================================================ */
.scene {
  --cq-d-mega:  max(5.6cqw, 30px);
  --cq-d-titre: max(3.6cqw, 22px);
  --cq-d-inter: max(2.3cqw, 16px);
  --cq-d-texte: max(1.75cqw, 15px);
  --cq-d-petit: max(1.35cqw, 14px);
  --cq-d-micro: max(1.1cqw, 12px);
}
.brouillon { font-size: max(1.9cqw, 13px); }
.brouillon__titre { font-size: max(3.4cqw, 20px); }

@container (max-width: 760px) {
  .plateau { aspect-ratio: auto; }
  .diapo, .brouillon { position: relative; inset: auto; padding: 20px 18px 24px; gap: 14px; }
  .brouillon { padding-bottom: 36px; }
  .diapo__corps { flex-direction: column; gap: 16px; }
  .diapo__col--etroite { flex: none; }
  .diapo__corps > .diapo__col { overflow: visible; }
  .diapo__entete { flex-wrap: wrap; }
  .courriel__entete, .courriel__corps { padding: 12px 14px; gap: 6px; }
  .courriel__avatar { width: 28px; height: 28px; }
  .courriel__bouton { padding: 10px 16px; }
  .courriel__etat { position: static; max-width: none; white-space: normal; word-break: break-all; padding: 6px 10px; border-radius: 0; }
  .courriel__pj { padding: 6px 10px; }
  .tri { gap: 8px; }
  .tri__choix, .options__choix, .courriel__action { min-height: 44px; padding: 10px 16px; }
  .options { gap: 8px; }
  .options__choix { padding: 12px 14px; }
  .retro { padding: 12px 14px; border-left-width: 5px; gap: 4px; }
  .verif { gap: 12px; }
  .verif__item { grid-template-columns: 32px 1fr; gap: 2px 12px; }
  .verif__item::before { width: 32px; height: 32px; border-width: 2px; }
  .memo { padding: 16px; gap: 10px; }
  .consigne { gap: 8px; }
  .consigne::before { padding: 2px 8px; }
  .repere { box-shadow: 0 0 0 2px var(--cq-focus); }
  .repere[data-n]::after { width: 20px; height: 20px; top: -11px; right: -11px; line-height: 20px; }
  .bilan__cas { padding: 12px; gap: 6px; }
  .lien-discret { min-height: 44px; }
  .brouillon__chiffres { grid-template-columns: 1fr; gap: 10px; }
  .brouillon__image { min-height: 60px; max-height: none; font-size: 12px; }
  .brouillon__quiz { font-size: 13px; }
}

/* ---------- Barre d'actions du courriel (geste Signaler) ---------- */
.courriel__actions {
  display: flex; flex-wrap: wrap; gap: .5cqw; padding: .7cqw 1.1cqw;
  border-bottom: 1px solid var(--cq-filet); background: var(--cq-feuille);
}
.courriel__action {
  font: inherit; font-size: var(--cq-d-micro); font-weight: 700; cursor: pointer;
  border: 1px solid var(--cq-filet); background: var(--cq-retrait); color: var(--cq-encre);
  border-radius: 4px; padding: .4cqw 1cqw;
}
.courriel__action:hover { border-color: var(--cq-encre); }
.courriel__action[aria-pressed="true"] { background: var(--cq-action); color: var(--cq-action-ink); border-color: var(--cq-action); }
.courriel__action--signaler::before { content: "⚑ "; }

.courriel__etat--alerte { background: var(--cq-fraude); color: #fff; white-space: normal; }

.tri__choix--plein { background: var(--cq-action); color: var(--cq-action-ink); border-color: var(--cq-action); align-self: flex-start; }
.tri__choix--plein:hover { border-color: var(--cq-action); }

.indice { display: grid; gap: .6cqw; }
.indice__q { margin: 0; font-weight: 700; font-size: var(--cq-d-petit); }

.regle { display: grid; gap: .9cqw; }
.regle__ligne { display: grid; grid-template-columns: minmax(8.5em, auto) 1fr; gap: 1.2cqw; align-items: baseline; font-size: var(--cq-d-petit); }
.regle__ligne .verdict { justify-self: start; }

.bilan__cause { margin: 0; font-weight: 700; font-size: var(--cq-d-micro); color: var(--cq-sourdine); }
.lien-externe { color: var(--cq-lien); font-weight: 700; font-size: var(--cq-d-petit); }

.journal__ligne--tour2 { border-left-style: dashed; margin-left: 1.2rem; }

/* ---------- Troisième tour ---------- */
.chrono {
  font-family: var(--cq-police-mono); font-variant-numeric: tabular-nums;
  border: 1px solid var(--cq-filet); border-radius: 3px; padding: 0 .5em; color: var(--cq-encre);
}
.chrono--depasse { border-color: var(--cq-doute); color: var(--cq-doute); }
.case { display: flex; gap: .6em; align-items: center; font-size: var(--cq-d-petit); cursor: pointer; }
.case input { width: 1.2em; height: 1.2em; accent-color: var(--cq-encre); }
/* L'alerte « ce clic aurait ouvert la page » : fond pâle et encre foncée du
   verdict, lisibles dans les deux thèmes (l'encre blanche tombait à 2,4:1). */
.courriel__etat--alerte { background: var(--cq-fraude-fond); color: var(--cq-fraude); box-shadow: inset 0 2px 0 var(--cq-fraude); }
@container (max-width: 760px) {
  .courriel__nom { padding-block: 12px; }
  .courriel__bouton { min-height: 44px; }
  .case { min-height: 44px; }
}

</style>
<style>
/* ============================================================
   CALQUE · ATELIER — composants des formations en mécanique.
   S'ajoute à calque.css. Même règles : le bleu calque reste à la
   révision ; les repères sont ambre (--cq-focus), comme sur le
   courriel simulé.
   ============================================================ */

/* ---------- Planche : le dessin technique ----------
   Toujours claire, comme une page de manuel : les dépôts d'une
   bougie ont la couleur de la matière, pas celle du thème. */
.planche {
  --pl-papier: #FBFAF7; --pl-trait: #2A333B; --pl-metal: #E4E7EA; --pl-ceram: #FAF8F2;
  color-scheme: light;
  position: relative; background: var(--pl-papier); color: var(--pl-trait);
  border: 1px solid #D5DCE1; border-radius: var(--cq-rayon);
  display: flex; padding: .6cqw; min-height: 0; margin: 0; overflow: hidden; height: 100%;
}
.planche svg { flex: 1; min-width: 0; min-height: 0; width: 100%; height: 100%; display: block; }
.diapo__col > .planche { flex: 1; }
.pl-trait { stroke: var(--pl-trait); stroke-width: 1.4; stroke-linejoin: round; }
.pl-fin { stroke-width: .8; fill: none; }
.pl-metal { fill: var(--pl-metal); }
.pl-ceram { fill: var(--pl-ceram); }
.pl-hach { stroke: #8A949C; stroke-width: 1; }
.pl-masse { fill: none; stroke-width: 12; }
.pl-reflet { fill: none; stroke: #fff; stroke-width: 2.4; stroke-linecap: round; opacity: .55; }
.pl-cote { stroke: #8A949C; stroke-width: .8; stroke-dasharray: 3 3; }
.pl-axe { stroke: #8A949C; stroke-width: .8; stroke-dasharray: 10 3 2 3; }
.pl-leg { font: 600 9px var(--cq-police-texte); fill: #5A6873; }
.pl-mesure { font: 600 13px var(--cq-police-mono); fill: var(--pl-trait); }
.pl-alerte { stroke: #B3261E; stroke-width: 2; fill: none; stroke-linecap: round; }
.pl-fluide { fill: #9C6B12; }

/* Repère numéroté posé sur le dessin */
.pl-repere circle { fill: var(--cq-focus); stroke: #13212C; stroke-width: 1.2; }
.pl-repere text { font: 800 11px var(--cq-police-titre); fill: #13212C; text-anchor: middle; dominant-baseline: central; }

/* ---------- Fiche : une pièce à juger, avec son bon de travail ---------- */
.fiche {
  display: grid; grid-template-rows: minmax(0, 1fr) auto; gap: .8cqw; min-height: 0; height: 100%;
  background: var(--cq-feuille); border: 1px solid var(--cq-filet); border-radius: var(--cq-rayon-l); padding: .9cqw;
}
.fiche__bon { display: grid; gap: .25cqw; font-size: var(--cq-d-petit); }
.fiche__titre { font-weight: 700; font-size: var(--cq-d-texte); margin: 0; }
.fiche__ligne { margin: 0; color: var(--cq-sourdine); }
.fiche__mesures { display: flex; flex-wrap: wrap; gap: .4cqw 1.4cqw; margin: .2cqw 0 0; }
.fiche__mesure { font-family: var(--cq-police-mono); font-size: var(--cq-d-micro); background: var(--cq-retrait); border-radius: 3px; padding: .15cqw .6cqw; }
.fiche__mesure.repere { background: color-mix(in srgb, var(--cq-focus) 16%, transparent); }

/* ---------- Ordre : remettre les étapes dans l'ordre ---------- */
.ordre { display: grid; grid-template-columns: 1fr 1fr; gap: 2cqw; min-height: 0; flex: 1; }
.ordre__col { display: flex; flex-direction: column; gap: .6cqw; min-height: 0; overflow: auto; padding: .3cqw; }
.ordre__titre { font-size: var(--cq-d-micro); text-transform: uppercase; letter-spacing: .08em; color: var(--cq-sourdine); margin: 0; }
.ordre__suite { margin: 0; padding: 0; list-style: none; display: grid; gap: .5cqw; counter-reset: ordre; }
.ordre__suite li { counter-increment: ordre; display: grid; grid-template-columns: 2.4cqw 1fr; gap: .8cqw; align-items: baseline; font-size: var(--cq-d-petit); }
.ordre__suite li::before { content: counter(ordre); font-family: var(--cq-police-titre); font-weight: 800; color: var(--cq-sur); }
.ordre__vide { border: .15cqw dashed var(--cq-filet); border-radius: var(--cq-rayon); padding: .8cqw; color: var(--cq-sourdine); font-size: var(--cq-d-petit); }

/* Pastille de l'objet dans le bilan d'une série */
.bilan__objet { font-weight: 700; }

@container (max-width: 760px) {
  .planche { padding: 8px; height: auto; aspect-ratio: 4 / 3; max-height: 60vh; }
  .fiche { padding: 12px; gap: 10px; }
  .fiche__bon { gap: 4px; }
  .fiche__mesure { padding: 2px 8px; }
  .ordre { grid-template-columns: 1fr; gap: 16px; }
  .ordre__suite li { grid-template-columns: 24px 1fr; gap: 10px; }
  .ordre__vide { padding: 12px; }
}

/* Classes des planches de freins */
.pl-papier { fill: var(--pl-papier); }
.pl-grave { font: 700 8px var(--cq-police-mono); fill: #4A545C; letter-spacing: .06em; }
.pl-garn { fill: #7A6A58; }
.pl-temoin { fill: none; stroke: #2A333B; stroke-width: 1.6; }
.pl-flexible { fill: none; stroke: #1F2528; stroke-width: 7; stroke-linecap: round; }
.pl-num { font: 800 15px var(--cq-police-titre); fill: #13212C; text-anchor: middle; dominant-baseline: central; }

/* ============================================================
   Second tour (audits 2)
   ============================================================ */

/* La scène garde son format 16:9 comme MINIMUM, et s'allonge quand le
   contenu dépasse. En 16:9 strict avec overflow:hidden, un exemple
   travaillé poussait son bouton 82 px sous le bord : invisible, et hors
   d'atteinte à la souris comme au doigt (audits 2, bloquant G1). */
.scene .plateau { aspect-ratio: auto; min-height: 56.25cqw; }
.scene .diapo { position: relative; inset: auto; min-height: 56.25cqw; }
.scene .diapo__corps > .diapo__col { overflow: visible; }
.scene .brouillon { position: absolute; inset: 0; }
@container (max-width: 760px) {
  .scene .plateau, .scene .diapo { min-height: 0; }
  .scene .brouillon { position: relative; }
}

/* Photo : la planche épouse la photo, sans marge de papier */
.planche--photo { padding: 0; background: #E9ECEE; }
.planche--photo svg { border-radius: calc(var(--cq-rayon) - 1px); }
.fiche { height: auto; }
.fiche .planche { height: auto; aspect-ratio: 4 / 3; }
.diapo__col > .planche { height: auto; flex: none; }
.pl-repere circle { stroke-width: 2; }

/* La consigne est UN bloc de texte : en flex, chaque morceau en gras
   devenait une colonne à part (audit 2, n-19). */
.consigne { display: block; }
.consigne::before { display: inline-block; margin-right: .8em; vertical-align: .1em; }

/* Mesures lisibles sur téléphone (audit 2, n-18) */
.fiche__mesure { font-size: var(--cq-d-petit); }

/* Verdict à icône propre (ex. ↻ « remplacer ») : la forme ne doit pas
   emprunter le « ? » du doute (audit 2, n-9). */
.verdict[data-icone]::before { content: attr(data-icone); }

.consigne-situation { display: grid; gap: 1cqw; align-content: start; font-size: var(--cq-d-texte); }
.consigne-situation .planche { max-width: 100%; }

/* Tablette et écran tactile : cibles de 44 px, pas seulement sur téléphone */
@media (pointer: coarse) {
  .tri__choix, .options__choix, .lien-discret, .lien-externe { min-height: 44px; }
  .lien-externe { display: inline-flex; align-items: center; }
}
.corps { align-content: start; }

/* ============================================================
   Troisième tour (audits 3)
   ============================================================ */
.planche--photo { position: relative; max-height: 58vh; margin-inline: auto; width: 100%; }
.fiche .planche--photo { height: auto; }
.planche__agrandir {
  position: absolute; right: 6px; bottom: 6px; font: 700 var(--cq-d-micro) var(--cq-police-texte);
  background: rgba(19,33,44,.78); color: #fff; border: 0; border-radius: 999px; padding: 4px 10px; cursor: zoom-in;
}
.loupe { border: 0; padding: 0; background: #0E171E; max-width: 96vw; max-height: 94vh; width: 96vw; border-radius: 10px; }
.loupe::backdrop { background: rgba(0,0,0,.72); }
.loupe svg { display: block; width: 100%; height: auto; max-height: 88vh; }
.loupe__fermer { position: absolute; top: 8px; right: 8px; font: 700 15px var(--cq-police-texte); background: #fff; color: #13212C; border: 0; border-radius: 999px; padding: 10px 16px; min-height: 44px; cursor: pointer; }

.score { display: grid; gap: .6cqw; }
.score__ligne { display: grid; grid-template-columns: auto 1fr; gap: 0 1cqw; align-items: baseline; }
.score__lib { grid-column: 1 / -1; font-size: var(--cq-d-micro); text-transform: uppercase; letter-spacing: .08em; color: var(--cq-sourdine); }
.score__n { font-family: var(--cq-police-titre); font-weight: 800; font-size: var(--cq-d-titre); line-height: 1; }
.score__seuil { font-size: var(--cq-d-petit); color: var(--cq-sourdine); }
.score__elimine { margin: 0; font-family: var(--cq-police-titre); font-weight: 800; font-size: var(--cq-d-titre); color: var(--cq-fraude); }
.score__elimine::before { content: "✕ "; }
@container (max-width: 760px) {
  .planche__agrandir { min-height: 44px; padding: 8px 14px; }
}

</style>

    {module: "M1", avant: "A-M1-1", apres: "M1-1", statut: "modifiee", criteres: [{code: "B1", grav: "majeur"}, {code: "A2", grav: "majeur"}, {code: "C2", grav: "mineur"}, {code: "E2", grav: "mineur"}], pourquoi: "Le disque rougeoyant d'une voiture de course devient **l'erreur la plus fréquente au pont** : un étrier qui pend au bout de son flexible. L'apprenti décide avant tout exposé, et la rétroaction dit ce que ça fait au flexible, sans blâme.", note: "le cas d'abord, le titre après", tour2: {criteres: [{code: "D4", grav: "mineur"}, {code: "C4", grav: "mineur"}], pourquoi: "Le dessin posait une croix rouge sur le flexible avant la réponse : la photo montre l'étrier qui pend, sans rien dire. Après la réponse, on voit enfin le bon geste, l'étrier au crochet."}, tour3: {criteres: [{code: "D2", grav: "bloquant"}], pourquoi: "La photo du « bon geste », agrandie, montrait le crochet passé autour du FLEXIBLE, et l'étrier qui pendait à lui : le geste éliminatoire lui-même. En attendant une photo juste, c'est le dessin technique qui montre le bon geste : le crochet tient l'étrier."}, tour4: {criteres: [{code: "D2", grav: "mineur"}], pourquoi: "Photo de l'étrier au crochet refaite et vérifiée agrandie : le crochet passe dans le corps de l'étrier (2), le flexible pend à part en boucle lâche (1). Elle remplace le dessin provisoire ; la photo fautive est écartée (.rejetee.jpg) et ne part plus au classeur."}},

<script>
/* ============================================================
   Moteur des formations d'ATELIER — même mécanique que celui de
   « Le courriel de trop » (formation-hameconnage/moteur.js), mais
   l'objet à juger est une PIÈCE dessinée (planche + bon de travail),
   et les verdicts et indices viennent des données (APRES.verdicts,
   APRES.indices) plutôt que d'être écrits ici.
   Trois vues : la formation, avant/après, la boucle.
   ============================================================ */
(function () {
  "use strict";

  document.documentElement.lang = "fr";
  const A = window.APRES, V = window.AVANT, J = window.JOURNAL, G = window.GRILLE, B = window.BOUCLE, P = window.PIECES || {}, PH = window.PHOTOS || {};
  const VERDICTS = A.verdicts, INDICES = A.indices || {};

  // ---------- Petits utilitaires ----------
  function h(tag, attrs, ...enfants) {
    const el = document.createElement(tag);
    if (attrs) for (const [k, v] of Object.entries(attrs)) {
      if (v == null || v === false) continue;
      if (k === "class") el.className = v;
      else if (k === "html") el.innerHTML = v;
      else if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
      else el.setAttribute(k, v === true ? "" : v);
    }
    for (const e of enfants.flat()) if (e != null && e !== false) el.append(e instanceof Node ? e : document.createTextNode(e));
    return el;
  }
  // Texte enrichi minimal : **gras** et `mono`
  function riche(s) {
    const esc = String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    return esc.replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>").replace(/`(.+?)`/g, '<span class="cq-mono">$1</span>');
  }
  const p = (s, cls) => h("p", { class: cls, html: riche(s) });
  const ton = (v) => VERDICTS[v].ton;
  const pastille = (v) => h("span", { class: `verdict verdict--${ton(v)}`, "data-icone": VERDICTS[v].icone || null }, VERDICTS[v].court);

  const etat = new Map();

  // L'ordre des choix est MÉLANGÉ, mais toujours de la même façon pour une
  // question donnée (graine tirée de son texte) : sans mélange, la bonne
  // réponse était la deuxième dans 14 questions sur 18, et « toujours la
  // deuxième » réussissait l'épreuve (audit 3). Stable : un redessin ou un
  // « Recommencer » ne rebat pas les cartes sous les yeux de l'apprenant.
  // b.ordonne : des choix qui ont un ordre naturel (Case 1 à Case 4) ne se mélangent pas.
  function melange(n, texte, ordonne) {
    if (ordonne) return [...Array(n).keys()];
    let g = 2166136261;
    for (const c of texte) g = Math.imul(g ^ c.charCodeAt(0), 16777619) >>> 0;
    const ordre = [...Array(n).keys()];
    for (let i = n - 1; i > 0; i--) { g = Math.imul(g ^ (g >>> 15), 2246822519) >>> 0; const j = g % (i + 1); [ordre[i], ordre[j]] = [ordre[j], ordre[i]]; }
    return ordre;
  }

  // Une photo s'agrandit au toucher : sur téléphone, l'extrémité d'une
  // électrode ne fait qu'une quinzaine de pixels (audit 3).
  function agrandir(svg, alt) {
    const dlg = h("dialog", { class: "loupe", "aria-label": alt });
    const fermer = () => { dlg.close(); dlg.remove(); };
    dlg.append(h("button", { class: "loupe__fermer", type: "button", onclick: fermer }, "Fermer"), svg.cloneNode(true));
    dlg.addEventListener("click", (e) => { if (e.target === dlg) fermer(); });
    dlg.addEventListener("close", () => dlg.remove());
    document.body.append(dlg); dlg.showModal();
  }
  const cle = (diapo, i, sous = "") => `${diapo}:${i}:${sous}`;

  // Après un redessin, le focus va sur le dernier élément marqué data-focus :
  // un lecteur d'écran l'annonce, le clavier ne repart pas du haut (G1).
  let aFocaliser = false, aRemonter = false;
  const demanderFocus = () => { aFocaliser = true; };

  // ============================================================
  // Planche et fiche
  // ============================================================
  // Le dessin, avec ses repères numérotés posés aux ancres demandées.
  // Une PHOTO (piece.photo) est posée dans un SVG à ses dimensions : les
  // repères se placent alors en pixels de la photo, comme sur un dessin.
  function planche(piece, reperes = {}) {
    let d;
    if (piece.photo) {
      const ph = PH[piece.photo];
      if (!ph) return h("div", { class: "planche" }, `[photo inconnue : ${piece.photo}]`);
      d = { ancres: ph.ancres || {}, alt: ph.alt, svg: `<svg viewBox="0 0 ${ph.w} ${ph.h}" aria-hidden="true" class="pl-svg pl-photo"><image href="images/${piece.photo}.jpg" width="${ph.w}" height="${ph.h}"/></svg>` };
    } else {
      const f = P[piece.dessin];
      if (!f) return h("div", { class: "planche" }, `[dessin inconnu : ${piece.dessin}]`);
      d = f(...(piece.args || []));
    }
    const ph = piece.photo ? PH[piece.photo] : null;
    const el = h("figure", { class: "planche" + (ph ? " planche--photo" : ""), role: "img", "aria-label": piece.alt || d.alt, html: d.svg,
      style: ph ? `aspect-ratio: ${ph.w} / ${ph.h}` : null });
    const svg = el.querySelector("svg");
    for (const [k, num] of Object.entries(reperes)) {
      const a = d.ancres[k];
      if (!a || !svg) continue;
      // Rayon au 26e de la photo : sur téléphone (photo de 280 px), une
      // pastille d'environ 22 px et un chiffre lisible (audit 3).
      const r = piece.photo ? Math.round(PH[piece.photo].w / 26) : 9;
      svg.insertAdjacentHTML("beforeend", `<g class="pl-repere"><circle cx="${a[0]}" cy="${a[1]}" r="${r}"/><text x="${a[0]}" y="${a[1]}" style="font-size:${Math.round(r * 1.25)}px">${num}</text></g>`);
    }
    if (ph) el.append(h("button", { class: "planche__agrandir", type: "button", "aria-label": "Agrandir la photo", onclick: () => agrandir(svg, piece.alt || d.alt) }, "⤢ Agrandir"));
    return el;
  }

  // Une pièce à juger : la planche, et le bon de travail qui l'accompagne.
  // Les mesures portent aussi un repère (on pointe la valeur qui décide).
  function fiche(c, reperes = {}) {
    return h("article", { class: "fiche", "aria-label": c.titre || "Pièce à examiner" },
      planche(c, reperes),
      h("div", { class: "fiche__bon" },
        c.titre ? h("p", { class: "fiche__titre" }, c.titre) : null,
        (c.lignes || []).map(l => h("p", { class: "fiche__ligne", html: riche(l) })),
        c.mesures ? h("div", { class: "fiche__mesures" }, c.mesures.map(m => h("span", {
          class: "fiche__mesure" + (m.repere && reperes[m.repere] ? " repere" : ""), "data-n": m.repere && reperes[m.repere] ? reperes[m.repere] : null
        }, `${m.l} : ${m.v}`))) : null));
  }

  // ============================================================
  // Activités
  // ============================================================
  function retroEl(type, titre, texte, ...suite) {
    // Le titre dit déjà « Oui. » : le texte ne le répète pas.
    const mot = String(titre).replace(/[.!:]+$/, "");
    if (texte && mot.length < 12 && texte.startsWith(mot)) texte = texte.slice(mot.length).replace(/^\s*[.:,]\s*/, "").replace(/^./, c => c.toUpperCase());
    return h("div", { class: `retro retro--${type}`, role: "status", "data-focus": "" },
      h("div", { class: "retro__titre" }, titre), texte ? h("div", { class: "retro__texte", html: riche(texte) }) : null, ...suite);
  }
  const boutonPlein = (texte, onclick, focus) => h("button", { class: "tri__choix tri__choix--plein", type: "button", "data-focus": focus ? "" : null, onclick }, texte);
  const recommencer = (onclick) => h("button", { class: "lien-discret", type: "button", onclick }, "Recommencer");

  function boutonsTri(onChoix, choisi, question) {
    return h("div", { class: "tri", role: "group", "aria-label": question || "Votre décision", "data-focus": choisi ? null : "" },
      Object.entries(VERDICTS).map(([k, v]) => h("button", {
        class: "tri__choix", type: "button", "aria-pressed": choisi === k ? "true" : "false", disabled: !!choisi,
        onclick: () => onChoix(k)
      }, h("span", { class: `verdict verdict--${v.ton}`, "data-icone": v.icone || null, "aria-hidden": "true", style: "padding:0;background:none" }), v.long)));
  }

  function boutonsIndice(onChoix, choisi) {
    return h("div", { class: "indice" },
      h("p", { class: "indice__q", "data-focus": choisi ? null : "" }, A.questionIndice || "Qu'est-ce qui vous a décidé ?"),
      h("div", { class: "tri", role: "group", "aria-label": A.questionIndice || "Qu'est-ce qui vous a décidé ?" },
        Object.entries(INDICES).map(([k, v]) => h("button", {
          class: "tri__choix", type: "button", "aria-pressed": choisi === k ? "true" : "false", disabled: !!choisi, onclick: () => onChoix(k)
        }, v))));
  }

  const estJuste = (it, choix) => (it.acceptes || [it.bonne]).includes(choix);
  const nomsIndices = (it) => (it.indices || []).map(i => INDICES[i].toLowerCase()).join(" ou ");

  // Une pièce, une décision, une rétroaction par choix (D2, E1, E2)
  function tri(b, k, redessiner) {
    const choisi = etat.get(k);
    const droite = h("div", { class: "diapo__col diapo__col--etroite" },
      b.consigne ? h("div", { class: "consigne", html: riche(b.consigne) }) : null,
      boutonsTri((v) => { etat.set(k, v); demanderFocus(); redessiner(); }, choisi));
    if (choisi) {
      const juste = estJuste(b, choisi);
      droite.append(retroEl(juste ? "juste" : "rate",
        juste ? `Juste : ${VERDICTS[choisi].court.toLowerCase()}.` : `Décision attendue : ${VERDICTS[b.bonne].court.toLowerCase()}.`,
        b.retro[choisi]));
      droite.append(recommencer(() => { etat.delete(k); demanderFocus(); redessiner(); }));
    }
    return h("div", { class: "diapo__corps" }, h("div", { class: "diapo__col" }, fiche(b.piece, choisi ? (b.reperes || {}) : {})), droite);
  }

  // Exemple travaillé : les repères s'allument un à un (C3, C4)
  function exemple(b, k, redessiner) {
    const n = etat.get(k) || 0;
    const reperes = {};
    b.etapes.slice(0, n).forEach((e, i) => { if (e.repere) reperes[e.repere] = i + 1; });
    const liste = h("ol", { class: "verif" },
      b.etapes.map((e, i) => h("li", { class: "verif__item", "data-actif": i < n ? "true" : "false", "data-focus": i === n - 1 && n < b.etapes.length ? "" : null },
        h("span", { class: "verif__q" }, e.q), h("span", { class: "verif__r", html: i < n ? riche(e.r) : "…" }))));
    const suite = n < b.etapes.length
      ? boutonPlein(n === 0 ? (b.debut || "Commencer l'examen") : (b.suivant || "Point suivant"), () => { etat.set(k, n + 1); demanderFocus(); redessiner(); })
      : b.verdict ? retroEl(ton(b.verdict) === "fraude" ? "rate" : ton(b.verdict) === "sur" ? "juste" : "neutre", `Décision : ${VERDICTS[b.verdict].court.toLowerCase()}.`, b.conclusion)
      : retroEl("neutre", b.fin || "C'est fait.", b.conclusion);
    if (!b.piece) return h("div", { class: "diapo__corps diapo__corps--pile" }, b.intro ? p(b.intro, "diapo__chapeau") : null, liste, suite);
    return h("div", { class: "diapo__corps" }, h("div", { class: "diapo__col" }, fiche(b.piece, reperes)), h("div", { class: "diapo__col diapo__col--etroite" }, liste, suite));
  }

  // Question à choix, rétroaction propre à chaque choix
  function options(b, k, redessiner) {
    const choisi = etat.get(k);
    const col = h("div", { class: "diapo__col" },
      b.q ? p(b.q, "diapo__chapeau") : null,
      h("div", { class: "options", role: "group", "aria-label": b.q ? b.q.replace(/\*\*/g, "") : "Choix" }, melange(b.choix.length, b.choix.map(c => c.x).join("|"), b.ordonne).map(i => h("button", {
        class: "options__choix", type: "button", "aria-pressed": choisi === i ? "true" : "false",
        onclick: () => { etat.set(k, i); demanderFocus(); redessiner(); }
      }, b.choix[i].x))));
    if (choisi != null) {
      const c = b.choix[choisi];
      col.append(retroEl(c.juste ? "juste" : "rate", c.juste ? "Oui." : c.grave ? "Danger." : "Pas tout à fait.", c.retro));
    }
    if (!b.piece) return col;
    const piece = choisi != null && b.pieceApres ? b.pieceApres : b.piece;
    return h("div", { class: "diapo__corps" }, h("div", { class: "diapo__col" }, fiche(piece, choisi != null ? (b.reperesApres || b.reperes || {}) : {})), col);
  }

  // Remettre les étapes dans l'ordre (D1, D2). L'apprenant choisit l'étape
  // suivante ; un mauvais choix ne coûte rien, mais il dit QUELLE étape vient
  // d'abord (l'étape attendue, pas une raison figée), puis pourquoi celle-ci
  // attend. La rétroaction passe AU-DESSUS des étapes restantes : sur
  // téléphone, elle tombait sous une liste qu'il fallait remonter (audit 2).
  // Les étapes sont présentées dans un ordre fixe mélangé (b.melange).
  function ordre(b, k, redessiner) {
    let s = etat.get(k);
    if (!s) { s = { faites: [], erreurs: 0, dernier: null }; etat.set(k, s); }
    const restantes = b.melange.filter(i => !s.faites.includes(i));
    const fini = restantes.length === 0;
    const droite = h("div", { class: "ordre__col" },
      h("p", { class: "ordre__titre" }, "Votre séquence"),
      s.faites.length ? h("ol", { class: "ordre__suite", "aria-label": "Votre séquence" }, s.faites.map(i => h("li", null, b.etapes[i].x)))
        : h("p", { class: "ordre__vide" }, "Choisissez la première étape."));
    let retro = null;
    if (s.dernier != null && !fini) {
      const e = b.etapes[s.dernier];
      retro = s.dernierJuste ? retroEl("juste", "Oui.", e.oui)
        : retroEl("rate", `Pas encore : d'abord « ${b.etapes[s.attendue].x.replace(/ \(.*\)$/, "").toLowerCase()} ».`, e.tot);
    }
    if (fini) {
      droite.append(retroEl(s.erreurs === 0 ? "juste" : "neutre", s.erreurs === 0 ? "Séquence complète, sans détour." : `Séquence complète, avec ${s.erreurs} détour${s.erreurs > 1 ? "s" : ""}.`, b.bilan));
      droite.append(recommencer(() => { etat.delete(k); demanderFocus(); redessiner(); }));
    }
    const gauche = h("div", { class: "ordre__col" },
      h("p", { class: "ordre__titre" }, fini ? "Toutes les étapes sont placées" : `Étape ${s.faites.length + 1} sur ${b.etapes.length} : laquelle vient maintenant ?`),
      retro,
      fini ? null : h("div", { class: "options", role: "group", "aria-label": "Étapes restantes" }, restantes.map(i => h("button", {
        class: "options__choix", type: "button",
        onclick: () => {
          const attendue = b.etapes.findIndex((_, j) => !s.faites.includes(j));
          s.dernier = i; s.attendue = attendue; s.dernierJuste = i === attendue;
          if (s.dernierJuste) s.faites.push(i); else s.erreurs++;
          demanderFocus(); redessiner();
        }
      }, b.etapes[i].x))));
    return h("div", { class: "ordre" }, gauche, droite);
  }

  // Série : l'épreuve, ou un entraînement (b.entrainement). Chaque item est
  // soit une PIÈCE à juger (décision, puis ce qu'on a vu si l'item porte des
  // indices), soit une SITUATION à choix. Deux seuils possibles, comptés à
  // part : b.seuilPieces et b.seuilSituations (sinon b.seuil sur le tout).
  // Un item peut porter des réponses graves (it.graves, ou choix.grave) : en
  // choisir une fait échouer, quel que soit le score, et c'est annoncé avant
  // (voir boucle-didactique : « une erreur coûteuse qui ne fait pas échouer »).
  // b.reprise : un second jeu INÉDIT, de même composition.
  function serie(b, k, redessiner) {
    let s = etat.get(k);
    const neuf = (jeu, echecs, exercice) => ({ jeu, echecs, exercice: !!exercice, i: 0, rep: [], ind: [], demarre: false, voir: {} });
    if (!s) { s = neuf(0, 0); etat.set(k, s); }
    const items = s.jeu === 1 && b.reprise ? b.reprise : b.items;
    const total = items.length;
    const aIndice = (it) => b.indice && !it.choix && it.indices;
    const juste = (it, i) => it.choix ? !!it.choix[s.rep[i]]?.juste : estJuste(it, s.rep[i]);
    const grave = (it, i) => it.choix ? !!it.choix[s.rep[i]]?.grave : (it.graves || []).includes(s.rep[i]);
    const bonIndice = (it, i) => !aIndice(it) || it.indices.includes(s.ind[i]);
    const reussite = (it, i) => juste(it, i) && bonIndice(it, i);
    const libelleRep = (it, i) => it.choix ? `« ${it.choix[s.rep[i]].x.replace(/[.…]$/, "")} »` : VERDICTS[s.rep[i]].court.toLowerCase();

    if (!s.demarre) {
      return h("div", { class: "diapo__corps diapo__corps--pile" },
        b.consigne ? p(b.consigne, "diapo__chapeau") : null,
        b.annonce ? h("div", { class: "consigne", html: riche(b.annonce) }) : null,
        boutonPlein(s.jeu === 1 ? "Commencer la reprise" : "Commencer", () => { s.demarre = true; demanderFocus(); redessiner(); }, true));
    }

    if (s.i >= total) {
      const idx = items.map((it, i) => ({ it, i }));
      const pieces = idx.filter(x => !x.it.choix), situations = idx.filter(x => x.it.choix);
      const bons = (l) => l.filter(x => reussite(x.it, x.i)).length;
      const elimine = !b.entrainement && items.some(grave);
      const exercice = s.exercice;
      const separes = b.seuilPieces != null;
      const atteint = !elimine && (separes
        ? bons(pieces) >= b.seuilPieces && bons(situations) >= (b.seuilSituations ?? situations.length)
        : bons(idx) >= (b.seuil ?? total));
      const reussi = b.entrainement || exercice || atteint;
      const rates = idx.filter(x => !reussite(x.it, x.i));
      const echecs = s.echecs + (reussi ? 0 : 1);
      const bloque = !reussi && echecs >= 2 && b.revoir;
      // Après la reprise ratée, on ne renvoie pas à une série déjà corrigée
      // sans rien dire : on revoit les modules, et on parle à l'enseignant.
      const prochain = b.reprise ? (s.jeu + 1) % 2 : 0;
      const autreJeu = () => { etat.set(k, neuf(prochain, echecs, (atteint || exercice) && !b.entrainement)); demanderFocus(); redessiner(); };
      const libelle = b.entrainement ? "Recommencer l'entraînement" : !b.reprise ? "Refaire l'épreuve"
        : prochain === 1 ? "Passer l'épreuve de reprise (cas inédits)" : "Refaire l'épreuve de départ";
      const message = b.entrainement ? (b.bilan?.fin || "Entraînement terminé.")
        : exercice ? (atteint ? "Exercice réussi, lui aussi." : "Exercice : ces cas vous auraient fait échouer. Relisez-les ; votre réussite reste acquise.")
        : reussi ? (b.bilan?.reussi || "Seuil atteint.")
        : echecs >= 2 ? (b.bilan?.deuxieme || "Deux essais sans atteindre le seuil : revoyez les modules, puis parlez-en à votre enseignant avant un troisième essai.")
        : prochain === 0 && b.reprise ? (b.bilan?.rateReprise || "Pas encore. Relisez les cas manqués, puis refaites l'épreuve de départ.")
        : (b.bilan?.rate || "Seuil non atteint : refaites l'épreuve.");
      // Deux chiffres de même taille ; « Éliminatoire » quand un geste grave
      // a été choisi, plutôt qu'un « 5 sur 6 » en grand qui dit le contraire.
      const chiffre = (lib, n, sur, seuil) => h("div", { class: "score__ligne" }, h("span", { class: "score__lib" }, lib), h("span", { class: "score__n" }, `${n} sur ${sur}`), seuil != null ? h("span", { class: "score__seuil" }, `seuil ${seuil}`) : null);
      const score = h("div", { class: "score" },
        elimine && !exercice ? h("p", { class: "score__elimine" }, "Éliminatoire") : null,
        separes ? [chiffre(b.libellePieces || "Pièces", bons(pieces), pieces.length, b.seuilPieces), chiffre("Situations", bons(situations), situations.length, b.seuilSituations ?? situations.length)]
          : chiffre("Réussis", bons(idx), total, b.entrainement ? null : (b.seuil ?? total)));
      return h("div", { class: "diapo__corps" },
        h("div", { class: "diapo__col diapo__col--etroite" },
          score,
          retroEl(b.entrainement || exercice ? "neutre" : reussi ? "juste" : "neutre", message,
            elimine && !exercice ? (b.bilan?.elimine || "Une réponse éliminatoire a été choisie : quel que soit le score, on reprend.") : null),
          // Après deux échecs, on ne relance pas une série déjà corrigée
          // (elle se réussirait de mémoire) : on renvoie au module et à
          // l'enseignant, et la série n'est qu'un lien discret.
          bloque ? [boutonPlein(`Revoir le module ${b.revoir.replace("M", "")}`, () => { const j = diaposApres.findIndex(x => x.m.id === b.revoir); if (vue === "formation" && j >= 0) aller(j); }),
                    h("button", { class: "lien-discret", type: "button", onclick: autreJeu }, "Refaire l'épreuve quand même")]
          : reussi && !b.entrainement
            ? h("button", { class: "lien-discret", type: "button", onclick: autreJeu }, prochain === 1 ? "S'exercer aussi sur la reprise (cas inédits)" : "Refaire l'épreuve de départ, pour m'exercer")
            : boutonPlein(libelle, autreJeu)),
        h("div", { class: "diapo__col bilan" }, rates.length
          ? rates.map(({ it, i }) => {
              const causes = [];
              if (!juste(it, i)) causes.push(`Votre réponse : ${libelleRep(it, i)}.${grave(it, i) && !b.entrainement ? " Réponse éliminatoire." : ""}`);
              else if (!bonIndice(it, i)) causes.push(`Bonne décision, mais ce qu'il fallait voir : ${nomsIndices(it)}.`);
              const voir = !!s.voir[i];
              // Numéroté : deux cas manqués pouvaient s'appeler « Disque avant gauche » (audit 3).
              const titre = `Cas ${i + 1} · ${it.piece?.titre || it.titre || "Situation"}`;
              return h("div", { class: "bilan__cas" },
                h("div", { class: "bilan__tete" }, h("span", { class: "bilan__objet" }, titre), it.choix ? null : pastille(it.bonne)),
                h("p", { class: "bilan__cause" }, causes.join(" ")),
                p(it.choix ? it.choix[s.rep[i]].retro : it.retro[s.rep[i]]),
                it.piece ? h("button", { class: "lien-discret", type: "button", "aria-expanded": String(voir), onclick: () => { s.voir[i] = !voir; demanderFocus(); redessiner(); } }, voir ? "Masquer la pièce" : "Revoir la pièce annotée") : null,
                it.piece && voir ? h("div", { "data-focus": "", class: "bilan__piece" }, fiche(it.piece, it.reperes || {})) : null);
            })
          : [p("Aucun cas manqué.", "diapo__chapeau")]));
    }

    const it = items[s.i];
    const rep = s.rep[s.i], ind = s.ind[s.i];
    const fini = rep != null && (!aIndice(it) || ind);
    const montrer = fini && b.retroImmediate !== false;
    const suivant = () => { s.i++; aRemonter = true; demanderFocus(); redessiner(); };
    const droite = h("div", { class: "diapo__col diapo__col--etroite" },
      h("div", { class: "diapo__entete", "data-focus": rep == null ? "" : null }, h("span", null, `Cas ${s.i + 1} sur ${total}${s.jeu === 1 ? (s.exercice ? " · exercice" : " · reprise") : ""}`)));
    if (it.choix) {
      // Dans une série, le hasard seul peut encore grouper la bonne réponse
      // (5 fois sur 7 en tête, mesuré) : sa position TOURNE d'un cas au
      // suivant, et le hasard ne range que les autres choix.
      const ordre = melange(it.choix.length, it.choix.map(c => c.x).join("|"));
      const bonne = it.choix.findIndex(c => c.juste), cible = (s.i + s.jeu) % it.choix.length;
      ordre.splice(ordre.indexOf(bonne), 1); ordre.splice(cible, 0, bonne);
      droite.append(p(it.q, "indice__q"), h("div", { class: "options", role: "group", "aria-label": it.q.replace(/\*\*/g, "") }, ordre.map(j => h("button", {
        class: "options__choix", type: "button", "aria-pressed": rep === j ? "true" : "false", disabled: rep != null,
        onclick: () => { s.rep[s.i] = j; demanderFocus(); redessiner(); }
      }, it.choix[j].x))));
    } else {
      const q = it.q || "Votre décision ?";
      droite.append(p(q, "indice__q"));
      droite.append(boutonsTri((v) => { s.rep[s.i] = v; demanderFocus(); redessiner(); }, rep, q));
      if (rep != null && aIndice(it)) droite.append(boutonsIndice((x) => { s.ind[s.i] = x; demanderFocus(); redessiner(); }, ind));
    }
    if (fini) {
      // La rétroaction passe AVANT le bouton : sur téléphone, un toucher
      // rapide sur « Cas suivant » la sautait (audit 2). La scène s'allonge
      // maintenant au lieu de couper : le bouton ne tombe plus sous le bord.
      if (montrer) {
        const ok = juste(it, s.i);
        droite.append(retroEl(ok ? "juste" : "rate",
          ok ? "Juste." : it.choix ? "Pas cette fois." : `Décision attendue : ${VERDICTS[it.bonne].court.toLowerCase()}.`,
          it.choix ? it.choix[rep].retro : it.retro[rep],
          ok && !bonIndice(it, s.i) ? h("div", { class: "retro__texte" }, `Ce qu'il fallait voir : ${nomsIndices(it)}.`) : null));
      }
      droite.append(boutonPlein(s.i + 1 < total ? "Cas suivant" : "Voir le bilan", suivant, !montrer));
    }
    const gauche = it.piece ? fiche(it.piece, montrer ? (it.reperes || {}) : {})
      : h("div", { class: "consigne-situation" }, it.titre ? h("p", { class: "fiche__titre" }, it.titre) : null, p(it.situation), it.photo ? planche({ photo: it.photo }) : null);
    return h("div", { class: "diapo__corps" }, h("div", { class: "diapo__col" }, gauche), droite);
  }

  // ============================================================
  // Blocs de la version finale
  // ============================================================
  function bloc(b, k, redessiner) {
    switch (b.t) {
      case "mega":     return p(b.x, "diapo__mega");
      case "chapeau":  return p(b.x, "diapo__chapeau");
      case "para":     return p(b.x);
      case "pied":     return p(b.x, "diapo__pied");
      case "consigne": return h("div", { class: "consigne", html: riche(b.x) });
      case "lien":     return h("a", { class: "lien-externe", href: b.href, target: "_blank", rel: "noopener" }, b.x);
      case "regle":    return h("div", { class: "regle" }, b.items.map(r => h("div", { class: "regle__ligne" }, pastille(r.v), h("span", { class: "regle__si", html: riche(r.si) }))));
      case "verif":    return h("ol", { class: "verif" }, b.items.map((it, i) => h("li", { class: "verif__item", "data-actif": b.actif && !b.actif.includes(i + 1) ? "false" : "true" },
                         h("span", { class: "verif__q", html: riche(it.q) }), h("span", { class: "verif__r", html: riche(it.r) }))));
      case "memo":     return h("div", { class: "memo" }, h("p", { class: "memo__titre" }, b.titre),
                         h("ol", { class: "verif" }, b.items.map(it => h("li", { class: "verif__item" }, h("span", { class: "verif__q", html: riche(it.q) }), h("span", { class: "verif__r", html: riche(it.r) })))),
                         b.pied ? p(b.pied, "diapo__pied") : null);
      case "planche":  return planche(b.piece, b.reperes || {});
      case "fiche":    return fiche(b.piece, b.reperes || {});
      case "colonnes": return h("div", { class: "diapo__corps" },
                         h("div", { class: "diapo__col" + (b.etroite === "gauche" ? " diapo__col--etroite" : "") }, b.gauche.map((x, i) => bloc(x, k + "g" + i, redessiner))),
                         h("div", { class: "diapo__col" + (b.etroite === "droite" ? " diapo__col--etroite" : "") }, b.droite.map((x, i) => bloc(x, k + "d" + i, redessiner))));
      case "tri":      return tri(b, k, redessiner);
      case "exemple":  return exemple(b, k, redessiner);
      case "options":  return options(b, k, redessiner);
      case "ordre":    return ordre(b, k, redessiner);
      case "serie":    return serie(b, k, redessiner);
      default:         return p(`[bloc inconnu : ${b.t}]`);
    }
  }

  const PLEIN_CADRE = ["tri", "exemple", "serie", "colonnes", "ordre"];
  function sceneApres(d, module) {
    const scene = h("div", { class: "scene" });
    const dessiner = () => {
      const diapo = h("section", { class: "diapo" + (d.gabarit === "ouverture" ? " diapo--ouverture" : ""), "aria-label": (d.titre || "Diapositive").replace(/\*\*/g, "") },
        h("div", { class: "diapo__entete" }, h("span", null, `${module.id.replace("M", "Module ")} · ${module.titre}`), h("span", null, d.surtitre || "")),
        d.titre ? h("h2", { class: "diapo__titre", html: riche(d.titre) }) : null);
      const plein = d.blocs.length === 1 && (PLEIN_CADRE.includes(d.blocs[0].t) || (d.blocs[0].t === "options" && d.blocs[0].piece));
      diapo.append(plein ? bloc(d.blocs[0], cle(d.id, 0), dessiner)
        : h("div", { class: "diapo__corps diapo__corps--pile" }, d.blocs.map((b, i) => bloc(b, cle(d.id, i), dessiner))));
      scene.replaceChildren(h("div", { class: "plateau" }, diapo));
      if (aFocaliser) {
        aFocaliser = false;
        const cible = [...scene.querySelectorAll("[data-focus]")].pop();
        if (cible) { if (!cible.matches("button, a")) cible.tabIndex = -1; cible.focus({ preventScroll: aRemonter }); }
      }
      // Au cas suivant, on remonte au haut de la scène : la photo et la
      // question d'abord, pas le bas de l'écran précédent (audit 3).
      if (aRemonter) { aRemonter = false; scene.scrollIntoView({ block: "start" }); }
    };
    dessiner();
    return scene;
  }

  // ============================================================
  // Version zéro (brouillon)
  // ============================================================
  function sceneAvant(d) {
    const scene = h("div", { class: "scene" });
    const br = h("section", { class: "brouillon", "aria-label": `Version zéro : ${d.titre}` }, h("h3", { class: "brouillon__titre" }, d.titre));
    for (const b of d.blocs) {
      if (b.t === "sous-titre" || b.t === "para") br.append(h("p", null, b.x));
      else if (b.t === "puces") br.append(h("ul", null, b.x.map(x => h("li", null, x))));
      else if (b.t === "image") br.append(h("div", { class: "brouillon__image" }, `[ ${b.alt} ]`));
      else if (b.t === "chiffres") br.append(h("div", { class: "brouillon__chiffres" }, b.x.map(c => h("div", null, h("b", null, c.n), h("span", null, c.l)))));
      else if (b.t === "note") br.append(h("p", { class: "brouillon__note" }, b.x));
      else if (b.t === "grand") br.append(h("p", { class: "brouillon__grand" }, b.x));
      else if (b.t === "legende") br.append(h("p", { class: "brouillon__legende" }, b.x));
      else if (b.t === "quiz") br.append(h("div", { class: "brouillon__quiz" }, h("ol", null, b.questions.map(q => h("li", null, q.q, h("ol", null, q.choix.map(c => h("li", null, c)))))),
        h("p", { class: "brouillon__legende" }, `Rétroaction prévue : « ${b.questions[0].retro.bien} » / « ${b.questions[0].retro.mal} »`)));
    }
    scene.append(h("div", { class: "plateau" }, br));
    return scene;
  }

  // ============================================================
  // Index : diapos de la version finale, et journal par diapo
  // ============================================================
  const diaposApres = [];
  A.modules.forEach(m => m.diapos.forEach(d => diaposApres.push({ d, m })));
  const diaposAvant = {};
  V.modules.forEach(m => m.diapos.forEach(d => { diaposAvant[d.id] = { d, m }; }));
  const parcours = J.entrees.map(e => ({ e, apres: e.apres ? diaposApres.find(x => x.d.id === e.apres) : null, avant: e.avant ? diaposAvant[e.avant] : null }));

  // ============================================================
  // Vues
  // ============================================================
  const racine = document.getElementById("vue");
  const nav = document.getElementById("navigation");
  let vue = "formation", idx = 0;

  function critereEl(code, grav) {
    const c = G.criteres[code];
    return h("span", { class: "critere", title: c ? c.q : "" }, h("span", { class: "critere__code" }, code), c ? h("span", { class: "critere__nom" }, c.nom) : null,
      grav ? h("span", { class: `gravite gravite--${grav}`, "aria-label": `constat ${grav}` }) : null);
  }

  const TOURS = [["tour2", "2e tour"], ["tour3", "3e tour"], ["tour4", "4e tour"]];
  function lignesJournal(e) {
    const statut = e.statut === "modifiee" ? "modifiée" : e.statut === "ajoutee" ? (e.tour > 1 ? `ajoutée au ${e.tour}e tour` : "ajoutée") : e.statut === "retiree" ? "retirée" : "conservée";
    return h("div", { class: "journal" },
      h("div", { class: "journal__ligne" },
        h("div", { class: "journal__tete" }, h("span", { class: `statut statut--${e.statut}` }, statut), e.criteres.map(c => critereEl(c.code, c.grav))),
        h("p", { class: "journal__texte", html: riche(e.pourquoi) }),
        e.note ? h("p", { class: "note-marge" }, e.note) : null),
      TOURS.map(([c, lib]) => e[c] ? h("div", { class: "journal__ligne journal__ligne--tour2" },
        h("div", { class: "journal__tete" }, h("span", { class: "statut" }, lib), e[c].criteres.map(x => critereEl(x.code, x.grav))),
        h("p", { class: "journal__texte", html: riche(e[c].pourquoi) })) : null));
  }

  function barreNav(max, libelle) {
    return h("div", { class: "barre" },
      h("button", { class: "barre__btn", type: "button", disabled: idx === 0, onclick: () => aller(idx - 1), "aria-label": "Diapositive précédente" }, "←"),
      h("span", { class: "barre__pos" }, libelle),
      h("button", { class: "barre__btn", type: "button", disabled: idx >= max - 1, onclick: () => aller(idx + 1), "aria-label": "Diapositive suivante" }, "→"));
  }

  function vueFormation() {
    const { d, m } = diaposApres[idx];
    return h("div", { class: "pile" }, sceneApres(d, m), barreNav(diaposApres.length, `${m.id} · ${m.diapos.indexOf(d) + 1} / ${m.diapos.length}`));
  }

  function vueComparer() {
    const { e, apres, avant } = parcours[idx];
    const cote = (titre, scene, cls) => h("figure", { class: "comparer__cote " + cls }, h("figcaption", { class: "comparer__legende" }, titre), scene);
    const avantScene = avant ? sceneAvant(avant.d) : h("div", { class: "scene scene--vide" }, h("p", null, "Aucune diapositive équivalente dans la version zéro."));
    const apresScene = apres ? sceneApres(apres.d, apres.m) : h("div", { class: "scene scene--vide" }, h("p", null, "Retirée de la version finale."));
    const modTitre = apres ? `${apres.m.id} · ${apres.m.titre}` : `Version zéro · ${avant.m.titre}`;
    return h("div", { class: "pile" },
      h("div", { class: "comparer" },
        cote(`Avant${avant ? " · " + avant.d.id.replace("A-", "") : ""}`, avantScene, "comparer__cote--avant"),
        cote(`Après${apres ? " · " + apres.d.id : ""}`, apresScene, "comparer__cote--apres")),
      barreNav(parcours.length, `${idx + 1} / ${parcours.length} · ${modTitre}`),
      lignesJournal(e));
  }

  function vueBoucle() {
    const compte = {};
    J.entrees.forEach(e => [e, ...TOURS.map(([c]) => e[c]).filter(Boolean)].forEach(x => x.criteres.forEach(c => { compte[c.code] = (compte[c.code] || 0) + 1; })));
    const maxc = Math.max(...Object.values(compte), 1);
    const stat = (k) => J.entrees.filter(e => e.statut === k).length;
    const audit = (a) => h("div", { class: "audit" },
      h("h3", null, a.titre), h("p", { class: "audit__date" }, a.sous),
      h("dl", { class: "audit__chiffres" }, ["bloquant", "majeur", "mineur"].map(g => h("div", null, h("dt", null, h("span", { class: `gravite gravite--${g}` }, g)), h("dd", null, String(a[g]))))),
      a.note ? p(a.note, "audit__note") : null);
    return h("div", { class: "boucle" },
      h("section", { class: "boucle__bloc" },
        h("h2", null, "Cadrage"), p(B.cadrage.public), p(B.cadrage.ecart),
        h("h3", null, "Objectifs"),
        h("ol", { class: "objectifs" }, A.objectifs.map(o => h("li", null, h("b", null, o.id), " ", h("span", { html: riche(o.x) })))),
        h("h3", null, "Alignement"),
        h("div", { class: "defile" }, h("table", { class: "tableau" },
          h("thead", null, h("tr", null, h("th", null, "Objectif"), h("th", null, "Pratiqué dans"), h("th", null, "Évalué dans"))),
          h("tbody", null, B.alignement.map(r => h("tr", null, h("td", null, h("b", null, r.o)), h("td", null, r.pratique), h("td", null, r.evalue))))))),
      h("section", { class: "boucle__bloc" },
        h("h2", null, "Les audits"),
        h("div", { class: "audits" }, B.audits.map(audit)),
        h("p", { class: "boucle__bilan" }, `${stat("modifiee")} diapositives modifiées, ${stat("ajoutee")} ajoutées, ${stat("retiree")} retirées, ${stat("conservee")} conservées. Durée : ${V.duree} → ${A.duree}.`)),
      h("section", { class: "boucle__bloc" },
        h("h2", null, "Critères qui ont motivé les changements"),
        h("p", { class: "boucle__aide" }, "Nombre de changements, tous tours confondus, qui citent chaque critère de la grille."),
        h("div", { class: "barres" }, Object.entries(G.criteres).map(([code]) => {
          const n = compte[code] || 0;
          return h("div", { class: "barres__ligne" + (n ? "" : " barres__ligne--nul") },
            critereEl(code), h("span", { class: "barres__piste" }, h("span", { class: "barres__trait", style: `width:${(n / maxc) * 100}%` })), h("span", { class: "barres__n" }, String(n)));
        }))),
      h("section", { class: "boucle__bloc" },
        h("h2", null, "Ce que la boucle ne vérifie pas"),
        h("ul", null, B.limites.map(l => h("li", { html: riche(l) })))));
  }

  function dessinerNav() {
    nav.replaceChildren();
    if (vue === "boucle") { nav.hidden = true; return; }
    nav.hidden = false;
    if (vue === "formation") {
      A.modules.forEach(m => {
        const premier = diaposApres.findIndex(x => x.m === m);
        const actif = diaposApres[idx].m === m;
        nav.append(h("button", { class: "nav__module" + (actif ? " nav__module--actif" : ""), type: "button", "aria-current": actif ? "true" : null, onclick: () => aller(premier) },
          h("span", { class: "nav__num" }, m.id), h("span", null, m.titre), h("span", { class: "nav__duree" }, m.duree)));
      });
    } else {
      let dernier = null;
      parcours.forEach((x, i) => {
        const m = A.modules.find(mm => mm.id === x.e.module);
        const mod = m ? `${m.id} · ${m.titre}` : x.e.module;
        if (mod !== dernier) { nav.append(h("div", { class: "nav__groupe" }, mod)); dernier = mod; }
        nav.append(h("button", { class: "nav__diapo" + (i === idx ? " nav__diapo--actif" : ""), type: "button", "aria-current": i === idx ? "true" : null, onclick: () => aller(i) },
          h("span", { class: `statut statut--${x.e.statut}`, title: { modifiee: "Modifiée", ajoutee: "Ajoutée", retiree: "Retirée", conservee: "Conservée" }[x.e.statut] }, x.e.statut[0].toUpperCase()),
          h("span", { class: x.e.statut === "retiree" ? "nav__retiree" : null }, x.apres ? (x.apres.d.titre || x.apres.d.id).replace(/\*\*/g, "") : x.avant.d.titre)));
      });
    }
  }

  function dessiner() {
    document.querySelectorAll("[data-vue]").forEach(b => b.setAttribute("aria-selected", String(b.dataset.vue === vue)));
    racine.replaceChildren(vue === "formation" ? vueFormation() : vue === "comparer" ? vueComparer() : vueBoucle());
    dessinerNav();
    try { history.replaceState(null, "", "#" + vue); } catch (_) {}
  }
  function aller(i) {
    const max = vue === "formation" ? diaposApres.length : parcours.length;
    idx = Math.max(0, Math.min(max - 1, i));
    dessiner();
  }
  function changerVue(v) {
    if (v === vue) return;
    if (v === "comparer" && vue === "formation") { const id = diaposApres[idx].d.id; const j = parcours.findIndex(x => x.apres && x.apres.d.id === id); idx = j < 0 ? 0 : j; }
    else if (v === "formation" && vue === "comparer") { const x = parcours[idx]; const j = x.apres ? diaposApres.findIndex(y => y.d.id === x.apres.d.id) : 0; idx = j < 0 ? 0 : j; }
    else idx = 0;
    vue = v; dessiner();
  }

  document.querySelectorAll("[data-vue]").forEach(b => b.addEventListener("click", () => changerVue(b.dataset.vue)));
  document.addEventListener("keydown", (e) => {
    // Dans la diapo, les flèches appartiennent à l'activité.
    if (vue === "boucle" || e.target.closest("input, textarea, .scene")) return;
    if (e.key === "ArrowRight" || e.key === "PageDown") aller(idx + 1);
    else if (e.key === "ArrowLeft" || e.key === "PageUp") aller(idx - 1);
  });

  const depart = (location.hash || "").slice(1);
  if (["formation", "comparer", "boucle"].includes(depart)) vue = depart;
  dessiner();
})();

</script>

</html>
