lid #0A8F5B;padding-top:18px\"><div style=\"font-size:24px;font-weight:900;color:#0A8F5B\">01<\u002Fdiv><div style=\"font-size:28px;font-weight:700\">Le mécanisme<\u002Fdiv><\u002Fdiv>\n<div class=\"p\" style=\"--d:.40s;flex:1;border-top:4px solid #2E5B4A;padding-top:18px\"><div style=\"font-size:24px;font-weight:900;color:#7FD3AE\">02<\u002Fdiv><div style=\"font-size:28px;font-weight:700;color:#C9CDD0\">La qualité<\u002Fdiv><\u002Fdiv>\n<div class=\"p\" style=\"--d:.46s;flex:1;border-top:4px solid #2E5B4A;padding-top:18px\"><div style=\"font-size:24px;font-weight:900;color:#7FD3AE\">03<\u002Fdiv><div style=\"font-size:28px;font-weight:700;color:#C9CDD0\">L'utilité<\u002Fdiv><\u002Fdiv>\n<div class=\"p\" style=\"--d:.52s;flex:1;border-top:4px solid #2E5B4A;padding-top:18px\"><div style=\"font-size:24px;font-weight:900;color:#7FD3AE\">04<\u002Fdiv><div style=\"font-size:28px;font-weight:700;color:#C9CDD0\">Les outils<\u002Fdiv><\u002Fdiv>\n<div class=\"p\" style=\"--d:.58s;flex:1;border-top:4px solid #2E5B4A;padding-top:18px\"><div style=\"font-size:24px;font-weight:900;color:#7FD3AE\">05<\u002Fdiv><div style=\"font-size:28px;font-weight:700;color:#C9CDD0\">Les aptitudes<\u002Fdiv><\u002Fdiv>\n<div class=\"p\" style=\"--d:.64s;flex:1;border-top:4px solid #2E5B4A;padding-top:18px\"><div style=\"font-size:24px;font-weight:900;color:#7FD3AE\">06<\u002Fdiv><div style=\"font-size:28px;font-weight:700;color:#C9CDD0\">Le matériel<\u002Fdiv><\u002Fdiv>\n<\u002Fdiv>\n<div class=\"r\" style=\"--d:.7s;font-size:24px;font-weight:700;color:#6E7175\">Daniel Tousignant · Francisation · 2026<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\"Le parcours\" data-screen-label=\"02\" data-speaker-notes=\"Annoncer la durée de chaque temps. Les deux premiers sont théoriques mais courts : on ne se sert pas bien d'un outil dont on ignore le fonctionnement.\" style=\"background:#F7F7F5;color:#17181A;font-family:Nunito,system-ui,sans-serif;padding:90px 110px 80px;display:flex;flex-direction:column;gap:46px\">\n<div style=\"display:flex;flex-direction:column;gap:12px\">\n<div class=\"s\" style=\"font-size:24px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:#07734A\">Le parcours<\u002Fdiv>\n<h2 class=\"s\" style=\"--d:.06s;margin:0;font-size:72px;font-weight:900;letter-spacing:-.02em;line-height:1\">Six temps, trois heures<\u002Fh2>\n<\u002Fdiv>\n<div style=\"display:grid;grid-template-columns:repeat(3,1fr);gap:26px\">\n<div class=\"r\" style=\"--d:.12s;background:#fff;border:1px solid #EAEAE8;border-left:6px solid #0A8F5B;border-radius:18px;padding:34px 36px;display:flex;flex-direction:column;gap:12px\">\n<div style=\"font-size:44px;font-weight:900;color:#0A8F5B;line-height:1\">01<\u002Fdiv>\n<div style=\"font-size:36px;font-weight:900\">Le mécanisme<\u002Fdiv>\n<div style=\"font-size:28px;font-weight:600;color:#4B4F52;line-height:1.35\">Ce qu'est vraiment un modèle de langage — et ce qu'il n'est pas.<\u002Fdiv>\n<\u002Fdiv>\n<div class=\"r\" style=\"--d:.18s;background:#fff;border:1px solid #EAEAE8;border-left:6px solid #1D6B8F;border-radius:18px;padding:34px 36px;display:flex;flex-direction:column;gap:12px\">\n<div style=\"font-size:44px;font-weight:900;color:#1D6B8F;line-height:1\">02<\u002Fdiv>\n<div style=\"font-size:36px;font-weight:900\">La qualité<\u002Fdiv>\n<div style=\"font-size:28px;font-weight:600;color:#4B4F52;line-height:1.35\">Ce qui distingue un bon modèle d'un modèle médiocre.<\u002Fdiv>\n<\u002Fdiv>\n<div class=\"r\" style=\"--d:.24s;background:#fff;border:1px solid #EAEAE8;border-left:6px solid #6B4FBB;border-radius:18px;padding:34px 36px;display:flex;flex-direction:column;gap:12px\">\n<div style=\"font-size:44px;font-weight:900;color:#6B4FBB;line-height:1\">03<\u002Fdiv>\n<div style=\"font-size:36px;font-weight:900\">L'utilité<\u002Fdiv>\n<div style=\"font-size:28px;font-weight:600;color:#4B4F52;line-height:1.35\">Où il fait gagner du temps dans le travail d'enseignant.<\u002Fdiv>\n<\u002Fdiv>\n<div class=\"r\" style=\"--d:.30s;background:#fff;border:1px solid #EAEAE8;border-left:6px solid #B45309;border-radius:18px;padding:34px 36px;display:flex;flex-direction:column;gap:12px\">\n<div style=\"font-size:44px;font-weight:900;color:#B45309;line-height:1\">04<\u002Fdiv>\n<div style=\"font-size:36px;font-weight:900\">Les outils<\u002Fdiv>\n<div style=\"font-size:28px;font-weight:600;color:#4B4F52;line-height:1.35\">Claude en conversation, Claude Cowork, Claude Code.<\u002Fdiv>\n<\u002Fdiv>\n<div class=\"r\" style=\"--d:.36s;background:#fff;border:1px solid #EAEAE8;border-left:6px solid #0D7A6F;border-radius:18px;padding:34px 36px;display:flex;flex-direction:column;gap:12px\">\n<div style=\"font-size:44px;font-weight:900;color:#0D7A6F;line-height:1\">05<\u002Fdiv>\n<div style=\"font-size:36px;font-weight:900\">Les aptitudes<\u002Fdiv>\n<div style=\"font-size:28px;font-weight:600;color:#4B4F52;line-height:1.35\">L'art de la consigne : ce qui fait la différence.<\u002Fdiv>\n<\u002Fdiv>\n<div class=\"r\" style=\"--d:.42s;background:#fff;border:1px solid #EAEAE8;border-left:6px solid #166534;border-radius:18px;padding:34px 36px;display:flex;flex-direction:column;gap:12px\">\n<div style=\"font-size:44px;font-weight:900;color:#166534;line-height:1\">06<\u002Fdiv>\n<div style=\"font-size:36px;font-weight:900\">Le matériel<\u002Fdiv>\n<div style=\"font-size:28px;font-weight:600;color:#4B4F52;line-height:1.35\">Produire des exercices, des fiches, des présentations.<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<div class=\"r\" style=\"--d:.5s;background:#EDF6F1;border-radius:18px;padding:28px 36px;font-size:30px;font-weight:700;color:#07734A\">Chaque temps se termine sur quelque chose d'utilisable : une consigne, un document, une décision.<\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\"01 · Le mécanisme\" data-screen-label=\"03\" data-speaker-notes=\"Pas de mathématiques. Objectif : qu'à la fin de cette partie, personne ne croie que Claude « cherche sur Internet » ou « connaît » la réponse.\" style=\"background:#EDF6F1;color:#17181A;font-family:Nunito,system-ui,sans-serif;padding:96px 110px 80px;display:flex;flex-direction:column;justify-content:center;gap:34px\">\n<div class=\"p\" style=\"font-size:200px;font-weight:900;line-height:.78;letter-spacing:-.05em;color:#0A8F5B\">01<\u002Fdiv>\n<div class=\"s\" style=\"--d:.12s;font-size:26px;font-weight:800;letter-spacing:.18em;text-transform:uppercase;color:#07734A\">Le mécanisme<\u002Fdiv>\n<h2 class=\"s\" style=\"--d:.18s;margin:0;font-size:92px;font-weight:900;letter-spacing:-.025em;line-height:1.02\">Ce qu'est un modèle de langage<\u002Fh2>\n<p class=\"r\" style=\"--d:.26s;margin:0;font-size:38px;font-weight:600;color:#4B4F52;max-width:1200px\">Avant de s'en servir, il faut savoir ce qu'il y a dans la boîte.<\u002Fp>\n<div class=\"g\" style=\"--d:.3s;height:6px;background:#0A8F5B;border-radius:3px;max-width:520px\"><\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\"Prédire la suite\" data-screen-label=\"04\" data-speaker-notes=\"Les pourcentages sont illustratifs — le dire. Ce qui compte : plusieurs suites sont plausibles et le modèle en choisit une. D'où la variation d'une réponse à l'autre.\" style=\"background:#F7F7F5;color:#17181A;font-family:Nunito,system-ui,sans-serif;padding:90px 110px 80px;display:flex;flex-direction:column;gap:38px\">\n<div style=\"display:flex;flex-direction:column;gap:10px\">\n<div class=\"s\" style=\"font-size:24px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:#07734A\">Le mécanisme · 1<\u002Fdiv>\n<h2 class=\"s\" style=\"--d:.06s;margin:0;font-size:68px;font-weight:900;letter-spacing:-.02em;line-height:1\">Une machine à prédire la suite<\u002Fh2>\n<\u002Fdiv>\n<div style=\"display:grid;grid-template-columns:1fr 1.05fr;gap:56px;align-items:start\">\n<div style=\"display:flex;flex-direction:column;gap:26px\">\n<p class=\"r\" style=\"--d:.12s;margin:0;font-size:32px;font-weight:600;line-height:1.4;color:#3A3D40\">Un modèle de langage ne comprend pas une question et ne va pas chercher une réponse dans une base de données. Il fait une seule chose, des milliards de fois : <strong style=\"color:#17181A;font-weight:900\">deviner le mot suivant<\u002Fstrong>.<\u002Fp>\n<p class=\"r\" style=\"--d:.18s;margin:0;font-size:32px;font-weight:600;line-height:1.4;color:#3A3D40\">À force de l'entraîner sur d'énormes quantités de textes, cette simple prédiction finit par produire du raisonnement, de la traduction, de la synthèse — parce que bien prédire la suite d'un texte difficile exige de le comprendre.<\u002Fp>\n<div class=\"r\" style=\"--d:.24s;background:#EDF6F1;border-radius:18px;padding:30px 34px;display:flex;flex-direction:column;gap:10px\">\n<div style=\"font-size:24px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:#07734A\">À retenir<\u002Fdiv>\n<div style=\"font-size:30px;font-weight:700;line-height:1.35;color:#17181A\">Il ne récupère pas de l'information : il la reconstruit. C'est pour ça qu'il est brillant sur la forme et parfois faux sur le fait.<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<div class=\"r\" style=\"--d:.2s;background:#fff;border:1px solid #EAEAE8;border-radius:18px;padding:38px 40px;display:flex;flex-direction:column;gap:26px\">\n<div style=\"font-size:34px;font-weight:900;color:#17181A\">« Je dois prendre rendez-vous chez le… »<\u002Fdiv>\n<div style=\"font-size:24px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:#6E7175\">Les suites que le modèle juge plausibles<\u002Fdiv>\n<div style=\"display:flex;flex-direction:column;gap:18px\">\n<div style=\"display:flex;align-items:center;gap:20px\"><div style=\"width:240px;font-size:30px;font-weight:800\">médecin<\u002Fdiv><div style=\"flex:1;height:34px;background:#F0F0EE;border-radius:17px;overflow:hidden\"><div class=\"g\" style=\"--d:.35s;width:82%;height:100%;background:#0A8F5B;border-radius:17px\"><\u002Fdiv><\u002Fdiv><div style=\"width:96px;text-align:right;font-size:28px;font-weight:900;color:#07734A\">41 %<\u002Fdiv><\u002Fdiv>\n<div style=\"display:flex;align-items:center;gap:20px\"><div style=\"width:240px;font-size:30px;font-weight:800\">dentiste<\u002Fdiv><div style=\"flex:1;height:34px;background:#F0F0EE;border-radius:17px;overflow:hidden\"><div class=\"g\" style=\"--d:.45s;width:54%;height:100%;background:#4FB489;border-radius:17px\"><\u002Fdiv><\u002Fdiv><div style=\"width:96px;text-align:right;font-size:28px;font-weight:900;color:#07734A\">27 %<\u002Fdiv><\u002Fdiv>\n<div style=\"display:flex;align-items:center;gap:20px\"><div style=\"width:240px;font-size:30px;font-weight:800\">notaire<\u002Fdiv><div style=\"flex:1;height:34px;background:#F0F0EE;border-radius:17px;overflow:hidden\"><div class=\"g\" style=\"--d:.55s;width:22%;height:100%;background:#8FCFB4;border-radius:17px\"><\u002Fdiv><\u002Fdiv><div style=\"width:96px;text-align:right;font-size:28px;font-weight:900;color:#4B4F52\">11 %<\u002Fdiv><\u002Fdiv>\n<div style=\"display:flex;align-items:center;gap:20px\"><div style=\"width:240px;font-size:30px;font-weight:800\">coiffeur<\u002Fdiv><div style=\"flex:1;height:34px;background:#F0F0EE;border-radius:17px;overflow:hidden\"><div class=\"g\" style=\"--d:.65s;width:16%;height:100%;background:#B7E0CC;border-radius:17px\"><\u002Fdiv><\u002Fdiv><div style=\"width:96px;text-align:right;font-size:28px;font-weight:900;color:#4B4F52\">8 %<\u002Fdiv><\u002Fdiv>\n<div style=\"display:flex;align-items:center;gap:20px\"><div style=\"width:240px;font-size:30px;font-weight:700;color:#6E7175\">une autre suite<\u002Fdiv><div style=\"flex:1;height:34px;background:#F0F0EE;border-radius:17px;overflow:hidden\"><div class=\"g\" style=\"--d:.75s;width:26%;height:100%;background:#D6D6D2;border-radius:17px\"><\u002Fdiv><\u002Fdiv><div style=\"width:96px;text-align:right;font-size:28px;font-weight:900;color:#4B4F52\">13 %<\u002Fdiv><\u002Fdiv>\n<\u002Fdiv>\n<div style=\"font-size:24px;font-weight:600;color:#6E7175\">Le modèle tire dans cette distribution, mot après mot. Illustration, non une mesure.<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\"Trois étapes\" data-screen-label=\"05\" data-speaker-notes=\"Insister sur l'alignement : c'est ce qui distingue les modèles entre eux bien plus que la taille.\" style=\"background:#F7F7F5;color:#17181A;font-family:Nunito,system-ui,sans-serif;padding:90px 110px 80px;display:flex;flex-direction:column;gap:46px\">\n<div style=\"display:flex;flex-direction:column;gap:10px\">\n<div class=\"s\" style=\"font-size:24px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:#07734A\">Le mécanisme · 2<\u002Fdiv>\n<h2 class=\"s\" style=\"--d:.06s;margin:0;font-size:68px;font-weight:900;letter-spacing:-.02em;line-height:1\">Trois étapes pour le fabriquer<\u002Fh2>\n<\u002Fdiv>\n<div style=\"display:grid;grid-template-columns:1fr 1fr 1fr;gap:30px;align-items:stretch\">\n<div class=\"r\" style=\"--d:.12s;background:#fff;border:1px solid #EAEAE8;border-radius:18px;padding:38px;display:flex;flex-direction:column;gap:18px\">\n<div style=\"width:72px;height:72px;border-radius:36px;background:#E6F5EE;color:#07734A;font-size:36px;font-weight:900;display:flex;align-items:center;justify-content:center\">1<\u002Fdiv>\n<div style=\"font-size:40px;font-weight:900\">Pré-entraînement<\u002Fdiv>\n<div style=\"font-size:28px;font-weight:600;line-height:1.4;color:#4B4F52;flex:1\">On lui fait lire une quantité de texte qu'aucun humain ne pourrait lire. Il en tire la structure de la langue, des faits, des raisonnements.<\u002Fdiv>\n<div style=\"font-size:30px;font-weight:900;color:#0A8F5B\">Il sait parler.<\u002Fdiv>\n<\u002Fdiv>\n<div class=\"r\" style=\"--d:.22s;background:#fff;border:1px solid #EAEAE8;border-radius:18px;padding:38px;display:flex;flex-direction:column;gap:18px\">\n<div style=\"width:72px;height:72px;border-radius:36px;background:#E6F5EE;color:#07734A;font-size:36px;font-weight:900;display:flex;align-items:center;justify-content:center\">2<\u002Fdiv>\n<div style=\"font-size:40px;font-weight:900\">Ajustement<\u002Fdiv>\n<div style=\"font-size:28px;font-weight:600;line-height:1.4;color:#4B4F52;flex:1\">On lui montre des milliers d'exemples de bonnes réponses à des demandes réelles. Il apprend à être utile plutôt que simplement plausible.<\u002Fdiv>\n<div style=\"font-size:30px;font-weight:900;color:#0A8F5B\">Il sait répondre.<\u002Fdiv>\n<\u002Fdiv>\n<div class=\"r\" style=\"--d:.32s;background:#17181A;border-radius:18px;padding:38px;display:flex;flex-direction:column;gap:18px;color:#fff\">\n<div style=\"width:72px;height:72px;border-radius:36px;background:#0A8F5B;color:#fff;font-size:36px;font-weight:900;display:flex;align-items:center;justify-content:center\">3<\u002Fdiv>\n<div style=\"font-size:40px;font-weight:900\">Alignement<\u002Fdiv>\n<div style=\"font-size:28px;font-weight:600;line-height:1.4;color:#C9CDD0;flex:1\">Des humains comparent ses réponses deux à deux. On renforce ce qui est honnête, prudent et clair.<\u002Fdiv>\n<div style=\"font-size:30px;font-weight:900;color:#7FD3AE\">Il sait se tenir.<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<div class=\"r\" style=\"--d:.42s;font-size:30px;font-weight:700;color:#3A3D40;max-width:1500px\">La troisième étape explique pourquoi deux modèles nourris de textes semblables se comportent très différemment. C'est là que se joue le caractère.<\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\"Cinq malentendus\" data-screen-label=\"06\" data-speaker-notes=\"Le deuxième point est le plus important : l'assurance de l'outil n'est pas un indice de justesse. C'est le réflexe à installer avant tout le reste.\" style=\"background:#F7F7F5;color:#17181A;font-family:Nunito,system-ui,sans-serif;padding:90px 110px 80px;display:flex;flex-direction:column;gap:36px\">\n<div style=\"display:flex;flex-direction:column;gap:10px\">\n<div class=\"s\" style=\"font-size:24px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:#07734A\">Le mécanisme · 3<\u002Fdiv>\n<h2 class=\"s\" style=\"--d:.06s;margin:0;font-size:68px;font-weight:900;letter-spacing:-.02em;line-height:1\">Cinq malentendus à écarter tout de suite<\u002Fh2>\n<\u002Fdiv>\n<div style=\"display:grid;grid-template-columns:1fr 1.2fr;gap:0 44px\">\n<div class=\"r\" style=\"--d:.1s;font-size:24px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:#B91C1C;padding-bottom:14px\">✕&nbsp;&nbsp;Ce qu'on croit<\u002Fdiv>\n<div class=\"r\" style=\"--d:.1s;font-size:24px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:#07734A;padding-bottom:14px\">✓&nbsp;&nbsp;Ce qui est vrai<\u002Fdiv>\n<div class=\"r\" style=\"--d:.16s;font-size:31px;font-weight:800;color:#17181A;border-top:1px solid #EAEAE8;padding:22px 0\">« Il cherche sur Internet. »<\u002Fdiv>\n<div class=\"r\" style=\"--d:.16s;font-size:29px;font-weight:600;color:#3A3D40;border-top:1px solid #EAEAE8;padding:22px 0;line-height:1.35\">Non, sauf si on lui en donne l'outil. Autrement il répond de mémoire.<\u002Fdiv>\n<div class=\"r\" style=\"--d:.24s;font-size:31px;font-weight:800;color:#17181A;border-top:1px solid #EAEAE8;padding:22px 0\">« Il ne se trompe jamais. »<\u002Fdiv>\n<div class=\"r\" style=\"--d:.24s;font-size:29px;font-weight:700;color:#B91C1C;border-top:1px solid #EAEAE8;padding:22px 0;line-height:1.35\">Il invente parfois avec aplomb. On vérifie tout ce qui est vérifiable.<\u002Fdiv>\n<div class=\"r\" style=\"--d:.32s;font-size:31px;font-weight:800;color:#17181A;border-top:1px solid #EAEAE8;padding:22px 0\">« Il retient nos échanges. »<\u002Fdiv>\n<div class=\"r\" style=\"--d:.32s;font-size:29px;font-weight:600;color:#3A3D40;border-top:1px solid #EAEAE8;padding:22px 0;line-height:1.35\">Chaque conversation repart à zéro, sauf mémoire activée.<\u002Fdiv>\n<div class=\"r\" style=\"--d:.40s;font-size:31px;font-weight:800;color:#17181A;border-top:1px solid #EAEAE8;padding:22px 0\">« Il pense comme nous. »<\u002Fdiv>\n<div class=\"r\" style=\"--d:.40s;font-size:29px;font-weight:600;color:#3A3D40;border-top:1px solid #EAEAE8;padding:22px 0;line-height:1.35\">Il n'a ni intention ni compréhension du monde réel. Il modélise la langue.<\u002Fdiv>\n<div class=\"r\" style=\"--d:.48s;font-size:31px;font-weight:800;color:#17181A;border-top:1px solid #EAEAE8;border-bottom:1px solid #EAEAE8;padding:22px 0\">« Il donne toujours la même réponse. »<\u002Fdiv>\n<div class=\"r\" style=\"--d:.48s;font-size:29px;font-weight:600;color:#3A3D40;border-top:1px solid #EAEAE8;border-bottom:1px solid #EAEAE8;padding:22px 0;line-height:1.35\">Non. Reposez la question : la formulation changera.<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\"02 · La qualité\" data-screen-label=\"07\" data-speaker-notes=\"Sert à comprendre pourquoi on ne choisit pas au hasard, et pourquoi l'outil gratuit d'il y a deux ans ne donnait pas ces résultats.\" style=\"background:#E7F0F6;color:#17181A;font-family:Nunito,system-ui,sans-serif;padding:96px 110px 80px;display:flex;flex-direction:column;justify-content:center;gap:34px\">\n<div class=\"p\" style=\"font-size:200px;font-weight:900;line-height:.78;letter-spacing:-.05em;color:#1D6B8F\">02<\u002Fdiv>\n<div class=\"s\" style=\"--d:.12s;font-size:26px;font-weight:800;letter-spacing:.18em;text-transform:uppercase;color:#1D6B8F\">La qualité<\u002Fdiv>\n<h2 class=\"s\" style=\"--d:.18s;margin:0;font-size:92px;font-weight:900;letter-spacing:-.025em;line-height:1.02\">Qu'est-ce qui rend un modèle meilleur ?<\u002Fh2>\n<p class=\"r\" style=\"--d:.26s;margin:0;font-size:38px;font-weight:600;color:#4B4F52;max-width:1200px\">Tous savent écrire. Ils ne savent pas tous travailler.<\u002Fp>\n<div class=\"g\" style=\"--d:.3s;height:6px;background:#1D6B8F;border-radius:3px;max-width:520px\"><\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\"Six critères\" data-screen-label=\"08\" style=\"background:#F7F7F5;color:#17181A;font-family:Nunito,system-ui,sans-serif;padding:90px 110px 80px;display:flex;flex-direction:column;gap:40px\">\n<div style=\"display:flex;flex-direction:column;gap:10px\">\n<div class=\"s\" style=\"font-size:24px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:#1D6B8F\">La qualité · 1<\u002Fdiv>\n<h2 class=\"s\" style=\"--d:.06s;margin:0;font-size:68px;font-weight:900;letter-spacing:-.02em;line-height:1\">Six critères qui séparent les modèles<\u002Fh2>\n<\u002Fdiv>\n<div style=\"display:grid;grid-template-columns:repeat(3,1fr);gap:26px\">\n<div class=\"r\" style=\"--d:.12s;background:#fff;border:1px solid #EAEAE8;border-radius:18px;padding:32px 34px;display:flex;gap:22px\">\n<div style=\"font-size:44px;font-weight:900;color:#1D6B8F;line-height:1\">A<\u002Fdiv>\n<div style=\"display:flex;flex-direction:column;gap:8px\"><div style=\"font-size:34px;font-weight:900\">Le raisonnement<\u002Fdiv><div style=\"font-size:27px;font-weight:600;color:#4B4F52;line-height:1.35\">Tenir une chaîne de dix étapes sans perdre le fil ni se contredire.<\u002Fdiv><\u002Fdiv>\n<\u002Fdiv>\n<div class=\"r\" style=\"--d:.18s;background:#17181A;color:#fff;border-radius:18px;padding:32px 34px;display:flex;gap:22px\">\n<div style=\"font-size:44px;font-weight:900;color:#7FD3AE;line-height:1\">B<\u002Fdiv>\n<div style=\"display:flex;flex-direction:column;gap:8px\"><div style=\"font-size:34px;font-weight:900\">Le suivi de consigne<\u002Fdiv><div style=\"font-size:27px;font-weight:600;color:#C9CDD0;line-height:1.35\">Faire exactement ce qui est demandé — y compris les contraintes ennuyeuses.<\u002Fdiv><\u002Fdiv>\n<\u002Fdiv>\n<div class=\"r\" style=\"--d:.24s;background:#fff;border:1px solid #EAEAE8;border-radius:18px;padding:32px 34px;display:flex;gap:22px\">\n<div style=\"font-size:44px;font-weight:900;color:#1D6B8F;line-height:1\">C<\u002Fdiv>\n<div style=\"display:flex;flex-direction:column;gap:8px\"><div style=\"font-size:34px;font-weight:900\">La mémoire de travail<\u002Fdiv><div style=\"font-size:27px;font-weight:600;color:#4B4F52;line-height:1.35\">La quantité de texte qu'il peut garder sous les yeux en une seule fois.<\u002Fdiv><\u002Fdiv>\n<\u002Fdiv>\n<div class=\"r\" style=\"--d:.30s;background:#EDF6F1;border:1px solid #D8E8DF;border-radius:18px;padding:32px 34px;display:flex;gap:22px\">\n<div style=\"font-size:44px;font-weight:900;color:#07734A;line-height:1\">D<\u002Fdiv>\n<div style=\"display:flex;flex-direction:column;gap:8px\"><div style=\"font-size:34px;font-weight:900\">L'honnêteté<\u002Fdiv><div style=\"font-size:27px;font-weight:600;color:#3A3D40;line-height:1.35\">Dire « je ne sais pas » plutôt que d'inventer une référence crédible.<\u002Fdiv><\u002Fdiv>\n<\u002Fdiv>\n<div class=\"r\" style=\"--d:.36s;background:#fff;border:1px solid #EAEAE8;border-radius:18px;padding:32px 34px;display:flex;gap:22px\">\n<div style=\"font-size:44px;font-weight:900;color:#1D6B8F;line-height:1\">E<\u002Fdiv>\n<div style=\"display:flex;flex-direction:column;gap:8px\"><div style=\"font-size:34px;font-weight:900\">L'usage d'outils<\u002Fdiv><div style=\"font-size:27px;font-weight:600;color:#4B4F52;line-height:1.35\">Lire un fichier, faire un calcul, chercher, produire un document.<\u002Fdiv><\u002Fdiv>\n<\u002Fdiv>\n<div class=\"r\" style=\"--d:.42s;background:#fff;border:1px solid #EAEAE8;border-radius:18px;padding:32px 34px;display:flex;gap:22px\">\n<div style=\"font-size:44px;font-weight:900;color:#1D6B8F;line-height:1\">F<\u002Fdiv>\n<div style=\"display:flex;flex-direction:column;gap:8px\"><div style=\"font-size:34px;font-weight:900\">La langue<\u002Fdiv><div style=\"font-size:27px;font-weight:600;color:#4B4F52;line-height:1.35\">Un français d'ici, pas une traduction de l'anglais.<\u002Fdiv><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<div class=\"r\" style=\"--d:.5s;font-size:29px;font-weight:600;color:#3A3D40;line-height:1.4\">Les palmarès publics mesurent surtout <strong style=\"font-weight:900;color:#17181A\">A<\u002Fstrong>. Dans notre métier, <strong style=\"font-weight:900;color:#17181A\">B<\u002Fstrong> et <strong style=\"font-weight:900;color:#17181A\">D<\u002Fstrong> comptent davantage : un modèle qui suit la consigne et qui avoue ses limites fait gagner plus de temps qu'un modèle brillant et fantaisiste.<\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\"Fenêtre de contexte\" data-screen-label=\"09\" data-speaker-notes=\"C'est le critère qui change le plus la pratique. Avant, on résumait pour l'outil ; maintenant, on lui donne la source.\" style=\"background:#F7F7F5;color:#17181A;font-family:Nunito,system-ui,sans-serif;padding:90px 110px 80px;display:flex;flex-direction:column;gap:36px\">\n<div style=\"display:flex;flex-direction:column;gap:10px\">\n<div class=\"s\" style=\"font-size:24px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:#1D6B8F\">La qualité · 2<\u002Fdiv>\n<h2 class=\"s\" style=\"--d:.06s;margin:0;font-size:68px;font-weight:900;letter-spacing:-.02em;line-height:1\">La fenêtre de contexte, en clair<\u002Fh2>\n<\u002Fdiv>\n<div style=\"display:grid;grid-template-columns:1fr 1.25fr;gap:48px;align-items:start\">\n<div style=\"display:flex;flex-direction:column;gap:24px\">\n<p class=\"r\" style=\"--d:.12s;margin:0;font-size:32px;font-weight:600;line-height:1.4;color:#3A3D40\">C'est tout ce que le modèle a « sous les yeux » au moment de répondre : votre demande, les documents fournis, et tout l'historique de la conversation.<\u002Fp>\n<p class=\"r\" style=\"--d:.18s;margin:0;font-size:32px;font-weight:600;line-height:1.4;color:#3A3D40\">On ne colle plus un paragraphe : on dépose un programme d'études complet, quatre cahiers d'élèves et une grille d'évaluation, puis on demande une analyse croisée.<\u002Fp>\n<div class=\"r\" style=\"--d:.24s;background:#FEF6E7;border-radius:18px;padding:28px 32px;display:flex;flex-direction:column;gap:8px\">\n<div style=\"font-size:24px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:#8A5206\">! Le corollaire<\u002Fdiv>\n<div style=\"font-size:30px;font-weight:700;line-height:1.35;color:#17181A\">Une conversation trop longue se dilue. Mieux vaut ouvrir une conversation neuve par tâche.<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<div class=\"r\" style=\"--d:.2s;border:3px dashed #1D6B8F;border-radius:22px;padding:28px;display:flex;flex-direction:column;gap:14px;background:#fff\">\n<div style=\"font-size:24px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:#1D6B8F\">La fenêtre de contexte<\u002Fdiv>\n<div class=\"r\" style=\"--d:.3s;flex:none;background:#E7F0F6;border-radius:14px;padding:22px 26px;display:flex;flex-direction:column;gap:12px\">\n<div style=\"font-size:30px;font-weight:900\">Les documents que vous déposez<\u002Fdiv>\n<div style=\"display:flex;flex-direction:column;align-items:flex-start;gap:10px;flex:none\">\n<div style=\"flex:none;width:fit-content;background:#fff;border:1px solid #D8E8DF;border-radius:999px;padding:8px 22px;font-size:25px;font-weight:700;line-height:1.2;white-space:nowrap\">un programme d'études<\u002Fdiv>\n<div style=\"flex:none;width:fit-content;background:#fff;border:1px solid #D8E8DF;border-radius:999px;padding:8px 22px;font-size:25px;font-weight:700;line-height:1.2;white-space:nowrap\">un manuel et son corrigé<\u002Fdiv>\n<div style=\"flex:none;width:fit-content;background:#fff;border:1px solid #D8E8DF;border-radius:999px;padding:8px 22px;font-size:25px;font-weight:700;line-height:1.2;white-space:nowrap\">vingt fiches à harmoniser<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<div class=\"r\" style=\"--d:.38s;flex:none;background:#E6F5EE;border-radius:14px;padding:22px 26px\"><div style=\"font-size:30px;font-weight:900\">Votre demande<\u002Fdiv><div style=\"font-size:26px;font-weight:600;color:#4B4F52\">La consigne du moment.<\u002Fdiv><\u002Fdiv>\n<div class=\"r\" style=\"--d:.46s;flex:none;background:#F0F0EE;border-radius:14px;padding:22px 26px\"><div style=\"font-size:30px;font-weight:900\">L'historique de la conversation<\u002Fdiv><div style=\"font-size:26px;font-weight:600;color:#4B4F52\">Tout ce qui a déjà été dit, des deux côtés.<\u002Fdiv><\u002Fdiv>\n<div class=\"r\" style=\"--d:.54s;font-size:26px;font-weight:700;color:#1D6B8F\">Tout cela tient ensemble, en une seule fois, sans que vous ayez à résumer quoi que ce soit.<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\"Vite ou réfléchir\" data-screen-label=\"10\" style=\"background:#F7F7F5;color:#17181A;font-family:Nunito,system-ui,sans-serif;padding:90px 110px 80px;display:flex;flex-direction:column;gap:44px\">\n<div style=\"display:flex;flex-direction:column;gap:10px\">\n<div class=\"s\" style=\"font-size:24px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:#1D6B8F\">La qualité · 3<\u002Fdiv>\n<h2 class=\"s\" style=\"--d:.06s;margin:0;font-size:68px;font-weight:900;letter-spacing:-.02em;line-height:1\">Répondre vite ou réfléchir d'abord<\u002Fh2>\n<\u002Fdiv>\n<div style=\"display:grid;grid-template-columns:1fr 1fr;gap:36px\">\n<div class=\"r\" style=\"--d:.12s;background:#fff;border:1px solid #EAEAE8;border-radius:18px;padding:38px 40px;display:flex;flex-direction:column;gap:24px\">\n<div style=\"font-size:42px;font-weight:900\">Réponse immédiate<\u002Fdiv>\n<div style=\"display:flex;align-items:center;gap:14px\">\n<div style=\"background:#F0F0EE;border-radius:999px;padding:12px 24px;font-size:25px;font-weight:800\">votre demande<\u002Fdiv>\n<div style=\"font-size:30px;color:#6E7175\">→<\u002Fdiv>\n<div style=\"background:#E6F5EE;border-radius:999px;padding:12px 24px;font-size:25px;font-weight:800;color:#07734A\">la réponse<\u002Fdiv>\n<\u002Fdiv>\n<div><div style=\"font-size:24px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:#6E7175;margin-bottom:8px\">Quand<\u002Fdiv><div style=\"font-size:29px;font-weight:600;color:#3A3D40;line-height:1.35\">Reformuler, traduire, résumer, corriger une phrase, trouver dix synonymes.<\u002Fdiv><\u002Fdiv>\n<div><div style=\"font-size:24px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:#6E7175;margin-bottom:8px\">Verdict<\u002Fdiv><div style=\"font-size:29px;font-weight:800;color:#17181A\">Rapide, et suffisant la plupart du temps.<\u002Fdiv><\u002Fdiv>\n<\u002Fdiv>\n<div class=\"r\" style=\"--d:.22s;background:#17181A;color:#fff;border-radius:18px;padding:38px 40px;display:flex;flex-direction:column;gap:24px\">\n<div style=\"font-size:42px;font-weight:900\">Réflexion préalable<\u002Fdiv>\n<div style=\"display:flex;align-items:center;gap:10px;flex-wrap:wrap\">\n<div style=\"background:#2A2C2F;border-radius:999px;padding:12px 22px;font-size:25px;font-weight:800\">votre demande<\u002Fdiv>\n<div style=\"font-size:28px;color:#7FD3AE\">→<\u002Fdiv>\n<div class=\"p\" style=\"--d:.5s;background:#0A8F5B;border-radius:999px;padding:12px 22px;font-size:25px;font-weight:800\">il raisonne<\u002Fdiv>\n<div style=\"font-size:28px;color:#7FD3AE\">→<\u002Fdiv>\n<div class=\"p\" style=\"--d:.62s;background:#0A8F5B;border-radius:999px;padding:12px 22px;font-size:25px;font-weight:800\">il se relit<\u002Fdiv>\n<div style=\"font-size:28px;color:#7FD3AE\">→<\u002Fdiv>\n<div class=\"p\" style=\"--d:.74s;background:#E6F5EE;color:#07734A;border-radius:999px;padding:12px 22px;font-size:25px;font-weight:800\">la réponse<\u002Fdiv>\n<\u002Fdiv>\n<div><div style=\"font-size:24px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:#9A9EA2;margin-bottom:8px\">Quand<\u002Fdiv><div style=\"font-size:29px;font-weight:600;color:#C9CDD0;line-height:1.35\">Bâtir une progression, croiser un programme et un manuel, corriger avec une grille, trouver l'erreur dans un raisonnement.<\u002Fdiv><\u002Fdiv>\n<div><div style=\"font-size:24px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:#9A9EA2;margin-bottom:8px\">Verdict<\u002Fdiv><div style=\"font-size:29px;font-weight:800;color:#7FD3AE\">Plus lent, nettement plus juste.<\u002Fdiv><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<div class=\"r\" style=\"--d:.4s;background:#EDF6F1;border-radius:18px;padding:26px 34px;font-size:30px;font-weight:700;color:#07734A\">Le réflexe : si la tâche a plus de trois contraintes, demandez explicitement de réfléchir avant de répondre.<\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\"03 · L'utilité\" data-screen-label=\"11\" data-speaker-notes=\"Point sensible : nommer d'emblée la crainte du remplacement, puis la déplacer.\" style=\"background:#EFEAFA;color:#17181A;font-family:Nunito,system-ui,sans-serif;padding:96px 110px 80px;display:flex;flex-direction:column;justify-content:center;gap:34px\">\n<div class=\"p\" style=\"font-size:200px;font-weight:900;line-height:.78;letter-spacing:-.05em;color:#6B4FBB\">03<\u002Fdiv>\n<div class=\"s\" style=\"--d:.12s;font-size:26px;font-weight:800;letter-spacing:.18em;text-transform:uppercase;color:#6B4FBB\">L'utilité<\u002Fdiv>\n<h2 class=\"s\" style=\"--d:.18s;margin:0;font-size:92px;font-weight:900;letter-spacing:-.025em;line-height:1.02\">Pourquoi ça nous aide vraiment<\u002Fh2>\n<p class=\"r\" style=\"--d:.26s;margin:0;font-size:38px;font-weight:600;color:#4B4F52;max-width:1250px\">Pas pour enseigner à notre place. Pour libérer le temps qui n'est pas de l'enseignement.<\u002Fp>\n<div class=\"g\" style=\"--d:.3s;height:6px;background:#6B4FBB;border-radius:3px;max-width:520px\"><\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\"Hors classe\" data-screen-label=\"12\" data-speaker-notes=\"Faire nommer par le groupe, avant d'afficher, ce qui leur prend le plus de temps hors classe. Les réponses tombent presque toujours dans ces six cases.\" style=\"background:#F7F7F5;color:#17181A;font-family:Nunito,system-ui,sans-serif;padding:90px 110px 80px;display:flex;flex-direction:column;gap:36px\">\n<div style=\"display:flex;flex-direction:column;gap:10px\">\n<div class=\"s\" style=\"font-size:24px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:#6B4FBB\">L'utilité · 1<\u002Fdiv>\n<h2 class=\"s\" style=\"--d:.06s;margin:0;font-size:68px;font-weight:900;letter-spacing:-.02em;line-height:1\">Le travail qui n'est pas devant la classe<\u002Fh2>\n<p class=\"r\" style=\"--d:.1s;margin:6px 0 0;font-size:31px;font-weight:600;color:#4B4F52;max-width:1300px\">Une bonne partie du métier se passe ailleurs qu'en classe. C'est précisément ce travail-là que l'outil sait accompagner.<\u002Fp>\n<\u002Fdiv>\n<div style=\"display:grid;grid-template-columns:repeat(3,1fr);gap:26px\">\n<div class=\"r\" style=\"--d:.14s;background:#fff;border:1px solid #EAEAE8;border-radius:18px;padding:32px 34px;display:flex;flex-direction:column;gap:10px\"><div style=\"font-size:36px;font-weight:900;color:#6B4FBB\">Préparer<\u002Fdiv><div style=\"font-size:28px;font-weight:600;color:#4B4F52;line-height:1.35\">Bâtir une séquence, découper une notion, trouver dix exemples plutôt que trois.<\u002Fdiv><\u002Fdiv>\n<div class=\"r\" style=\"--d:.2s;background:#fff;border:1px solid #EAEAE8;border-radius:18px;padding:32px 34px;display:flex;flex-direction:column;gap:10px\"><div style=\"font-size:36px;font-weight:900;color:#6B4FBB\">Adapter<\u002Fdiv><div style=\"font-size:28px;font-weight:600;color:#4B4F52;line-height:1.35\">Reprendre le même contenu à trois niveaux, pour trois profils d'élèves.<\u002Fdiv><\u002Fdiv>\n<div class=\"r\" style=\"--d:.26s;background:#fff;border:1px solid #EAEAE8;border-radius:18px;padding:32px 34px;display:flex;flex-direction:column;gap:10px\"><div style=\"font-size:36px;font-weight:900;color:#6B4FBB\">Corriger<\u002Fdiv><div style=\"font-size:28px;font-weight:600;color:#4B4F52;line-height:1.35\">Repérer les erreurs récurrentes d'un groupe, rédiger une rétroaction.<\u002Fdiv><\u002Fdiv>\n<div class=\"r\" style=\"--d:.32s;background:#fff;border:1px solid #EAEAE8;border-radius:18px;padding:32px 34px;display:flex;flex-direction:column;gap:10px\"><div style=\"font-size:36px;font-weight:900;color:#6B4FBB\">Différencier<\u002Fdiv><div style=\"font-size:28px;font-weight:600;color:#4B4F52;line-height:1.35\">Le renfort pour l'un, l'enrichissement pour l'autre.<\u002Fdiv><\u002Fdiv>\n<div class=\"r\" style=\"--d:.38s;background:#fff;border:1px solid #EAEAE8;border-radius:18px;padding:32px 34px;display:flex;flex-direction:column;gap:10px\"><div style=\"font-size:36px;font-weight:900;color:#6B4FBB\">Documenter<\u002Fdiv><div style=\"font-size:28px;font-weight:600;color:#4B4F52;line-height:1.35\">Le plan, la grille, le compte rendu, la lettre aux parents.<\u002Fdiv><\u002Fdiv>\n<div class=\"r\" style=\"--d:.44s;background:#fff;border:1px solid #EAEAE8;border-radius:18px;padding:32px 34px;display:flex;flex-direction:column;gap:10px\"><div style=\"font-size:36px;font-weight:900;color:#6B4FBB\">Explorer<\u002Fdiv><div style=\"font-size:28px;font-weight:600;color:#4B4F52;line-height:1.35\">Se faire expliquer une notion, tester une idée avant de l'essayer.<\u002Fdiv><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\"Ligne de partage\" data-screen-label=\"13\" style=\"background:#F7F7F5;color:#17181A;font-family:Nunito,system-ui,sans-serif;padding:90px 110px 80px;display:flex;flex-direction:column;gap:36px\">\n<div style=\"display:flex;flex-direction:column;gap:10px\">\n<div class=\"s\" style=\"font-size:24px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:#6B4FBB\">L'utilité · 2<\u002Fdiv>\n<h2 class=\"s\" style=\"--d:.06s;margin:0;font-size:68px;font-weight:900;letter-spacing:-.02em;line-height:1\">La ligne de partage<\u002Fh2>\n<p class=\"r\" style=\"--d:.1s;margin:6px 0 0;font-size:31px;font-weight:700;color:#3A3D40\">L'outil produit. L'enseignant décide. Cette ligne ne bouge pas.<\u002Fp>\n<\u002Fdiv>\n<div style=\"display:grid;grid-template-columns:1fr 1fr;gap:40px\">\n<div class=\"r\" style=\"--d:.14s;background:#fff;border:1px solid #EAEAE8;border-radius:18px;padding:36px 40px;display:flex;flex-direction:column;gap:18px\">\n<div style=\"font-size:38px;font-weight:900;color:#0A8F5B\">→&nbsp; On lui confie<\u002Fdiv>\n<div style=\"display:flex;flex-direction:column;gap:14px;font-size:29px;font-weight:700;color:#3A3D40\">\n<div style=\"border-bottom:1px solid #F0F0EE;padding-bottom:14px\">Le premier jet, jamais le dernier<\u002Fdiv>\n<div style=\"border-bottom:1px solid #F0F0EE;padding-bottom:14px\">La variante, la déclinaison, le doublon<\u002Fdiv>\n<div style=\"border-bottom:1px solid #F0F0EE;padding-bottom:14px\">La mise en forme et la mise en page<\u002Fdiv>\n<div style=\"border-bottom:1px solid #F0F0EE;padding-bottom:14px\">La relecture et la chasse aux oublis<\u002Fdiv>\n<div>Le brassage d'idées quand on sèche<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"font-size:27px;font-weight:800;color:#6E7175\">Tout ce qui est long sans être délicat.<\u002Fdiv>\n<\u002Fdiv>\n<div class=\"r\" style=\"--d:.24s;background:#17181A;color:#fff;border-radius:18px;padding:36px 40px;display:flex;flex-direction:column;gap:18px\">\n<div style=\"font-size:38px;font-weight:900;color:#7FD3AE\">★&nbsp; On garde<\u002Fdiv>\n<div style=\"display:flex;flex-direction:column;gap:14px;font-size:29px;font-weight:700;color:#E7E9EA\">\n<div style=\"border-bottom:1px solid #2A2C2F;padding-bottom:14px\">Le choix de ce qu'on enseigne<\u002Fdiv>\n<div style=\"border-bottom:1px solid #2A2C2F;padding-bottom:14px\">Le jugement sur l'élève<\u002Fdiv>\n<div style=\"border-bottom:1px solid #2A2C2F;padding-bottom:14px\">La relation et le climat de classe<\u002Fdiv>\n<div style=\"border-bottom:1px solid #2A2C2F;padding-bottom:14px\">La décision d'évaluation<\u002Fdiv>\n<div>La responsabilité de ce qu'on distribue<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"font-size:27px;font-weight:800;color:#9A9EA2\">Tout ce qui engage notre jugement professionnel.<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<div class=\"r\" style=\"--d:.36s;font-size:31px;font-weight:800;color:#07734A\">Rien ne sort de la classe sans avoir été relu par quelqu'un qui en répond.<\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\"04 · Les outils\" data-screen-label=\"14\" data-speaker-notes=\"Cœur pratique de la formation. La plupart des gens ne connaissent que la conversation.\" style=\"background:#FBEEDC;color:#17181A;font-family:Nunito,system-ui,sans-serif;padding:96px 110px 80px;display:flex;flex-direction:column;justify-content:center;gap:34px\">\n<div class=\"p\" style=\"font-size:200px;font-weight:900;line-height:.78;letter-spacing:-.05em;color:#B45309\">04<\u002Fdiv>\n<div class=\"s\" style=\"--d:.12s;font-size:26px;font-weight:800;letter-spacing:.18em;text-transform:uppercase;color:#B45309\">Les outils<\u002Fdiv>\n<h2 class=\"s\" style=\"--d:.18s;margin:0;font-size:92px;font-weight:900;letter-spacing:-.025em;line-height:1.02\">Trois façons de travailler avec Claude<\u002Fh2>\n<p class=\"r\" style=\"--d:.26s;margin:0;font-size:38px;font-weight:600;color:#4B4F52;max-width:1200px\">Le même modèle, trois postes de travail très différents.<\u002Fp>\n<div class=\"g\" style=\"--d:.3s;height:6px;background:#B45309;border-radius:3px;max-width:520px\"><\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\"Trois postes\" data-screen-label=\"15\" style=\"background:#F7F7F5;color:#17181A;font-family:Nunito,system-ui,sans-serif;padding:90px 110px 80px;display:flex;flex-direction:column;gap:34px\">\n<div style=\"display:flex;flex-direction:column;gap:10px\">\n<div class=\"s\" style=\"font-size:24px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:#B45309\">Les outils · 1<\u002Fdiv>\n<h2 class=\"s\" style=\"--d:.06s;margin:0;font-size:68px;font-weight:900;letter-spacing:-.02em;line-height:1\">Le même moteur, trois postes de travail<\u002Fh2>\n<\u002Fdiv>\n<div style=\"display:grid;grid-template-columns:repeat(3,1fr);gap:28px\">\n<div class=\"r\" style=\"--d:.12s;background:#fff;border:1px solid #EAEAE8;border-radius:18px;padding:34px 36px;display:flex;flex-direction:column;gap:16px\">\n<div style=\"font-size:38px;font-weight:900;line-height:1.1\">Claude<br>en conversation<\u002Fdiv>\n<div style=\"font-size:28px;font-weight:600;color:#4B4F52;line-height:1.35;flex:1\">Une discussion. Vous écrivez, il répond. Vous copiez le résultat.<\u002Fdiv>\n<div style=\"font-size:26px;font-weight:700;color:#3A3D40\"><span style=\"font-weight:800;color:#6E7175\">POUR <\u002Fspan>Réfléchir, rédiger, expliquer, corriger un texte.<\u002Fdiv>\n<div style=\"font-size:26px;font-weight:700;color:#07734A\">+ Rien à installer<\u002Fdiv>\n<div style=\"font-size:26px;font-weight:700;color:#8A5206\">! Le résultat reste dans la fenêtre<\u002Fdiv>\n<div class=\"p\" style=\"--d:.5s;background:#F0F0EE;border-radius:999px;padding:12px 24px;font-size:26px;font-weight:800;align-self:flex-start\">un texte<\u002Fdiv>\n<\u002Fdiv>\n<div class=\"r\" style=\"--d:.2s;background:#fff;border:1px solid #EAEAE8;border-radius:18px;padding:34px 36px;display:flex;flex-direction:column;gap:16px\">\n<div style=\"font-size:38px;font-weight:900;line-height:1.1\">Claude Cowork<br><span style=\"font-weight:700;color:#6E7175\">le collègue de bureau<\u002Fspan><\u002Fdiv>\n<div style=\"font-size:28px;font-weight:600;color:#4B4F52;line-height:1.35;flex:1\">Il travaille dans vos dossiers et vous rend des fichiers finis.<\u002Fdiv>\n<div style=\"font-size:26px;font-weight:700;color:#3A3D40\"><span style=\"font-weight:800;color:#6E7175\">POUR <\u002Fspan>Produire des documents, traiter un lot, monter un dossier.<\u002Fdiv>\n<div style=\"font-size:26px;font-weight:700;color:#07734A\">+ Aucune compétence technique<\u002Fdiv>\n<div style=\"font-size:26px;font-weight:700;color:#8A5206\">! Il agit : on relit avant de diffuser<\u002Fdiv>\n<div class=\"p\" style=\"--d:.58s;background:#E6F5EE;color:#07734A;border-radius:999px;padding:12px 24px;font-size:26px;font-weight:800;align-self:flex-start\">un fichier<\u002Fdiv>\n<\u002Fdiv>\n<div class=\"r\" style=\"--d:.28s;background:#17181A;color:#fff;border-radius:18px;padding:34px 36px;display:flex;flex-direction:column;gap:16px\">\n<div style=\"font-size:38px;font-weight:900;line-height:1.1\">Claude Code<br><span style=\"font-weight:700;color:#9A9EA2\">l'atelier<\u002Fspan><\u002Fdiv>\n<div style=\"font-size:28px;font-weight:600;color:#C9CDD0;line-height:1.35;flex:1\">Il pilote votre ordinateur : fichiers, scripts, sites, conversions.<\u002Fdiv>\n<div style=\"font-size:26px;font-weight:700;color:#E7E9EA\"><span style=\"font-weight:800;color:#9A9EA2\">POUR <\u002Fspan>Fabriquer et maintenir du matériel à grande échelle.<\u002Fdiv>\n<div style=\"font-size:26px;font-weight:700;color:#7FD3AE\">+ Puissance maximale<\u002Fdiv>\n<div style=\"font-size:26px;font-weight:700;color:#F0C27B\">! Demande de la méthode<\u002Fdiv>\n<div class=\"p\" style=\"--d:.66s;background:#0A8F5B;border-radius:999px;padding:12px 24px;font-size:26px;font-weight:800;align-self:flex-start\">une collection<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<div class=\"r\" style=\"--d:.42s;font-size:29px;font-weight:700;color:#3A3D40\">La conversation est un collègue au téléphone ; Cowork, un collègue assis à votre bureau ; Code, un collègue à l'atelier, avec les machines.<\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\"Conversation\" data-screen-label=\"16\" data-speaker-notes=\"Faire ouvrir un Projet en direct pendant l'atelier : c'est la fonction la plus rentable et la moins connue.\" style=\"background:#F7F7F5;color:#17181A;font-family:Nunito,system-ui,sans-serif;padding:90px 110px 80px;display:flex;flex-direction:column;gap:36px\">\n<div style=\"display:flex;flex-direction:column;gap:10px\">\n<div class=\"s\" style=\"font-size:24px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:#B45309\">Les outils · 2<\u002Fdiv>\n<h2 class=\"s\" style=\"--d:.06s;margin:0;font-size:68px;font-weight:900;letter-spacing:-.02em;line-height:1\">Claude en conversation<\u002Fh2>\n<p class=\"r\" style=\"--d:.1s;margin:6px 0 0;font-size:31px;font-weight:700;color:#6E7175\">Le collègue au bout du fil : il vous répond, vous décidez.<\u002Fp>\n<\u002Fdiv>\n<div style=\"display:grid;grid-template-columns:1fr 1fr;gap:52px;align-items:start\">\n<div style=\"display:flex;flex-direction:column;gap:24px\">\n<p class=\"r\" style=\"--d:.14s;margin:0;font-size:31px;font-weight:600;line-height:1.4;color:#3A3D40\">C'est la porte d'entrée, dans le navigateur ou l'application. On dépose une question ou un document, on obtient une réponse, on discute, on affine.<\u002Fp>\n<p class=\"r\" style=\"--d:.2s;margin:0;font-size:31px;font-weight:600;line-height:1.4;color:#3A3D40\">On peut y joindre des fichiers, y créer des <strong style=\"font-weight:900;color:#17181A\">Projets<\u002Fstrong> qui gardent le contexte d'un cours, et lui faire produire des pages interactives que les élèves peuvent utiliser telles quelles.<\u002Fp>\n<div class=\"r\" style=\"--d:.26s;background:#FEF6E7;border-radius:18px;padding:26px 32px;display:flex;flex-direction:column;gap:8px\">\n<div style=\"font-size:24px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:#8A5206\">! Le piège<\u002Fdiv>\n<div style=\"font-size:29px;font-weight:700;line-height:1.35\">Le résultat vit dans la fenêtre. Ce qui n'est pas copié ailleurs est perdu.<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"display:flex;flex-direction:column;gap:16px\">\n<div class=\"r\" style=\"--d:.18s;font-size:24px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:#6E7175\">En classe, concrètement<\u002Fdiv>\n<div class=\"s\" style=\"--d:.24s;background:#fff;border:1px solid #EAEAE8;border-radius:14px;padding:24px 28px;display:flex;gap:20px;align-items:baseline\"><div style=\"font-size:30px;font-weight:900;color:#B45309\">1<\u002Fdiv><div style=\"font-size:29px;font-weight:700;line-height:1.3\">Faire expliquer une notion de grammaire de quatre façons différentes<\u002Fdiv><\u002Fdiv>\n<div class=\"s\" style=\"--d:.32s;background:#fff;border:1px solid #EAEAE8;border-radius:14px;padding:24px 28px;display:flex;gap:20px;align-items:baseline\"><div style=\"font-size:30px;font-weight:900;color:#B45309\">2<\u002Fdiv><div style=\"font-size:29px;font-weight:700;line-height:1.3\">Transformer un texte authentique en texte de niveau 4<\u002Fdiv><\u002Fdiv>\n<div class=\"s\" style=\"--d:.40s;background:#fff;border:1px solid #EAEAE8;border-radius:14px;padding:24px 28px;display:flex;gap:20px;align-items:baseline\"><div style=\"font-size:30px;font-weight:900;color:#B45309\">3<\u002Fdiv><div style=\"font-size:29px;font-weight:700;line-height:1.3\">Rédiger une rétroaction bienveillante à partir de la copie d'un élève<\u002Fdiv><\u002Fdiv>\n<div class=\"s\" style=\"--d:.48s;background:#fff;border:1px solid #EAEAE8;border-radius:14px;padding:24px 28px;display:flex;gap:20px;align-items:baseline\"><div style=\"font-size:30px;font-weight:900;color:#B45309\">4<\u002Fdiv><div style=\"font-size:29px;font-weight:700;line-height:1.3\">Se faire critiquer une consigne avant de la donner<\u002Fdiv><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\"Cowork\" data-screen-label=\"17\" data-speaker-notes=\"C'est l'outil qui convertit le plus d'enseignants : le résultat est un fichier qu'on peut imprimer, pas un texte à recopier.\" style=\"background:#F7F7F5;color:#17181A;font-family:Nunito,system-ui,sans-serif;padding:90px 110px 80px;display:flex;flex-direction:column;gap:36px\">\n<div style=\"display:flex;flex-direction:column;gap:10px\">\n<div class=\"s\" style=\"font-size:24px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:#B45309\">Les outils · 3<\u002Fdiv>\n<h2 class=\"s\" style=\"--d:.06s;margin:0;font-size:68px;font-weight:900;letter-spacing:-.02em;line-height:1\">Claude Cowork<\u002Fh2>\n<p class=\"r\" style=\"--d:.1s;margin:6px 0 0;font-size:31px;font-weight:700;color:#6E7175\">Le collègue assis à votre bureau : il ouvre vos dossiers et rend des fichiers.<\u002Fp>\n<\u002Fdiv>\n<div style=\"display:grid;grid-template-columns:1fr 1fr;gap:52px;align-items:start\">\n<div style=\"display:flex;flex-direction:column;gap:24px\">\n<p class=\"r\" style=\"--d:.14s;margin:0;font-size:31px;font-weight:600;line-height:1.4;color:#3A3D40\">Ici, on ne copie plus rien. On lui donne accès à un dossier de travail et il produit directement les documents : Word, PowerPoint, Excel, PDF.<\u002Fp>\n<p class=\"r\" style=\"--d:.2s;margin:0;font-size:31px;font-weight:600;line-height:1.4;color:#3A3D40\">Il travaille en plusieurs étapes, sur un lot complet, et rend compte de ce qu'il a fait. On lui parle en français ordinaire — aucune compétence technique n'est requise.<\u002Fp>\n<div class=\"r\" style=\"--d:.26s;background:#FEF6E7;border-radius:18px;padding:26px 32px;display:flex;flex-direction:column;gap:8px\">\n<div style=\"font-size:24px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:#8A5206\">! Le piège<\u002Fdiv>\n<div style=\"font-size:29px;font-weight:700;line-height:1.35\">Il agit pour vrai sur vos fichiers. On travaille sur une copie, et on relit avant de diffuser.<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"display:flex;flex-direction:column;gap:16px\">\n<div class=\"r\" style=\"--d:.18s;font-size:24px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:#6E7175\">En classe, concrètement<\u002Fdiv>\n<div class=\"s\" style=\"--d:.24s;background:#fff;border:1px solid #EAEAE8;border-radius:14px;padding:24px 28px;display:flex;gap:20px;align-items:baseline\"><div style=\"font-size:30px;font-weight:900;color:#B45309\">1<\u002Fdiv><div style=\"font-size:29px;font-weight:700;line-height:1.3\">Reprendre vingt fiches d'activité au même gabarit visuel<\u002Fdiv><\u002Fdiv>\n<div class=\"s\" style=\"--d:.32s;background:#fff;border:1px solid #EAEAE8;border-radius:14px;padding:24px 28px;display:flex;gap:20px;align-items:baseline\"><div style=\"font-size:30px;font-weight:900;color:#B45309\">2<\u002Fdiv><div style=\"font-size:29px;font-weight:700;line-height:1.3\">Monter le PowerPoint d'une séquence à partir du plan de cours<\u002Fdiv><\u002Fdiv>\n<div class=\"s\" style=\"--d:.40s;background:#fff;border:1px solid #EAEAE8;border-radius:14px;padding:24px 28px;display:flex;gap:20px;align-items:baseline\"><div style=\"font-size:30px;font-weight:900;color:#B45309\">3<\u002Fdiv><div style=\"font-size:29px;font-weight:700;line-height:1.3\">Compiler les résultats d'un groupe dans un tableau lisible<\u002Fdiv><\u002Fdiv>\n<div class=\"s\" style=\"--d:.48s;background:#fff;border:1px solid #EAEAE8;border-radius:14px;padding:24px 28px;display:flex;gap:20px;align-items:baseline\"><div style=\"font-size:30px;font-weight:900;color:#B45309\">4<\u002Fdiv><div style=\"font-size:29px;font-weight:700;line-height:1.3\">Produire le cahier de l'élève et le corrigé de l'enseignant d'un seul coup<\u002Fdiv><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\"Code\" data-screen-label=\"18\" data-speaker-notes=\"À présenter comme un horizon, pas comme un prérequis. Un ou deux enseignants par centre y viendront — ce sont eux qui outilleront les autres.\" style=\"background:#F7F7F5;color:#17181A;font-family:Nunito,system-ui,sans-serif;padding:90px 110px 80px;display:flex;flex-direction:column;gap:36px\">\n<div style=\"display:flex;flex-direction:column;gap:10px\">\n<div class=\"s\" style=\"font-size:24px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:#B45309\">Les outils · 4<\u002Fdiv>\n<h2 class=\"s\" style=\"--d:.06s;margin:0;font-size:68px;font-weight:900;letter-spacing:-.02em;line-height:1\">Claude Code<\u002Fh2>\n<p class=\"r\" style=\"--d:.1s;margin:6px 0 0;font-size:31px;font-weight:700;color:#6E7175\">L'atelier : la fabrication en série et sur mesure.<\u002Fp>\n<\u002Fdiv>\n<div style=\"display:grid;grid-template-columns:1fr 1fr;gap:52px;align-items:start\">\n<div style=\"display:flex;flex-direction:column;gap:24px\">\n<p class=\"r\" style=\"--d:.14s;margin:0;font-size:31px;font-weight:600;line-height:1.4;color:#3A3D40\">Malgré son nom, il ne sert pas qu'à programmer. C'est un assistant qui a la main sur l'ordinateur : il lit et écrit des fichiers, lance des programmes, convertit des formats, publie des pages web.<\u002Fp>\n<p class=\"r\" style=\"--d:.2s;margin:0;font-size:31px;font-weight:600;line-height:1.4;color:#3A3D40\">C'est l'outil du matériel produit à grande échelle et maintenu dans le temps : une bibliothèque d'activités, un portail pour les élèves, une chaîne de production.<\u002Fp>\n<div class=\"r\" style=\"--d:.26s;background:#FEF6E7;border-radius:18px;padding:26px 32px;display:flex;flex-direction:column;gap:8px\">\n<div style=\"font-size:24px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:#8A5206\">! Le piège<\u002Fdiv>\n<div style=\"font-size:29px;font-weight:700;line-height:1.35\">Il faut de la méthode : travailler par étapes, vérifier, et savoir revenir en arrière.<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"display:flex;flex-direction:column;gap:16px\">\n<div class=\"r\" style=\"--d:.18s;font-size:24px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:#6E7175\">En classe, concrètement<\u002Fdiv>\n<div class=\"s\" style=\"--d:.24s;background:#fff;border:1px solid #EAEAE8;border-radius:14px;padding:24px 28px;display:flex;gap:20px;align-items:baseline\"><div style=\"font-size:30px;font-weight:900;color:#B45309\">1<\u002Fdiv><div style=\"font-size:29px;font-weight:700;line-height:1.3\">Fabriquer onze modules interactifs bâtis sur le même gabarit<\u002Fdiv><\u002Fdiv>\n<div class=\"s\" style=\"--d:.32s;background:#fff;border:1px solid #EAEAE8;border-radius:14px;padding:24px 28px;display:flex;gap:20px;align-items:baseline\"><div style=\"font-size:30px;font-weight:900;color:#B45309\">2<\u002Fdiv><div style=\"font-size:29px;font-weight:700;line-height:1.3\">Générer les enregistrements audio de tous les dialogues<\u002Fdiv><\u002Fdiv>\n<div class=\"s\" style=\"--d:.40s;background:#fff;border:1px solid #EAEAE8;border-radius:14px;padding:24px 28px;display:flex;gap:20px;align-items:baseline\"><div style=\"font-size:30px;font-weight:900;color:#B45309\">3<\u002Fdiv><div style=\"font-size:29px;font-weight:700;line-height:1.3\">Corriger une coquille présente dans deux cents
