:center;gap:28px;background:#fff;border:1px solid #EAEAE8;border-radius:18px;padding:28px 36px;margin-left:96px\">\n<div style=\"width:64px;height:64px;flex:none;border-radius:32px;background:#17181A;color:#fff;font-size:30px;font-weight:900;display:flex;align-items:center;justify-content:center\">2<\u002Fdiv>\n<div style=\"flex:1\"><div style=\"font-size:36px;font-weight:900\">Le résultat doit-il être un document livrable ?<\u002Fdiv><div style=\"font-size:27px;font-weight:600;color:#6E7175\">Un Word, un PowerPoint, un tableau, un PDF prêt à imprimer.<\u002Fdiv><\u002Fdiv>\n<div style=\"font-size:26px;font-weight:800;color:#07734A\">oui →<\u002Fdiv>\n<div style=\"background:#E6F5EE;color:#07734A;border-radius:999px;padding:14px 28px;font-size:28px;font-weight:800\">Claude Cowork<\u002Fdiv>\n<\u002Fdiv>\n<div class=\"s\" style=\"--d:.38s;display:flex;align-items:center;gap:28px;background:#17181A;color:#fff;border-radius:18px;padding:28px 36px;margin-left:192px\">\n<div style=\"width:64px;height:64px;flex:none;border-radius:32px;background:#0A8F5B;color:#fff;font-size:30px;font-weight:900;display:flex;align-items:center;justify-content:center\">3<\u002Fdiv>\n<div style=\"flex:1\"><div style=\"font-size:36px;font-weight:900\">Est-ce que je fabrique la même chose vingt fois ?<\u002Fdiv><div style=\"font-size:27px;font-weight:600;color:#9A9EA2\">Une collection, un portail, une chaîne à maintenir dans le temps.<\u002Fdiv><\u002Fdiv>\n<div style=\"font-size:26px;font-weight:800;color:#7FD3AE\">oui →<\u002Fdiv>\n<div style=\"background:#0A8F5B;color:#fff;border-radius:999px;padding:14px 28px;font-size:28px;font-weight:800\">Claude Code<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<div class=\"r\" style=\"--d:.5s;font-size:30px;font-weight:700;color:#3A3D40\">En cas de doute : commencer dans la conversation. On y met la pensée au clair, puis on transporte la consigne au bon endroit.<\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\"05 · Les aptitudes\" data-screen-label=\"20\" data-speaker-notes=\"Message central : ce n'est pas l'outil qui progresse d'une séance à l'autre, c'est l'utilisateur.\" style=\"background:#DCF2EF;color:#17181A;font-family:Nunito,system-ui,sans-serif;padding:96px 110px 80px;display:flex;flex-direction:column;justify-content:center;gap:34px\">\n<div class=\"p\" style=\"font-size:200px;font-weight:900;line-height:.78;letter-spacing:-.05em;color:#0D7A6F\">05<\u002Fdiv>\n<div class=\"s\" style=\"--d:.12s;font-size:26px;font-weight:800;letter-spacing:.18em;text-transform:uppercase;color:#0D7A6F\">Les aptitudes<\u002Fdiv>\n<h2 class=\"s\" style=\"--d:.18s;margin:0;font-size:92px;font-weight:900;letter-spacing:-.025em;line-height:1.02\">Développer ses aptitudes<\u002Fh2>\n<p class=\"r\" style=\"--d:.26s;margin:0;font-size:38px;font-weight:600;color:#4B4F52;max-width:1300px\">L'écart entre un résultat décevant et un résultat excellent tient presque toujours à la consigne.<\u002Fp>\n<div class=\"g\" style=\"--d:.3s;height:6px;background:#0D7A6F;border-radius:3px;max-width:520px\"><\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\"Anatomie d'une consigne\" data-screen-label=\"21\" data-speaker-notes=\"Faire l'exercice en direct : demander au groupe une consigne spontanée, la faire tourner, puis la reconstruire avec les cinq segments et comparer les deux résultats.\" style=\"background:#F7F7F5;color:#17181A;font-family:Nunito,system-ui,sans-serif;padding:90px 110px 80px;display:flex;flex-direction:column;gap:34px\">\n<div style=\"display:flex;flex-direction:column;gap:10px\">\n<div class=\"s\" style=\"font-size:24px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:#0D7A6F\">Les aptitudes · 1<\u002Fdiv>\n<h2 class=\"s\" style=\"--d:.06s;margin:0;font-size:68px;font-weight:900;letter-spacing:-.02em;line-height:1\">Anatomie d'une bonne consigne<\u002Fh2>\n<\u002Fdiv>\n<div style=\"display:flex;gap:10px;align-items:stretch\">\n<div class=\"p\" style=\"--d:.12s;flex:1;background:#0D7A6F;color:#fff;border-radius:14px 4px 4px 14px;padding:18px 24px;font-size:28px;font-weight:900\">1 · Le rôle<\u002Fdiv>\n<div class=\"p\" style=\"--d:.18s;flex:1;background:#1B8C80;color:#fff;padding:18px 24px;font-size:28px;font-weight:900\">2 · Le contexte<\u002Fdiv>\n<div class=\"p\" style=\"--d:.24s;flex:1;background:#2A9E90;color:#fff;padding:18px 24px;font-size:28px;font-weight:900\">3 · La tâche<\u002Fdiv>\n<div class=\"p\" style=\"--d:.30s;flex:1;background:#49B3A5;color:#17181A;padding:18px 24px;font-size:28px;font-weight:900\">4 · Les contraintes<\u002Fdiv>\n<div class=\"p\" style=\"--d:.36s;flex:1;background:#7FCCC1;color:#17181A;border-radius:4px 14px 14px 4px;padding:18px 24px;font-size:28px;font-weight:900\">5 · L'exemple<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"display:grid;grid-template-columns:repeat(5,1fr);gap:22px;align-items:start\">\n<div class=\"r\" style=\"--d:.22s;display:flex;flex-direction:column;gap:10px\"><div style=\"font-size:31px;font-weight:900\">Le rôle<\u002Fdiv><div style=\"font-size:26px;font-weight:600;color:#4B4F52;line-height:1.35\">« Tu es enseignant de francisation au niveau 4, auprès d'adultes. »<\u002Fdiv><\u002Fdiv>\n<div class=\"r\" style=\"--d:.28s;display:flex;flex-direction:column;gap:10px\"><div style=\"font-size:31px;font-weight:900\">Le contexte<\u002Fdiv><div style=\"font-size:26px;font-weight:600;color:#4B4F52;line-height:1.35\">Qui sont les élèves, où on en est dans la séquence, ce qui a déjà été vu.<\u002Fdiv><\u002Fdiv>\n<div class=\"r\" style=\"--d:.34s;display:flex;flex-direction:column;gap:10px\"><div style=\"font-size:31px;font-weight:900\">La tâche<\u002Fdiv><div style=\"font-size:26px;font-weight:600;color:#4B4F52;line-height:1.35\">Un verbe précis et une quantité : rédige, compare, produis douze items.<\u002Fdiv><\u002Fdiv>\n<div class=\"r\" style=\"--d:.40s;display:flex;flex-direction:column;gap:10px\"><div style=\"font-size:31px;font-weight:900\">Les contraintes<\u002Fdiv><div style=\"font-size:26px;font-weight:600;color:#4B4F52;line-height:1.35\">Le niveau de langue, la longueur, ce qu'il faut éviter, le format attendu.<\u002Fdiv><\u002Fdiv>\n<div class=\"r\" style=\"--d:.46s;display:flex;flex-direction:column;gap:10px\"><div style=\"font-size:31px;font-weight:900\">L'exemple<\u002Fdiv><div style=\"font-size:26px;font-weight:600;color:#4B4F52;line-height:1.35\">Un item modèle vaut mieux qu'un paragraphe d'explications.<\u002Fdiv><\u002Fdiv>\n<\u002Fdiv>\n<div class=\"r\" style=\"--d:.56s;background:#DCF2EF;border-radius:18px;padding:26px 34px;font-size:30px;font-weight:700;color:#0D7A6F\">Et surtout : une consigne se travaille en plusieurs tours. La première réponse sert à ajuster la deuxième demande.<\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\"Avant / après\" data-screen-label=\"22\" style=\"background:#F7F7F5;color:#17181A;font-family:Nunito,system-ui,sans-serif;padding:90px 110px 80px;display:flex;flex-direction:column;gap:34px\">\n<div style=\"display:flex;flex-direction:column;gap:10px\">\n<div class=\"s\" style=\"font-size:24px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:#0D7A6F\">Les aptitudes · 2<\u002Fdiv>\n<h2 class=\"s\" style=\"--d:.06s;margin:0;font-size:68px;font-weight:900;letter-spacing:-.02em;line-height:1\">La même demande, deux résultats<\u002Fh2>\n<\u002Fdiv>\n<div style=\"display:grid;grid-template-columns:1fr 1.25fr;gap:36px;align-items:stretch\">\n<div class=\"r\" style=\"--d:.14s;background:#FFF6F5;border:1px solid #F3D6D3;border-radius:18px;padding:34px 38px;display:flex;flex-direction:column;gap:22px\">\n<div style=\"font-size:24px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:#B91C1C\">✕&nbsp;&nbsp;Avant<\u002Fdiv>\n<div style=\"font-size:34px;font-weight:800;line-height:1.35;color:#17181A\">« Fais-moi un exercice sur le passé composé. »<\u002Fdiv>\n<div style=\"margin-top:auto\"><div style=\"font-size:24px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:#6E7175;margin-bottom:10px\">Ce qu'on obtient<\u002Fdiv><div style=\"font-size:28px;font-weight:600;color:#3A3D40;line-height:1.4\">Dix phrases à trous, hors contexte, d'un niveau imprévisible, avec des verbes qui ne servent à personne. On recommence.<\u002Fdiv><\u002Fdiv>\n<\u002Fdiv>\n<div class=\"r\" style=\"--d:.26s;background:#fff;border:1px solid #D8E8DF;border-radius:18px;padding:34px 38px;display:flex;flex-direction:column;gap:22px\">\n<div style=\"font-size:24px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:#07734A\">✓&nbsp;&nbsp;Après<\u002Fdiv>\n<div style=\"font-size:28px;font-weight:700;line-height:1.4;color:#17181A\">« Mes élèves sont des adultes en francisation, niveau 4. Ils travaillent la prise de rendez-vous médical. Écris douze phrases au passé composé, au « je » et au « nous », avec des verbes de la vie courante. Une phrase par ligne, l'infinitif entre parenthèses. Pas de verbes pronominaux : on ne les a pas vus. »<\u002Fdiv>\n<div style=\"margin-top:auto\"><div style=\"font-size:24px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:#6E7175;margin-bottom:10px\">Ce qu'on obtient<\u002Fdiv><div style=\"font-size:28px;font-weight:700;color:#07734A;line-height:1.4\">Un exercice utilisable tel quel, dans le thème de la séquence, au bon niveau.<\u002Fdiv><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<div class=\"r\" style=\"--d:.4s;font-size:31px;font-weight:800;color:#3A3D40\">La deuxième consigne prend trente secondes de plus à écrire. Elle épargne trois allers-retours.<\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\"Quatre réflexes\" data-screen-label=\"23\" style=\"background:#F7F7F5;color:#17181A;font-family:Nunito,system-ui,sans-serif;padding:90px 110px 80px;display:flex;flex-direction:column;gap:44px\">\n<div style=\"display:flex;flex-direction:column;gap:10px\">\n<div class=\"s\" style=\"font-size:24px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:#0D7A6F\">Les aptitudes · 3<\u002Fdiv>\n<h2 class=\"s\" style=\"--d:.06s;margin:0;font-size:68px;font-weight:900;letter-spacing:-.02em;line-height:1\">Quatre réflexes, et ils tournent en boucle<\u002Fh2>\n<\u002Fdiv>\n<div style=\"display:flex;align-items:stretch;gap:18px\">\n<div class=\"r\" style=\"--d:.14s;flex:1;background:#fff;border:1px solid #EAEAE8;border-radius:18px;padding:34px;display:flex;flex-direction:column;gap:14px\"><div style=\"width:64px;height:64px;border-radius:32px;background:#DCF2EF;color:#0D7A6F;font-size:30px;font-weight:900;display:flex;align-items:center;justify-content:center\">1<\u002Fdiv><div style=\"font-size:34px;font-weight:900\">Donner la matière<\u002Fdiv><div style=\"font-size:27px;font-weight:600;color:#4B4F52;line-height:1.35\">Ne pas décrire un document : le déposer. Le programme, le manuel, la copie de l'élève.<\u002Fdiv><\u002Fdiv>\n<div class=\"p\" style=\"--d:.22s;align-self:center;font-size:40px;color:#0D7A6F;font-weight:900\">→<\u002Fdiv>\n<div class=\"r\" style=\"--d:.24s;flex:1;background:#fff;border:1px solid #EAEAE8;border-radius:18px;padding:34px;display:flex;flex-direction:column;gap:14px\"><div style=\"width:64px;height:64px;border-radius:32px;background:#DCF2EF;color:#0D7A6F;font-size:30px;font-weight:900;display:flex;align-items:center;justify-content:center\">2<\u002Fdiv><div style=\"font-size:34px;font-weight:900\">Demander la critique<\u002Fdiv><div style=\"font-size:27px;font-weight:600;color:#4B4F52;line-height:1.35\">« Qu'est-ce qui cloche dans cet exercice ? » — avant de le distribuer.<\u002Fdiv><\u002Fdiv>\n<div class=\"p\" style=\"--d:.32s;align-self:center;font-size:40px;color:#0D7A6F;font-weight:900\">→<\u002Fdiv>\n<div class=\"r\" style=\"--d:.34s;flex:1;background:#fff;border:1px solid #EAEAE8;border-radius:18px;padding:34px;display:flex;flex-direction:column;gap:14px\"><div style=\"width:64px;height:64px;border-radius:32px;background:#DCF2EF;color:#0D7A6F;font-size:30px;font-weight:900;display:flex;align-items:center;justify-content:center\">3<\u002Fdiv><div style=\"font-size:34px;font-weight:900\">Corriger en cours de route<\u002Fdiv><div style=\"font-size:27px;font-weight:600;color:#4B4F52;line-height:1.35\">Ne pas tout recommencer : dire ce qui ne va pas et faire reprendre.<\u002Fdiv><\u002Fdiv>\n<div class=\"p\" style=\"--d:.42s;align-self:center;font-size:40px;color:#0D7A6F;font-weight:900\">→<\u002Fdiv>\n<div class=\"r\" style=\"--d:.44s;flex:1;background:#17181A;color:#fff;border-radius:18px;padding:34px;display:flex;flex-direction:column;gap:14px\"><div style=\"width:64px;height:64px;border-radius:32px;background:#0A8F5B;color:#fff;font-size:30px;font-weight:900;display:flex;align-items:center;justify-content:center\">4<\u002Fdiv><div style=\"font-size:34px;font-weight:900\">Vérifier ce qui compte<\u002Fdiv><div style=\"font-size:27px;font-weight:600;color:#C9CDD0;line-height:1.35\">Les faits, les dates, les références, les règles. Le reste, on le lit.<\u002Fdiv><\u002Fdiv>\n<\u002Fdiv>\n<div class=\"r\" style=\"--d:.54s;font-size:30px;font-weight:700;color:#3A3D40\">↺ On repasse par la boucle autant de fois qu'il le faut. C'est normal, et c'est là que la qualité se gagne.<\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\"06 · Le matériel\" data-screen-label=\"24\" data-speaker-notes=\"Partie la plus attendue. Montrer du vrai matériel produit, pas des captures de démonstration.\" style=\"background:#E3F1E7;color:#17181A;font-family:Nunito,system-ui,sans-serif;padding:96px 110px 80px;display:flex;flex-direction:column;justify-content:center;gap:34px\">\n<div class=\"p\" style=\"font-size:200px;font-weight:900;line-height:.78;letter-spacing:-.05em;color:#166534\">06<\u002Fdiv>\n<div class=\"s\" style=\"--d:.12s;font-size:26px;font-weight:800;letter-spacing:.18em;text-transform:uppercase;color:#166534\">Le matériel<\u002Fdiv>\n<h2 class=\"s\" style=\"--d:.18s;margin:0;font-size:92px;font-weight:900;letter-spacing:-.025em;line-height:1.02\">Développer du matériel<\u002Fh2>\n<p class=\"r\" style=\"--d:.26s;margin:0;font-size:38px;font-weight:600;color:#4B4F52;max-width:1200px\">De l'exercice unique à la collection cohérente.<\u002Fp>\n<div class=\"g\" style=\"--d:.3s;height:6px;background:#166534;border-radius:3px;max-width:520px\"><\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\"Trois échelles\" data-screen-label=\"25\" data-speaker-notes=\"Ce qui change l'échelle, c'est la cohérence d'une collection : un gabarit décidé une fois, appliqué partout.\" style=\"background:#F7F7F5;color:#17181A;font-family:Nunito,system-ui,sans-serif;padding:90px 110px 80px;display:flex;flex-direction:column;gap:34px\">\n<div style=\"display:flex;flex-direction:column;gap:10px\">\n<div class=\"s\" style=\"font-size:24px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:#166534\">Le matériel · 1<\u002Fdiv>\n<h2 class=\"s\" style=\"--d:.06s;margin:0;font-size:68px;font-weight:900;letter-spacing:-.02em;line-height:1\">Trois échelles de production<\u002Fh2>\n<p class=\"r\" style=\"--d:.1s;margin:6px 0 0;font-size:31px;font-weight:600;color:#4B4F52\">Le même outil, trois ambitions. Chaque marche suppose la précédente — et rapporte davantage.<\u002Fp>\n<\u002Fdiv>\n<div style=\"display:grid;grid-template-columns:repeat(3,1fr);gap:26px;align-items:end;flex:1\">\n<div class=\"r\" style=\"--d:.16s;background:#fff;border:1px solid #EAEAE8;border-radius:18px;padding:32px 34px;height:56%;display:flex;flex-direction:column;gap:12px\">\n<div style=\"font-size:24px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:#6E7175\">Échelle 1<\u002Fdiv>\n<div style=\"font-size:38px;font-weight:900\">Le quotidien<\u002Fdiv>\n<div style=\"font-size:27px;font-weight:600;color:#4B4F52;line-height:1.35;flex:1\">Exercices, textes adaptés, listes de vocabulaire, corrigés, grilles.<\u002Fdiv>\n<div style=\"font-size:27px;font-weight:800;color:#166534\">Une conversation, quinze minutes.<\u002Fdiv>\n<\u002Fdiv>\n<div class=\"r\" style=\"--d:.26s;background:#fff;border:1px solid #EAEAE8;border-radius:18px;padding:32px 34px;height:76%;display:flex;flex-direction:column;gap:12px\">\n<div style=\"font-size:24px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:#6E7175\">Échelle 2<\u002Fdiv>\n<div style=\"font-size:38px;font-weight:900\">Le document<\u002Fdiv>\n<div style=\"font-size:27px;font-weight:600;color:#4B4F52;line-height:1.35;flex:1\">Cahier de l'élève, présentation, fiche imprimable, plan de cours complet.<\u002Fdiv>\n<div style=\"font-size:27px;font-weight:800;color:#166534\">Cowork, une avant-midi.<\u002Fdiv>\n<\u002Fdiv>\n<div class=\"r\" style=\"--d:.36s;background:#17181A;color:#fff;border-radius:18px;padding:32px 34px;height:100%;display:flex;flex-direction:column;gap:12px\">\n<div style=\"font-size:24px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:#9A9EA2\">Échelle 3<\u002Fdiv>\n<div style=\"font-size:38px;font-weight:900\">Le dispositif<\u002Fdiv>\n<div style=\"font-size:27px;font-weight:600;color:#C9CDD0;line-height:1.35;flex:1\">Une séquence entière : activités interactives, audio, suivi, portail élève.<\u002Fdiv>\n<div style=\"font-size:27px;font-weight:800;color:#7FD3AE\">Code, un chantier suivi.<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<div class=\"r\" style=\"--d:.46s;font-size:31px;font-weight:800;color:#3A3D40\">La vraie économie n'est pas le premier document — c'est le deuxième, et les dix-huit suivants.<\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\"Un cas réel\" data-screen-label=\"26\" data-speaker-notes=\"Chiffres à revalider avant la présentation. Montrer un module en direct si le réseau le permet.\" style=\"background:#17181A;color:#fff;font-family:Nunito,system-ui,sans-serif;padding:90px 110px 80px;display:flex;flex-direction:column;gap:40px\">\n<div style=\"display:flex;flex-direction:column;gap:10px\">\n<div class=\"s\" style=\"font-size:24px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:#7FD3AE\">Le matériel · 2<\u002Fdiv>\n<h2 class=\"s\" style=\"--d:.06s;margin:0;font-size:68px;font-weight:900;letter-spacing:-.02em;line-height:1\">Un cas réel : cette bibliothèque-ci<\u002Fh2>\n<\u002Fdiv>\n<div style=\"display:grid;grid-template-columns:repeat(4,1fr);gap:26px\">\n<div class=\"p\" style=\"--d:.14s;border-top:4px solid #0A8F5B;padding-top:20px\"><div style=\"font-size:104px;font-weight:900;line-height:.9;letter-spacing:-.03em\">11<\u002Fdiv><div style=\"font-size:28px;font-weight:700;color:#C9CDD0\">modules complets<\u002Fdiv><\u002Fdiv>\n<div class=\"p\" style=\"--d:.22s;border-top:4px solid #0A8F5B;padding-top:20px\"><div style=\"font-size:104px;font-weight:900;line-height:.9;letter-spacing:-.03em\">16<\u002Fdiv><div style=\"font-size:28px;font-weight:700;color:#C9CDD0\">séances par module<\u002Fdiv><\u002Fdiv>\n<div class=\"p\" style=\"--d:.30s;border-top:4px solid #0A8F5B;padding-top:20px\"><div style=\"font-size:104px;font-weight:900;line-height:.9;letter-spacing:-.03em\">8<\u002Fdiv><div style=\"font-size:28px;font-weight:700;color:#C9CDD0\">niveaux couverts<\u002Fdiv><\u002Fdiv>\n<div class=\"p\" style=\"--d:.38s;border-top:4px solid #0A8F5B;padding-top:20px\"><div style=\"font-size:104px;font-weight:900;line-height:.9;letter-spacing:-.03em;color:#7FD3AE\">100 %<\u002Fdiv><div style=\"font-size:28px;font-weight:700;color:#C9CDD0\">contenu original<\u002Fdiv><\u002Fdiv>\n<\u002Fdiv>\n<div style=\"display:grid;grid-template-columns:repeat(3,1fr);gap:26px\">\n<div class=\"r\" style=\"--d:.46s;background:#212326;border-radius:18px;padding:30px 32px;display:flex;flex-direction:column;gap:10px\"><div style=\"font-size:32px;font-weight:900;color:#7FD3AE\">Le gabarit d'abord<\u002Fdiv><div style=\"font-size:27px;font-weight:600;color:#C9CDD0;line-height:1.35\">Une seule structure décidée au départ, puis appliquée à tous les modules.<\u002Fdiv><\u002Fdiv>\n<div class=\"r\" style=\"--d:.54s;background:#212326;border-radius:18px;padding:30px 32px;display:flex;flex-direction:column;gap:10px\"><div style=\"font-size:32px;font-weight:900;color:#7FD3AE\">Le contenu inventé<\u002Fdiv><div style=\"font-size:27px;font-weight:600;color:#C9CDD0;line-height:1.35\">Le manuel du commerce sert de modèle de progression, jamais de source à recopier.<\u002Fdiv><\u002Fdiv>\n<div class=\"r\" style=\"--d:.62s;background:#212326;border-radius:18px;padding:30px 32px;display:flex;flex-direction:column;gap:10px\"><div style=\"font-size:32px;font-weight:900;color:#7FD3AE\">L'enseignant décide<\u002Fdiv><div style=\"font-size:27px;font-weight:600;color:#C9CDD0;line-height:1.35\">Chaque scénario, chaque personnage, chaque intention pédagogique vient de nous.<\u002Fdiv><\u002Fdiv>\n<\u002Fdiv>\n<div class=\"r\" style=\"--d:.7s;font-size:30px;font-weight:700;color:#E7E9EA\">Aucun de ces chiffres n'aurait été atteignable à la main. Aucun n'aurait tenu debout sans un enseignant derrière.<\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\"Vigilance\" data-screen-label=\"27\" style=\"background:#F7F7F5;color:#17181A;font-family:Nunito,system-ui,sans-serif;padding:90px 110px 80px;display:flex;flex-direction:column;gap:38px\">\n<div style=\"display:flex;flex-direction:column;gap:10px\">\n<div class=\"s\" style=\"font-size:24px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:#166534\">Le matériel · 3<\u002Fdiv>\n<h2 class=\"s\" style=\"--d:.06s;margin:0;font-size:68px;font-weight:900;letter-spacing:-.02em;line-height:1\">Ce à quoi on fait attention<\u002Fh2>\n<\u002Fdiv>\n<div style=\"display:grid;grid-template-columns:1fr 1fr;gap:28px\">\n<div class=\"r\" style=\"--d:.14s;background:#fff;border:1px solid #EAEAE8;border-radius:18px;padding:34px 38px;display:flex;gap:24px\">\n<div style=\"width:60px;height:60px;flex:none;border-radius:30px;background:#FEF6E7;color:#8A5206;font-size:34px;font-weight:900;display:flex;align-items:center;justify-content:center\">!<\u002Fdiv>\n<div style=\"display:flex;flex-direction:column;gap:10px\"><div style=\"font-size:34px;font-weight:900\">Les renseignements personnels<\u002Fdiv><div style=\"font-size:28px;font-weight:600;color:#4B4F52;line-height:1.35\">Jamais de nom d'élève, de dossier, de coordonnées. On travaille avec des pseudonymes ou des extraits anonymisés.<\u002Fdiv><\u002Fdiv>\n<\u002Fdiv>\n<div class=\"r\" style=\"--d:.22s;background:#fff;border:1px solid #EAEAE8;border-radius:18px;padding:34px 38px;display:flex;gap:24px\">\n<div style=\"width:60px;height:60px;flex:none;border-radius:30px;background:#FEF6E7;color:#8A5206;font-size:34px;font-weight:900;display:flex;align-items:center;justify-content:center\">!<\u002Fdiv>\n<div style=\"display:flex;flex-direction:column;gap:10px\"><div style=\"font-size:34px;font-weight:900\">La Loi 25<\u002Fdiv><div style=\"font-size:28px;font-weight:600;color:#4B4F52;line-height:1.35\">Les données sortent de l'établissement. Vérifier ce que la direction autorise avant d'y déposer quoi que ce soit d'institutionnel.<\u002Fdiv><\u002Fdiv>\n<\u002Fdiv>\n<div class=\"r\" style=\"--d:.30s;background:#fff;border:1px solid #EAEAE8;border-radius:18px;padding:34px 38px;display:flex;gap:24px\">\n<div style=\"width:60px;height:60px;flex:none;border-radius:30px;background:#FEF6E7;color:#8A5206;font-size:34px;font-weight:900;display:flex;align-items:center;justify-content:center\">!<\u002Fdiv>\n<div style=\"display:flex;flex-direction:column;gap:10px\"><div style=\"font-size:34px;font-weight:900\">Le droit d'auteur<\u002Fdiv><div style=\"font-size:28px;font-weight:600;color:#4B4F52;line-height:1.35\">Un manuel sert de modèle de structure, pas de réservoir à recopier. Le contenu qu'on distribue doit être le nôtre.<\u002Fdiv><\u002Fdiv>\n<\u002Fdiv>\n<div class=\"r\" style=\"--d:.38s;background:#fff;border:1px solid #EAEAE8;border-radius:18px;padding:34px 38px;display:flex;gap:24px\">\n<div style=\"width:60px;height:60px;flex:none;border-radius:30px;background:#FEF6E7;color:#8A5206;font-size:34px;font-weight:900;display:flex;align-items:center;justify-content:center\">!<\u002Fdiv>\n<div style=\"display:flex;flex-direction:column;gap:10px\"><div style=\"font-size:34px;font-weight:900\">La justesse<\u002Fdiv><div style=\"font-size:28px;font-weight:600;color:#4B4F52;line-height:1.35\">Tout ce qui est vérifiable se vérifie : les faits, les règles, les références, les niveaux de langue.<\u002Fdiv><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<div class=\"r\" style=\"--d:.48s;background:#17181A;color:#fff;border-radius:18px;padding:30px 38px;font-size:32px;font-weight:800\">Une règle simple et suffisante : rien qui permette d'identifier un élève ne sort de l'établissement.<\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\"La proposition\" data-screen-label=\"28\" style=\"background:#EDF6F1;color:#17181A;font-family:Nunito,system-ui,sans-serif;padding:90px 110px 80px;display:flex;flex-direction:column;gap:40px\">\n<div style=\"display:flex;flex-direction:column;gap:10px\">\n<div class=\"s\" style=\"font-size:24px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:#07734A\">La proposition<\u002Fdiv>\n<h2 class=\"s\" style=\"--d:.06s;margin:0;font-size:72px;font-weight:900;letter-spacing:-.02em;line-height:1\">Trois ateliers, trois heures chacun<\u002Fh2>\n<\u002Fdiv>\n<div style=\"display:grid;grid-template-columns:repeat(3,1fr);gap:28px;flex:1\">\n<div class=\"r\" style=\"--d:.14s;background:#fff;border-radius:18px;padding:38px 40px;display:flex;flex-direction:column;gap:16px\">\n<div style=\"width:72px;height:72px;border-radius:36px;background:#0A8F5B;color:#fff;font-size:36px;font-weight:900;display:flex;align-items:center;justify-content:center\">1<\u002Fdiv>\n<div style=\"font-size:24px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:#6E7175\">Atelier 1<\u002Fdiv>\n<div style=\"font-size:40px;font-weight:900\">Comprendre et converser<\u002Fdiv>\n<div style=\"font-size:28px;font-weight:600;color:#4B4F52;line-height:1.35;flex:1\">Le mécanisme, les malentendus, l'art de la consigne. Chacun repart avec trois consignes qui fonctionnent pour son cours.<\u002Fdiv>\n<div style=\"background:#E6F5EE;color:#07734A;border-radius:999px;padding:10px 22px;font-size:26px;font-weight:800;align-self:flex-start\">Aucun prérequis<\u002Fdiv>\n<\u002Fdiv>\n<div class=\"r\" style=\"--d:.24s;background:#fff;border-radius:18px;padding:38px 40px;display:flex;flex-direction:column;gap:16px\">\n<div style=\"width:72px;height:72px;border-radius:36px;background:#0A8F5B;color:#fff;font-size:36px;font-weight:900;display:flex;align-items:center;justify-content:center\">2<\u002Fdiv>\n<div style=\"font-size:24px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:#6E7175\">Atelier 2<\u002Fdiv>\n<div style=\"font-size:40px;font-weight:900\">Produire du matériel<\u002Fdiv>\n<div style=\"font-size:28px;font-weight:600;color:#4B4F52;line-height:1.35;flex:1\">Cowork en main : cahier de l'élève, présentation, corrigé. Chacun repart avec un document fini.<\u002Fdiv>\n<div style=\"background:#E6F5EE;color:#07734A;border-radius:999px;padding:10px 22px;font-size:26px;font-weight:800;align-self:flex-start\">Avoir suivi l'atelier 1<\u002Fdiv>\n<\u002Fdiv>\n<div class=\"r\" style=\"--d:.34s;background:#17181A;color:#fff;border-radius:18px;padding:38px 40px;display:flex;flex-direction:column;gap:16px\">\n<div style=\"width:72px;height:72px;border-radius:36px;background:#0A8F5B;color:#fff;font-size:36px;font-weight:900;display:flex;align-items:center;justify-content:center\">3<\u002Fdiv>\n<div style=\"font-size:24px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:#9A9EA2\">Atelier 3<\u002Fdiv>\n<div style=\"font-size:40px;font-weight:900\">Bâtir une collection<\u002Fdiv>\n<div style=\"font-size:28px;font-weight:600;color:#C9CDD0;line-height:1.35;flex:1\">Gabarit, cohérence, production en série, mise en ligne. Pour ceux qui veulent outiller leur équipe.<\u002Fdiv>\n<div style=\"background:#0A8F5B;color:#fff;border-radius:999px;padding:10px 22px;font-size:26px;font-weight:800;align-self:flex-start\">Volontaires<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<div class=\"r\" style=\"--d:.44s;font-size:31px;font-weight:800;color:#07734A\">Chaque atelier se termine sur du matériel utilisable dès le lendemain. Rien de théorique qui ne serve pas.<\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\"Pour finir\" data-screen-label=\"29\" data-speaker-notes=\"Terminer sur une question ouverte : qu'est-ce que chacun aimerait ne plus jamais avoir à faire à la main ?\" style=\"background:#17181A;color:#fff;font-family:Nunito,system-ui,sans-serif;padding:96px 110px 80px;display:flex;flex-direction:column;justify-content:space-between\">\n<div class=\"d\" style=\"font-size:24px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:#7FD3AE\">Pour finir<\u002Fdiv>\n<div style=\"display:flex;flex-direction:column;gap:40px\">\n<h2 class=\"r\" style=\"--d:.12s;margin:0;font-size:104px;font-weight:900;line-height:1.02;letter-spacing:-.03em;max-width:1500px\">L'outil ne remplace pas le jugement. Il lui laisse de la place.<\u002Fh2>\n<div class=\"g\" style=\"--d:.3s;height:6px;background:#0A8F5B;border-radius:3px;max-width:420px\"><\u002Fdiv>\n<p class=\"r\" style=\"--d:.34s;margin:0;font-size:36px;font-weight:600;line-height:1.4;color:#C9CDD0;max-width:1400px\">Ce qu'un enseignant sait — de sa matière, de ses élèves, de ce qui bloque le mardi matin — reste ce qu'il y a de plus rare. Le reste peut être délégué.<\u002Fp>\n<\u002Fdiv>\n<div style=\"display:flex;justify-content:space-between;align-items:flex-end\">\n<div class=\"r\" style=\"--d:.44s\"><div style=\"font-size:34px;font-weight:900\">francıs<\u002Fdiv><div style=\"font-size:24px;font-weight:700;color:#9A9EA2\">Aide à l'apprentissage du français<\u002Fdiv><\u002Fdiv>\n<div class=\"r\" style=\"--d:.5s;font-size:26px;font-weight:700;color:#9A9EA2\">Daniel Tousignant · tousignantd@gmail.com<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<\u002Fx-import>\n<\u002Fx-dc>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
