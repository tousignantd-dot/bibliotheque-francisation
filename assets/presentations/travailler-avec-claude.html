  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

nt-family: 'Nunito';\n  font-style: normal;\n  font-weight: 900;\n  font-display: swap;\n  src: url(\"879fcbdb-ef26-4d1a-93a6-28ee3c28f72c\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n\n\n/* ─── styles.css ─── */\n/* ============================================================\n   FRANCISATION · point d'entrée CSS unique\n   Liez CE fichier seulement. Rien d'autre que des @import ici.\n   ============================================================ */\n\n/* ─── tokens/fonts.css ─── */\n/* ============================================================\n   FRANCISATION · POLICE\n   Nunito partout. Formes ouvertes, « a » et « g » à un étage :\n   c'est le critère de choix — lisibilité pour des adultes qui\n   apprennent à lire en français.\n   Graisses réellement utilisées : 400 · 600 · 700 · 800 · 900.\n   ============================================================ */\n\n\n:root {\n  --font-sans: \"Nunito\", system-ui, -apple-system, \"Segoe UI\", sans-serif;\n}\n\n\n/* ─── tokens/colors.css ─── */\n/* ============================================================\n   FRANCISATION · COULEURS\n   Fond neutre chaud, cartes blanches, une seule couleur d'accent\n   (vert). Les couleurs de section servent AU REPÉRAGE, jamais à\n   décorer. Le rouge est réservé à l'audio et à l'erreur.\n   Tout ratio annoncé est mesuré sur son fond documenté.\n   ============================================================ */\n:root {\n  /* — Neutres (chauds) — */\n  --paper-50:  #FBFBFA;   /* fond de champ, pied de carte */\n  --paper-100: #F7F7F5;   /* FOND DE PAGE */\n  --paper-200: #F0F0EE;   /* filet intérieur de liste */\n  --white:     #FFFFFF;   /* cartes */\n\n  --line-100:  #EAEAE8;   /* filet neutre */\n  --line-200:  #D8E8DF;   /* filet teinté vert (bandeaux clairs) */\n  --line-300:  #D6D6D2;   /* contour de zone de dépôt vide */\n\n  --ink-900:   #17181A;   /* encre principale */\n  --ink-700:   #3A3D40;   /* texte long, transcriptions */\n  --ink-500:   #4B4F52;   /* chapeau sur fond clair */\n  --ink-400:   #6E7175;   /* texte secondaire — 4.6:1 sur blanc ✔ AA */\n\n  /* — Accent principal : vert — */\n  --green-800: #07734A;   /* texte vert sur fond clair — 5.4:1 ✔ */\n  --green-600: #0A8F5B;   /* ACCENT · filets, focus, pastilles */\n  --green-100: #E6F5EE;   /* fond d'accent, état réussi */\n  --green-050: #EDF6F1;   /* bandeau clair pleine largeur */\n\n  /* — Accents de section (repérage seulement) —\n     Un seul par section : pastille numérotée, sur-titre, filet\n     gauche de 4 px, point de la barre de parcours. Jamais en aplat\n     derrière du texte long. */\n  --acier-600:  #1D6B8F;  --acier-100:  #E7F0F6;   /* compréhension orale */\n  --violet-600: #6B4FBB;  --violet-100: #EFEAFA;   /* graphie-phonie */\n  --ambre-700:  #B45309;  --ambre-100:  #FBEEDC;   /* écriture */\n  --teal-700:   #0D7A6F;  --teal-100:   #DCF2EF;   /* écoute et réponds */\n  --foret-700:  #166534;  --foret-100:  #E3F1E7;   /* vocabulaire / bilan */\n\n  /* — Audio : le seul aplat rouge de l'interface — */\n  --audio:       #DC2626;\n  --audio-hover: #B91C1C;\n\n  /* — Rétroaction : 4 états × 3 rôles —\n     L'erreur n'a PAS d'aplat saturé : fond à peine teinté, filet et\n     texte rouges. Ainsi le seul rouge plein reste le bouton audio. */\n  --ok-bg:   #E6F5EE;  --ok-line:   #0A8F5B;  --ok-ink:   #07734A;\n  --no-bg:   #FFF6F5;  --no-line:   #DC2626;  --no-ink:   #B91C1C;\n  --warn-bg: #FEF6E7;  --warn-line: #D9880B;  --warn-ink: #8A5206;\n\n  /* — Sélection = plaque encre (jamais une teinte de plus) — */\n  --sel-bg:  #17181A;  --sel-line: #17181A;  --sel-ink: #FFFFFF;\n\n  /* — Zone de dépôt vide : neutre, pas bleue — */\n  --drop-bg: #FBFBFA;  --drop-line: #D6D6D2;\n\n  /* ==========================================================\n     ALIAS SÉMANTIQUES — c'est ce que les composants référencent\n     ========================================================== */\n  --surface-page:    var(--paper-100);\n  --surface-card:    var(--white);\n  --surface-sunken:  var(--paper-50);\n  --surface-band:    var(--green-050);   /* bandeau d'en-tête clair */\n  --surface-inverse: var(--ink-900);     /* réservé à 1 bloc par page */\n\n  --text-strong:  var(--ink-900);\n  --text-body:    var(--ink-700);\n  --text-muted:   var(--ink-400);\n  --text-inverse: var(--white);\n  --text-accent:  var(--green-800);\n\n  --border:       var(--line-100);\n  --border-tint:  var(--line-200);\n  --accent:       var(--green-600);\n  --accent-soft:  var(--green-100);\n  --accent-ink:   var(--green-800);\n\n  --focus-ring:   var(--green-600);\n  --link:         var(--green-600);\n  --link-hover:   var(--green-800);\n}\n\n\n/* ─── tokens/typography.css ─── */\n/* ============================================================\n   FRANCISATION · TYPOGRAPHIE\n   Quatre niveaux, écarts francs : 62 · 30 · 19 · 17.\n   Corps de texte JAMAIS sous 17 px — public en apprentissage.\n   Le sur-titre (13 px, 800, majuscules, interlettrage .12em) est\n   le seul endroit où les majuscules sont permises.\n   ============================================================ */\n:root {\n  --fs-hero:   clamp(40px, 6vw, 62px);  /* titre de page  · 900 */\n  --fs-h2:     30px;                    /* titre d'exercice · 900 */\n  --fs-h3:     24px;                    /* mot vedette, sous-bloc · 900 */\n  --fs-lead:   19px;                    /* chapeau, énoncé long · 600-700 */\n  --fs-body:   18px;                    /* énoncé courant · 600-700 */\n  --fs-body-sm:17px;                    /* consigne, définition · 600 */\n  --fs-ui:     15px;                    /* libellé de bouton · 700-800 */\n  --fs-ui-sm:  14px;                    /* bouton secondaire, score · 700-800 */\n  --fs-label:  13px;                    /* SUR-TITRE majuscules · 800 */\n  --fs-meta:   12px;                    /* méta, compteur · 800 */\n\n  --lh-hero:  1.02;\n  --lh-title: 1.2;\n  --lh-body:  1.5;\n  --lh-loose: 1.6;\n\n  --ls-hero:  -0.02em;\n  --ls-title: -0.015em;\n  --ls-label: 0.12em;   /* sur-titres en majuscules */\n\n  --fw-regular: 400;\n  --fw-medium:  600;\n  --fw-semi:    700;\n  --fw-bold:    800;\n  --fw-black:   900;\n}\n\n\n/* ─── tokens/spacing.css ─── */\n/* ============================================================\n   FRANCISATION · ESPACEMENT ET RAYONS\n   Une seule échelle, 6 crans utiles + 2 pour les sections.\n   N'inventez pas de valeur intermédiaire.\n   ============================================================ */\n:root {\n  --sp-1:  4px;\n  --sp-2:  8px;\n  --sp-3:  12px;\n  --sp-4:  16px;\n  --sp-5:  20px;\n  --sp-6:  24px;\n  --sp-8:  32px;   /* gouttière de page */\n  --sp-12: 48px;   /* écart entre deux exercices */\n\n  --r-sm:   10px;  /* contrôles, champs, tuiles */\n  --r-md:   14px;  /* jetons, pastille numérotée */\n  --r-lg:   18px;  /* cartes, cadres, bandeaux */\n  --r-pill: 999px; /* boutons, étiquettes, scores */\n\n  --content-max: 1000px;\n  --gutter:      var(--sp-8);\n\n  /* Cibles tactiles — plancher absolu 44 px (adultes, écrans tactiles) */\n  --tap-min:     44px;\n  --tap-comfort: 48px;\n  --tap-large:   52px;\n}\n\n\n/* ─── tokens/effects.css ─── */\n/* ============================================================\n   FRANCISATION · OMBRES, MOUVEMENT, FOCUS\n   Ombres presque invisibles : la structure vient des filets et de\n   l'alignement, pas de la profondeur. Aucun rebond, aucune\n   parallaxe — le mouvement ne doit jamais distraire d'une consigne.\n   ============================================================ */\n:root {\n  --sh-card:  0 1px 2px rgba(20, 20, 20, .04);\n  --sh-raise: 0 4px 20px rgba(20, 20, 20, .06);\n  --sh-modal: 0 24px 64px rgba(20, 20, 20, .28);\n\n  --dur-fast: 120ms;\n  --dur:      140ms;\n  --ease:     cubic-bezier(.2, .7, .3, 1);\n\n  --focus-width:  3px;\n  --focus-offset: 2px;\n}\n\n@media (prefers-reduced-motion: reduce) {\n  :root { --dur-fast: 0ms; --dur: 0ms; }\n}\n\n\n/* ─── tokens/base.css ─── */\n/* ============================================================\n   FRANCISATION · SOCLE\n   Réinitialisation minimale + règles non négociables\n   d'accessibilité. À charger après les jetons.\n   ============================================================ */\n*, *::before, *::after { box-sizing: border-box; }\n\nhtml { -webkit-text-size-adjust: 100%; }\n\nbody {\n  margin: 0;\n  background: var(--surface-page);\n  color: var(--text-strong);\n  font-family: var(--font-sans);\n  font-size: var(--fs-body);\n  font-weight: var(--fw-medium);\n  line-height: var(--lh-body);\n  -webkit-font-smoothing: antialiased;\n  text-wrap: pretty;\n}\n\nh1, h2, h3 { margin: 0; letter-spacing: var(--ls-title); line-height: var(--lh-title); }\nh1 { font-size: var(--fs-hero); font-weight: var(--fw-black); line-height: var(--lh-hero); letter-spacing: var(--ls-hero); }\nh2 { font-size: var(--fs-h2);   font-weight: var(--fw-black); }\nh3 { font-size: var(--fs-h3);   font-weight: var(--fw-black); }\np  { margin: 0; }\n\na { color: var(--link); text-decoration: underline; text-underline-offset: 3px; }\na:hover { color: var(--link-hover); }\n\n/* Focus clavier visible PARTOUT. Ne jamais retirer sans remplacer. */\n:focus-visible {\n  outline: var(--focus-width) solid var(--focus-ring);\n  outline-offset: var(--focus-offset);\n  border-radius: var(--r-sm);\n}\n\n/* Le zoom doit rester possible : jamais user-scalable=no dans le viewport. */\n\n::placeholder { color: var(--text-muted); opacity: 1; }  /* 4.6:1 ✔ AA */\n\n::-webkit-scrollbar { width: 6px; height: 6px; }\n::-webkit-scrollbar-thumb { background: rgba(0,0,0,.15); border-radius: 3px; }\n\n.u-visually-hidden {\n  position: absolute; width: 1px; height: 1px; overflow: hidden;\n  clip: rect(0 0 0 0); white-space: nowrap;\n}\n\n\n\n/* ─── components/layout.css ─── */\n/* ============================================================\n   MISE EN PAGE · bandeau, barre de parcours, en-tête d'exercice\n   La hiérarchie de la page tient à quatre niveaux :\n   1 bandeau clair  ·  2 barre de parcours  ·  3 en-tête d'exercice\n   ·  4 contenu en cartes blanches.\n   ============================================================ */\n.page      { background: var(--surface-page); color: var(--text-strong); }\n.container { max-width: var(--content-max); margin: 0 auto; padding: 0 var(--gutter); }\n\n/* — 1 · Bandeau d'en-tête (clair, pas noir) — */\n.band {\n  background: var(--surface-band);\n  border-bottom: 1px solid var(--border-tint);\n  padding: var(--sp-8) 0 var(--sp-12);\n}\n.band__eyebrow {\n  display: flex; align-items: center; gap: var(--sp-2);\n  font-size: var(--fs-label); font-weight: var(--fw-bold);\n  letter-spacing: var(--ls-label); text-transform: uppercase;\n  color: var(--text-accent);\n}\n.band__eyebrow::before {\n  content: \"\"; width: 8px; height: 8px; border-radius: 50%;\n  background: var(--accent); flex-shrink: 0;\n}\n.band__lead {\n  max-width: 56ch; margin-top: var(--sp-4);\n  font-size: var(--fs-lead); font-weight: var(--fw-medium);\n  color: var(--ink-500);\n}\n\n/* — 2 · Barre de parcours (collante) — */\n.steps {\n  position: sticky; top: 0; z-index: 5;\n  background: rgba(247, 247, 245, .94);\n  backdrop-filter: blur(8px);\n  border-bottom: 1px solid var(--border);\n}\n.steps__inner {\n  max-width: var(--content-max); margin: 0 auto;\n  padding: var(--sp-3) var(--gutter);\n  display: flex; flex-wrap: wrap; gap: var(--sp-2); align-items: center;\n}\n.step {\n  display: inline-flex; align-items: center; gap: var(--sp-2);\n  min-height: var(--tap-min); padding: 0 var(--sp-4);\n  border: 1px solid var(--border); border-radius: var(--r-pill);\n  background: var(--surface-card); color: var(--text-body);\n  font-size: var(--fs-ui-sm); font-weight: var(--fw-bold);\n  text-decoration: none; white-space: nowrap;\n  transition: background var(--dur) var(--ease), border-color var(--dur) var(--ease);\n}\n.step__dot { width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0; background: currentColor; }\n.step:hover { background: var(--paper-50); }\n/* fait : la teinte de section apparaît — poser aussi --sec et --sec-soft */\n.step.is-done {\n  background: var(--sec-soft); border-color: var(--sec); color: var(--sec);\n}\n\n/* — 3 · En-tête d'exercice —\n   Porte la couleur de section via --sec / --sec-soft, posés sur .exo. */\n.exo { --sec: var(--accent); --sec-soft: var(--accent-soft); scroll-margin-top: 80px; }\n.exo--orale   { --sec: var(--acier-600);  --sec-soft: var(--acier-100); }\n.exo--phonie  { --sec: var(--violet-600); --sec-soft: var(--violet-100); }\n.exo--ecriture{ --sec: var(--ambre-700);  --sec-soft: var(--ambre-100); }\n.exo--ecoute  { --sec: var(--teal-700);   --sec-soft: var(--teal-100); }\n.exo--vocab   { --sec: var(--green-600);  --sec-soft: var(--green-100); }\n\n.exo__head { display: flex; align-items: center; gap: var(--sp-4); margin-bottom: var(--sp-1); }\n.exo__num {\n  flex-shrink: 0; width: 44px; height: 44px; border-radius: var(--r-md);\n  display: flex; align-items: center; justify-content: center;\n  background: var(--sec-soft); color: var(--sec);\n  font-size: 19px; font-weight: var(--fw-black);\n}\n.exo__eyebrow {\n  font-size: var(--fs-label); font-weight: var(--fw-black);\n  letter-spacing: var(--ls-label); text-transform: uppercase; color: var(--sec);\n}\n.exo__rule  { flex: 1; height: 1px; background: var(--border); }\n.exo__score {\n  background: var(--sec-soft); color: var(--sec);\n  padding: 6px var(--sp-3); border-radius: var(--r-pill);\n  font-size: var(--fs-ui-sm); font-weight: var(--fw-bold); white-space: nowrap;\n}\n.exo__title { font-size: var(--fs-h2); font-weight: var(--fw-black); margin: 0 0 var(--sp-1); }\n.exo__sub   { font-size: var(--fs-body-sm); font-weight: var(--fw-medium); color: var(--text-muted); margin: 0 0 var(--sp-5); }\n\n.stack   { display: flex; flex-direction: column; gap: var(--sp-3); }\n.stack-l { display: flex; flex-direction: column; gap: var(--sp-12); }\n.grid-auto { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: var(--sp-3); }\n\n\n/* ─── components/buttons.css ─── */\n/* ============================================================\n   BOUTONS\n   Toujours en pilule. Trois rôles seulement :\n   .btn--pri (encre) · .btn--ghost (blanc) · .btn--audio (rouge).\n   Le rouge est RÉSERVÉ à l'audio. Hauteur plancher 44 px.\n   ============================================================ */\n.btn {\n  display: inline-flex; align-items: center; justify-content: center; gap: var(--sp-2);\n  min-height: var(--tap-comfort); padding: 0 var(--sp-5);\n  border: 1px solid transparent; border-radius: var(--r-pill);\n  font-family: var(--font-sans); font-size: var(--fs-ui); font-weight: var(--fw-bold);\n  line-height: 1; white-space: nowrap; flex-shrink: 0; cursor: pointer;\n  transition: background var(--dur) var(--ease), color var(--dur) var(--ease),\n              border-color var(--dur) var(--ease);\n}\n.btn:disabled { opacity: .5; cursor: not-allowed; }\n\n.btn--pri   { background: var(--ink-900); color: var(--white); }\n.btn--pri:hover { background: var(--accent); }\n\n.btn--ghost { background: var(--surface-card); color: var(--text-strong); border-color: var(--border); }\n.btn--ghost:hover { background: var(--paper-100); }\n\n/* Le seul aplat rouge de l'interface. */\n.btn--audio { background: var(--audio); color: var(--white); }\n.btn--audio:hover { background: var(--audio-hover); }\n\n.btn--sm { min-height: var(--tap-min); padding: 0 var(--sp-4); font-size: var(--fs-ui-sm); font-weight: var(--fw-semi); }\n.btn--lg { min-height: var(--tap-large); padding: 0 var(--sp-6); font-size: 16px; }\n\n/* Bouton d'écoute rond — icône seule, jamais sous 44 px. */\n.btn-audio-round {\n  flex-shrink: 0; width: var(--tap-min); height: var(--tap-min);\n  display: inline-flex; align-items: center; justify-content: center;\n  border: none; border-radius: 50%;\n  background: var(--audio); color: var(--white); cursor: pointer;\n  transition: background var(--dur) var(--ease);\n}\n.btn-audio-round:hover { background: var(--audio-hover); }\n.btn-audio-round svg { width: 18px; height: 18px; }\n\n.btn .icon, .btn svg { width: 17px; height: 17px; flex-shrink: 0; }\n\n\n/* ─── components/forms.css ─── */\n/* ============================================================\n   CHAMPS\n   Fond légèrement creusé, filet neutre, focus vert.\n   Corps de saisie à 17 px minimum : la réponse doit être relisible.\n   ============================================================ */\n.field {\n  width: 100%; min-height: var(--tap-comfort); padding: 0 var(--sp-4);\n  border: 1px solid var(--border); border-radius: var(--r-sm);\n  background: var(--surface-sunken); color: var(--text-strong);\n  font-family: var(--font-sans); font-size: var(--fs-body-sm); font-weight: var(--fw-medium);\n}\n.field:focus-visible { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }\n.field--area { min-height: 112px; padding: var(--sp-3) var(--sp-4); resize: vertical; line-height: var(--lh-body); }\n.field.is-good { border-color: var(--ok-line); background: var(--ok-bg); }\n\n.field-label {\n  display: block; margin-bottom: var(--sp-2);\n  font-size: var(--fs-label); font-weight: var(--fw-bold);\n  letter-spacing: var(--ls-label); text-transform: uppercase; color: var(--text-muted);\n}\n.field-hint { margin-top: var(--sp-2); font-size: var(--fs-ui-sm); font-weight: var(--fw-medium); color: var(--text-muted); }\n\n\n/* ─── components/cards.css ─── */\n/* ============================================================\n   CARTES ET BANDEAUX\n   Blanc, filet 1 px, rayon 18 px, ombre presque nulle.\n   Le filet gauche de 4 px est le SEUL usage décoratif autorisé de\n   la couleur de section sur une carte.\n   ============================================================ */\n.card {\n  background: var(--surface-card);\n  border: 1px solid var(--border); border-radius: var(--r-lg);\n  box-shadow: var(--sh-card);\n  padding: var(--sp-5) var(--sp-6);\n}\n.card--flush  { padding: 0; overflow: hidden; }\n.card--marked { border-left: 4px solid var(--sec, var(--accent)); }\n.card--tinted { background: var(--surface-band); border-color: var(--border-tint); }\n\n.card__band {\n  background: var(--sec, var(--accent)); color: var(--white);\n  padding: var(--sp-3) var(--sp-6);\n  font-size: var(--fs-meta); font-weight: var(--fw-black);\n  letter-spacing: .14em; text-transform: uppercase;\n}\n.card__row {\n  padding: var(--sp-4) var(--sp-6);\n  border-bottom: 1px solid var(--paper-200);\n}\n.card__row:last-child { border-bottom: none; }\n.card__foot {\n  display: flex; flex-wrap: wrap; gap: var(--sp-3);\n  padding: var(--sp-5) var(--sp-6); background: var(--surface-sunken);\n}\n\n/* Encadré de savoir (grammaire, sons) : bandeau coloré + rangées. */\n.savoir { background: var(--surface-card); border: 1px solid var(--border); border-radius: var(--r-lg); overflow: hidden; box-shadow: var(--sh-card); }\n.savoir__row {\n  display: grid; grid-template-columns: minmax(160px, 220px) minmax(0, 1fr);\n  gap: var(--sp-5); align-items: baseline;\n  padding: var(--sp-4) var(--sp-6); border-bottom: 1px solid var(--paper-200);\n}\n.savoir__row:last-child { border-bottom: none; }\n.savoir__key { font-size: var(--fs-lead); font-weight: var(--fw-black); color: var(--text-strong); }\n.savoir__val { font-size: var(--fs-body-sm); font-weight: var(--fw-medium); line-height: var(--lh-loose); color: var(--text-body); }\n@media (max-width: 640px) { .savoir__row { grid-template-columns: 1fr; gap: var(--sp-1); } }\n\n/* Réplique de dialogue / transcription. */\n.dialogue__line {\n  display: grid; grid-template-columns: 88px minmax(0, 1fr);\n  gap: var(--sp-4); align-items: baseline;\n  padding: var(--sp-4) 0; border-bottom: 1px solid var(--border);\n}\n.dialogue__who { font-size: var(--fs-label); font-weight: var(--fw-black); letter-spacing: .06em; color: var(--accent); }\n.dialogue__txt { font-size: var(--fs-body-sm); font-weight: var(--fw-medium); line-height: 1.55; color: var(--text-body); }\n\n\n/* ─── components/exercises.css ─── */\n/* ============================================================\n   EXERCICES · choix, jetons, zones de dépôt\n   Règle d'or : SÉLECTIONNÉ = plaque encre. Pas de bleu, pas de\n   teinte supplémentaire — la couleur reste disponible pour dire\n   « juste » ou « à revoir ».\n   ============================================================ */\n\n/* — Choix binaire (vrai/faux, [e]/[ɛ]) — */\n.choice {\n  min-width: 82px; min-height: 46px; padding: 0 var(--sp-4);\n  border: 1px solid var(--border); border-radius: var(--r-sm);\n  background: var(--surface-card); color: var(--text-body);\n  font-family: var(--font-sans); font-size: var(--fs-ui); font-weight: var(--fw-bold);\n  cursor: pointer;\n  transition: background var(--dur) var(--ease), color var(--dur) var(--ease),\n              border-color var(--dur) var(--ease);\n}\n.choice:hover { background: var(--paper-100); }\n.choice.is-selected { background: var(--sel-bg); border-color: var(--sel-line); color: var(--sel-ink); }\n.choice.is-ok       { background: var(--ok-bg); border-color: var(--ok-line); color: var(--ok-ink); }\n.choice.is-no       { background: var(--no-bg); border-color: var(--no-line); color: var(--no-ink); }\n/* bonne réponse non choisie : filet pointillé, sans aplat */\n.choice.is-answer   { background: var(--surface-card); border: 1px dashed var(--ok-line); color: var(--ok-line); }\n\n.exo-row {\n  display: grid; grid-template-columns: minmax(0, 1fr) auto;\n  gap: var(--sp-5); align-items: center;\n  padding: var(--sp-4) var(--sp-6); border-bottom: 1px solid var(--paper-200);\n}\n.exo-row:last-of-type { border-bottom: none; }\n.exo-row__txt  { font-size: var(--fs-body); font-weight: var(--fw-semi); line-height: 1.45; }\n.exo-row__opts { display: flex; gap: var(--sp-2); }\n@media (max-width: 560px) { .exo-row { grid-template-columns: 1fr; gap: var(--sp-3); } }\n\n/* — Jeton d'association (mot ↔ définition) —\n   Clic-clic plutôt que glisser : atteignable au clavier.\n   Sur chaque jeton : role=\"button\" tabindex=\"0\" + gestion de\n   Entrée/Espace. Les paires justes se verrouillent (aria-disabled). */\n.chip {\n  text-align: left; width: 100%;\n  min-height: var(--tap-comfort); padding: var(--sp-3) var(--sp-4);\n  border: 1px solid var(--border); border-radius: var(--r-md);\n  background: var(--surface-card); color: var(--text-strong);\n  font-family: var(--font-sans); font-size: var(--fs-body-sm); font-weight: var(--fw-medium);\n  line-height: 1.45; cursor: pointer;\n  transition: background var(--dur) var(--ease), border-color var(--dur) var(--ease), color var(--dur) var(--ease);\n}\n.chip--word   { font-size: var(--fs-body-sm); font-weight: var(--fw-bold); }\n.chip:hover   { background: var(--paper-100); }\n.chip.is-active { background: var(--sel-bg); border-color: var(--sel-line); color: var(--sel-ink); }\n.chip.is-paired { background: var(--ok-bg); border-color: var(--ok-line); color: var(--ok-ink); cursor: default; }\n.chip.is-paired::before { content: \"✓ \"; font-weight: var(--fw-black); }\n.chip.is-miss   { background: var(--no-bg); border-color: var(--no-line); color: var(--no-ink); }\n\n.pair-grid { display: grid; grid-template-columns: minmax(220px, 300px) minmax(0, 1fr); gap: var(--sp-4); align-items: start; }\n@media (max-width: 720px) { .pair-grid { grid-template-columns: 1fr; } }\n\n/* — Zone de dépôt / texte à trous — */\n.drop {\n  display: flex; align-items: center; justify-content: center;\n  min-height: 54px; padding: var(--sp-3) var(--sp-4);\n  border: 2px dashed var(--drop-line); border-radius: var(--r-sm);\n  background: var(--drop-bg); color: var(--text-muted);\n  font-weight: var(--fw-bold); text-align: center; cursor: pointer;\n  transition: background var(--dur) var(--ease), border-color var(--dur) var(--ease);\n}\n.drop.is-filled { border-style: solid; border-color: var(--sel-line); background: var(--sel-bg); color: var(--sel-ink); }\n.drop.is-over   { border-style: solid; border-color: var(--accent); background: var(--accent-soft); }\n.drop.is-ok     { border-style: solid; border-color: var(--ok-line); background: var(--ok-bg); color: var(--ok-ink); }\n.drop.is-no     { border-style: solid; border-color: var(--no-line); background: var(--no-bg); color: var(--no-ink); }\n\n.blank {\n  display: inline-block; min-width: 130px; margin: 0 3px; padding: 4px var(--sp-3);\n  border: 2px dashed var(--drop-line); border-radius: 8px;\n  background: var(--drop-bg); color: var(--text-muted);\n  font-size: var(--fs-lead); font-weight: var(--fw-bold); text-align: center;\n  vertical-align: middle; cursor: pointer;\n}\n.blank.is-filled { border-style: solid; border-color: var(--sel-line); background: var(--sel-bg); color: var(--sel-ink); }\n.blank.is-ok     { border-style: solid; border-color: var(--ok-line); background: var(--ok-bg); color: var(--ok-ink); }\n.blank.is-no     { border-style: solid; border-color: var(--no-line); background: var(--no-bg); color: var(--no-ink); }\n\n/* Phrase à compléter : les tirets de la consigne restent lisibles. */\n.gap-sentence { font-size: var(--fs-lead); font-weight: var(--fw-bold); line-height: var(--lh-loose); letter-spacing: .01em; }\n\n\n/* ─── components/feedback.css ─── */\n/* ============================================================\n   RÉTROACTION\n   Jamais la couleur seule : chaque état porte un glyphe (✓ / ✕ / !).\n   Conteneurs annoncés aux lecteurs d'écran (aria-live=\"polite\").\n   L'erreur n'a pas d'aplat saturé.\n   ============================================================ */\n.fb { font-size: var(--fs-ui-sm); font-weight: var(--fw-bold); line-height: var(--lh-body); }\n.fb--ok   { color: var(--ok-ink); }\n.fb--no   { color: var(--no-ink); }\n.fb--warn { color: var(--warn-ink); }\n.fb--ok::before   { content: \"✓ \"; font-weight: var(--fw-black); }\n.fb--no::before   { content: \"✕ \"; font-weight: var(--fw-black); }\n.fb--warn::before { content: \"! \"; font-weight: var(--fw-black); }\n\n/* Bloc de rétroaction détaillée (correction d'un écrit). */\n.fb-box {\n  border: 1px solid var(--ok-line); border-radius: var(--r-sm);\n  background: var(--ok-bg); color: var(--ok-ink);\n  padding: var(--sp-4); display: flex; flex-direction: column; gap: var(--sp-2);\n}\n.fb-box--no   { border-color: var(--no-line);   background: var(--no-bg);   color: var(--no-ink); }\n.fb-box--warn { border-color: var(--warn-line); background: var(--warn-bg); color: var(--warn-ink); }\n.fb-box__title { font-size: var(--fs-meta); font-weight: var(--fw-black); letter-spacing: .06em; text-transform: uppercase; }\n.fb-box__item  { font-size: var(--fs-ui-sm); font-weight: var(--fw-semi); padding-left: var(--sp-3); position: relative; }\n.fb-box__item::before { content: \"•\"; position: absolute; left: 2px; }\n\n/* Score / progression. */\n.score {\n  display: inline-flex; align-items: center;\n  padding: 6px var(--sp-3); border-radius: var(--r-pill);\n  background: var(--sec-soft, var(--accent-soft)); color: var(--sec, var(--accent-ink));\n  font-size: var(--fs-ui-sm); font-weight: var(--fw-bold); white-space: nowrap;\n}\n\n/* Bannière d'aide contextuelle (« un mot est choisi, placez-le »). */\n.banner {\n  display: flex; align-items: center; gap: var(--sp-3);\n  padding: var(--sp-3) var(--gutter);\n  background: var(--warn-bg); border-bottom: 2px solid var(--warn-line);\n  color: var(--warn-ink); font-size: var(--fs-body-sm); font-weight: var(--fw-bold);\n}\n\n<\u002Fstyle>\n<style>/* cyrillic-ext */\n@font-face {\n  font-family: 'Nunito';\n  font-style: italic;\n  font-weight: 600;\n  font-display: swap;\n  src: url(\"9851589a-c4b1-45b4-bfcd-5cf52ad8712f\") format('woff2');\n  unicode-range: U+0460-052F, U+1C80-1C8A, U+20B4, U+2DE0-2DFF, U+A640-A69F, U+FE2E-FE2F;\n}\n/* cyrillic */\n@font-face {\n  font-family: 'N font-weight: 700;\n  font-display: swap;\n  src: url(\"879fcbdb-ef26-4d1a-93a6-28ee3c28f72c\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n/* cyrillic-ext */\n@font-face {\n  font-family: 'Nunito';\n  font-style: normal;\n  font-weight: 800;\n  font-display: swap;\n  src: url(\"339b5d31-7aa6-4418-9616-819424edd0e3\") format('woff2');\n  unicode-range: U+0460-052F, U+1C80-1C8A, U+20B4, U+2DE0-2DFF, U+A640-A69F, U+FE2E-FE2F;\n}\n/* cyrillic */\n@font-face {\n  font-family: 'Nunito';\n  font-style: normal;\n  font-weight: 800;\n  font-display: swap;\n  src: url(\"76f0e3f2-16af-4684-9792-c7e6f0a25781\") format('woff2');\n  unicode-range: U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116;\n}\n/* vietnamese */\n@font-face {\n  font-family: 'Nunito';\n  font-style: normal;\n  font-weight: 800;\n  font-display: swap;\n  src: url(\"b388e81b-e9b9-43b2-ba6e-62de74929d03\") format('woff2');\n  unicode-range: U+0102-0103, U+0110-0111, U+0128-0129, U+0168-0169, U+01A0-01A1, U+01AF-01B0, U+0300-0301, U+0303-0304, U+0308-0309, U+0323, U+0329, U+1EA0-1EF9, U+20AB;\n}\n/* latin-ext */\n@font-face {\n  font-family: 'Nunito';\n  font-style: normal;\n  font-weight: 800;\n  font-display: swap;\n  src: url(\"801b297f-e277-4a54-9e2e-7bf3bf37b85a\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Nunito';\n  font-style: normal;\n  font-weight: 800;\n  font-display: swap;\n  src: url(\"879fcbdb-ef26-4d1a-93a6-28ee3c28f72c\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n/* cyrillic-ext */\n@font-face {\n  font-family: 'Nunito';\n  font-style: normal;\n  font-weight: 900;\n  font-display: swap;\n  src: url(\"339b5d31-7aa6-4418-9616-819424edd0e3\") format('woff2');\n  unicode-range: U+0460-052F, U+1C80-1C8A, U+20B4, U+2DE0-2DFF, U+A640-A69F, U+FE2E-FE2F;\n}\n/* cyrillic */\n@font-face {\n  font-family: 'Nunito';\n  font-style: normal;\n  font-weight: 900;\n  font-display: swap;\n  src: url(\"76f0e3f2-16af-4684-9792-c7e6f0a25781\") format('woff2');\n  unicode-range: U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116;\n}\n/* vietnamese */\n@font-face {\n  font-family: 'Nunito';\n  font-style: normal;\n  font-weight: 900;\n  font-display: swap;\n  src: url(\"b388e81b-e9b9-43b2-ba6e-62de74929d03\") format('woff2');\n  unicode-range: U+0102-0103, U+0110-0111, U+0128-0129, U+0168-0169, U+01A0-01A1, U+01AF-01B0, U+0300-0301, U+0303-0304, U+0308-0309, U+0323, U+0329, U+1EA0-1EF9, U+20AB;\n}\n/* latin-ext */\n@font-face {\n  font-family: 'Nunito';\n  font-style: normal;\n  font-weight: 900;\n  font-display: swap;\n  src: url(\"801b297f-e277-4a54-9e2e-7bf3bf37b85a\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Nunito';\n  font-style: normal;\n  font-weight: 900;\n  font-display: swap;\n  src: url(\"879fcbdb-ef26-4d1a-93a6-28ee3c28f72c\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n\n\n/* ─── styles.css ─── */\n/* ============================================================\n   FRANCISATION · point d'entrée CSS unique\n   Liez CE fichier seulement. Rien d'autre que des @import ici.\n   ============================================================ */\n\n/* ─── tokens/fonts.css ─── */\n/* ============================================================\n   FRANCISATION · POLICE\n   Nunito partout. Formes ouvertes, « a » et « g » à un étage :\n   c'est le critère de choix — lisibilité pour des adultes qui\n   apprennent à lire en français.\n   Graisses réellement utilisées : 400 · 600 · 700 · 800 · 900.\n   ============================================================ */\n\n\n:root {\n  --font-sans: \"Nunito\", system-ui, -apple-system, \"Segoe UI\", sans-serif;\n}\n\n\n/* ─── tokens/colors.css ─── */\n/* ============================================================\n   FRANCISATION · COULEURS\n   Fond neutre chaud, cartes blanches, une seule couleur d'accent\n   (vert). Les couleurs de section servent AU REPÉRAGE, jamais à\n   décorer. Le rouge est réservé à l'audio et à l'erreur.\n   Tout ratio annoncé est mesuré sur son fond documenté.\n   ============================================================ */\n:root {\n  /* — Neutres (chauds) — */\n  --paper-50:  #FBFBFA;   /* fond de champ, pied de carte */\n  --paper-100: #F7F7F5;   /* FOND DE PAGE */\n  --paper-200: #F0F0EE;   /* filet intérieur de liste */\n  --white:     #FFFFFF;   /* cartes */\n\n  --line-100:  #EAEAE8;   /* filet neutre */\n  --line-200:  #D8E8DF;   /* filet teinté vert (bandeaux clairs) */\n  --line-300:  #D6D6D2;   /* contour de zone de dépôt vide */\n\n  --ink-900:   #17181A;   /* encre principale */\n  --ink-700:   #3A3D40;   /* texte long, transcriptions */\n  --ink-500:   #4B4F52;   /* chapeau sur fond clair */\n  --ink-400:   #6E7175;   /* texte secondaire — 4.6:1 sur blanc ✔ AA */\n\n  /* — Accent principal : vert — */\n  --green-800: #07734A;   /* texte vert sur fond clair — 5.4:1 ✔ */\n  --green-600: #0A8F5B;   /* ACCENT · filets, focus, pastilles */\n  --green-100: #E6F5EE;   /* fond d'accent, état réussi */\n  --green-050: #EDF6F1;   /* bandeau clair pleine largeur */\n\n  /* — Accents de section (repérage seulement) —\n     Un seul par section : pastille numérotée, sur-titre, filet\n     gauche de 4 px, point de la barre de parcours. Jamais en aplat\n     derrière du texte long. */\n  --acier-600:  #1D6B8F;  --acier-100:  #E7F0F6;   /* compréhension orale */\n  --violet-600: #6B4FBB;  --violet-100: #EFEAFA;   /* graphie-phonie */\n  --ambre-700:  #B45309;  --ambre-100:  #FBEEDC;   /* écriture */\n  --teal-700:   #0D7A6F;  --teal-100:   #DCF2EF;   /* écoute et réponds */\n  --foret-700:  #166534;  --foret-100:  #E3F1E7;   /* vocabulaire / bilan */\n\n  /* — Audio : le seul aplat rouge de l'interface — */\n  --audio:       #DC2626;\n  --audio-hover: #B91C1C;\n\n  /* — Rétroaction : 4 états × 3 rôles —\n     L'erreur n'a PAS d'aplat saturé : fond à peine teinté, filet et\n     texte rouges. Ainsi le seul rouge plein reste le bouton audio. */\n  --ok-bg:   #E6F5EE;  --ok-line:   #0A8F5B;  --ok-ink:   #07734A;\n  --no-bg:   #FFF6F5;  --no-line:   #DC2626;  --no-ink:   #B91C1C;\n  --warn-bg: #FEF6E7;  --warn-line: #D9880B;  --warn-ink: #8A5206;\n\n  /* — Sélection = plaque encre (jamais une teinte de plus) — */\n  --sel-bg:  #17181A;  --sel-line: #17181A;  --sel-ink: #FFFFFF;\n\n  /* — Zone de dépôt vide : neutre, pas bleue — */\n  --drop-bg: #FBFBFA;  --drop-line: #D6D6D2;\n\n  /* ==========================================================\n     ALIAS SÉMANTIQUES — c'est ce que les composants référencent\n     ========================================================== */\n  --surface-page:    var(--paper-100);\n  --surface-card:    var(--white);\n  --surface-sunken:  var(--paper-50);\n  --surface-band:    var(--green-050);   /* bandeau d'en-tête clair */\n  --surface-inverse: var(--ink-900);     /* réservé à 1 bloc par page */\n\n  --text-strong:  var(--ink-900);\n  --text-body:    var(--ink-700);\n  --text-muted:   var(--ink-400);\n  --text-inverse: var(--white);\n  --text-accent:  var(--green-800);\n\n  --border:       var(--line-100);\n  --border-tint:  var(--line-200);\n  --accent:       var(--green-600);\n  --accent-soft:  var(--green-100);\n  --accent-ink:   var(--green-800);\n\n  --focus-ring:   var(--green-600);\n  --link:         var(--green-600);\n  --link-hover:   var(--green-800);\n}\n\n\n/* ─── tokens/typography.css ─── */\n/* ============================================================\n   FRANCISATION · TYPOGRAPHIE\n   Quatre niveaux, écarts francs : 62 · 30 · 19 · 17.\n   Corps de texte JAMAIS sous 17 px — public en apprentissage.\n   Le sur-titre (13 px, 800, majuscules, interlettrage .12em) est\n   le seul endroit où les majuscules sont permises.\n   ============================================================ */\n:root {\n  --fs-hero:   clamp(40px, 6vw, 62px);  /* titre de page  · 900 */\n  --fs-h2:     30px;                    /* titre d'exercice · 900 */\n  --fs-h3:     24px;                    /* mot vedette, sous-bloc · 900 */\n  --fs-lead:   19px;                    /* chapeau, énoncé long · 600-700 */\n  --fs-body:   18px;                    /* énoncé courant · 600-700 */\n  --fs-body-sm:17px;                    /* consigne, définition · 600 */\n  --fs-ui:     15px;                    /* libellé de bouton · 700-800 */\n  --fs-ui-sm:  14px;                    /* bouton secondaire, score · 700-800 */\n  --fs-label:  13px;                    /* SUR-TITRE majuscules · 800 */\n  --fs-meta:   12px;                    /* méta, compteur · 800 */\n\n  --lh-hero:  1.02;\n  --lh-title: 1.2;\n  --lh-body:  1.5;\n  --lh-loose: 1.6;\n\n  --ls-hero:  -0.02em;\n  --ls-title: -0.015em;\n  --ls-label: 0.12em;   /* sur-titres en majuscules */\n\n  --fw-regular: 400;\n  --fw-medium:  600;\n  --fw-semi:    700;\n  --fw-bold:    800;\n  --fw-black:   900;\n}\n\n\n/* ─── tokens/spacing.css ─── */\n/* ============================================================\n   FRANCISATION · ESPACEMENT ET RAYONS\n   Une seule échelle, 6 crans utiles + 2 pour les sections.\n   N'inventez pas de valeur intermédiaire.\n   ============================================================ */\n:root {\n  --sp-1:  4px;\n  --sp-2:  8px;\n  --sp-3:  12px;\n  --sp-4:  16px;\n  --sp-5:  20px;\n  --sp-6:  24px;\n  --sp-8:  32px;   /* gouttière de page */\n  --sp-12: 48px;   /* écart entre deux exercices */\n\n  --r-sm:   10px;  /* contrôles, champs, tuiles */\n  --r-md:   14px;  /* jetons, pastille numérotée */\n  --r-lg:   18px;  /* cartes, cadres, bandeaux */\n  --r-pill: 999px; /* boutons, étiquettes, scores */\n\n  --content-max: 1000px;\n  --gutter:      var(--sp-8);\n\n  /* Cibles tactiles — plancher absolu 44 px (adultes, écrans tactiles) */\n  --tap-min:     44px;\n  --tap-comfort: 48px;\n  --tap-large:   52px;\n}\n\n\n/* ─── tokens/effects.css ─── */\n/* ============================================================\n   FRANCISATION · OMBRES, MOUVEMENT, FOCUS\n   Ombres presque invisibles : la structure vient des filets et de\n   l'alignement, pas de la profondeur. Aucun rebond, aucune\n   parallaxe — le mouvement ne doit jamais distraire d'une consigne.\n   ============================================================ */\n:root {\n  --sh-card:  0 1px 2px rgba(20, 20, 20, .04);\n  --sh-raise: 0 4px 20px rgba(20, 20, 20, .06);\n  --sh-modal: 0 24px 64px rgba(20, 20, 20, .28);\n\n  --dur-fast: 120ms;\n  --dur:      140ms;\n  --ease:     cubic-bezier(.2, .7, .3, 1);\n\n  --focus-width:  3px;\n  --focus-offset: 2px;\n}\n\n@media (prefers-reduced-motion: reduce) {\n  :root { --dur-fast: 0ms; --dur: 0ms; }\n}\n\n\n/* ─── tokens/base.css ─── */\n/* ============================================================\n   FRANCISATION · SOCLE\n   Réinitialisation minimale + règles non négociables\n   d'accessibilité. À charger après les jetons.\n   ============================================================ */\n*, *::before, *::after { box-sizing: border-box; }\n\nhtml { -webkit-text-size-adjust: 100%; }\n\nbody {\n  margin: 0;\n  background: var(--surface-page);\n  color: var(--text-strong);\n  font-family: var(--font-sans);\n  font-size: var(--fs-body);\n  font-weight: var(--fw-medium);\n  line-height: var(--lh-body);\n  -webkit-font-smoothing: antialiased;\n  text-wrap: pretty;\n}\n\nh1, h2, h3 { margin: 0; letter-spacing: var(--ls-title); line-height: var(--lh-title); }\nh1 { font-size: var(--fs-hero); font-weight: var(--fw-black); line-height: var(--lh-hero); letter-spacing: var(--ls-hero); }\nh2 { font-size: var(--fs-h2);   font-weight: var(--fw-black); }\nh3 { font-size: var(--fs-h3);   font-weight: var(--fw-black); }\np  { margin: 0; }\n\na { color: var(--link); text-decoration: underline; text-underline-offset: 3px; }\na:hover { color: var(--link-hover); }\n\n/* Focus clavier visible PARTOUT. Ne jamais retirer sans remplacer. */\n:focus-visible {\n  outline: var(--focus-width) solid var(--focus-ring);\n  outline-offset: var(--focus-offset);\n  border-radius: var(--r-sm);\n}\n\n/* Le zoom doit rester possible : jamais user-scalable=no dans le viewport. */\n\n::placeholder { color: var(--text-muted); opacity: 1; }  /* 4.6:1 ✔ AA */\n\n::-webkit-scrollbar { width: 6px; height: 6px; }\n::-webkit-scrollbar-thumb { background: rgba(0,0,0,.15); border-radius: 3px; }\n\n.u-visually-hidden {\n  position: absolute; width: 1px; height: 1px; overflow: hidden;\n  clip: rect(0 0 0 0); white-space: nowrap;\n}\n\n\n\n/* ─── components/layout.css ─── */\n/* ============================================================\n   MISE EN PAGE · bandeau, barre de parcours, en-tête d'exercice\n   La hiérarchie de la page tient à quatre niveaux :\n   1 bandeau clair  ·  2 barre de parcours  ·  3 en-tête d'exercice\n   ·  4 contenu en cartes blanches.\n   ============================================================ */\n.page      { background: var(--surface-page); color: var(--text-strong); }\n.container { max-width: var(--content-max); margin: 0 auto; padding: 0 var(--gutter); }\n\n/* — 1 · Bandeau d'en-tête (clair, pas noir) — */\n.band {\n  background: var(--surface-band);\n  border-bottom: 1px solid var(--border-tint);\n  padding: var(--sp-8) 0 var(--sp-12);\n}\n.band__eyebrow {\n  display: flex; align-items: center; gap: var(--sp-2);\n  font-size: var(--fs-label); font-weight: var(--fw-bold);\n  letter-spacing: var(--ls-label); text-transform: uppercase;\n  color: var(--text-accent);\n}\n.band__eyebrow::before {\n  content: \"\"; width: 8px; height: 8px; border-radius: 50%;\n  background: var(--accent); flex-shrink: 0;\n}\n.band__lead {\n  max-width: 56ch; margin-top: var(--sp-4);\n  font-size: var(--fs-lead); font-weight: var(--fw-medium);\n  color: var(--ink-500);\n}\n\n/* — 2 · Barre de parcours (collante) — */\n.steps {\n  position: sticky; top: 0; z-index: 5;\n  background: rgba(247, 247, 245, .94);\n  backdrop-filter: blur(8px);\n  border-bottom: 1px solid var(--border);\n}\n.steps__inner {\n  max-width: var(--content-max); margin: 0 auto;\n  padding: var(--sp-3) var(--gutter);\n  display: flex; flex-wrap: wrap; gap: var(--sp-2); align-items: center;\n}\n.step {\n  display: inline-flex; align-items: center; gap: var(--sp-2);\n  min-height: var(--tap-min); padding: 0 var(--sp-4);\n  border: 1px solid var(--border); border-radius: var(--r-pill);\n  background: var(--surface-card); color: var(--text-body);\n  font-size: var(--fs-ui-sm); font-weight: var(--fw-bold);\n  text-decoration: none; white-space: nowrap;\n  transition: background var(--dur) var(--ease), border-color var(--dur) var(--ease);\n}\n.step__dot { width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0; background: currentColor; }\n.step:hover { background: var(--paper-50); }\n/* fait : la teinte de section apparaît — poser aussi --sec et --sec-soft */\n.step.is-done {\n  background: var(--sec-soft); border-color: var(--sec); color: var(--sec);\n}\n\n/* — 3 · En-tête d'exercice —\n   Porte la couleur de section via --sec / --sec-soft, posés sur .exo. */\n.exo { --sec: var(--accent); --sec-soft: var(--accent-soft); scroll-margin-top: 80px; }\n.exo--orale   { --sec: var(--acier-600);  --sec-soft: var(--acier-100); }\n.exo--phonie  { --sec: var(--violet-600); --sec-soft: var(--violet-100); }\n.exo--ecriture{ --sec: var(--ambre-700);  --sec-soft: var(--ambre-100); }\n.exo--ecoute  { --sec: var(--teal-700);   --sec-soft: var(--teal-100); }\n.exo--vocab   { --sec: var(--green-600);  --sec-soft: var(--green-100); }\n\n.exo__head { display: flex; align-items: center; gap: var(--sp-4); margin-bottom: var(--sp-1); }\n.exo__num {\n  flex-shrink: 0; width: 44px; height: 44px; border-radius: var(--r-md);\n  display: flex; align-items: center; justify-content: center;\n  background: var(--sec-soft); color: var(--sec);\n  font-size: 19px; font-weight: var(--fw-black);\n}\n.exo__eyebrow {\n  font-size: var(--fs-label); font-weight: var(--fw-black);\n  letter-spacing: var(--ls-label); text-transform: uppercase; color: var(--sec);\n}\n.exo__rule  { flex: 1; height: 1px; background: var(--border); }\n.exo__score {\n  background: var(--sec-soft); color: var(--sec);\n  padding: 6px var(--sp-3); border-radius: var(--r-pill);\n  font-size: var(--fs-ui-sm); font-weight: var(--fw-bold); white-space: nowrap;\n}\n.exo__title { font-size: var(--fs-h2); font-weight: var(--fw-black); margin: 0 0 var(--sp-1); }\n.exo__sub   { font-size: var(--fs-body-sm); font-weight: var(--fw-medium); color: var(--text-muted); margin: 0 0 var(--sp-5); }\n\n.stack   { display: flex; flex-direction: column; gap: var(--sp-3); }\n.stack-l { display: flex; flex-direction: column; gap: var(--sp-12); }\n.grid-auto { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: var(--sp-3); }\n\n\n/* ─── components/buttons.css ─── */\n/* ============================================================\n   BOUTONS\n   Toujours en pilule. Trois rôles seulement :\n   .btn--pri (encre) · .btn--ghost (blanc) · .btn--audio (rouge).\n   Le rouge est RÉSERVÉ à l'audio. Hauteur plancher 44 px.\n   ============================================================ */\n.btn {\n  display: inline-flex; align-items: center; justify-content: center; gap: var(--sp-2);\n  min-height: var(--tap-comfort); padding: 0 var(--sp-5);\n  border: 1px solid transparent; border-radius: var(--r-pill);\n  font-family: var(--font-sans); font-size: var(--fs-ui); font-weight: var(--fw-bold);\n  line-height: 1; white-space: nowrap; flex-shrink: 0; cursor: pointer;\n  transition: background var(--dur) var(--ease), color var(--dur) var(--ease),\n              border-color var(--dur) var(--ease);\n}\n.btn:disabled { opacity: .5; cursor: not-allowed; }\n\n.btn--pri   { background: var(--ink-900); color: var(--white); }\n.btn--pri:hover { background: var(--accent); }\n\n.btn--ghost { background: var(--surface-card); color: var(--text-strong); border-color: var(--border); }\n.btn--ghost:hover { background: var(--paper-100); }\n\n/* Le seul aplat rouge de l'interface. */\n.btn--audio { background: var(--audio); color: var(--white); }\n.btn--audio:hover { background: var(--audio-hover); }\n\n.btn--sm { min-height: var(--tap-min); padding: 0 var(--sp-4); font-size: var(--fs-ui-sm); font-weight: var(--fw-semi); }\n.btn--lg { min-height: var(--tap-large); padding: 0 var(--sp-6); font-size: 16px; }\n\n/* Bouton d'écoute rond — icône seule, jamais sous 44 px. */\n.btn-audio-round {\n  flex-shrink: 0; width: var(--tap-min); height: var(--tap-min);\n  display: inline-flex; align-items: center; justify-content: center;\n  border: none; border-radius: 50%;\n  background: var(--audio); color: var(--white); cursor: pointer;\n  transition: background var(--dur) var(--ease);\n}\n.btn-audio-round:hover { background: var(--audio-hover); }\n.btn-audio-round svg { width: 18px; height: 18px; }\n\n.btn .icon, .btn svg { width: 17px; height: 17px; flex-shrink: 0; }\n\n\n/* ─── components/forms.css ─── */\n/* ============================================================\n   CHAMPS\n   Fond légèrement creusé, filet neutre, focus vert.\n   Corps de saisie à 17 px minimum : la réponse doit être relisible.\n   ============================================================ */\n.field {\n  width: 100%; min-height: var(--tap-comfort); padding: 0 var(--sp-4);\n  border: 1px solid var(--border); border-radius: var(--r-sm);\n  background: var(--surface-sunken); color: var(--text-strong);\n  font-family: var(--font-sans); font-size: var(--fs-body-sm); font-weight: var(--fw-medium);\n}\n.field:focus-visible { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }\n.field--area { min-height: 112px; padding: var(--sp-3) var(--sp-4); resize: vertical; line-height: var(--lh-body); }\n.field.is-good { border-color: var(--ok-line); background: var(--ok-bg); }\n\n.field-label {\n  display: block; margin-bottom: var(--sp-2);\n  font-size: var(--fs-label); font-weight: var(--fw-bold);\n  letter-spacing: var(--ls-label); text-transform: uppercase; color: var(--text-muted);\n}\n.field-hint { margin-top: var(--sp-2); font-size: var(--fs-ui-sm); font-weight: var(--fw-medium); color: var(--text-muted); }\n\n\n/* ─── components/cards.css ─── */\n/* ============================================================\n   CARTES ET BANDEAUX\n   Blanc, filet 1 px, rayon 18 px, ombre presque nulle.\n   Le filet gauche de 4 px est le SEUL usage décoratif autorisé de\n   la couleur de section sur une carte.\n   ============================================================ */\n.card {\n  background: var(--surface-card);\n  border: 1px solid var(--border); border-radius: var(--r-lg);\n  box-shadow: var(--sh-card);\n  padding: var(--sp-5) var(--sp-6);\n}\n.card--flush  { padding: 0; overflow: hidden; }\n.card--marked { border-left: 4px solid var(--sec, var(--accent)); }\n.card--tinted { background: var(--surface-band); border-color: var(--border-tint); }\n\n.card__band {\n  background: var(--sec, var(--accent)); color: var(--white);\n  padding: var(--sp-3) var(--sp-6);\n  font-size: var(--fs-meta); font-weight: var(--fw-black);\n  letter-spacing: .14em; text-transform: uppercase;\n}\n.card__row {\n  padding: var(--sp-4) var(--sp-6);\n  border-bottom: 1px solid var(--paper-200);\n}\n.card__row:last-child { border-bottom: none; }\n.card__foot {\n  display: flex; flex-wrap: wrap; gap: var(--sp-3);\n  padding: var(--sp-5) var(--sp-6); background: var(--surface-sunken);\n}\n\n/* Encadré de savoir (grammaire, sons) : bandeau coloré + rangées. */\n.savoir { background: var(--surface-card); border: 1px solid var(--border); border-radius: var(--r-lg); overflow: hidden; box-shadow: var(--sh-card); }\n.savoir__row {\n  display: grid; grid-template-columns: minmax(160px, 220px) minmax(0, 1fr);\n  gap: var(--sp-5); align-items: baseline;\n  padding: var(--sp-4) var(--sp-6); border-bottom: 1px solid var(--paper-200);\n}\n.savoir__row:last-child { border-bottom: none; }\n.savoir__key { font-size: var(--fs-lead); font-weight: var(--fw-black); color: var(--text-strong); }\n.savoir__val { font-size: var(--fs-body-sm); font-weight: var(--fw-medium); line-height: var(--lh-loose); color: var(--text-body); }\n@media (max-width: 640px) { .savoir__row { grid-template-columns: 1fr; gap: var(--sp-1); } }\n\n/* Réplique de dialogue / transcription. */\n.dialogue__line {\n  display: grid; grid-template-columns: 88px minmax(0, 1fr);\n  gap: var(--sp-4); align-items: baseline;\n  padding: var(--sp-4) 0; border-bottom: 1px solid var(--border);\n}\n.dialogue__who { font-size: var(--fs-label); font-weight: var(--fw-black); letter-spacing: .06em; color: var(--accent); }\n.dialogue__txt { font-size: var(--fs-body-sm); font-weight: var(--fw-medium); line-height: 1.55; color: var(--text-body); }\n\n\n/* ─── components/exercises.css ─── */\n/* ============================================================\n   EXERCICES · choix, jetons, zones de dépôt\n   Règle d'or : SÉLECTIONNÉ = plaque encre. Pas de bleu, pas de\n   teinte supplémentaire — la couleur reste disponible pour dire\n   « juste » ou « à revoir ».\n   ============================================================ */\n\n/* — Choix binaire (vrai/faux, [e]/[ɛ]) — */\n.choice {\n  min-width: 82px; min-height: 46px; padding: 0 var(--sp-4);\n  border: 1px solid var(--border); border-radius: var(--r-sm);\n  background: var(--surface-card); color: var(--text-body);\n  font-family: var(--font-sans); font-size: var(--fs-ui); font-weight: var(--fw-bold);\n  cursor: pointer;\n  transition: background var(--dur) var(--ease), color var(--dur) var(--ease),\n              border-color var(--dur) var(--ease);\n}\n.choice:hover { background: var(--paper-100); }\n.choice.is-selected { background: var(--sel-bg); border-color: var(--sel-line); color: var(--sel-ink); }\n.choice.is-ok       { background: var(--ok-bg); border-color: var(--ok-line); color: var(--ok-ink); }\n.choice.is-no       { background: var(--no-bg); border-color: var(--no-line); color: var(--no-ink); }\n/* bonne réponse non choisie : filet pointillé, sans aplat */\n.choice.is-answer   { background: var(--surface-card); border: 1px dashed var(--ok-line); color: var(--ok-line); }\n\n.exo-row {\n  display: grid; grid-template-columns: minmax(0, 1fr) auto;\n  gap: var(--sp-5); align-items: center;\n  padding: var(--sp-4) var(--sp-6); border-bottom: 1px solid var(--paper-200);\n}\n.exo-row:last-of-type { border-bottom: none; }\n.exo-row__txt  { font-size: var(--fs-body); font-weight: var(--fw-semi); line-height: 1.45; }\n.exo-row__opts { display: flex; gap: var(--sp-2); }\n@media (max-width: 560px) { .exo-row { grid-template-columns: 1fr; gap: var(--sp-3); } }\n\n/* — Jeton d'association (mot ↔ définition) —\n   Clic-clic plutôt que glisser : atteignable au clavier.\n   Sur chaque jeton : role=\"button\" tabindex=\"0\" + gestion de\n   Entrée/Espace. Les paires justes se verrouillent (aria-disabled). */\n.chip {\n  text-align: left; width: 100%;\n  min-height: var(--tap-comfort); padding: var(--sp-3) var(--sp-4);\n  border: 1px solid var(--border); border-radius: var(--r-md);\n  background: var(--surface-card); color: var(--text-strong);\n  font-family: var(--font-sans); font-size: var(--fs-body-sm); font-weight: var(--fw-medium);\n  line-height: 1.45; cursor: pointer;\n  transition: background var(--dur) var(--ease), border-color var(--dur) var(--ease), color var(--dur) var(--ease);\n}\n.chip--word   { font-size: var(--fs-body-sm); font-weight: var(--fw-bold); }\n.chip:hover   { background: var(--paper-100); }\n.chip.is-active { background: var(--sel-bg); border-color: var(--sel-line); color: var(--sel-ink); }\n.chip.is-paired { background: var(--ok-bg); border-color: var(--ok-line); color: var(--ok-ink); cursor: default; }\n.chip.is-paired::before { content: \"✓ \"; font-weight: var(--fw-black); }\n.chip.is-miss   { background: var(--no-bg); border-color: var(--no-line); color: var(--no-ink); }\n\n.pair-grid { display: grid; grid-template-columns: minmax(220px, 300px) minmax(0, 1fr); gap: var(--sp-4); align-items: start; }\n@media (max-width: 720px) { .pair-grid { grid-template-columns: 1fr; } }\n\n/* — Zone de dépôt / texte à trous — */\n.drop {\n  display: flex; align-items: center; justify-content: center;\n  min-height: 54px; padding: var(--sp-3) var(--sp-4);\n  border: 2px dashed var(--drop-line); border-radius: var(--r-sm);\n  background: var(--drop-bg); color: var(--text-muted);\n  font-weight: var(--fw-bold); text-align: center; cursor: pointer;\n  transition: background var(--dur) var(--ease), border-color var(--dur) var(--ease);\n}\n.drop.is-filled { border-style: solid; border-color: var(--sel-line); background: var(--sel-bg); color: var(--sel-ink); }\n.drop.is-over   { border-style: solid; border-color: var(--accent); background: var(--accent-soft); }\n.drop.is-ok     { border-style: solid; border-color: var(--ok-line); background: var(--ok-bg); color: var(--ok-ink); }\n.drop.is-no     { border-style: solid; border-color: var(--no-line); background: var(--no-bg); color: var(--no-ink); }\n\n.blank {\n  display: inline-block; min-width: 130px; margin: 0 3px; padding: 4px var(--sp-3);\n  border: 2px dashed var(--drop-line); border-radius: 8px;\n  background: var(--drop-bg); color: var(--text-muted);\n  font-size: var(--fs-lead); font-weight: var(--fw-bold); text-align: center;\n  vertical-align: middle; cursor: pointer;\n}\n.blank.is-filled { border-style: solid; border-color: var(--sel-line); background: var(--sel-bg); color: var(--sel-ink); }\n.blank.is-ok     { border-style: solid; border-color: var(--ok-line); background: var(--ok-bg); color: var(--ok-ink); }\n.blank.is-no     { border-style: solid; border-color: var(--no-line); background: var(--no-bg); color: var(--no-ink); }\n\n/* Phrase à compléter : les tirets de la consigne restent lisibles. */\n.gap-sentence { font-size: var(--fs-lead); font-weight: var(--fw-bold); line-height: var(--lh-loose); letter-spacing: .01em; }\n\n\n/* ─── components/feedback.css ─── */\n/* ============================================================\n   RÉTROACTION\n   Jamais la couleur seule : chaque état porte un glyphe (✓ / ✕ / !).\n   Conteneurs annoncés aux lecteurs d'écran (aria-live=\"polite\").\n   L'erreur n'a pas d'aplat saturé.\n   ============================================================ */\n.fb { font-size: var(--fs-ui-sm); font-weight: var(--fw-bold); line-height: var(--lh-body); }\n.fb--ok   { color: var(--ok-ink); }\n.fb--no   { color: var(--no-ink); }\n.fb--warn { color: var(--warn-ink); }\n.fb--ok::before   { content: \"✓ \"; font-weight: var(--fw-black); }\n.fb--no::before   { content: \"✕ \"; font-weight: var(--fw-black); }\n.fb--warn::before { content: \"! \"; font-weight: var(--fw-black); }\n\n/* Bloc de rétroaction détaillée (correction d'un écrit). */\n.fb-box {\n  border: 1px solid var(--ok-line); border-radius: var(--r-sm);\n  background: var(--ok-bg); color: var(--ok-ink);\n  padding: var(--sp-4); display: flex; flex-direction: column; gap: var(--sp-2);\n}\n.fb-box--no   { border-color: var(--no-line);   background: var(--no-bg);   color: var(--no-ink); }\n.fb-box--warn { border-color: var(--warn-line); background: var(--warn-bg); color: var(--warn-ink); }\n.fb-box__title { font-size: var(--fs-meta); font-weight: var(--fw-black); letter-spacing: .06em; text-transform: uppercase; }\n.fb-box__item  { font-size: var(--fs-ui-sm); font-weight: var(--fw-semi); padding-left: var(--sp-3); position: relative; }\n.fb-box__item::before { content: \"•\"; position: absolute; left: 2px; }\n\n/* Score / progression. */\n.score {\n  display: inline-flex; align-items: center;\n  padding: 6px var(--sp-3); border-radius: var(--r-pill);\n  background: var(--sec-soft, var(--accent-soft)); color: var(--sec, var(--accent-ink));\n  font-size: var(--fs-ui-sm); font-weight: var(--fw-bold); white-space: nowrap;\n}\n\n/* Bannière d'aide contextuelle (« un mot est choisi, placez-le »). */\n.banner {\n  display: flex; align-items: center; gap: var(--sp-3);\n  padding: var(--sp-3) var(--gutter);\n  background: var(--warn-bg); border-bottom: 2px solid var(--warn-line);\n  color: var(--warn-ink); font-size: var(--fs-body-sm); font-weight: var(--fw-bold);\n}\n\n\n<\u002Fstyle>\n<style>\n@keyframes rise{from{opacity:0;transform:translateY(26px)}to{opacity:1;transform:none}}\n@keyframes side{from{opacity:0;transform:translateX(-28px)}to{opacity:1;transform:none}}\n@keyframes pop{from{opacity:0;transform:scale(.9)}to{opacity:1;transform:none}}\n@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}\n@keyframes drop{from{opacity:0;transform:translateY(-18px)}to{opacity:1;transform:none}}\n@media (prefers-reduced-motion:no-preference){\n [data-deck-active] .r{animation:rise .62s cubic-bezier(.2,.8,.2,1) both;animation-delay:var(--d,0s)}\n [data-deck-active] .s{animation:side .62s cubic-bezier(.2,.8,.2,1) both;animation-delay:var(--d,0s)}\n [data-deck-active] .p{animation:pop .55s cubic-bezier(.2,.9,.3,1.2) both;animation-delay:var(--d,0s)}\n [data-deck-active] .d{animation:drop .5s cubic-bezier(.2,.8,.2,1) both;animation-delay:var(--d,0s)}\n [data-deck-active] .g{animation:grow .95s cubic-bezier(.2,.8,.2,1) both;animation-delay:var(--d,0s);transform-origin:left center}\n}\na{color:#0A8F5B}a:hover{color:#07734A}\n<\u002Fstyle>\n<\u002Fhelmet>\n<x-import component-from-global-scope=\"deck-stage\" from=\"a88481c5-aa69-4da1-8344-11252826638c#/deck-stage.js\" width=\"1920\" height=\"1080\" hint-size=\"100%,100%\">\n\n<section data-label=\"Couverture\" data-screen-label=\"01\" data-speaker-notes=\"Ouverture. La barre de parcours reprend celle des modules : l'auditoire voit d'un coup les six temps. Poser le cadre : ce n'est pas une formation sur « l'IA », mais sur un outil précis et sur ce qu'on lui demande dans notre métier.\" style=\"background:#17181A;color:#fff;font-family:Nunito,system-ui,sans-serif;padding:96px 110px 80px;display:flex;flex-direction:column;justify-content:space-between\">\n<div style=\"display:flex;justify-content:space-between;align-items:flex-start\">\n<div class=\"d\" style=\"font-size:24px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:#7FD3AE\">Proposition de formation · Perfectionnement du personnel enseignant<\u002Fdiv>\n<div class=\"d\" style=\"--d:.1s;text-align:right\">\n<div style=\"font-size:34px;font-weight:900;letter-spacing:-.01em\">francıs<\u002Fdiv>\n<div style=\"font-size:24px;font-weight:700;color:#9A9EA2\">Aide à l'apprentissage du français<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"display:flex;flex-direction:column;gap:36px\">\n<h1 class=\"r\" style=\"--d:.12s;margin:0;font-size:152px;font-weight:900;line-height:.92;letter-spacing:-.035em\">Travailler avec Claude<\u002Fh1>\n<p class=\"r\" style=\"--d:.24s;margin:0;font-size:40px;font-weight:600;line-height:1.35;color:#C9CDD0;max-width:1280px\">Comprendre les modèles de langage, choisir le bon outil, et produire du matériel pédagogique qui tient la route.<\u002Fp>\n<\u002Fdiv>\n<div style=\"display:flex;flex-direction:column;gap:34px\">\n<div style=\"display:flex;gap:18px\">\n<div class=\"p\" style=\"--d:.34s;flex:1;border-top:4px so
