<title>Banc d'essai — l'appareil</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#FFFFFF;color:#09090B;font:16px/1.5 Inter,system-ui,sans-serif;padding:2rem}
h1{font-size:1.25rem;margin:0 0 1.5rem}
.duo{display:grid;grid-template-columns:repeat(auto-fit,minmax(20rem,1fr));gap:2.5rem;
     align-items:start;max-width:66rem}
figcaption{font-size:.75rem;letter-spacing:.1em;text-transform:uppercase;color:#71717A;margin-bottom:.75rem}
figure{margin:0} figure img{width:100%;border:1px solid #E4E4E7;display:block}
.note{max-width:42rem;margin-top:2.5rem;font-size:.9375rem;color:#3F3F46;line-height:1.6}
.sim{display:grid;grid-template-columns:20rem minmax(0,1fr);gap:1.5rem;align-items:center;
     width:100%}
@media (max-width:52rem){ .sim{grid-template-columns:minmax(0,1fr)} }

/* ── L'APPAREIL, D'APRÈS LE DESSIN ─────────────────────────────────────────
   Comparé au croquis sur un banc isolé (banc-appareil.html), le composant
   s'en écartait sur cinq points, et chacun se voyait :

     • le FORMAT — il était large et plat ; le dessin est presque carré, un peu
       plus haut que large. C'est ce qui lui donne l'air d'une valise et non
       d'une tablette ;
     • l'ÉCRAN prenait toute la largeur ; dans le dessin il est en 3/2, encastré
       dans un cadre qui laisse de la coque autour ;
     • la POIGNÉE était une barre grise à peine visible ; c'est une arche
       creuse, large, posée sur le dessus ;
     • le BOUTON était orange en permanence. Au repos il est gris, encastré
       dans un anneau. L'orange est un ÉTAT — « appuyez » — et un bouton
       toujours orange ne dit plus rien quand il faut appuyer ;
     • le HAUT-PARLEUR était une rangée de quatorze traits sous le bouton ;
       dans le dessin ce sont CINQ fentes verticales, À CÔTÉ du bouton.

   Pourquoi cela compte plus qu'une ressemblance : l'élève voit l'appareil
   dessiné pendant sept minutes de séquence, puis doit s'en servir. Si celui
   qu'on lui met dans les mains n'est pas le même objet, le simulateur cesse
   d'être la suite de l'histoire et redevient un exercice. */
.aed{position:relative;width:min(100%,20rem);aspect-ratio:1/1.08;margin:0 auto;
     padding:1.5rem 1.1rem 1.1rem;border-radius:1.6rem;
     display:flex;flex-direction:column;gap:.75rem;
     background:linear-gradient(158deg,#f7f9fb,#e2e7ec 58%,#ccd3da);
     box-shadow:0 22px 40px -26px rgba(15,23,32,.55),inset 0 2px 0 rgba(255,255,255,.9),
                inset 0 -3px 6px rgba(15,23,32,.12)}
.aed::before{content:"";position:absolute;inset:6px;border-radius:1.3rem;pointer-events:none;
     border:1px solid rgba(255,255,255,.75)}
/* Les quatre vis. Elles ne décorent pas : ce sont elles qui disent « boîtier »
   plutôt que « écran ». */
.aed__vis{position:absolute;width:11px;height:11px;border-radius:50%;
     background:radial-gradient(circle at 36% 30%,#eef2f5,#aab3bc);
     box-shadow:inset 0 0 0 1px rgba(90,100,110,.5)}
.aed__vis::after{content:"";position:absolute;inset:3px;border-top:1.5px solid #79838d;
     transform:rotate(38deg)}
/* La poignée : une arche CREUSE. C'est le trou qui la fait lire comme une
   poignée — une barre pleine se lit comme une charnière. */
.aed__poignee{position:absolute;left:50%;top:-20px;transform:translateX(-50%);
     width:10rem;height:2.4rem;border-radius:1.2rem 1.2rem 0 0;
     background:linear-gradient(180deg,#eef2f5,#cfd6dd);
     box-shadow:inset 0 1px 0 rgba(255,255,255,.9)}
.aed__poignee::after{content:"";position:absolute;left:50%;top:.85rem;transform:translateX(-50%);
     width:7rem;height:2.2rem;border-radius:.8rem .8rem 0 0;background:#FFFFFF}
.aed__cadre{border-radius:.8rem;padding:9px;
     background:linear-gradient(180deg,#d9e0e6,#eef2f5);
     box-shadow:inset 0 2px 5px rgba(15,23,32,.28)}
.aed__ecran{position:relative;aspect-ratio:1.62;border-radius:.45rem;overflow:hidden;
     background:#0b1410;box-shadow:inset 0 0 14px rgba(0,0,0,.8)}
.aed__quadrillage{position:absolute;inset:0;background-image:
     linear-gradient(rgba(120,180,140,.16) 1px,transparent 1px),
     linear-gradient(90deg,rgba(120,180,140,.16) 1px,transparent 1px);
     background-size:11px 11px}
.aed__trace{position:absolute;inset:0}
.aed__trace path{fill:none;stroke:#d8e6da;stroke-width:2;stroke-linejoin:round}
.aed__dit{margin:0;font-size:.8125rem;font-weight:600;color:#09090B;line-height:1.35;
     min-height:2.2rem;text-align:center}
/* Le bouton et les fentes, SUR UNE MÊME LIGNE, comme sur le dessin. */
.aed__bas{display:flex;align-items:center;justify-content:center;gap:1.1rem;margin-top:auto}
.aed__choc{position:relative;width:5rem;height:5rem;border-radius:50%;flex-shrink:0;
     border:0;cursor:pointer;display:grid;place-items:center;color:#4a545e;
     background:radial-gradient(circle at 50% 30%,#f2f5f8,#c8d0d8 78%);
     box-shadow:0 0 0 5px #e6ebef,0 0 0 6px rgba(120,132,144,.45),
                inset 0 2px 3px rgba(255,255,255,.9),inset 0 -3px 5px rgba(15,23,32,.18);
     transition:background .18s,color .18s,box-shadow .18s}
.aed__choc[data-arme]{background:radial-gradient(circle at 50% 28%,#FB923C,#EA580C 80%);
     color:#FFFFFF;animation:arme 1s ease-in-out infinite}
.aed__choc[disabled]{cursor:default}
.aed__choc svg{width:2.3rem;height:2.3rem;fill:currentColor}
@keyframes arme{0%,100%{box-shadow:0 0 0 5px #fde3cd,0 0 0 6px rgba(234,88,12,.5),
                        0 8px 16px -8px rgba(234,88,12,.7)}
                50%{box-shadow:0 0 0 9px rgba(253,227,205,.55),0 0 0 10px rgba(234,88,12,.25),
                        0 8px 16px -8px rgba(234,88,12,.7)}}
/* Cinq fentes verticales, pas quatorze traits horizontaux. */
.aed__hp{display:flex;gap:7px;align-items:center;flex-shrink:0}
.aed__hp i{width:6px;height:3.1rem;border-radius:3px;background:#b9c2ca;
     box-shadow:inset 0 0 0 1px rgba(255,255,255,.55)}
.sim{grid-template-columns:minmax(0,1fr)}
</style>
