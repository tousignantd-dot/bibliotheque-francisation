ator offers no way to get them right or wrong, so it can say nothing about them.",horsPortee:{cadence:"Compression rate \u2014 recorded for analysis, but it does not enter the verdict.",profondeur:"Compression depth \u2014 a screen cannot measure it.",relachement:"Full chest recoil between compressions.",securite:"The actual safety of the scene \u2014 traffic, electricity, water."},erreurElectrodesHorsSequence:"Pads handled out of sequence.",erreurRcpHorsSequence:"CPR started out of sequence.",ligneTemps:"The session timeline",fractionSansCompression:"of the scene, nobody was compressing",delaiPremiere:"to the first compression",delaiReprise:"between shock and resuming",regleCreux:"A compression \u201Ccovers\u201D the two seconds after it; beyond that, circulation stops. The red mark is the shock.",comparaison:"Compared with your first pass",comparaisonNote:"A difference over a single pass proves nothing \u2014 the obstacle was not the same, and chance plays a large part. It is the trend across several attempts that means something.",fautes:"Mistakes made",prochainPassage:"On pass {{n}} there will be less support on screen, and a different obstacle on the chest.",reprise:"Come back in three days, then in ten. What is learned once and never revisited is lost \u2014 it is the one point on which the research leaves no doubt."},scenarios:{vf:{label:"Ventricular fibrillation",desc:"Chaotic rhythm \u2014 shock required",etiquette:"Shock required",resultat:"Ventricular fibrillation detected.",apprentissage:"Ventricular fibrillation is the most common shockable rhythm in cardiac arrest. The shock stops the chaotic activity and allows an organized rhythm to resume."},nsr:{label:"Normal sinus rhythm",desc:"Normal electrical activity \u2014 no shock",etiquette:"No shock",resultat:"Normal heart rhythm detected. No shock needed. If the victim is unconscious, begin CPR.",apprentissage:"Normal sinus rhythm does not warrant a shock. CPR remains essential if the victim is unconscious and not breathing normally."},asystole:{label:"Asystole",desc:"No electrical activity \u2014 CPR only",etiquette:"No shock",resultat:"Asystole detected \u2014 no shockable rhythm. Start chest compressions immediately, and do not stop.",apprentissage:"Asystole is not shockable. CPR is the only possible intervention while waiting for emergency services."}},quiz:{etiquette:"Question",vf:[{q:"What is your first action on arriving at the scene?",opts:["Turn on the AED and call {{urgence}}","Start compressions immediately","Wait for paramedics"],correct:0,exp:"The AED should be turned on as soon as possible; emergency services are called in parallel."},{q:"Where does the first pad go?",opts:["Below the right collarbone","On the left abdomen","On the sternum"],correct:0,exp:"The right pad goes below the right collarbone, to the right of the sternum."},{q:"During the analysis, you must:",opts:["Not touch the victim under any circumstances","Continue compressions","Give rescue breaths"],correct:0,exp:"Any physical contact distorts the analysis. Stand clear and ask everyone else to stand clear."},{q:"The AED advises a shock. Before pressing:",opts:["Check that no one is touching the victim","Press immediately","Give 2 breaths first"],correct:0,exp:"Look around visually, shout \u201CClear!\u201D, then press."},{q:"After the shock, you must:",opts:["Resume CPR immediately (30+2)","Wait for the next analysis","Check the pulse for 1 minute"],correct:0,exp:"Resume without delay: 30 chest compressions, then 2 rescue breaths."}],nsr:[{q:"The AED detects a normal sinus rhythm. This means:",opts:["The heart is beating normally \u2014 no shock","A shock is needed","The device must be recharged"],correct:0,exp:"A sinus rhythm is a normal heart rhythm. A shock is not indicated."},{q:"The victim is unconscious but the rhythm is normal. You:",opts:["Begin CPR (30+2)","Wait for help without acting","Press the shock button anyway"],correct:0,exp:"Unconsciousness without normal breathing requires CPR, even with a normal rhythm."},{q:"During CPR, compression depth should be:",opts:["5\u20136 cm at the centre of the sternum","2\u20133 cm on the side","As hard as possible"],correct:0,exp:"Compressions should go 5\u20136 cm deep, at the centre of the sternum, at 100 to 120 per minute."}],asystole:[{q:"The AED detects asystole. What does that mean?",opts:["A complete absence of cardiac electrical activity","A rhythm that is too fast","An irregular but present rhythm"],correct:0,exp:"Asystole is the complete cessation of cardiac electrical activity. It shows as a \u201Cflat line\u201D on the ECG."},{q:"Is asystole shockable?",opts:["No \u2014 CPR is the only intervention","Yes \u2014 shock immediately","Yes \u2014 after 2 minutes of CPR"],correct:0,exp:"Asystole is not a shockable rhythm. A shock would not be effective. CPR takes priority."},{q:"How long do you perform CPR before a new analysis?",opts:["About 2 minutes (5 cycles of 30+2)","30 seconds","5 minutes"],correct:0,exp:"The recommendation is 2 minutes (about 5 cycles of 30+2) before each re-analysis."}]},voix:{STARTING:[["Device is on.",0],["Call {{urgence}} now.",900],["Expose the victim\u2019s chest.",1100],["Prepare the electrode pads.",700]],ATTACH_PADS:[["Place the first pad\u2026 below the right collarbone.",0],["The second pad\u2026 on the left side,",1200],["below the armpit.",600]],ANALYZING:[["Analyzing heart rhythm.",0],["Do not touch the victim.",1e3],["Stand clear.",800]],SHOCK_ADVISED:[["Shock advised.",0],["Stand clear of the victim.",1100],["Make sure no one is touching the patient.",900]],CHARGING:[["Device is charging.",0],["Move everyone away from the victim.",1e3]],READY_SHOCK:[["Ready.",0],["Press the orange button",900],["to deliver the shock.",500],["Stand clear.",800]],SHOCK_DELIVERED:[["Shock delivered.","Resume compressions immediately.","Do not stop."]],NO_SHOCK:[["No shock advised.","Begin chest compressions.","Do not stop."]],CPR_START:[["Begin chest compressions.","Push hard and fast in the centre of the chest.","Do not stop."]],REANALYZING:[["Re-analyzing.",0],["Do not touch the victim.",1e3]]},journal:{titre:"Session log",compte:"Sessions recorded on this device:",explication:"The simulator records what is done \u2014 delays, actions, rate, mistakes \u2014 so it can be corrected from observations rather than impressions. No names, no personal data, and nothing is sent anywhere: it all stays in this browser until you export or erase it.",exporter:"Export (JSON)",effacer:"Erase",confirmer:"Erase every session recorded on this device?"},sansFilet:{plateau:"What you have",electrodes:"Pads",rcp:"CPR"},pose:{titre:"Place the pads",corps:"Drag both pads onto the bare chest. The device will not tell you where: it will analyse, or it will refuse.",trousse:"Within reach",analyser:"Start the analysis",refus:"Check the pads.",outils:{linge:"Cloth",rasoir:"Razor"},aide:{pose:"One pad below the right collarbone, to the right of the breastbone; the other on the left side, below the armpit.",vetement:"The chest must be bare.",timbre:"Nothing may come between the pad and the skin.",humidite:"Wet skin carries the current along the surface: wipe it dry.",pilosite:"The pad has to stick to the skin."}},scene:{horloge:"Elapsed",ARRIVEE:{situation:"Someone is lying on the ground, motionless. A person stands nearby and does nothing."},EXAMEN:{situation:"They respond neither to your voice nor to your touch."},APPEL:{situation:"They are not breathing normally. Someone is standing a few steps away."},gestes:{interpeller:"Speak loudly and tap their shoulder",secouer:"Shake them by the shoulders",deplacer:"Move them somewhere else",respiration:"Watch whether the chest rises",pouls:"Feel for a pulse at the neck",appeler:"\u201CYou, call 911\u201D",envoyer:"\u201CYou, go get the defibrillator\u201D",chercherSoiMeme:"Go and fetch the defibrillator yourself",comprimer:"Start compressions"},fautes:{secouer:"Victim shaken \u2014 you call out and tap, you do not nt cycles. Push in the centre of the chest, 5 to 6 cm, 100 to 120 times a minute, until help takes over or the person moves and breathes normally.",pourquoi:"Why this form: it is simpler, therefore better performed, and it removes the costliest interruption. The blood still holds oxygen during the first minutes; what is missing is something to move it.",nuance:"Two cases are exceptions, and you should know them: in a child or an infant, and after drowning, poisoning or choking, rescue breaths genuinely matter. Lack of oxygen is then the cause, not the consequence. If you are trained and willing, give thirty compressions then two breaths.",relais:"By two minutes, quality drops for almost everyone. If someone else is there, take turns \u2014 and make the change in under five seconds."},aveu:{titre:"What this screen cannot teach you",profondeur:"Depth. Five centimetres are felt in the arms; they do not appear on a screen.",relachement:"Full recoil \u2014 the commonest mistake, and the most invisible.",mains:"The real pressure under your hands, and the exact position on the breastbone.",fatigue:"Fatigue. By two minutes, quality drops for almost everyone, which is why rescuers take turns.",fin:"Those four are learned on a manikin, in an hour, with someone correcting you. This screen prepares you for that hour. It does not replace it."}}};var Wp={meta:{code:"es",nom:"Espa\xF1ol",etiquette:"ES",bcp47:"es-MX",sens:"ltr",voix:["Paulina","Monica","Juan","Diego","es-MX","es-ES"]},app:{titre:"SimDEA",sousTitre:"Simulador de desfibrilador",surTitre:"Formaci\xF3n en primeros auxilios",avertissement:"Este simulador tiene fines educativos \xFAnicamente. En una emergencia real, llame al {{urgence}}.",retour:"Volver",scenarioActif:"Escenario activo",score:"Puntuaci\xF3n",modeQuiz:"Modo cuestionario",modeSansFilet:"Sin gu\xEDa",soutien:{guide:"Paso 1 \xB7 se muestra",estompe:"Paso 2 \xB7 se aten\xFAa",sansFilet:"Paso 3 \xB7 sin gu\xEDa",quiz:"Modo cuestionario"}},menu:{titre:`Aprenda :"Descubra completamente el t\xF3rax. S\xE9quelo si es necesario. Retire la pel\xEDcula protectora de los parches y p\xE9guelos firmemente sobre la piel.",action:"Parches colocados \u2713"},ANALYZING:{titre:"An\xE1lisis del ritmo card\xEDaco",corps:"\xA1No se acerque a la v\xEDctima! No la toque. Cualquier contacto f\xEDsico puede alterar el an\xE1lisis."},SHOCK_ADVISED:{titre:"DESCARGA ACONSEJADA",corps:"Fibrilaci\xF3n ventricular detectada. El aparato se est\xE1 cargando. Grite \xAB\xA1AP\xC1RTENSE!\xBB y verifique que nadie toque a la v\xEDctima."},CHARGING:{titre:"Cargando\u2026",corps:"Mantenga a todos apartados. La descarga estar\xE1 lista en unos segundos."},READY_SHOCK:{titre:"LISTO \u2014 Administre la descarga",corps:"Grite \xAB\xA1AP\xC1RTENSE!\xBB. Mire a su alrededor. Pulse el bot\xF3n naranja \u26A1 que parpadea.",action:"\u26A1  Administrar la descarga"},SHOCK_DELIVERED:{titre:"Descarga administrada",corps:"Reanude las compresiones de inmediato. No se detenga hasta que el aparato se lo pida o lleguen los servicios de emergencia."},NO_SHOCK:{titre:"DESCARGA NO ACONSEJADA",action:"Comenzar la RCP"}},rcp:{compressions:"Compresiones",insufflations:"Ventilaciones",phase1:"1. Compresiones tor\xE1cicas",phase2:"2. Ventilaciones",minuteur:"RCP",consigne:"Haga clic o pulse",touche:"ESPACIO",victime:"v\xEDctima",sauveteur:"reanimador",relance:"Dos ventilaciones.",reprise:"Reanude las compresiones tor\xE1cicas.",continu:"Compresiones, sin parar"},bilan:{reussi:"Simulaci\xF3n superada",termine:"Simulaci\xF3n terminada",titre:"Balance de la simulaci\xF3n",scoreQuiz:"Puntuaci\xF3n del cuestionario",bonnesReponses:"respuestas correctas",rejouer:"Elegir otro escenario",reference:"Protocolo de referencia: {{referentiel}}",controles:{premature:"Ninguna acci\xF3n fuera de secuencia",chocBon:"Descarga administrada en el momento correcto",chocAbsent:"Sin descarga en un ritmo no desfibrilable",compressions:"Compresiones realizadas",envoi:"Alguien enviado a buscar el aparato"},erreurChocPremature:"Acci\xF3n prematura: la descarga a\xFAn no estaba aconsejada.",portee:"Este veredicto solo cubre los puntos medidos a continuaci\xF3n.",mesure:"Lo que la simulaci\xF3n midi\xF3",seuilCompressions:"Umbral aplicado: 150 compresiones en dos minutos. El ritmo no se mide.",nonEvalue:"Lo que esta simulaci\xF3n no eval\xFAa",nonEvalueIntro:"Estos pasos forman parte del procedimiento. El simulador no ofrece ninguna manera de acertarlos o fallarlos, as\xED que no puede decir nada al respecto.",horsPortee:{cadence:"El ritmo de las compresiones \u2014 se registra para el an\xE1lisis, pero no entra en el veredicto.",profondeur:"La profundidad de las compresiones \u2014 una pantalla no puede medirla.",relachement:"La descompresi\xF3n completa del t\xF3rax entre compresiones.",securite:"La seguridad real del lugar \u2014 tr\xE1fico, electricidad, agua."},erreurElectrodesHorsSequence:"Parches manipulados fuera de secuencia.",erreurRcpHorsSequence:"RCP iniciada fuera de secuencia.",ligneTemps:"La l\xEDnea de tiempo de la sesi\xF3n",fractionSansCompression:"del tiempo de la escena, nadie comprim\xEDa",delaiPremiere:"hasta la primera compresi\xF3n",delaiReprise:"entre la descarga y la reanudaci\xF3n",regleCreux:"Una compresi\xF3n \xABcubre\xBB los dos segundos siguientes; m\xE1s all\xE1, la circulaci\xF3n se detiene. La marca roja es la descarga.",comparaison:"En comparaci\xF3n con su primer paso",comparaisonNote:"Una diferencia en un solo paso no prueba nada \u2014 el obst\xE1culo no era el mismo y el azar influye mucho. Es la tendencia a lo largo de varios intentos la que dice algo.",fautes:"Errores cometidos",prochainPassage:"En el paso {{n}} habr\xE1 menos apoyo en pantalla y otro obst\xE1culo en el t\xF3rax.",reprise:"Vuelva en tres d\xEDas, y luego en diez. Lo que se aprende una vez y nunca se repasa se pierde \u2014 es el \xFAnico punto sobre el que la investigaci\xF3n no deja ninguna duda."},scenarios:{vf:{label:"Fibrilaci\xF3n ventricular",desc:"Ritm
