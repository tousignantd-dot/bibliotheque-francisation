ns. Aucun nom, aucune donn\xE9e personnelle, et rien n'est envoy\xE9 : tout reste dans ce navigateur, jusqu'\xE0 ce que vous exportiez ou effaciez.",exporter:"Exporter (JSON)",effacer:"Effacer",confirmer:"Effacer tous les passages enregistr\xE9s sur cet appareil ?"},sansFilet:{plateau:"Ce dont vous disposez",electrodes:"\xC9lectrodes",rcp:"RCP"},pose:{titre:"Placez les \xE9lectrodes",corps:"Faites glisser les deux \xE9lectrodes sur le thorax d\xE9nud\xE9. L'appareil ne dira pas o\xF9 : il analysera, ou il refusera.",trousse:"\xC0 port\xE9e",analyser:"Lancer l'analyse",refus:"V\xE9rifiez les \xE9lectrodes.",outils:{linge:"Linge",rasoir:"Rasoir"},aide:{pose:"Une \xE9lectrode sous la clavicule droite, \xE0 droite du sternum ; l'autre sur le c\xF4t\xE9 gauche, sous l'aisselle.",vetement:"Le thorax doit \xEAtre d\xE9nud\xE9.",timbre:"Rien ne doit s'interposer entre l'\xE9lectrode et la peau.",humidite:"Une peau mouill\xE9e conduit le courant en surface : essuyez.",pilosite:"L'\xE9lectrode doit coller \xE0 la peau."}},scene:{horloge:"Temps \xE9coul\xE9",ARRIVEE:{situation:"Une personne est au sol, immobile. Quelqu'un se tient \xE0 distance et ne fait rien."},EXAMEN:{situation:"Elle ne r\xE9agit ni \xE0 la voix ni au contact."},APPEL:{situation:"Elle ne respire pas normalement. Quelqu'un est l\xE0, \xE0 quelques pas."},gestes:{interpeller:"Lui parler fort et lui toucher l'\xE9paule",secouer:"La secouer par les \xE9paules",deplacer:"La d\xE9placer pour l'allonger ailleurs",respiration:"Regarder si le thorax se soul\xE8ve",pouls:"Chercher le pouls au cou",appeler:"\xAB Vous, appelez le 911 \xBB",envoyer:"\xAB Vous, allez chercher le d\xE9fibrillateur \xBB",chercherSoiMeme:"Aller chercher le d\xE9fibrillateur soi-m\xEAme",comprimer:"Commencer les compressions"},fautes:{secouer:"Victime secou\xE9e \u2014 on interpelle et on touche, on ne secoue pas.",deplacer:"Victime d\xE9plac\xE9e sans n\xE9cessit\xE9 \u2014 on r\xE9anime l\xE0 o\xF9 elle est.",pouls:"Recherche du pouls \u2014 m\xEAme les professionnels s'y trompent, et le temps pass\xE9 est du temps sans compression.",chercherSoiMeme:"Sauveteur parti chercher l'appareil \u2014 la victime est rest\xE9e seule et sans compression.",sansAppel:"Compressions commenc\xE9es sans que les secours aient \xE9t\xE9 appel\xE9s.",sansEnvoi:"Compressions commenc\xE9es sans que personne ait \xE9t\xE9 envoy\xE9 chercher l'appareil."},suivi:{appel:"secours appel\xE9s",envoi:"appareil demand\xE9"},attente:{titre:"D\xE9fibrillateur",absent:"Il n'y en a pas sur les lieux. Quelqu'un doit aller le chercher.",enRoute:"Quelqu'un est parti le chercher."}},atelier:{titre:"Apprendre le geste",chapeau:"Trois temps courts. On ne vous explique pas la r\xE9animation : on vous la fait r\xE9gler, parce que lire un geste et le poser sont deux choses diff\xE9rentes.",suivant:"Suivant",recommencer:"Recommencer",temps1:{nom:"Voir",mains:{quoi:"O\xF9 poser les mains",comment:"Le talon d'une main au milieu de la poitrine, sur la moiti\xE9 basse du sternum ; l'autre main par-dessus, doigts crois\xE9s. Bras tendus, \xE9paules \xE0 l'aplomb."},profondeur:{quoi:"Jusqu'o\xF9 appuyer",comment:"5 \xE0 6 cm chez l'adulte. C'est plus profond que ce que la plupart des gens osent."},relachement:{quoi:"Et surtout rel\xE2cher",comment:"Laisser la poitrine remonter compl\xE8tement entre deux compressions, sans lever les mains. C'est la remont\xE9e qui remplit le c\u0153ur."},cadence:{quoi:"\xC0 quel rythme",comment:"100 \xE0 120 par minute. Le temps 2 vous le fait r\xE9gler."},entendre:"Entendre la cadence",arreter:"Arr\xEAter"},temps2:{nom:"R\xE9gler",consigne:"Tapez la cadence \u2014 barre d'espace, clic, ou l'\xE9cran tactile. L'aiguille montre votre rythme r\xE9el ; la bande claire est la plage recommand\xE9e.",unite:"par minute",fini:"Fini",verdict:"de vos compressions \xE9taient dans la plage recommand\xE9e.",note:"C'est la seule chose qu'un \xE9cran entra\xEEne vraiment bien. Deux minutes ici valent mieux qu'une page de texte."},temps3:{nom:"Tenir",titre:"Comprimer, sans jamais s'arr\xEAter",corps:"Pas de bouche-\xE0-bouche, pas de pause pour compter les cycles. On appuie au milieu de la poitrine, 5 \xE0 6 cm, 100 \xE0 120 fois par minute, jusqu'\xE0 ce que les secours prennent le relais ou que la personne bouge et respire normalement.",pourquoi:"Pourquoi cette forme-l\xE0 : elle est plus simple, donc mieux ex\xE9cut\xE9e, et elle supprime l'interruption la plus co\xFBteuse. Le sang contient encore de l'oxyg\xE8ne pendant les premi\xE8res minutes ; ce qui manque, c'est quelque chose pour le faire circuler.",nuance:"Deux cas font exception, et il faut les conna\xEEtre : chez un enfant ou un nourrisson, et apr\xE8s une noyade, une intoxication ou un \xE9touffement, les insufflations comptent vraiment. Le manque d'oxyg\xE8ne est alors la cause, pas la cons\xE9quence. Si vous \xEAtes form\xE9 et dispos\xE9 \xE0 les donner, faites trente compressions puis deux insufflations.",relais:"\xC0 deux minutes, la qualit\xE9 chute chez presque tout le monde. Si quelqu'un d'autre est l\xE0, relayez-vous \u2014 et faites le changement en moins de cinq secondes."},aveu:{titre:"Ce que cet \xE9cran ne peut pas vous apprendre",profondeur:"La profondeur. Cinq centim\xE8tres se sentent dans les bras ; ils ne s'affichent pas.",relachement:"Le rel\xE2chement complet \u2014 l'erreur la plus fr\xE9quente, et la plus invisible.",mains:"La pression r\xE9elle sous les mains, et la position exacte sur le sternum.",fatigue:"La fatigue. \xC0 deux minutes, la qualit\xE9 chute chez presque tout le monde, et c'est pour cela qu'on se relaie.",fin:"Ces quatre-l\xE0 s'apprennent sur un mannequin, en une heure, avec quelqu'un qui corrige. Cet \xE9cran vous pr\xE9pare \xE0 cette heure-l\xE0. Il ne la remplace pas."}},demo:{titre:"D\xE9monstration \u2014 choisir le sc\xE9nario et le niveau de soutien",note:"Pour montrer un cas pr\xE9cis. Ces passages ne comptent pas dans votre progression et n'entrent pas dans la comparaison : un dispositif qui laisse choisir son niveau de soutien ne mesure plus rien, et il faut donc que ce choix reste dehors.",badge:"D\xE9monstration"}};var Pp={meta:{code:"en",nom:"English",etiquette:"EN",bcp47:"en-CA",sens:"ltr",voix:["Samantha","Karen","Moira","Fiona","Serena","en-CA","en-GB","en-US"]},app:{titre:"SimDEA",sousTitre:"Defibrillator Simulator",surTitre:"First aid training",avertissement:"This simulator is for educational purposes only. In a real emergency, call {{urgence}}.",retour:"Back",scenarioActif:"Active scenario",score:"Score",modeQuiz:"Quiz mode",modeSansFilet:"No prompts",soutien:{guide:"Pass 1 \xB7 shown",estompe:"Pass 2 \xB7 fading",sansFilet:"Pass 3 \xB7 no prompts",quiz:"Quiz mode"}},menu:{titre:`Learn to use

ator offers no way to get them right or wrong, so it can say nothing about them.",horsPortee:{cadence:"Compression rate \u2014 recorded for analysis, but it does not enter the verdict.",profondeur:"Compression depth \u2014 a screen cannot measure it.",relachement:"Full chest recoil between compressions.",securite:"The actual safety of the scene \u2014 traffic, electricity, water."},erreurElectrodesHorsSequence:"Pads handled out of sequence.",erreurRcpHorsSequence:"CPR started out of sequence.",ligneTemps:"The session timeline",fractionSansCompression:"of the scene, nobody was compressing",delaiPremiere:"to the first compression",delaiReprise:"between shock and resuming",regleCreux:"A compression \u201Ccovers\u201D the two seconds after it; beyond that, circulation stops. The red mark is the shock.",comparaison:"Compared with your first pass",comparaisonNote:"A difference over a single pass proves nothing \u2014 the obstacle was not the same, and chance plays a large part. It is the trend across several attempts that means something.",fautes:"Mistakes made",prochainPassage:"On pass {{n}} there will be less support on screen, and a different obstacle on the chest.",reprise:"Come back in three days, then in ten. What is learned once and never revisited is lost \u2014 it is the one point on which the research leaves no doubt."},scenarios:{vf:{label:"Ventricular fibrillation",desc:"Chaotic rhythm \u2014 shock required",etiquette:"Shock required",resultat:"Ventricular fibrillation detected.",apprentissage:"Ventricular fibrillation is the most common shockable rhythm in cardiac arrest. The shock stops the chaotic activity and allows an organized rhythm to resume."},nsr:{label:"Normal sinus rhythm",desc:"Normal electrical activity \u2014 no shock",etiquette:"No shock",resultat:"Normal heart rhythm detected. No shock needed. If the victim is unconscious, begin CPR.",apprentissage:"Normal sinus rhythm does not warrant a shock. CPR remains essential if the victim is unconscious and not breathing normally."},asystole:{label:"Asystole",desc:"No electrical activity \u2014 CPR only",etiquette:"No shock",resultat:"Asystole detected \u2014 no shockable rhythm. Start chest compressions immediately, and do not stop.",apprentissage:"Asystole is not shockable. CPR is the only possible intervention while waiting for emergency services."}},quiz:{etiquette:"Question",vf:[{q:"What is your first action on arriving at the scene?",opts:["Turn on the AED and call {{urgence}}","Start compressions immediately","Wait for paramedics"],correct:0,exp:"The AED should be turned on as soon as possible; emergency services are called in parallel."},{q:"Where does the first pad go?",opts:["Below the right collarbone","On the left abdomen","On the sternum"],correct:0,exp:"The right pad goes below the right collarbone, to the right of the sternum."},{q:"During the analysis, you must:",opts:["Not touch the victim under any circumstances","Continue compressions","Give rescue breaths"],correct:0,exp:"Any physical contact distorts the analysis. Stand clear and ask everyone else to stand clear."},{q:"The AED advises a shock. Before pressing:",opts:["Check that no one is touching the victim","Press immediately","Give 2 breaths first"],correct:0,exp:"Look around visually, shout \u201CClear!\u201D, then press."},{q:"After the shock, you must:",opts:["Resume CPR immediately (30+2)","Wait for the next analysis","Check the pulse for 1 minute"],correct:0,exp:"Resume without delay: 30 chest compressions, then 2 rescue breaths."}],nsr:[{q:"The AED detects a normal sinus rhythm. This means:",opts:["The heart is beating normally \u2014 no shock","A shock is needed","The device must be recharged"],correct:0,exp:"A sinus rhythm is a normal heart rhythm. A shock is not indicated."},{q:"The victim is unconscious but the rhythm is normal. You:",opts:["Begin CPR (30+2)","Wait for help without acting","Press the shock button anyway"],correct:0,exp:"Unconsciousness without normal breathing re h hard and fast in the centre of the chest.","Do not stop."]],REANALYZING:[["Re-analyzing.",0],["Do not touch the victim.",1e3]]},journal:{titre:"Session log",compte:"Sessions recorded on this device:",explication:"The simulator records what is done \u2014 delays, actions, rate, mistakes \u2014 so it can be corrected from observations rather than impressions. No names, no personal data, and nothing is sent anywhere: it all stays in this browser until you export or erase it.",exporter:"Export (JSON)",effacer:"Erase",confirmer:"Erase every session recorded on this device?"},sansFilet:{plateau:"What you have",electrodes:"Pads",rcp:"CPR"},pose:{titre:"Place the pads",corps:"Drag both pads onto the bare chest. The device will not tell you where: it will analyse, or it will refuse.",trousse:"Within reach",analyser:"Start the analysis",refus:"Check the pads.",outils:{linge:"Cloth",rasoir:"Razor"},aide:{pose:"One pad below the right collarbone, to the right of the breastbone; the other on the left side, below the armpit.",vetement:"The chest must be bare.",timbre:"Nothing may come between the pad and the skin.",humidite:"Wet skin carries the current along the surface: wipe it dry.",pilosite:"The pad has to stick to the skin."}},scene:{horloge:"Elapsed",ARRIVEE:{situation:"Someone is lying on the ground, motionless. A person stands nearby and does nothing."},EXAMEN:{situation:"They respond neither to your voice nor to your touch."},APPEL:{situation:"They are not breathing normally. Someone is standing a few steps away."},gestes:{interpeller:"Speak loudly and tap their shoulder",secouer:"Shake them by the shoulders",deplacer:"Move them somewhere else",respiration:"Watch whether the chest rises",pouls:"Feel for a pulse at the neck",appeler:"\u201CYou, call 911\u201D",envoyer:"\u201CYou, go get the defibrillator\u201D",chercherSoiMeme:"Go and fetch the defibrillator yourself",comprimer:"Start compressions"},fautes:{secouer:"Victim shaken \u2014 you call out and tap, you do not nt cycles. Push in the centre of the chest, 5 to 6 cm, 100 to 120 times a minute, until help takes over or the person moves and breathes normally.",pourquoi:"Why this form: it is simpler, therefore better performed, and it removes the costliest interruption. The blood still holds oxygen during the first minutes; what is missing is something to move it.",nuance:"Two cases are exceptions, and you should know them: in a child or an infant, and after drowning, poisoning or choking, rescue breaths genuinely matter. Lack of oxygen is then the cause, not the consequence. If you are trained and willing, give thirty compressions then two breaths.",relais:"By two minutes, quality drops for almost everyone. If someone else is there, take turns \u2014 and make the change in under five seconds."},aveu:{titre:"What this screen cannot teach you",profondeur:"Depth. Five centimetres are felt in the arms; they do not appear on a screen.",relachement:"Full recoil \u2014 the commonest mistake, and the most invisible.",mains:"The real pressure under your hands, and the exact position on the breastbone.",fatigue:"Fatigue. By two minutes, quality drops for almost everyone, which is why rescuers take turns.",fin:"Those four are learned on a manikin, in an hour, with someone correcting you. This screen prepares you for that hour. It does not replace it."}},demo:{titre:"Demonstration \u2014 pick the scenario and the support level",note:"For showing a specific case. These passes do not count towards your progress and do not enter the comparison: a device that lets you pick your own support level no longer measures anything, so that choice has to stay outside.",badge:"Demonstration"}};var Fp={meta:{code:"es",nom:"Espa\xF1ol",etiquette:"ES",bcp47:"es-MX",sens:"ltr",voix:["Paulina","Monica","Juan","Diego","es-MX","es-ES"]},app:{titre:"SimDEA",sousTitre:"Simulador de desfibrilador",surTitre:"Formaci\xF3n en primeros auxilios",avertissement:"Este simulador tiene fines educativos \xFAnicamente. En o"},erreurChocPremature:"Acci\xF3n prematura: la descarga a\xFAn no estaba aconsejada.",portee:"Este veredicto solo cubre los puntos medidos a continuaci\xF3n.",mesure:"Lo que la simulaci\xF3n midi\xF3",seuilCompressions:"Umbral aplicado: 150 compresiones en dos minutos. El ritmo no se mide.",nonEvalue:"Lo que esta simulaci\xF3n no eval\xFAa",nonEvalueIntro:"Estos pasos forman parte del procedimiento. El simulador no ofrece ninguna manera de acertarlos o fallarlos, as\xED que no puede decir nada al respecto.",horsPortee:{cadence:"El ritmo de las compresiones \u2014 se registra para el an\xE1lisis, pero no entra en el veredicto.",profondeur:"La profundidad de las compresiones \u2014 una pantalla no puede medirla.",relachement:"La descompresi\xF3n completa del t\xF3rax entre compresiones.",securite:"La seguridad real del lugar \u2014 tr\xE1fico, electricidad, agua."},erreurElectrodesHorsSequence:"Parches manipulados fuera de secuencia.",erreurRcpHorsSequence:"RCP iniciada fuera de secuencia.",ligneTemps:"La l\xEDnea de tiempo de la sesi\xF3n",fractionSansCompression:"del tiempo de la escena, nadie comprim\xEDa",delaiPremiere:"hasta la primera compresi\xF3n",delaiReprise:"entre la descarga y la reanudaci\xF3n",regleCreux:"Una compresi\xF3n \xABcubre\xBB los dos segundos siguientes; m\xE1s all\xE1, la circulaci\xF3n se detiene. La marca roja es la descarga.",comparaison:"En comparaci\xF3n con su primer paso",comparaisonNote:"Una diferencia en un solo paso no prueba nada \u2014 el obst\xE1culo no era el mismo y el azar influye mucho. Es la tendencia a lo largo de varios intentos la que dice algo.",fautes:"Errores cometidos",prochainPassage:"En el paso {{n}} habr\xE1 menos apoyo en pantalla y otro obst\xE1culo en el t\xF3rax.",reprise:"Vuelva en tres d\xEDas, y luego en diez. Lo que se aprende una vez y nunca se repasa se pierde \u2014 es el \xFAnico punto sobre el que la investigaci\xF3n no deja ninguna duda."},scenarios:{vf:{label:"Fibrilaci\xF3n ventricular",desc:"Ritm
