<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#f7f7f8" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#1e2024" media="(prefers-color-scheme: dark)" />
  <title>SimDEA — Simulateur de défibrillateur</title>
  <meta name="description" content="Simulateur de défibrillateur externe automatisé (DEA) : trois scénarios cliniques, mode guidé et mode quiz, en français, anglais et espagnol." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=DM+Sans:wght@400;500;600;700;800&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>/* ════════════════════════════════════════════════════════════════════
   SimDEA — feuille de style

   Trois principes :
   1. Une seule action évidente à l'écran, toujours atteignable.
   2. Le registre de couleur bascule quand l'appareil ordonne d'écarter
      tout le monde — la page entière, pas seulement une carte.
   3. L'écran de l'appareil garde son noir et son vert quel que soit le
      thème de la page : c'est un objet, pas une surface d'interface.
   ════════════════════════════════════════════════════════════════════ */

/* ── Jetons ────────────────────────────────────────────────────────── */

:root {
  color-scheme: light dark;

  /* Surfaces et encres — thème clair */
  --fond:          oklch(0.97 0.002 250);
  --fond-creux:    oklch(0.94 0.004 250);
  --surface:       oklch(1 0 0);
  --surface-haute: oklch(0.99 0.002 250);
  --bord:          oklch(0.90 0.005 250);
  --bord-fort:     oklch(0.82 0.008 250);

  --encre:         oklch(0.21 0.010 250);
  --encre-douce:   oklch(0.45 0.010 250);
  --encre-faible:  oklch(0.58 0.008 250);   /* 4.6:1 sur --surface */
  --encre-tenue:   oklch(0.66 0.006 250);   /* réservé au non-essentiel */

  /* Couleurs sémantiques */
  --action:        oklch(0.48 0.15 152);
  --action-vive:   oklch(0.56 0.17 152);
  --action-voile:  oklch(0.95 0.04 152);
  --action-texte:  oklch(0.38 0.13 152);
  --succes:        oklch(0.52 0.16 152);

  --urgence:       oklch(0.55 0.21 34);
  --urgence-vive:  oklch(0.63 0.23 38);
  --urgence-voile: oklch(0.96 0.035 34);
  --urgence-bord:  oklch(0.82 0.10 34);
  --urgence-texte: oklch(0.44 0.17 34);

  --calme:         oklch(0.50 0.14 232);
  --calme-voile:   oklch(0.95 0.04 232);

  --savoir:        oklch(0.48 0.14 285);
  --savoir-voile:  oklch(0.95 0.045 285);

  /* ── L'appareil (remise de design) — variante blanc clinique ──
     Un seul composant, deux thèmes : les valeurs basculent, jamais le code. */
  --coque:        linear-gradient(168deg,#ffffff 0%,#f6f8fa 36%,#e9edf1 74%,#dde3e9 100%);
  --coque-bord:   #cfd6dd;
  --coque-ombre:  0 40px 80px -26px rgba(30,40,55,.34);
  --coque-lustre: linear-gradient(200deg,rgba(255,255,255,.85),rgba(255,255,255,0) 34%);
  --poignee:      linear-gradient(180deg,#ffffff 0%,#e8ecf1 56%,#d5dbe2 100%);
  --poignee-bord: #ccd4dc;
  --poignee-creux: radial-gradient(120% 90% at 50% 100%,#e2e7ec,#cdd5dd);
  --poignee-creux-bord: #c6ced6;
  --vis:          radial-gradient(circle at 35% 30%,#f2f5f8,#b9c2cb 72%);
  --vis-fente:    #97a2ad;
  --vis-bord:     #aab4bf;
  --cadre:        linear-gradient(180deg,#e3e8ed,#f3f6f9);
  --cadre-ombre:  0 2px 0 rgba(255,255,255,.9), 0 -8px 18px -14px rgba(60,75,95,.5) inset, 0 0 0 1px #ccd4dc;
  --lcd:          radial-gradient(120% 130% at 50% 0%,#f4fbf6 0%,#e2eee6 72%);
  --lcd-ombre:    0 0 0 1px #bfcfc5, 0 6px 16px -12px rgba(30,60,45,.5) inset;
  --lcd-quadrillage: oklch(0.62 0.10 155 / .28);
  --lcd-balayage: rgba(40,70,55,.055);
  --lcd-verre:    linear-gradient(148deg, rgba(255,255,255,.75) 0%, rgba(255,255,255,.15) 24%, transparent 48%);
  --lcd-fond:     rgba(238,247,241,1);
  /* Le voile doit rester très faible : à l'opacité de la variante sombre, le
     tracé foncé s'efface d'un LCD pâle en une vingtaine d'images. */
  --lcd-voile:    rgba(238,247,241,.03);
  --trace-vif:    oklch(0.38 0.14 158);
  --trace-halo:   oklch(0.55 0.15 158 / .16);
  --releve:       oklch(0.44 0.11 158);
  --releve-lueur: none;
  --hp-trou:      #cdd5dd;
  --hp-relief:    0 1px 0 rgba(255,255,255,.85);
  --pan:          linear-gradient(180deg,#f7f9fb,#eef2f6);
  --pan-ombre:    0 1px 0 rgba(255,255,255,.9), 0 0 0 1px #d3dae1;
  --pan-appel:    0 1px 0 rgba(255,255,255,.9), 0 0 0 1.5px oklch(0.60 0.16 155 / .75), 0 0 22px -8px oklch(0.60 0.16 155 / .6);
  --micro-encre:  #5c6672;
  --sourd:        #5c6672;
  --nom-encre:    #1c2530;
  --nom-ombre:    0 1px 0 rgba(255,255,255,.9);
  --nom-accent:   oklch(0.58 0.22 38);
  --puits:        radial-gradient(circle at 50% 20%,#eef2f6,#dde4ea 72%);
  --puits-ombre:  0 -3px 8px rgba(255,255,255,.9) inset, 0 14px 26px -14px rgba(50,65,85,.55) inset, 0 0 0 1px #ccd4dc;
  --choc-repos:   radial-gradient(circle at 50% 26%,#f0e5dc,#d8cabf 80%);
  --choc-encre:   #9b8b7e;
  --choc-ombre:   0 8px 16px -8px rgba(60,45,35,.5), 0 1px 0 rgba(255,255,255,.85) inset;
  --led-eteinte:  #dbe1e8;
  --led-bord:     #c3ccd5;
  --led-relief:   0 1px 0 rgba(255,255,255,.9);
  --led-titre-on: #333c46;
  --rail-filet:   #dde3e9;
  --led-on:      oklch(0.60 0.19 152);
  --led-analyse: oklch(0.58 0.17 240);
  --led-choc:    oklch(0.65 0.22 48);
  --led-rcp:     oklch(0.58 0.21 28);

  /* Rythme : une seule base de 4 px */
  --e1: 4px;  --e2: 8px;  --e3: 12px; --e4: 16px;
  --e5: 24px; --e6: 32px; --e7: 48px; --e8: 72px;

  /* Échelle typographique */
  --t-micro: 0.6875rem;  /* 11 */
  --t-petit: 0.8125rem;  /* 13 */
  --t-base:  0.9375rem;  /* 15 */
  --t-moyen: 1.0625rem;  /* 17 */
  --t-grand: 1.375rem;   /* 22 */
  --t-titre: clamp(1.75rem, 1.1rem + 3.2vw, 2.75rem);

  --rayon-s: 8px;
  --rayon-m: 12px;
  --rayon-l: 18px;
  --rayon-xl: 24px;

  --ombre-1: 0 1px 2px oklch(0.21 0.01 250 / 0.05), 0 2px 8px oklch(0.21 0.01 250 / 0.04);
  --ombre-2: 0 2px 4px oklch(0.21 0.01 250 / 0.06), 0 8px 24px oklch(0.21 0.01 250 / 0.07);
  --ombre-boitier: 0 24px 64px oklch(0.21 0.01 250 / 0.22), inset 0 1px 0 oklch(1 0 0 / 0.05);

  --mono: 'DM Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
  --transition: 0.22s cubic-bezier(0.4, 0, 0.2, 1);
}

@media (prefers-color-scheme: dark) {
  :root {
    --fond:          oklch(0.17 0.006 250);
    --fond-creux:    oklch(0.14 0.006 250);
    --surface:       oklch(0.22 0.007 250);
    --surface-haute: oklch(0.25 0.008 250);
    --bord:          oklch(0.31 0.008 250);
    --bord-fort:     oklch(0.40 0.010 250);

    --encre:         oklch(0.95 0.004 250);
    --encre-douce:   oklch(0.78 0.008 250);
    --encre-faible:  oklch(0.66 0.008 250);
    --encre-tenue:   oklch(0.55 0.008 250);

    --action:        oklch(0.62 0.16 152);
    --action-vive:   oklch(0.70 0.18 152);
    --action-voile:  oklch(0.28 0.06 152);
    --action-texte:  oklch(0.86 0.13 152);
    --succes:        oklch(0.68 0.17 152);

    --urgence:       oklch(0.62 0.20 34);
    --urgence-vive:  oklch(0.70 0.22 38);
    --urgence-voile: oklch(0.28 0.07 34);
    --urgence-bord:  oklch(0.42 0.12 34);
    --urgence-texte: oklch(0.87 0.11 34);

    --calme:         oklch(0.66 0.14 232);
    --calme-voile:   oklch(0.27 0.06 232);

    --savoir:        oklch(0.70 0.14 285);
    --savoir-voile:  oklch(0.28 0.07 285);

    --ombre-1: 0 1px 2px oklch(0 0 0 / 0.30), 0 2px 8px oklch(0 0 0 / 0.24);
    --ombre-2: 0 2px 4px oklch(0 0 0 / 0.34), 0 8px 24px oklch(0 0 0 / 0.30);

    /* ── L'appareil — variante graphite ── */
    --coque:        linear-gradient(168deg,#3a4048 0%,#22262c 34%,#171a1e 72%,#0f1114 100%);
    --coque-bord:   #4a5158;
    --coque-ombre:  0 40px 90px -20px rgba(0,0,0,.85);
    --coque-lustre: linear-gradient(200deg,rgba(255,255,255,.09),rgba(255,255,255,0) 32%);
    --poignee:      linear-gradient(180deg,#4a525b 0%,#2b3037 55%,#1a1e22 100%);
    --poignee-bord: #14171a;
    --poignee-creux: radial-gradient(120% 90% at 50% 100%,#101317,#06080a);
    --poignee-creux-bord: #14171a;
    --vis:          radial-gradient(circle at 35% 30%,#6b737c,#2c3137 70%);
    --vis-fente:    #171a1d;
    --vis-bord:     transparent;
    --cadre:        linear-gradient(180deg,#0a0c0e,#191d21);
    --cadre-ombre:  0 2px 0 rgba(255,255,255,.07), 0 -10px 20px -14px #000 inset, 0 0 0 1px #0a0c0e;
    --lcd:          radial-gradient(120% 130% at 50% 0%,#0a2118 0%,#04120c 70%);
    --lcd-ombre:    0 0 0 1px #06180f, 0 0 34px -6px oklch(0.55 0.20 155 / .35) inset;
    --lcd-quadrillage: oklch(0.60 0.14 155 / .10);
    --lcd-balayage: rgba(0,0,0,.18);
    --lcd-verre:    linear-gradient(148deg, rgba(255,255,255,.12) 0%, rgba(255,255,255,.02) 26%, transparent 46%);
    --lcd-fond:     rgba(4,18,12,1);
    --lcd-voile:    rgba(4,18,12,.16);
    --trace-vif:    oklch(0.92 0.22 155);
    --trace-halo:   oklch(0.70 0.20 155 / .22);
    --releve:       oklch(0.78 0.16 155);
    --releve-lueur: 0 0 8px oklch(0.70 0.20 155 / .8);
    --hp-trou:      #0b0d0f;
    --hp-relief:    0 1px 0 rgba(255,255,255,.05);
    --pan:          linear-gradient(180deg,#191d22,#12151a);
    --pan-ombre:    0 1px 0 rgba(255,255,255,.05), 0 0 0 1px #0c0e11;
    --pan-appel:    0 1px 0 rgba(255,255,255,.05), 0 0 0 1px oklch(0.55 0.18 155 / .55), 0 0 24px -6px oklch(0.55 0.18 155 / .5);
    --micro-encre:  #6d757e;
    --sourd:        #5b636b;
    --nom-encre:    #f2f5f8;
    --nom-ombre:    0 1px 0 rgba(255,255,255,.25), 0 -1px 0 rgba(0,0,0,.6);
    --nom-accent:   oklch(0.70 0.20 42);
    --puits:        radial-gradient(circle at 50% 20%,#1b1f24,#0c0e11 70%);
    --puits-ombre:  0 -3px 8px rgba(255,255,255,.05) inset, 0 14px 30px -12px #000 inset, 0 0 0 1px #0a0c0e;
    --choc-repos:   radial-gradient(circle at 50% 26%,#3a2418,#1d1410 78%);
    --choc-encre:   #5c5048;
    --choc-ombre:   0 8px 18px -6px #000, 0 1px 0 rgba(255,255,255,.08) inset;
    --led-eteinte:  #12151a;
    --led-bord:     #0a0c0e;
    --led-relief:   0 1px 0 rgba(255,255,255,.05);
    --led-titre-on: #c3cbd3;
    --rail-filet:   #0e1114;
    --led-on:      oklch(0.72 0.20 152);
    --led-analyse: oklch(0.74 0.18 232);
    --led-choc:    oklch(0.76 0.22 48);
    --led-rcp:     oklch(0.72 0.20 28);
  }
}

/* ── Socle ─────────────────────────────────────────────────────────── */

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html { -webkit-text-size-adjust: 100%; }

body {
  min-height: 100dvh;   /* 100vh dépasse sous Safari mobile : le bas devient inatteignable */
  font-family: 'DM Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
  font-size: var(--t-base);
  line-height: 1.6;
  background: var(--fond);
  color: var(--encre);
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}

#root { display: flex; flex-direction: column; min-height: 100dvh; }

button { font: inherit; color: inherit; }
ul, ol { list-style: none; }
h1, h2, h3 { line-height: 1.2; letter-spacing: -0.02em; font-weight: 700; }

kbd {
  background: var(--fond-creux);
  border: 1px solid var(--bord);
  border-bottom-width: 2px;
  border-radius: var(--rayon-s);
  padding: 2px 7px;
  font-size: var(--t-micro);
  font-family: var(--mono);
  color: var(--encre-douce);
}

.visuellement-cache {
  position: absolute; width: 1px; height: 1px; padding: 0;
  overflow: hidden; clip-path: inset(50%); white-space: nowrap;
}

:focus-visible {
  outline: 2px solid var(--calme);
  outline-offset: 3px;
  border-radius: var(--rayon-s);
}

/* Le survol ne doit pas décider seul : sur écran tactile il colle. */
@media (hover: hover) {
  .bouton:hover { filter: brightness(1.08); }
}

/* ── Animations ────────────────────────────────────────────────────── */

@keyframes pouls-urgence {
  0%, 100% { box-shadow: 0 0 0 0 oklch(0.63 0.23 38 / 0.45), var(--ombre-2); }
  50%      { box-shadow: 0 0 0 12px oklch(0.63 0.23 38 / 0), var(--ombre-2); }
}
@keyframes clignote { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0.18; } }
@keyframes rebond {
  0%, 80%, 100% { transform: translateY(0); opacity: 0.35; }
  40%           { transform: translateY(-5px); opacity: 1; }
}
@keyframes eclair-blanc { from { opacity: 1; } to { opacity: 0; } }
@keyframes monte { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
@keyframes surgit { from { opacity: 0; transform: scale(0.96); } to { opacity: 1; transform: none; } }
@keyframes secoue {
  0%, 100% { transform: translateX(0); }
  20% { transform: translateX(-7px); }  40% { transform: translateX(7px); }
  60% { transform: translateX(-4px); }  80% { transform: translateX(4px); }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
    scroll-behavior: auto !important;
  }
}

/* ── Boutons ───────────────────────────────────────────────────────── */

.bouton {
  display: inline-flex; align-items: center; justify-content: center; gap: var(--e2);
  min-height: 44px;                /* cible tactile */
  padding: var(--e3) var(--e5);
  border: 1px solid transparent;
  border-radius: var(--rayon-m);
  font-size: var(--t-petit);
  font-weight: 700;
  letter-spacing: 0.01em;
  cursor: pointer;
  transition: background var(--transition), border-color var(--transition), transform 0.1s;
}
.bouton:active { transform: scale(0.985); }

.bouton--primaire { background: var(--encre); color: var(--fond); }
.bouton--action   { background: var(--action); color: oklch(1 0 0); }
.bouton--urgence  { background: var(--urgence); color: oklch(1 0 0); }
.bouton--quiz     { background: var(--savoir-voile); color: var(--savoir); border-color: color-mix(in oklch, var(--savoir) 30%, transparent); }
.bouton--discret  {
  background: transparent; color: var(--encre-faible);
  border-color: var(--bord); font-weight: 500;
}
.bouton--discret:hover { color: var(--encre); border-color: var(--bord-fort); }

/* ══ MENU ═══════════════════════════════════════════════════════════ */

.menu { flex: 1; display: flex; flex-direction: column; }

.menu__entete {
  position: sticky; top: 0; z-index: 20;
  display: flex; flex-wrap: wrap; gap: var(--e3);
  justify-content: space-between; align-items: center;
  padding: var(--e4) var(--e5);
  background: color-mix(in oklch, var(--surface) 88%, transparent);
  backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--bord);
}
.menu__marque { display: flex; align-items: baseline; gap: var(--e3); flex-wrap: wrap; }
.menu__nom { font-size: var(--t-grand); font-weight: 800; letter-spacing: -0.03em; }
.menu__sousTitre {
  font-size: var(--t-micro); color: var(--encre-faible);
  letter-spacing: 0.16em; text-transform: uppercase;
}

.menu__langues { display: flex; gap: var(--e1); padding: 3px; background: var(--fond-creux); border-radius: var(--rayon-m); }
.menu__langue {
  min-width: 44px; min-height: 32px; padding: 0 var(--e3);
  border: none; border-radius: var(--rayon-s);
  background: transparent; color: var(--encre-faible);
  font-size: var(--t-micro); font-weight: 700; letter-spacing: 0.1em;
  cursor: pointer; transition: background var(--transition), color var(--transition);
}
.menu__langue[data-actif] { background: var(--surface); color: var(--encre); box-shadow: var(--ombre-1); }

.menu__corps { width: 100%; max-width: 860px; margin: 0 auto; padding: var(--e8) var(--e5) var(--e7); }
.menu__surTitre {
  font-size: var(--t-micro); color: var(--action);
  letter-spacing: 0.18em; text-transform: uppercase; font-weight: 700;
  margin-bottom: var(--e4);
}
.menu__titre {
  font-size: var(--t-titre); font-weight: 800; line-height: 1.05;
  letter-spacing: -0.035em; white-space: pre-line; margin-bottom: var(--e4);
  text-wrap: balance;
}
.menu__intro {
  font-size: var(--t-moyen); color: var(--encre-douce);
  line-height: 1.65; max-width: 46ch; margin-bottom: var(--e8);
}
.menu__consigne {
  font-size: var(--t-micro); font-weight: 700; color: var(--encre-faible);
  letter-spacing: 0.18em; text-transform: uppercase; margin-bottom: var(--e4);
}
.menu__liste { display: flex; flex-direction: column; gap: var(--e3); }

.menu__avertissement {
  display: flex; gap: var(--e2); align-items: baseline;
  margin-top: var(--e7); padding: var(--e4);
  background: var(--surface); border: 1px solid var(--bord);
  border-radius: var(--rayon-m);
  font-size: var(--t-petit); color: var(--encre-faible); line-height: 1.6;
}

/* ── Carte de scénario ─────────────────────────────────────────────── */

.scenario {
  display: grid;
  grid-template-columns: 220px 1fr;
  gap: var(--e5);
  align-items: center;
  padding: var(--e4);
  background: var(--surface);
  border: 1px solid var(--bord);
  border-radius: var(--rayon-l);
  box-shadow: var(--ombre-1);
  transition: border-color var(--transition), box-shadow var(--transition), transform var(--transition);
}
@media (hover: hover) {
  .scenario:hover {
    border-color: color-mix(in oklch, var(--teinte) 45%, var(--bord));
    box-shadow: var(--ombre-2);
    transform: translateY(-2px);
  }
}

/* L'aperçu du tracé : l'écran de l'appareil, en miniature.
   `position: relative` est obligatoire — le canvas est absolu, comme sur la
   face de l'appareil ; sans conteneur positionné il s'échappe et recouvre la
   page entière. */
.scenario__trace {
  position: relative;
  height: 56px; border-radius: var(--rayon-m); overflow: hidden;
  background: var(--lcd);
  border: 1px solid color-mix(in oklch, var(--teinte) 40%, var(--coque-bord));
  box-shadow: var(--lcd-ombre);
}

.scenario__texte { min-width: 0; }
.scenario__ligne { display: flex; flex-wrap: wrap; gap: var(--e2) var(--e3); align-items: center; margin-bottom: var(--e1); }
.scenario__label { font-size: var(--t-moyen); font-weight: 700; }
.scenario__etiquette {
  padding: 2px var(--e2);
  border-radius: 100px;
  font-size: 0.625rem; font-weight: 800; letter-spacing: 0.1em; text-transform: uppercase;
  white-space: nowrap;
  color: var(--action); background: var(--action-voile);
  border: 1px solid color-mix(in oklch, var(--action) 30%, transparent);
}
.scenario__etiquette[data-choc] {
  color: var(--urgence); background: var(--urgence-voile);
  border-color: color-mix(in oklch, var(--urgence) 32%, transparent);
}
.scenario__desc { font-size: var(--t-petit); color: var(--encre-douce); }
.scenario__difficulte { display: flex; gap: 5px; margin-top: var(--e2); }
.scenario__cran {
  width: 18px; height: 4px; border-radius: 100px;
  background: var(--bord);
}
.scenario__cran[data-plein] { background: var(--teinte); }
.scenario__actions { display: flex; flex-wrap: wrap; gap: var(--e2); margin-top: var(--e3); }
.scenario__actions .bouton { flex: 1 1 auto; min-width: 140px; }

/* ══ SIMULATION ═════════════════════════════════════════════════════ */

.simulation {
  flex: 1;
  display: grid;
  grid-template-columns: 500px minmax(0, 1fr);
  position: relative;
  background: var(--fond);
  transition: background 0.4s ease;
}

/* Le registre : la couleur de fond suit ce que l'appareil demande. */
.simulation[data-registre='urgence'] {
  background: color-mix(in oklch, var(--urgence-voile) 70%, var(--fond));
}
.simulation[data-eclair] { background: oklch(1 0 0); }
.simulation__flash {
  position: fixed; inset: 0; z-index: 100; pointer-events: none;
  background: oklch(1 0 0);
  animation: eclair-blanc 0.5s ease forwards;
}

.simulation__panneau {
  display: flex; flex-direction: column; align-items: center; gap: var(--e5);
  padding: var(--e6) var(--e5);
  background: var(--surface);
  border-right: 1px solid var(--bord);
  transition: background 0.4s ease;
}
/* Le panneau prend un souffle de la couleur du registre : sans cela il reste
   une île blanche au milieu d'une page qui a basculé. */
.simulation[data-registre='urgence'] .simulation__panneau {
  background: color-mix(in oklch, var(--urgence-voile) 32%, var(--surface));
}

/* L'appareil reste sous les yeux quand la colonne de droite s'allonge —
   deux minutes de RCP, puis le bilan. */
.aed-boite { position: sticky; top: var(--e5); }

.simulation__corps {
  display: flex; flex-direction: column; gap: var(--e5);
  padding: var(--e6) var(--e6);
  min-width: 0;
}
.simulation__entete { display: flex; gap: var(--e4); justify-content: space-between; align-items: flex-start; }
.simulation__surTitre {
  font-size: var(--t-micro); color: var(--encre-faible);
  letter-spacing: 0.16em; text-transform: uppercase; margin-bottom: var(--e1);
}
.simulation__titre { font-size: var(--t-grand); }
.simulation__retour {
  display: inline-flex; align-items: center; gap: var(--e1); flex-shrink: 0;
  min-height: 36px; padding: 0 var(--e3);
  background: transparent; color: var(--encre-faible);
  border: 1px solid var(--bord); border-radius: var(--rayon-s);
  font-size: var(--t-petit); cursor: pointer;
  transition: color var(--transition), border-color var(--transition);
}
.simulation__retour:hover { color: var(--encre); border-color: var(--bord-fort); }
.simulation__zone { flex: 1; }

.pile { display: flex; flex-direction: column; gap: var(--e4); }

/* ── Encarts du panneau ────────────────────────────────────────────── */

.encart {
  width: 100%; padding: var(--e3) var(--e4);
  background: var(--fond-creux); border: 1px solid var(--bord);
  border-radius: var(--rayon-m);
}
.encart__titre {
  font-size: 0.625rem; color: var(--encre-faible);
  letter-spacing: 0.16em; text-transform: uppercase; margin-bottom: var(--e2);
}
.encart__ligne { display: flex; gap: var(--e2); align-items: center; }
.encart__pastille { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
.encart__valeur { font-size: var(--t-petit); font-weight: 600; }
.encart__badge {
  display: inline-block; margin-top: var(--e2); padding: 3px var(--e2);
  background: var(--savoir-voile); color: var(--savoir);
  border: 1px solid color-mix(in oklch, var(--savoir) 30%, transparent);
  border-radius: 100px;
  font-size: 0.625rem; font-weight: 800; letter-spacing: 0.1em; text-transform: uppercase;
}
.encart__score { font-size: var(--t-grand); font-weight: 800; font-variant-numeric: tabular-nums; }
.encart__score span { font-size: var(--t-petit); color: var(--encre-faible); font-weight: 400; }
.encart__rail { margin-top: var(--e2); height: 4px; background: var(--bord); border-radius: 100px; overflow: hidden; }
.encart__barre { height: 100%; background: var(--succes); border-radius: 100px; transition: width 0.4s ease; }

/* ══ APPAREIL ═══════════════════════════════════════════════════════
   D'après la remise « AED / Défibrillateur ». Toutes les valeurs de couleur
   passent par des jetons : le graphite et le blanc clinique sont deux thèmes
   d'un même composant, jamais deux copies.
   ══════════════════════════════════════════════════════════════════ */

/* La poignée doit passer DERRIÈRE la coque sans qu'un z-index négatif ne la
   fasse peindre sous le fond de la page. D'où cette boîte englobante. */
.aed-boite { position: relative; z-index: 0; padding-top: 30px; width: 420px; }

.aed__poignee {
  position: absolute; top: 0; left: 50%; transform: translateX(-50%); z-index: 0;
  width: 196px; height: 62px;
  background: var(--poignee);
  border-radius: 30px 30px 8px 8px;
  box-shadow: 0 0 0 1px var(--poignee-bord);
}
.aed__poignee::after {
  content: ''; position: absolute;
  left: 24px; right: 24px; top: 20px; bottom: -2px;
  background: var(--poignee-creux);
  border-radius: 20px 20px 0 0;
  box-shadow: 0 0 0 1px var(--poignee-creux-bord);
}

.aed {
  position: relative; z-index: 1;
  width: 420px;
  display: flex; flex-direction: column; gap: 20px;
  padding: 30px 26px 26px;
  background: var(--coque);
  border-radius: 34px;
  box-shadow: var(--coque-ombre), 0 0 0 1px var(--coque-bord);
}
/* Le lustre diagonal de la coque. */
.aed::before {
  content: ''; position: absolute; inset: 5px; pointer-events: none;
  border-radius: 29px; background: var(--coque-lustre);
}

.aed__vis {
  position: absolute; width: 9px; height: 9px; border-radius: 50%;
  background: var(--vis); box-shadow: 0 0 0 1px var(--vis-bord);
}
.aed__vis::after {
  content: ''; position: absolute; inset: 0;
  border-top: 1.5px solid var(--vis-fente); transform: rotate(35deg);
}
.aed__vis[data-coin='hg'] { top: 14px; left: 14px; }
.aed__vis[data-coin='hd'] { top: 14px; right: 14px; }
.aed__vis[data-coin='bg'] { bottom: 14px; left: 14px; }
.aed__vis[data-coin='bd'] { bottom: 14px; right: 14px; }

/* ── Marque ── */

.aed__marque { display: flex; justify-content: space-between; align-items: flex-end; }
.aed__nom {
  font-family: 'Barlow Condensed', 'DM Sans', sans-serif;
  font-weight: 700; font-size: 34px; letter-spacing: 0.22em; line-height: 0.9;
  color: var(--nom-encre); text-shadow: var(--nom-ombre);
}
.aed__nom span { color: var(--nom-accent); }
.aed__modele {
  font-family: var(--mono); font-weight: 400; font-size: 9px;
  letter-spacing: 0.24em; line-height: 1.7; text-align: right;
  color: var(--micro-encre);
}

/* ── Écran ── */

.aed__cadre { border-radius: 16px; padding: 11px; background: var(--cadre); box-shadow: var(--cadre-ombre); }

.aed__ecran {
  position: relative; height: 150px; border-radius: 9px; overflow: hidden;
  background: var(--lcd); box-shadow: var(--lcd-ombre);
}
.aed__quadrillage {
  position: absolute; inset: 0;
  background-image:
    linear-gradient(to right, var(--lcd-quadrillage) 1px, transparent 1px),
    linear-gradient(to bottom, var(--lcd-quadrillage) 1px, transparent 1px);
  background-size: 22px 22px;
}
.ecg { position: absolute; inset: 0; width: 100%; height: 100%; image-rendering: pixelated; }

.aed__releve {
  position: absolute; left: 12px; right: 12px; top: 10px;
  display: flex; justify-content: space-between; align-items: flex-start;
  font-family: var(--mono); font-size: 9px; letter-spacing: 0.16em;
  color: var(--releve); text-shadow: var(--releve-lueur);
}
.aed__bandeau {
  position: absolute; left: 0; right: 0; bottom: 12px; text-align: center;
  font-family: 'Barlow Condensed', 'DM Sans', sans-serif;
  font-weight: 700; font-size: 19px; letter-spacing: 0.20em;
  color: var(--etat-teinte); text-shadow: var(--etat-lueur);
  transition: color 0.3s;
}
.aed__jauge {
  position: absolute; left: 0; bottom: 0; height: 3px;
  background: var(--etat-teinte); box-shadow: var(--etat-jauge-lueur);
  transition: width 0.12s linear;
}
.aed__balayage {
  position: absolute; inset: 0; pointer-events: none;
  background: repeating-linear-gradient(to bottom, var(--lcd-balayage) 0 1px, transparent 1px 3px);
}
.aed__verre { position: absolute; inset: 0; pointer-events: none; background: var(--lcd-verre); }

/* La teinte du bandeau et de la jauge suit l'état de l'appareil. */
.aed { --etat-teinte: oklch(0.42 0.13 158); --etat-lueur: 0 1px 0 rgba(255,255,255,.8); --etat-jauge-lueur: none; }
.aed[data-etat='analyse'] { --etat-teinte: oklch(0.44 0.15 245); }
.aed[data-etat='advised'],
.aed[data-etat='charge']  { --etat-teinte: oklch(0.50 0.20 42); }
.aed[data-etat='ready']   { --etat-teinte: oklch(0.48 0.21 40); }
.aed[data-etat='rcp']     { --etat-teinte: oklch(0.48 0.19 28); }

@media (prefers-color-scheme: dark) {
  .aed { --etat-teinte: oklch(0.80 0.16 155); --etat-lueur: 0 0 16px currentColor; --etat-jauge-lueur: 0 0 12px var(--etat-teinte); }
  .aed[data-etat='analyse'] { --etat-teinte: oklch(0.80 0.16 232); }
  .aed[data-etat='advised'],
  .aed[data-etat='charge']  { --etat-teinte: oklch(0.82 0.20 48); }
  .aed[data-etat='ready']   { --etat-teinte: oklch(0.86 0.20 55); }
  .aed[data-etat='rcp']     { --etat-teinte: oklch(0.80 0.18 28); }
}

/* ── Haut-parleur ── */

.aed__hp { display: grid; grid-template-columns: repeat(28, 1fr); gap: 4px; padding: 0 26px; }
.aed__hp i { aspect-ratio: 1; border-radius: 50%; background: var(--hp-trou); box-shadow: var(--hp-relief); }

/* ── Électrodes ── */

.aed__electrodes {
  display: flex; align-items: center; gap: 14px;
  padding: 14px 16px; border-radius: 14px;
  background: var(--pan); box-shadow: var(--pan-ombre);
  color: var(--sourd);
  transition: box-shadow 0.35s;
}
/* Un appel à l'action : les électrodes attendent d'être posées. */
.aed__electrodes[data-appel] { box-shadow: var(--pan-appel); }
.aed__electrodesTitre {
  font-family: var(--mono); font-size: 8px; letter-spacing: 0.22em;
  text-transform: uppercase; color: var(--micro-encre);
}
.aed__electrodesEtat { margin-top: 3px; font-size: 13px; font-weight: 700; color: var(--sourd); transition: color 0.3s; }
.aed__electrodes[data-appel] .aed__electrodesEtat { color: oklch(0.46 0.15 156); }
@media (prefers-color-scheme: dark) {
  .aed__electrodes[data-appel] .aed__electrodesEtat { color: oklch(0.78 0.16 155); }
}

/* ── Bouton de choc ── */

.aed__logement {
  margin: 2px auto 0; width: 172px; height: 172px; border-radius: 50%;
  display: grid; place-items: center;
  background: var(--puits); box-shadow: var(--puits-ombre);
}
.aed__choc, .aed__marche {
  width: 132px; height: 132px; border-radius: 50%; border: 0;
  display: grid; place-items: center; gap: 2px;
  font-family: 'Barlow Condensed', 'DM Sans', sans-serif;
  cursor: pointer;
  transition: transform 0.09s, box-shadow 0.3s, background 0.3s, color 0.3s;
}
.aed__signe { font-size: 44px; line-height: 1; }
.aed__texte { font-weight: 700; font-size: 15px; letter-spacing: 0.26em; }

.aed__choc { background: var(--choc-repos); color: var(--choc-encre); box-shadow: var(--choc-ombre); }
.aed__choc .aed__signe { filter: grayscale(1) brightness(1.35) opacity(.55); }
@media (prefers-color-scheme: dark) {
  .aed__choc .aed__signe { filter: grayscale(1) brightness(.55); }
}
.aed__choc[data-arme] {
  background: radial-gradient(circle at 50% 24%, oklch(0.74 0.20 55), oklch(0.55 0.24 38) 62%, oklch(0.40 0.20 32) 100%);
  color: #fff5ec;
  animation: arme 1.05s ease-in-out infinite;
}
.aed__choc[data-arme] .aed__signe { filter: none; text-shadow: 0 0 22px rgba(255,210,140,.9); }
.aed__choc[data-arme]:active { transform: scale(0.955); }
.aed__choc:disabled { cursor: not-allowed; }

.aed__marche {
  background: radial-gradient(circle at 50% 24%, oklch(0.66 0.17 152), oklch(0.48 0.15 152) 62%, oklch(0.36 0.12 152) 100%);
  color: #f2fff6;
  box-shadow: 0 8px 18px -6px oklch(0.40 0.12 152 / .6), 0 1px 0 rgba(255,255,255,.14) inset;
}
.aed__marche:hover { filter: brightness(1.08); }
.aed__marche:active { transform: scale(0.955); }

@keyframes arme {
  0%, 100% { box-shadow: 0 10px 20px -8px oklch(0.50 0.20 35 / .45), 0 0 0 0 oklch(0.62 0.24 42 / .40), 0 0 30px -6px oklch(0.62 0.24 42 / .45); }
  50%      { box-shadow: 0 10px 20px -8px oklch(0.50 0.20 35 / .5), 0 0 0 15px oklch(0.62 0.24 42 / 0), 0 0 52px 0 oklch(0.66 0.25 45 / .7); }
}
@media (prefers-color-scheme: dark) {
  @keyframes arme {
    0%, 100% { box-shadow: 0 8px 18px -6px #000, 0 0 0 0 oklch(0.62 0.24 42 / .55), 0 0 34px -4px oklch(0.62 0.24 42 / .6); }
    50%      { box-shadow: 0 8px 18px -6px #000, 0 0 0 16px oklch(0.62 0.24 42 / 0), 0 0 60px 2px oklch(0.68 0.26 45 / .85); }
  }
}

/* ── Rail de voyants ── */

.aed__rail {
  display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px;
  padding-top: 6px; border-top: 1px solid var(--rail-filet);
}
.aed__voyant { display: flex; flex-direction: column; align-items: center; gap: 7px; }
.aed__voyant i {
  width: 12px; height: 12px; border-radius: 50%;
  background: var(--led-eteinte);
  box-shadow: 0 0 0 1px var(--led-bord), var(--led-relief);
  transition: background 0.3s, box-shadow 0.3s;
}
.aed__voyant[data-allume] i {
  background: var(--c);
  box-shadow: 0 0 0 1px rgba(255,255,255,.9), 0 0 14px 1px var(--c), 0 0 5px rgba(255,255,255,.5) inset;
}
@media (prefers-color-scheme: dark) {
  .aed__voyant[data-allume] i {
    box-shadow: 0 0 0 1px #0a0c0e, 0 0 16px 1px var(--c), 0 0 5px var(--c) inset;
  }
}
.aed__voyant[data-clignote] i { animation: clignote-led 0.62s steps(1, end) infinite; }
@keyframes clignote-led { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0.14; } }

.aed__voyant b {
  font-family: var(--mono); font-weight: 400; font-size: 8px;
  letter-spacing: 0.14em; color: var(--micro-encre);
}
.aed__voyant[data-allume] b { color: var(--led-titre-on); }

/* ══ CARTE D'INSTRUCTION ════════════════════════════════════════════ */

.carte {
  padding: var(--e5);
  background: var(--surface);
  border: 1px solid var(--bord);
  border-left: 3px solid var(--bord-fort);
  border-radius: var(--rayon-l);
  box-shadow: var(--ombre-1);
  animation: monte 0.3s ease;
  transition: border-color var(--transition);
}
.carte[data-urgent] {
  background: var(--surface);
  border-color: var(--urgence-bord);
  border-left-color: var(--urgence);
  box-shadow: var(--ombre-2);
}
.carte__icone { font-size: 1.75rem; line-height: 1; margin-bottom: var(--e3); }
.carte__titre { font-size: var(--t-moyen); margin-bottom: var(--e2); text-wrap: balance; }
.carte[data-urgent] .carte__titre { color: var(--urgence-texte); letter-spacing: 0.01em; }
.carte__corps { color: var(--encre-douce); line-height: 1.7; max-width: 62ch; }
.carte__corps[data-suivi] { margin-bottom: var(--e5); }

.carte__progression[data-suivi] { margin-bottom: var(--e4); }
.carte__progressionValeur {
  font-size: var(--t-micro); color: var(--encre-faible); font-family: var(--mono);
  font-variant-numeric: tabular-nums; letter-spacing: 0.06em; margin-bottom: var(--e2);
}
.carte__rail { height: 6px; background: var(--fond-creux); border-radius: 100px; overflow: hidden; }
.carte__barre { height: 100%; border-radius: 100px; transition: width 0.12s linear; }

.carte__points { display: flex; gap: var(--e1); }
.carte__points span {
  width: 7px; height: 7px; border-radius: 50%;
  background: var(--encre-tenue); animation: rebond 1.1s ease-in-out infinite;
}

.carte__action {
  display: inline-flex; align-items: center; justify-content: center; gap: var(--e2);
  min-height: 46px; margin-top: var(--e4); padding: var(--e3) var(--e5);
  border: none; border-radius: var(--rayon-m);
  background: var(--action); color: oklch(1 0 0);
  font-size: var(--t-petit); font-weight: 700;
  cursor: pointer; transition: filter var(--transition), transform 0.1s;
}
.carte__action:hover { filter: brightness(1.08); }
.carte__action:active { transform: scale(0.985); }
.carte__action[data-clignote] { animation: pouls-urgence 1.2s ease infinite; }

/* ══ DIAGRAMME DES ÉLECTRODES ═══════════════════════════════════════ */

.diagramme {
  display: flex; gap: var(--e5); align-items: center;
  padding: var(--e4) var(--e5);
  background: var(--surface); border: 1px solid var(--bord);
  border-radius: var(--rayon-l); box-shadow: var(--ombre-1);
  animation: monte 0.4s ease 0.1s both;
}
.diagramme__svg { flex-shrink: 0; }
.diagramme__svg path, .diagramme__svg ellipse[stroke] { stroke: var(--bord-fort); }
.diagramme__liste { display: flex; flex-direction: column; gap: var(--e3); }
.diagramme__ligne { display: flex; gap: var(--e3); align-items: flex-start; }
.diagramme__puce {
  display: grid; place-items: center; flex-shrink: 0;
  width: 22px; height: 22px; border-radius: var(--rayon-s);
  font-size: var(--t-micro); font-weight: 800; color: oklch(1 0 0);
}
.diagramme__texte { font-size: var(--t-petit); color: var(--encre-douce); }

/* ══ QUIZ ═══════════════════════════════════════════════════════════ */

.quiz {
  padding: var(--e5);
  background: var(--surface);
  border: 1px solid var(--bord);
  border-left: 3px solid var(--savoir);
  border-radius: var(--rayon-l);
  box-shadow: var(--ombre-1);
  animation: surgit 0.28s ease;
}
.quiz__entete { display: flex; gap: var(--e2); align-items: center; margin-bottom: var(--e4); }
.quiz__pastille {
  display: grid; place-items: center;
  width: 28px; height: 28px; border-radius: var(--rayon-s);
  background: var(--savoir-voile); font-size: 0.875rem;
}
.quiz__etiquette {
  font-size: 0.625rem; font-weight: 800; letter-spacing: 0.16em;
  text-transform: uppercase; color: var(--savoir);
}
.quiz__question { font-size: var(--t-moyen); margin-bottom: var(--e5); text-wrap: pretty; }
.quiz__question[data-secoue] { animation: secoue 0.4s ease; }

.quiz__options { display: flex; flex-direction: column; gap: var(--e2); }
.quiz__option {
  display: flex; gap: var(--e3); align-items: center;
  min-height: 48px; padding: var(--e3) var(--e4);
  background: var(--fond-creux);
  border: 1.5px solid var(--bord);
  border-radius: var(--rayon-m);
  font-size: var(--t-petit); font-weight: 500; text-align: left;
  cursor: pointer; transition: background var(--transition), border-color var(--transition), color var(--transition);
}
.quiz__option:disabled { cursor: default; }
.quiz__option[data-etat='juste'] { background: var(--action-voile); border-color: var(--succes); color: var(--action-texte); }
.quiz__option[data-etat='faux']  { background: var(--urgence-voile); border-color: var(--urgence); color: var(--urgence-texte); }

.quiz__lettre {
  display: grid; place-items: center; flex-shrink: 0;
  width: 24px; height: 24px; border-radius: var(--rayon-s);
  background: var(--bord); color: var(--encre-faible);
  font-size: var(--t-micro); font-weight: 800;
  transition: background var(--transition), color var(--transition);
}
.quiz__option[data-etat='juste'] .quiz__lettre { background: var(--succes); color: oklch(1 0 0); }
.quiz__option[data-etat='faux']  .quiz__lettre { background: var(--urgence); color: oklch(1 0 0); }

.quiz__explication {
  margin-top: var(--e4); padding: var(--e3) var(--e4);
  border-radius: var(--rayon-m); font-size: var(--t-petit); line-height: 1.6;
  animation: monte 0.3s ease;
}
.quiz__explication[data-etat='juste'] {
  background: var(--action-voile); color: var(--action-texte);
  border: 1px solid color-mix(in oklch, var(--succes) 40%, transparent);
}
.quiz__explication[data-etat='faux'] {
  background: var(--urgence-voile); color: var(--urgence-texte);
  border: 1px solid color-mix(in oklch, var(--urgence) 40%, transparent);
}

/* ══ BARRE D'ÉTAPES ═════════════════════════════════════════════════ */

.etapes { display: flex; align-items: flex-start; }
.etapes__item { display: flex; align-items: center; flex: 1; min-width: 0; }
.etapes__item:last-child { flex: 0 0 auto; }
.etapes__jalon { display: flex; flex-direction: column; align-items: center; gap: var(--e1); }
.etapes__pastille {
  display: grid; place-items: center; flex-shrink: 0;
  width: 26px; height: 26px; border-radius: 50%;
  background: var(--bord); color: var(--encre-faible);
  font-size: var(--t-micro); font-weight: 700; font-variant-numeric: tabular-nums;
  transition: background var(--transition), color var(--transition);
}
.etapes__pastille[data-etat='franchie'] { background: var(--succes); color: oklch(1 0 0); }
.etapes__pastille[data-etat='active']   { background: var(--encre); color: var(--fond); }
.etapes__libelle { font-size: 0.625rem; color: var(--encre-tenue); white-space: nowrap; }
.etapes__libelle[data-active] { color: var(--encre-douce); font-weight: 600; }
.etapes__trait {
  flex: 1; min-width: 8px; height: 2px; margin-bottom: 18px;
  background: var(--bord); transition: background 0.4s;
}
.etapes__trait[data-franchie] { background: var(--succes); }

/* ══ GUIDE RCP ══════════════════════════════════════════════════════ */

.rcp { display: flex; flex-direction: column; align-items: center; gap: var(--e4); animation: monte 0.4s ease; }

.rcp__scene {
  width: 100%; overflow: hidden;
  background: var(--surface); border: 1px solid var(--bord);
  border-radius: var(--rayon-l); box-shadow: var(--ombre-1);
}
.rcp__phase {
  padding: var(--e2) var(--e4);
  border-bottom: 1px solid var(--bord);
  font-size: 0.625rem; font-weight: 800; letter-spacing: 0.16em; text-transform: uppercase;
  background: var(--urgence-voile); color: var(--urgence-texte);
  transition: background var(--transition), color var(--transition);
}
.rcp__phase[data-phase='insufflation'] { background: var(--calme-voile); color: var(--calme); }
.bilan__controle { color: var(--urgence-texte); }
.rcp__vignette { padding: var(--e3) 0; }
.scene__svg { display: block; margin: 0 auto; width: 100%; max-width: 440px; height: auto; }
.scene__legende { font-size: 9px; fill: var(--encre-faible); font-family: 'DM Sans', sans-serif; }

.rcp__minuteur { display: flex; gap: var(--e5); align-items: center; }
.rcp__chrono {
  font-family: var(--mono); font-size: var(--t-petit); color: var(--encre-faible);
  letter-spacing: 0.12em; font-variant-numeric: tabular-nums;
}
.rcp__rail { width: 140px; height: 4px; background: var(--bord); border-radius: 100px; overflow: hidden; }
.rcp__barre { display: block; height: 100%; background: var(--succes); border-radius: 100px; transition: width 0.6s linear; }

.rcp__compteur {
  display: flex; gap: var(--e4); align-items: center; justify-content: space-between;
  width: 100%; padding: var(--e4) var(--e5);
  background: var(--surface);
  border: 1.5px solid var(--urgence-bord);
  border-radius: var(--rayon-l); box-shadow: var(--ombre-1);
  transition: border-color var(--transition);
}
.rcp__compteur[data-phase='insufflation'] { border-color: color-mix(in oklch, var(--calme) 40%, transparent); }
.rcp__compteurTitre { font-size: var(--t-petit); color: var(--encre-faible); }
.rcp__compteurValeur {
  font-size: 1.75rem; font-weight: 800; letter-spacing: -0.03em;
  font-variant-numeric: tabular-nums;
}
.rcp__bouton {
  display: grid; place-items: center; flex-shrink: 0;
  width: 76px; height: 76px; border-radius: 50%; border: none;
  background: var(--urgence); color: oklch(1 0 0); font-size: 1.75rem;
  cursor: pointer;
  box-shadow: 0 6px 24px oklch(0.55 0.21 34 / 0.35);
  transition: transform 0.08s, background var(--transition);
}
.rcp__bouton[data-phase='insufflation'] {
  background: var(--calme); box-shadow: 0 6px 24px oklch(0.50 0.14 232 / 0.35);
}
.rcp__bouton[data-enfonce] { transform: scale(0.88); }
.rcp__consigne { font-size: var(--t-petit); color: var(--encre-faible); }

.rcp__jauge { display: flex; gap: 3px; flex-wrap: wrap; justify-content: center; max-width: 340px; }
.rcp__jauge span {
  width: 7px; height: 20px; border-radius: 100px;
  background: var(--bord); transition: background 0.1s;
}
.rcp__jauge span[data-rempli] { background: var(--urgence); }

/* ══ BILAN ══════════════════════════════════════════════════════════ */

.bilan { display: flex; flex-direction: column; gap: var(--e4); animation: monte 0.4s ease; }

.bilan__verdict {
  padding: var(--e5);
  background: var(--urgence-voile);
  border: 1px solid var(--urgence-bord);
  border-radius: var(--rayon-l); box-shadow: var(--ombre-1);
}
.bilan__verdict[data-reussi] {
  background: var(--action-voile);
  border-color: color-mix(in oklch, var(--succes) 40%, transparent);
}
.bilan__marque {
  display: grid; place-items: center;
  width: 40px; height: 40px; margin-bottom: var(--e3);
  border-radius: 50%; background: var(--urgence); color: oklch(1 0 0);
  font-size: 1.25rem; font-weight: 700;
}
.bilan__verdict[data-reussi] .bilan__marque { background: var(--succes); }
.bilan__titre { font-size: var(--t-grand); margin-bottom: var(--e2); }
.bilan__lecon { font-size: var(--t-petit); color: var(--encre-douce); line-height: 1.7; max-width: 62ch; }

.bilan__bloc {
  padding: var(--e4) var(--e5);
  background: var(--surface); border: 1px solid var(--bord);
  border-radius: var(--rayon-l); box-shadow: var(--ombre-1);
}
.bilan__sousTitre {
  font-size: 0.625rem; font-weight: 700; color: var(--encre-faible);
  letter-spacing: 0.16em; text-transform: uppercase; margin-bottom: var(--e3);
}
.bilan__score { display: flex; align-items: baseline; gap: var(--e2); }
.bilan__scoreValeur { font-size: 2.25rem; font-weight: 800; font-variant-numeric: tabular-nums; letter-spacing: -0.03em; }
.bilan__scoreTexte { font-size: var(--t-petit); color: var(--encre-faible); }
.bilan__rail { margin-top: var(--e3); height: 8px; background: var(--fond-creux); border-radius: 100px; overflow: hidden; }
.bilan__barre { height: 100%; border-radius: 100px; transition: width 0.8s ease; }

.bilan__controles { display: flex; flex-direction: column; }
.bilan__controle {
  display: flex; gap: var(--e3); align-items: center;
  padding: var(--e3) 0; border-bottom: 1px solid var(--bord);
  font-size: var(--t-petit); color: var(--urgence-texte);
}
.bilan__controle:last-child { border-bottom: none; }
.bilan__controle[data-fait] { color: var(--encre-douce); }
.bilan__puce {
  display: grid; place-items: center; flex-shrink: 0;
  width: 22px; height: 22px; border-radius: 50%;
  background: var(--urgence-voile); color: var(--urgence-texte);
  font-size: var(--t-micro); font-weight: 700;
  border: 1px solid color-mix(in oklch, var(--urgence) 35%, transparent);
}
.bilan__controle[data-fait] .bilan__puce { background: var(--succes); color: oklch(1 0 0); border-color: transparent; }
.bilan__reference { margin-top: var(--e4); font-size: var(--t-micro); color: var(--encre-faible); }

.bilan__rejouer {
  display: flex; align-items: center; justify-content: center; gap: var(--e2);
  min-height: 48px; padding: var(--e3) var(--e5);
  background: var(--encre); color: var(--fond);
  border: none; border-radius: var(--rayon-m);
  font-size: var(--t-petit); font-weight: 700; cursor: pointer;
  transition: filter var(--transition);
}
.bilan__rejouer:hover { filter: brightness(1.25); }

/* ══ ALERTES ════════════════════════════════════════════════════════ */

.alertes {
  padding: var(--e3) var(--e4);
  background: var(--urgence-voile);
  border: 1px solid var(--urgence-bord);
  border-left: 3px solid var(--urgence);
  border-radius: var(--rayon-m);
}
.alertes__ligne {
  display: flex; gap: var(--e2); align-items: flex-start;
  font-size: var(--t-petit); color: var(--urgence-texte);
}
.alertes__ligne span { flex-shrink: 0; }

/* ════════════════════════════════════════════════════════════════════
   PALIER INTERMÉDIAIRE — deux colonnes resserrées
   ════════════════════════════════════════════════════════════════════ */

@media (max-width: 1080px) {
  .simulation { grid-template-columns: 340px minmax(0, 1fr); }
  .simulation__corps { padding: var(--e5) var(--e5); }
  .simulation__panneau { padding: var(--e5) var(--e4); }
  /* La remise l'impose : mettre la coque à l'échelle, jamais la refluer —
     ses proportions internes font partie du dessin de l'objet. */
  .aed-boite { top: var(--e4); transform: scale(0.72); transform-origin: top center; height: 380px; }
  .scenario { grid-template-columns: 160px 1fr; gap: var(--e4); }
}

/* ════════════════════════════════════════════════════════════════════
   PALIER TÉLÉPHONE — l'appareil devient un bandeau, la touche descend

   Un DEA se tient d'une main : la seule action possible doit rester sous
   le pouce, quoi qu'on ait fait défiler. Le boîtier perd donc sa forme
   d'objet et se répartit en deux : le bandeau d'état en haut, la touche
   en barre collante en bas.
   ════════════════════════════════════════════════════════════════════ */

@media (max-width: 720px) {
  .menu__entete { padding: var(--e3) var(--e4); }
  .menu__marque { gap: var(--e2); }
  .menu__sousTitre { display: none; }
  .menu__corps { padding: var(--e6) var(--e4) var(--e7); }
  .menu__intro { font-size: var(--t-base); margin-bottom: var(--e6); }

  .scenario { grid-template-columns: 1fr; gap: var(--e3); padding: var(--e3); }
  .scenario__trace { height: 48px; }
  .scenario__actions .bouton { flex: 1 1 100%; }

  /* ── L'écran de simulation passe en une colonne ── */
  .simulation {
    grid-template-columns: 1fr;
    grid-template-rows: auto minmax(0, 1fr);
    padding-bottom: 92px;               /* place pour la barre d'action */
  }

  .simulation__panneau {
    position: sticky; top: 0; z-index: 30;
    flex-direction: column; gap: var(--e3);
    padding: var(--e3) var(--e4);
    border-right: none; border-bottom: 1px solid var(--bord);
    box-shadow: var(--ombre-1);
  }

  /* ── Sous le pouce, l'appareil se sépare en deux ──
     La remise décrit une coque de 420 px mise à l'échelle. À 375 px de large,
     cela donne un objet qui mange l'écran entier et une touche qu'il faut
     aller chercher en faisant défiler. On garde donc la décomposition arbitrée
     pour le téléphone — bandeau d'état en haut, touche en barre sous le pouce —
     mais habillée des matières et des couleurs de la remise. */
  .aed-boite {
    position: static; width: 100%; padding-top: 0; transform: none; height: auto;
  }
  .aed {
    width: 100%;
    display: grid;
    grid-template-areas: 'ecran ecran' 'electrodes rail';
    grid-template-columns: 1fr auto;
    gap: var(--e2) var(--e3);
    padding: 0; background: none; border-radius: 0; box-shadow: none;
  }
  .aed::before, .aed__poignee, .aed__vis, .aed__marque, .aed__hp { display: none; }

  .aed__cadre { grid-area: ecran; padding: 5px; border-radius: 10px; }
  .aed__ecran { height: 60px; transition: height 0.35s var(--transition); }
  .aed[data-eteint] .aed__ecran { height: 26px; }

  /* Sur 60 px de haut, le relevé et le bandeau d'état se télescopent : le
     relevé technique cède la place, l'état ne le peut pas. */
  .aed__releve { display: none; }
  .aed__bandeau { bottom: 4px; font-size: 15px; letter-spacing: 0.16em; }

  .aed__electrodes { grid-area: electrodes; padding: var(--e2) var(--e3); }
  .aed__electrodesEtat { white-space: nowrap; }

  /* Le geste est déjà porté par la barre du bas : la carte ne le répète pas. */
  .carte__action[data-doublee] { display: none; }
  .carte__corps[data-suivi] { margin-bottom: 0; }
  .aed__rail { grid-area: rail; gap: var(--e3); padding-top: 0; border-top: none; align-items: center; }

  /* La touche quitte la coque et devient la barre d'action. */
  .aed__logement {
    position: fixed; z-index: 40;
    left: var(--e3); right: var(--e3); bottom: var(--e3);
    width: auto; height: auto; margin: 0;
    display: block; border-radius: var(--rayon-l);
    background: none; box-shadow: none;
  }
  .aed__choc, .aed__marche {
    display: flex; align-items: center; justify-content: center; gap: var(--e2);
    width: 100%; height: auto; min-height: 62px;
    border-radius: var(--rayon-l);
    padding-bottom: env(safe-area-inset-bottom, 0);
  }
  /* Un dégradé radial étiré sur une barre fait une tache : on le remet à plat. */
  .aed__choc[data-arme] {
    background: linear-gradient(180deg, oklch(0.66 0.23 46), oklch(0.55 0.24 38));
  }
  .aed__marche { background: linear-gradient(180deg, oklch(0.58 0.16 152), oklch(0.46 0.15 152)); }
  .aed__signe { font-size: 1.35rem; }
  .aed__texte { font-size: var(--t-base); letter-spacing: 0.14em; }

  .encart { padding: var(--e2) var(--e3); }
  .encart__badge { margin-top: var(--e1); }

  .simulation__corps { padding: var(--e4); gap: var(--e4); }
  .simulation__titre { font-size: var(--t-moyen); }

  /* Les étapes deviennent des pastilles seules : les libellés ne tiennent pas. */
  .etapes__libelle { display: none; }
  .etapes__trait { margin-bottom: 0; }
  .etapes__pastille { width: 22px; height: 22px; }

  .carte, .quiz { padding: var(--e4); }
  .diagramme { flex-direction: column; align-items: flex-start; gap: var(--e3); padding: var(--e4); }

  .rcp__compteur { padding: var(--e3) var(--e4); }
  .rcp__bouton { width: 64px; height: 64px; font-size: 1.5rem; }
  .rcp__minuteur { flex-direction: column; gap: var(--e2); }
  .rcp__jauge { max-width: 100%; }

  .bilan__bloc, .bilan__verdict { padding: var(--e4); }
}

@media (max-width: 380px) {
  .menu__langues { padding: 2px; }
  .menu__langue { min-width: 38px; padding: 0 var(--e2); }
  .rcp__jauge span { width: 6px; height: 16px; }
}
