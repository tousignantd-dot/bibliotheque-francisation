function renderCorr(elId,data,orig){
  const fb=document.getElementById(elId);
  const corr=data.corrige||data.corrected||'';
  const errs=data.erreurs||data.errors||[];
  let html='<div class="fb-t">Rétroaction privée</div>';
  if(data.corpsCorrige!==undefined){   // réponse de /api/correct-email
    const cmt=(data.commentairePertinence||'').trim();
    if(cmt) html+='<div class="fb-c">'+(data.pertinent?'✅ ':'⚠️ ')+esc(cmt)+'</div>';
    else if(data.pertinent) html+='<div class="fb-c">✅ Ton courriel contient tout ce qui était demandé.</div>';
    html+='<div class="fb-c">✍️ '+esc(data.corpsCorrige)+'</div>';
    (data.erreurs||[]).forEach(e=>{ html+='<div class="fb-e">'+esc(e.explication||e.explanation||e)+'</div>'; });
    fb.innerHTML=html; fb.classList.add('on'); return;
  }
  if(data.memePhrase){ html+='<div class="fb-c">✅ Ton texte est déjà correct. Bravo !</div>'; }
  else{
    if(corr) html+='<div class="fb-c">✍️ '+esc(corr)+'</div>';
    errs.forEach(e=>{ html+='<div class="fb-e">'+esc(e.explication||e.explanation||e)+'</div>'; });
  }
  fb.innerHTML=html; fb.classList.add('on');
}
function corrSummary(data,orig){
  if(data.corpsCorrige!==undefined){   // réponse de /api/correct-email
    const es=(data.erreurs||[]).map(e=>e.explication||e.explanation||e);
    return (data.pertinent?'Contenu conforme. ':'Contenu incomplet : '+(data.commentairePertinence||'')+' ')
      +'Correction : '+data.corpsCorrige+(es.length?' | '+es.join(' '):'');
  }
  const corr=data.corrige||data.corrected||'';
  const errs=data.erreurs||data.errors||[];
  if(data.memePhrase) return "Phrase correcte : "+(corr||orig);
  return "Correction : "+corr+(errs.length?' | '+errs.map(e=>e.explication||e.explanation||e).join(' '):'');
}
function showErr(id,msg){ const e=document.getElementById(id); if(e){e.textContent=msg; e.classList.add('on');} }
function hideErr(id){ const e=document.getElementById(id); if(e)e.classList.remove('on'); }

// ── JEU DE RÔLE AVEC L'ASSISTANT ──────────────────────────────────────
// Le client ne connaît que la partie publique des annonces. Ce que sait le
// personnage joué par l'assistant vit dans server.py — sinon un coup d'œil au
// code source de la page suffirait à vider l'exercice de son sens.
const JR = {log:'vaisselier', role:'assuree', hist:[], occupe:false, voix:false, rec:null};

const jrSRC = () => window.SpeechRecognition || window.webkitSpeechRecognition;

// Le mode voix ne change que l'entrée et la sortie : même conversation, même
// endpoint. Le texte reste affiché — au niveau 4, du pur audio décroche
// l'élève dès la première réplique mal saisie.
function jrModeVoix(on){
  if(on && !jrSRC()){
    showErr('jrErr',"Ce navigateur ne fait pas la reconnaissance vocale. Essaie avec Chrome, Edge ou Safari.");
    return;
  }
  JR.voix=on;
  document.querySelectorAll('#jrModes .jr-opt').forEach(b=>
    b.classList.toggle('on', (b.dataset.mode==='voix')===on));
  document.getElementById('jrMicZone').classList.toggle('hidden', !on);
  document.getElementById('jrInput').placeholder =
    on ? 'Ce que le micro a entendu — corrige avant d\'envoyer…' : 'Écris ta question…';
  if(!on){ jrTaire(); }
}

let jrAudio=null;

function jrTaire(){
  try{ speechSynthesis.cancel(); }catch(e){}
  if(jrAudio){ try{ jrAudio.pause(); }catch(e){} jrAudio=null; }
}

function jrVoixFr(){
  const v=speechSynthesis.getVoices().filter(x=>/^fr/i.test(x.lang));
  return v.find(x=>/fr[-_]CA/i.test(x.lang)) || v[0] || null;
}

// Voix du navigateur : moins belle, mais immédiate et gratuite. Sert de repli
// dès que la voix du serveur échoue, pour qu'une panne de synthèse dégrade le
// son sans interrompre la conversation.
function jrDireNavigateur(texte){
  try{
    speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(texte);
    u.lang='fr-CA'; u.rate=vitTaux(0.95);
    const v=jrVoixFr(); if(v) u.voice=v;
    speechSynthesis.speak(u);
  }catch(e){}
}

async function jrDire(texte){
  jrTaire();
  try{
    const res=await fetch('/api/voix',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({code:studentCode, texte:texte, role:JR.role})});
    if(!res.ok) throw new Error('voix serveur indisponible');
    const url=URL.createObjectURL(await res.blob());
    const a=vitAudio(new Audio(url)); jrAudio=a;
    a.onended=()=>{ URL.revokeObjectURL(url); if(jrAudio===a) jrAudio=null; };
    await a.play();
  }catch(e){
    jrDireNavigateur(texte);
  }
}

// La transcription atterrit dans le champ de saisie, modifiable : la
// reconnaissance se trompe forcément sur un accent d'apprenant, et voir ce
// qui a été entendu vaut mieux que de laisser partir une phrase fausse.
function jrParler(){
  const SRC=jrSRC();
  if(!SRC){ showErr('jrErr',"Ce navigateur ne fait pas la reconnaissance vocale."); return; }
  if(JR.rec){ try{ JR.rec.stop(); }catch(e){} return; }   // deuxième touche = arrêter
  jrTaire();                    // sinon le micro réentend la voix de l'assistant
  hideErr('jrErr');
  const inp=document.getElementById('jrInput');
  const btn=document.getElementById('jrMic');
  const lbl=document.getElementById('jrMicLbl');
  inp.value='';
  const rec=new SRC(); JR.rec=rec;
  rec.lang='fr-CA'; rec.interimResults=true; rec.continuous=true; rec.maxAlternatives=1;
  let acquis='', provisoire='';
  btn.classList.add('rec'); btn.textContent='⏹';
  lbl.textContent='Je t\'écoute… touche pour arrêter';
  rec.onresult=e=>{
    let inter='';
    for(let i=e.resultIndex;i<e.results.length;i++){
      const r=e.results[i];
      if(r.isFinal) acquis+=r[0].transcript+' '; else inter=r[0].transcript;
    }
    provisoire=inter;
    inp.value=(acquis+inter).trim();
  };
  rec.onerror=e=>{
    if(e.error==='not-allowed') showErr('jrErr',"Micro refusé — autorise l'accès au micro.");
    else if(e.error!=='aborted' && !inp.value) showErr('jrErr','Aucun son détecté, réessaie.');
  };
  rec.onend=()=>{
    JR.rec=null;
    btn.classList.remove('rec'); btn.textContent='🎤';
    lbl.textContent='Touche pour parler';
    // Une phrase courte est parfois coupée par la détection de silence avant
    // qu'un résultat final n'arrive : on garde le dernier provisoire.
    if(!inp.value && provisoire) inp.value=provisoire.trim();
    inp.focus();
  };
  try{ rec.start(); }catch(e){ JR.rec=null; }
}

function jrChoisir(quoi, val){
  JR[quoi] = val;
  const box = document.getElementById(quoi==='log' ? 'jrLogs' : 'jrRoles');
  box.querySelectorAll('.jr-opt').forEach(b=>{
    const v = quoi==='log' ? b.dataset.log : b.dataset.role;
    b.classList.toggle('on', v===val);
  });
}

function jrBulle(qui, texte){
  const fil=document.getElementById('jrFil');
  const d=document.createElement('div');
  d.className='jr-b jr-b-'+qui;
  let h='<span class="jr-b-q">'+(qui==='moi'?'Moi':'Assistant')+'</span>'+esc(texte);
  if(qui==='ia') h+='<button class="jr-redire" type="button" title="Réécouter">'+ICON_SPEAK+'</button>';
  d.innerHTML=h;
  if(qui==='ia'){
    // Le texte passe par dataset plutôt que par l'attribut onclick : pas
    // d'échappement d'apostrophes à gérer dans une réplique française.
    const b=d.querySelector('.jr-redire');
    b.dataset.t=texte;
    b.addEventListener('click',()=>jrDire(b.dataset.t));
  }
  fil.appendChild(d);
  d.scrollIntoView({block:'nearest'});
}

function jrDemarrer(){
  document.getElementById('jrChat').classList.remove('hidden');
  document.getElementById('jrStart').textContent='Recommencer avec ces choix';
  jrRecommencer();
}

function jrRecommencer(){
  jrTaire();
  if(JR.rec){ try{ JR.rec.stop(); }catch(e){} }
  JR.hist=[];
  document.getElementById('jrFil').innerHTML='';
  document.getElementById('jrFb').classList.remove('on');
  hideErr('jrErr');
  jrTour();
}

async function jrTour(){
  if(JR.occupe) return;
  JR.occupe=true;
  document.getElementById('jrStatus').classList.add('on');
  document.getElementById('jrSend').disabled=true;
  hideErr('jrErr');
  try{
    const res=await fetch('/api/jeu-de-role',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({code:studentCode, scenario:'sinistre', cas:JR.log, role:JR.role, historique:JR.hist})});
    const d=await res.json();
    if(!res.ok){ showErr('jrErr', d.error||"L'assistant n'a pas pu répondre."); return; }
    // Au premier tour, le serveur écrit la salutation à notre place : on
    // l'affiche et on la garde, sinon elle manquerait au tour suivant.
    if(d.ouverture){ JR.hist.push({role:'user', contenu:d.ouverture}); jrBulle('moi', d.ouverture); }
    JR.hist.push({role:'assistant', contenu:d.reponse});
    jrBulle('ia', d.reponse);
    if(JR.voix) jrDire(d.reponse);
  }catch(e){
    showErr('jrErr','Impossible de contacter le serveur. Réessaie.');
  }finally{
    JR.occupe=false;
    document.getElementById('jrStatus').classList.remove('on');
    document.getElementById('jrSend').disabled=false;
  }
}

function jrEnvoyer(){
  const inp=document.getElementById('jrInput');
  const txt=inp.value.trim();
  if(!txt || JR.occupe) return;
  inp.value='';
  JR.hist.push({role:'user', contenu:txt});
  jrBulle('moi', txt);
  jrTour();
}

async function jrFini(){
  const mes=JR.hist.filter(m=>m.role==='user').map(m=>m.contenu);
  // La salutation d'ouverture vient du serveur, pas de l'élève : on ne la
  // lui fait pas corriger.
  if(mes.length>1) mes.shift();
  if(!mes.length){ showErr('jrErr',"Pose au moins une question avant de demander la correction."); return; }
  hideErr('jrErr');
  document.getElementById('jrStatus').classList.add('on');
  try{
    const res=await fetch('/api/correct-french',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({code:studentCode, text:mes.join(' '),
        question:"L'élève défend sa réclamation au téléphone devant l'experte en sinistre qui vient d'en refuser une partie : il fait préciser le motif du refus et la clause invoquée, distingue ce qu'il accepte de ce qu'il conteste, appuie chaque point sur une pièce datée, propose un compromis chiffré, et demande la décision par écrit ainsi que la marche à suivre pour en obtenir la révision."})});
    const d=await res.json();
    if(!res.ok){ showErr('jrErr', d.error||'Une erreur est survenue.'); return; }
    renderCorr('jrFb', d, mes.join(' '));
  }catch(e){
    showErr('jrErr','Impossible de contacter le serveur.');
  }finally{
    document.getElementById('jrStatus').classList.remove('on');
  }
}

// ── EXERCICES À ÉCRIRE ────────────────────────────────────────────────
function normWrite(s){
  return (s||'').toLowerCase().trim().normalize('NFD').replace(/[̀-ͯ]/g,'')
    .replace(/\s+/g,' ').replace(/[.!?;:]+$/,'').replace(/^["«»']+|["«»']+$/g,'').trim();
}
// La réponse n'arrive pas au premier essai. Un élève à qui on montre la
// phrase corrigée dès le premier envoi la recopie et passe : le seul moment
// où il apprend quelque chose, la réparation de sa propre phrase, est
// escamoté. Donc : essai 1, un commentaire qui situe l'erreur, et le choix
// entre retenter et cliquer « Montrez-moi la réponse ». Essai 2 raté, la
// réponse vient d'elle-même — faire deviner un troisième tour décourage.
// WESSAI compte les essais ratés, WSOL garde la réponse à dévoiler, WFB le
// dernier commentaire (pour ne pas le perdre quand on ajoute la réponse).
const WESSAI={}, WSOL={}, WFB={};

function wBoutonReponse(exId, i){
  return '<br><button type="button" class="btn btn-ghost" style="margin-top:8px;padding:7px 12px;font-size:12px" '
    + 'onclick="wDevoiler(\'' + exId + '\',' + i + ')">Montrez-moi la réponse</button>';
}

// Le bouton ne coûte aucun appel : la correction est déjà arrivée avec le
// commentaire, le module la gardait simplement de côté. Dévoiler clôt le
// cycle (essai forcé à 2) et rouvre la case : lire une phrase ne laisse pas
// la trace que laisse le fait de la réécrire.
function wDevoiler(exId, i){
  const k=exId+'_'+i, sol=WSOL[k];
  if(!sol) return;
  WESSAI[k]=Math.max(WESSAI[k]||0, 2);
  const fb=document.getElementById('wf_'+exId+'_'+i);
  const inp=document.getElementById('wi_'+exId+'_'+i);
  fb.className='wfb no';
  fb.innerHTML=(WFB[k]?WFB[k]+'<br>':'')+'<b>La réponse :</b> '+esc(sol)
    +'<br><span style="font-weight:600">Réécris-la dans la case, puis vérifie.</span>';
  if(inp){ inp.value=''; inp.focus(); }
}

async function checkWrite(exId, i){
  const ex=EXOS.find(e=>e.id===exId); if(!ex) return;
  const it=ex.items[i];
  const inp=document.getElementById('wi_'+exId+'_'+i);
  const fb=document.getElementById('wf_'+exId+'_'+i);
  const val=inp.value.trim();
  const zid='w_'+exId+'_'+i;
  const k=exId+'_'+i;
  if(!val){ fb.className='wfb no'; fb.textContent="✏️ Écris ta réponse d'abord."; return; }

  // Mode autocorrection (réponse connue)
  if(it.accept){
    const ok=it.accept.map(normWrite).includes(normWrite(val));
    if(ok){
      fb.className='wfb ok'; fb.innerHTML='✅ Bravo, c\'est exact !';
      inp.classList.add('good'); inp.disabled=true; trackPlacement(zid,true);
      return;
    }
    WESSAI[k]=(WESSAI[k]||0)+1;
    WSOL[k]=it.accept[0];
    WFB[k]='❌ Presque !';
    fb.className='wfb no';
    fb.innerHTML = (WESSAI[k]<2)
      ? '❌ Presque ! Relis ta réponse et essaie encore.'+wBoutonReponse(exId,i)
      : '💡 La réponse est : <b>'+esc(it.accept[0])+'</b>'
        +'<br><span style="font-weight:600">Réécris-la dans la case, puis vérifie.</span>';
    trackPlacement(zid,false);
    // Ici le cumul a du sens : chaque envoi raté est une tentative distincte.
    const rates = ex.items.reduce((s,_,k2)=> s + (TR.attempts['w_'+exId+'_'+k2]||0), 0);
    evaluerAide(exId, rates);
    return;
  }

  // Mode IA (réponse ouverte)
  // La réponse est déjà sortie : on ne rappelle plus le serveur. Un troisième
  // appel ne dirait rien de neuf et se paierait à chaque frappe. On compare
  // sur place, et une phrase écrite autrement n'est pas comptée comme fautive.
  if(WSOL[k] && (WESSAI[k]||0)>=2){
    const juste = normWrite(val)===normWrite(WSOL[k]);
    fb.className='wfb '+(juste?'ok':'no');
    fb.innerHTML = juste
      ? '✅ Voilà, tu l\'as réécrite.'
      : '💡 C\'est noté. La phrase à écrire : <b>'+esc(WSOL[k])+'</b>';
    if(juste){ inp.classList.add('good'); trackPlacement(zid,true); }
    return;
  }
  fb.className='wfb wait'; fb.textContent='⏳ L\'assistant corrige ta réponse…';
  const btn=inp.parentElement.querySelector('.wbtn'); if(btn) btn.disabled=true;
  const essai=(WESSAI[k]||0)+1;
  try{
    const res=await fetch('/api/check-written',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({code:studentCode, consigne:(ex.sub||'')+' '+(it.q||''), reponse:val, attendu:it.hint||'', essai:essai})});
    const d=await res.json();
    if(btn) btn.disabled=false;
    if(!res.ok){ fb.className='wfb no'; fb.textContent=d.error||'Service momentanément indisponible.'; return; }
    if(d.correct){
      fb.className='wfb ok'; fb.innerHTML='✅ '+esc(d.feedback||'');
      inp.classList.add('good'); trackPlacement(zid,true);
      return;
    }
    WESSAI[k]=essai;
    WSOL[k]=d.correction||'';
    WFB[k]='💡 '+esc(d.feedback||'');
    fb.className='wfb no';
    if(!WSOL[k]) fb.innerHTML=WFB[k];
    else if(essai<2) fb.innerHTML=WFB[k]+wBoutonReponse(exId,i);
    else fb.innerHTML=WFB[k]+'<br><b>La réponse :</b> '+esc(WSOL[k])
      +'<br><span style="font-weight:600">Réécris-la dans la case, puis vérifie.</span>';
  }catch(e){
    if(btn) btn.disabled=false;
    fb.className='wfb no'; fb.textContent='Impossible de contacter le serveur. Réessaie.';
  }
}

  prPass: {
    eye:'Mini-leçon', tit:"La phrase passive, et qui elle efface",
    blocs:[
      {t:'texte', h:"La même scène, un autre sujet",
       p:"Le complément direct de la phrase active devient le sujet de la phrase passive, et celui qui agissait passe derrière, précédé de « par » — ou disparaît. <b>Le chauffeur a signé l'inventaire</b> devient <b>l'inventaire a été signé par le chauffeur</b>, puis, si l'on veut, <b>l'inventaire a été signé</b>. Rien n'a changé dans la réalité ; ce qui a changé, c'est de quoi la phrase parle, et qui elle nomme.",
       note:"C'est la seule transformation du français qui permet de décrire une action sans dire qui l'a faite. D'où sa fortune dans les contrats."},

      {t:'texte', h:"La recette, et le seul point de difficulté",
       p:"<b>être</b> au temps du verbe actif, plus le <b>participe passé</b>, accordé avec le sujet comme un adjectif. Présent : on exclut → <b>est exclu</b>. Passé composé : on a refusé → <b>a été refusé</b>. Futur : on refusera → <b>sera refusé</b>. Plus-que-parfait : on avait offert → <b>avait été offert</b>. La seule difficulté est de mettre « être » au bon temps : le participe, lui, ne bouge jamais.",
       note:"Repère : le nombre de mots augmente d'un à chaque étage. est exclu · a été exclu · avait été exclu."},

      {t:'texte', h:"Pourquoi les contrats l'adorent",
       p:"Parce qu'il permet de ne pas dire qui agit. « Sont exclus les dommages causés aux biens meubles » — exclus par qui ? Par l'assureur qui a rédigé la phrase, mais il n'apparaît nulle part. « Il a été établi que l'entreprise avait la garde du bien » — établi par qui, sur quelle base ? Chaque fois que vous lisez un passif sans « par », demandez-vous qui a disparu. C'est souvent exactement le renseignement qui manque, et c'est presque toujours une bonne question à poser.",
       note:"Ce n'est pas un procédé malhonnête, c'est un procédé d'écriture. Mais il faut savoir le défaire pour lire."},

      {t:'ex', h:"Défaire un passif pour voir qui manque",
       p:"À gauche, la phrase du contrat. À droite, la question qu'elle laisse ouverte.",
       rows:[
         ["Sont exclus les dommages causés aux biens meubles.","Exclus par qui, et depuis quelle version du contrat ?"],
         ["Il a été établi que l'entreprise avait la garde du bien.","Établi par qui, à partir de quelle pièce ?"],
         ["La décision vous sera communiquée par écrit.","Par qui, et dans quel délai exactement ?"],
         ["Le dommage retenu s'établit à neuf cent quarante dollars.","Retenu par qui, et écarté sur quoi ?"],
         ["La responsabilité est régie par le contrat de transport.","Quel contrat, quelle clause, signée quand ?"],
         ["Aucune déclaration de valeur n'a été proposée.","Voilà le passif qui sert l'assuré : il pose le fait sans accuser."],
       ]},

      {t:'piege', h:"Trois confusions autour du passif",
       rows:[

         ["mettre le participe au temps voulu","mettre l'auxiliaire être au temps voulu",
          "On écrit « a été refusé » et non « a refusé été ». Le participe reste au participe ; c'est « être » qui voyage dans les temps."],
         ["laisser le participe invariable","accorder avec le sujet, comme un adjectif",
          "La rampe a été <b>tordue</b>, les boîtes ont été <b>laissées</b>, les dommages sont <b>exclus</b>. L'oubli se voit immédiatement à l'écrit."],

      {t:'check', h:"Quatre décisions sur le passif",
       p:"Quatre questions, vite fait.",
       qs:[

         {q:"Dans « il a été établi que… », qui a établi ?", opts:["c'est écrit plus loin","la phrase ne le dit pas, et c'est le point"], ok:1,

         {q:"« Les boîtes ont été laissé dehors » — que corrige-t-on ?", opts:["l'auxiliaire","l'accord du participe : laissées"], ok:1,
          fb:"Le participe s'accorde avec le sujet : les boîtes ont été laissées."},
       ]},

      {t:'revoir', h:"À retenir",
       p:"<b>être</b> au temps du verbe + <b>participe accordé</b>. Le passif déplace le sujet et permet d'<b>effacer celui qui agit</b> : dans un contrat, cherchez toujours qui a disparu. Et retenez la phrase qui vous servira : « aucune déclaration de valeur ne m'a été proposée » se discute, « votre chauffeur ne me l'a pas proposée » se nie."},

  t11: {
    eye:'Mini-leçon', tit:"Les six mots qui décident d'une police",
    blocs:[
      {t:'texte', h:"Trois protections dans un seul contrat",
       p:"Une police de locataire n'est pas une protection, c'en est trois, et elles n'ont rien à voir entre elles. La <b>section des biens</b> paie ce qui vous appartient. La <b>responsabilité civile</b> paie ce que vous faites subir aux autres. Les <b>frais de subsistance</b> paient le supplément si votre logement devient inhabitable. Trois plafonds différents, parfois trois franchises différentes.",

      {t:'texte', h:"La franchise, et le calcul qu'on ne fait jamais",

      {t:'texte', h:"Valeur à neuf ou valeur au jour du sinistre",

  t1clar: {

    blocs:[
      {t:'texte', h:"Vous ne comprendrez pas tout, et ce n'est pas le problème",
       p:"Dans une conversation technique menée dans une langue qui n'est pas la première, il y aura des mots qui vous échapperont. C'est certain, c'est normal, et personne n'en tirera de conclusion. Le seul comportement qui vous nuit est de faire semblant : le malentendu ne disparaît pas, il se paie dix minutes plus tard, quand vous répondez à côté d'une question que vous aviez mal saisie.",

      {t:'texte', h:"Faire clarifier, une fois, sur le mot qui compte",

  t1subj: {
    eye:'Mini-leçon', tit:"Le subjonctif présent, et ce qui le déclenche",
    blocs:[
      {t:'texte', h:"Un mode, pas un temps",
       p:"Le subjonctif ne situe rien dans le temps : il dit comment celui qui parle considère le fait. Avec l'indicatif, le fait est posé comme réel. Avec le subjonctif, il est envisagé, voulu, craint, concédé — mais pas affirmé. « Je sais qu'elle <b>vient</b> » contre « je veux qu'elle <b>vienne</b> » : dans le second cas, elle n'est peut-être jamais venue.",
       note:"C'est pourquoi il apparaît presque toujours dans une subordonnée, après « que » : il faut un verbe principal pour dire comment on considère le fait."},

      {t:'texte', h:"Comment il se fabrique, en une règle et six exceptions",
       p:"On prend la troisième personne du pluriel du présent, on retire <b>-ent</b>, on ajoute <b>-e, -es, -e, -ions, -iez, -ent</b>. <span class='savoir-ex'>ils écriv<s>ent</s> → que j'écrive · ils finiss<s>ent</s> → que tu finisses · ils envoi<s>ent</s> → qu'elle envoie.</span> Les formes « nous » et « vous » se prennent, elles, sur l'imparfait : que nous envoy<b>ions</b>, que vous envoy<b>iez</b>. Six verbes seulement échappent à tout : être, avoir, aller, faire, pouvoir, savoir.",

  t1rel: {
    eye:'Mini-leçon', tit:"Le pronom relatif après une préposition",
    blocs:[
      {t:'texte', h:"Ce que ça résout, et pourquoi les contrats en sont pleins",
       p:"Une phrase relative relie deux idées sans répéter le nom. <b>La clause. Vous vous appuyez sur cette clause.</b> devient <b>la clause sur laquelle vous vous appuyez</b>. Le gain est réel : une seule phrase, un seul mouvement de lecture. Le coût aussi : dès qu'un texte en enchaîne trois, il faut savoir à quoi chacune renvoie, et c'est exactement ce qui rend un contrat illisible à qui ne les maîtrise pas.",
       note:"Vous n'avez donc pas à les aimer : vous avez à savoir les défaire pour lire, et à en produire deux ou trois pour écrire."},

      {t:'texte', h:"La règle en trois mots : préposition + lequel",
       p:"<b>lequel</b> s'accorde avec le nom qu'il reprend : lequel, laquelle, lesquels, lesquelles. Avec la préposition <b>à</b>, il se soude : auquel, à laquelle, auxquels, auxquelles. Avec <b>de</b>, il se soude aussi : duquel, de laquelle, desquels, desquelles. Avec toutes les autres — sur, dans, par, pour, avec, sans, chez — il reste séparé : sur lequel, dans laquelle, par lesquels.",
       note:"« à laquelle » ne se soude pas à l'écrit, contrairement à « auquel ». C'est une bizarrerie d'orthographe, pas une règle de grammaire."},

      {t:'ex', h:"La phrase simple, puis la relative",
       p:"À gauche, les deux phrases séparées. À droite, la relative — et remarquez que la préposition ne change jamais.",
       rows:[
         ["Vous vous appuyez sur cette clause.","la clause sur laquelle vous vous appuyez"],
         ["Je me fie à cette évaluation.","l'évaluation à laquelle je me fie"],
         ["Je ne renonce pas à ce point.","le point auquel je ne renonce pas"],
         ["Je vous parle de ce meuble.","le meuble dont je vous parle"],
         ["Tout passe par ce numéro.","le numéro par lequel tout passe"],
         ["Je négocie avec cette personne.","la personne avec qui je négocie"],
         ["Mon estimation repose sur ces annonces.","les annonces sur lesquelles repose mon estimation"],
         ["Le meuble a été porté dans cet escalier.","l'escalier dans lequel le meuble a été porté"],
       ]},

      {t:'texte', h:"« dont » et ses limites",
       p:"<b>dont</b> remplace « de + quelque chose », et il couvre à lui seul la moitié des besoins : le meuble <b>dont</b> je vous parle, une clause <b>dont</b> le sens est équivoque, les avenants <b>dont</b> je bénéficie. Sa limite est nette et se retient : il ne s'emploie <b>jamais</b> après une autre préposition. On dit « au bas <b>duquel</b> », « à côté <b>duquel</b> », « au terme <b>desquels</b> » — jamais « au bas dont ».",
       note:"Repère pratique : si le groupe qui précède contient déjà une préposition (au bas de, à côté de, en vertu de), c'est duquel, pas dont."},

      {t:'texte', h:"Les deux raccourcis : « qui » et « où »",
       p:"Après une préposition, pour une <b>personne</b>, le français préfère <b>qui</b> : la personne <b>à qui</b> j'ai parlé, l'expert <b>avec qui</b> je négocie, l'ébéniste <b>chez qui</b> je suis allée. « à laquelle » n'est pas faux, il est seulement lourd. Et pour un <b>lieu</b> ou un <b>moment</b>, <b>où</b> remplace tout : le jour <b>où</b> le camion est reparti, l'escalier <b>où</b> le meuble a été fendu.",
       note:"« où » ne s'emploie que pour un lieu ou un temps. « La question où je pense » ne se dit pas : c'est « à laquelle »."},

      {t:'piege', h:"Trois erreurs de relatif, et le repère qui les évite",
       rows:[
         ["choisir le relatif au jugé","refaire la phrase simple et écouter la préposition",
          "« Je me fie <b>à</b> » donne « à laquelle » ; « je compte <b>sur</b> » donne « sur laquelle ». La préposition appartient au verbe et ne se devine pas : elle se retrouve en refaisant la phrase."],
         ["« au bas dont la page »","« au bas de laquelle »",
          "« dont » ne survit à aucune préposition qui le précède. Dès qu'il y en a une, on repasse à duquel, de laquelle, desquels."],
         ["« la clause dont je m'appuie »","« la clause sur laquelle je m'appuie »",
          "S'appuyer se construit avec « sur », pas avec « de ». L'erreur vient de l'habitude de « dont », qui semble aller partout."],
       ]},

      {t:'check', h:"Quatre relatifs à placer",
       p:"Quatre questions, vite fait.",
       qs:[
         {q:"« Le point ___ je ne renonce pas » (renoncer à…)", opts:["dont","auquel"], ok:1,
          fb:"Renoncer se construit avec « à » : auquel."},
         {q:"« La clause ___ le sens est équivoque »", opts:["dont","à laquelle"], ok:0,
          fb:"« le sens de la clause » : dont remplace « de + la clause »."},
         {q:"« L'expert ___ je négocie » (négocier avec…)", opts:["avec lequel","avec qui"], ok:1,
          fb:"Les deux sont corrects, mais pour une personne on préfère « avec qui »."},
         {q:"« Le jour ___ le camion est reparti »", opts:["où","pendant lequel"], ok:0,
          fb:"« où » couvre le lieu et le moment, et il est plus léger."},
       ]},

      {t:'revoir', h:"À retenir",
       p:"<b>Préposition + lequel</b>, accordé au nom repris ; soudé avec <i>à</i> et <i>de</i>. <b>dont</b> pour « de quelque chose », mais jamais derrière une autre préposition. <b>qui</b> pour les personnes, <b>où</b> pour les lieux et les moments. Et le seul repère fiable : <b>refaire la phrase simple</b> et écouter quelle préposition le verbe réclame."},
    ]

  t21: {

      {t:'texte', h:"Étape 1 — accepter d'abord ce qui est juste",

      {t:'texte', h:"Étape 4 — proposer un chiffre, toujours",

  t2irr: {
    eye:'Mini-leçon', tit:"Ce qui aurait pu ne pas arriver",
    blocs:[
      {t:'texte', h:"La règle, en une seule ligne, et la faute en une ligne",
       p:"<b>Si + plus-que-parfait, conditionnel passé.</b> « Si j'<b>avais lu</b> le connaissement, je ne l'<b>aurais</b> pas <b>signé</b>. » La faute la plus fréquente est de mettre un conditionnel après « si » : « si j'aurais lu » ne se dit ni ne s'écrit, et cela s'entend immédiatement. Après « si », jamais de conditionnel — c'est la seule chose à retenir absolument.",
       note:"Moyen mnémotechnique : les deux « r » du conditionnel ne franchissent jamais le « si »."},

      {t:'texte', h:"Comment se forment les deux temps",
       p:"<b>Plus-que-parfait</b> : avoir ou être à l'<b>imparfait</b> + participe passé. j'avais lu · elle était partie · nous avions reçu. <b>Conditionnel passé</b> : avoir ou être au <b>conditionnel présent</b> + participe passé. j'aurais refusé · elle serait restée · nous aurions accepté. Les deux se construisent donc de la même façon, avec le même participe : seul l'auxiliaire change de temps.",
       note:"Si vous savez dire « j'avais lu » et « j'aurais lu », vous savez faire toutes les phrases de ce type."},

         o1:{w:["Si on m'avait offert une déclaration"], say:"Si on m'avait offert une déclaration", n:'avait offert — la condition ne s\'est pas réalisée'},

         n1:{w:["Si le chauffeur avait noté la fente"], say:"Si le chauffeur avait noté la fente", n:'avait noté — il ne l\'a pas notée'},

       },
       note:"Écoutez les deux moitiés à la suite : c'est la mélodie de la phrase entière qui la fait retenir, pas la règle."},

      {t:'texte', h:"Ce qu'elle dit vraiment, et pourquoi elle est utile ici",
       p:"L'hypothèse irréelle affirme deux choses à la fois : que la condition ne s'est pas réalisée, et qu'elle ne se réalisera plus. « Si on m'avait offert une déclaration de valeur, j'en aurais fait une » veut dire, en clair : <b>on ne me l'a pas offerte</b>. C'est un regret et c'est aussi un reproche, mais un reproche qui ne nomme personne — d'où son extraordinaire utilité dans une négociation. Vous désignez une faute sans accuser quiconque, et l'autre la voit très bien.",
       note:"Une ou deux fois dans une conversation, elle porte. Cinq fois, elle devient de la plainte et se retourne contre vous."},

      {t:'ex', h:"Retourner l'hypothèse contre soi : la concession",

         ["Si le chauffeur avait noté la fente…","Si j'avais photographié le meuble au départ, ce serait réglé."],
         ["Si vous m'aviez prévenue du délai…","Si j'avais noté la date à la réception, je n'aurais pas attendu."],

  t2conc: {
    eye:'Mini-leçon', tit:"Concéder, puis avancer",
    blocs:[
      {t:'texte', h:"La structure en deux temps, et rien d'autre",
       p:"Toute l'argumentation de ce module tient dans un mouvement à deux temps. <b>Temps 1</b> : vous reconnaissez ce qui est vrai chez l'autre, franchement, sans réserve. <b>Temps 2</b> : vous posez ce qui est vrai chez vous, et c'est là que va votre argument. Ce n'est pas de la politesse : c'est ce qui empêche votre interlocuteur de dépenser son énergie à vous prouver un point que vous venez de lui accorder.",

      {t:'texte', h:"« Or », le mot le plus utile et le moins employé",
       p:"« Or » n'oppose pas deux opinions : il introduit <b>le fait</b> qui rend la conclusion inévitable. « La clause vise le transport. <b>Or</b>, le meuble a été fendu dans l'escalier. Donc la clause ne s'applique pas. » C'est la charnière d'un raisonnement en trois temps, et c'est ce qui distingue une argumentation d'une simple protestation. Il n'existe pas d'équivalent parlé exact : au téléphone, on dit « et justement », ou on marque un temps.",
       note:"« Or » ne s'emploie qu'une fois par raisonnement. Deux « or » dans un paragraphe, et le lecteur ne sait plus lequel porte la conclusion."},

  t2emph: {
    eye:'Mini-leçon', tit:"Mettre en relief ce qui compte",
    blocs:[
      {t:'texte', h:"Une phrase ordinaire met tout sur le même plan",
       p:"« Je conteste le refus complet, pas votre évaluation » se comprend, mais rien n'y ressort. « <b>Ce que je conteste, c'est</b> le refus complet, pas votre évaluation » oblige votre interlocuteur à attendre la fin de la phrase pour savoir de quoi il s'agit — et c'est exactement l'effet recherché. L'emphase ne rend pas la phrase plus vraie ; elle décide de ce qu'on retiendra d'elle.",
       note:"En français, l'ordre des mots est rigide. L'emphase est le seul moyen de faire ce que d'autres langues font avec l'accent tonique."},

      {t:'ex', h:"Les trois tournures, sur la même idée",
       p:"À gauche la phrase ordinaire, à droite les mises en relief possibles.",
       rows:[
         ["Le portage a fendu le meuble.","C'est le portage qui a fendu le meuble."],
         ["Je demande la révision du troisième point.","Ce que je demande, c'est la révision du troisième point."],
         ["La photo a été prise à onze heures vingt-deux.","C'est à onze heures vingt-deux que la photo a été prise."],
         ["Je conteste ce point-là.","Ce point-là, je le conteste."],
         ["Les albums ont le plus souffert.","Ce sont les albums qui ont le plus souffert."],
         ["Personne ne m'a proposé de déclaration.","Ce qui m'étonne, c'est que personne ne m'ait proposé de déclaration."],
       ]},

      {t:'texte', h:"Tournure 1 — c'est … qui / c'est … que",
       p:"On encadre le groupe à mettre en avant. <b>qui</b> quand ce groupe est le sujet du verbe : « c'est le portage <b>qui</b> a fendu le meuble ». <b>que</b> dans tous les autres cas — complément, lieu, moment, manière : « c'est à onze heures vingt-deux <b>que</b> la photo a été prise ». C'est la tournure la plus courante et la plus discrète des trois.",
       note:"Au pluriel, l'écrit soigné demande « ce sont » : ce sont les albums qui… À l'oral, « c'est les albums » se dit et ne choque personne."},

      {t:'texte', h:"Tournure 2 — ce qui / ce que … , c'est",
       p:"On annonce d'abord, on nomme ensuite. « <b>Ce que</b> je demande, <b>c'est</b> la révision du troisième point. » « <b>Ce qui</b> m'étonne, <b>c'est</b> qu'aucune déclaration ne m'ait été proposée. » C'est la plus forte à l'oral, parce qu'elle crée une attente : votre interlocuteur ne peut pas vous couper avant la fin. Choisissez « ce qui » quand le groupe mis en avant est sujet, « ce que » quand il est complément.",
       note:"C'est aussi celle qui permet de dire, en une phrase, ce qu'on conteste ET ce qu'on ne conteste pas. Elle vaut un paragraphe."},

      {t:'texte', h:"Tournure 3 — la reprise par un pronom",
       p:"« Ce point-là, je <b>le</b> conteste. » « Le vaisselier, <b>il</b> était intact à huit heures. » « Cette clause, je <b>l'</b>ai relue trois fois. » On détache le groupe en tête, puis on le reprend par un pronom. Très fréquente à l'oral québécois, très efficace au téléphone, et à éviter dans une lettre d'affaires, où elle sonne relâchée.",
       note:"C'est la seule des trois qui change de registre selon le canal. Employez-la en parlant, pas en écrivant."},

      {t:'piege', h:"Trois abus de l'emphase",
       rows:[
         ["trois emphases dans un paragraphe","une, deux au maximum",
          "Enchaînées, elles donnent un ton théâtral qui affaiblit exactement ce qu'elles devaient renforcer. Réservez-les au point que vous voulez qu'on retienne."],
         ["« c'est les deux boîtes qui » dans une lettre","« ce sont les deux boîtes qui »",
          "Le pluriel est attendu à l'écrit soigné. À l'oral, personne n'y prête attention."],
         ["« c'est le portage que a fendu »","« c'est le portage qui a fendu »",
          "« qui » quand le groupe encadré est sujet du verbe qui suit ; « que » dans tous les autres cas. Le test : remplacez par « il » ou « le »."],
       ]},

      {t:'check', h:"Quatre relations à mettre en relief",
       p:"Quatre questions, vite fait.",
       qs:[

          fb:"La reprise par un pronom appartient à l'oral. À l'écrit, elle sonne relâchée."},
         {q:"Combien d'emphases dans un même paragraphe ?", opts:["autant de fois qu'on veut","une, deux au maximum"], ok:1,

  t2lettre: {
    eye:'Mini-leçon', tit:"Écrire une demande de révision",
    blocs:[
      {t:'texte', h:"Sept fonctions, dans cet ordre",
       p:"Une demande de révision n'est pas une lettre libre : c'est une suite de sept fonctions, et l'ordre compte autant que le contenu. <b>1.</b> L'objet, avec le numéro de dossier. <b>2.</b> Ce que vous acceptez. <b>3.</b> Ce que vous contestez, en une phrase. <b>4.</b> La concession, puis le retournement. <b>5.</b> Les pièces, numérotées et datées. <b>6.</b> La proposition chiffrée avec sa contrepartie. <b>7.</b> La demande de réponse écrite et la formule de politesse.",
       note:"Vous venez de lire ce modèle dans l'exercice 6. Écrivez le vôtre en gardant les sept fonctions dans le même ordre."},

// ── « EN APPRENDRE PLUS » : rendu du panneau ──────────────────────────
// Souligne en vert ce qui est noté entre accolades : « superficiel{le} »,
// « Pour{riez}-vous… ». Les crochets restent libres pour les sons — [y], [u].
function plMark(w){
  return String(w).split(/(\{[^}]*\})/).map(p=>
    (p.charAt(0)==='{' && p.charAt(p.length-1)==='}')
      ? '<span class="pl-end">'+esc(p.slice(1,-1))+'</span>'
      : esc(p)
  ).join('');
}
const plPlain = w => String(w).replace(/[{}]/g,'');

// Nom du MP3 d'un bouton d'écoute de mini-leçon : sons/<id>.mp3. Si le fichier
// n'existe pas, playWord retombe sur la synthèse vocale — donc on peut brancher
// les boutons avant d'avoir généré les sons.
const plAudioId = (exId, kind, bi, sub) =>
  'plus_' + exId + '_' + kind + bi + (sub===undefined ? '' : '_' + sub);

// Liste { identifiant → texte à lire } de tous les boutons d'écoute des
// mini-leçons. C'est la source de vérité du script de génération audio :
// ouvrir le module dans le navigateur et lancer plAudioManifest() pour la
// relire après toute modification de PLUS.
function plAudioManifest(){
  const m = {};
  Object.keys(PLUS).forEach(exId=>{
    PLUS[exId].blocs.forEach((b,bi)=>{
      if(b.t==='ana')
        m[plAudioId(exId,'ana',bi)] = b.say || b.mots.map(x=>plPlain(x[1])).join(' ');
      if(b.t==='ex')
        b.rows.forEach((r,ri)=>{ m[plAudioId(exId,'ex',bi,ri)] = r[2] || r[0]; });
      if(b.t==='labo')
        Object.keys(b.out).forEach(k=>{
          const o=b.out[k];
          m[plAudioId(exId,'lab',bi,k)] = o.say || o.w.map(plPlain).join(' ');
        });
    });
  });
  return m;
}
const plLab = {};   // état des laboratoires, par clé « exoId-index de bloc »

function plBloc(b, exId, bi){
  const eye = {texte:'Explication', ana:'Anatomie', labo:'À manipuler',
               ex:'Exemples', piege:'Attention', check:'Vérifiez-vous'}[b.t] || 'Explication';
  let h='<div class="pl-blk"><div class="pl-eye">'+eye+'</div>';
  if(b.h) h+='<div class="pl-h">'+esc(b.h)+'</div>';
  if(b.p) h+='<div class="pl-p">'+b.p+'</div>';

  if(b.t==='ana'){
    h+='<div class="pl-ana">';
    b.mots.forEach(m=>{
      const key = m[2]===true || /noyau/i.test(m[0]);
      h+='<div class="pl-tok'+(key?' is-key':'')+'"><span class="pl-tok-lbl">'+esc(m[0])+'</span>'
       + '<span class="pl-tok-w">'+plMark(m[1])+'</span></div>';
    });
    // Les étiquettes d'anatomie mises bout à bout ne se lisent pas toujours
    // bien (élisions, traits d'union, symboles phonétiques) : `say` donne le
    // texte à prononcer quand la simple concaténation ne suffit pas.
    const anaTxt = b.say || b.mots.map(m=>plPlain(m[1])).join(' ');
    h+='<button class="btn-audio-round" type="button" title="Écouter le groupe"'
     + ' onclick="playWord(this,\''+jsq(anaTxt)+'\',\''+plAudioId(exId,'ana',bi)+'\')">'+ICON_SPEAK+'</button>';
    h+='</div>';
  }

  if(b.t==='labo'){
    h+='<div id="lab-'+exId+'-'+bi+'" style="margin-top:16px">';
    b.axes.forEach(a=>{
      h+='<div class="pl-axe"><div class="pl-axe-lbl">'+esc(a.lbl)+'</div><div class="pl-opts">';
      a.opts.forEach(o=>{
        h+='<button class="pl-opt" type="button" data-axe="'+a.id+'" data-val="'+o[0]+'" aria-pressed="false"'
         + ' onclick="plLabo(\''+exId+'\','+bi+',\''+a.id+'\',\''+o[0]+'\')">'+esc(o[1])+'</button>';
      });
      h+='</div></div>';
    });
    h+='<div class="pl-out"><div class="pl-out-w"></div>'
     + '<button class="btn-audio-round" type="button" title="Écouter">'+ICON_SPEAK+'</button>'
     + '<div class="pl-out-n"></div></div></div>';
  }

  if(b.t==='ex'){
    h+='<div style="margin-top:14px">';
    b.rows.forEach((r,ri)=>{
      h+='<div class="pl-ex"><button class="btn-audio-round" type="button" title="Écouter"'
       + ' onclick="playWord(this,\''+jsq(r[2]||r[0])+'\',\''+plAudioId(exId,'ex',bi,ri)+'\')">'+ICON_SPEAK+'</button>'
       + '<span class="pl-ex-w">'+esc(r[0])+'</span><span class="pl-ex-t">'+esc(r[1])+'</span></div>';
    });
    h+='</div>';
  }

  if(b.t==='piege'){
    h+='<div style="margin-top:6px">';
    b.rows.forEach(r=>{
      h+='<div class="pl-trap"><div class="pl-bad"><span aria-hidden="true">✕</span><span>'+esc(r[0])+'</span></div>'
       + '<div class="pl-good"><span aria-hidden="true">✓</span><span>'+esc(r[1])+'</span></div>'
       + '<div class="pl-why">'+r[2]+'</div></div>';
    });
    h+='</div>';
  }

  if(b.t==='check'){
    h+='<div style="margin-top:12px">';
    b.qs.forEach((q,qi)=>{
      h+='<div class="pl-q"><div class="pl-qtxt">'+esc(q.q)+'</div><div class="pl-opts">';
      q.opts.forEach((o,oi)=>{
        h+='<button class="pl-opt" type="button" onclick="plCheck(this,\''+exId+'\','+bi+','+qi+','+oi+')">'+esc(o)+'</button>';
      });
      h+='</div><div class="pl-fb" aria-live="polite"></div></div>';
    });
    h+='</div>';
  }

  if(b.note) h+='<div class="pl-note">'+b.note+'</div>';
  return h+'</div>';
}

function plLabo(exId, bi, axeId, val){
  const key=exId+'-'+bi, b=PLUS[exId].blocs[bi];
  const st=plLab[key] || (plLab[key]={});
  b.axes.forEach(a=>{ if(st[a.id]==null) st[a.id]=a.opts[0][0]; });
  if(axeId) st[axeId]=val;
  const box=document.getElementById('lab-'+key); if(!box) return;
  box.querySelectorAll('.pl-opt[data-axe]').forEach(el=>{
    const on = st[el.dataset.axe]===el.dataset.val;
    el.classList.toggle('on', on);
    el.setAttribute('aria-pressed', on?'true':'false');
  });
  const o = b.out[b.axes.map(a=>st[a.id]).join('')];
  if(!o) return;
  const out = box.querySelector('.pl-out-w');
  out.innerHTML = o.w.map(plMark).join(' ');
  // Une phrase longue ne tient pas au corps de 27 px : on descend d'un cran.
  out.classList.toggle('is-long', o.w.map(plPlain).join(' ').length > 30);
  box.querySelector('.pl-out-n').textContent = o.n;
  // `say` sert quand le texte affiché contient de la ponctuation de mise en
  // page (une paire « tout · tu » se lit mieux avec une virgule).
  const phrase = o.say || o.w.map(plPlain).join(' ');
  const fid = plAudioId(exId, 'lab', bi, b.axes.map(a=>st[a.id]).join(''));
  box.querySelector('.pl-out .btn-audio-round').onclick = function(){ playWord(this, phrase, fid); };
}

function plCheck(btn, exId, bi, qi, oi){
  const q=PLUS[exId].blocs[bi].qs[qi];
  const wrap=btn.closest('.pl-q');
  const opts=wrap.querySelectorAll('.pl-opt');
  opts.forEach(el=>el.classList.remove('ok','no'));
  const good = oi===q.ok;
  btn.classList.add(good?'ok':'no');
  if(!good) opts[q.ok].classList.add('ok');
  const fb=wrap.querySelector('.pl-fb');
  fb.className='pl-fb on '+(good?'ok':'no');
  fb.innerHTML='<span aria-hidden="true">'+(good?'✓':'✕')+'</span> '+(good?'':'La bonne réponse est « '+esc(q.opts[q.ok])+' ». ')+q.fb;
}

// ── PROPOSITION D'AIDE APRÈS PLUSIEURS ERREURS ────────────────────────
// Le module connaît déjà, à la correction, quels énoncés sont ratés. Au-delà
// d'un seuil, il propose une aide — sans jamais l'imposer ni toucher au score.
// Une seule proposition par exercice et par séance.
const AIDE = {err:{}, etat:{}};      // etat : 'proposee' | 'ouverte' | 'refusee' | 'analysee'
const AIDE_SEUIL = 3;

// Les exercices analysables : ceux dont on peut reconstituer, ligne par ligne,
// ce que l'élève a choisi et ce qu'il fallait choisir.
function releverReponses(exId){
  const ex = EXOS.find(e=>e.id===exId); if(!ex) return [];
  if(ex.type==='vf'){
    return ex.rows.filter(r=>S.vfSel[r.id]).map(r=>({
      enonce:r.txt, choix:S.vfSel[r.id], bonne:r.ok}));
  }
  if(ex.type==='write'){
    return ex.items.map((it,i)=>{
      const inp=document.getElementById('wi_'+exId+'_'+i);
      const val=inp ? inp.value.trim() : '';
      if(!val || !it.accept) return null;
      return {enonce:it.q, choix:val, bonne:it.accept[0]};
    }).filter(Boolean);
  }
  return [];
}

/* Les deux journaux de l'enseignante nomment le même exercice : l'analyse
   d'erreurs y met son titre, les signaux d'aide y mettaient l'identifiant
   court. Deux noms pour une seule chose, et une colonne « Exercice » qu'on ne
   peut pas lire sans le module ouvert à côté. Le titre part des deux côtés.
   Repli sur l'identifiant : un exercice sans titre vaut mieux qu'un vide. */
function titreExo(exId){
  const ex = (typeof EXOS !== 'undefined') && EXOS.find(e => e.id === exId);
  if(ex && ex.tit) return ex.tit;
  if(typeof PLUS !== 'undefined' && PLUS[exId] && PLUS[exId].tit) return PLUS[exId].tit;
  return exId;
}

function evaluerAide(exId, nbErreurs){
  if(!exId) return;
  // L'analyse d'erreurs vaut pour tout exercice reconstituable, avec ou sans
  // mini-leçon.
  if(!PLUS[exId] && !releverReponses(exId).length) return;
  AIDE.err[exId] = Math.max(AIDE.err[exId]||0, nbErreurs);
  if(AIDE.err[exId] >= AIDE_SEUIL && !AIDE.etat[exId]) proposerAide(exId);
}

function proposerAide(exId){
  const card = document.getElementById('exo-'+exId);
  if(!card || card.querySelector('.aide')) return;
  AIDE.etat[exId] = 'proposee';
  const n = AIDE.err[exId];
  const analysable = releverReponses(exId).length > 0;
  const el = document.createElement('div');
  el.className = 'aide';
  el.id = 'aide-' + exId;
  el.innerHTML =
      '<div class="aide-txt"><b>' + n + ' erreurs</b> dans cet exercice.'
    + (PLUS[exId] ? ' La mini-leçon « ' + esc(PLUS[exId].tit) + ' » explique ce point autrement.' : '')
    + '</div>'
    + '<div class="aide-btns">'
    + (analysable
        ? '<button class="btn-oui" type="button" onclick="analyserErreurs(\'' + exId + '\')">'
          + ICON_ASSISTANT + ' Pourquoi je me trompe ?</button>' : '')
    + (PLUS[exId]
        ? '<button class="' + (analysable ? 'btn-non' : 'btn-oui') + '" type="button"'
          + ' onclick="accepterAide(\'' + exId + '\')">Revoir l\'explication</button>' : '')
    + '<button class="btn-non" type="button" onclick="refuserAide(\'' + exId + '\')">Plus tard</button>'
    + '</div>'
    + '<div class="aide-out" id="aideout-' + exId + '" aria-live="polite"></div>';
  card.appendChild(el);
  lmsTrack('aide_proposee', {exercice: titreExo(exId), erreurs: n, analysable: analysable});
}

function accepterAide(exId){
  AIDE.etat[exId] = 'ouverte';
  const el = document.querySelector('#exo-'+exId+' .aide');
  if(el) el.remove();
  lmsTrack('aide_acceptee', {exercice: titreExo(exId), erreurs: AIDE.err[exId]});
  plusOpen(exId, 'labo');
}

// ── NIVEAU 2 : analyse du patron d'erreurs par l'IA ───────────────────
// On envoie l'exercice COMPLET — chaque énoncé, le choix de l'élève, la bonne
// réponse. L'IA ne juge rien : la correction est déjà faite et affichée. Elle
// cherche seulement ce qui se répète dans les erreurs.
async function analyserErreurs(exId){
  const ex = EXOS.find(e=>e.id===exId); if(!ex) return;
  const items = releverReponses(exId);
  const out = document.getElementById('aideout-'+exId);
  const btn = document.querySelector('#aide-'+exId+' .btn-oui');
  if(!items.length || !out) return;

  // Un seul appel par exercice et par séance : l'élève qui s'acharne ne doit
  // pas générer une série d'appels facturés.
  if(btn){ btn.disabled = true; }
  out.className = 'aide-out on wait';
  out.textContent = "L'assistant relit tes réponses…";

  // L'activité se lit dans l'adresse du parent, comme le fait lmsTrack : le
  // module est dans une iframe et ne connaît pas son propre numéro. Sans elle,
  // l'analyse que le serveur garde ne se rattache à aucun module.
  let actId = null, actTitre = '';
  try{
    const up = new URLSearchParams(window.parent.location.search);
    actId = parseInt(up.get('activityId')) || null;
    actTitre = up.get('title') || '';
  }catch(e){}

  try{
    const res = await fetch('/api/analyser-erreurs', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({
        code: studentCode,
        activityId: actId,
        activityTitle: actTitre,
        exercice: ex.tit || '',
        notion: (ex.savoir && ex.savoir.h ? ex.savoir.h.replace(/^›\s*/,'') : ''),
        items: items,
      })});
    const d = await res.json();
    if(!res.ok){
      out.className = 'aide-out on no';
      out.textContent = d.error || 'Service momentanément indisponible.';
      if(btn) btn.disabled = false;      // panne : on laisse réessayer
      return;
    }
    out.className = 'aide-out on';
    out.innerHTML =
        (d.patron ? '<div class="ao-k">Ce qui revient</div><div class="ao-v">'+esc(d.patron)+'</div>' : '')
      + (d.explication ? '<div class="ao-k">Pourquoi</div><div class="ao-v">'+esc(d.explication)+'</div>' : '')
      + (d.conseil ? '<div class="ao-k">La prochaine fois</div><div class="ao-v ao-conseil">'+esc(d.conseil)+'</div>' : '');
    AIDE.etat[exId] = 'analysee';
    lmsTrack('aide_analysee', {exercice: titreExo(exId), erreurs: AIDE.err[exId]});
  }catch(e){
    out.className = 'aide-out on no';
    out.textContent = 'Impossible de contacter le serveur. Réessaie plus tard.';
    if(btn) btn.disabled = false;
  }
}

function refuserAide(exId){
  AIDE.etat[exId] = 'refusee';
  const el = document.querySelector('#exo-'+exId+' .aide');
  if(el) el.remove();
  lmsTrack('aide_refusee', {exercice: titreExo(exId), erreurs: AIDE.err[exId]});
}

let plLastFocus=null;
// `cible` : type de bloc vers lequel faire défiler le panneau ('labo' pour la
// manipulation). Sans lui, l'élève arrive en haut d'une longue leçon.
function plusOpen(exId, cible){
  const P=PLUS[exId]; if(!P) return;
  document.getElementById('plus-eye').textContent = P.eye || 'Mini-leçon';
  document.getElementById('plus-tit').textContent = P.tit;
  const body=document.getElementById('plus-body');
  body.innerHTML = P.blocs.map((b,bi)=>plBloc(b,exId,bi)).join('');
  body.scrollTop=0;
  document.getElementById('plus-ov').classList.add('on');
  // Le défilement appartient à <html> (body est figé à height:100%) — poser
  // overflow:hidden sur body rognerait toute la page.
  document.documentElement.style.overflow='hidden';
  P.blocs.forEach((b,bi)=>{ if(b.t==='labo') plLabo(exId,bi,null,null); });
  plLastFocus=document.activeElement;
  document.getElementById('plus-close').focus();
  lmsTrack('plus_open', {savoir: titreExo(exId), cible: cible || ''});
  if(cible){
    const i = P.blocs.findIndex(b => b.t === cible);
    if(i >= 0){
      const bloc = body.children[i];
      if(bloc){
        bloc.scrollIntoView({block:'start'});
        bloc.classList.add('is-cible');
        setTimeout(()=>bloc.classList.remove('is-cible'), 2500);
      }
    }
  }
}
function plusClose(){
  document.getElementById('plus-ov').classList.remove('on');
  document.documentElement.style.overflow='';
  if(plLastFocus && plLastFocus.focus) plLastFocus.focus();
}
document.getElementById('plus-close').addEventListener('click', plusClose);
document.getElementById('plus-ov').addEventListener('click', e=>{ if(e.target.id==='plus-ov') plusClose(); });
document.addEventListener('keydown', e=>{
  if(e.key==='Escape' && document.getElementById('plus-ov').classList.contains('on')) plusClose();
});

// ── RENDER ────────────────────────────────────────────────────────────
function render(){
  // Le bandeau reprend la section courante (gros titre + phrase d'intro),
  // comme le modèle je-me-prepare.html.
  const cur = SECTIONS.find(s=>s.id===curSec);
  if(cur){
    const tEl=document.getElementById('hdr-title'), lEl=document.getElementById('hdr-lead');
    if(tEl) tEl.textContent = cur.title;
    if(lEl) lEl.textContent = cur.lead || '';
  }
  SECTIONS.forEach(sec=>{
    document.getElementById('tab-'+sec.id).classList.toggle('on', curSec===sec.id);
    document.getElementById('sec-'+sec.id).classList.toggle('on', curSec===sec.id);
    const zids=Object.keys(ZONES).filter(z=>{const ex=EXOS.find(e=>e.id===ZONES[z].exo);return ex.sec===sec.id});
    const done=zids.length>0&&zids.every(z=>TR.correct[z]);
    document.getElementById('tab-'+sec.id).classList.toggle('done',done);

document.getElementById('fc-trad-btn').addEventListener('click',()=>{
  const c=FC_CARDS[fcIdx], b=document.getElementById('fc-trad-btn'), z=document.getElementById('fc-trad');

    z.className='att'; z.textContent="La traduction n'est pas disponible hors ligne."; return;
  }

}

// ── REPRISE:début — greffé par build/greffe_reprise.py ──
// L'élève ouvre le module, s'arrête, retourne à sa fiche, puis revient ici.
// Sans mémoire locale il repartait de la première section avec tout effacé :
// l'état vit dans des variables JavaScript, et le serveur ne garde que des
// compteurs (zonesDone, firstTry…), jamais les réponses elles-mêmes. On garde
// donc l'avancement dans le navigateur, une clé par élève et par module.
const RE_CLE = MODULE_SLUG + ':' + (studentCode || 'anonyme') + ':etat';
const RE_VERSION = 1;
let reMinuteur = null;
let reGel = false;   // vrai pendant la restauration : on n'écrase pas la sauvegarde

// Les réponses écrites vivent dans le DOM, pas dans S : on les relève à part.
function reChamps(){
  const out = {};
  document.querySelectorAll('.winput, textarea').forEach((el, i) => {
    if (el.value) out[el.id || ('champ' + i)] = el.value;
  });
  return out;
}

function reEtat(){
  return {
    v: RE_VERSION, quand: Date.now(), curSec: curSec,
    pl: S.pl, vfSel: S.vfSel, fb: S.fb,
    vocabPairs: S.vocabPairs, vocabOrder: S.vocabOrder,
    attempts: TR.attempts, correct: TR.correct,
    champs: reChamps(),
  };
}

function reEcrire(){
  try { localStorage.setItem(RE_CLE, JSON.stringify(reEtat())); } catch(e) {}
}

// render() est appelé à chaque clic : on regroupe les écritures.
function reSauver(){
  if (reGel) return;
  clearTimeout(reMinuteur);
  reMinuteur = setTimeout(reEcrire, 300);
}

function reEffacer(){
  clearTimeout(reMinuteur);
  try { localStorage.removeItem(RE_CLE); } catch(e) {}
}

function reLire(){
  try {
    const d = JSON.parse(localStorage.getItem(RE_CLE) || 'null');
    return (d && d.v === RE_VERSION) ? d : null;
  } catch(e) { return null; }
}

function reprendre(){
  const d = reLire();
  if (!d) return null;
  reGel = true;
  S.pl = d.pl || {};
  S.vfSel = d.vfSel || {};
  S.fb = d.fb || {};
  if (d.vocabPairs) S.vocabPairs = d.vocabPairs;
  if (d.vocabOrder) S.vocabOrder = d.vocabOrder;
  TR.attempts = d.attempts || {};
  TR.correct = d.correct || {};
  // Une section disparue depuis la dernière visite ne doit pas bloquer
  // l'ouverture ; la greffe des sections peut encore déplacer l'élève si
  // celle-ci a été refermée par l'enseignant.
  if (d.curSec && SECTIONS.some(s => s.id === d.curSec)) curSec = d.curSec;
  const champs = d.champs || {};
  document.querySelectorAll('.winput, textarea').forEach((el, i) => {
    const val = champs[el.id || ('champ' + i)];
    if (val != null) el.value = val;
  });
  if (typeof peCount === 'function') peCount();
  reGel = false;
  return d;
}

// Une réponse écrite déjà validée reste verte — et verrouillée quand la bonne
// réponse était connue d'avance, comme au moment de la validation.
function reMarquerEcrits(){
  EXOS.filter(e => e.type === 'write').forEach(ex => {
    ex.items.forEach((it, i) => {
      if (!TR.correct['w_' + ex.id + '_' + i]) return;
      const inp = document.getElementById('wi_' + ex.id + '_' + i);
      if (!inp) return;
      inp.classList.add('good');
      if (it.accept) inp.disabled = true;
    });
  });
}

// Le pointage des vrai/faux est recalculé : on ne réaffiche le total qu'aux
// exercices que l'élève avait réellement corrigés (S.fb rempli partout).
function reMarquerVf(){
  EXOS.filter(e => e.type === 'vf').forEach(ex => {
    const repondu = ex.rows.filter(r => S.vfSel[r.id]).length;
    if (!repondu) return;
    const corrige = ex.rows.every(r => S.fb[r.id]);
    updateVfScore(ex, corrige);
    if (!corrige) return;
    const bons = ex.rows.filter(r => S.vfSel[r.id] === r.ok).length;
    const sum = document.getElementById('vfsum-' + ex.id);
    if (sum) {
      sum.className = 'vf-summary ok';
      sum.textContent = bons + ' / ' + ex.rows.length + ' bonnes réponses';
    }
  });
}

function reQuand(ms){
  if (Date.now() - ms < 3600e3) return 'il y a moins d’une heure';
  const j = new Date(ms);
  const h = String(j.getHours()).padStart(2, '0') + ' h ' + String(j.getMinutes()).padStart(2, '0');
  if (j.toDateString() === new Date().toDateString()) return 'plus tôt aujourd’hui, à ' + h;
  const mois = ['janvier','février','mars','avril','mai','juin','juillet',
                'août','septembre','octobre','novembre','décembre'];
  return 'le ' + j.getDate() + ' ' + mois[j.getMonth()] + ', à ' + h;
}

// La reprise ne doit jamais être une prison : le bouton remet tout à zéro.
function reBanniere(d){
  const chrome = document.getElementById('chrome');
  if (!chrome || !chrome.parentNode) return;
  const el = document.createElement('div');
  el.id = 're-banniere';
  el.setAttribute('role', 'status');
  const n = Object.keys(TR.correct).length;
  el.innerHTML = '<span class="re-txt">↩︎ Tu reprends où tu étais : '
    + (n ? n + ' réponse' + (n > 1 ? 's' : '') + ' déjà juste' + (n > 1 ? 's' : '')
         : 'ton travail est retrouvé')
    + '.<span class="re-quand">Dernier passage ' + reQuand(d.quand) + '.</span></span>'
    + '<button type="button" id="re-recommencer">↺ Recommencer le module</button>'
    + '<button type="button" id="re-fermer" aria-label="Masquer ce message">✕</button>';
  chrome.parentNode.insertBefore(el, chrome.nextSibling);
  document.getElementById('re-recommencer').addEventListener('click', () => {
    if (!confirm('Recommencer le module depuis le début ? Tes réponses seront effacées.')) return;
    reGel = true;   // le rechargement ne doit pas réécrire ce qu'on vient d'effacer
    reEffacer();
    location.reload();
  });
  document.getElementById('re-fermer').addEventListener('click', () => el.remove());
}

// Les champs de texte ne passent pas par render() : ils se sauvent seuls.
document.addEventListener('input', e => {
  const t = e.target;
  if (t && (t.tagName === 'TEXTAREA' || t.classList.contains('winput'))) reSauver();
});
// Onglet fermé : on écrit tout de suite au lieu d'attendre la temporisation.
addEventListener('pagehide', () => { if (!reGel) reEcrire(); });

buildStatic();

/* REPRISE-GO:fin */

     Deux corrections indispensables une fois l'assistant parti. D'abord la
     phrase d'ouverture, qui le promet dans 77 modules sur 78 : la laisser,
     c'est annoncer à l'élève quelque chose qui n'arrivera pas. Ensuite le mot
     qui explique ce que devient l'exercice — et il ne peut pas parler de
     fiches à imprimer, puisqu'un seul module en a. */
  function replierJeuDeRole() {
    var depart = document.getElementById('jrStart');
    if (!depart) return;
    var carte = depart.closest('.card') || depart.parentElement;
    var sep = carte && carte.querySelector('.jr-sep');
    if (!sep) { carte.style.display = 'none'; return; }

    var fiches = null;
    for (var n = sep; n; ) {
      var suivant = n.nextElementSibling;
      n.style.display = 'none';
      n = suivant;
    }
    fiches = carte.querySelector('.jr-print');
    var aDesFiches = !!(fiches && fiches.style.display !== 'none');

    /* On ne réécrit aucune phrase : on retire celles qui ne sont plus vraies.
       Un « bloc de texte » est un élément dont les enfants sont tous en ligne
       (gras, italique, saut de ligne). Se limiter aux feuilles ne suffisait
       pas : la phrase d'ouverture porte presque toujours un <b>, et elle
       restait affichée dans les 77 modules qu'il fallait corriger. Un bloc
       qui contient d'autres blocs, lui, n'est jamais retiré — il emporterait
       les situations avec lui. */
    var mort = /assistant/i;
    var EN_LIGNE = /^(B|I|EM|STRONG|SPAN|BR|A|CODE|SMALL|U|SUP|SUB)$/;
    [].slice.call(carte.querySelectorAll('p, div, span, li')).forEach(function (e) {
      if (e.classList.contains('sans-ia-mot')) return;
      if (!mort.test(e.textContent || '')) return;
      for (var i = 0; i < e.children.length; i++)
        if (!EN_LIGNE.test(e.children[i].tagName)) return;
      e.style.display = 'none';
    });

    var tete = carte.querySelector('.c-hdr');
    var mot = note(aDesFiches
      ? "Cet entraînement se fait à deux, en classe, avec les fiches à imprimer."
      : "Cet entraînement se fait à deux, en classe : la situation et les sujets "
        + "à couvrir sont ci-dessous.");
    if (tete && tete.nextSibling) carte.insertBefore(mot, tete.nextSibling);
    else carte.insertBefore(mot, sep);
  }

  /* Aide après erreurs — « Pourquoi je me trompe ? » part, « Revoir
     l'explication » reste : une mini-leçon est du texte écrit d'avance. Un
     panneau qui n'aurait plus que « Plus tard » à offrir est un reproche, pas
     une aide : on le retire au lieu de l'afficher vide. */
  function replierAide() {
    if (typeof analyserErreurs === 'function') analyserErreurs = function () {};
    if (typeof proposerAide !== 'function') return;
    var orig = proposerAide;
    proposerAide = function (exId) {
      var r = orig.apply(this, arguments);
      var el = document.getElementById('aide-' + exId);
      if (!el) return r;
      var ia = el.querySelector('button[onclick^="analyserErreurs"]');
      if (ia) ia.remove();
      var reste = el.querySelector('.aide-btns button[onclick^="accepterAide"]');
      if (!reste) el.remove();
      return r;
    };
  }

  /* Exercices écrits — la correction par comparaison de chaînes (`it.accept`)
     n'a jamais rien eu d'une IA : elle reste, telle quelle. Seule la réponse
     ouverte change : plus d'appel, et la réponse attendue après deux essais,
     le même rythme que la version avec assistant. */
  function replierExercicesEcrits() {
    if (typeof checkWrite !== 'function' || typeof EXOS === 'undefined') return;
    var orig = checkWrite;
    var essais = {};
    checkWrite = function (exId, i) {
      var ex = EXOS.find(function (e) { return e.id === exId; });
      if (!ex) return;
      var it = ex.items[i];
      if (it && it.accept) return orig.apply(this, arguments);

      var inp = document.getElementById('wi_' + exId + '_' + i);
      var fb = document.getElementById('wf_' + exId + '_' + i);
      if (!inp || !fb) return;
      var val = (inp.value || '').trim();
      if (!val) { fb.className = 'wfb no'; fb.textContent = "✏️ Écris ta réponse d'abord."; return; }

      var k = exId + '_' + i;
      var n = essais[k] = (essais[k] || 0) + 1;
      var attendu = (it && it.hint) || '';

      if (!attendu) {
        /* Rien à comparer et personne pour lire : le dire franchement vaut
           mieux qu'un ✅ qui ne vérifie rien. */
        fb.className = 'wfb';
        fb.innerHTML = "📝 Ta réponse est notée. Vous la corrigerez en classe.";
        if (typeof trackPlacement === 'function') trackPlacement('w_' + exId + '_' + i, false);
        return;
      }

      /* WSOL et WFB appartiennent à la greffe « deux essais » : quand elle est
         là, on s'en sert pour que « Montrez-moi la réponse » se comporte
         exactement comme dans l'autre version. */
      if (typeof WSOL !== 'undefined') WSOL[k] = attendu;
      if (typeof WFB !== 'undefined') WFB[k] = '';

      fb.className = 'wfb no';
      if (n < 2 && typeof wBoutonReponse === 'function') {
        fb.innerHTML = "💡 Relis ta phrase et vérifie chaque mot."
                     + wBoutonReponse(exId, i);
      } else {
        fb.innerHTML = "💡 <b>La réponse attendue :</b> "
                     + (typeof esc === 'function' ? esc(attendu) : attendu)
                     + '<br><span style="font-weight:600">Compare-la avec la tienne, '
                     + 'puis réécris-la dans la case.</span>';
      }
      if (typeof trackPlacement === 'function') trackPlacement('w_' + exId + '_' + i, false);
      if (typeof evaluerAide === 'function') {
        var rates = ex.items.reduce(function (s, _, j) {
          return s + (essais[exId + '_' + j] || 0);
        }, 0);
        evaluerAide(exId, rates);
      }
    };
  }

  /* La barre « Mes outils » porte la plus grosse part d'IA du module :
     traduire, simplifier, demander. Elle sait se replier elle-même — elle est
     partagée par les 87 modules, et la règle doit vivre à un seul endroit. */
  function replierOutils() {
    if (window.Outils && typeof Outils.sansIA === 'function') Outils.sansIA();
  }

  function replier() {
    document.body.classList.add('sans-ia');
    window.MODE_IA = false;
    replierOral();
    replierEcrit();
    replierJeuDeRole();
    replierAide();
    replierExercicesEcrits();
    replierOutils();
  }

  /* ── La question, posée une seule fois ───────────────────────────────── */

  async function demander() {
    var code = (typeof studentCode !== 'undefined' && studentCode) ? studentCode : '';
    try {
      var res = await fetch('/api/student/ia?code=' + encodeURIComponent(code));
      var data = await res.json();
      /* Une panne de réseau ne coupe rien : les routes IA sont gardées côté
         serveur de toute façon, et replier sur un délai d'attente ferait
         clignoter le module d'une classe à l'autre. */
      if (data && data.ia === false) replier();
    } catch (e) { /* on laisse le module tel quel */ }
  }

  /* On passe APRÈS l'initialisation de la barre d'outils, qui se fait au
     chargement du module : sinon il n'y aurait encore rien à retirer. */
  function departer() { setTimeout(demander, 0); }
  if (document.readyState === 'loading')
    document.addEventListener('DOMContentLoaded', departer);
  else departer();
})();
</script>
<!-- SANS-IA:fin -->

  var depart = sectionCourante();

  if (typeof render === 'function') {

    render = function () {

<script>
(function () {
  var texteDepose = '', retroDeposee = '';

  function carteEcrite() {
    var t = document.getElementById('peText');
    return t ? t.closest('.card') : null;
  }
  function libelle() {
    var c = carteEcrite(), h = c && c.querySelector('.prod-tit');
    return h ? h.textContent.trim() : 'Production écrite';
  }
  function consigne() {
    var c = carteEcrite(), p = c && c.querySelector('.prod-lead');
    return p ? p.textContent.trim() : '';
  }

  // renderCorr est globale au module et sert aussi à l'oral : on n'ouvre le
  // dépôt que pour la zone écrite.
  if (typeof renderCorr === 'function') {
    var rendreOrig = renderCorr;
    renderCorr = function (elId, data, orig) {
      var r = rendreOrig.apply(this, arguments);
      if (elId === 'peFb') {
        texteDepose = orig || '';
        retroDeposee = (typeof corrSummary === 'function') ? corrSummary(data, orig) : '';
        var zone = document.getElementById('peSend');
        if (zone) zone.style.display = 'flex';
      }
      return r;
    };
  }

  window.peSend = async function () {
    var btn = document.getElementById('peSendBtn');
    var texte = (document.getElementById('peText') || {}).value || texteDepose;
    texte = (texte || '').trim();
    if (!texte) { showErr('peErr', "Écris ton message d'abord."); return; }

    btn.disabled = true; btn.textContent = 'Envoi…';
    try {
      var res = await fetch('/api/ecrit/submit', {
        method: 'POST', headers: {'Content-Type': 'application/json'},

<style>
  .tab.verrouillee { opacity: .55; cursor: not-allowed; }
  .tab.verrouillee .tchk { visibility: visible; opacity: 1; }
  #verrou-avis {
    margin: 10px 0 0; padding: 10px 14px; border-radius: 10px;
    background: #FDF3E3; color: #7A4A12; border: 1px solid #E8CDA0;
    font-size: 15px; font-weight: 700;
  }
</style>
<script>
(function () {
  var ACTIVITE = 120;

  function joli(iso) {
    if (!iso) return '';
    var p = iso.split('-');
    var mois = ['janvier','février','mars','avril','mai','juin','juillet',
                'août','septembre','octobre','novembre','décembre'];
    return Number(p[2]) + ' ' + mois[Number(p[1]) - 1];
  }

  function avis(texte) {
    var el = document.getElementById('verrou-avis');
    if (!el) {
      var tabs = document.getElementById('tabs');
      if (!tabs || !tabs.parentNode) return;
      el = document.createElement('p');
      el.id = 'verrou-avis';
      tabs.parentNode.insertBefore(el, tabs.nextSibling);
    }
    el.textContent = texte;
    el.hidden = !texte;
  }

  function appliquer(sections) {
    var parId = {};
    sections.forEach(function (s) { parId[s.id] = s; });

    SECTIONS.forEach(function (sec) {
      var etat = parId[sec.id];
      var bouton = document.getElementById('tab-' + sec.id);
      if (!bouton || !etat) return;
      var fermee = !etat.ouverte;
      bouton.classList.toggle('verrouillee', fermee);
      bouton.setAttribute('aria-disabled', fermee ? 'true' : 'false');
      var chk = bouton.querySelector('.tchk');
      if (chk && fermee) chk.textContent = '🔒';
      bouton.title = fermee
        ? (etat.datePrevue ? 'Cette partie s’ouvre le ' + joli(etat.datePrevue)
                           : 'Cette partie n’est pas encore ouverte.')
        : '';
    });

    // Capture : l'écouteur du module est posé sur le bouton lui-même, il faut
    // donc arrêter le clic avant lui plutôt qu'après.
    var tabs = document.getElementById('tabs');
    if (tabs && !tabs.dataset.verrou) {
      tabs.dataset.verrou = '1';
      tabs.addEventListener('click', function (e) {
        var b = e.target.closest ? e.target.closest('.tab') : null;
        if (!b || !b.classList.contains('verrouillee')) return;
        e.stopPropagation();
        e.preventDefault();
        avis(b.title || 'Cette partie n’est pas encore ouverte.');
      }, true);
    }

    var ouvertes = sections.filter(function (s) { return s.ouverte; });
    if (!ouvertes.length) {
      avis('Aucune partie de ce module n’est ouverte pour l’instant. '
           + 'Ton enseignante les ouvrira une à une.');
      return;
    }
    var courante = parId[curSec];
    if (courante && !courante.ouverte) {
      curSec = ouvertes[0].id;
      avis('Cette partie n’est pas encore ouverte : voici celle que tu peux faire.');
    }
    if (typeof render === 'function') render();
  }

  function demarrer() {
    if (typeof SECTIONS === 'undefined' || typeof curSec === 'undefined') return;
    var code = (typeof studentCode !== 'undefined' && studentCode) || '';
    if (!code) return;   // hors session : le module s'ouvre en entier
    fetch('/api/student/sections?code=' + encodeURIComponent(code)
          + '&activityId=' + ACTIVITE)
      .then(function (r) { return r.ok ? r.json() : null; })
      .then(function (d) {
        if (d && d.decoupe && d.sections && d.sections.length) appliquer(d.sections);
      })
      .catch(function () { /* serveur muet : on n'enlève rien à l'élève */ });
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', demarrer);
  } else {
    demarrer();
  }
})();
</script>
