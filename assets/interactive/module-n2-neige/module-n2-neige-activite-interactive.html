// ── « EN APPRENDRE PLUS » : rendu du panneau ──────────────────────────
// Souligne en vert ce qui est noté entre accolades : « superficiel{le} »,
// « Pour{riez}-vous… ». Les crochets restent libres pour les sons — [y], [u].
function plMark(w){
  return String(w).split(/(\{[^}]*\})/).map(p=>
    (p.charAt(0)==='{' && p.charAt(p.length-1)==='}')
      ? '<span class="pl-end">'+esc(p.slice(1,-1))+'</span>'
      : esc(p)
  ).join('');
}
const plPlain = w => String(w).replace(/[{}]/g,'');

// Nom du MP3 d'un bouton d'écoute de mini-leçon : sons/<id>.mp3. Si le fichier
// n'existe pas, playWord retombe sur la synthèse vocale — donc on peut brancher
// les boutons avant d'avoir généré les sons.
const plAudioId = (exId, kind, bi, sub) =>
  'plus_' + exId + '_' + kind + bi + (sub===undefined ? '' : '_' + sub);

// Liste { identifiant → texte à lire } de tous les boutons d'écoute des
// mini-leçons. C'est la source de vérité du script de génération audio :
// ouvrir le module dans le navigateur et lancer plAudioManifest() pour la
// relire après toute modification de PLUS.
function plAudioManifest(){
  const m = {};
  Object.keys(PLUS).forEach(exId=>{
    PLUS[exId].blocs.forEach((b,bi)=>{
      if(b.t==='ana')
        m[plAudioId(exId,'ana',bi)] = b.say || b.mots.map(x=>plPlain(x[1])).join(' ');
      if(b.t==='ex')
        b.rows.forEach((r,ri)=>{ m[plAudioId(exId,'ex',bi,ri)] = r[2] || r[0]; });
      if(b.t==='labo')
        Object.keys(b.out).forEach(k=>{
          const o=b.out[k];
          m[plAudioId(exId,'lab',bi,k)] = o.say || o.w.map(plPlain).join(' ');
        });
    });
  });
  return m;
}
const plLab = {};   // état des laboratoires, par clé « exoId-index de bloc »

function plBloc(b, exId, bi){
  const eye = {texte:'Explication', ana:'Anatomie', labo:'À manipuler',
               ex:'Exemples', piege:'Attention', check:'Vérifiez-vous'}[b.t] || 'Explication';
  let h='<div class="pl-blk"><div class="pl-eye">'+eye+'</div>';
  if(b.h) h+='<div class="pl-h">'+esc(b.h)+'</div>';
  if(b.p) h+='<div class="pl-p">'+b.p+'</div>';

  if(b.t==='ana'){
    h+='<div class="pl-ana">';
    b.mots.forEach(m=>{
      const key = m[2]===true || /noyau/i.test(m[0]);
      h+='<div class="pl-tok'+(key?' is-key':'')+'"><span class="pl-tok-lbl">'+esc(m[0])+'</span>'
       + '<span class="pl-tok-w">'+plMark(m[1])+'</span></div>';
    });
    // Les étiquettes d'anatomie mises bout à bout ne se lisent pas toujours
    // bien (élisions, traits d'union, symboles phonétiques) : `say` donne le
    // texte à prononcer quand la simple concaténation ne suffit pas.
    const anaTxt = b.say || b.mots.map(m=>plPlain(m[1])).join(' ');
    h+='<button class="btn-audio-round" type="button" title="Écouter le groupe"'
     + ' onclick="playWord(this,\''+jsq(anaTxt)+'\',\''+plAudioId(exId,'ana',bi)+'\')">'+ICON_SPEAK+'</button>';
    h+='</div>';
  }

  if(b.t==='labo'){
    h+='<div id="lab-'+exId+'-'+bi+'" style="margin-top:16px">';
    b.axes.forEach(a=>{
      h+='<div class="pl-axe"><div class="pl-axe-lbl">'+esc(a.lbl)+'</div><div class="pl-opts">';
      a.opts.forEach(o=>{
        h+='<button class="pl-opt" type="button" data-axe="'+a.id+'" data-val="'+o[0]+'" aria-pressed="false"'
         + ' onclick="plLabo(\''+exId+'\','+bi+',\''+a.id+'\',\''+o[0]+'\')">'+esc(o[1])+'</button>';
      });
      h+='</div></div>';
    });
    h+='<div class="pl-out"><div class="pl-out-w"></div>'
     + '<button class="btn-audio-round" type="button" title="Écouter">'+ICON_SPEAK+'</button>'
     + '<div class="pl-out-n"></div></div></div>';
  }

  if(b.t==='ex'){
    h+='<div style="margin-top:14px">';
    b.rows.forEach((r,ri)=>{
      h+='<div class="pl-ex"><button class="btn-audio-round" type="button" title="Écouter"'
       + ' onclick="playWord(this,\''+jsq(r[2]||r[0])+'\',\''+plAudioId(exId,'ex',bi,ri)+'\')">'+ICON_SPEAK+'</button>'
       + '<span class="pl-ex-w">'+esc(r[0])+'</span><span class="pl-ex-t">'+esc(r[1])+'</span></div>';
    });
    h+='</div>';
  }

  if(b.t==='piege'){
    h+='<div style="margin-top:6px">';
    b.rows.forEach(r=>{
      h+='<div class="pl-trap"><div class="pl-bad"><span aria-hidden="true">✕</span><span>'+esc(r[0])+'</span></div>'
       + '<div class="pl-good"><span aria-hidden="true">✓</span><span>'+esc(r[1])+'</span></div>'
       + '<div class="pl-why">'+r[2]+'</div></div>';
    });
    h+='</div>';
  }

  if(b.t==='check'){
    h+='<div style="margin-top:12px">';
    b.qs.forEach((q,qi)=>{
      h+='<div class="pl-q"><div class="pl-qtxt">'+esc(q.q)+'</div><div class="pl-opts">';
      q.opts.forEach((o,oi)=>{
        h+='<button class="pl-opt" type="button" onclick="plCheck(this,\''+exId+'\','+bi+','+qi+','+oi+')">'+esc(o)+'</button>';
      });
      h+='</div><div class="pl-fb" aria-live="polite"></div></div>';
    });
    h+='</div>';
  }

  if(b.note) h+='<div class="pl-note">'+b.note+'</div>';
  return h+'</div>';
}

function plLabo(exId, bi, axeId, val){
  const key=exId+'-'+bi, b=PLUS[exId].blocs[bi];
  const st=plLab[key] || (plLab[key]={});
  b.axes.forEach(a=>{ if(st[a.id]==null) st[a.id]=a.opts[0][0]; });
  if(axeId) st[axeId]=val;
  const box=document.getElementById('lab-'+key); if(!box) return;
  box.querySelectorAll('.pl-opt[data-axe]').forEach(el=>{
    const on = st[el.dataset.axe]===el.dataset.val;
    el.classList.toggle('on', on);
    el.setAttribute('aria-pressed', on?'true':'false');
  });
  const o = b.out[b.axes.map(a=>st[a.id]).join('')];
  if(!o) return;
  const out = box.querySelector('.pl-out-w');
  out.innerHTML = o.w.map(plMark).join(' ');
  // Une phrase longue ne tient pas au corps de 27 px : on descend d'un cran.
  out.classList.toggle('is-long', o.w.map(plPlain).join(' ').length > 30);
  box.querySelector('.pl-out-n').textContent = o.n;
  // `say` sert quand le texte affiché contient de la ponctuation de mise en
  // page (une paire « tout · tu » se lit mieux avec une virgule).
  const phrase = o.say || o.w.map(plPlain).join(' ');
  const fid = plAudioId(exId, 'lab', bi, b.axes.map(a=>st[a.id]).join(''));
  box.querySelector('.pl-out .btn-audio-round').onclick = function(){ playWord(this, phrase, fid); };
}

function plCheck(btn, exId, bi, qi, oi){
  const q=PLUS[exId].blocs[bi].qs[qi];
  const wrap=btn.closest('.pl-q');
  const opts=wrap.querySelectorAll('.pl-opt');
  opts.forEach(el=>el.classList.remove('ok','no'));
  const good = oi===q.ok;
  btn.classList.add(good?'ok':'no');
  if(!good) opts[q.ok].classList.add('ok');
  const fb=wrap.querySelector('.pl-fb');
  fb.className='pl-fb on '+(good?'ok':'no');
  fb.innerHTML='<span aria-hidden="true">'+(good?'✓':'✕')+'</span> '+(good?'':'La bonne réponse est « '+esc(q.opts[q.ok])+' ». ')+q.fb;
}

// ── PROPOSITION D'AIDE APRÈS PLUSIEURS ERREURS ────────────────────────
// Le module connaît déjà, à la correction, quels énoncés sont ratés. Au-delà
// d'un seuil, il propose une aide — sans jamais l'imposer ni toucher au score.
// Une seule proposition par exercice et par séance.
const AIDE = {err:{}, etat:{}};      // etat : 'proposee' | 'ouverte' | 'refusee' | 'analysee'
const AIDE_SEUIL = 3;

// Les exercices analysables : ceux dont on peut reconstituer, ligne par ligne,
// ce que l'élève a choisi et ce qu'il fallait choisir.
function releverReponses(exId){
  const ex = EXOS.find(e=>e.id===exId); if(!ex) return [];
  if(ex.type==='vf'){
    return ex.rows.filter(r=>S.vfSel[r.id]).map(r=>({
      enonce:r.txt, choix:S.vfSel[r.id], bonne:r.ok}));
  }
  if(ex.type==='write'){
    return ex.items.map((it,i)=>{
      const inp=document.getElementById('wi_'+exId+'_'+i);
      const val=inp ? inp.value.trim() : '';
      if(!val || !it.accept) return null;
      return {enonce:it.q, choix:val, bonne:it.accept[0]};
    }).filter(Boolean);
  }
  return [];
}

/* Les deux journaux de l'enseignante nomment le même exercice : l'analyse
   d'erreurs y met son titre, les signaux d'aide y mettaient l'identifiant
   court. Deux noms pour une seule chose, et une colonne « Exercice » qu'on ne
   peut pas lire sans le module ouvert à côté. Le titre part des deux côtés.
   Repli sur l'identifiant : un exercice sans titre vaut mieux qu'un vide. */
function titreExo(exId){
  const ex = (typeof EXOS !== 'undefined') && EXOS.find(e => e.id === exId);
  if(ex && ex.tit) return ex.tit;
  if(typeof PLUS !== 'undefined' && PLUS[exId] && PLUS[exId].tit) return PLUS[exId].tit;
  return exId;
}

function evaluerAide(exId, nbErreurs){
  if(!exId) return;
  // L'analyse d'erreurs vaut pour tout exercice reconstituable, avec ou sans
  // mini-leçon.
  if(!PLUS[exId] && !releverReponses(exId).length) return;
  AIDE.err[exId] = Math.max(AIDE.err[exId]||0, nbErreurs);
  if(AIDE.err[exId] >= AIDE_SEUIL && !AIDE.etat[exId]) proposerAide(exId);
}

function proposerAide(exId){
  const card = document.getElementById('exo-'+exId);
  if(!card || card.querySelector('.aide')) return;
  AIDE.etat[exId] = 'proposee';
  const n = AIDE.err[exId];
  const analysable = releverReponses(exId).length > 0;
  const el = document.createElement('div');
  el.className = 'aide';
  el.id = 'aide-' + exId;
  el.innerHTML =
      '<div class="aide-txt"><b>' + n + ' erreurs</b> dans cet exercice.'
    + (PLUS[exId] ? ' La mini-leçon « ' + esc(PLUS[exId].tit) + ' » explique ce point autrement.' : '')
    + '</div>'
    + '<div class="aide-btns">'
    + (analysable
        ? '<button class="btn-oui" type="button" onclick="analyserErreurs(\'' + exId + '\')">'
          + ICON_ASSISTANT + ' Pourquoi je me trompe ?</button>' : '')
    + (PLUS[exId]
        ? '<button class="' + (analysable ? 'btn-non' : 'btn-oui') + '" type="button"'
          + ' onclick="accepterAide(\'' + exId + '\')">Revoir l\'explication</button>' : '')
    + '<button class="btn-non" type="button" onclick="refuserAide(\'' + exId + '\')">Plus tard</button>'
    + '</div>'
    + '<div class="aide-out" id="aideout-' + exId + '" aria-live="polite"></div>';
  card.appendChild(el);
  lmsTrack('aide_proposee', {exercice: titreExo(exId), erreurs: n, analysable: analysable});
}

function accepterAide(exId){
  AIDE.etat[exId] = 'ouverte';
  const el = document.querySelector('#exo-'+exId+' .aide');
  if(el) el.remove();
  lmsTrack('aide_acceptee', {exercice: titreExo(exId), erreurs: AIDE.err[exId]});
  plusOpen(exId, 'labo');
}

// ── NIVEAU 2 : analyse du patron d'erreurs par l'IA ───────────────────
// On envoie l'exercice COMPLET — chaque énoncé, le choix de l'élève, la bonne
// réponse. L'IA ne juge rien : la correction est déjà faite et affichée. Elle
// cherche seulement ce qui se répète dans les erreurs.
async function analyserErreurs(exId){
  const ex = EXOS.find(e=>e.id===exId); if(!ex) return;
  const items = releverReponses(exId);
  const out = document.getElementById('aideout-'+exId);
  const btn = document.querySelector('#aide-'+exId+' .btn-oui');
  if(!items.length || !out) return;

  // Un seul appel par exercice et par séance : l'élève qui s'acharne ne doit
  // pas générer une série d'appels facturés.
  if(btn){ btn.disabled = true; }
  out.className = 'aide-out on wait';
  out.textContent = "L'assistant relit tes réponses…";

  // L'activité se lit dans l'adresse du parent, comme le fait lmsTrack : le
  // module est dans une iframe et ne connaît pas son propre numéro. Sans elle,
  // l'analyse que le serveur garde ne se rattache à aucun module.
  let actId = null, actTitre = '';
  try{
    const up = new URLSearchParams(window.parent.location.search);
    actId = parseInt(up.get('activityId')) || null;
    actTitre = up.get('title') || '';
  }catch(e){}

  try{
    const res = await fetch('/api/analyser-erreurs', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({
        code: studentCode,
        activityId: actId,
        activityTitle: actTitre,
        exercice: ex.tit || '',
        notion: (ex.savoir && ex.savoir.h ? ex.savoir.h.replace(/^›\s*/,'') : ''),
        items: items,
      })});
    const d = await res.json();
    if(!res.ok){
      out.className = 'aide-out on no';
      out.textContent = d.error || 'Service momentanément indisponible.';
      if(btn) btn.disabled = false;      // panne : on laisse réessayer
      return;
    }
    out.className = 'aide-out on';
    out.innerHTML =
        (d.patron ? '<div class="ao-k">Ce qui revient</div><div class="ao-v">'+esc(d.patron)+'</div>' : '')
      + (d.explication ? '<div class="ao-k">Pourquoi</div><div class="ao-v">'+esc(d.explication)+'</div>' : '')
      + (d.conseil ? '<div class="ao-k">La prochaine fois</div><div class="ao-v ao-conseil">'+esc(d.conseil)+'</div>' : '');
    AIDE.etat[exId] = 'analysee';
    lmsTrack('aide_analysee', {exercice: titreExo(exId), erreurs: AIDE.err[exId]});
  }catch(e){
    out.className = 'aide-out on no';
    out.textContent = 'Impossible de contacter le serveur. Réessaie plus tard.';
    if(btn) btn.disabled = false;
  }
}

function refuserAide(exId){
  AIDE.etat[exId] = 'refusee';
  const el = document.querySelector('#exo-'+exId+' .aide');
  if(el) el.remove();
  lmsTrack('aide_refusee', {exercice: titreExo(exId), erreurs: AIDE.err[exId]});
}

let plLastFocus=null;
// `cible` : type de bloc vers lequel faire défiler le panneau ('labo' pour la
// manipulation). Sans lui, l'élève arrive en haut d'une longue leçon.
function plusOpen(exId, cible){
  const P=PLUS[exId]; if(!P) return;
  document.getElementById('plus-eye').textContent = P.eye || 'Mini-leçon';
  document.getElementById('plus-tit').textContent = P.tit;
  const body=document.getElementById('plus-body');
  body.innerHTML = P.blocs.map((b,bi)=>plBloc(b,exId,bi)).join('');
  body.scrollTop=0;
  document.getElementById('plus-ov').classList.add('on');
  // Le défilement appartient à <html> (body est figé à height:100%) — poser
  // overflow:hidden sur body rognerait toute la page.
  document.documentElement.style.overflow='hidden';
  P.blocs.forEach((b,bi)=>{ if(b.t==='labo') plLabo(exId,bi,null,null); });
  plLastFocus=document.activeElement;
  document.getElementById('plus-close').focus();
  lmsTrack('plus_open', {savoir: titreExo(exId), cible: cible || ''});
  if(cible){
    const i = P.blocs.findIndex(b => b.t === cible);
    if(i >= 0){
      const bloc = body.children[i];
      if(bloc){
        bloc.scrollIntoView({block:'start'});
        bloc.classList.add('is-cible');
        setTimeout(()=>bloc.classList.remove('is-cible'), 2500);
      }
    }
  }
}
function plusClose(){
  document.getElementById('plus-ov').classList.remove('on');
  document.documentElement.style.overflow='';
  if(plLastFocus && plLastFocus.focus) plLastFocus.focus();
}
document.getElementById('plus-close').addEventListener('click', plusClose);
document.getElementById('plus-ov').addEventListener('click', e=>{ if(e.target.id==='plus-ov') plusClose(); });
document.addEventListener('keydown', e=>{
  if(e.key==='Escape' && document.getElementById('plus-ov').classList.contains('on')) plusClose();
});

// ── RENDER ────────────────────────────────────────────────────────────
function render(){
  // Le bandeau reprend la section courante (gros titre + phrase d'intro),
  // comme le modèle je-me-prepare.html.
  const cur = SECTIONS.find(s=>s.id===curSec);
  if(cur){
    const tEl=document.getElementById('hdr-title'), lEl=document.getElementById('hdr-lead');
    if(tEl) tEl.textContent = cur.title;
    if(lEl) lEl.textContent = cur.lead || '';
  }
  SECTIONS.forEach(sec=>{
    document.getElementById('tab-'+sec.id).classList.toggle('on', curSec===sec.id);
    document.getElementById('sec-'+sec.id).classList.toggle('on', curSec===sec.id);
    const zids=Object.keys(ZONES).filter(z=>{const ex=EXOS.find(e=>e.id===ZONES[z].exo);return ex.sec===sec.id});
    const done=zids.length>0&&zids.every(z=>TR.correct[z]);
    document.getElementById('tab-'+sec.id).classList.toggle('done',done);
  });
  const ban=document.getElementById('sel-banner');
  if(S.sel){ban.classList.add('on');document.getElementById('sel-lbl').textContent=S.sel.lbl}
  else ban.classList.remove('on');
  measureChrome();   // la bannière change la hauteur de l'en-tête collant

  const used=usedIds();

// ── REPRISE:début — greffé par build/greffe_reprise.py ──
// L'élève ouvre le module, s'arrête, retourne à sa fiche, puis revient ici.
// Sans mémoire locale il repartait de la première section avec tout effacé :
// l'état vit dans des variables JavaScript, et le serveur ne garde que des
// compteurs (zonesDone, firstTry…), jamais les réponses elles-mêmes. On garde
// donc l'avancement dans le navigateur, une clé par élève et par module.
const RE_CLE = MODULE_SLUG + ':' + (studentCode || 'anonyme') + ':etat';
const RE_VERSION = 1;
let reMinuteur = null;
let reGel = false;   // vrai pendant la restauration : on n'écrase pas la sauvegarde

// Les réponses écrites vivent dans le DOM, pas dans S : on les relève à part.
function reChamps(){
  const out = {};
  document.querySelectorAll('.winput, textarea').forEach((el, i) => {
    if (el.value) out[el.id || ('champ' + i)] = el.value;
  });
  return out;
}

function reEtat(){
  return {
    v: RE_VERSION, quand: Date.now(), curSec: curSec,
    pl: S.pl, vfSel: S.vfSel, fb: S.fb,
    vocabPairs: S.vocabPairs, vocabOrder: S.vocabOrder,
    attempts: TR.attempts, correct: TR.correct,
    champs: reChamps(),
  };
}

function reEcrire(){
  try { localStorage.setItem(RE_CLE, JSON.stringify(reEtat())); } catch(e) {}
}

// render() est appelé à chaque clic : on regroupe les écritures.
function reSauver(){
  if (reGel) return;
  clearTimeout(reMinuteur);
  reMinuteur = setTimeout(reEcrire, 300);
}

function reEffacer(){
  clearTimeout(reMinuteur);
  try { localStorage.removeItem(RE_CLE); } catch(e) {}
}

function reLire(){
  try {
    const d = JSON.parse(localStorage.getItem(RE_CLE) || 'null');
    return (d && d.v === RE_VERSION) ? d : null;
  } catch(e) { return null; }
}

function reprendre(){
  const d = reLire();
  if (!d) return null;
  reGel = true;
  S.pl = d.pl || {};
  S.vfSel = d.vfSel || {};
  S.fb = d.fb || {};
  if (d.vocabPairs) S.vocabPairs = d.vocabPairs;
  if (d.vocabOrder) S.vocabOrder = d.vocabOrder;
  TR.attempts = d.attempts || {};
  TR.correct = d.correct || {};
  // Une section disparue depuis la dernière visite ne doit pas bloquer
  // l'ouverture ; la greffe des sections peut encore déplacer l'élève si
  // celle-ci a été refermée par l'enseignant.
  if (d.curSec && SECTIONS.some(s => s.id === d.curSec)) curSec = d.curSec;
  const champs = d.champs || {};
  document.querySelectorAll('.winput, textarea').forEach((el, i) => {
    const val = champs[el.id || ('champ' + i)];
    if (val != null) el.value = val;
  });
  if (typeof peCount === 'function') peCount();
  reGel = false;
  return d;
}

// Une réponse écrite déjà validée reste verte — et verrouillée quand la bonne
// réponse était connue d'avance, comme au moment de la validation.
function reMarquerEcrits(){
  EXOS.filter(e => e.type === 'write').forEach(ex => {
    ex.items.forEach((it, i) => {
      if (!TR.correct['w_' + ex.id + '_' + i]) return;
      const inp = document.getElementById('wi_' + ex.id + '_' + i);
      if (!inp) return;
      inp.classList.add('good');
      if (it.accept) inp.disabled = true;
    });
  });
}

// Le pointage des vrai/faux est recalculé : on ne réaffiche le total qu'aux
// exercices que l'élève avait réellement corrigés (S.fb rempli partout).
function reMarquerVf(){
  EXOS.filter(e => e.type === 'vf').forEach(ex => {
    const repondu = ex.rows.filter(r => S.vfSel[r.id]).length;
    if (!repondu) return;
    const corrige = ex.rows.every(r => S.fb[r.id]);
    updateVfScore(ex, corrige);
    if (!corrige) return;
    const bons = ex.rows.filter(r => S.vfSel[r.id] === r.ok).length;
    const sum = document.getElementById('vfsum-' + ex.id);
    if (sum) {
      sum.className = 'vf-summary ok';
      sum.textContent = bons + ' / ' + ex.rows.length + ' bonnes réponses';
    }
  });
}

function reQuand(ms){
  if (Date.now() - ms < 3600e3) return 'il y a moins d’une heure';
  const j = new Date(ms);
  const h = String(j.getHours()).padStart(2, '0') + ' h ' + String(j.getMinutes()).padStart(2, '0');
  if (j.toDateString() === new Date().toDateString()) return 'plus tôt aujourd’hui, à ' + h;
  const mois = ['janvier','février','mars','avril','mai','juin','juillet',
                'août','septembre','octobre','novembre','décembre'];
  return 'le ' + j.getDate() + ' ' + mois[j.getMonth()] + ', à ' + h;
}

// La reprise ne doit jamais être une prison : le bouton remet tout à zéro.
function reBanniere(d){
  const chrome = document.getElementById('chrome');
  if (!chrome || !chrome.parentNode) return;
  const el = document.createElement('div');
  el.id = 're-banniere';
  el.setAttribute('role', 'status');
  const n = Object.keys(TR.correct).length;
  el.innerHTML = '<span class="re-txt">↩︎ Tu reprends où tu étais : '
    + (n ? n + ' réponse' + (n > 1 ? 's' : '') + ' déjà juste' + (n > 1 ? 's' : '')
         : 'ton travail est retrouvé')
    + '.<span class="re-quand">Dernier passage ' + reQuand(d.quand) + '.</span></span>'
    + '<button type="button" id="re-recommencer">↺ Recommencer le module</button>'
    + '<button type="button" id="re-fermer" aria-label="Masquer ce message">✕</button>';
  chrome.parentNode.insertBefore(el, chrome.nextSibling);
  document.getElementById('re-recommencer').addEventListener('click', () => {
    if (!confirm('Recommencer le module depuis le début ? Tes réponses seront effacées.')) return;
    reGel = true;   // le rechargement ne doit pas réécrire ce qu'on vient d'effacer
    reEffacer();
    location.reload();
  });
  document.getElementById('re-fermer').addEventListener('click', () => el.remove());
}

  function contexte() {

      var p = new URLSearchParams(window.parent.location.search);
      var code = p.get('code');

     un identifiant ; l'enseignante a besoin des mots. */
  function etiquetteBanc(ex, id) {

        if (!b || !b.classList.contains('verrouillee')) return;
        e.stopPropagation();
        e.preventDefault();
        avis(b.title || 'Cette partie n’est pas encore ouverte.');
      }, true);
    }

    var ouvertes = sections.filter(function (s) { return s.ouverte; });
    if (!ouvertes.length) {
      avis('Aucune partie de ce module n’est ouverte pour l’instant. '
           + 'Ton enseignante les ouvrira une à une.');
      return;
    }
    var courante = parId[curSec];
    if (courante && !courante.ouverte) {
      curSec = ouvertes[0].id;
      avis('Cette partie n’est pas encore ouverte : voici celle que tu peux faire.');
    }
    if (typeof render === 'function') render();
  }

  function demarrer() {
    if (typeof SECTIONS === 'undefined' || typeof curSec === 'undefined') return;
    var code = (typeof studentCode !== 'undefined' && studentCode) || '';
    if (!code) return;   // hors session : le module s'ouvre en entier
    fetch('/api/student/sections?code=' + encodeURIComponent(code)
          + '&activityId=' + ACTIVITE)
      .then(function (r) { return r.ok ? r.json() : null; })
      .then(function (d) {
        if (d && d.decoupe && d.sections && d.sections.length) appliquer(d.sections);
      })
      .catch(function () { /* serveur muet : on n'enlève rien à l'élève */ });
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', demarrer);
  } else {
    demarrer();
  }
})();
</script>

<script>
(function () {
  var OUVERTE = true;      // le défaut : on n'enlève rien à l'élève
  var NOTE = 'Ton enseignante a fermé la transcription : écoute le dialogue.';

  /* Les deux endroits où un module montre le texte d'un dialogue :
     — la section de mise en situation, bouton « Lire la transcription » et
       bloc `#script-<sectionId>` ;
     — un exercice bâti sur un dialogue, avec son `<details>` « Afficher le
       texte du dialogue ».
     Les deux sont redessinés à chaque `render()`, donc on repasse après lui
     plutôt que de nettoyer une fois. */
  function retirer() {
    if (OUVERTE) return;
    var boutons = document.querySelectorAll(
      'button[onclick^="toggleScript"], [onclick^="toggleScript"]');
    for (var i = 0; i < boutons.length; i++) {
      var b = boutons[i];
      var note = document.createElement('span');
      note.className = 'transcription-fermee';
      note.textContent = NOTE;
      note.style.cssText = 'font-size:13px;font-weight:700;color:var(--ink-500,'
        + '#64748b);align-self:center';
      b.parentNode.replaceChild(note, b);
    }
    // Le bloc de texte lui-même, et le `<details>` des exercices.
    var textes = document.querySelectorAll('.dial-txt');
    for (var j = 0; j < textes.length; j++) {
      var t = textes[j];
      var det = t.closest ? t.closest('details') : null;
      var mort = det || t;
      if (det) {
        var note2 = document.createElement('div');
        note2.className = 'transcription-fermee';
        note2.style.cssText = 'font-size:13px;font-weight:700;margin-bottom:12px;'
          + 'color:var(--ink-500,#64748b)';
        note2.textContent = NOTE;
        mort.parentNode.replaceChild(note2, mort);
      } else {
        mort.parentNode.removeChild(mort);
      }
    }
  }

  /* Ceinture : si un bouton nous échappe, il ne doit rien ouvrir. */
  if (typeof window.toggleScript === 'function') {
    var toggleOrig = window.toggleScript;
    window.toggleScript = function () {
      if (!OUVERTE) return;
      return toggleOrig.apply(this, arguments);
    };
  }

  function surveiller() {
    if (typeof render === 'function') {
      var rendreOrig = render;
      render = function () {
        var r = rendreOrig.apply(this, arguments);
        retirer();
        return r;
      };
    }
    retirer();
  }

  function demarrer() {
    var code = (typeof studentCode !== 'undefined' && studentCode) || '';
    if (!code) return;   // hors session : le module s'ouvre en entier
    fetch('/api/student/sections?code=' + encodeURIComponent(code)
          + '&activityId=' + 92)
      .then(function (r) { return r.ok ? r.json() : null; })
      .then(function (d) {
        // `undefined` sur un serveur qui ne connaît pas encore le champ :
        // seul un `false` franc ferme quelque chose.
        if (d && d.transcription === false) { OUVERTE = false; surveiller(); }
      })
      .catch(function () { /* serveur muet : la transcription reste offerte */ });
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', demarrer);
  } else {
    demarrer();
  }
})();
</script>
