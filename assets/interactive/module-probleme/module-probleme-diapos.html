<!DOCTYPE html>
<html lang="fr"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Module 9 · Le parcours guidé, diapositive par diapositive</title>
<link rel="stylesheet" href="/assets/design-system/styles.css">
<style>
/* ═══════════════════════════════════════════════════════════════════════
   LECTEUR « DIAPOSITIVE PAR DIAPOSITIVE » · essai de format
   ───────────────────────────────────────────────────────────────────────
   Même contenu que la section « Je découvre » du module 9, présenté
   comme un cours en ligne traditionnel : une scène à la fois, un
   contrôle de progression en bas, un sommaire à gauche, et une couche
   de rétroaction qui recouvre la scène après validation.

   Tout vient du système de design (assets/design-system/). Ce bloc
   n'ajoute que le châssis du lecteur — rien n'est redéfini.

   Deux contraintes du système gouvernent les écarts avec un lecteur
   commercial :
   · l'association se fait par CLIC-CLIC, jamais par glisser-déposer,
     pour rester utilisable au clavier ;
   · sous 900 px la scène cesse d'être un cadre 16:9 et devient une
     colonne qui défile — le format lettre-boîte est illisible sur un
     téléphone, et beaucoup d'apprenants n'ont que ça.
   ═══════════════════════════════════════════════════════════════════════ */

:root{
  --sec: var(--teal-700);        /* couleur de la section « Je découvre » */
  --sec-soft: var(--teal-100);
  --chrome: #14181A;             /* châssis du lecteur : encre, pas noir pur */
  --chrome-2: #1F2528;
  --chrome-line: #313A3E;
  --chrome-ink: #E8EDEE;
  --chrome-mute: #9BA8AC;
  --top-h: 60px;
  --bot-h: 76px;
  --menu-w: 268px;
}
html,body{height:100%}
body{background:var(--chrome);overflow:hidden}

/* ── Châssis ──────────────────────────────────────────────────────── */
.player{position:fixed;inset:0;display:grid;
        grid-template-rows:var(--top-h) 1fr var(--bot-h);
        grid-template-columns:var(--menu-w) 1fr;
        grid-template-areas:"top top" "menu stage" "bot bot"}

/* ── Barre du haut ────────────────────────────────────────────────── */
.top{grid-area:top;background:var(--chrome);border-bottom:1px solid var(--chrome-line);
     display:flex;align-items:center;gap:var(--sp-4);padding:0 var(--sp-5);min-width:0}
.top__burger{display:none}
.top__id{min-width:0;flex:1}
.top__eyebrow{font-size:var(--fs-meta);font-weight:var(--fw-bold);
              letter-spacing:var(--ls-label);text-transform:uppercase;color:var(--chrome-mute)}
.top__titre{font-size:var(--fs-ui);font-weight:var(--fw-black);color:var(--chrome-ink);
            white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top__compte{font-size:var(--fs-ui-sm);font-weight:var(--fw-bold);color:var(--chrome-mute);
             white-space:nowrap}
.top__sortie{font-size:var(--fs-ui-sm);font-weight:var(--fw-bold);color:var(--chrome-mute);
             text-decoration:none;white-space:nowrap}
.top__sortie:hover{color:var(--chrome-ink)}

/* Barre de progression : elle traverse toute la largeur, sous la barre du haut. */
.prog{position:absolute;left:0;right:0;top:calc(var(--top-h) - 3px);height:3px;
      background:var(--chrome-line);z-index:4}
.prog__fill{height:100%;background:var(--green-600);width:0;
            transition:width .35s cubic-bezier(.4,0,.2,1)}

/* ── Sommaire ─────────────────────────────────────────────────────── */
.menu{grid-area:menu;background:var(--chrome-2);border-right:1px solid var(--chrome-line);
      overflow-y:auto;padding:var(--sp-4) 0 var(--sp-8)}
.menu__grp{font-size:var(--fs-meta);font-weight:var(--fw-black);letter-spacing:var(--ls-label);
           text-transform:uppercase;color:var(--chrome-mute);
           padding:var(--sp-5) var(--sp-5) var(--sp-2)}
.menu__grp:first-child{padding-top:var(--sp-2)}
/* Titre de partie : plus fort que le groupe, avec un filet au-dessus. */
.menu__partie{margin-top:var(--sp-5);padding:var(--sp-4) var(--sp-5) 0;
              border-top:1px solid var(--chrome-line);
              font-size:var(--fs-ui-sm);font-weight:var(--fw-black);
              color:#fff;letter-spacing:-.01em}
.menu__partie:first-child{margin-top:0;border-top:0;padding-top:var(--sp-2)}
.menu__partie + .menu__grp{padding-top:var(--sp-3)}
.menu__item{display:flex;align-items:center;gap:var(--sp-3);width:100%;
            min-height:var(--tap-min);padding:var(--sp-2) var(--sp-5);
            background:none;border:0;border-left:3px solid transparent;
            font:inherit;font-size:var(--fs-ui-sm);font-weight:var(--fw-semi);
            color:var(--chrome-mute);text-align:left;cursor:pointer}
.menu__item:hover{background:rgba(255,255,255,.05);color:var(--chrome-ink)}
.menu__item.is-cur{background:rgba(255,255,255,.08);color:#fff;
                   border-left-color:var(--green-600);font-weight:var(--fw-black)}
.menu__item[disabled]{opacity:.42;cursor:not-allowed}
.menu__item[disabled]:hover{background:none;color:var(--chrome-mute)}
.menu__pastille{flex:0 0 auto;width:22px;height:22px;border-radius:50%;
                border:1.5px solid currentColor;display:flex;align-items:center;
                justify-content:center;font-size:11px;font-weight:var(--fw-black)}
.menu__item.is-fait .menu__pastille{background:var(--green-600);border-color:var(--green-600);color:#fff}
.menu__lbl{min-width:0;flex:1}

/* ── Scène ────────────────────────────────────────────────────────── */
.stagewrap{grid-area:stage;position:relative;overflow:auto;
           display:flex;align-items:center;justify-content:center;padding:var(--sp-6)}
.stage{position:relative;width:100%;max-width:980px;aspect-ratio:16/9;
       background:var(--surface-page);color:var(--text-strong);
       border-radius:var(--r-lg);box-shadow:0 18px 48px rgba(0,0,0,.42);
       overflow:hidden;display:flex;flex-direction:column}
.scene{flex:1;min-height:0;overflow-y:auto;padding:var(--sp-8) var(--sp-8) var(--sp-6)}
.scene--plein{padding:0}

/* En-tête de diapositive */
.dhead{display:flex;align-items:baseline;gap:var(--sp-3);margin-bottom:var(--sp-1)}
.dhead__eyebrow{font-size:var(--fs-label);font-weight:var(--fw-black);
                letter-spacing:var(--ls-label);text-transform:uppercase;color:var(--sec)}
.dhead__rule{flex:1;height:1px;background:var(--border)}
.dtitre{font-size:var(--fs-h2);font-weight:var(--fw-black);margin:0 0 var(--sp-1)}
.dsub{font-size:var(--fs-body-sm);font-weight:var(--fw-medium);color:var(--text-muted);
      margin:0 0 var(--sp-5)}

/* ── Couverture ───────────────────────────────────────────────────── */
.cover{height:100%;display:flex;flex-direction:column;justify-content:center;
       padding:var(--sp-12) var(--sp-8);background:var(--surface-band)}
.cover__eyebrow{font-size:var(--fs-label);font-weight:var(--fw-black);
                letter-spacing:var(--ls-label);text-transform:uppercase;color:var(--text-accent);
                display:flex;align-items:center;gap:var(--sp-2)}
.cover__eyebrow::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--accent)}
.cover h1{margin:var(--sp-3) 0 var(--sp-4)}
.cover__lead{font-size:var(--fs-lead);font-weight:var(--fw-medium);color:var(--ink-500);max-width:52ch}
.cover__meta{display:flex;flex-wrap:wrap;gap:var(--sp-5);margin-top:var(--sp-6);
             font-size:var(--fs-meta);font-weight:var(--fw-bold);
             letter-spacing:var(--ls-label);text-transform:uppercase;color:var(--text-muted)}

/* ── Listes d'objectifs ───────────────────────────────────────────── */
.obj{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:var(--sp-3)}
.obj li{display:flex;gap:var(--sp-4);align-items:flex-start;
        font-size:var(--fs-body);font-weight:var(--fw-semi)}
.obj li::before{content:counter(o);counter-increment:o;flex:0 0 auto;
                width:32px;height:32px;border-radius:50%;background:var(--sec-soft);
                color:var(--sec);display:flex;align-items:center;justify-content:center;
                font-size:15px;font-weight:var(--fw-black)}
.obj{counter-reset:o}

/* ── Mise en situation ────────────────────────────────────────────── */
.situ{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:var(--sp-6);align-items:start}
.situ__img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:var(--r-lg);
           border:1px solid var(--border)}
.situ p{font-size:var(--fs-lead);font-weight:var(--fw-medium);color:var(--text-body);
        line-height:var(--lh-loose)}
.situ p + p{margin-top:var(--sp-4)}
@media (max-width:860px){.situ{grid-template-columns:1fr}}

/* ── Dialogue ─────────────────────────────────────────────────────── */
.dlg{display:flex;flex-direction:column;gap:0}
.dlg__ligne{display:grid;grid-template-columns:104px minmax(0,1fr);gap:var(--sp-4);
            align-items:baseline;padding:var(--sp-3) var(--sp-3);
            border-bottom:1px solid var(--border);border-radius:var(--r-sm);
            transition:background .2s}
.dlg__ligne.is-cur{background:var(--sec-soft)}
.dlg__qui{font-size:var(--fs-label);font-weight:var(--fw-black);letter-spacing:.06em;
          color:var(--sec)}
.dlg__txt{font-size:var(--fs-body-sm);font-weight:var(--fw-medium);line-height:1.55;
          color:var(--text-body)}
.dlg__barre{display:flex;flex-wrap:wrap;gap:var(--sp-3);align-items:center;
            margin-bottom:var(--sp-4)}

/* ── Encadré de savoir ────────────────────────────────────────────── */
.sav{border:1px solid var(--border);border-radius:var(--r-lg);overflow:hidden;
     background:var(--surface-card)}
.sav__band{background:var(--sec);color:#fff;padding:var(--sp-3) var(--sp-5);
           font-size:var(--fs-meta);font-weight:var(--fw-black);
           letter-spacing:.14em;text-transform:uppercase}
.sav__row{display:grid;grid-template-columns:minmax(150px,210px) minmax(0,1fr);
          gap:var(--sp-5);align-items:baseline;padding:var(--sp-4) var(--sp-5);
          border-bottom:1px solid var(--paper-200)}
.sav__row:last-child{border-bottom:0}
.sav__k{font-size:var(--fs-body-sm);font-weight:var(--fw-black);color:var(--text-strong)}
.sav__v{font-size:var(--fs-body-sm);font-weight:var(--fw-medium);line-height:var(--lh-loose);
        color:var(--text-body)}
.sav__mots{display:flex;flex-wrap:wrap;gap:var(--sp-2);margin-top:var(--sp-3)}
/* Exemple à l'intérieur d'un savoir : filet gauche à la couleur de section. */
.savoir-ex{display:block;margin:var(--sp-2) 0 1px;padding:var(--sp-2) var(--sp-3);
           border-left:3px solid var(--sec);border-radius:0 var(--r-sm) var(--r-sm) 0;
           background:var(--surface-sunken);font-style:italic;font-weight:var(--fw-semi);
           line-height:1.45;color:var(--sec)}
.savoir-ex + .savoir-ex{margin-top:var(--sp-1)}
@media (max-width:760px){.sav__row{grid-template-columns:1fr;gap:var(--sp-1)}}

/* ── Exercices ────────────────────────────────────────────────────── */
.qrows{display:flex;flex-direction:column;gap:var(--sp-3)}

/* Choix (VRAI/FAUX, [ø]/[œ]) */
.qrow{display:flex;flex-wrap:wrap;align-items:center;gap:var(--sp-3);
      padding:var(--sp-3) var(--sp-4);border:1px solid var(--border);
      border-radius:var(--r-lg);background:var(--surface-card)}
.qrow__txt{flex:1;min-width:180px;font-size:var(--fs-body-sm);font-weight:var(--fw-semi)}
.qrow__opts{display:flex;gap:var(--sp-2);flex-shrink:0}
.opt{min-height:var(--tap-min);min-width:74px;padding:0 var(--sp-4);
     border:1.5px solid var(--border);border-radius:var(--r-pill);
     background:var(--surface-card);color:var(--text-body);
     font:inherit;font-size:var(--fs-ui-sm);font-weight:var(--fw-bold);cursor:pointer}
.opt:hover{border-color:var(--ink-400)}
.opt.is-sel{background:var(--sel-bg);border-color:var(--sel-line);color:var(--sel-ink)}
.qrow.fb-ok{background:var(--ok-bg);border-color:var(--ok-line)}
.qrow.fb-no{background:var(--no-bg);border-color:var(--no-line)}
.qrow__verdict{flex:0 0 auto;font-size:var(--fs-ui-sm);font-weight:var(--fw-black)}
.qrow.fb-ok .qrow__verdict{color:var(--ok-ink)}
.qrow.fb-no .qrow__verdict{color:var(--no-ink)}

/* Saisie au clavier : l'énoncé porte un trou, le champ est dans le trou. */
.qsais{display:flex;flex-direction:column;gap:var(--sp-3)}
.qsais--duo{display:grid;grid-template-columns:1fr 1fr;gap:var(--sp-3)}
.srow{padding:var(--sp-3) var(--sp-4);border:1px solid var(--border);
      border-radius:var(--r-lg);background:var(--surface-card)}
.srow__q{font-size:var(--fs-body-sm);font-weight:var(--fw-semi);color:var(--text-strong);
         line-height:var(--lh-loose)}
/* Le trou de l'énoncé doit se voir : un trait, pas un blanc. */
.trou{display:inline-block;width:5.5ch;height:0;vertical-align:baseline;
      border-bottom:2px solid var(--sec);margin:0 2px}
.srow input{min-height:var(--tap-min);width:100%;margin-top:var(--sp-2);
            padding:0 var(--sp-4);border:1.5px solid var(--border);border-radius:var(--r-sm);
            background:var(--surface-sunken);color:var(--text-strong);
            font:inherit;font-size:var(--fs-body-sm);font-weight:var(--fw-semi)}
.srow input:focus{border-color:var(--accent);background:var(--white)}
.srow.fb-ok{background:var(--ok-bg);border-color:var(--ok-line)}
.srow.fb-no{background:var(--no-bg);border-color:var(--no-line)}
.srow.fb-ok input,.srow.fb-no input{background:var(--white)}
.srow__verdict{margin-top:var(--sp-2);font-size:var(--fs-ui-sm);font-weight:var(--fw-black)}
.srow.fb-ok .srow__verdict{color:var(--ok-ink)}
.srow.fb-no .srow__verdict{color:var(--no-ink)}
@media (max-width:760px){.qsais--duo{grid-template-columns:1fr}}

/* Association : rangée = énoncé + emplacement à remplir */
.qassoc{display:flex;flex-direction:column;gap:var(--sp-3)}
.arow{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) auto;gap:var(--sp-3);
      align-items:center;padding:var(--sp-3) var(--sp-4);border:1px solid var(--border);
      border-radius:var(--r-lg);background:var(--surface-card)}
.arow__q{font-size:var(--fs-body-sm);font-weight:var(--fw-black);color:var(--text-strong)}
.arow.is-cible{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.arow.fb-ok{background:var(--ok-bg);border-color:var(--ok-line)}
.arow.fb-no{background:var(--no-bg);border-color:var(--no-line)}
.slot{min-height:var(--tap-min);width:100%;padding:var(--sp-2) var(--sp-4);
      border:1.5px dashed var(--drop-line);border-radius:var(--r-sm);
      background:var(--drop-bg);color:var(--text-muted);
      font:inherit;font-size:var(--fs-body-sm);font-weight:var(--fw-medium);
      text-align:left;cursor:pointer}
.slot.is-rempli{border-style:solid;border-color:var(--sel-line);background:var(--sel-bg);
                color:var(--sel-ink);font-weight:var(--fw-semi)}
.arow__verdict{font-size:var(--fs-ui-sm);font-weight:var(--fw-black);white-space:nowrap}
.arow.fb-ok .arow__verdict{color:var(--ok-ink)}
.arow.fb-no .arow__verdict{color:var(--no-ink)}
.arow__bonne{grid-column:1/-1;font-size:var(--fs-body-sm);font-weight:var(--fw-semi);
             color:var(--no-ink)}
@media (max-width:760px){.arow{grid-template-columns:1fr;gap:var(--sp-2)}}

/* Banque de réponses — dans un plateau fixe au bas de la scène, hors du
   flux qui défile. Quatre énoncés et leur banque ne tiennent pas dans un
   cadre 16:9 ; plutôt que de faire disparaître la banque sous le pli, on
   la sort du défilement. */
.tray{flex:0 0 auto;display:none;border-top:1px solid var(--border);
      background:var(--surface-sunken);padding:var(--sp-4) var(--sp-8);
      max-height:40%;overflow-y:auto}
.tray.is-on{display:block}
.banque{padding:0;border:0;background:none}
.banque__lbl{font-size:var(--fs-label);font-weight:var(--fw-black);
             letter-spacing:var(--ls-label);text-transform:uppercase;
             color:var(--text-muted);margin-bottom:var(--sp-3)}
.banque__items{display:flex;flex-wrap:wrap;gap:var(--sp-2)}
.jeton{min-height:var(--tap-min);padding:var(--sp-2) var(--sp-4);
       border:1.5px solid var(--border);border-radius:var(--r-pill);
       background:var(--surface-card);color:var(--text-body);
       font:inherit;font-size:var(--fs-ui-sm);font-weight:var(--fw-semi);
       cursor:pointer;text-align:left}
.jeton:hover{border-color:var(--ink-400)}
.jeton.is-pris{opacity:.32;pointer-events:none}

/* Association avec photos */
.banque__items--img{gap:var(--sp-3)}
.vignette{width:104px;padding:0;border:2px solid var(--border);border-radius:var(--r-sm);
          background:var(--surface-card);cursor:pointer;overflow:hidden;line-height:0}
.vignette img{width:100%;aspect-ratio:1/1;object-fit:cover;display:block}
.vignette.is-sel{border-color:var(--sel-line);box-shadow:0 0 0 3px var(--paper-200)}
.vignette.is-pris{opacity:.28;pointer-events:none}
.slot--img{display:flex;align-items:center;gap:var(--sp-3);min-height:64px}
.slot--img img{width:52px;height:52px;object-fit:cover;border-radius:var(--r-sm);flex:0 0 auto}

/* ── Barre du bas ─────────────────────────────────────────────────── */
.bot{grid-area:bot;background:var(--chrome);border-top:1px solid var(--chrome-line);
     display:flex;align-items:center;gap:var(--sp-3);padding:0 var(--sp-5)}
.bot__spacer{flex:1}
.nav{min-height:var(--tap-comfort);padding:0 var(--sp-6);border-radius:var(--r-pill);
     border:1.5px solid var(--chrome-line);background:transparent;color:var(--chrome-ink);
     font:inherit;font-size:var(--fs-ui);font-weight:var(--fw-bold);cursor:pointer;
     display:inline-flex;align-items:center;gap:var(--sp-2)}
.nav:hover:not([disabled]){background:rgba(255,255,255,.07)}
.nav[disabled]{opacity:.35;cursor:not-allowed}
.nav--pri{background:var(--green-600);border-color:var(--green-600);color:#fff}
.nav--pri:hover:not([disabled]){background:var(--green-800);border-color:var(--green-800)}
.bot__aide{font-size:var(--fs-ui-sm);font-weight:var(--fw-semi);color:var(--chrome-mute)}

/* ── Couche de rétroaction ────────────────────────────────────────── */
.layer{position:absolute;inset:0;z-index:6;display:none;
       align-items:flex-end;justify-content:center;
       background:rgba(20,24,26,.44)}
.layer.is-on{display:flex}
.layer__panneau{width:100%;background:var(--surface-card);
                border-top:4px solid var(--sec);
                border-radius:var(--r-lg) var(--r-lg) 0 0;
                padding:var(--sp-6) var(--sp-8);
                box-shadow:0 -12px 32px rgba(0,0,0,.2);
                animation:monte .28s cubic-bezier(.2,.8,.3,1)}
@keyframes monte{from{transform:translateY(100%)}to{transform:translateY(0)}}
.layer--ok .layer__panneau{border-top-color:var(--ok-line)}
.layer--no .layer__panneau{border-top-color:var(--no-line)}
.layer__k{font-size:var(--fs-label);font-weight:var(--fw-black);
          letter-spacing:var(--ls-label);text-transform:uppercase;margin-bottom:var(--sp-1)}
.layer--ok .layer__k{color:var(--ok-ink)}
.layer--no .layer__k{color:var(--no-ink)}
.layer__t{font-size:var(--fs-h3);font-weight:var(--fw-black);margin-bottom:var(--sp-2)}
.layer__p{font-size:var(--fs-body-sm);font-weight:var(--fw-medium);color:var(--text-body);
          max-width:64ch}
.layer__actions{display:flex;flex-wrap:wrap;gap:var(--sp-3);margin-top:var(--sp-5)}
.lbtn{min-height:var(--tap-comfort);padding:0 var(--sp-6);border-radius:var(--r-pill);
      border:1.5px solid var(--border);background:var(--surface-card);color:var(--text-strong);
      font:inherit;font-size:var(--fs-ui);font-weight:var(--fw-bold);cursor:pointer}
.lbtn--pri{background:var(--sel-bg);border-color:var(--sel-line);color:var(--sel-ink)}

/* ── Boutons d'écoute ─────────────────────────────────────────────── */
.son{min-height:var(--tap-min);padding:0 var(--sp-4);border-radius:var(--r-pill);
     border:1.5px solid var(--border);background:var(--surface-card);color:var(--text-body);
     font:inherit;font-size:var(--fs-ui-sm);font-weight:var(--fw-bold);cursor:pointer;
     display:inline-flex;align-items:center;gap:var(--sp-2)}
.son:hover{border-color:var(--audio);color:var(--audio)}
.son.is-on{background:var(--audio);border-color:var(--audio);color:#fff}
.son--rond{min-width:var(--tap-min);padding:0;justify-content:center}
.son__pt{width:9px;height:9px;border-radius:50%;background:var(--audio);flex:0 0 auto}
.son.is-on .son__pt{background:#fff}

/* ── Bilan ────────────────────────────────────────────────────────── */
.bilan__score{font-size:clamp(48px,9vw,86px);font-weight:var(--fw-black);
              line-height:1;color:var(--sec);letter-spacing:-.03em}
.bilan__sur{font-size:var(--fs-lead);font-weight:var(--fw-bold);color:var(--text-muted)}

const E = {

  fini: new Set(),      // diapositives dont l'exercice est validé
  rep: {},              // réponses par identifiant de rangée
  essais: {},           // nombre de validations par diapositive
  score: {},            // {idx: {bon, total}} — au premier essai
  cible: null,          // rangée en attente d'une réponse (association)
  audio: null,
};

const $  = s => document.querySelector(s);
const el = (t,c,h)=>{const n=document.createElement(t); if(c)n.className=c; if(h!=null)n.innerHTML=h; return n;};
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const melange = a => {const b=a.slice(); for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1)); [b[i],b[j]]=[b[j],b[i]];} return b;};

const estQ = s => s.type === 'q';

/* ═══════════════════════════════════════════════════════════════════════
   4 · AUDIO — un MP3 quand il existe, la synthèse vocale sinon
   ═══════════════════════════════════════════════════════════════════════ */

function stopAudio(){
  if(E.audio){ E.audio.pause(); E.audio = null; }
  if(window.speechSynthesis) speechSynthesis.cancel();
  document.querySelectorAll('.son.is-on').forEach(b=>b.classList.remove('is-on'));
}

function parle(texte){
  if(!window.speechSynthesis) return;
  const u = new SpeechSynthesisUtterance(texte);
  u.lang = 'fr-CA'; u.rate = .92;
  const v = speechSynthesis.getVoices().find(x=>/^fr/i.test(x.lang));
  if(v) u.voice = v;
  speechSynthesis.speak(u);
}

// Joue le fichier s'il existe ; retombe sur la synthèse vocale sinon.
function joue(btn, fichier, texteReplis){
  stopAudio();
  if(btn) btn.classList.add('is-on');
  const fini = ()=>{ if(btn) btn.classList.remove('is-on'); };
  if(!fichier){ if(texteReplis) parle(texteReplis); setTimeout(fini, 900); return; }
  const a = new Audio(`/assets/interactive/${MODULE}/sons/${fichier}.mp3?v=${AUDIO_V}`);
  E.audio = a;
  a.onended = fini;
  a.onerror = ()=>{ fini(); if(texteReplis) parle(texteReplis); };
  a.play().catch(()=>{ fini(); if(texteReplis) parle(texteReplis); });
}

// Lecture suivie du dialogue : une réplique après l'autre. Les répliques et
// le dossier des MP3 viennent de la diapositive courante.
let dlgIdx = -1, dlgEnCours = false, dlgLignes = [], dlgDossier = '';
function joueDialogue(btn){
  if(dlgEnCours){ stopDialogue(btn); return; }
  const s = SLIDES[E.i];
  dlgLignes = s.lignes || []; dlgDossier = s.dossier || '';
  dlgEnCours = true; dlgIdx = -1;
  btn.classList.add('is-on');
  btn.querySelector('.son__lbl').textContent = 'Arrêter';
  suivanteReplique(btn);
}
function stopDialogue(btn){
  dlgEnCours = false; stopAudio();
  document.querySelectorAll('.dlg__ligne').forEach(l=>l.classList.remove('is-cur'));
  if(btn){ btn.classList.remove('is-on'); btn.querySelector('.son__lbl').textContent = 'Écouter le dialogue'; }
}
// « MME RIOUX » donne « mme_rioux » : les espaces deviennent des traits
// soulignés, c'est la convention des fichiers du module.
function slugPersonne(qui){
  return qui.toLowerCase().normalize('NFD').replace(/\p{M}/gu,'')
            .replace(/[^a-z0-9]+/g,'_').replace(/^_|_$/g,'');
}

function suivanteReplique(btn){
  if(!dlgEnCours) return;
  dlgIdx++;
  if(dlgIdx >= dlgLignes.length){ stopDialogue(btn); return; }
  document.querySelectorAll('.dlg__ligne').forEach((l,k)=>l.classList.toggle('is-cur', k===dlgIdx));
  const ligne = document.querySelectorAll('.dlg__ligne')[dlgIdx];
  if(ligne) ligne.scrollIntoView({block:'nearest', behavior:'smooth'});
  const [qui, txt] = dlgLignes[dlgIdx];
  const url = `/assets/interactive/${MODULE}/${dlgDossier}/line_${String(dlgIdx+1).padStart(2,'0')}_${slugPersonne(qui)}.mp3?v=${AUDIO_V}`;
  const a = new Audio(url); E.audio = a;
  a.onended = ()=>suivanteReplique(btn);
  a.onerror = ()=>{ parle(txt); setTimeout(()=>suivanteReplique(btn), Math.min(9000, 60*txt.length)); };
  a.play().catch(()=>{ parle(txt); setTimeout(()=>suivanteReplique(btn), Math.min(9000, 60*txt.length)); });
}

function enTete(s){
  const h = el('div');
  const t = el('div','dhead');
  t.appendChild(el('span','dhead__eyebrow', esc(s.eyebrow||'')));
  t.appendChild(el('span','dhead__rule'));
  h.appendChild(t);
  h.appendChild(el('h2','dtitre', esc(s.titre||'')));
  if(s.sub) h.appendChild(el('p','dsub', esc(s.sub)));
  return h;
}

function boutonSon(label, onclick, rond){
  const b = el('button', 'son' + (rond?' son--rond':''));
  b.type = 'button';
  b.innerHTML = '<span class="son__pt"></span>' + (rond ? '' : '<span class="son__lbl">'+esc(label)+'</span>');
  if(rond) b.setAttribute('aria-label', label);
  b.onclick = () => onclick(b);
  return b;
}

    w.appendChild(tete);
    const li = el('div','bilan__liste');
    lignes.forEach(([t,n])=>{
      if(n === null){ li.appendChild(el('div','bilan__part', esc(t))); return; }
      const r = el('div','bilan__l');
      r.appendChild(el('span', null, esc(t)));
      r.appendChild(el('span','bilan__n', esc(n)));
      li.appendChild(r);
    });
    w.appendChild(li);
    const act = el('div','layer__actions');
    const rec = el('button','lbtn'); rec.type='button'; rec.textContent='Tout recommencer';
    rec.onclick = ()=>{ E.rep={}; E.fini.clear(); E.essais={}; E.score={}; E.vu=new Set([0]); aller(0); };
    act.appendChild(rec);
    const ret = el('a','lbtn lbtn--pri');
    ret.href = `/assets/interactive/${MODULE}/module-probleme-activite-interactive.html`;
    ret.textContent = 'Retour au module complet';
    ret.style.cssText = 'display:inline-flex;align-items:center;text-decoration:none';
    act.appendChild(ret);
    w.appendChild(act);
    return w;
  },
};

/* ── Exercice à choix ─────────────────────────────────────────────── */
function rendChoix(s){
  const fini = E.fini.has(E.i);
  const box = el('div','qrows');
  s.rows.forEach(r=>{
    const row = el('div','qrow');
    row.dataset.rid = r.id;
    if(s.listen){
      row.appendChild(boutonSon('Écouter ' + r.txt, b => joue(b, 'prPhon_' + r.id, r.txt), true));
    }
    row.appendChild(el('div','qrow__txt', esc(r.txt)));
    const opts = el('div','qrow__opts');
    s.tiles.forEach(t=>{
      const b = el('button','opt'); b.type='button'; b.textContent = t;
      if(E.rep[r.id] === t) b.classList.add('is-sel');
      if(fini) b.disabled = true;
      b.onclick = ()=>{ E.rep[r.id] = t; peindre(); majBas(); };
      opts.appendChild(b);
    });
    row.appendChild(opts);
    row.appendChild(el('div','qrow__verdict'));
    box.appendChild(row);
  });
  return box;
}

/* ── Exercice de saisie ───────────────────────────────────────────────
   Le trou de l'énoncé est marqué par ___ dans le contenu ; on le remplace
   par une puce pour que l'œil voie où la réponse ira. Les diapositives
   qui demandent d'écrire la phrase entière (`plein`) gardent l'énoncé tel
   quel et posent le champ dessous. */
function rendSaisie(s){
  const fini = E.fini.has(E.i);
  const box = el('div', 'qsais' + (s.duo ? ' qsais--duo' : ''));
  s.rows.forEach(r=>{
    const row = el('div','srow'); row.dataset.rid = r.id;
    row.appendChild(el('div','srow__q',
      r.plein ? esc(r.q) : esc(r.q).replace('___', '<span class="trou"></span>')));
    const inp = document.createElement('input');
    inp.type = 'text'; inp.placeholder = s.ph; inp.autocomplete = 'off';
    inp.spellcheck = false; inp.value = E.rep[r.id] || '';
    inp.setAttribute('aria-label', r.q.replace('___', 'à compléter'));
    if(fini) inp.disabled = true;
    inp.oninput = ()=>{ E.rep[r.id] = inp.value.trim() || undefined; majBas(); };
    // Entrée passe au champ suivant, puis valide sur le dernier.
    inp.onkeydown = e=>{
      if(e.key !== 'Enter') return;
      e.preventDefault();
      const champs = [...document.querySelectorAll('.srow input')];
      const suite = champs[champs.indexOf(inp) + 1];
      if(suite) suite.focus(); else document.getElementById('btnSuiv').click();
    };
    row.appendChild(inp);
    row.appendChild(el('div','srow__verdict'));
    box.appendChild(row);
  });
  return box;
}

// Comparaison indulgente : la casse, les accents, l'apostrophe courbe, les
// espaces en trop et le point final ne doivent pas faire échouer une
// réponse juste.
function normalise(t){
  return String(t).toLowerCase().normalize('NFD').replace(/\p{M}/gu,'')
    .replace(/[’‘]/g, "'").replace(/\s+/g,' ')
    .replace(/[.!?;,]+$/,'').trim();
}

/* ── Exercice d'association (texte ou photos) ─────────────────────── */
function rendAssoc(s){
  const img = s.kind === 'imgassoc';
  const fini = E.fini.has(E.i);
  const w = el('div');

  const box = el('div','qassoc');
  s.rows.forEach(r=>{
    const row = el('div','arow'); row.dataset.rid = r.id;
    row.appendChild(el('div','arow__q', esc(r.q)));
    const slot = el('button', 'slot' + (img ? ' slot--img' : ''));
    slot.type = 'button'; slot.dataset.slot = r.id;
    const val = E.rep[r.id];
    if(val){
      slot.classList.add('is-rempli');
      slot.innerHTML = img ? `<img src="${IMG(val)}" alt=""><span>Photo choisie</span>` : esc(val);
    } else {
      slot.textContent = s.ph;
    }
    if(fini) slot.disabled = true;
    // Un emplacement rempli se vide et redevient la cible ; un emplacement
    // vide devient la cible. Jamais de bascule : recliquer la rangée déjà
    // visée l'annulait, et le clic suivant dans la banque ne faisait rien.
    slot.onclick = ()=>{
      if(E.rep[r.id]) delete E.rep[r.id];
      E.cible = r.id;
      peindre(); majBas();
    };
    row.appendChild(slot);
    row.appendChild(el('div','arow__verdict'));
    box.appendChild(row);
  });
  w.appendChild(box);
  w._banque = banque(s, img, fini);   // posée dans le plateau par dessine()
  return w;
}

// La banque de réponses vit dans le plateau, pas dans la scène.
function banque(s, img, fini){
  // Mélangée une seule fois par diapositive, puis mémorisée.
  if(!s._ordre) s._ordre = melange(s.rows.map(r=>r.a));
  const bq = el('div','banque');
  bq.appendChild(el('div','banque__lbl', esc(s.bankLbl)));
  const items = el('div','banque__items' + (img ? ' banque__items--img' : ''));
  s._ordre.forEach(a=>{
    const pris = Object.values(E.rep).includes(a);
    let b;
    if(img){
      b = el('button','vignette');
      b.innerHTML = `<img src="${IMG(a)}" alt="">`;
      b.setAttribute('aria-label','Photo');
    } else {
      b = el('button','jeton'); b.textContent = a;
    }
    b.type = 'button';
    if(pris) b.classList.add('is-pris');
    if(fini) b.disabled = true;
    b.onclick = ()=>{
      if(!E.cible){ signale("Choisissez d'abord un emplacement à gauche."); return; }
      E.rep[E.cible] = a;
      const suite = s.rows.find(r => !E.rep[r.id]);
      E.cible = suite ? suite.id : null;
      peindre(); majBas();
    };
    items.appendChild(b);
  });
  bq.appendChild(items);
  return bq;
}

// Repeint la diapositive courante sans perdre la position de défilement.
function peindre(){
  const sc = $('#scene'), y = sc.scrollTop;
  dessine();
  sc.scrollTop = y;
}

function signale(txt){
  const a = $('#aide'); a.textContent = txt;
  setTimeout(()=>{ if(a.textContent === txt) majBas(); }, 2600);
}

/* ═══════════════════════════════════════════════════════════════════════
   6 · VALIDATION
   ═══════════════════════════════════════════════════════════════════════ */

function toutRepondu(s){
  return s.rows.every(r => E.rep[r.id] != null);
}

function corrige(s){
  return s.rows.map(r => ({
    r,
    bon: s.kind === 'choix' ? E.rep[r.id] === r.ok
       : s.kind === 'saisie' ? r.ok.some(a => normalise(a) === normalise(E.rep[r.id] || ''))
       : E.rep[r.id] === r.a,
  }));
}

function valider(){
  const s = SLIDES[E.i];
  if(!toutRepondu(s)){ signale('Il reste des réponses à donner.'); return; }

  const res = corrige(s);
  const bon = res.filter(x=>x.bon).length;
  const n = res.length;
  E.essais[E.i] = (E.essais[E.i]||0) + 1;
  if(E.essais[E.i] === 1) E.score[E.i] = {bon, total:n};

  marquer(res, false);

  if(bon === n){
    E.fini.add(E.i); verrouille();
    couche('ok', 'Juste', 'Tout est bon.',
      `${n} réponses sur ${n}. Vous pouvez passer à la suite.`,
      [['Continuer', 'pri', ()=>{ fermeCouche(); suivant(); }]]);
  } else if(E.essais[E.i] === 1){
    couche('no', 'Pas tout à fait', `${bon} réponses justes sur ${n}.`,
      "Les réponses fausses ont été effacées ; les bonnes sont conservées. Essayez encore une fois.",
      [['Réessayer', 'pri', ()=>{ fermeCouche(); effaceFausses(res); }],
       ['Voir la correction', '', ()=>{ fermeCouche(); reveler(s, res); }]]);
  } else {
    reveler(s, res);
  }
}

function effaceFausses(res){
  res.forEach(x => { if(!x.bon) delete E.rep[x.r.id]; });
  E.cible = null;
  document.querySelectorAll('.qrow, .arow, .srow').forEach(n => n.classList.remove('fb-ok','fb-no'));
  peindre(); majBas();
}

// Une fois l'exercice clos, plus rien n'est modifiable : sans ça, on peut
// corriger sa copie après avoir lu la correction, et le verdict affiché ne
// correspond plus à ce qu'on voit à l'écran.
function verrouille(){
  document.querySelectorAll('.opt, .slot, .jeton, .vignette, .srow input')
          .forEach(n => { n.disabled = true; });
}

function reveler(s, res){
  E.fini.add(E.i); verrouille();
  marquer(res, true);
  const bon = res.filter(x=>x.bon).length;
  couche('no', 'La correction', `${bon} réponses justes sur ${res.length}.`,
    "Les bonnes réponses sont affichées. Lisez-les, puis continuez.",
    [['Continuer', 'pri', ()=>{ fermeCouche(); suivant(); }]]);
  majBas();
}

// Peint le verdict sur chaque rangée. Avec `montrer`, ajoute la bonne réponse.
function marquer(res, montrer){
  const s = SLIDES[E.i];
  res.forEach(x=>{
    const n = document.querySelector(`[data-rid="${x.r.id}"]`);
    if(!n) return;
    n.classList.add(x.bon ? 'fb-ok' : 'fb-no');
    const v = n.querySelector('.qrow__verdict, .arow__verdict, .srow__verdict');
    if(v) v.textContent = x.bon ? 'Juste' : 'À revoir';
    if(montrer && !x.bon){
      if(s.kind === 'choix'){
        if(v) v.textContent = 'La réponse est ' + x.r.ok;
      } else if(s.kind === 'saisie'){
        if(v) v.textContent = 'La réponse : ' + x.r.ok[0];
      } else {
        if(!n.querySelector('.arow__bonne')){
          const b = el('div','arow__bonne');
          b.innerHTML = s.kind === 'imgassoc'
            ? 'La bonne photo : <b>' + esc(x.r.a.replace(/\.jpg$/,'').replace(/-/g,' ')) + '</b>'
            : 'La bonne réponse : <b>' + esc(x.r.a) + '</b>';
          n.appendChild(b);
        }
      }
    }
  });
}

/* ── Couche de rétroaction ────────────────────────────────────────── */
function couche(kind, k, t, p, actions){
  const L = $('#layer');
  L.className = 'layer is-on layer--' + kind;
  $('#layerK').textContent = k;
  $('#layerT').textContent = t;
  $('#layerP').textContent = p;
  const a = $('#layerA'); a.innerHTML = '';
  actions.forEach(([lbl, cls, fn])=>{
    const b = el('button','lbtn' + (cls ? ' lbtn--'+cls : ''));
    b.type='button'; b.textContent = lbl; b.onclick = fn;
    a.appendChild(b);
  });
  const prem = a.querySelector('.lbtn--pri') || a.querySelector('.lbtn');
  if(prem) prem.focus();
}
function fermeCouche(){ $('#layer').className = 'layer'; }

/* ═══════════════════════════════════════════════════════════════════════
   7 · NAVIGATION ET CHÂSSIS
   ═══════════════════════════════════════════════════════════════════════ */

function dessine(){
  const s = SLIDES[E.i];
  const sc = $('#scene');
  sc.className = 'scene' + (s.type === 'cover' ? ' scene--plein' : '');
  sc.innerHTML = '';
  // Couleur de section : repérage seulement, jamais porteuse d'information.
  const SEC = {
    violet: ['--violet-600','--violet-100'],   // graphie-phonie
    acier:  ['--acier-600','--acier-100'],     // point culture
    ambre:  ['--ambre-700','--ambre-100'],     // écriture
  };
  const [ton, fond] = SEC[s.sec] || ['--teal-700','--teal-100'];
  document.documentElement.style.setProperty('--sec', `var(${ton})`);
  document.documentElement.style.setProperty('--sec-soft', `var(${fond})`);
  const corps = RENDU[s.type](s);
  sc.appendChild(corps);

  const tray = $('#tray');
  tray.innerHTML = '';
  tray.classList.toggle('is-on', !!corps._banque);
  if(corps._banque) tray.appendChild(corps._banque);

  // L'emplacement en attente se signale après le rendu.
  if(E.cible){
    const n = document.querySelector(`[data-rid="${E.cible}"]`);
    if(n) n.classList.add('is-cible');
  }
}

function aller(i){
  if(i < 0 || i >= SLIDES.length) return;
  stopAudio(); stopDialogue(document.querySelector('.dlg__barre .son'));
  fermeCouche();
  E.i = i; E.vu.add(i); E.cible = null;
  dessine(); majMenu(); majBas();
  $('#scene').scrollTop = 0;
  $('#menu').classList.remove('is-on');
}

function suivant(){
  const s = SLIDES[E.i];
  if(estQ(s) && !E.fini.has(E.i)){ valider(); return; }
  aller(E.i + 1);
}

function majBas(){
  const s = SLIDES[E.i];
  const q = estQ(s), fini = E.fini.has(E.i);
  $('#btnPrec').disabled = E.i === 0;
  const suiv = $('#btnSuiv');
  const dernier = E.i === SLIDES.length - 1;
  suiv.disabled = dernier;
  suiv.textContent = dernier ? 'Fin' : (q && !fini ? 'Valider' : 'Suivant ›');

  let aide = '';
  if(q && !fini){
    const rep = s.rows.filter(r => E.rep[r.id] != null).length;
    aide = `${rep} réponse${rep>1?'s':''} sur ${s.rows.length}`;
    if(E.cible) aide += ' · choisissez maintenant dans la banque';
  } else if(q && fini){
    const sc = E.score[E.i];
    aide = sc ? `${sc.bon} / ${sc.total} au premier essai` : '';
  }
  $('#aide').textContent = aide;

  $('#compte').textContent = `${E.i+1} / ${SLIDES.length}`;
  $('#topPartie').textContent = 'Module 9 · ' + s.partie;
  $('#topTitre').textContent = s.menu === 'Couverture' ? 'Le parcours guidé' : s.menu;
  $('#progFill').style.width = (E.i / (SLIDES.length - 1) * 100) + '%';
}

function majMenu(){
  const m = $('#menu');
  m.innerHTML = '';
  let grp = null, partie = null;
  SLIDES.forEach((s,i)=>{
    if(s.partie !== partie){ partie = s.partie; m.appendChild(el('div','menu__partie', esc(partie))); }
    if(s.grp !== grp){ grp = s.grp; m.appendChild(el('div','menu__grp', esc(grp))); }
    const b = el('button','menu__item');
    b.type = 'button';
    const fait = estQ(s) ? E.fini.has(i) : E.vu.has(i);
    if(i === E.i) b.classList.add('is-cur');
    if(fait) b.classList.add('is-fait');
    // On n'ouvre que ce qui a déjà été atteint : le parcours reste linéaire.
    const ouvert = E.vu.has(i);
    if(!ouvert) b.disabled = true;
    b.innerHTML = `<span class="menu__pastille">${fait ? '✓' : (i+1)}</span>` +
                  `<span class="menu__lbl">${esc(s.menu)}</span>`;
    b.onclick = ()=>aller(i);
    m.appendChild(b);
  });
  const cur = m.querySelector('.is-cur');
  if(cur) cur.scrollIntoView({block:'nearest'});
}

/* ── Branchements ─────────────────────────────────────────────────── */
$('#btnPrec').onclick = ()=>aller(E.i - 1);
$('#btnSuiv').onclick = suivant;
$('#burger').onclick = ()=>$('#menu').classList.toggle('is-on');

document.addEventListener('keydown', e=>{
  if($('#layer').classList.contains('is-on')){
    if(e.key === 'Escape') fermeCouche();
    return;
  }
  if(e.target.matches('input, textarea')) return;
  if(e.key === 'ArrowRight'){ e.preventDefault(); suivant(); }
  if(e.key === 'ArrowLeft'){ e.preventDefault(); aller(E.i - 1); }
});

if(window.speechSynthesis) speechSynthesis.getVoices();
aller(0);
</script>
