const VOC_LANGUES = [
  {c:'ar', n:'arabe',      loc:'العربية',    rtl:true},
  {c:'es', n:'espagnol',   loc:'Español'},
  {c:'uk', n:'ukrainien',  loc:'Українська'},
  {c:'fa', n:'persan',     loc:'فارسی',      rtl:true},
  {c:'zh', n:'chinois (mandarin)', loc:'中文'},
  {c:'pt', n:'portugais',  loc:'Português'},
  {c:'en', n:'anglais',    loc:'English'},
  {c:'ro', n:'roumain',    loc:'Română'},
  {c:'ur', n:'ourdou',     loc:'اردو',       rtl:true},
  {c:'ru', n:'russe',      loc:'Русский'},
  {c:'ti', n:'tigrigna',   loc:'ትግርኛ'},
];
// La langue est choisie une fois et vaut pour tous les modules ; les
// traductions déjà payées sont partagées par tous les élèves de l'appareil.
const VOC_LS_LANGUE = 'francisation-langue';
const VOC_LS_TRAD   = 'francisation-traductions';
const VOC_LS_RAPPEL = 'francisation-rappel-' + MODULE_SLUG;
const VOC_TAILLE_GROUPE = 6;   // exercice 1 : mots montrés à la fois
const VOC_TAILLE_PAQUET = 8;   // exercice 2 : mots par paquet

// Le mode privé de Safari fait lever localStorage : on ne perd que la
// mémoire, jamais l'exercice.
function vocLire(cle, defaut){
  try{ const v = localStorage.getItem(cle); return v===null ? defaut : JSON.parse(v); }
  catch(e){ return defaut; }
}
function vocEcrire(cle, valeur){
  try{ localStorage.setItem(cle, JSON.stringify(valeur)); }catch(e){}
}

function vocLangue(){
  const c = vocLire(VOC_LS_LANGUE, '');
  return VOC_LANGUES.find(l=>l.c===c) || null;
}

// ── LA TRADUCTION ─────────────────────────────────────────────────────
// Masquée par défaut : une traduction visible d'emblée et le français n'est
// plus traité. L'appel part vers le serveur, jamais vers l'API directement —
// la clé Anthropic ne descend pas dans le navigateur.
function vocEmpreinte(texte){
  let h = 5381;
  for(let i=0;i<texte.length;i++) h = ((h*33) ^ texte.charCodeAt(i)) >>> 0;
  return h.toString(36);
}
// La définition entre dans la clé : deux modules peuvent définir le même mot
// autrement, et la traduction de l'un ne doit pas s'afficher chez l'autre.
function vocCle(langue, mot, def){
  return langue + '|' + mot + '|' + vocEmpreinte(def||'');
}
async function vocTraduire(mot, def, exemple){
  const L = vocLangue();
  if(!L) throw new Error('langue');
  const cle = vocCle(L.c, mot, def);
  const cache = vocLire(VOC_LS_TRAD, {});
  if(cache[cle]) return cache[cle];
  const res = await fetch('/api/vocab/translate', {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({code:studentCode, langue:L.n, mot:mot, definition:def, exemple:exemple||''})
  });
  const data = await res.json();
  if(!res.ok) throw new Error(data.error||'indisponible');
  cache[cle] = data;
  vocEcrire(VOC_LS_TRAD, cache);
  return data;
}

let vocTradNo = 0;
// Renvoie le balisage du bouton + du bloc masqué ; vocTradBrancher() pose
// ensuite les écouteurs, une fois le balisage dans la page.
function vocTradBalisage(){
  const id = 'voctr' + (++vocTradNo);
  return {id,
    html:'<div class="vc-actions"><button type="button" class="btn btn-ghost" id="'+id+'-btn">Voir dans ma langue</button></div>'
       + '<div class="voc-tr" id="'+id+'" hidden aria-live="polite"></div>'};
}
function vocTradBrancher(id, mot, def, exemple){
  const btn = document.getElementById(id+'-btn');
  const box = document.getElementById(id);
  if(!btn || !box) return;
  btn.addEventListener('click', async ()=>{
    if(!box.hidden){
      box.hidden = true; btn.textContent = 'Voir dans ma langue'; return;
    }
    const L = vocLangue();
    box.hidden = false; box.removeAttribute('dir');
    if(!L){
      box.innerHTML = '<div class="voc-tr-att">Choisissez d\'abord votre langue, en haut de la section.</div>';
      return;
    }
    box.innerHTML = '<div class="voc-tr-att">Traduction en cours…</div>';
    btn.disabled = true;
    try{
      const t = await vocTraduire(mot, def, exemple);
      if(L.rtl) box.setAttribute('dir','rtl');
      let h = '<div class="voc-tr-mot">'+esc(t.traduction||'')+'</div>';
      if(t.definitionTraduite) h += '<div class="voc-tr-def">'+esc(t.definitionTraduite)+'</div>';
      if(t.exempleTraduit)     h += '<div class="voc-tr-ex">'+esc(t.exempleTraduit)+'</div>';
      h += '<button type="button" class="voc-flag">Signaler une traduction douteuse</button>';
      box.innerHTML = h;
      box.querySelector('.voc-flag').addEventListener('click', function(){ vocSignaler(this, mot, t); });
      btn.textContent = 'Cacher la traduction';
    }catch(e){
      // Message neutre en français : jamais l'erreur brute, hors ligne comprise.
      box.innerHTML = '<div class="voc-tr-att">La traduction n\'est pas disponible pour le moment. Vous pouvez continuer l\'exercice en français.</div>';
    }
    btn.disabled = false;
  });
}
// Les traductions ne sont pas révisées par un humain. Le signalement est
// journalisé côté serveur ; c'est ce qui permettra plus tard une liste revue.
async function vocSignaler(btn, mot, t){
  const L = vocLangue();
  btn.disabled = true;
  btn.textContent = 'Envoi…';
  try{
    const res = await fetch('/api/vocab/signaler', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({code:studentCode, module:MODULE_SLUG, mot:mot,
        langue: L ? L.n : '',
        traduction: [t.traduction, t.definitionTraduite].filter(Boolean).join(' — ')})
    });
    btn.textContent = res.ok ? '✓ Merci, c\'est noté.' : 'Le signalement n\'est pas parti.';
  }catch(e){
    btn.textContent = 'Le signalement n\'est pas parti.';
  }
}

// ── EXERCICE 1 · Le mot et sa définition ──────────────────────────────
// Association par clic en deux colonnes, atteignable au clavier. Six mots à
// la fois : seize définitions d'un coup, personne ne lit jusqu'en bas.
function vocNbGroupes(ex){
  return Math.max(1, Math.ceil(ex.rows.length / VOC_TAILLE_GROUPE));
}
function vocGroupeCourant(ex){
  if(!S.vocabFile){
    S.vocabFile = ex.rows.map((r,i)=>i).sort(()=>Math.random()-.5);
    S.vocabGroupNo = 0;
    S.vocabOrderNo = -1;
  }
  return S.vocabFile.slice(S.vocabGroupNo*VOC_TAILLE_GROUPE,
                          (S.vocabGroupNo+1)*VOC_TAILLE_GROUPE);
}
function renderVocabPairs(){
  const ex = EXOS.find(e=>e.id==='prVocab');
  if(!ex) return;
  const wordsEl = document.getElementById('vocab-words');
  const defsEl  = document.getElementById('vocab-defs');
  if(!wordsEl || !defsEl) return;

  const groupe = vocGroupeCourant(ex);
  // L'ordre des définitions est retiré au sort à chaque groupe : sinon la
  // deuxième reprise se joue de mémoire, par position.
  if(S.vocabOrderNo !== S.vocabGroupNo){
    S.vocabOrder = groupe.slice().sort(()=>Math.random()-.5);
    S.vocabOrderNo = S.vocabGroupNo;
  }

  wordsEl.innerHTML = groupe.map(idx=>{
    const r = ex.rows[idx];
    const done = S.vocabPairs[r.id] !== undefined;
    const cls = 'chip chip-word'+(done?' is-paired':(S.vocabPick===r.id?' is-active':''));
    return '<button type="button" class="'+cls+'" data-w="'+esc(r.id)+'"'+(done?' aria-disabled="true"':'')+'>'+esc(r.q)+'</button>';
  }).join('');
  const takenDefIds = Object.values(S.vocabPairs);
  defsEl.innerHTML = S.vocabOrder.map(idx=>{
    const r = ex.rows[idx];
    const done = takenDefIds.includes(r.aid);
    const cls = 'chip'+(done?' is-paired':(S.fb[r.aid]==='no'?' is-miss':''));
    return '<button type="button" class="'+cls+'" data-d="'+esc(r.aid)+'"'+(done?' aria-disabled="true"':'')+'>'+esc(r.a)+'</button>';
  }).join('');

  wordsEl.querySelectorAll('[data-w]').forEach(b=>b.addEventListener('click',()=>{
    const wid = b.dataset.w;
    if(S.vocabPairs[wid] !== undefined) return;
    S.vocabPick = (S.vocabPick===wid) ? null : wid;
    S.fb = {};
    renderVocabPairs();
  }));
  defsEl.querySelectorAll('[data-d]').forEach(b=>b.addEventListener('click',()=>{
    const did = b.dataset.d;
    if(Object.values(S.vocabPairs).includes(did) || S.vocabPick===null) return;
    const row = ex.rows.find(r=>r.id===S.vocabPick);
    const ok = row && row.aid===did;
    if(ok){ S.vocabPairs[S.vocabPick] = did; S.vocabPick=null; S.fb={}; trackPlacement(row.id, true); }
    else { S.fb[did]='no'; trackPlacement(row?row.id:did, false); }
    renderVocabPairs();
  }));

  const faits = groupe.filter(idx=>S.vocabPairs[ex.rows[idx].id]!==undefined).length;
  const scoreEl = document.getElementById('score-'+ex.id);
  if(scoreEl) scoreEl.textContent = faits+' / '+groupe.length+' associé · groupe '
    + (S.vocabGroupNo+1) + ' sur ' + vocNbGroupes(ex);
}
function vocabAutreGroupe(){
  const ex = EXOS.find(e=>e.id==='prVocab');
  if(!ex) return;
  vocGroupeCourant(ex);
  S.vocabGroupNo = (S.vocabGroupNo + 1) % vocNbGroupes(ex);
  S.vocabOrderNo = -1;
  S.vocabPick = null;
  S.fb = {};
  renderVocabPairs();
  const c = document.getElementById('exo-prVocab');
  if(c) c.scrollIntoView({behavior:'smooth', block:'start'});
}

// ── EXERCICE 2 · Je me souviens du mot ────────────────────────────────
// Rappel actif : le mot seul, puis la réponse, puis l'élève dit s'il savait.
// C'est la seule des trois activités qui fasse vraiment travailler la mémoire.
let VR = {paquet:[], i:0, su:0, revoir:[], revele:false};

// Résultats gardés d'un cours à l'autre : les mots « à revoir » repassent
// devant au prochain tirage.
function vocRappelHisto(){ return vocLire(VOC_LS_RAPPEL, {}); }
function vocRappelNoter(mot, su){
  const h = vocRappelHisto();
  const e = h[mot] || {su:0, revoir:0};
  if(su) e.su++; else e.revoir++;
  e.etat = su ? 'su' : 'revoir';
  e.dernier = new Date().toISOString().slice(0,10);
  h[mot] = e;
  vocEcrire(VOC_LS_RAPPEL, h);
}
function vocRappelTirage(){
  const h = vocRappelHisto();
  const rang = i=>{
    const e = h[FC_CARDS[i].word];
    if(!e) return 1;                    // jamais vu
    return e.etat==='revoir' ? 0 : 2;   // à revoir d'abord, su en dernier
  };
  return FC_CARDS.map((c,i)=>i)
    .sort((a,b)=> (rang(a)-rang(b)) || (Math.random()-.5))
    .slice(0, Math.min(VOC_TAILLE_PAQUET, FC_CARDS.length));
}
function vocRappelDemarrer(indices){
  VR = {paquet: indices && indices.length ? indices : vocRappelTirage(),
        i:0, su:0, revoir:[], revele:false};
  vocRappelRender();
}
function vocRappelRender(){
  const host = document.getElementById('vcRappelBody');
  const scoreEl = document.getElementById('score-vcRappel');
  if(!host) return;

  if(VR.i >= VR.paquet.length){
    const n = VR.revoir.length;
    if(scoreEl) scoreEl.textContent = VR.su+' / '+VR.paquet.length+' su';
    let h = '<div class="vc-bilan">'+(n===0
      ? '✓ Vous avez su les '+VR.paquet.length+' mots du paquet.'
      : (n===1 ? '1 mot reste à revoir.' : n+' mots restent à revoir.'))+'</div>';
    if(n) h += '<div class="vc-bilan-s">'+VR.revoir.map(i=>esc(FC_CARDS[i].word)).join(' · ')+'</div>';
    h += '<div class="vc-actions">';
    if(n) h += '<button type="button" class="btn btn-pri" id="vcReprise">Reprendre les mots à revoir</button>';
    h += '<button type="button" class="btn btn-ghost" id="vcNeuf">Un autre paquet de mots</button></div>';
    host.innerHTML = h;
    const rep = document.getElementById('vcReprise');
    if(rep) rep.addEventListener('click', ()=>vocRappelDemarrer(VR.revoir.slice()));
    document.getElementById('vcNeuf').addEventListener('click', ()=>vocRappelDemarrer(null));
    return;
  }

  const c = FC_CARDS[VR.paquet[VR.i]];
  if(scoreEl) scoreEl.textContent = VR.su+' / '+VR.paquet.length+' su';

  let h = '<div class="vc-carte"><div class="vc-mot">'+esc(c.word)+'</div>';
  if(!VR.revele){
    h += '<div class="vc-q">Que veut dire ce mot ?</div>'
       + '<div class="vc-actions"><button type="button" class="btn btn-pri" id="vcVoir">Voir la réponse</button></div></div>';
    host.innerHTML = h;
    document.getElementById('vcVoir').addEventListener('click', ()=>{ VR.revele = true; vocRappelRender(); });
    return;
  }

  const trad = vocTradBalisage();
  h += '</div><div class="vc-rep">'
     + '<div class="vc-def">'+esc(c.def)+'</div>'
     + '<div class="vc-ex">'+c.ex+'</div>'
     + trad.html
     + '<div class="vc-actions">'
     + '<button type="button" class="vc-note vc-note--su" id="vcSu">✓ Je le savais</button>'
     + '<button type="button" class="vc-note vc-note--revoir" id="vcRevoir">↺ À revoir</button>'
     + '</div></div>';
  host.innerHTML = h;
  vocTradBrancher(trad.id, c.word, c.def, c.ex);
  document.getElementById('vcSu').addEventListener('click', ()=>vocRappelSuivant(true));
  document.getElementById('vcRevoir').addEventListener('click', ()=>vocRappelSuivant(false));
}
function vocRappelSuivant(su){
  const idx = VR.paquet[VR.i];
  vocRappelNoter(FC_CARDS[idx].word, su);
  if(su) VR.su++; else VR.revoir.push(idx);
  VR.i++;
  VR.revele = false;
  vocRappelRender();
}

// ── EXERCICE 3 · Le mot et son image ──────────────────────────────────
// Une photo, trois mots, un seul juste. L'ordre des trois boutons est tiré
// au sort à chaque image : autrement la bonne réponse finit toujours au même
// endroit et l'élève répond à la position, pas au mot.
let VI = {ordre:[], i:0, juste:0, choix:[], repondu:false};

function vocImageMots(){ return FC_CARDS.map((c,i)=>i).filter(i=>FC_CARDS[i].img); }
function vocImageDemarrer(){
  VI = {ordre: vocImageMots().sort(()=>Math.random()-.5), i:0, juste:0, choix:[], repondu:false};
  vocImagePrepare();
}
function vocImagePrepare(){
  VI.repondu = false;
  const bon = VI.ordre[VI.i];
  if(bon === undefined){ VI.choix = []; vocImageRender(); return; }
  const leurres = FC_CARDS.map((c,i)=>i).filter(i=>i!==bon)
    .sort(()=>Math.random()-.5).slice(0,2);
  VI.choix = [bon].concat(leurres).sort(()=>Math.random()-.5);
  vocImageRender();
}
function vocImageRender(){
  const host = document.getElementById('vcImageBody');
  const scoreEl = document.getElementById('score-vcImage');
  if(!host) return;
  if(scoreEl) scoreEl.textContent = VI.juste+' / '+VI.ordre.length+' juste';

  if(VI.i >= VI.ordre.length){
    host.innerHTML = '<div class="vc-bilan">✓ Vous avez fait les '+VI.ordre.length+' images. '
      + VI.juste+' bonne'+(VI.juste>1?'s':'')+' réponse'+(VI.juste>1?'s':'')+'.</div>'
      + '<div class="vc-actions"><button type="button" class="btn btn-ghost" id="vcImgNeuf">Recommencer</button></div>';
    document.getElementById('vcImgNeuf').addEventListener('click', vocImageDemarrer);
    return;
  }

  const bon = VI.ordre[VI.i];
  let h = '<img class="vc-photo" src="'+esc(FC_CARDS[bon].img)+'" alt="Photo à associer à un mot de la liste">'
        + '<div class="vc-choix">'
        + VI.choix.map(i=>'<button type="button" class="choice" data-i="'+i+'">'+esc(FC_CARDS[i].word)+'</button>').join('')
        + '</div><div id="vcImgApres"></div>';
  host.innerHTML = h;
  host.querySelectorAll('.choice').forEach(b=>b.addEventListener('click', ()=>vocImageRepondre(parseInt(b.dataset.i,10))));
}
function vocImageRepondre(choisi){
  if(VI.repondu) return;
  VI.repondu = true;
  const bon = VI.ordre[VI.i];
  const ok = choisi === bon;
  if(ok) VI.juste++;
  // Le glyphe accompagne toujours la couleur — la couleur ne dit rien seule.
  document.querySelectorAll('#vcImageBody .choice').forEach(b=>{
    const i = parseInt(b.dataset.i,10);
    b.setAttribute('aria-disabled','true');
    if(i===bon){ b.classList.add(ok?'is-ok':'is-answer'); b.textContent = (ok?'✓ ':'← ')+FC_CARDS[i].word; }
    else if(i===choisi){ b.classList.add('is-no'); b.textContent = '✗ '+FC_CARDS[i].word; }
  });
  const scoreEl = document.getElementById('score-vcImage');
  if(scoreEl) scoreEl.textContent = VI.juste+' / '+VI.ordre.length+' juste';

  const apres = document.getElementById('vcImgApres');
  const c = FC_CARDS[bon];
  const trad = vocTradBalisage();
  apres.innerHTML = '<div class="vc-rep"><div class="vc-def">'+esc(c.def)+'</div>'
    + '<div class="vc-ex">'+c.ex+'</div>' + trad.html
    + '<div class="vc-actions"><button type="button" class="btn btn-pri" id="vcImgSuite">Une autre image</button></div></div>';
  vocTradBrancher(trad.id, c.word, c.def, c.ex);
  document.getElementById('vcImgSuite').addEventListener('click', ()=>{ VI.i++; vocImagePrepare(); });
}

// Ouverture / fermeture du bloc vocabulaire. Tant qu'il est ouvert, les
// autres exercices de « Je découvre » sont mis de côté : une chose à la fois.
function toggleVocabExo(force){
  const carteUn = document.getElementById('exo-prVocab');
  const btn = document.getElementById('btnVocabToggle');
  if(!carteUn) return;
  const opening = (typeof force==='boolean') ? force : carteUn.style.display==='none';

  const tete = document.getElementById('voc-head');
  if(tete) tete.style.display = opening ? '' : 'none';
  VOC_CARTES.forEach(id=>{
    const c = document.getElementById(id);
    if(c) c.style.display = opening ? '' : 'none';
  });
  if(btn) btn.textContent = opening ? "Fermer l'exercice de vocabulaire" : 'Apprendre les mots de vocabulaire';

  EXOS.filter(e=>e.sec==='prep' && e.id!=='prVocab').forEach(e=>{
    const c = document.getElementById('exo-'+e.id);
    if(c) c.style.display = opening ? 'none' : '';
  });

  if(opening) carteUn.scrollIntoView({behavior:'smooth', block:'start'});
  else if(btn) btn.scrollIntoView({behavior:'smooth', block:'center'});
}

// ── Exercice « texte » : cliquer dans le texte ────────────────────────
// L'élève arme une question, puis clique le passage qui y répond. Les deux
// gestes sont réversibles : recliquer un passage déjà pris le libère, et
// changer de question n'efface rien. C'est ce qui permet de revenir sur une
// réponse sans tout reprendre, comme dans le vrai-faux.
function txArm(exId, qid){
  S.txQ[exId] = (S.txQ[exId] === qid) ? null : qid;
  render();
}
function txPick(exId, segId){
  const ex = EXOS.find(e => e.id === exId);
  if (!ex) return;
  const qid = S.txQ[exId];
  // Un passage déjà attribué se libère d'un clic, même sans question armée :
  // sinon un élève qui se trompe de segment doit deviner quoi faire.
  const dejaA = Object.keys(S.txSel).find(k => S.txSel[k] === segId
                  && ex.rows.some(r => r.id === k));
  if (dejaA && (!qid || dejaA === qid)) {
    delete S.txSel[dejaA]; delete S.fb[dejaA]; render(); return;
  }
  if (!qid) return;
  if (dejaA) delete S.txSel[dejaA];
  S.txSel[qid] = segId;
  delete S.fb[qid];
  S.txQ[exId] = null;
  render();
}
function txCheckAll(exId){
  const ex = EXOS.find(e => e.id === exId);
  if (!ex) return;
  let repondu = 0, justes = 0;
  ex.rows.forEach(r => {
    const seg = S.txSel[r.id];
    if (!seg) return;
    repondu++;
    const ok = seg === r.ok;
    if (ok) justes++;
    S.fb[r.id] = ok ? 'ok' : 'no';
    S.pl[r.id] = {iid:r.id, lbl:seg, cat:'id'};
    trackPlacement(r.id, ok);
  });
  if (repondu >= ex.rows.length) evaluerAide(exId, repondu - justes);
  const sum = document.getElementById('txsum-'+exId);
  if (sum) {
    if (repondu < ex.rows.length) {
      sum.className = 'vf-summary warn';
      sum.textContent = 'Réponds à toutes les questions avant de corriger ('
        + repondu + ' sur ' + ex.rows.length + ').';
    } else {
      sum.className = 'vf-summary ' + (justes === ex.rows.length ? 'ok' : 'warn');
      sum.textContent = justes + ' bonne(s) réponse(s) sur ' + ex.rows.length + '.';
    }
  }
  render();
}
// Le texte, segments compris. On échappe le texte AVANT de poser les balises :
// un article de journal contient des guillemets et des apostrophes, et un
// module qui les rendrait bruts casserait son propre script.
function txHtml(ex){
  const pris = {};
  ex.rows.forEach(r => { if (S.txSel[r.id]) pris[S.txSel[r.id]] = r.id; });
  return (ex.paras || []).map(p => {
    let out = '', reste = p, m;
    const re = /\[\[([A-Za-z0-9_-]+)\|([\s\S]*?)\]\]/;
    while ((m = re.exec(reste))) {
      out += esc(reste.slice(0, m.index));
      const id = m[1], mots = m[2];
      const qid = pris[id];
      let cls = 'tx-seg';
      if (qid) cls += (S.fb[qid] === 'ok') ? ' ok' : (S.fb[qid] === 'no') ? ' no' : ' is-taken';
      out += '<span class="' + cls + '" role="button" tabindex="0"'
           + ' onclick="txPick(\'' + ex.id + '\',\'' + id + '\')"'
           + ' onkeydown="if(event.key===\'Enter\'||event.key===\' \'){event.preventDefault();'
           + 'txPick(\'' + ex.id + '\',\'' + id + '\')}">' + esc(mots) + '</span>';
      reste = reste.slice(m.index + m[0].length);
    }
    return '<p>' + out + esc(reste) + '</p>';
  }).join('');
}
function txMotDuSegment(ex, segId){
  for (const p of (ex.paras || [])) {
    const m = new RegExp('\\[\\[' + segId + '\\|([\\s\\S]*?)\\]\\]').exec(p);
    if (m) return m[1];
  }
  return segId;
}
// Un énoncé masqué garde une étiquette : sans elle, la carte n'est plus
// qu'un bouton et l'élève ne sait plus laquelle il vient d'écouter.
function etiquetteEcoute(txt, i){
  return (/\s/.test(String(txt).trim()) ? 'Phrase ' : 'Mot ') + (i + 1);
}
function vfSelect(zid, lbl) {
  S.vfSel[zid] = lbl;
  delete S.fb[zid];
  const ex = EXOS.find(e=>e.type==='vf' && e.rows.some(r=>r.id===zid));
  if(ex) updateVfScore(ex, false);
  render();
}
function vfCheckAll(exId) {
  const ex = EXOS.find(e => e.id === exId);
  if (!ex) return;
  let answered = 0, correct = 0;
  ex.rows.forEach(r => {
    const sel = S.vfSel[r.id];
    if (!sel) return;
    answered++;
    const ok = sel === r.ok;
    if (ok) correct++;
    S.fb[r.id] = ok ? 'ok' : 'no';
    S.pl[r.id] = {iid:r.id, lbl:sel, cat:'vf'};
    trackPlacement(r.id, ok);
  });
  // Nombre d'énoncés encore faux à cette correction — pas un cumul : corriger
  // deux fois de suite ne doit pas gonfler artificiellement le compte.
  if (answered >= ex.rows.length) evaluerAide(exId, answered - correct);
  const sumEl = document.getElementById('vfsum-'+exId);
  if (sumEl) {
    if (answered < ex.rows.length) {
      sumEl.className = 'vf-summary warn';
      sumEl.textContent = `Réponds à toutes les phrases avant de corriger (${answered}/${ex.rows.length}).`;
    } else {
      sumEl.className = 'vf-summary ok';
      sumEl.textContent = `${correct} / ${ex.rows.length} bonnes réponses`;
    }
  }
  updateVfScore(ex, answered>=ex.rows.length);
  render();
}

// Rend un élément atteignable au clavier (MIGRATION.md §5) : le clic est
// déjà l'interaction principale (sélection puis dépôt) — Entrée/Espace
// déclenchent le même clic.
function kbdable(el){
  el.setAttribute('role','button'); el.tabIndex=0;
  el.addEventListener('keydown',e=>{ if(e.key===' '||e.key==='Enter'){ e.preventDefault(); el.click(); } });
}
// ── DRAG & DROP ───────────────────────────────────────────────────────
let dd = null;
function drg(el, iid, lbl, cat, from) {
  el.draggable = true;
  el.addEventListener('dragstart', e => { dd = {iid,lbl,cat,from:from||null}; e.dataTransfer.setData('text/plain', JSON.stringify(dd)); e.dataTransfer.effectAllowed='move'; setTimeout(()=>el.style.opacity='.45',0); });
  el.addEventListener('dragend', () => { el.style.opacity=''; dd=null; });
}
function drp(el, zid) {
  el.addEventListener('dragover', e => { e.preventDefault(); el.classList.add('dov'); });
  el.addEventListener('dragleave', () => el.classList.remove('dov'));
  el.addEventListener('drop', e => { e.preventDefault(); el.classList.remove('dov'); let d=dd; if(!d){try{d=JSON.parse(e.dataTransfer.getData('text/plain'))}catch{}} if(!d)return; doPlace(zid, d.iid, d.lbl, d.cat, d.from); dd=null; });
}
let ts=null, ghost=null;
// Sur un téléphone, le doigt posé sur une tuile veut le plus souvent faire
// défiler la page — le banc de réponses occupe la bande du bas, c'est de là
// qu'on pousse l'écran. Prendre tout mouvement pour un glisser confisquait
// ce geste : plus moyen d'atteindre les réponses suivantes, et le moindre
// tremblement transformait une sélection en glisser avorté.
//
// D'où l'appui maintenu, la convention de l'iPhone : on glisse ce qu'on a
// d'abord tenu. Un mouvement immédiat reste un défilement, quelle que soit
// sa direction ; un appui bref sans mouvement reste une sélection ; et
// sélectionner puis toucher la case reste le chemin le plus simple.
const TCH_SEUIL = 12;   // px avant de décider — 8 px, c'était un tremblement
const TCH_TENUE = 250;  // ms d'appui maintenu avant qu'un glisser puisse partir
function tch(el, iid, lbl, cat, from) {
  el.addEventListener('touchstart', e => { const t=e.touches[0]; ts={x:t.clientX,y:t.clientY,t0:Date.now(),iid,lbl,cat,from:from||null,el,moved:false,rendu:false}; }, {passive:true});
}
document.addEventListener('touchmove', e => {
  if(!ts || ts.rendu) return;
  const t=e.touches[0], dx=t.clientX-ts.x, dy=t.clientY-ts.y;
  if(!ts.moved && Math.sqrt(dx*dx+dy*dy)>TCH_SEUIL){
    if((Date.now() - ts.t0) < TCH_TENUE){
      ts.rendu = true;   // parti tout de suite : c'est un défilement
      return;
    }
    ts.moved=true;
    const r=ts.el.getBoundingClientRect();
    ghost=ts.el.cloneNode(true);
    ghost.className=ts.el.className+' ghost'; ghost.style.width=r.width+'px';
    ghost.style.left=(t.clientX-r.width/2)+'px'; ghost.style.top=(t.clientY-r.height/2)+'px';
    document.body.appendChild(ghost);
  }
  if(ts.moved && ghost){ e.preventDefault(); ghost.style.left=(t.clientX-ghost.offsetWidth/2)+'px'; ghost.style.top=(t.clientY-ghost.offsetHeight/2)+'px'; }
}, {passive:false});
document.addEventListener('touchend', e => {
  if(!ts) return;
  if(ts.moved && ghost){
    ghost.remove(); ghost=null;
    const t=e.changedTouches[0];
    const zel=document.elementsFromPoint(t.clientX,t.clientY).find(x=>x.dataset&&x.dataset.zid);
    if(zel) doPlace(zel.dataset.zid, ts.iid, ts.lbl, ts.cat, ts.from);
    e.preventDefault();
  }
  ts=null;
});

// ── HELPERS ───────────────────────────────────────────────────────────
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
// Pastille numérotée carrée devant l'en-tête d'exercice (comme .exo__num du
// modèle je-me-prepare.html) — extrait le chiffre de "Exercice N", sinon •.
function exoNumBadge(numText){
  const m = String(numText).match(/\d+/);
  const label = m ? String(+m[0]).padStart(2,'0') : '•';
  return '<span class="exo-num">'+label+'</span>';
}
// Remplace les suites de "___" par un blanc à souligner distinct du texte,
// pour que les espaces entre les vrais mots restent lisibles (sinon tout
// se lit comme une seule ligne confuse de tirets).
function blankify(q){ return esc(q).replace(/_{3,}/g, '<span class="acc-blank"></span>'); }
function usedIds(){return new Set(Object.values(S.pl).map(p=>p.iid))}
function shuffled(arr, seed){
  const a=arr.slice(); let s=seed||42;
  for(let i=a.length-1;i>0;i--){ s=(s*9301+49297)%233280; const j=Math.floor((s/233280)*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
  return a;
}
function mkZone(zid, extra, placeholder){
  const el=document.createElement('div');
  const placed=S.pl[zid], fb=S.fb[zid], z=ZONES[zid];
  let cls=['zone']; if(extra)cls.push(extra);
  if(fb)cls.push('fb-'+fb);
  else if(placed){
    if(z.zcat==='vf'&&(placed.lbl==='VRAI'||placed.lbl==='FAUX'))cls.push(placed.lbl==='VRAI'?'f-vrai':'f-faux');
    else cls.push('filled');
  } else cls.push('empty');
  el.className=cls.join(' ');
  el.dataset.zid=zid;
  el.textContent=placed?placed.lbl:(placeholder||'déposer ici');
  el.addEventListener('click',()=>zoneClick(zid));
  kbdable(el);
  drp(el,zid);
  if(placed&&!fb){drg(el,placed.iid,placed.lbl,placed.cat,zid);tch(el,placed.iid,placed.lbl,placed.cat,zid)}
  return el;
}
function mkBlank(zid){
  const el=document.createElement('span');
  const placed=S.pl[zid], fb=S.fb[zid];
  let cls=['blank'];
  if(fb)cls.push('fb-'+fb); else if(placed)cls.push('filled');
  el.className=cls.join(' ');
  el.dataset.zid=zid;
  el.textContent=placed?placed.lbl:'…';
  el.addEventListener('click',()=>zoneClick(zid));
  kbdable(el);
  drp(el,zid);
  if(placed&&!fb){drg(el,placed.iid,placed.lbl,placed.cat,zid);tch(el,placed.iid,placed.lbl,placed.cat,zid)}
  return el;
}
// La case vide prend la largeur du mot le plus long du banc, mesuré dans le
// style d'une case remplie : plus étroite, elle couperait la réponse déposée ;
// plus large, elle troue la phrase pour rien. On mesure au lieu de compter les
// lettres — « allons attendre » et « IIIIIIIIIIIIIII » n'ont pas la même
// largeur, et la valeur doit suivre le corps du texte, qui change avec l'écran.
const BLANCS = {};
function calerBlancs(mount, mots){
  const p=document.createElement('span');
  p.className='blank filled';
  p.style.cssText='position:absolute;visibility:hidden;min-width:0;white-space:pre';
  mount.appendChild(p);
  let w=0;
  mots.forEach(function(m){p.textContent=m.l; w=Math.max(w,p.getBoundingClientRect().width)});
  p.remove();
  // Un plancher : sur une liste de mots-outils (« le », « la »), la case
  // deviendrait une fente de 30 px — illisible comme cible de dépôt.
  mount.style.setProperty('--blank-w', Math.max(72, Math.ceil(w))+'px');
}
addEventListener('resize', function(){
  Object.keys(BLANCS).forEach(function(k){
    const b=BLANCS[k];
    if(b.mount.isConnected) calerBlancs(b.mount, b.mots);
  });
});
function mkTile(iid,lbl,cat,cls){
  const t=document.createElement('div');
  t.className='tile '+cls+(S.sel&&S.sel.iid===iid&&!S.sel.from?' sel':'');
  t.textContent=lbl;
  t.addEventListener('click',()=>tileClick(iid,lbl,cat));
  kbdable(t);
  drg(t,iid,lbl,cat,null); tch(t,iid,lbl,cat,null);
  return t;
}
function mkImgTile(im,cat){
  const t=document.createElement('div');
  t.className='imgtile'+(S.sel&&S.sel.iid===im.id&&!S.sel.from?' sel':'');
  t.innerHTML='<img src="'+im.src+'" alt="" loading="lazy">';
  t.addEventListener('click',()=>tileClick(im.id,im.id,cat));
  kbdable(t);
  drg(t,im.id,im.id,cat,null); tch(t,im.id,im.id,cat,null);
  return t;
}
function mkImgZone(zid){
  const el=document.createElement('div');
  const placed=S.pl[zid], fb=S.fb[zid];
  let cls=['imgzone']; if(fb)cls.push('fb-'+fb); else if(placed)cls.push('filled'); else cls.push('empty');
  el.className=cls.join(' ');
  el.dataset.zid=zid;
  if(placed){ const src=(ALL_IMAGES.find(i=>i.id===placed.iid)||{}).src; el.innerHTML=src?'<img src="'+src+'" alt="">':''; }
  else{ el.innerHTML='<span class="imgzone-ph">glissez l\'image ici</span>'; }
  el.addEventListener('click',()=>zoneClick(zid));
  kbdable(el);
  drp(el,zid);
  if(placed&&!fb){drg(el,placed.iid,placed.lbl,placed.cat,zid);tch(el,placed.iid,placed.lbl,placed.cat,zid)}
  return el;
}

      h+='<button class="btn btn-ghost" type="button" onclick="toggleScript(this,\''+sec.id+'\')">Lire la transcription</button>';
      h+='</div></div>';
      h+='<div class="dial-aside"><div class="field-label">Dialogue</div>';
      h+='<div class="dial-aside-tit">'+esc(dTitle)+'</div>';
      h+='<div class="dial-aside-n">'+dia.lines.length+' répliques</div></div>';
      h+='</div>';
      h+='<div class="dial-txt is-hidden" id="script-'+sec.id+'">';
      dia.lines.forEach((l,i)=>{
        const cls=(i%2===0)?'mb':'dr';
        h+='<div class="dl"><span class="'+cls+'">'+esc(l[0])+' :</span> '+esc(l[1])+'</div>';
      });
      h+='</div>';
      if(sec.id==='prep'){
        h+='<div class="vocab-sec"><div style="display:flex;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap">';
        h+='<div class="vocab-tag">Vocabulaire</div>';
        h+='<div style="font-size:15px;font-weight:700;">Les mots de ce dialogue — <span style="font-weight:900;cursor:pointer;text-decoration:underline dotted;" onclick="fcOpen(0)">cartes mémoire</span></div></div>';
        h+='<div class="vocab-grid">';
        FC_CARDS.forEach(c=>{h+='<div class="vw" onclick="fcOpenWord(\''+c.word.replace(/'/g,"\\'")+'\')"><span class="dot"></span><span class="w">'+esc(c.word)+'</span></div>'});
        h+='</div>';
        h+='<button class="btn btn-pri" type="button" id="btnVocabToggle" style="margin-top:12px" onclick="toggleVocabExo()">Apprendre les mots de vocabulaire</button>';
        h+='</div>';
      }
      h+='</div>';
    } else {
      h+='<div class="intro">'+sec.intro+'</div>';
    }
    h+='<div class="exs" id="exs-'+sec.id+'"></div>';
    if(sec.next){
      h+='<div class="cta"><div><div class="cta-eyebrow">Prochaine étape</div>';
      h+='<div class="cta-tit">'+esc(sec.next.tit)+'</div>';
      h+='<div class="cta-sub">'+esc(sec.next.sub)+'</div></div>';
      h+='<button class="btn cta-btn" type="button" onclick="document.getElementById(\'tab-'+sec.next.id+'\').click();window.scrollTo({top:0,behavior:\'smooth\'})">Continuer →</button></div>';
    }
    d.innerHTML=h;
    wrap.appendChild(d);
  });

    const host=document.getElementById('exs-'+ex.sec);

    if(ex.accent) card.style.setProperty('--sec-color', ex.accent);

    let h='';
    if(ex.savoir){
      h+='<div class="savoir'+(ex.savoir.speak?' savoir--pron':'')+'">'
       + '<div class="savoir-band">'+esc(ex.savoir.h ? ex.savoir.h.replace(/^›\s*/,'') : 'Prononciation')+'</div>';
      ex.savoir.rows.forEach((r,ri)=>{
        // Une rangée qui s'ouvre sur un exemple se colore en entier (étiquette
        // comprise) : c'est ce qui la sépare visuellement d'une règle.
        const rowEx = /^\s*<span class=['"]savoir-ex['"]/.test(r[1]);
        h+='<div class="savoir-row'+(rowEx?' is-ex':'')+'"><div class="savoir-key">'+r[0]+'</div><div class="savoir-val">'+r[1];

            // faire lire à l'anglaise sans le contexte d'une phrase.
            h+='<button class="btn btn-ghost" type="button" onclick="playWord(this,\''+jsq(phrase||w)+'\',\''+fid+'\')" title="Écouter">'+ICON_SPEAK+'</button>';
            h+='</div>';

        h+='</div></div>';

      if(PLUS[ex.id]){
        h+='<div class="plus-bar"><button class="plus-open" type="button" onclick="plusOpen(\''+ex.id+'\')">'
         + '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>'
         + 'Ouvrir la mini-leçon</button></div>';

    }
    // ── Exercice « texte » : un texte suivi, ses questions à côté ──

      h+='<div class="c-hdr">'+exoNumBadge(ex.num)+'<span class="tag">'+esc(ex.num)+'</span><span class="exo-score" id="score-'+ex.id+'" aria-live="polite">0 / '+ex.rows.length+' répondu</span><span class="ctit">'+esc(ex.tit)+'</span><span class="csub">'+esc(ex.sub||'Choisissez une question, puis cliquez dans le texte le passage qui y répond.')+'</span></div>';
      h+='<div class="tx-grid"><div class="tx-texte" id="txt-'+ex.id+'"></div>';
      h+='<div id="txq-'+ex.id+'"></div></div>';
      h+='<div style="margin-top:14px;display:flex;align-items:center;gap:12px;flex-wrap:wrap">';
      h+='<button class="btn btn-pri" type="button" onclick="txCheckAll(\''+ex.id+'\')">✓ Corriger</button>';
      h+='<div class="vf-summary" id="txsum-'+ex.id+'" aria-live="polite"></div>';
      h+='</div>';
      card.innerHTML=h; host.appendChild(card); return;
    }
    // ── Exercice Vrai/Faux (ou 2 catégories) — colonnes + bouton Corriger ──
    if(ex.type==='vf'){
      const _vfw=Math.max(72, Math.max.apply(null,ex.tiles.map(function(t){return t.length}))*8.5+28);
      card.style.setProperty('--vfw', _vfw+'px');
      h+='<div class="c-hdr">'+exoNumBadge(ex.num)+'<span class="tag">'+esc(ex.num)+'</span><span class="exo-score" id="score-'+ex.id+'" aria-live="polite">0 / '+ex.rows.length+' répondu</span><span class="ctit">'+esc(ex.tit)+'</span><span class="csub">'+esc(ex.sub)+'</span></div>';
      if(!ex.cards) h+='<div class="vf-head"><div class="vf-head-txt"></div><div class="vf-head-opts"><div class="vf-head-opt">'+esc(ex.tiles[0])+'</div><div class="vf-head-opt">'+esc(ex.tiles[1])+'</div></div></div>';
      h+='<div class="rows" id="mount-'+ex.id+'"></div>';
      h+='<div style="margin-top:14px;display:flex;align-items:center;gap:12px;flex-wrap:wrap">';
      h+='<button class="btn btn-pri" type="button" onclick="vfCheckAll(\''+ex.id+'\')">✓ Corriger</button>';
      h+='<div class="vf-summary" id="vfsum-'+ex.id+'" aria-live="polite"></div>';
      h+='</div>';
      card.innerHTML=h; host.appendChild(card); return;
    }
    // ── Exercice à écrire (autocorrection ou correction IA) ──
    if(ex.type==='write'){
      // Si l'exercice a un dialogue, son titre est déjà affiché dans la

      const titHtml = ex.dialogue ? '' : '<span class="ctit">'+esc(ex.tit)+'</span>';

      if(ex.dialogue && DIALOGUES[ex.dialogue]){

        });
        h+='</div></details>';
      }

      ex.items.forEach((it,i)=>{
        h+='<div class="witem"><div class="wq">'+blankify(it.q||'')+'</div>';
        if(it.audio){
          const fid=ex.id+'_'+i;
          h+='<button class="btn btn-ghost wlisten" type="button" onclick="playWord(this,\''+jsq(it.audio)+'\',\''+fid+'\')" style="margin-bottom:8px">'+ICON_SPEAK+' Écouter</button>';
        }
        h+='<div class="wrow"><input class="winput" id="wi_'+ex.id+'_'+i+'" placeholder="'+(it.ph||'Écris ta réponse…')+'" autocomplete="off">';
        h+='<button class="btn btn-pri wbtn" onclick="checkWrite(\''+ex.id+'\','+i+')">Vérifier</button></div>';
        h+='<div class="wfb" id="wf_'+ex.id+'_'+i+'" aria-live="polite"></div></div>';
      });
      h+='</div>';
      card.innerHTML=h; host.appendChild(card); return;
    }
    if(ex.id==='prVocab'){
      // Association par CLIC en deux colonnes (mots / définitions), atteignable
      // au clavier — reprend le modèle je-me-prepare.html au lieu du
      // glisser-déposer générique. Le pointage passe quand même par
      // trackPlacement() pour rester compté dans l'étoile globale.
      h+='<div class="c-hdr">'+exoNumBadge(ex.num)+'<span class="tag">'+esc(ex.num)+'</span><span class="exo-score" id="score-'+ex.id+'" aria-live="polite">0 / '+ex.rows.length+' associé</span><span class="ctit">'+esc(ex.tit)+'</span><span class="csub">'+esc(ex.sub)+'</span></div>';
      h+='<div class="pair-grid"><div class="stack" id="vocab-words"></div><div class="stack" id="vocab-defs"></div></div>';
      h+='<div class="vc-actions" style="margin-top:14px">';
      h+='<button class="btn btn-pri" type="button" id="vocab-suite" onclick="vocabAutreGroupe()">Un autre groupe de mots</button>';
      h+='<button class="btn btn-ghost" type="button" onclick="toggleVocabExo(false)">Fermer</button>';
      h+='</div>';
      card.innerHTML=h;
      host.appendChild(card);
      return;
    }
    h+='<div class="exo-row" style="display:flex;gap:20px;align-items:flex-start;flex-wrap:wrap">';
    h+='<div class="c-hdr">'+exoNumBadge(ex.num)+'<span class="tag">'+esc(ex.num)+'</span><span class="ctit">'+esc(ex.tit)+'</span><span class="csub">'+esc(ex.sub)+'</span></div>';
    h+='<div class="exo-main" style="flex:1;min-width:300px">';
    if(ex.type==='blanks') h+='<p class="blanks-p" id="mount-'+ex.id+'"></p>';

    // aussi haute que le nombre de réponses, et la carte de l'exercice

    // tuiles se rangent deux par deux et le banc redescend à la hauteur de
    // l'énoncé. Les bancs `vert` (phrases entières) gardent leur colonne.
    const bw=ex.type==='imgmatch'?'240px':((ex.type==='match'||ex.type==='rows')?'300px':'340px');
    h+='<div class="bsec b1" style="flex:0 0 '+bw+'"><div class="blbl">'+(ex.bankLbl||'Réponses')+'</div><div class="btiles'+vert+'" id="bank-'+ex.id+'"></div></div>';
    h+='</div>';
    card.innerHTML=h;
    host.appendChild(card);
  });

}

// ── SECTIONS PERSONNALISÉES (oral / écrit / autoéval) ─────────────────
function injectCustom(){
// ── JE ME LANCE ──────────────────────────────────────────
  // Trois productions : un jeu de rôle avec l'assistant, une visite guidée à
  // voix haute, un courriel de notes. Le jeu de rôle vient en premier parce
  // qu'il sert de répétition avant les deux autres.
  // Le scénario `louer` existe déjà dans server.py depuis le module de
  // niveau 4 : seule l'annonce est côté client, et c'est voulu — c'est le
  // seul document que les deux personnes ont sous les yeux. Ce que chaque
  // rôle ignore de l'autre reste sur le serveur.

// ── ENREGISTREMENT (production orale) ─────────────────────────────────
// Le bloc oral promet une transcription automatique à trois endroits : le
// libellé de l'étape 2 (« Je m'écoute et je corrige »), le texte d'aide de la
// case (« Transcription automatique (tu peux la corriger) ») et le mot du mode
// sans assistant (« corrige ta transcription si besoin »). Aucune des trois
// n'est tenue quand le navigateur ne sait pas reconnaître la parole SUR
// L'APPAREIL : l'élève s'enregistre, et tombe devant une case vide qui lui
// demande de corriger un texte qui n'existe pas.
//
// Relevé le 28 août 2026 en mode sans assistant — mais le défaut n'a RIEN à
// voir avec l'assistant. La reconnaissance vocale vit dans le navigateur, elle
// ne passe ni par nos serveurs ni par nos clés ; elle manque aussi bien dans
// un centre qui a l'IA. L'ajustement est donc ici, dans le moteur, et il se
// règle sur l'état réel de la reconnaissance plutôt que sur le drapeau du
// centre. Ce qui reste, lui, marche sans personne : s'enregistrer, s'écouter,
// écrire ce qu'on a dit, envoyer à son enseignant.
function poPasDeTranscription(){
  const t=document.getElementById('poText');
  if(t){ t.placeholder="Écris ici, en quelques mots, ce que tu as dit."; }
  const l=document.querySelector('#recStep2 .l');
  if(l) l.textContent="Je m'écoute et j'écris ce que j'ai dit";
  document.querySelectorAll('#poPrev .sans-ia-mot').forEach(n=>{
    n.textContent="Écoute-toi, écris en quelques mots ce que tu as dit, "
      + "puis envoie ton enregistrement à ton enseignant.";
  });
}
let mediaRecorder=null, audioChunks=[], audioBlob=null, audioUrl=null, recognition=null, isRec=false, poFeedback="";
async function toggleRec(){
  if(isRec){ stopRec(); return; }
  hideErr('poErr');
  let stream;
  try{ stream=await navigator.mediaDevices.getUserMedia({audio:true}); }
  catch(e){ showErr('poErr',"Impossible d'accéder au micro. Vérifie les autorisations."); return; }
  audioChunks=[];
  const mime = MediaRecorder.isTypeSupported('audio/webm')?'audio/webm':(MediaRecorder.isTypeSupported('audio/mp4')?'audio/mp4':'');
  mediaRecorder = mime?new MediaRecorder(stream,{mimeType:mime}):new MediaRecorder(stream);
  mediaRecorder.ondataavailable=e=>{ if(e.data.size>0)audioChunks.push(e.data); };
  mediaRecorder.onstop=()=>{
    stream.getTracks().forEach(t=>t.stop());
    audioBlob=new Blob(audioChunks,{type:mediaRecorder.mimeType||'audio/webm'});
    if(audioUrl)URL.revokeObjectURL(audioUrl);
    audioUrl=URL.createObjectURL(audioBlob);
    const a=document.getElementById('poAudio'); if(a)a.src=audioUrl;
    document.getElementById('poPrev').classList.remove('hidden');
    recStep(2);
  };
  // Préparé AVANT mediaRecorder.start() : lancer la reconnaissance après coup
  // lui ferait manquer les premiers mots de l'élève.
  const reco = await reconnaissanceLocale('dictation');
  if(!reco.rec){
    poPasDeTranscription();
    showErr('poErr', recoMessage(reco.etat)
      + " Ton enregistrement, lui, fonctionne : écoute-toi, écris en quelques mots ce que tu as dit, puis envoie-le.");
  }
  mediaRecorder.start();
  if(reco.rec){
    recognition=reco.rec; recognition.continuous=true; recognition.interimResults=false;
    let tr='';
    recognition.onresult=e=>{ for(let i=e.resultIndex;i<e.results.length;i++){ if(e.results[i].isFinal)tr+=e.results[i][0].transcript+' '; } const b=document.getElementById('poText'); if(b)b.value=tr.trim(); };
    try{ recognition.start(); }catch(e){}
  }
  isRec=true;
  const btn=document.getElementById('recBtn'); btn.classList.add('recording');
  btn.setAttribute('aria-label',"Arrêter l'enregistrement");
  document.getElementById('recLbl').textContent="Enregistrement… touche pour arrêter";
}
function stopRec(){
  isRec=false;
  if(mediaRecorder&&mediaRecorder.state!=='inactive')mediaRecorder.stop();
  if(recognition){ try{recognition.stop();}catch(e){} }
  const btn=document.getElementById('recBtn'); if(btn){ btn.classList.remove('recording'); btn.setAttribute('aria-label',"Démarrer l'enregistrement"); }
  const l=document.getElementById('recLbl'); if(l)l.textContent="Touche pour réenregistrer";
}
function recStep(n){
  for(let i=1;i<=3;i++){ const s=document.getElementById('recStep'+i); if(s) s.classList.toggle('on', i===n); }
}
function peCount(){
  const el=document.getElementById('peText'), lbl=document.getElementById('peCountLbl');
  if(!el||!lbl) return;
  const mn=el.dataset.min||'5', mx=el.dataset.max||'8';
  const n=(el.value.match(/[.!?…]+(\s|$)/g)||[]).length;
  lbl.textContent = n+(n>1?' phrases':' phrase')+' sur '+mn+' à '+mx;
}

    const data=await res.json();

// ── CORRECTION ÉCRITE ─────────────────────────────────────────────────
// Le scénario envoyé à la correction est reconstruit à partir du bloc
// « Ton courriel doit contenir » affiché à l'élève : les critères visibles et
// les critères corrigés ne peuvent donc pas diverger.
function peScenario(){
  const root=document.getElementById('peText').closest('.card')||document;
  const lead=root.querySelector('.prod-lead');
  const items=[...root.querySelectorAll('.req-it')].map(e=>e.textContent.trim()).filter(Boolean);
  const hd=root.querySelector('.req-hd');
  const note=root.querySelector('.req-note');
  let s=lead?lead.textContent.trim():'';
  if(items.length){
    s+="\n\n"+(hd?hd.textContent.trim().replace(/doit contenir$/i,"doit obligatoirement contenir"):"Ce texte doit obligatoirement contenir")+" les éléments suivants :\n"
      +items.map((t,i)=>(i+1)+') '+t).join('\n');
  }
  if(note) s+="\n\nContrainte de langue : "+note.textContent.trim();
  s+="\n\nPour « pertinent », vérifie que CHACUN de ces éléments est présent et que la"
   +" contrainte de langue est respectée. Si un élément manque, nomme-le précisément dans"
   +" « commentairePertinence ».";
  return s;
}
// « Ton bulletin doit contenir » → « bulletin ». Sans ça, la correction
// pousserait une affiche ou un fait divers vers les formules d'un courriel.
function peTypeTexte(){
  const root=document.getElementById('peText').closest('.card')||document;
  const hd=root.querySelector('.req-hd');
  if(!hd) return '';
  const m=hd.textContent.trim().match(/^Ton\s+(.+?)\s+doit contenir$/i);
  return m?m[1].toLowerCase():'';
}
function peSubject(){
  const root=document.getElementById('peText').closest('.card')||document;
  const row=[...root.querySelectorAll('.mail-row')].find(r=>/objet/i.test((r.querySelector('.mail-k')||{}).textContent||''));
  return row?((row.querySelector('.mail-v')||{}).textContent||'').trim():'';
}
async function peCheck(){
  const text=document.getElementById('peText').value.trim();
  if(!text){ showErr('peErr',"Écris ton message d'abord."); return; }

  try{
    const res=await fetch('/api/correct-email',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({code:studentCode,text,scenario:peScenario(),subject:peSubject(),typeTexte:peTypeTexte()})});
    const data=await res.json();
    document.getElementById('peStatus').classList.remove('on');
    document.getElementById('peBtn').disabled=false;
    if(!res.ok){ showErr('peErr',data.error||'Une erreur est survenue.'); return; }

    showErr('peErr','Impossible de contacter le serveur.');

/* Écrit ici et non dans icons/ : un <img> ne peut pas hériter de la couleur
   du texte, et copier un SVG dans 87 dossiers pour un seul usage coûterait
   plus qu'il ne rapporte. */
const ICON_ASSIST = '<svg class="fb-ic" viewBox="0 0 50 50" aria-hidden="true"><path d="M25 7a9 9 0 1 1 0 18 9 9 0 0 1 0-18z"/><path d="M25 28c-8.5 0-15.5 5.2-17 12.4-.3 1.4.8 2.6 2.2 2.6h29.6c1.4 0 2.5-1.2 2.2-2.6C40.5 33.2 33.5 28 25 28z"/></svg>';
function renderCorr(elId,data,orig){
  const fb=document.getElementById(elId);
  const corr=data.corrige||data.corrected||'';
  const errs=data.erreurs||data.errors||[];
  let html='<div class="fb-t">'+ICON_ASSIST+'<span>Rétroaction privée</span></div>';
  if(data.corpsCorrige!==undefined){   // réponse de /api/correct-email
    const cmt=(data.commentairePertinence||'').trim();
    if(cmt) html+= data.pertinent ? '<div class="fb-c fb-bravo">'+esc(cmt)+'</div>'
                                  : '<div class="fb-e">'+esc(cmt)+'</div>';
    else if(data.pertinent) html+='<div class="fb-c fb-bravo">Ton courriel contient tout ce qui était demandé.</div>';
    html+='<div class="fb-c">'+esc(data.corpsCorrige)+'</div>';
    (data.erreurs||[]).forEach(e=>{ html+='<div class="fb-e">'+esc(e.explication||e.explanation||e)+'</div>'; });
    fb.innerHTML=html; fb.classList.add('on'); return;
  }
  if(data.memePhrase){ html+='<div class="fb-c fb-bravo">Ton texte est déjà correct. Bravo !</div>'; }
  else{
    if(corr) html+='<div class="fb-c">'+esc(corr)+'</div>';
    errs.forEach(e=>{ html+='<div class="fb-e">'+esc(e.explication||e.explanation||e)+'</div>'; });
  }
  fb.innerHTML=html; fb.classList.add('on');
}
function corrSummary(data,orig){
  if(data.corpsCorrige!==undefined){   // réponse de /api/correct-email
    const es=(data.erreurs||[]).map(e=>e.explication||e.explanation||e);
    return (data.pertinent?'Contenu conforme. ':'Contenu incomplet : '+(data.commentairePertinence||'')+' ')
      +'Correction : '+data.corpsCorrige+(es.length?' | '+es.join(' '):'');
  }
  const corr=data.corrige||data.corrected||'';
  const errs=data.erreurs||data.errors||[];
  if(data.memePhrase) return "Phrase correcte : "+(corr||orig);
  return "Correction : "+corr+(errs.length?' | '+errs.map(e=>e.explication||e.explanation||e).join(' '):'');
}

// ── JEU DE RÔLE AVEC L'ASSISTANT ──────────────────────────────────────
// Le client ne connaît que la partie publique des annonces. Ce que sait le
// personnage joué par l'assistant vit dans server.py — sinon un coup d'œil au
// code source de la page suffirait à vider l'exercice de son sens.
const JR_MICRO = '<svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"></rect><path d="M5.5 11.5a6.5 6.5 0 0013 0M12 18v3"></path></svg>';
const JR = {log:'A', role:'locataire', hist:[], occupe:false, voix:false, rec:null};


// Le mode voix ne change que l'entrée et la sortie : même conversation, même
// endpoint. Le texte reste affiché — au niveau 4, du pur audio décroche
// l'élève dès la première réplique mal saisie.
async function jrModeVoix(on){
  // Le refus se dit ici, au moment où l'élève choisit le mode — pas plus tard,
  // micro en main, quand il a déjà commencé à parler.
  if(on){
    const etat = await recoEtat('dictation');
    if(etat !== 'local' && etat !== 'distant'){ showErr('jrErr', recoMessage(etat)); return; }
  }
  JR.voix=on;
  document.querySelectorAll('#jrModes .jr-opt').forEach(b=>
    b.classList.toggle('on', (b.dataset.mode==='voix')===on));
  document.getElementById('jrMicZone').classList.toggle('hidden', !on);
  document.getElementById('jrInput').placeholder =
    on ? 'Ce que le micro a entendu — corrige avant d\'envoyer…' : 'Écris ta question…';
  if(!on){ jrTaire(); }
}

let jrAudio=null;
// Numéro de la lecture en cours. Il sert à distinguer un arrêt VOULU — l'élève
// touche le micro pendant que l'assistant parle — d'une panne de serveur : les
// deux se présentent au code sous la même forme, une promesse rejetée.
let jrDireNo=0;

function jrTaire(){
  jrDireNo++;                 // toute lecture en vol devient caduque
  try{ speechSynthesis.cancel(); }catch(e){}
  if(jrAudio){ try{ jrAudio.pause(); }catch(e){} jrAudio=null; }
}

function jrVoixFr(){
  const v=speechSynthesis.getVoices().filter(x=>/^fr/i.test(x.lang));
  return v.find(x=>/fr[-_]CA/i.test(x.lang)) || v[0] || null;
}

// Voix du navigateur : moins belle, mais immédiate et gratuite. Sert de repli
// dès que la voix du serveur échoue, pour qu'une panne de synthèse dégrade le
// son sans interrompre la conversation.
function jrDireNavigateur(texte){
  try{
    speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(texte);
    u.lang='fr-CA'; u.rate=vitTaux(0.95);
    const v=jrVoixFr(); if(v) u.voice=v;
    speechSynthesis.speak(u);
  }catch(e){}
}

async function jrDire(texte){
  jrTaire();
  const no=jrDireNo;          // posé APRÈS jrTaire, qui vient d'incrémenter
  // Cette voix-ci se fabrique en direct : son débit se règle donc à la
  // SYNTHÈSE, où Azure rend un <prosody rate> exact, et non par un
  // playbackRate qui étire un son déjà produit. Le serveur répond X-Palier ;
  // on n'étire ici que s'il n'a pas honoré la demande.
  const palier = vitCran ? 'lent' : 'normal';
  try{
    const res=await fetch('/api/voix',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({code:studentCode, texte:texte, role:JR.role, palier:palier})});
    if(!res.ok) throw new Error('voix serveur indisponible');
    const blob=await res.blob();
    // L'élève a repris la parole pendant que le serveur synthétisait : ne rien
    // jouer du tout, plutôt que de démarrer une réplique qu'il vient de couper.
    if(no!==jrDireNo) return;
    const url=URL.createObjectURL(blob);
    const a=new Audio(url);
    if(res.headers.get('X-Palier')===palier) a.dataset.palier=palier; else vitAudio(a);
    jrAudio=a;
    a.onended=()=>{ URL.revokeObjectURL(url); if(jrAudio===a) jrAudio=null; };
    await a.play();
  }catch(e){
    // Le repli n'a de sens que pour une vraie panne. Si un jrTaire() est passé
    // par là, c'est que l'élève a coupé la parole : on se tait.
    if(no===jrDireNo) jrDireNavigateur(texte);
  }
}

// La transcription atterrit dans le champ de saisie, modifiable : la
// reconnaissance se trompe forcément sur un accent d'apprenant, et voir ce
// qui a été entendu vaut mieux que de laisser partir une phrase fausse.
async function jrParler(){
  if(JR.rec){ try{ JR.rec.stop(); }catch(e){} return; }   // deuxième touche = arrêter
  jrTaire();                    // sinon le micro réentend la voix de l'assistant
  hideErr('jrErr');
  const inp=document.getElementById('jrInput');
  const btn=document.getElementById('jrMic');
  const lbl=document.getElementById('jrMicLbl');
  inp.value='';
  lbl.textContent='Préparation…';
  const {rec, etat} = await reconnaissanceLocale('dictation');
  if(!rec){ lbl.textContent='Touche pour parler'; showErr('jrErr', recoMessage(etat)); return; }
  // Deux touches rapides pendant la préparation : la première a déjà gagné.
  if(JR.rec){ return; }
  JR.rec=rec;
  rec.interimResults=true; rec.continuous=true;
  // L'accumulateur vit sur JR, pas ici : le micro reste ouvert d'un envoi à
  // l'autre, et c'est jrEnvoyer qui doit pouvoir le vider. En variable locale,
  // la phrase déjà envoyée revenait en tête de la suivante.
  JR.dit=''; JR.inter='';
  btn.classList.add('rec'); btn.textContent='⏹';
  lbl.textContent='Je t\'écoute… touche pour arrêter';
  rec.onresult=e=>{
    let inter='';
    for(let i=e.resultIndex;i<e.results.length;i++){
      const r=e.results[i];
      if(r.isFinal) JR.dit+=r[0].transcript+' '; else inter=r[0].transcript;
    }
    JR.inter=inter;
    inp.value=(JR.dit+inter).trim();
  };
  rec.onerror=e=>{
    if(e.error==='not-allowed') showErr('jrErr',"Micro refusé — autorise l'accès au micro.");
    else if(e.error!=='aborted' && !inp.value) showErr('jrErr','Aucun son détecté, réessaie.');
  };
  rec.onend=()=>{
    JR.rec=null;
    btn.classList.remove('rec'); btn.innerHTML=JR_MICRO;
    lbl.textContent='Touche pour parler';
    // Une phrase courte est parfois coupée par la détection de silence avant
    // qu'un résultat final n'arrive : on garde le dernier provisoire.
    if(!inp.value && JR.inter) inp.value=JR.inter.trim();
    inp.focus();
  };
  try{ rec.start(); }catch(e){ JR.rec=null; }
}

// ── EXERCICES À ÉCRIRE ────────────────────────────────────────────────
function normWrite(s){
  return (s||'').toLowerCase().trim().normalize('NFD').replace(/[̀-ͯ]/g,'')
    .replace(/\s+/g,' ').replace(/[.!?;:]+$/,'').replace(/^["«»']+|["«»']+$/g,'').trim();
}
// La réponse n'arrive pas au premier essai. Un élève à qui on montre la
// phrase corrigée dès le premier envoi la recopie et passe : le seul moment
// où il apprend quelque chose, la réparation de sa propre phrase, est
// escamoté. Donc : essai 1, un commentaire qui situe l'erreur, et le choix
// entre retenter et cliquer « Montrez-moi la réponse ». Essai 2 raté, la
// réponse vient d'elle-même — faire deviner un troisième tour décourage.
// WESSAI compte les essais ratés, WSOL garde la réponse à dévoiler, WFB le
// dernier commentaire (pour ne pas le perdre quand on ajoute la réponse).
const WESSAI={}, WSOL={}, WFB={};

// ── CONTRÔLE PAR TERMES-CLÉS ────────────────────────────────────────────
// Une réponse écrite était jugée par égalité de chaîne. Pour « arriverai »,
// c'est juste. Pour « L'annonce 2 : cinq pièces, deux salles de bain, une
// école et un parc tout près », c'est un test de dactylographie : aucun élève
// ne retrouve une phrase de quinze mots au caractère près, et le module lui
// répondait « Presque ! » puis lui demandait de la recopier. Relevé le
// 28 août 2026 sur module-logement, et vrai de 159 items du cours qui
// attendent quatre mots ou plus.
//
// Deux remèdes, tous deux sans appel à l'IA :
//
//   `cles` — l'auteur écrit des GROUPES de termes équivalents, et la réponse
//   passe dès qu'elle touche un terme de chaque groupe, dans n'importe quel
//   ordre. Le gain n'est pas que d'accepter plus large : un groupe manqué se
//   nomme, donc l'élève lit ce qui manque au lieu d'un refus sec.
//
//   `couvre` — le filet, pour les items sans `cles`. Au-delà de trois mots
//   attendus, la comparaison se fait sur les mots de contenu et non sur la
//   forme : une phrase juste, ponctuée autrement, n'est plus une faute.
//
// Ce que ça ne fait pas, et il vaut mieux l'écrire : « ce n'est pas
// l'annonce 2 » contient tous les bons termes. C'est à quoi sert `sauf`, et
// la négation reste le trou de la méthode. C'est le prix de se passer de
// l'IA, et il est petit devant celui qu'on payait.
const WSTOP = new Set(('a au aux avec c ce ces cet cette d dans de des du elle en est et '
  + 'eux il ils j je l la le les leur lui ma mais me mes moi mon n ne nos notre nous on '
  + 'ou par pas plus pour qu que qui sa se ses son sont sur ta te tes toi ton tous tout '
  + 'tres tu un une vos votre vous y').split(' '));

// Les équivalences s'appliquent des DEUX côtés, donc une même ambiguïté ne
// crée pas d'écart. « neuf » et « seconde » sont laissés de côté justement
// parce qu'ils en créeraient une : un logement neuf n'est pas un 9.
function normCle(s){
  return (s||'').toString().toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'')
    .replace(/½/g,' et demi').replace(/(\d)\s*1\/2/g,'$1 et demi')
    .replace(/\bpremieres?\b|\bpremiers?\b|\b1(?:er|re|ere)\b/g,'1')
    .replace(/\bdeuxiemes?\b|\b2e\b/g,'2')
    .replace(/\btroisiemes?\b|\b3e\b/g,'3')
    .replace(/\bquatriemes?\b|\b4e\b/g,'4')
    .replace(/\bcinquiemes?\b|\b5e\b/g,'5')
    .replace(/\bdeux\b/g,'2').replace(/\btrois\b/g,'3').replace(/\bquatre\b/g,'4')
    .replace(/\bcinq\b/g,'5').replace(/\bsix\b/g,'6').replace(/\bsept\b/g,'7')
    .replace(/\bhuit\b/g,'8').replace(/\bdix\b/g,'10')
    .replace(/[^a-z0-9]+/g,' ').replace(/\s+/g,' ').trim();
}
function motsUtiles(s){
  return normCle(s).split(' ').filter(m=>m.length>1 && !WSTOP.has(m));
}
// La part des mots de contenu attendus qui se retrouvent dans la réponse.
function couvre(attendu, donne){
  const a=motsUtiles(attendu); if(!a.length) return 0;
  const d=new Set(motsUtiles(donne));
  return a.filter(m=>d.has(m)).length / a.length;
}
const COUV_MIN = 0.8;
// Le seuil se compte en MOTS DE CONTENU, pas en mots. Compté sur les mots
// bruts, « a-t-elle été » en fait quatre et tombait dans le filet : « a-t-il
// été » y devenait juste, puisque tout ce qui les distingue est un mot vide.
// Douze items de grammaire du cours étaient dans ce cas, relevés par le
// contrôle des leurres. En mots de contenu, ils en font un — le filet les
// laisse tranquilles, et c'est ce qu'il faut : là, la forme EST la réponse.
//
// Trois et non quatre : le seuil a été choisi en mesurant, sur les 3 904
// items à liste fermée, combien d'items le filet couvre et combien de
// réponses d'une AUTRE question il laisserait passer. À 4 : 25 items
// couverts, 0 confusion. À 3 : 105 items couverts, 0 confusion. À 2 : 492
// items, mais 6 confusions. Trois est le dernier seuil encore gratuit.
const LONG_MIN = 3;

// Un groupe s'écrit ['annonce 2','la 2','triplex'] — ou, pour que le module
// puisse DIRE ce qui manque, {q:"pourquoi elle convient", mots:[…]}.
// Un `hint` n'est pas toujours une réponse : dans les items de production
// libre il commence par « Ex. : » et n'est qu'un modèle parmi d'autres. Le
// distinguer permet d'accepter une bonne réponse sans déranger l'assistant —
// et, dans les centres qui refusent l'IA, d'accepter tout court.
function reponseAttendue(it){
  const h=(it && it.hint || '').trim();
  if(!h) return '';
  if(/^(ex\.|exemple|reponse personnelle|réponse personnelle)/i.test(h)) return '';
  return h;
}
function verifCles(it, val){
  const n=' '+normCle(val)+' ';
  const dedans = t => n.includes(' '+normCle(t)+' ');
  for(const t of (it.sauf||[])) if(dedans(t))
    return {ok:false, msg:'❌ Relis la question : ta phrase dit le contraire.'};
  const manque=[];
  for(const g0 of it.cles){
    const g = Array.isArray(g0) ? {q:'', mots:g0} : g0;
    if(!(g.mots||[]).some(dedans)) manque.push(g.q||'');
  }
  if(!manque.length) return {ok:true, msg:''};
  const nommes=manque.filter(Boolean);
  const partiel=manque.length < it.cles.length;
  return {ok:false, msg:(partiel ? '💡 Tu tiens une partie de la réponse. ' : '❌ Pas encore. ')
    + (nommes.length ? 'Il manque : <b>'+nommes.join('</b>, <b>')+'</b>.'
                     : 'Relis la question : elle demande plus que ça.')};
}

function wBoutonReponse(exId, i){
  return '<br><button type="button" class="btn btn-ghost" style="margin-top:8px;padding:7px 12px;font-size:12px" '
    + 'onclick="wDevoiler(\'' + exId + '\',' + i + ')">Montrez-moi la réponse</button>';
}

// Le bouton ne coûte aucun appel : la correction est déjà arrivée avec le
// commentaire, le module la gardait simplement de côté. Dévoiler clôt le
// cycle (essai forcé à 2) et rouvre la case : lire une phrase ne laisse pas
// la trace que laisse le fait de la réécrire.
function wDevoiler(exId, i){
  const k=exId+'_'+i, sol=WSOL[k];
  if(!sol) return;
  WESSAI[k]=Math.max(WESSAI[k]||0, 2);
  const fb=document.getElementById('wf_'+exId+'_'+i);
  const inp=document.getElementById('wi_'+exId+'_'+i);
  fb.className='wfb no';
  fb.innerHTML=(WFB[k]?WFB[k]+'<br>':'')+'<b>La réponse :</b> '+esc(sol)
    +'<br><span style="font-weight:600">Écris-la à ta façon, puis vérifie.</span>';
  if(inp){ inp.value=''; inp.focus(); }
}

async function checkWrite(exId, i){
  const ex=EXOS.find(e=>e.id===exId); if(!ex) return;
  const it=ex.items[i];
  const inp=document.getElementById('wi_'+exId+'_'+i);
  const fb=document.getElementById('wf_'+exId+'_'+i);
  const val=inp.value.trim();
  const zid='w_'+exId+'_'+i;
  const k=exId+'_'+i;
  if(!val){ fb.className='wfb no'; fb.textContent="✏️ Écris ta réponse d'abord."; return; }

  // Termes-clés : passe avant tout le reste, et ne demande jamais de copie.
  if(it.cles){
    const r=verifCles(it, val);
    if(r.ok){
      fb.className='wfb ok'; fb.innerHTML='✅ Bravo, c\'est exact !';
      inp.classList.add('good'); inp.disabled=true; trackPlacement(zid,true);
      return;
    }
    WESSAI[k]=(WESSAI[k]||0)+1;
    const modele=it.hint||(it.accept&&it.accept[0])||'';
    fb.className='wfb no';
    fb.innerHTML = r.msg + ((WESSAI[k]>=2 && modele)
      ? '<br><b>Un exemple de réponse :</b> '+esc(modele)
        +'<br><span style="font-weight:600">Écris-la à ta façon, puis vérifie.</span>'
      : '');
    trackPlacement(zid,false);
    const ratesC = ex.items.reduce((s,_,k2)=> s + (TR.attempts['w_'+exId+'_'+k2]||0), 0);
    evaluerAide(exId, ratesC);
    return;
  }

  // Mode autocorrection (réponse connue)
  if(it.accept){
    const long = motsUtiles(it.accept[0]).length >= LONG_MIN;
    const ok = it.accept.map(normWrite).includes(normWrite(val))
            || (long && it.accept.some(a=>couvre(a,val)>=COUV_MIN));
    if(ok){
      fb.className='wfb ok'; fb.innerHTML='✅ Bravo, c\'est exact !';
      inp.classList.add('good'); inp.disabled=true; trackPlacement(zid,true);
      return;
    }
    WESSAI[k]=(WESSAI[k]||0)+1;
    WSOL[k]=it.accept[0];
    WFB[k]='❌ Presque !';
    fb.className='wfb no';
    fb.innerHTML = (WESSAI[k]<2)
      ? '❌ Presque ! Relis ta réponse et essaie encore.'+wBoutonReponse(exId,i)
      : '💡 La réponse est : <b>'+esc(it.accept[0])+'</b>'
        +'<br><span style="font-weight:600">'
        +(long?'Écris-la à ta façon, puis vérifie.':'Réécris-la dans la case, puis vérifie.')
        +'</span>';
    trackPlacement(zid,false);
    // Ici le cumul a du sens : chaque envoi raté est une tentative distincte.
    const rates = ex.items.reduce((s,_,k2)=> s + (TR.attempts['w_'+exId+'_'+k2]||0), 0);
    evaluerAide(exId, rates);
    return;
  }

  // Mode IA (réponse ouverte)
  // La réponse est déjà sortie : on ne rappelle plus le serveur. Un troisième
  // appel ne dirait rien de neuf et se paierait à chaque frappe. On compare
  // sur place, et une phrase écrite autrement n'est pas comptée comme fautive.
  if(WSOL[k] && (WESSAI[k]||0)>=2){
    const juste = normWrite(val)===normWrite(WSOL[k]) || couvre(WSOL[k], val)>=COUV_MIN;
    fb.className='wfb '+(juste?'ok':'no');
    fb.innerHTML = juste
      ? '✅ Voilà, tu l\'as écrite.'
      : '💡 C\'est noté. Ce qu\'il fallait dire : <b>'+esc(WSOL[k])+'</b>';
    if(juste){ inp.classList.add('good'); trackPlacement(zid,true); }
    return;
  }
  // La réponse attendue est déjà là, en clair, dans l'item : quand l'élève la
  // dit, il est inutile de la faire relire à un assistant — et surtout de la
  // payer. C'est aussi ce qui réparait le cas relevé le 28 août 2026 : une
  // bonne réponse refusée au premier envoi, puis exigée au caractère près.
  const attenduIA = reponseAttendue(it);
  if(attenduIA && couvre(attenduIA, val) >= COUV_MIN){
    fb.className='wfb ok'; fb.innerHTML='✅ Bravo, c\'est exact !';
    inp.classList.add('good'); trackPlacement(zid,true);
    return;
  }
  fb.className='wfb wait'; fb.textContent='⏳ L\'assistant corrige ta réponse…';
  const btn=inp.parentElement.querySelector('.wbtn'); if(btn) btn.disabled=true;
  const essai=(WESSAI[k]||0)+1;
  try{
    const res=await fetch('/api/check-written',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({code:studentCode, consigne:(ex.sub||'')+' '+(it.q||''), reponse:val, attendu:it.hint||'', essai:essai})});
    const d=await res.json();
    if(btn) btn.disabled=false;
    if(!res.ok){ fb.className='wfb no'; fb.textContent=d.error||'Service momentanément indisponible.'; return; }
    if(d.correct){
      fb.className='wfb ok'; fb.innerHTML='✅ '+esc(d.feedback||'');
      inp.classList.add('good'); trackPlacement(zid,true);
      return;
    }
    WESSAI[k]=essai;
    WSOL[k]=d.correction||'';
    WFB[k]='💡 '+esc(d.feedback||'');
    fb.className='wfb no';
    if(!WSOL[k]) fb.innerHTML=WFB[k];
    else if(essai<2) fb.innerHTML=WFB[k]+wBoutonReponse(exId,i);
    else fb.innerHTML=WFB[k]+'<br><b>La réponse :</b> '+esc(WSOL[k])
      +'<br><span style="font-weight:600">Écris-la à ta façon, puis vérifie.</span>';
  }catch(e){
    if(btn) btn.disabled=false;
    fb.className='wfb no'; fb.textContent='Impossible de contacter le serveur. Réessaie.';
  }
}

  t1indirect: {
    eye:'Mini-leçon', tit:"Rapporter ce qu'on vous a dit",
    blocs:[
      {t:'texte', h:"Répéter, ou rapporter",
       p:"Après un appel, personne ne répète les phrases exactes de l'autre. On les <b>rapporte</b> : on les accroche à un verbe comme <i>dire</i>, <i>demander</i>, <i>expliquer</i>, <i>vouloir savoir</i>. C'est ce que fait Nadège quand elle raconte son appel à Samuel — et c'est exactement ce que vous ferez en écrivant vos notes ou en parlant de votre recherche à quelqu'un.",
       note:"Ici, on reste au présent : « elle me dit que… ». Le passé du discours rapporté viendra plus tard dans votre parcours."},

      {t:'ana', h:"Une déclaration → que",
       p:"Le cas le plus simple, et le plus fréquent.",
       mots:[['On a entendu','« Le logement est libre. »'],['On rapporte','Elle me dit que le logement est libre.',true],['Devant voyelle','Elle me dit qu\'il est libre.']],
       say:"Elle me dit que le logement est libre le premier juillet.",
       note:"Le « que » ne disparaît jamais en français, même s'il disparaît dans d'autres langues. « Elle me dit le logement est libre » est faux."},

      {t:'ana', h:"Une question par oui ou non → si",
       p:"Quand la question d'origine se répondait par oui ou par non.",

       say:"Je lui demande si le chauffage est inclus.",
       note:"« Est-ce que » est un outil de question directe. Dans une phrase rapportée, il n'y a plus de question directe : il disparaît toujours."},

      {t:'ana', h:"Une question avec un mot interrogatif → le mot reste",
       p:"Quand, où, combien, pourquoi, comment gardent leur place.",
       mots:[['On a demandé','« Quand est-il libre ? »'],['On rapporte','Je lui demande quand il est libre.',true],['Ce qui change','l\'ordre : sujet, puis verbe']],
       say:"Je lui demande quand le logement est libre.",
       note:"Dans la question directe, le verbe passait souvent devant le sujet. Dans la phrase rapportée, on revient à l'ordre normal."},

      {t:'ana', h:"Qu'est-ce que → ce que · Qu'est-ce qui → ce qui",
       p:"Les deux formes qui se ressemblent le plus, et qu'il faut séparer une bonne fois.",
       mots:[['« Qu\'est-ce que vous fournissez ? »','Je demande ce que vous fournissez.'],['« Qu\'est-ce qui est inclus ? »','Je demande ce qui est inclus.',true],['La différence','ce qui a un verbe juste après']],
       say:"Je veux savoir ce qui est inclus dans le loyer.",
       note:"Après <b>ce qui</b>, le verbe suit tout de suite : ce qui <i>est</i>, ce qui <i>arrive</i>. Après <b>ce que</b>, il y a d'abord un sujet : ce que <i>vous</i> fournissez."},

      {t:'ana', h:"Les pronoms changent de bouche",
       p:"L'erreur la plus fréquente, et la plus discrète.",
       mots:[['Elle a dit','« Je vous le confirme demain. »'],['Vous rapportez','Elle me dit qu\'elle me le confirme demain.',true],['Ce qui bouge','je → elle · vous → me']],
       say:"Elle me dit qu'elle me le confirme demain.",
       note:"On pense au verbe et au « que », et on laisse traîner les pronoms de l'autre personne. Relisez toujours vos pronoms en dernier."},

      {t:'labo', h:"Transformez une phrase",
       p:"Choisissez ce que vous avez entendu.",
       axes:[{id:'p', lbl:'La phrase entendue', opts:[
         ['a','« Le loyer est de 1 050 $. »'],

  t1notes: {

       note:"C'est aussi une intention du programme : prendre en note des renseignements sur un logement donnés au téléphone. Ce n'est pas une astuce, c'est une compétence évaluée."},
