  const errs=data.erreurs||data.errors||[];
  let html='<div class="fb-t">'+ICON_ASSIST+'<span>Rétroaction privée</span></div>';
  if(data.corpsCorrige!==undefined){   // réponse de /api/correct-email
    const cmt=(data.commentairePertinence||'').trim();
    if(cmt) html+= data.pertinent ? '<div class="fb-c fb-bravo">'+esc(cmt)+'</div>'
                                  : '<div class="fb-e">'+esc(cmt)+'</div>';
    else if(data.pertinent) html+='<div class="fb-c fb-bravo">Ton courriel contient tout ce qui était demandé.</div>';
    // La version corrigée attend le deuxième envoi — ou le bouton. Un élève
    // à qui on montre son texte réécrit le recopie ; il n'a rien réparé.
    if(PE.montre) html+='<div class="fb-c">'+esc(data.corpsCorrige)+'</div>';
    (data.erreurs||[]).forEach(e=>{ html+='<div class="fb-e">'+esc(e.explication||e.explanation||e)+'</div>'; });
    if(!PE.montre){ PE.data=data;
      html+='<button type="button" class="btn btn-ghost" style="margin-top:10px;padding:7px 12px;font-size:12px"'
         +' onclick="peDevoiler()">Montrez-moi la version corrigée</button>'; }
    fb.innerHTML=html; fb.classList.add('on'); return;
  }
  if(data.memePhrase){ html+='<div class="fb-c fb-bravo">Ton texte est déjà correct. Bravo !</div>'; }
  else{
    if(corr) html+='<div class="fb-c">'+esc(corr)+'</div>';
    errs.forEach(e=>{ html+='<div class="fb-e">'+esc(e.explication||e.explanation||e)+'</div>'; });
  }
  fb.innerHTML=html; fb.classList.add('on');
}
function corrSummary(data,orig){
  if(data.corpsCorrige!==undefined){   // réponse de /api/correct-email
    const es=(data.erreurs||[]).map(e=>e.explication||e.explanation||e);
    return (data.pertinent?'Contenu conforme. ':'Contenu incomplet : '+(data.commentairePertinence||'')+' ')
      +'Correction : '+data.corpsCorrige+(es.length?' | '+es.join(' '):'');
  }
  const corr=data.corrige||data.corrected||'';
  const errs=data.erreurs||data.errors||[];
  if(data.memePhrase) return "Phrase correcte : "+(corr||orig);
  return "Correction : "+corr+(errs.length?' | '+errs.map(e=>e.explication||e.explanation||e).join(' '):'');
}
function showErr(id,msg){ const e=document.getElementById(id); if(e){e.textContent=msg; e.classList.add('on');} }
function hideErr(id){ const e=document.getElementById(id); if(e)e.classList.remove('on'); }

// ── EXERCICES À ÉCRIRE ────────────────────────────────────────────────
function normWrite(s){
  return (s||'').toLowerCase().trim().normalize('NFD').replace(/[̀-ͯ]/g,'')
    .replace(/\s+/g,' ').replace(/[.!?;:]+$/,'').replace(/^["«»']+|["«»']+$/g,'').trim();
}
// La réponse n'arrive pas au premier essai. Un élève à qui on montre la
// phrase corrigée dès le premier envoi la recopie et passe : le seul moment
// où il apprend quelque chose, la réparation de sa propre phrase, est
// escamoté. Donc : essai 1, un commentaire qui situe l'erreur, et le choix
// entre retenter et cliquer « Montrez-moi la réponse ». Essai 2 raté, la
// réponse vient d'elle-même — faire deviner un troisième tour décourage.
// WESSAI compte les essais ratés, WSOL garde la réponse à dévoiler, WFB le
// dernier commentaire (pour ne pas le perdre quand on ajoute la réponse).
const WESSAI={}, WSOL={}, WFB={};

// ── CONTRÔLE PAR TERMES-CLÉS ────────────────────────────────────────────
// Une réponse écrite était jugée par égalité de chaîne. Pour « arriverai »,
// c'est juste. Pour « L'annonce 2 : cinq pièces, deux salles de bain, une
// école et un parc tout près », c'est un test de dactylographie : aucun élève
// ne retrouve une phrase de quinze mots au caractère près, et le module lui
// répondait « Presque ! » puis lui demandait de la recopier. Relevé le
// 28 août 2026 sur module-logement, et vrai de 159 items du cours qui
// attendent quatre mots ou plus.
//
// Deux remèdes, tous deux sans appel à l'IA :
//
//   `cles` — l'auteur écrit des GROUPES de termes équivalents, et la réponse
//   passe dès qu'elle touche un terme de chaque groupe, dans n'importe quel
//   ordre. Le gain n'est pas que d'accepter plus large : un groupe manqué se
//   nomme, donc l'élève lit ce qui manque au lieu d'un refus sec.
//
//   `couvre` — le filet, pour les items sans `cles`. Au-delà de trois mots
//   attendus, la comparaison se fait sur les mots de contenu et non sur la
//   forme : une phrase juste, ponctuée autrement, n'est plus une faute.
//
// Ce que ça ne fait pas, et il vaut mieux l'écrire : « ce n'est pas
// l'annonce 2 » contient tous les bons termes. C'est à quoi sert `sauf`, et
// la négation reste le trou de la méthode. C'est le prix de se passer de
// l'IA, et il est petit devant celui qu'on payait.
const WSTOP = new Set(('a au aux avec c ce ces cet cette d dans de des du elle en est et '
  + 'eux il ils j je l la le les leur lui ma mais me mes moi mon n ne nos notre nous on '
  + 'ou par pas plus pour qu que qui sa se ses son sont sur ta te tes toi ton tous tout '
  + 'tres tu un une vos votre vous y').split(' '));

// Les équivalences s'appliquent des DEUX côtés, donc une même ambiguïté ne
// crée pas d'écart. « neuf » et « seconde » sont laissés de côté justement
// parce qu'ils en créeraient une : un logement neuf n'est pas un 9.
function normCle(s){
  return (s||'').toString().toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'')
    .replace(/½/g,' et demi').replace(/(\d)\s*1\/2/g,'$1 et demi')
    .replace(/\bpremieres?\b|\bpremiers?\b|\b1(?:er|re|ere)\b/g,'1')
    .replace(/\bdeuxiemes?\b|\b2e\b/g,'2')
    .replace(/\btroisiemes?\b|\b3e\b/g,'3')
    .replace(/\bquatriemes?\b|\b4e\b/g,'4')
    .replace(/\bcinquiemes?\b|\b5e\b/g,'5')
    .replace(/\bdeux\b/g,'2').replace(/\btrois\b/g,'3').replace(/\bquatre\b/g,'4')
    .replace(/\bcinq\b/g,'5').replace(/\bsix\b/g,'6').replace(/\bsept\b/g,'7')
    .replace(/\bhuit\b/g,'8').replace(/\bdix\b/g,'10')
    .replace(/[^a-z0-9]+/g,' ').replace(/\s+/g,' ').trim();
}
function motsUtiles(s){
  return normCle(s).split(' ').filter(m=>m.length>1 && !WSTOP.has(m));
}
// La part des mots de contenu attendus qui se retrouvent dans la réponse.
function couvre(attendu, donne){
  const a=motsUtiles(attendu); if(!a.length) return 0;
  const d=new Set(motsUtiles(donne));
  return a.filter(m=>d.has(m)).length / a.length;
}
const COUV_MIN = 0.8;
// Le seuil se compte en MOTS DE CONTENU, pas en mots. Compté sur les mots
// bruts, « a-t-elle été » en fait quatre et tombait dans le filet : « a-t-il
// été » y devenait juste, puisque tout ce qui les distingue est un mot vide.
// Douze items de grammaire du cours étaient dans ce cas, relevés par le
// contrôle des leurres. En mots de contenu, ils en font un — le filet les
// laisse tranquilles, et c'est ce qu'il faut : là, la forme EST la réponse.
//
// Trois et non quatre : le seuil a été choisi en mesurant, sur les 3 904
// items à liste fermée, combien d'items le filet couvre et combien de
// réponses d'une AUTRE question il laisserait passer. À 4 : 25 items
// couverts, 0 confusion. À 3 : 105 items couverts, 0 confusion. À 2 : 492
// items, mais 6 confusions. Trois est le dernier seuil encore gratuit.
const LONG_MIN = 3;

// Un groupe s'écrit ['annonce 2','la 2','triplex'] — ou, pour que le module
// puisse DIRE ce qui manque, {q:"pourquoi elle convient", mots:[…]}.
// Un `hint` n'est pas toujours une réponse : dans les items de production
// libre il commence par « Ex. : » et n'est qu'un modèle parmi d'autres. Le
// distinguer permet d'accepter une bonne réponse sans déranger l'assistant —
// et, dans les centres qui refusent l'IA, d'accepter tout court.
function reponseAttendue(it){
  const h=(it && it.hint || '').trim();
  if(!h) return '';
  if(/^(ex\.|exemple|reponse personnelle|réponse personnelle)/i.test(h)) return '';
  return h;
}
function verifCles(it, val){
  const n=' '+normCle(val)+' ';
  const dedans = t => n.includes(' '+normCle(t)+' ');
  for(const t of (it.sauf||[])) if(dedans(t))
    return {ok:false, msg:'❌ Relis la question : ta phrase dit le contraire.'};
  const manque=[];
  for(const g0 of it.cles){
    const g = Array.isArray(g0) ? {q:'', mots:g0} : g0;
    if(!(g.mots||[]).some(dedans)) manque.push(g.q||'');
  }
  if(!manque.length) return {ok:true, msg:''};
  const nommes=manque.filter(Boolean);
  const partiel=manque.length < it.cles.length;
  return {ok:false, msg:(partiel ? '💡 Tu tiens une partie de la réponse. ' : '❌ Pas encore. ')
    + (nommes.length ? 'Il manque : <b>'+nommes.join('</b>, <b>')+'</b>.'
                     : 'Relis la question : elle demande plus que ça.')};
}

function wBoutonReponse(exId, i){
  return '<br><button type="button" class="btn btn-ghost" style="margin-top:8px;padding:7px 12px;font-size:12px" '
    + 'onclick="wDevoiler(\'' + exId + '\',' + i + ')">Montrez-moi la réponse</button>';
}

// Le bouton ne coûte aucun appel : la correction est déjà arrivée avec le
// commentaire, le module la gardait simplement de côté. Dévoiler clôt le
// cycle (essai forcé à 2) et rouvre la case : lire une phrase ne laisse pas
// la trace que laisse le fait de la réécrire.
function wDevoiler(exId, i){
  const k=exId+'_'+i, sol=WSOL[k];
  if(!sol) return;
  WESSAI[k]=Math.max(WESSAI[k]||0, 2);
  const fb=document.getElementById('wf_'+exId+'_'+i);
  const inp=document.getElementById('wi_'+exId+'_'+i);
  fb.className='wfb no';
  fb.innerHTML=(WFB[k]?WFB[k]+'<br>':'')+'<b>La réponse :</b> '+esc(sol)
    +'<br><span style="font-weight:600">Écris-la à ta façon, puis vérifie.</span>';
  if(inp){ inp.value=''; inp.focus(); }
}

async function checkWrite(exId, i){
  const ex=EXOS.find(e=>e.id===exId); if(!ex) return;
  const it=ex.items[i];
  const inp=document.getElementById('wi_'+exId+'_'+i);
  const fb=document.getElementById('wf_'+exId+'_'+i);
  const val=inp.value.trim();
  const zid='w_'+exId+'_'+i;
  const k=exId+'_'+i;
  if(!val){ fb.className='wfb no'; fb.textContent="✏️ Écris ta réponse d'abord."; return; }

  // Termes-clés : passe avant tout le reste, et ne demande jamais de copie.
  if(it.cles){
    const r=verifCles(it, val);
    if(r.ok){
      fb.className='wfb ok'; fb.innerHTML='✅ Bravo, c\'est exact !';
      inp.classList.add('good'); inp.disabled=true; trackPlacement(zid,true);
      return;
    }
    WESSAI[k]=(WESSAI[k]||0)+1;
    const modele=it.hint||(it.accept&&it.accept[0])||'';
    fb.className='wfb no';
    fb.innerHTML = r.msg + ((WESSAI[k]>=2 && modele)
      ? '<br><b>Un exemple de réponse :</b> '+esc(modele)
        +'<br><span style="font-weight:600">Écris-la à ta façon, puis vérifie.</span>'
      : '');
    trackPlacement(zid,false);
    const ratesC = ex.items.reduce((s,_,k2)=> s + (TR.attempts['w_'+exId+'_'+k2]||0), 0);
    evaluerAide(exId, ratesC);
    return;
  }

  // Mode autocorrection (réponse connue)
  if(it.accept){
    const long = motsUtiles(it.accept[0]).length >= LONG_MIN;
    const ok = it.accept.map(normWrite).includes(normWrite(val))
            || (long && it.accept.some(a=>couvre(a,val)>=COUV_MIN));
    if(ok){
      fb.className='wfb ok'; fb.innerHTML='✅ Bravo, c\'est exact !';
      inp.classList.add('good'); inp.disabled=true; trackPlacement(zid,true);
      return;
    }
    WESSAI[k]=(WESSAI[k]||0)+1;
    WSOL[k]=it.accept[0];
    WFB[k]='❌ Presque !';
    fb.className='wfb no';
    fb.innerHTML = (WESSAI[k]<2)
      ? '❌ Presque ! Relis ta réponse et essaie encore.'+wBoutonReponse(exId,i)
      : '💡 La réponse est : <b>'+esc(it.accept[0])+'</b>'
        +'<br><span style="font-weight:600">'
        +(long?'Écris-la à ta façon, puis vérifie.':'Réécris-la dans la case, puis vérifie.')
        +'</span>';
    trackPlacement(zid,false);
    // Ici le cumul a du sens : chaque envoi raté est une tentative distincte.
    const rates = ex.items.reduce((s,_,k2)=> s + (TR.attempts['w_'+exId+'_'+k2]||0), 0);
    evaluerAide(exId, rates);
    return;
  }

  // Mode IA (réponse ouverte)
  // La réponse est déjà sortie : on ne rappelle plus le serveur. Un troisième
  // appel ne dirait rien de neuf et se paierait à chaque frappe. On compare
  // sur place, et une phrase écrite autrement n'est pas comptée comme fautive.
  if(WSOL[k] && (WESSAI[k]||0)>=2){
    const juste = normWrite(val)===normWrite(WSOL[k]) || couvre(WSOL[k], val)>=COUV_MIN;
    fb.className='wfb '+(juste?'ok':'no');
    fb.innerHTML = juste
      ? '✅ Voilà, tu l\'as écrite.'
      : '💡 C\'est noté. Ce qu\'il fallait dire : <b>'+esc(WSOL[k])+'</b>';
    if(juste){ inp.classList.add('good'); trackPlacement(zid,true); }
    return;
  }
  // La réponse attendue est déjà là, en clair, dans l'item : quand l'élève la
  // dit, il est inutile de la faire relire à un assistant — et surtout de la
  // payer. C'est aussi ce qui réparait le cas relevé le 28 août 2026 : une
  // bonne réponse refusée au premier envoi, puis exigée au caractère près.
  const attenduIA = reponseAttendue(it);
  if(attenduIA && couvre(attenduIA, val) >= COUV_MIN){
    fb.className='wfb ok'; fb.innerHTML='✅ Bravo, c\'est exact !';
    inp.classList.add('good'); trackPlacement(zid,true);
    return;
  }
  fb.className='wfb wait'; fb.textContent='⏳ L\'assistant corrige ta réponse…';
  const btn=inp.parentElement.querySelector('.wbtn'); if(btn) btn.disabled=true;
  const essai=(WESSAI[k]||0)+1;
  try{
    const res=await fetch('/api/check-written',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({code:studentCode, consigne:(ex.sub||'')+' '+(it.q||''), reponse:val, attendu:it.hint||'', essai:essai})});
    const d=await res.json();
    if(btn) btn.disabled=false;
    if(!res.ok){ fb.className='wfb no'; fb.textContent=d.error||'Service momentanément indisponible.'; return; }
    if(d.correct){
      fb.className='wfb ok'; fb.innerHTML='✅ '+esc(d.feedback||'');
      inp.classList.add('good'); trackPlacement(zid,true);
      return;
    }
    WESSAI[k]=essai;
    WSOL[k]=d.correction||'';
    WFB[k]='💡 '+esc(d.feedback||'');
    fb.className='wfb no';
    if(!WSOL[k]) fb.innerHTML=WFB[k];
    else if(essai<2) fb.innerHTML=WFB[k]+wBoutonReponse(exId,i);
    else fb.innerHTML=WFB[k]+'<br><b>La réponse :</b> '+esc(WSOL[k])
      +'<br><span style="font-weight:600">Écris-la à ta façon, puis vérifie.</span>';
  }catch(e){
    if(btn) btn.disabled=false;
    fb.className='wfb no'; fb.textContent='Impossible de contacter le serveur. Réessaie.';
  }
}

// ── « EN APPRENDRE PLUS » : rendu du panneau ──────────────────────────
// Souligne en vert ce qui est noté entre accolades : « superficiel{le} »,
// « Pour{riez}-vous… ». Les crochets restent libres pour les sons — [y], [u].
function plMark(w){
  return String(w).split(/(\{[^}]*\})/).map(p=>
    (p.charAt(0)==='{' && p.charAt(p.length-1)==='}')
      ? '<span class="pl-end">'+esc(p.slice(1,-1))+'</span>'
      : esc(p)
  ).join('');
}
const plPlain = w => String(w).replace(/[{}]/g,'');

// Nom du MP3 d'un bouton d'écoute de mini-leçon : sons/<id>.mp3. Si le fichier
// n'existe pas, playWord retombe sur la synthèse vocale — donc on peut brancher
// les boutons avant d'avoir généré les sons.
const plAudioId = (exId, kind, bi, sub) =>
  'plus_' + exId + '_' + kind + bi + (sub===undefined ? '' : '_' + sub);

// Liste { identifiant → texte à lire } de tous les boutons d'écoute des
// mini-leçons. C'est la source de vérité du script de génération audio :
// ouvrir le module dans le navigateur et lancer plAudioManifest() pour la
// relire après toute modification de PLUS.
function plAudioManifest(){
  const m = {};
  Object.keys(PLUS).forEach(exId=>{
    PLUS[exId].blocs.forEach((b,bi)=>{
      if(b.t==='ana')
        m[plAudioId(exId,'ana',bi)] = b.say || b.mots.map(x=>plPlain(x[1])).join(' ');
      if(b.t==='ex')
        b.rows.forEach((r,ri)=>{ m[plAudioId(exId,'ex',bi,ri)] = r[2] || r[0]; });
      if(b.t==='labo')
        Object.keys(b.out).forEach(k=>{
          const o=b.out[k];
          m[plAudioId(exId,'lab',bi,k)] = o.say || o.w.map(plPlain).join(' ');
        });
    });
  });
  return m;
}
const plLab = {};   // état des laboratoires, par clé « exoId-index de bloc »

function plBloc(b, exId, bi){
  const eye = {texte:'Explication', ana:'Anatomie', labo:'À manipuler',
               ex:'Exemples', piege:'Attention', check:'Vérifiez-vous'}[b.t] || 'Explication';
  let h='<div class="pl-blk"><div class="pl-eye">'+eye+'</div>';
  if(b.h) h+='<div class="pl-h">'+esc(b.h)+'</div>';
  if(b.p) h+='<div class="pl-p">'+b.p+'</div>';

  if(b.t==='ana'){
    h+='<div class="pl-ana">';
    b.mots.forEach(m=>{
      const key = m[2]===true || /noyau/i.test(m[0]);
      h+='<div class="pl-tok'+(key?' is-key':'')+'"><span class="pl-tok-lbl">'+esc(m[0])+'</span>'
       + '<span class="pl-tok-w">'+plMark(m[1])+'</span></div>';
    });
    // Les étiquettes d'anatomie mises bout à bout ne se lisent pas toujours
    // bien (élisions, traits d'union, symboles phonétiques) : `say` donne le
    // texte à prononcer quand la simple concaténation ne suffit pas.
    const anaTxt = b.say || b.mots.map(m=>plPlain(m[1])).join(' ');
    h+='<button class="btn-audio-round" type="button" title="Écouter le groupe"'
     + ' onclick="playWord(this,\''+jsq(anaTxt)+'\',\''+plAudioId(exId,'ana',bi)+'\')">'+ICON_SPEAK+'</button>';
    h+='</div>';
  }

  if(b.t==='labo'){
    h+='<div id="lab-'+exId+'-'+bi+'" style="margin-top:16px">';
    b.axes.forEach(a=>{
      h+='<div class="pl-axe"><div class="pl-axe-lbl">'+esc(a.lbl)+'</div><div class="pl-opts">';
      a.opts.forEach(o=>{
        h+='<button class="pl-opt" type="button" data-axe="'+a.id+'" data-val="'+o[0]+'" aria-pressed="false"'
         + ' onclick="plLabo(\''+exId+'\','+bi+',\''+a.id+'\',\''+o[0]+'\')">'+esc(o[1])+'</button>';
      });
      h+='</div></div>';
    });
    h+='<div class="pl-out"><div class="pl-out-w"></div>'
     + '<button class="btn-audio-round" type="button" title="Écouter">'+ICON_SPEAK+'</button>'
     + '<div class="pl-out-n"></div></div></div>';
  }

  if(b.t==='ex'){
    h+='<div style="margin-top:14px">';
    b.rows.forEach((r,ri)=>{
      h+='<div class="pl-ex"><button class="btn-audio-round" type="button" title="Écouter"'
       + ' onclick="playWord(this,\''+jsq(r[2]||r[0])+'\',\''+plAudioId(exId,'ex',bi,ri)+'\')">'+ICON_SPEAK+'</button>'
       + '<span class="pl-ex-w">'+esc(r[0])+'</span><span class="pl-ex-t">'+esc(r[1])+'</span></div>';
    });
    h+='</div>';
  }

  if(b.t==='piege'){
    h+='<div style="margin-top:6px">';
    b.rows.forEach(r=>{
      h+='<div class="pl-trap"><div class="pl-bad"><span aria-hidden="true">✕</span><span>'+esc(r[0])+'</span></div>'
       + '<div class="pl-good"><span aria-hidden="true">✓</span><span>'+esc(r[1])+'</span></div>'
       + '<div class="pl-why">'+r[2]+'</div></div>';
    });
    h+='</div>';
  }

  if(b.t==='check'){
    h+='<div style="margin-top:12px">';
    b.qs.forEach((q,qi)=>{
      h+='<div class="pl-q"><div class="pl-qtxt">'+esc(q.q)+'</div><div class="pl-opts">';
      q.opts.forEach((o,oi)=>{
        h+='<button class="pl-opt" type="button" onclick="plCheck(this,\''+exId+'\','+bi+','+qi+','+oi+')">'+esc(o)+'</button>';
      });
      h+='</div><div class="pl-fb" aria-live="polite"></div></div>';
    });
    h+='</div>';
  }

  if(b.note) h+='<div class="pl-note">'+b.note+'</div>';
  return h+'</div>';
}

function plLabo(exId, bi, axeId, val){
  const key=exId+'-'+bi, b=PLUS[exId].blocs[bi];
  const st=plLab[key] || (plLab[key]={});
  b.axes.forEach(a=>{ if(st[a.id]==null) st[a.id]=a.opts[0][0]; });
  if(axeId) st[axeId]=val;
  const box=document.getElementById('lab-'+key); if(!box) return;
  box.querySelectorAll('.pl-opt[data-axe]').forEach(el=>{
    const on = st[el.dataset.axe]===el.dataset.val;
    el.classList.toggle('on', on);
    el.setAttribute('aria-pressed', on?'true':'false');
  });
  const o = b.out[b.axes.map(a=>st[a.id]).join('')];
  if(!o) return;
  const out = box.querySelector('.pl-out-w');
  out.innerHTML = o.w.map(plMark).join(' ');
  // Une phrase longue ne tient pas au corps de 27 px : on descend d'un cran.
  out.classList.toggle('is-long', o.w.map(plPlain).join(' ').length > 30);
  box.querySelector('.pl-out-n').textContent = o.n;
  // `say` sert quand le texte affiché contient de la ponctuation de mise en
  // page (une paire « tout · tu » se lit mieux avec une virgule).
  const phrase = o.say || o.w.map(plPlain).join(' ');
  const fid = plAudioId(exId, 'lab', bi, b.axes.map(a=>st[a.id]).join(''));
  box.querySelector('.pl-out .btn-audio-round').onclick = function(){ playWord(this, phrase, fid); };
}

function plCheck(btn, exId, bi, qi, oi){
  const q=PLUS[exId].blocs[bi].qs[qi];
  const wrap=btn.closest('.pl-q');
  const opts=wrap.querySelectorAll('.pl-opt');
  opts.forEach(el=>el.classList.remove('ok','no'));
  const good = oi===q.ok;
  btn.classList.add(good?'ok':'no');
  if(!good) opts[q.ok].classList.add('ok');
  const fb=wrap.querySelector('.pl-fb');
  fb.className='pl-fb on '+(good?'ok':'no');
  fb.innerHTML='<span aria-hidden="true">'+(good?'✓':'✕')+'</span> '+(good?'':'La bonne réponse est « '+esc(q.opts[q.ok])+' ». ')+q.fb;
}

// ── PROPOSITION D'AIDE APRÈS PLUSIEURS ERREURS ────────────────────────
// Le module connaît déjà, à la correction, quels énoncés sont ratés. Au-delà
// d'un seuil, il propose une aide — sans jamais l'imposer ni toucher au score.
// Une seule proposition par exercice et par séance.
const AIDE = {err:{}, etat:{}};      // etat : 'proposee' | 'ouverte' | 'refusee' | 'analysee'
const AIDE_SEUIL = 3;

// Les exercices analysables : ceux dont on peut reconstituer, ligne par ligne,
// ce que l'élève a choisi et ce qu'il fallait choisir.
function releverReponses(exId){
  const ex = EXOS.find(e=>e.id===exId); if(!ex) return [];
  if(ex.type==='vf'){
    return ex.rows.filter(r=>S.vfSel[r.id]).map(r=>({
      enonce:r.txt, choix:S.vfSel[r.id], bonne:r.ok}));
  }
  if(ex.type==='write'){
    return ex.items.map((it,i)=>{
      const inp=document.getElementById('wi_'+exId+'_'+i);
      const val=inp ? inp.value.trim() : '';
      if(!val || !it.accept) return null;
      return {enonce:it.q, choix:val, bonne:it.accept[0]};
    }).filter(Boolean);
  }
  return [];
}

/* Les deux journaux de l'enseignante nomment le même exercice : l'analyse
   d'erreurs y met son titre, les signaux d'aide y mettaient l'identifiant
   court. Deux noms pour une seule chose, et une colonne « Exercice » qu'on ne
   peut pas lire sans le module ouvert à côté. Le titre part des deux côtés.
   Repli sur l'identifiant : un exercice sans titre vaut mieux qu'un vide. */
function titreExo(exId){
  const ex = (typeof EXOS !== 'undefined') && EXOS.find(e => e.id === exId);
  if(ex && ex.tit) return ex.tit;
  if(typeof PLUS !== 'undefined' && PLUS[exId] && PLUS[exId].tit) return PLUS[exId].tit;
  return exId;
}

function evaluerAide(exId, nbErreurs){
  if(!exId) return;
  // L'analyse d'erreurs vaut pour tout exercice reconstituable, avec ou sans
  // mini-leçon.
  if(!PLUS[exId] && !releverReponses(exId).length) return;
  AIDE.err[exId] = Math.max(AIDE.err[exId]||0, nbErreurs);
  if(AIDE.err[exId] >= AIDE_SEUIL && !AIDE.etat[exId]) proposerAide(exId);
}

function proposerAide(exId){
  const card = document.getElementById('exo-'+exId);
  if(!card || card.querySelector('.aide')) return;
  AIDE.etat[exId] = 'proposee';
  const n = AIDE.err[exId];
  const analysable = releverReponses(exId).length > 0;
  const el = document.createElement('div');
  el.className = 'aide';
  el.id = 'aide-' + exId;
  el.innerHTML =
      '<div class="aide-txt"><b>' + n + ' erreurs</b> dans cet exercice.'
    + (PLUS[exId] ? ' La mini-leçon « ' + esc(PLUS[exId].tit) + ' » explique ce point autrement.' : '')
    + '</div>'
    + '<div class="aide-btns">'
    + (analysable
        ? '<button class="btn-oui" type="button" onclick="analyserErreurs(\'' + exId + '\')">'
          + ICON_ASSISTANT + ' Pourquoi je me trompe ?</button>' : '')
    + (PLUS[exId]
        ? '<button class="' + (analysable ? 'btn-non' : 'btn-oui') + '" type="button"'
          + ' onclick="accepterAide(\'' + exId + '\')">Revoir l\'explication</button>' : '')
    + '<button class="btn-non" type="button" onclick="refuserAide(\'' + exId + '\')">Plus tard</button>'
    + '</div>'
    + '<div class="aide-out" id="aideout-' + exId + '" aria-live="polite"></div>';
  card.appendChild(el);
  lmsTrack('aide_proposee', {exercice: titreExo(exId), erreurs: n, analysable: analysable});
}

function accepterAide(exId){
  AIDE.etat[exId] = 'ouverte';
  const el = document.querySelector('#exo-'+exId+' .aide');
  if(el) el.remove();
  lmsTrack('aide_acceptee', {exercice: titreExo(exId), erreurs: AIDE.err[exId]});
  plusOpen(exId, 'labo');
}

// ── NIVEAU 2 : analyse du patron d'erreurs par l'IA ───────────────────
// On envoie l'exercice COMPLET — chaque énoncé, le choix de l'élève, la bonne
// réponse. L'IA ne juge rien : la correction est déjà faite et affichée. Elle
// cherche seulement ce qui se répète dans les erreurs.
async function analyserErreurs(exId){
  const ex = EXOS.find(e=>e.id===exId); if(!ex) return;
  const items = releverReponses(exId);
  const out = document.getElementById('aideout-'+exId);
  const btn = document.querySelector('#aide-'+exId+' .btn-oui');
  if(!items.length || !out) return;

  // Un seul appel par exercice et par séance : l'élève qui s'acharne ne doit
  // pas générer une série d'appels facturés.
  if(btn){ btn.disabled = true; }
  out.className = 'aide-out on wait';
  out.textContent = "L'assistant relit tes réponses…";

  // L'activité se lit dans l'adresse du parent, comme le fait lmsTrack : le
  // module est dans une iframe et ne connaît pas son propre numéro. Sans elle,
  // l'analyse que le serveur garde ne se rattache à aucun module.
  let actId = null, actTitre = '';
  try{
    const up = new URLSearchParams(window.parent.location.search);
    actId = parseInt(up.get('activityId')) || null;
    actTitre = up.get('title') || '';
  }catch(e){}

  try{
    const res = await fetch('/api/analyser-erreurs', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({
        code: studentCode,
        activityId: actId,
        activityTitle: actTitre,
        exercice: ex.tit || '',
        notion: (ex.savoir && ex.savoir.h ? ex.savoir.h.replace(/^›\s*/,'') : ''),
        items: items,
      })});
    const d = await res.json();
    if(!res.ok){
      out.className = 'aide-out on no';
      out.textContent = d.error || 'Service momentanément indisponible.';
      if(btn) btn.disabled = false;      // panne : on laisse réessayer
      return;
    }
    out.className = 'aide-out on';
    out.innerHTML =
        (d.patron ? '<div class="ao-k">Ce qui revient</div><div class="ao-v">'+esc(d.patron)+'</div>' : '')
      + (d.explication ? '<div class="ao-k">Pourquoi</div><div class="ao-v">'+esc(d.explication)+'</div>' : '')
      + (d.conseil ? '<div class="ao-k">La prochaine fois</div><div class="ao-v ao-conseil">'+esc(d.conseil)+'</div>' : '');
    AIDE.etat[exId] = 'analysee';
    lmsTrack('aide_analysee', {exercice: titreExo(exId), erreurs: AIDE.err[exId]});
  }catch(e){
    out.className = 'aide-out on no';
    out.textContent = 'Impossible de contacter le serveur. Réessaie plus tard.';
    if(btn) btn.disabled = false;
  }
}

function refuserAide(exId){
  AIDE.etat[exId] = 'refusee';
  const el = document.querySelector('#exo-'+exId+' .aide');
  if(el) el.remove();
  lmsTrack('aide_refusee', {exercice: titreExo(exId), erreurs: AIDE.err[exId]});
}

let plLastFocus=null;
// `cible` : type de bloc vers lequel faire défiler le panneau ('labo' pour la
// manipulation). Sans lui, l'élève arrive en haut d'une longue leçon.
function plusOpen(exId, cible){
  const P=PLUS[exId]; if(!P) return;
  document.getElementById('plus-eye').textContent = P.eye || 'Mini-leçon';
  document.getElementById('plus-tit').textContent = P.tit;
  const body=document.getElementById('plus-body');
  body.innerHTML = P.blocs.map((b,bi)=>plBloc(b,exId,bi)).join('');
  body.scrollTop=0;
  document.getElementById('plus-ov').classList.add('on');
  // Le défilement appartient à <html> (body est figé à height:100%) — poser
  // overflow:hidden sur body rognerait toute la page.
  document.documentElement.style.overflow='hidden';
  P.blocs.forEach((b,bi)=>{ if(b.t==='labo') plLabo(exId,bi,null,null); });
  plLastFocus=document.activeElement;
  document.getElementById('plus-close').focus();
  lmsTrack('plus_open', {savoir: titreExo(exId), cible: cible || ''});
  if(cible){
    const i = P.blocs.findIndex(b => b.t === cible);
    if(i >= 0){
      const bloc = body.children[i];
      if(bloc){
        bloc.scrollIntoView({block:'start'});
        bloc.classList.add('is-cible');
        setTimeout(()=>bloc.classList.remove('is-cible'), 2500);
      }
    }
  }
}
function plusClose(){
  document.getElementById('plus-ov').classList.remove('on');
  document.documentElement.style.overflow='';
  if(plLastFocus && plLastFocus.focus) plLastFocus.focus();
}
document.getElementById('plus-close').addEventListener('click', plusClose);
document.getElementById('plus-ov').addEventListener('click', e=>{ if(e.target.id==='plus-ov') plusClose(); });
document.addEventListener('keydown', e=>{
  if(e.key==='Escape' && document.getElementById('plus-ov').classList.contains('on')) plusClose();
});

function render(){

  const cur = SECTIONS.find(s=>s.id===curSec);
  if(cur){

  }
  SECTIONS.forEach(sec=>{
    document.getElementById('tab-'+sec.id).classList.toggle('on', curSec===sec.id);
    document.getElementById('sec-'+sec.id).classList.toggle('on', curSec===sec.id);
    const zids=Object.keys(ZONES).filter(z=>{const ex=EXOS.find(e=>e.id===ZONES[z].exo);return ex.sec===sec.id});
    const done=zids.length>0&&zids.every(z=>TR.correct[z]);

  const ban=document.getElementById('sel-banner');

  EXOS.forEach(ex=>{
    const mount=document.getElementById('mount-'+ex.id);
    if(!mount) return;
    const bank=document.getElementById('bank-'+ex.id);
    mount.innerHTML=''; if(bank) bank.innerHTML='';

    if(ex.type==='vf' && ex.cards){
      // Grille de cartes : bouton audio rond + mot, puis les choix dessous.
      mount.className='ph-grid';

        const word=r.txt.replace(/<[^>]+>/g,'');
        const card=document.createElement('div');card.className='ph-card';
        const top=document.createElement('div');top.className='ph-top';

        sb.type='button'; sb.className='btn-audio-round'; sb.setAttribute('aria-label','Écouter le mot');

        const w=document.createElement('div');w.className='ph-word';w.textContent=word;
        top.appendChild(w);
        card.appendChild(top);
        const opts=document.createElement('div');opts.className='ph-opts';
        ex.tiles.forEach(lbl=>{
          const b=document.createElement('button');
          b.type='button'; b.className='vf-opt';
          if(S.vfSel[r.id]===lbl) b.classList.add('sel');
          if(S.fb[r.id] && S.vfSel[r.id]===lbl) b.classList.add(S.fb[r.id]==='ok'?'fb-ok':'fb-no');
          b.textContent=lbl;
          b.onclick=()=>vfSelect(r.id,lbl);
          opts.appendChild(b);
        });
        card.appendChild(opts);
        mount.appendChild(card);
      });
    }
    else if(ex.type==='vf'){
      ex.rows.forEach(r=>{
        const row=document.createElement('div');row.className='vf-row';
        if(ex.listen){
          const sb=document.createElement('button');
          sb.type='button'; sb.className='btn btn-ghost'; sb.style.cssText='flex:0 0 auto;padding:8px 12px;font-size:16px';
          sb.innerHTML=ICON_SPEAK; sb.onclick=()=>playWord(sb, r.txt.replace(/<[^>]+>/g,''), ex.id+'_'+r.id);
          row.appendChild(sb);
        }
        const txt=document.createElement('div');txt.className='stxt';txt.innerHTML=r.txt;
        row.appendChild(txt);
        const opts=document.createElement('div');opts.className='vf-opts';
        ex.tiles.forEach(lbl=>{
          const b=document.createElement('button');
          b.type='button'; b.className='vf-opt';
          if(S.vfSel[r.id]===lbl) b.classList.add('sel');
          if(S.fb[r.id] && S.vfSel[r.id]===lbl) b.classList.add(S.fb[r.id]==='ok'?'fb-ok':'fb-no');
          b.textContent=lbl;
          b.onclick=()=>vfSelect(r.id,lbl);
          opts.appendChild(b);
        });
        row.appendChild(opts);
        mount.appendChild(row);
      });
    }
    if(ex.type==='match'){
      ex.rows.forEach(r=>{
        const row=document.createElement('div');row.className='rrow2 rz';

        qc.innerHTML=(ex.noQLbl?'':'<div class="qlbl">Question</div>')+'<div class="qtxt">'+esc(r.q)+'</div>';
        row.appendChild(qc);row.appendChild(mkZone(r.id,null,ex.zonePh||'glissez la réponse ici'));

      shuffled(ex.rows,7).forEach(r=>{ if(used.has(r.aid))return; bank.appendChild(mkTile(r.aid,r.a,ex.id,'ta')); });
      if(!bank.children.length)bank.innerHTML='<div class="bempty">Toutes les réponses sont placées !</div>';
    }
    if(ex.type==='imgmatch'){
      ex.rows.forEach(r=>{

      if(!bank.children.length)bank.innerHTML='<div class="bempty">Toutes les images sont placées !</div>';

      ex.segs.forEach(sg=>{ if(sg.k==='t'){mount.appendChild(document.createTextNode(sg.t))} else{mount.appendChild(mkBlank(sg.id))} });
      calerBlancs(mount, ex.words);

      if(!bank.children.length)bank.innerHTML='<div class="bempty">Toutes les phrases sont placées !</div>';
    }
  });
  updateChip();
  /* REPRISE-APPEL:début — greffé par build/greffe_reprise.py */
  reSauver();   // toute modification de l'état passe par render()
  /* REPRISE-APPEL:fin */
}

    z.className='att'; z.textContent="La traduction n'est pas disponible hors ligne."; return;

// Le banc de réponses se colle juste sous la barre d'onglets. Cette barre
// n'a pas de hauteur fixe : elle passe sur deux lignes en écran étroit et

// ── REPRISE:début — greffé par build/greffe_reprise.py ──
// L'élève ouvre le module, s'arrête, retourne à sa fiche, puis revient ici.
// Sans mémoire locale il repartait de la première section avec tout effacé :
// l'état vit dans des variables JavaScript, et le serveur ne garde que des
// compteurs (zonesDone, firstTry…), jamais les réponses elles-mêmes. On garde
// donc l'avancement dans le navigateur, une clé par élève et par module.
const RE_CLE = MODULE_SLUG + ':' + (studentCode || 'anonyme') + ':etat';
const RE_VERSION = 1;
let reMinuteur = null;
let reGel = false;   // vrai pendant la restauration : on n'écrase pas la sauvegarde

// Les réponses écrites vivent dans le DOM, pas dans S : on les relève à part.
function reChamps(){
  const out = {};
  document.querySelectorAll('.winput, textarea').forEach((el, i) => {
    if (el.value) out[el.id || ('champ' + i)] = el.value;
  });
  return out;
}

function reEtat(){
  return {
    v: RE_VERSION, quand: Date.now(), curSec: curSec,
    pl: S.pl, vfSel: S.vfSel, fb: S.fb,
    vocabPairs: S.vocabPairs, vocabOrder: S.vocabOrder,
    attempts: TR.attempts, correct: TR.correct,
    champs: reChamps(),
  };
}

function reEcrire(){
  try { localStorage.setItem(RE_CLE, JSON.stringify(reEtat())); } catch(e) {}
}

// render() est appelé à chaque clic : on regroupe les écritures.
function reSauver(){
  if (reGel) return;
  clearTimeout(reMinuteur);
  reMinuteur = setTimeout(reEcrire, 300);
}

function reEffacer(){
  clearTimeout(reMinuteur);
  try { localStorage.removeItem(RE_CLE); } catch(e) {}
}

function reLire(){
  try {
    const d = JSON.parse(localStorage.getItem(RE_CLE) || 'null');
    return (d && d.v === RE_VERSION) ? d : null;
  } catch(e) { return null; }
}

function reprendre(){
  const d = reLire();
  if (!d) return null;
  reGel = true;
  S.pl = d.pl || {};
  S.vfSel = d.vfSel || {};
  S.fb = d.fb || {};
  if (d.vocabPairs) S.vocabPairs = d.vocabPairs;
  if (d.vocabOrder) S.vocabOrder = d.vocabOrder;
  TR.attempts = d.attempts || {};
  TR.correct = d.correct || {};
  // Une section disparue depuis la dernière visite ne doit pas bloquer
  // l'ouverture ; la greffe des sections peut encore déplacer l'élève si
  // celle-ci a été refermée par l'enseignant.
  if (d.curSec && SECTIONS.some(s => s.id === d.curSec)) curSec = d.curSec;
  const champs = d.champs || {};
  document.querySelectorAll('.winput, textarea').forEach((el, i) => {
    const val = champs[el.id || ('champ' + i)];
    if (val != null) el.value = val;
  });
  if (typeof peCount === 'function') peCount();
  reGel = false;
  return d;
}

// Une réponse écrite déjà validée reste verte — et verrouillée quand la bonne
// réponse était connue d'avance, comme au moment de la validation.
function reMarquerEcrits(){
  EXOS.filter(e => e.type === 'write').forEach(ex => {
    ex.items.forEach((it, i) => {
      if (!TR.correct['w_' + ex.id + '_' + i]) return;
      const inp = document.getElementById('wi_' + ex.id + '_' + i);
      if (!inp) return;
      inp.classList.add('good');
      if (it.accept) inp.disabled = true;
    });
  });
}

// Le pointage des vrai/faux est recalculé : on ne réaffiche le total qu'aux
// exercices que l'élève avait réellement corrigés (S.fb rempli partout).
function reMarquerVf(){
  EXOS.filter(e => e.type === 'vf').forEach(ex => {
    const repondu = ex.rows.filter(r => S.vfSel[r.id]).length;
    if (!repondu) return;
    const corrige = ex.rows.every(r => S.fb[r.id]);
    updateVfScore(ex, corrige);
    if (!corrige) return;
    const bons = ex.rows.filter(r => S.vfSel[r.id] === r.ok).length;
    const sum = document.getElementById('vfsum-' + ex.id);
    if (sum) {
      sum.className = 'vf-summary ok';
      sum.textContent = bons + ' / ' + ex.rows.length + ' bonnes réponses';
    }
  });
}

function reQuand(ms){
  if (Date.now() - ms < 3600e3) return 'il y a moins d’une heure';
  const j = new Date(ms);
  const h = String(j.getHours()).padStart(2, '0') + ' h ' + String(j.getMinutes()).padStart(2, '0');
  if (j.toDateString() === new Date().toDateString()) return 'plus tôt aujourd’hui, à ' + h;
  const mois = ['janvier','février','mars','avril','mai','juin','juillet',
                'août','septembre','octobre','novembre','décembre'];
  return 'le ' + j.getDate() + ' ' + mois[j.getMonth()] + ', à ' + h;
}

// La reprise ne doit jamais être une prison : le bouton remet tout à zéro.
function reBanniere(d){
  const chrome = document.getElementById('chrome');
  if (!chrome || !chrome.parentNode) return;
  const el = document.createElement('div');
  el.id = 're-banniere';
  el.setAttribute('role', 'status');
  const n = Object.keys(TR.correct).length;
  el.innerHTML = '<span class="re-txt">↩︎ Tu reprends où tu étais : '
    + (n ? n + ' réponse' + (n > 1 ? 's' : '') + ' déjà juste' + (n > 1 ? 's' : '')
         : 'ton travail est retrouvé')
    + '.<span class="re-quand">Dernier passage ' + reQuand(d.quand) + '.</span></span>'
    + '<button type="button" id="re-recommencer">↺ Recommencer le module</button>'
    + '<button type="button" id="re-fermer" aria-label="Masquer ce message">✕</button>';
  chrome.parentNode.insertBefore(el, chrome.nextSibling);
  document.getElementById('re-recommencer').addEventListener('click', () => {
    if (!confirm('Recommencer le module depuis le début ? Tes réponses seront effacées.')) return;
    reGel = true;   // le rechargement ne doit pas réécrire ce qu'on vient d'effacer
    reEffacer();
    location.reload();
  });
  document.getElementById('re-fermer').addEventListener('click', () => el.remove());
}

// Les champs de texte ne passent pas par render() : ils se sauvent seuls.
document.addEventListener('input', e => {
  const t = e.target;
  if (t && (t.tagName === 'TEXTAREA' || t.classList.contains('winput'))) reSauver();
});
// Onglet fermé : on écrit tout de suite au lieu d'attendre la temporisation.
addEventListener('pagehide', () => { if (!reGel) reEcrire(); });

// ── REPRISE:fin ──
// ── GO ────────────────────────────────────────────────────────────────
buildStatic();
/* REPRISE-GO:début — greffé par build/greffe_reprise.py */
const reReprise = reprendre();
/* REPRISE-GO:fin */
render();
/* REPRISE-MARQUES:début — greffé par build/greffe_reprise.py */
if (reReprise) { reMarquerEcrits(); reMarquerVf(); reBanniere(reReprise); }
/* REPRISE-MARQUES:fin */
measureChrome();
lmsTrack('file_opened');
</script>

<script>
(function () {
  var ACTIVITE = 42;

  function joli(iso) {
    if (!iso) return '';
    var p = iso.split('-');
    var mois = ['janvier','février','mars','avril','mai','juin','juillet',
                'août','septembre','octobre','novembre','décembre'];
    return Number(p[2]) + ' ' + mois[Number(p[1]) - 1];
  }

  function avis(texte) {
    var el = document.getElementById('verrou-avis');
    if (!el) {
      var tabs = document.getElementById('tabs');
      if (!tabs || !tabs.parentNode) return;
      el = document.createElement('p');
      el.id = 'verrou-avis';
      tabs.parentNode.insertBefore(el, tabs.nextSibling);
    }
    el.textContent = texte;
    el.hidden = !texte;
  }

  function appliquer(sections) {
    var parId = {};
    sections.forEach(function (s) { parId[s.id] = s; });

    SECTIONS.forEach(function (sec) {
      var etat = parId[sec.id];
      var bouton = document.getElementById('tab-' + sec.id);
      if (!bouton || !etat) return;
      var fermee = !etat.ouverte;
      bouton.classList.toggle('verrouillee', fermee);
      bouton.setAttribute('aria-disabled', fermee ? 'true' : 'false');
      var chk = bouton.querySelector('.tchk');
      if (chk && fermee) chk.textContent = '🔒';
      bouton.title = fermee
        ? (etat.datePrevue ? 'Cette partie s’ouvre le ' + joli(etat.datePrevue)
                           : 'Cette partie n’est pas encore ouverte.')
        : '';
    });

    // Capture : l'écouteur du module est posé sur le bouton lui-même, il faut
    // donc arrêter le clic avant lui plutôt qu'après.
    var tabs = document.getElementById('tabs');
    if (tabs && !tabs.dataset.verrou) {
      tabs.dataset.verrou = '1';
      tabs.addEventListener('click', function (e) {
        var b = e.target.closest ? e.target.closest('.tab') : null;
        if (!b || !b.classList.contains('verrouillee')) return;
        e.stopPropagation();
        e.preventDefault();
        avis(b.title || 'Cette partie n’est pas encore ouverte.');
      }, true);
    }

    var ouvertes = sections.filter(function (s) { return s.ouverte; });
    if (!ouvertes.length) {
      avis('Aucune partie de ce module n’est ouverte pour l’instant. '
           + 'Ton enseignante les ouvrira une à une.');
      return;
    }
    var courante = parId[curSec];
    if (courante && !courante.ouverte) {
      curSec = ouvertes[0].id;
      avis('Cette partie n’est pas encore ouverte : voici celle que tu peux faire.');
    }
    if (typeof render === 'function') render();
  }

  function demarrer() {
    if (typeof SECTIONS === 'undefined' || typeof curSec === 'undefined') return;
    var code = (typeof studentCode !== 'undefined' && studentCode) || '';
    if (!code) return;   // hors session : le module s'ouvre en entier
    fetch('/api/student/sections?code=' + encodeURIComponent(code)
          + '&activityId=' + ACTIVITE)
      .then(function (r) { return r.ok ? r.json() : null; })
      .then(function (d) {
        if (d && d.decoupe && d.sections && d.sections.length) appliquer(d.sections);
      })
      .catch(function () { /* serveur muet : on n'enlève rien à l'élève */ });
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', demarrer);
  } else {
    demarrer();
  }
})();
</script>

<script>
(function () {
  'use strict';

  /* Ce que le module sait de l'adresse : le code de l'élève et le numéro de
     l'activité. Sans les deux, on ne rapporte rien — un module ouvert par
     double-clic ne doit pas essayer de parler à un serveur. */
  function contexte() {
    try {
      var p = new URLSearchParams(window.parent.location.search);
      var code = p.get('code');
      var id = parseInt(p.get('activityId'), 10);
      if (!code || !id) return null;
      return { code: code, activityId: id, title: p.get('title') || '' };
    } catch (e) { return null; }
  }

  var CTX = contexte();
  if (!CTX) return;

  function exoDe(exId) {
    try { return EXOS.find(function (e) { return e.id === exId; }) || null; }
    catch (e) { return null; }
  }

  /* L'étiquette visible d'une réponse du banc. `cv` d'une zone de placement est
     un identifiant ; l'enseignante a besoin des mots. */
  function etiquetteBanc(ex, id) {
    if (!ex || !ex.bank) return '';
    var b = ex.bank.find(function (t) { return t.id === id; });
    return b ? String(b.l || '') : '';
  }

  /* L'énoncé de la zone, pris là où le module le tient déjà — jamais recopié
     dans une table à tenir à jour. */
  function enonceDe(ex, zid, z) {
    if (!ex) return '';
    try {
      if (ex.type === 'vf' || ex.type === 'match' || ex.type === 'imgmatch'
          || ex.type === 'rows' || ex.type === 'texte') {
        var r = (ex.rows || []).find(function (x) { return x.id === zid; });
        if (r) return String(r.txt || r.q || r.l || '').replace(/<[^>]+>/g, '');
      }
      if (ex.type === 'blanks') {
        return (ex.segs || []).map(function (s) {
          return s.k === 'b' ? ' ____ ' : String(s.t || '');
        }).join('').replace(/\s+/g, ' ').trim();
      }
      if (ex.type === 'write') {
        var i = parseInt(String(zid).split('_').pop(), 10);
        var it = (ex.items || [])[i];
        if (it) return String(it.q || '').replace(/<[^>]+>/g, '');
      }
    } catch (e) {}
    return '';
  }

  /* La réponse donnée et la bonne réponse, dans les mots que l'enseignante lit.
     Rendre une chaîne vide pour `bonne` suffit à ce que le serveur jette le
     texte : c'est la garantie que porte une réponse ouverte. */
  function reponseDe(ex, zid, z) {
    var vide = { reponse: '', bonne: '' };
    if (!ex) return vide;
    try {
      if (ex.type === 'write') {
        var i = parseInt(String(zid).split('_').pop(), 10);
        var it = (ex.items || [])[i];
        var inp = document.getElementById('wi_' + ex.id + '_' + i);
        // Sans `accept`, c'est l'assistant qui corrige : rien ne monte.
        if (!it || !it.accept || !it.accept.length) return vide;
        return { reponse: inp ? String(inp.value || '').trim() : '',
                 bonne: String(it.accept[0] || '') };
      }
      // Une image ne se compte pas en mots : on garde le juste/faux et on
      // laisse tomber la répartition, qui n'aurait rien à afficher.
      if (ex.type === 'imgmatch') return vide;
      if (z && (z.zcat === 'vf' || z.zcat === 'lbl')) {
        var choix = (S.pl[zid] && S.pl[zid].lbl) || S.vfSel[zid] || '';
        return { reponse: String(choix), bonne: String(z.cv || '') };
      }
      if (z) {
        var mis = (S.pl[zid] && S.pl[zid].lbl) || etiquetteBanc(ex, S.pl[zid] && S.pl[zid].iid);
        return { reponse: String(mis || ''), bonne: etiquetteBanc(ex, z.cv) };
      }
    } catch (e) {}
    return vide;
  }

  function rapporter(zid, ok) {
    var z = null;
    try { z = ZONES[zid] || null; } catch (e) {}
    var ex = exoDe(z ? z.exo : null);
    var r = reponseDe(ex, zid, z);
    var essais = 0;
    try { essais = TR.attempts[zid] || 0; } catch (e) {}
    var corps = {
      code: CTX.code, activityId: CTX.activityId, activityTitle: CTX.title,
      event: 'zone_repondue',
      zone: zid,
      exo: (ex && ex.id) || (z && z.exo) || '',
      exoNum: (ex && ex.num) || '',
      exoTitre: (ex && ex.tit) || '',
      section: (ex && ex.sec) || '',
      type: (ex && ex.type) || '',
      enonce: enonceDe(ex, zid, z),
      bonne: r.bonne,
      reponse: r.reponse,
      ok: !!ok,
      essais: essais
    };
    fetch('/api/student/progress', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(corps)
    }).catch(function () {});
  }

  /* L'enveloppe. Elle ne se pose qu'une fois, et jamais avant que le module ait
     déclaré sa fonction — d'où l'attente du chargement complet. */
  function envelopper() {
    if (typeof window.trackPlacement !== 'function') return false;
    if (window.trackPlacement.__direct) return true;
    var origine = window.trackPlacement;
    var enveloppe = function (zid, ok) {
      var sortie = origine.apply(this, arguments);
      // Le rapport ne doit jamais empêcher l'exercice de se corriger : ce que
      // l'élève voit passe avant ce que l'enseignante voit.
      try { rapporter(zid, ok); } catch (e) {}
      return sortie;
    };
    enveloppe.__direct = true;
    window.trackPlacement = enveloppe;
    return true;
  }

  function departer() {
    if (envelopper()) return;
    // Un module dont le script n'a pas encore tourné : on repasse, sans
    // s'acharner.
    var restes = 20;
    var iv = setInterval(function () {
      if (envelopper() || --restes <= 0) clearInterval(iv);
    }, 250);
  }

  if (document.readyState === 'loading')
    document.addEventListener('DOMContentLoaded', departer);
  else departer();
})();
</script>

.depot-mot {
  margin-top: 12px; padding: 10px 14px; border-radius: 10px;
  background: #f1f3f6; border-left: 4px solid #9aa3af;
  font-size: 14px; line-height: 1.5; color: #35404f;
}
</style>
<script>
(function () {
  'use strict';

  /* ── Ce que le module devient sans assistant ─────────────────────────── */

  function note(texte) {
    var d = document.createElement('div');
    d.className = 'sans-ia-mot';
    d.textContent = texte;
    return d;
  }

  /* ── Le dépôt de la voix ─────────────────────────────────────────────
     Rien à voir avec l'assistant : c'est ce que le centre accepte de
     conserver. Une voix identifie une personne même sous pseudo, et une
     direction peut refuser qu'on la garde — soit en entier, soit en n'en
     gardant que la transcription. */

  function motDepot(texte) {
    var d = document.createElement('div');
    d.className = 'depot-mot';
    d.textContent = texte;
    return d;
  }

  /* Le mot va AVANT la zone d'envoi et non dedans : la zone est cachée dans
     un cas sur deux, et un mot caché avec elle ne serait jamais lu. */
  function poserMotDepot(texte) {
    var zone = document.getElementById('poSend');
    if (!zone || !zone.parentNode) return;
    if (zone.parentNode.querySelector('.depot-mot')) return;
    zone.parentNode.insertBefore(motDepot(texte), zone);
  }

  function fermerDepot(muet) {
    document.body.classList.add('depot-ferme');
    if (muet) return;      /* module ouvert hors du portail : rien à expliquer */
    poserMotDepot("Ton école ne reçoit pas les enregistrements. Écoute-toi, "
      + "puis montre ton travail à ton enseignant en classe.");
  }

  /* L'élève a le droit de savoir ce qui est gardé de lui. C'est la moitié
     du dossier qui ne s'écrit pas dans le code, et elle tient en une
     phrase. */
  function direDepotSansVoix() {
    poserMotDepot("Ton enseignant recevra ce que tu as dit, écrit en mots. "
      + "Ta voix, elle, n'est pas conservée.");
  }

  /* Production orale — l'envoi n'attend plus une rétroaction qui ne viendra
     pas. Dès qu'il y a un enregistrement, le bouton est là. */
  function replierOral() {
    var btn = document.getElementById('poFbBtn');
    if (btn) btn.style.display = 'none';
    var prev = document.getElementById('poPrev');
    if (prev && !prev.querySelector('.sans-ia-mot')) {
      /* Le mot ne parle plus de transcription : elle dépend du navigateur, pas
         de nous, et `poPasDeTranscription()` le précisera si elle manque. */
      prev.appendChild(note("Écoute-toi, puis envoie ton enregistrement à ton "
        + "enseignant."));
    }
    if (typeof stopRec === 'function') {
      var orig = stopRec;
      stopRec = function () {
        var r = orig.apply(this, arguments);
        var zone = document.getElementById('poSend');
        if (zone) zone.style.display = 'flex';
        if (typeof recStep === 'function') recStep(3);
        return r;
      };
    }
  }

  /* Production écrite — le dépôt est ouvert tout de suite, et il part sans
     commentaire : `peSend` lit le champ, pas une correction. L'enseignant
     reçoit le texte tel que l'élève l'a écrit. */
  function replierEcrit() {
    var btn = document.getElementById('peBtn');
    if (btn) btn.style.display = 'none';
    var zone = document.getElementById('peSend');
    if (zone) zone.style.display = 'flex';
    var champ = document.getElementById('peText');
    var carte = champ && champ.closest('.card');
    if (carte && zone && !carte.querySelector('.sans-ia-mot')) {
      zone.parentNode.insertBefore(
        note("Relis ton message, puis envoie-le à ton enseignant. "
           + "C'est lui qui te le corrigera."), zone);
    }
  }

  /* Jeu de rôle — seule la moitié « avec l'assistant » tombe. Ce qui précède
     le séparateur est l'activité de classe : les situations, les sujets à
     couvrir, le rappel de grammaire, et parfois des fiches à découper. Les
     78 modules à jeu de rôle en ont tous, et ça ne doit rien à l'IA.

     Deux corrections indispensables une fois l'assistant parti. D'abord la
     phrase d'ouverture, qui le promet dans 77 modules sur 78 : la laisser,
     c'est annoncer à l'élève quelque chose qui n'arrivera pas. Ensuite le mot
     qui explique ce que devient l'exercice — et il ne peut pas parler de
     fiches à imprimer, puisqu'un seul module en a. */
  function replierJeuDeRole() {
    var depart = document.getElementById('jrStart');
    if (!depart) return;
    var carte = depart.closest('.card') || depart.parentElement;
    var sep = carte && carte.querySelector('.jr-sep');
    if (!sep) { carte.style.display = 'none'; return; }

    var fiches = null;
    for (var n = sep; n; ) {
      var suivant = n.nextElementSibling;
      n.style.display = 'none';
      n = suivant;
    }
    fiches = carte.querySelector('.jr-print');
    var aDesFiches = !!(fiches && fiches.style.display !== 'none');

    /* On ne réécrit aucune phrase : on retire celles qui ne sont plus vraies.
       Un « bloc de texte » est un élément dont les enfants sont tous en ligne
       (gras, italique, saut de ligne). Se limiter aux feuilles ne suffisait
       pas : la phrase d'ouverture porte presque toujours un <b>, et elle
       restait affichée dans les 77 modules qu'il fallait corriger. Un bloc
       qui contient d'autres blocs, lui, n'est jamais retiré — il emporterait
       les situations avec lui. */
    var mort = /assistant/i;
    var EN_LIGNE = /^(B|I|EM|STRONG|SPAN|BR|A|CODE|SMALL|U|SUP|SUB)$/;
    [].slice.call(carte.querySelectorAll('p, div, span, li')).forEach(function (e) {
      if (e.classList.contains('sans-ia-mot')) return;
      if (!mort.test(e.textContent || '')) return;
      for (var i = 0; i < e.children.length; i++)
        if (!EN_LIGNE.test(e.children[i].tagName)) return;
      e.style.display = 'none';
    });

    var tete = carte.querySelector('.c-hdr');
    var mot = note(aDesFiches
      ? "Cet entraînement se fait à deux, en classe, avec les fiches à imprimer."
      : "Cet entraînement se fait à deux, en classe : la situation et les sujets "
        + "à couvrir sont ci-dessous.");
    if (tete && tete.nextSibling) carte.insertBefore(mot, tete.nextSibling);
    else carte.insertBefore(mot, sep);
  }

  /* Aide après erreurs — « Pourquoi je me trompe ? » part, « Revoir
     l'explication » reste : une mini-leçon est du texte écrit d'avance. Un
     panneau qui n'aurait plus que « Plus tard » à offrir est un reproche, pas
     une aide : on le retire au lieu de l'afficher vide. */
  function replierAide() {
    if (typeof analyserErreurs === 'function') analyserErreurs = function () {};
    if (typeof proposerAide !== 'function') return;
    var orig = proposerAide;
    proposerAide = function (exId) {
      var r = orig.apply(this, arguments);
      var el = document.getElementById('aide-' + exId);
      if (!el) return r;
      var ia = el.querySelector('button[onclick^="analyserErreurs"]');
      if (ia) ia.remove();
      var reste = el.querySelector('.aide-btns button[onclick^="accepterAide"]');
      if (!reste) el.remove();
      return r;
    };
  }

  /* Exercices écrits — la correction par comparaison de chaînes (`it.accept`)
     n'a jamais rien eu d'une IA : elle reste, telle quelle. Seule la réponse
     ouverte change : plus d'appel, et la réponse attendue après deux essais,
     le même rythme que la version avec assistant. */
  function replierExercicesEcrits() {
    if (typeof checkWrite !== 'function' || typeof EXOS === 'undefined') return;
    var orig = checkWrite;
    var essais = {};
    checkWrite = function (exId, i) {
      var ex = EXOS.find(function (e) { return e.id === exId; });
      if (!ex) return;
      var it = ex.items[i];
      /* `cles` se juge entièrement dans la page : le mode sans IA doit donc
         le laisser passer au moteur, comme `accept`. Sans cette ligne, un
         item à termes-clés ne pouvait JAMAIS être validé ici — la greffe
         répondait « relis ta phrase » quoi que l'élève écrive. */
      if (it && (it.accept || it.cles)) return orig.apply(this, arguments);

      var inp = document.getElementById('wi_' + exId + '_' + i);
      var fb = document.getElementById('wf_' + exId + '_' + i);
      if (!inp || !fb) return;
      var val = (inp.value || '').trim();
      if (!val) { fb.className = 'wfb no'; fb.textContent = "✏️ Écris ta réponse d'abord."; return; }

      var k = exId + '_' + i;
      var n = essais[k] = (essais[k] || 0) + 1;
      var attendu = (it && it.hint) || '';

      if (!attendu) {
        /* Rien à comparer et personne pour lire : le dire franchement vaut
           mieux qu'un ✅ qui ne vérifie rien. */
        fb.className = 'wfb';
        fb.innerHTML = "📝 Ta réponse est notée. Vous la corrigerez en classe.";
        if (typeof trackPlacement === 'function') trackPlacement('w_' + exId + '_' + i, false);
        return;
      }

      /* WSOL et WFB appartiennent à la greffe « deux essais » : quand elle est
         là, on s'en sert pour que « Montrez-moi la réponse » se comporte
         exactement comme dans l'autre version. */
      if (typeof WSOL !== 'undefined') WSOL[k] = attendu;
      if (typeof WFB !== 'undefined') WFB[k] = '';

      /* Sans assistant, la seule chose qu'on savait faire était refuser : quoi
         que l'élève écrive, « relis ta phrase », puis la réponse et l'ordre de
         la recopier. Aucune question ouverte n'était donc réussissable dans un
         centre qui refuse l'IA — 222 items du cours. La comparaison par mots de
         contenu, elle, n'a besoin de personne : elle vit dans la page. */
      if (typeof couvre === 'function' && typeof reponseAttendue === 'function'
          && reponseAttendue(it) && couvre(reponseAttendue(it), val) >= COUV_MIN) {
        fb.className = 'wfb ok';
        fb.innerHTML = "✅ Bravo, c'est exact !";
        inp.classList.add('good');
        if (typeof trackPlacement === 'function') trackPlacement('w_' + exId + '_' + i, true);
        return;
      }

      fb.className = 'wfb no';
      if (n < 2 && typeof wBoutonReponse === 'function') {
        fb.innerHTML = "💡 Relis ta phrase et vérifie chaque mot."
                     + wBoutonReponse(exId, i);
      } else {
        fb.innerHTML = "💡 <b>La réponse attendue :</b> "
                     + (typeof esc === 'function' ? esc(attendu) : attendu)
                     + '<br><span style="font-weight:600">Compare-la avec la tienne, '
                     + 'puis écris-la à ta façon.</span>';
      }
      if (typeof trackPlacement === 'function') trackPlacement('w_' + exId + '_' + i, false);
      if (typeof evaluerAide === 'function') {
        var rates = ex.items.reduce(function (s, _, j) {
          return s + (essais[exId + '_' + j] || 0);
        }, 0);
        evaluerAide(exId, rates);
      }
    };
  }

  /* La barre « Mes outils » porte la plus grosse part d'IA du module :
     traduire, simplifier, demander. Elle sait se replier elle-même — elle est
     partagée par les 87 modules, et la règle doit vivre à un seul endroit. */
  function replierOutils() {
    if (window.Outils && typeof Outils.sansIA === 'function') Outils.sansIA();
  }

  function replier() {
    document.body.classList.add('sans-ia');
    window.MODE_IA = false;
    replierOral();
    replierEcrit();
    replierJeuDeRole();
    replierAide();
    replierExercicesEcrits();
    replierOutils();
  }

  /* ── La question, posée une seule fois ───────────────────────────────── */

  async function demander() {
    var code = (typeof studentCode !== 'undefined' && studentCode) ? studentCode : '';
    try {
      var res = await fetch('/api/student/ia?code=' + encodeURIComponent(code));
      var data = await res.json();
      /* Une panne de réseau ne coupe rien : les routes IA sont gardées côté
         serveur de toute façon, et replier sur un délai d'attente ferait
         clignoter le module d'une classe à l'autre. */
      if (data && data.ia === false) replier();
      /* La voix, elle, va dans l'autre sens. Ce flux-là ne traverse pas notre
         serveur — le navigateur parle directement à son éditeur — donc rien
         ne le rattrape à l'arrivée. La page part confinée, et seule une
         réponse explicite « souple » la relâche : un silence, une panne ou un
         module ouvert hors du portail gardent la voix sur l'appareil. */
      if (data && data.voixStricte === false) window.RECO_STRICTE = false;
      /* Le dépôt passe APRÈS `replier()`, et l'ordre n'est pas cosmétique :
         le repli sans assistant OUVRE la zone d'envoi, puisqu'il n'y a plus
         de rétroaction à attendre avant d'envoyer. Dans l'ordre inverse, un
         centre fermé se ferait rouvrir par le repli. */
      if (data && data.depot === 'ferme') fermerDepot(data.raison === 'code inconnu');
      else if (data && data.depot === 'transcription') direDepotSansVoix();
    } catch (e) { /* on laisse le module tel quel */ }
  }

  /* On passe APRÈS l'initialisation de la barre d'outils, qui se fait au
     chargement du module : sinon il n'y aurait encore rien à retirer. */
  function departer() { setTimeout(demander, 0); }
  if (document.readyState === 'loading')
    document.addEventListener('DOMContentLoaded', departer);
  else departer();
})();
</script>
<!-- SANS-IA:fin -->
<!-- TRANSCRIPTION:début — greffé par build/greffe_transcription.py -->
<script>
(function () {
  var OUVERTE = true;      // le défaut : on n'enlève rien à l'élève
  var NOTE = 'Ton enseignante a fermé la transcription : écoute le dialogue.';

  /* Les deux endroits où un module montre le texte d'un dialogue :
     — la section de mise en situation, bouton « Lire la transcription » et
       bloc `#script-<sectionId>` ;
     — un exercice bâti sur un dialogue, avec son `<details>` « Afficher le
       texte du dialogue ».
     Les deux sont redessinés à chaque `render()`, donc on repasse après lui
     plutôt que de nettoyer une fois. */
  function retirer() {
    if (OUVERTE) return;
    var boutons = document.querySelectorAll(
      'button[onclick^="toggleScript"], [onclick^="toggleScript"]');
    for (var i = 0; i < boutons.length; i++) {
      var b = boutons[i];
      var note = document.createElement('span');
      note.className = 'transcription-fermee';
      note.textContent = NOTE;
      note.style.cssText = 'font-size:13px;font-weight:700;color:var(--ink-500,'
        + '#64748b);align-self:center';
      b.parentNode.replaceChild(note, b);
    }
    // Le bloc de texte lui-même, et le `<details>` des exercices.
    var textes = document.querySelectorAll('.dial-txt');
    for (var j = 0; j < textes.length; j++) {
      var t = textes[j];
      var det = t.closest ? t.closest('details') : null;
      var mort = det || t;
      if (det) {
        var note2 = document.createElement('div');
        note2.className = 'transcription-fermee';
        note2.style.cssText = 'font-size:13px;font-weight:700;margin-bottom:12px;'
          + 'color:var(--ink-500,#64748b)';
        note2.textContent = NOTE;
        mort.parentNode.replaceChild(note2, mort);
      } else {
        mort.parentNode.removeChild(mort);
      }
    }
  }

  /* Ceinture : si un bouton nous échappe, il ne doit rien ouvrir. */
  if (typeof window.toggleScript === 'function') {
    var toggleOrig = window.toggleScript;
    window.toggleScript = function () {
      if (!OUVERTE) return;
      return toggleOrig.apply(this, arguments);
    };
  }

  function surveiller() {
    if (typeof render === 'function') {
      var rendreOrig = render;
      render = function () {
        var r = rendreOrig.apply(this, arguments);
        retirer();
        return r;
      };
    }
    retirer();
  }

  function demarrer() {
    var code = (typeof studentCode !== 'undefined' && studentCode) || '';
    if (!code) return;   // hors session : le module s'ouvre en entier
    fetch('/api/student/sections?code=' + encodeURIComponent(code)
          + '&activityId=' + 42)
      .then(function (r) { return r.ok ? r.json() : null; })
      .then(function (d) {
        // `undefined` sur un serveur qui ne connaît pas encore le champ :
        // seul un `false` franc ferme quelque chose.
        if (d && d.transcription === false) { OUVERTE = false; surveiller(); }
      })
      .catch(function () { /* serveur muet : la transcription reste offerte */ });
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', demarrer);
  } else {
    demarrer();
  }
})();
</script>
