   savoir:{h:"› Les mots de l'entretien — à écouter et à répéter", speak:true, rows:[
     ["Ce qu'on redit à chaque nouveau médecin","Un <b>antécédent</b> est un évènement de santé déjà arrivé — une maladie, une opération, une grossesse. On les écrit une fois sur une feuille, et on cesse de les chercher de mémoire.", ["un antécédent"]],
     ["Ce qu'on prend sur vous pour l'analyser","Un <b>prélèvement</b> est le peu de sang ou de liquide qu'on envoie au laboratoire. Ce n'est pas un traitement : c'est une question posée à votre corps.", ["un prélèvement"]],
     ["Le mot qu'on ne choisit pas","Un <b>diagnostic</b> est le nom donné à un problème une fois qu'on a vérifié assez pour l'écrire. Repartir sans diagnostic n'est pas repartir les mains vides : c'est repartir avec un plan.", ["un diagnostic"]],
     ["Un résultat, pas une cause","Une <b>anémie</b> dit que le sang transporte l'oxygène moins bien qu'il le devrait. Le mot décrit ce qu'on observe ; il ne dit pas pourquoi, et c'est le pourquoi qu'on cherche ensuite.", ["une anémie"]],
     ["Ce qui rend une réponse utile","« Je suis fatiguée » ne se travaille pas. « Avant, je montais douze marches en parlant ; là, j'arrête de parler » se travaille. Un <b>changement</b> daté vaut dix adjectifs."],
   ]},
   rows:[
    {id:'v21', txt:"La docteure Charest préfère entendre l'histoire de la bouche de Leyla, même si elle a le dossier.", ok:'VRAI'},
    {id:'v22', txt:"La fatigue de Leyla a commencé le mois où son fils a déménagé à Québec.", ok:'VRAI'},
    {id:'v23', txt:"Selon la docteure, une anémie légère indique déjà la cause du problème.", ok:'FAUX'},
    {id:'v24', txt:"La docteure refuse de dire si c'est grave et explique pourquoi elle refuse.", ok:'VRAI'},
    {id:'v25', txt:"Elle demande à Leyla de tenir un relevé pendant six semaines.", ok:'VRAI'},
    {id:'v26', txt:"Le laboratoire est au troisième étage, à côté du bureau.", ok:'FAUX'},
    {id:'v27', txt:"C'est la docteure Charest qui décidera d'un arrêt de travail.", ok:'FAUX'},
    {id:'v28', txt:"Le compte rendu sera envoyé au médecin de famille de Leyla.", ok:'VRAI'},
   ]},

  {sec:'t2', id:'t2precis', type:'match', num:'Exercice 2', tit:'Ce qui se travaille et ce qui ne se travaille pas', color:'#B45309',
   sub:"À gauche, ce qu'on dit d'habitude. Va chercher à droite la version que la spécialiste peut utiliser.",
   bankLbl:"La version utilisable", zonePh:'glisse la réponse ici',
   savoir:{h:"› Rendre une plainte utilisable en trois réflexes", rows:[
     ["Un repère de temps plutôt qu'une durée floue","<span class='savoir-ex'>Depuis un bout de temps ❌ · Depuis février, le mois où mon fils est parti ✔</span> Accrochez le début à un évènement dont vous vous souvenez : c'est plus juste qu'une date devinée."],
     ["Un changement plutôt qu'un état","On ne compare pas votre fatigue à celle des autres : on la compare à la vôtre d'avant. <span class='savoir-ex'>Je suis fatiguée ❌ · Vers dix heures, il faut que je m'assoie ; avant, je ne m'assoyais pas ✔</span>"],
     ["Une scène plutôt qu'un adjectif","<span class='savoir-ex'>Je manque de souffle ❌ · Chez madame Turcotte, il y a douze marches, et avant je les montais en parlant ✔</span> Une scène se vérifie, se refait dans six semaines, se compare."],
     ["Ce qu'il ne faut surtout pas faire","Minimiser. « Ce n'est pas si pire », « je ne veux pas déranger », « il y a plus malade que moi » : la personne devant vous n'a que ce que vous dites. Vous ne dérangez pas, vous êtes le rendez-vous."],
     ["Et si le mot manque","Décrivez au lieu de chercher. <span class='savoir-ex'>Je ne connais pas le mot, mais c'est comme quand on se lève trop vite.</span> Un professionnel a l'habitude ; c'est même ce qu'il préfère entendre."],
   ]},
   rows:[
    {id:'pr1', q:"« Je suis fatiguée. »", aid:'pr1', a:"« Vers dix heures, il faut que je m'assoie ; avant, je ne m'assoyais pas. »"},
    {id:'pr2', q:"« Ça fait un bout de temps. »", aid:'pr2', a:"« Depuis février, le mois où mon fils a déménagé. »"},
    {id:'pr3', q:"« Je manque de souffle. »", aid:'pr3', a:"« Je montais douze marches en parlant ; maintenant, j'arrête de parler. »"},
    {id:'pr4', q:"« Je ne prends rien. »", aid:'pr4', a:"« Rien d'ordonnance, mais des vitamines tous les jours l'hiver. »"},
    {id:'pr5', q:"« Des fois ça va, des fois ça va moins. »", aid:'pr5', a:"« Le samedi est meilleur ; les autres jours se ressemblent. »"},
    {id:'pr6', q:"« Ce n'est pas si pire, il y a plus malade que moi. »", aid:'pr6', a:"« Ça dure depuis huit mois et ça change ma façon de travailler. »"},
   ]},

  {sec:'t2', id:'t2inf', type:'write', num:'Exercice 3', tit:'Le petit mot avant le verbe à l\'infinitif', color:'#B45309', cols:1,
   sub:"Complète avec « de », « d' », « à » ou « quoi ». Un seul mot par trou.",
   savoir:{h:"› Ce qui s'accroche à un verbe avant un infinitif", rows:[
     ["Trois façons de continuer une phrase","Certains verbes appellent <b>de</b>, d'autres <b>à</b>, d'autres rien du tout. <span class='savoir-ex'>Elle demande <b>de</b> noter · Elle commence <b>à</b> comprendre · Elle veut savoir</span> Ce n'est pas une règle, c'est une habitude par verbe : on les apprend avec le verbe, jamais séparément."],
     ["Ceux de la consultation qui demandent « de »","<b>demander de · essayer de · arrêter de · éviter de · accepter de · oublier de · finir de · permettre de</b>. <span class='savoir-ex'>J'ai arrêté <b>de</b> monter l'escalier en parlant.</span>"],
     ["Ceux qui demandent « à »","<b>commencer à · continuer à · apprendre à · aider à · réussir à · hésiter à · se mettre à</b>. <span class='savoir-ex'>Je commence <b>à</b> comprendre ce qu'elle cherche.</span>"],
     ["Ceux qui ne demandent rien","<b>vouloir · pouvoir · devoir · falloir · savoir · aller · venir · préférer · espérer</b>. <span class='savoir-ex'>Je dois passer d'autres prélèvements.</span> Y glisser un « de » est la faute la plus fréquente à ce niveau."],
     ["La question qui entre dans la phrase","Après <b>savoir</b>, <b>demander</b>, <b>se demander</b>, on peut poser une question sans point d'interrogation, avec un mot interrogatif et un infinitif. <span class='savoir-ex'>Je ne sais pas <b>quoi</b> répondre. · Je ne sais pas <b>comment</b> le dire.</span> C'est <b>quoi</b>, jamais « que »."],
     ["Devant une voyelle","<b>de</b> devient <b>d'</b> : <span class='savoir-ex'>elle a évité <b>d'</b>en parler · j'ai oublié <b>d'</b>apporter la feuille</span>. « à » ne change jamais."],
   ]},
   items:[
    {q:"La docteure lui a demandé ___ noter ses journées pendant six semaines.", accept:["de"], ph:"un seul mot"},
    {q:"Depuis le printemps, elle commence ___ monter les escaliers plus lentement.", accept:["à","a"], ph:"…"},
    {q:"Elle a arrêté ___ parler en montant, sans même s'en rendre compte.", accept:["de"], ph:"…"},
    {q:"Elle ne savait pas ___ répondre quand on lui a demandé une moyenne.", accept:["quoi"], ph:"une question sans point d'interrogation"},
    {q:"Il faudrait éviter ___ oublier les résultats faits ailleurs.", accept:["d'"], ph:"attention à l'apostrophe"},
    {q:"Elle a réussi ___ dire ce qui avait changé, et pas seulement ce qu'elle ressentait.", accept:["à","a"], ph:"…"},
    {q:"Gilles a aidé sa femme ___ tenir jusqu'au rendez-vous.", accept:["à","a"], ph:"…"},
    {q:"Elle hésitait ___ demander une attestation, et elle l'a fait quand même.", accept:["à","a"], ph:"…"},
   ]},

  {sec:'t2', id:'t2ou', type:'write', num:'Exercice 4', tit:'Le mot « où », pour un lieu et pour un moment', color:'#B45309', cols:1,
   sub:"Relie les deux phrases avec « où ». Écris seulement le groupe de mots demandé entre parenthèses.",
   savoir:{h:"› Le pronom relatif « où » : un lieu, mais aussi un temps", rows:[
     ["Ce qu'il fait","Il colle une phrase entière à un nom, sans répéter le nom. <span class='savoir-ex'>Le laboratoire est au rez-de-chaussée. Vous êtes entrée là ce matin. → Le laboratoire est au rez-de-chaussée, <b>où</b> vous êtes entrée ce matin.</span>"],
     ["Il ne sert pas qu'aux endroits","Il relie aussi un <b>moment</b> — et c'est l'emploi que le français parlé oublie. <span class='savoir-ex'>le jour <b>où</b> j'aurai les résultats · le mois <b>où</b> mon fils est parti · l'année <b>où</b> elle est arrivée · au moment <b>où</b> on l'a appelée</span>"],
     ["Ce qu'il ne faut pas mettre à la place","Ni « quand », ni « que ». <span class='savoir-ex'>Le jour quand j'aurai les résultats ❌ · Le jour que j'aurai les résultats ❌ · Le jour <b>où</b> j'aurai les résultats ✔</span> « Quand » commence une phrase, il ne s'accroche pas à un nom."],
     ["L'accent n'est pas décoratif","<b>où</b> avec l'accent relie ; <b>ou</b> sans accent sépare deux possibilités. <span class='savoir-ex'>la salle <b>où</b> j'attends · le lundi <b>ou</b> le jeudi</span> Remplacez par « ou bien » : si la phrase tient, c'est celui sans accent."],
     ["Pourquoi il compte au niveau 6","Il permet de dire en une phrase ce qui en prendrait deux, et un récit fait de phrases courtes juxtaposées se suit mal. <span class='savoir-ex'>Février est le mois <b>où</b> tout a commencé.</span>"],
   ]},
   items:[
    {q:"Février est le mois. Sa fatigue a commencé ce mois-là. → Février est le mois ___ sa fatigue a commencé. (le mot qui relie)", accept:["où"], ph:"un seul mot, avec l'accent"},
    {q:"Le laboratoire est au rez-de-chaussée. Elle est entrée là ce matin. → Le laboratoire est au rez-de-chaussée, ___ elle est entrée ce matin.", accept:["où"], ph:"…"},
    {q:"Elle rappellera le jour. Elle aura les résultats ce jour-là. → Elle rappellera le jour ___ elle aura les résultats.", accept:["où"], ph:"…"},
    {q:"C'est la seule salle. On peut y parler à quelqu'un. → C'est la seule salle ___ on peut parler à quelqu'un.", accept:["où"], ph:"…"},
    {q:"Choisis entre les deux : « Elle vient le lundi ___ le jeudi. »", accept:["ou"], ph:"celui-là n'a pas d'accent"},
    {q:"Choisis entre les deux : « L'année ___ elle est arrivée, il neigeait en mai. »", accept:["où"], ph:"…"},
    {q:"Choisis entre les deux : « Au moment ___ on l'a appelée, elle parlait avec Gilles. »", accept:["où"], ph:"…"},
    {q:"Choisis entre les deux : « Apportez la feuille ___ envoyez-la par la poste. »", accept:["ou"], ph:"…"},
   ]},

  {sec:'t2', id:'t2subj', type:'write', num:'Exercice 5', tit:'Quand une consigne n\'est pas une suggestion', color:'#B45309', cols:1,
   sub:"La première phrase dit qui veut quoi. Écris le verbe entre parenthèses comme il se met après « que ».",
   savoir:{h:"› Le subjonctif des consignes qu'on reçoit", rows:[
     ["Quand il apparaît","Après un verbe de volonté, d'obligation, de souhait ou de crainte, suivi de <b>que</b>. <span class='savoir-ex'>Il faut <b>que</b> vous <b>passiez</b> d'autres prélèvements.</span> Ce n'est pas un fait : c'est ce que quelqu'un veut qu'il arrive."],
     ["Les verbes introducteurs de cette consultation","<b>il faut que · il faudrait que · j'aimerais que · je voudrais que · il vaut mieux que · je préfère que · je crains que · exiger que</b>. C'est le verbe qui déclenche la forme, pas le sujet de la phrase."],
     ["Comment on le forme","On part de la 3e personne du pluriel du présent, on enlève <b>-ent</b>, on ajoute <b>-e, -es, -e, -ions, -iez, -ent</b>. <span class='savoir-ex'>ils not<s>ent</s> → que je not<b>e</b>, que vous not<b>iez</b></span>"],
     ["Cinq irréguliers, et ils suffisent","<b>être</b> → que je sois · <b>avoir</b> → que j'aie · <b>aller</b> → que j'aille · <b>faire</b> → que je fasse · <b>pouvoir</b> → que je puisse."],
     ["Le piège de politesse","« Il faudrait que » sonne plus doux que « il faut que », mais engage la même chose. Un professionnel qui adoucit sa consigne ne la retire pas — et c'est exactement là qu'un adulte croit avoir le choix."],
     ["« de » ou « que » — deux constructions à ne pas mélanger","Après <b>que</b>, un subjonctif ; après <b>de</b>, un infinitif. <span class='savoir-ex'>Elle demande <b>que</b> vous <b>notiez</b> vos journées. · Elle demande <b>de</b> <b>noter</b> vos journées.</span>"],
   ]},
   items:[
    {q:"La docteure ne le présente pas comme un choix. Il faut que vous ___ d'autres prélèvements. (passer)", accept:["passiez"], ph:"vous, au subjonctif"},
    {q:"C'est la seule chose qu'elle demande à Leyla de faire elle-même. Elle aimerait que vous ___ vos journées pendant six semaines. (noter)", accept:["notiez"], ph:"…"},
    {q:"Le relevé ne sert à rien s'il s'arrête au bout d'une semaine. Il vaut mieux qu'il ___ court et régulier. (être)", accept:["soit"], ph:"un verbe irrégulier"},
    {q:"Sans la feuille du laboratoire privé, le rendez-vous ne servirait à rien. Il faut que Leyla ___ ses résultats. (apporter)", accept:["apporte"], ph:"…"},
    {q:"Le secrétariat ne rejoint personne qui ne répond pas. Il faudrait qu'elle ___ joignable en avant-midi. (être)", accept:["soit"], ph:"un verbe irrégulier"},
    {q:"C'est le médecin de famille qui décide de la suite. Elle préfère que vous ___ la voir avec le compte rendu. (aller)", accept:["alliez"], ph:"un verbe irrégulier"},
    {q:"Gilles s'inquiète pour sa femme. Il craint qu'elle ___ tout à la dernière minute. (faire)", accept:["fasse"], ph:"un verbe irrégulier"},
    {q:"Personne ne doit repartir sans savoir la suite. Il faut que chacun ___ dire ce qui arrive ensuite. (pouvoir)", accept:["puisse"], ph:"un verbe irrégulier"},
   ]},

  {sec:'t2', id:'t2exempl', type:'write', num:'Exercice 6', tit:'Donner un exemple, et le dire', color:'#B45309', cols:2,
   sub:"Un connecteur différent à chaque phrase : aucun ne sert deux fois.",
   savoir:{h:"› Les mots qui annoncent un exemple", rows:[
     ["À quoi ils servent","Une explication sans exemple ne se retient pas, et un exemple sans annonce se prend pour la règle. <span class='savoir-ex'>Notez ce qui a changé, <b>par exemple</b> l'heure où vous devez vous asseoir.</span>"],
     ["Les plus courants","<b>par exemple</b> (partout) · <b>comme</b> (dans la phrase, sans virgule) · <b>notamment</b> (un peu plus écrit) · <b>entre autres</b> (quand la liste est longue) · <b>ainsi</b> (au début d'une phrase, plus formel)."],
     ["Où on les place","<b>par exemple</b> se glisse à peu près partout, entre virgules. <b>comme</b> se colle au nom : <span class='savoir-ex'>un examen <b>comme</b> une échographie</span>. <b>ainsi</b> ouvre la phrase suivante : <span class='savoir-ex'>Tout se note. <b>Ainsi</b>, l'heure du lever compte.</span>"],
     ["Ne pas confondre avec « c'est-à-dire »","Un exemple donne <b>un cas parmi d'autres</b> ; « c'est-à-dire » redit la <b>même</b> chose autrement. <span class='savoir-ex'>des examens, <b>par exemple</b> une prise de sang</span> · <span class='savoir-ex'>une anémie, <b>c'est-à-dire</b> un sang qui transporte moins bien l'oxygène</span>"],
     ["Le réflexe à prendre en consultation","Chaque fois que vous employez un adjectif — fatiguée, essoufflée, étourdie —, ajoutez « par exemple » et une scène. C'est ce qui transforme une plainte en renseignement."],
   ]},
   items:[
    {q:"Notez ce qui a changé, ___ l'heure où vous devez vous asseoir.", accept:["par exemple"], ph:"deux mots, le plus courant"},
    {q:"Certains examens se font sans rendez-vous, ___ une prise de sang.", accept:["comme"], ph:"un seul mot, collé au nom"},
    {q:"Apportez tout ce qui vient d'ailleurs, ___ les résultats d'un laboratoire privé.", accept:["notamment"], ph:"un seul mot, plus écrit"},
    {q:"Le feuillet répond à plusieurs questions, ___ celle des heures de visite.", accept:["entre autres"], ph:"deux mots"},
    {q:"Tout ce qui se prend compte. ___ , les vitamines de l'hiver comptent aussi.", accept:["Ainsi","ainsi"], ph:"un seul mot, en début de phrase"},
    {q:"Elle a une anémie légère, ___ un sang qui transporte moins bien l'oxygène.", accept:["c'est-à-dire"], ph:"ce n'est pas un exemple : c'est la même chose autrement"},
   ]},

 // ── DÉFI 3 · CE QUI S'ÉCRIT APRÈS ───────────────────────────
  {sec:'t3', id:'t3feuillet', type:'texte', num:'Exercice 1', tit:"Ce que dit le feuillet d'information", color:'#3B49A0',
   sub:"Choisis une question, puis clique dans le texte le passage qui y répond.",
   savoir:{h:"› Les mots de l'écrit qui reste — à écouter et à répéter", speak:true, rows:[
     ["La feuille qui explique la marche à suivre","Un <b>feuillet d'information</b> n'explique pas une maladie : il explique comment ça se passe ici, ce qu'on apporte et à qui on téléphone. Il ne parle pas de vous, et c'est pour ça qu'on peut le garder des années.", ["un feuillet d'information"]],
     ["Ce qu'un traitement fait en plus","Les <b>effets secondaires</b> sont ce qu'un traitement produit en dehors de ce qu'on lui demande. La consigne, partout, est la même : les signaler à l'équipe plutôt que de les endurer en silence.", ["les effets secondaires"]],
     ["Ce qui est prévu après","Un <b>suivi</b> dit qui rappelle, quand, et ce qu'il faut avoir fait d'ici là. Un suivi sans date écrite est une intention ; sur papier, c'est un engagement.", ["un suivi"]],
     ["Trois mots à chercher sur n'importe quel feuillet","<b>avant</b>, <b>après</b>, et un <b>numéro de téléphone</b>. Ce sont les trois seules parties qui vous demandent quelque chose ; le reste est là pour vous rassurer."],
     ["Où le ranger","À la vue. Un feuillet rangé dans un tiroir avec les garanties d'électroménagers ne sera jamais relu, et il sera introuvable le soir où la question se pose."],
   ]},
   paras:[
     "Hôpital de la Baie-Ronde — Clinique externe de médecine interne. Ce feuillet n'explique aucune maladie : il explique comment se passe un rendez-vous ici et ce qu'on vous remet en sortant. [[garder|Gardez-le à la vue, sur le réfrigérateur ou dans votre sac]], et non dans un tiroir.",
     "Avant votre rendez-vous. [[apporter|Apportez votre carte d'assurance maladie, votre lettre de convocation et la liste de tout ce que vous prenez]], y compris ce qui s'achète sans ordonnance. [[questions|Écrivez vos questions sur une feuille la veille]] : une fois assis, personne ne s'en souvient.",
     "Pendant. On vous posera des questions sur ce qui a changé et depuis quand. [[repeter|Demandez qu'on vous répète ou qu'on vous explique un mot, autant de fois qu'il le faut]] ; le temps du rendez-vous le prévoit.",
     "Après. On vous remet une enveloppe. Elle contient le compte rendu envoyé à votre médecin de famille et, s'il y a lieu, les demandes d'examens. [[copie|La copie du compte rendu vous appartient : vous pouvez l'annoter et y écrire votre nom]].",
     "Si quelque chose ne va pas comme prévu. [[effets|Un effet secondaire, une réaction, un doute sur une consigne : cela se dit à l'équipe et ne s'endure pas seul]]. [[numero|Le numéro de la liaison est le 418 555-0142, poste 2210, du lundi au vendredi]].",
   ],
   rows:[
    {id:'fq1', q:"Où le feuillet demande-t-il d'être rangé ?", ok:'garder'},
    {id:'fq2', q:"Quels trois papiers faut-il avoir avec soi ?", ok:'apporter'},
    {id:'fq3', q:"Que faut-il préparer la veille ?", ok:'questions'},
    {id:'fq4', q:"Qu'est-ce qui est permis pendant le rendez-vous, autant de fois qu'il le faut ?", ok:'repeter'},
    {id:'fq5', q:"À qui appartient la copie du compte rendu ?", ok:'copie'},
    {id:'fq6', q:"Que faire d'un effet secondaire ou d'un doute ?", ok:'effets'},
    {id:'fq7', q:"Quand peut-on joindre la liaison, et à quel poste ?", ok:'numero'},
   ]},

  {sec:'t3', id:'t3compte', type:'texte', num:'Exercice 2', tit:'Le compte rendu de consultation', color:'#3B49A0',
   sub:"Une lettre d'une médecin à une autre, dont vous avez la copie. Choisis une question, puis clique le passage qui y répond.",
   savoir:{h:"› Lire une lettre qui n'est pas écrite pour vous", rows:[
     ["À qui elle s'adresse","Un <b>compte rendu de consultation</b> va du spécialiste au médecin qui a fait la demande. Vous n'en êtes pas le destinataire : vous en avez la copie parce que c'est votre dossier. Les mots savants ne sont donc pas une impolitesse, ils sont une langue de métier."],
     ["Elle a toujours le même ordre","En-tête et date · à qui elle est adressée · qui est vu et pourquoi · ce que la personne a raconté · ce qui a été observé · ce qui est proposé · ce qui reste à décider. Repérez ces sept parties et le reste se lit tout seul."],
     ["Le paragraphe qui vous concerne vraiment","Celui de la <b>conduite proposée</b>, souvent présenté par des tirets. Si vous ne lisez qu'une partie de la lettre, lisez celle-là : c'est la seule qui vous demande quelque chose."],
     ["Un futur qui ne parle pas de l'avenir","« La patiente sera revue » n'est pas une possibilité : c'est une décision, écrite au futur parce que c'est ainsi que l'administration écrit une obligation. Demandez alors qui doit bouger, et quand."],
     ["Ce qu'une lettre honnête contient toujours","Ce qu'on ne sait pas. <span class='savoir-ex'>d'étiologie à préciser · aucun diagnostic retenu à ce stade</span> Ces formules ne sont pas une dérobade : elles disent que la recherche continue, et elles vous protègent d'un mot posé trop vite."],
   ]},
   paras:[
     "Hôpital de la Baie-Ronde — Clinique externe de médecine interne. [[objet|Compte rendu de consultation]] — dossier 6-41-0288. Rimouski, le 12 novembre 2026. À l'attention de la docteure Hélène Grondin, médecin de famille.",
     "Chère consœur, votre patiente, madame Leyla Demirci, 41 ans, aide à domicile, a été vue ce jour à la suite de votre demande du 9 avril. [[motif|Motif de la consultation : fatigue persistante d'apparition progressive, évoluant depuis février]].",
     "La patiente rapporte [[change|une réduction de sa tolérance à l'effort : elle interrompt la conversation en montant un escalier de douze marches, ce qui est nouveau]], ainsi que la nécessité de s'asseoir en milieu d'avant-midi. [[anemie|Le bilan de mars montrait une anémie légère, d'étiologie à préciser]].",
     "Conduite proposée : [[plan|de nouveaux prélèvements, un relevé quotidien tenu par la patiente pendant six semaines, puis une réévaluation à la réception des résultats]]. [[revue|La patiente sera revue à la clinique externe]] ; notre secrétariat communiquera avec elle.",
     "[[nuance|Aucun diagnostic n'est retenu à ce stade]]. Je vous transmettrai les résultats dès leur réception. Veuillez agréer, chère consœur, l'expression de mes salutations cordiales. Sylvine Charest, interniste.",

function lmsTrack(event, data) {
  try { window.parent.postMessage(Object.assign({lms:true, event:event}, data||{}), '*'); } catch(e) {}
  try {
    const up = new URLSearchParams(window.parent.location.search);
    const code = up.get('code'), actId = parseInt(up.get('activityId'))||null, title = up.get('title')||'';
    if (code && actId) {
      fetch('/api/student/progress', {
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify(Object.assign({code, activityId:actId, activityTitle:title, event}, data||{})),
      }).catch(()=>{});
    }
  } catch(e2) {}
}
const TR = {attempts:{}, correct:{}};
function trackPlacement(zid, ok) {
  if (ok && !TR.correct[zid]) {
    TR.correct[zid] = true;
    if (!(zid in TR.attempts)) TR.attempts[zid] = 0;
    const zonesDone = Object.keys(TR.correct).length;
    const firstTry = Object.keys(TR.correct).filter(k => (TR.attempts[k]||0)===0).length;
    const totalErrors = Object.keys(TR.attempts).reduce((s,k)=>s+(TR.attempts[k]||0),0);
    lmsTrack('exercise_completed', {zones:TOTAL_ZONES, zonesDone, firstTry, totalErrors});
  } else if (!ok && !TR.correct[zid]) {
    TR.attempts[zid] = (TR.attempts[zid]||0) + 1;
  }
  updateChip();
}

/* VITESSE-VOIX:début — greffé par build/greffe_vitesse.py */
/* Le débit des MP3 est figé à la production ; celui de la lecture ne l'est
   pas. `playbackRate` étire le son sans le régénérer — et `preservesPitch`
   empêche la voix de descendre dans les graves en ralentissant, ce qui la
   rendrait plus difficile à comprendre, pas plus facile. Le choix suit
   l'élève d'un module à l'autre : celui qui a besoin de lent en a besoin
   partout. */
const VIT_CRANS = [
  {v:1,    lbl:'Débit normal'},
  {v:0.8,  lbl:'Débit lent'},
  {v:0.65, lbl:'Débit très lent'},
];
let vitCran = 0;
try{ vitCran = Math.min(2, Math.max(0, parseInt(localStorage.getItem('saaf-vitesse'),10) || 0)); }catch(e){}
const vitFacteur = ()=> VIT_CRANS[vitCran].v;
/* Le facteur d'un `Audio`, posé à la création — et reposé sur celui qui joue
   déjà, pour que le réglage s'entende tout de suite plutôt qu'au prochain
   extrait. */
function vitAudio(a){
  if(!a) return a;
  try{ a.preservesPitch = a.mozPreservesPitch = a.webkitPreservesPitch = true; }catch(e){}
  try{ a.playbackRate = vitFacteur(); }catch(e){}
  return a;
}
/* Les replis en synthèse vocale ont leur propre échelle de débit : le facteur
   s'y multiplie au lieu de s'y substituer, sinon le repli parlerait plus vite
   que le MP3 qu'il remplace. */
const vitTaux = base => Math.max(0.1, base * vitFacteur());
function vitAppliquer(){
  const b = document.getElementById('btn-vitesse');
  if(b){ b.textContent = VIT_CRANS[vitCran].lbl; b.setAttribute('data-cran', String(vitCran)); }
  if(typeof dlgAudio !== 'undefined' && dlgAudio) vitAudio(dlgAudio);
  if(typeof jrAudio !== 'undefined' && jrAudio) vitAudio(jrAudio);
}
document.addEventListener('DOMContentLoaded', ()=>{
  const b = document.getElementById('btn-vitesse');
  if(!b) return;
  b.addEventListener('click', ()=>{
    vitCran = (vitCran + 1) % VIT_CRANS.length;
    try{ localStorage.setItem('saaf-vitesse', String(vitCran)); }catch(e){}
    vitAppliquer();
  });
  vitAppliquer();
});
/* VITESSE-VOIX:fin */
function playAudioQueue(urls, idx, btn, dialId, allowFallback){
  if(idx>=urls.length){ finishDialogue(btn,dialId); return; }
  dlgAudio=vitAudio(new Audio(urls[idx]));
  dlgUsingSpeech=false;
  dlgState='playing'; btn.textContent='⏸ Pause';
  dlgAudio.onended=()=>playAudioQueue(urls, idx+1, btn, dialId, false);
  dlgAudio.onerror=()=>{
    if(allowFallback && idx===0){ playSpeechQueue(dlgFallbackLines, btn, dialId); }
    else{ playAudioQueue(urls, idx+1, btn, dialId, false); }
  };
  dlgAudio.play().catch(()=>{ if(allowFallback && idx===0){ playSpeechQueue(dlgFallbackLines, btn, dialId); } });
}
function playSpeechQueue(lines, btn, dialId){
  try{
    speechSynthesis.cancel();
    dlgUsingSpeech=true;
    const voices = speechSynthesis.getVoices();
    const fr = voices.filter(v=>/^fr/i.test(v.lang));
    lines.forEach((l,i)=>{
      const u=new SpeechSynthesisUtterance(l[1]);
      u.lang='fr-CA'; u.rate=vitTaux(0.95); u.pitch=(i%2===0)?1.12:0.9;
      if(fr.length) u.voice=(i%2===0)?fr[0]:(fr[1]||fr[0]);
      speechSynthesis.speak(u);
    });
    dlgState='playing'; btn.textContent='⏸ Pause';
    clearInterval(dlgPollIv);
    dlgPollIv=setInterval(()=>{
      if(!speechSynthesis.speaking){ clearInterval(dlgPollIv); finishDialogue(btn,dialId); }
    },400);
  }catch(e){}
}
function jsq(s){ return String(s).replace(/\\/g,'\\\\').replace(/'/g,"\\'"); }
// ── LECTURE AUDIO D'UN MOT OU D'UNE PHRASE ISOLÉE (synthèse vocale) ────
function speakText(btn, text){
  try{
    speechSynthesis.cancel();
    const old = btn ? btn.innerHTML : null;
    const reset = ()=>{ if(btn){ btn.disabled=false; btn.innerHTML=old; } };
    if(btn){ btn.disabled=true; btn.innerHTML=ICON_SPEAK+' …'; }
    const doSpeak = ()=>{
      try{
        const u=new SpeechSynthesisUtterance(text);
        u.lang='fr-CA'; u.rate=vitTaux(0.9);
        const voices=speechSynthesis.getVoices();
        const fr=voices.find(v=>/^fr/i.test(v.lang));
        if(fr) u.voice=fr;
        u.onend=reset; u.onerror=reset;
        speechSynthesis.speak(u);
        // Filet de sécurité : Chrome laisse parfois speechSynthesis coincé
        // sans jamais déclencher onend/onerror.
        setTimeout(()=>{ if(!speechSynthesis.speaking) reset(); }, 8000);
      }catch(e){ reset(); }
    };
    // Chrome ignore parfois un speak() appelé juste après cancel() dans le
    // même tick : un court délai évite ce bug connu.
    setTimeout(doSpeak, 60);
  }catch(e){}
}
// Essaie un vrai MP3 (assets/interactive/<module>/sons/<fileId>.mp3), retombe
// sur la synthèse vocale si le fichier est absent.
function playWord(btn, text, fileId){
  if(!fileId){ speakText(btn, text); return; }
  const url = `/assets/interactive/${MODULE_SLUG}/sons/${fileId}.mp3?v=${AUDIO_V}`;
  const old = btn ? btn.innerHTML : null;
  const reset = ()=>{ if(btn){ btn.disabled=false; btn.innerHTML=old; } };
  if(btn){ btn.disabled=true; btn.innerHTML=ICON_SPEAK+' …'; }
  const a=vitAudio(new Audio(url));
  a.onended=reset;
  a.onerror=()=>{ reset(); speakText(btn, text); };
  a.play().catch(()=>{ reset(); speakText(btn, text); });
}
// ── VÉRIFICATION DE PRONONCIATION (reconnaissance vocale native, "Je découvre" seulement) ──
function normPron(s){
  return String(s).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9\s]/g,'').replace(/\s+/g,' ').trim();
}
// Certains mots courts sont mal transcrits par la reconnaissance vocale du
// navigateur (nombres écrits en chiffres, homophones) même bien prononcés —
// liste d'équivalences acceptées en plus de la comparaison normale.
const PRON_ALIASES = {
  'treize': ['13'],
  'tot': ['sot','seau','saut','sceau'],
};
function pronMatches(said, target){
  if(said===target || said.includes(target) || target.includes(said)) return true;
  const alts = PRON_ALIASES[target] || [];
  return alts.some(a=>said===a || said.includes(a) || a.includes(said));
}
// RÈGLE (validée par l'utilisateur le 2026-08-03 après test) : un mot isolé
// (surtout une seule syllabe) est toujours plus difficile à reconnaître pour
// le moteur de reconnaissance vocale du navigateur qu'un mot dans une phrase
// avec du contexte. CHAQUE mot demandé en lecture/prononciation isolée doit
// donc être présenté dans une courte phrase, avec le mot cible en gras —
// jamais le mot tout seul. L'élève lit la phrase, mais on vérifie seulement
// que le mot cible apparaît dans ce qui a été entendu (pronMatches fait déjà
// cette vérification par inclusion — aucun changement de logique requis).
// ⚠️ À reproduire dans TOUS les futurs modules dès qu'un mot isolé est
// demandé en prononciation (voir aussi memory: cours-niveau4-modules.md).
const CARRIER_PHRASES = {
  // Une phrase porteuse par mot isolé à prononcer. Un mot envoyé seul à la
  // synthèse sort mal accentué, et parfois lu à l'anglaise. La phrase le
  // remet dans un contexte français ; seul le mot est ensuite découpé.
  //
  // Les clés sont les mots **accentués**, tels qu'ils paraissent dans les
  // listes savoir[…][2] de exos.js. Une clé écrite en slug — « antecedent »

function pronCheck(btn, expected){
  const SRC = window.SpeechRecognition || window.webkitSpeechRecognition;
  let fb = btn.nextElementSibling && btn.nextElementSibling.classList.contains('pron-fb') ? btn.nextElementSibling : null;
  if(!fb){ fb=document.createElement('span'); fb.className='pron-fb'; fb.setAttribute('aria-live','polite'); btn.insertAdjacentElement('afterend', fb); }
  if(!SRC){ fb.className='pron-fb warn'; fb.textContent='Reconnaissance vocale non supportée (utilise Chrome).'; return; }
  const old = btn.innerHTML;
  btn.classList.remove('fb-ok','fb-no');
  btn.disabled=true; btn.innerHTML=ICON_MIC+' …';
  fb.className='pron-fb'; fb.textContent='Écoute en cours…';
  const reset=()=>{ btn.disabled=false; btn.innerHTML=old; };
  const target = normPron(expected);
  let done=false, lastInterim='';
  const rec = new SRC();
  // interimResults:true — les mots très courts ("tôt", "mer"...) sont parfois
  // coupés par la détection de silence avant qu'un résultat final n'arrive ;
  // on garde le dernier résultat provisoire comme filet de secours.
  rec.lang='fr-CA'; rec.interimResults=true; rec.maxAlternatives=1;
  const evaluate=(heard)=>{
    heard=heard.trim();
    const said = normPron(heard);
    const ok = pronMatches(said, target);
    reset();
    btn.classList.add(ok?'fb-ok':'fb-no');
    fb.className='pron-fb '+(ok?'ok':'no');
    fb.textContent = ok ? 'Bien prononcé !' : ('On a entendu : « '+heard+' »');  // ✓/✕ ajoutés par .pron-fb::before
    setTimeout(()=>{ btn.classList.remove('fb-ok','fb-no'); }, 4000);
  };
  rec.onresult=e=>{
    const res=e.results[e.results.length-1];
    if(res.isFinal){ done=true; evaluate(res[0].transcript); }
    else{ lastInterim=res[0].transcript; }
  };
  rec.onerror=e=>{
    if(!done){
      done=true;
      if(lastInterim){ evaluate(lastInterim); return; }
      reset();
      fb.className='pron-fb warn';
      fb.textContent = e.error==='not-allowed' ? 'Micro refusé — autorise l\'accès au micro.' : 'Aucun son détecté, réessaie.';
    }
  };
  // Filet de sécurité : certains navigateurs déclenchent onend sans jamais
  // appeler onresult(final) ni onerror (silence, coupure) — sans ce filet le
  // message restait bloqué sur « Écoute en cours… ». On récupère le dernier
  // résultat provisoire s'il y en a un, plutôt que de déclarer un échec.
  rec.onend=()=>{
    if(!done){
      done=true;
      if(lastInterim){ evaluate(lastInterim); return; }
      reset();
      fb.className='pron-fb warn';
      fb.textContent='Aucun son détecté, réessaie.';
    }
  };
  setTimeout(()=>{
    if(!done){
      done=true;
      try{ rec.stop(); }catch(e){}
      if(lastInterim){ evaluate(lastInterim); return; }
      reset();
      fb.className='pron-fb warn';
      fb.textContent='Aucun son détecté, réessaie.';
    }
  }, 7000);
  try{ rec.start(); }catch(e){ done=true; reset(); fb.className='pron-fb warn'; fb.textContent='Impossible de démarrer le micro.'; }
}

// ── LOGIQUE DE PLACEMENT ──────────────────────────────────────────────
function checkOk(zid, iid, lbl) {
  const z = ZONES[zid];
  if (!z) return false;
  if (z.zcat === 'vf' || z.zcat === 'lbl') return lbl === z.cv;
  return iid === z.cv;
}
function doPlace(zid, iid, lbl, cat, from) {
  if (from === zid) { S.sel = null; render(); return; }
  if (from && from !== zid) { if (S.pl[zid]) S.pl[from] = S.pl[zid]; else delete S.pl[from]; delete S.fb[from]; delete S.fb[zid]; }
  else if (!from && S.pl[zid]) { delete S.pl[zid]; delete S.fb[zid]; }
  S.pl[zid] = {iid, lbl, cat}; S.sel = null;
  const ok = checkOk(zid, iid, lbl);
  S.fb[zid] = ok ? 'ok' : 'no';
  trackPlacement(zid, ok);
  render();
  setTimeout(() => { delete S.fb[zid]; if (!ok) delete S.pl[zid]; render(); }, ok ? 1400 : 850);
}
function zoneClick(zid) {
  if (S.sel) { doPlace(zid, S.sel.iid, S.sel.lbl, S.sel.cat, S.sel.from); }
  else if (S.pl[zid] && !S.fb[zid]) {
    const {iid,lbl,cat} = S.pl[zid];
    delete S.pl[zid]; delete S.fb[zid];
    S.sel = {iid,lbl,cat,from:zid}; render();
  }
}
function tileClick(iid, lbl, cat) {
  if (S.sel && S.sel.iid === iid && !S.sel.from) S.sel = null;
  else S.sel = {iid,lbl,cat,from:null};
  render();
}

// Trois exercices sur la même liste de mots (FC_CARDS), plus la traduction
// en langue maternelle. La seule entrée est la liste de mots : ce bloc est
// le même pour tous les modules, seul fccards.js change.
//
//   1. Le mot et sa définition   — association par clic, six mots à la fois
//   2. Je me souviens du mot     — rappel actif, notation, reprise des ratés

// tiennent leur propre compteur et n'appellent jamais trackPlacement(), qui
// gonflerait le total de l'étoile avec des identifiants inconnus.

const VOC_LANGUES = [
  {c:'ar', n:'arabe',      loc:'العربية',    rtl:true},
  {c:'es', n:'espagnol',   loc:'Español'},
  {c:'uk', n:'ukrainien',  loc:'Українська'},
  {c:'fa', n:'persan',     loc:'فارسی',      rtl:true},
  {c:'zh', n:'chinois (mandarin)', loc:'中文'},
  {c:'pt', n:'portugais',  loc:'Português'},
  {c:'en', n:'anglais',    loc:'English'},
  {c:'ro', n:'roumain',    loc:'Română'},
  {c:'ur', n:'ourdou',     loc:'اردو',       rtl:true},
  {c:'ru', n:'russe',      loc:'Русский'},
  {c:'ti', n:'tigrigna',   loc:'ትግርኛ'},
];
// La langue est choisie une fois et vaut pour tous les modules ; les
// traductions déjà payées sont partagées par tous les élèves de l'appareil.
const VOC_LS_LANGUE = 'francisation-langue';
const VOC_LS_TRAD   = 'francisation-traductions';
const VOC_LS_RAPPEL = 'francisation-rappel-' + MODULE_SLUG;
const VOC_TAILLE_GROUPE = 6;   // exercice 1 : mots montrés à la fois
const VOC_TAILLE_PAQUET = 8;   // exercice 2 : mots par paquet

// Le mode privé de Safari fait lever localStorage : on ne perd que la
// mémoire, jamais l'exercice.
function vocLire(cle, defaut){
  try{ const v = localStorage.getItem(cle); return v===null ? defaut : JSON.parse(v); }
  catch(e){ return defaut; }
}
function vocEcrire(cle, valeur){
  try{ localStorage.setItem(cle, JSON.stringify(valeur)); }catch(e){}
}

function vocLangue(){
  const c = vocLire(VOC_LS_LANGUE, '');
  return VOC_LANGUES.find(l=>l.c===c) || null;
}

// ── LA TRADUCTION ─────────────────────────────────────────────────────
// Masquée par défaut : une traduction visible d'emblée et le français n'est
// plus traité. L'appel part vers le serveur, jamais vers l'API directement —
// la clé Anthropic ne descend pas dans le navigateur.
function vocEmpreinte(texte){
  let h = 5381;
  for(let i=0;i<texte.length;i++) h = ((h*33) ^ texte.charCodeAt(i)) >>> 0;
  return h.toString(36);
}
// La définition entre dans la clé : deux modules peuvent définir le même mot
// autrement, et la traduction de l'un ne doit pas s'afficher chez l'autre.
function vocCle(langue, mot, def){
  return langue + '|' + mot + '|' + vocEmpreinte(def||'');
}
async function vocTraduire(mot, def, exemple){
  const L = vocLangue();
  if(!L) throw new Error('langue');
  const cle = vocCle(L.c, mot, def);
  const cache = vocLire(VOC_LS_TRAD, {});
  if(cache[cle]) return cache[cle];
  const res = await fetch('/api/vocab/translate', {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({code:studentCode, langue:L.n, mot:mot, definition:def, exemple:exemple||''})
  });
  const data = await res.json();
  if(!res.ok) throw new Error(data.error||'indisponible');
  cache[cle] = data;
  vocEcrire(VOC_LS_TRAD, cache);
  return data;
}

let vocTradNo = 0;
// Renvoie le balisage du bouton + du bloc masqué ; vocTradBrancher() pose
// ensuite les écouteurs, une fois le balisage dans la page.
function vocTradBalisage(){
  const id = 'voctr' + (++vocTradNo);
  return {id,
    html:'<div class="vc-actions"><button type="button" class="btn btn-ghost" id="'+id+'-btn">Voir dans ma langue</button></div>'
       + '<div class="voc-tr" id="'+id+'" hidden aria-live="polite"></div>'};
}
function vocTradBrancher(id, mot, def, exemple){
  const btn = document.getElementById(id+'-btn');
  const box = document.getElementById(id);
  if(!btn || !box) return;
  btn.addEventListener('click', async ()=>{
    if(!box.hidden){
      box.hidden = true; btn.textContent = 'Voir dans ma langue'; return;
    }
    const L = vocLangue();
    box.hidden = false; box.removeAttribute('dir');
    if(!L){
      box.innerHTML = '<div class="voc-tr-att">Choisissez d\'abord votre langue, en haut de la section.</div>';
      return;
    }
    box.innerHTML = '<div class="voc-tr-att">Traduction en cours…</div>';
    btn.disabled = true;
    try{
      const t = await vocTraduire(mot, def, exemple);
      if(L.rtl) box.setAttribute('dir','rtl');
      let h = '<div class="voc-tr-mot">'+esc(t.traduction||'')+'</div>';
      if(t.definitionTraduite) h += '<div class="voc-tr-def">'+esc(t.definitionTraduite)+'</div>';
      if(t.exempleTraduit)     h += '<div class="voc-tr-ex">'+esc(t.exempleTraduit)+'</div>';
      h += '<button type="button" class="voc-flag">Signaler une traduction douteuse</button>';
      box.innerHTML = h;
      box.querySelector('.voc-flag').addEventListener('click', function(){ vocSignaler(this, mot, t); });
      btn.textContent = 'Cacher la traduction';
    }catch(e){
      // Message neutre en français : jamais l'erreur brute, hors ligne comprise.
      box.innerHTML = '<div class="voc-tr-att">La traduction n\'est pas disponible pour le moment. Vous pouvez continuer l\'exercice en français.</div>';
    }
    btn.disabled = false;
  });
}
// Les traductions ne sont pas révisées par un humain. Le signalement est
// journalisé côté serveur ; c'est ce qui permettra plus tard une liste revue.
async function vocSignaler(btn, mot, t){
  const L = vocLangue();
  btn.disabled = true;
  btn.textContent = 'Envoi…';
  try{
    const res = await fetch('/api/vocab/signaler', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({code:studentCode, module:MODULE_SLUG, mot:mot,
        langue: L ? L.n : '',
        traduction: [t.traduction, t.definitionTraduite].filter(Boolean).join(' — ')})
    });
    btn.textContent = res.ok ? '✓ Merci, c\'est noté.' : 'Le signalement n\'est pas parti.';
  }catch(e){
    btn.textContent = 'Le signalement n\'est pas parti.';
  }
}

// ── EXERCICE 1 · Le mot et sa définition ──────────────────────────────
// Association par clic en deux colonnes, atteignable au clavier. Six mots à
// la fois : seize définitions d'un coup, personne ne lit jusqu'en bas.
function vocNbGroupes(ex){
  return Math.max(1, Math.ceil(ex.rows.length / VOC_TAILLE_GROUPE));
}
function vocGroupeCourant(ex){
  if(!S.vocabFile){
    S.vocabFile = ex.rows.map((r,i)=>i).sort(()=>Math.random()-.5);
    S.vocabGroupNo = 0;
    S.vocabOrderNo = -1;
  }
  return S.vocabFile.slice(S.vocabGroupNo*VOC_TAILLE_GROUPE,
                          (S.vocabGroupNo+1)*VOC_TAILLE_GROUPE);
}
function renderVocabPairs(){
  const ex = EXOS.find(e=>e.id==='prVocab');
  if(!ex) return;
  const wordsEl = document.getElementById('vocab-words');
  const defsEl  = document.getElementById('vocab-defs');
  if(!wordsEl || !defsEl) return;

  const groupe = vocGroupeCourant(ex);
  // L'ordre des définitions est retiré au sort à chaque groupe : sinon la
  // deuxième reprise se joue de mémoire, par position.
  if(S.vocabOrderNo !== S.vocabGroupNo){
    S.vocabOrder = groupe.slice().sort(()=>Math.random()-.5);
    S.vocabOrderNo = S.vocabGroupNo;
  }

  wordsEl.innerHTML = groupe.map(idx=>{
    const r = ex.rows[idx];
    const done = S.vocabPairs[r.id] !== undefined;
    const cls = 'chip chip-word'+(done?' is-paired':(S.vocabPick===r.id?' is-active':''));
    return '<button type="button" class="'+cls+'" data-w="'+esc(r.id)+'"'+(done?' aria-disabled="true"':'')+'>'+esc(r.q)+'</button>';
  }).join('');
  const takenDefIds = Object.values(S.vocabPairs);
  defsEl.innerHTML = S.vocabOrder.map(idx=>{
    const r = ex.rows[idx];
    const done = takenDefIds.includes(r.aid);
    const cls = 'chip'+(done?' is-paired':(S.fb[r.aid]==='no'?' is-miss':''));
    return '<button type="button" class="'+cls+'" data-d="'+esc(r.aid)+'"'+(done?' aria-disabled="true"':'')+'>'+esc(r.a)+'</button>';
  }).join('');

  wordsEl.querySelectorAll('[data-w]').forEach(b=>b.addEventListener('click',()=>{
    const wid = b.dataset.w;
    if(S.vocabPairs[wid] !== undefined) return;
    S.vocabPick = (S.vocabPick===wid) ? null : wid;
    S.fb = {};
    renderVocabPairs();
  }));
  defsEl.querySelectorAll('[data-d]').forEach(b=>b.addEventListener('click',()=>{
    const did = b.dataset.d;
    if(Object.values(S.vocabPairs).includes(did) || S.vocabPick===null) return;
    const row = ex.rows.find(r=>r.id===S.vocabPick);
    const ok = row && row.aid===did;
    if(ok){ S.vocabPairs[S.vocabPick] = did; S.vocabPick=null; S.fb={}; trackPlacement(row.id, true); }
    else { S.fb[did]='no'; trackPlacement(row?row.id:did, false); }
    renderVocabPairs();
  }));

  const faits = groupe.filter(idx=>S.vocabPairs[ex.rows[idx].id]!==undefined).length;
  const scoreEl = document.getElementById('score-'+ex.id);
  if(scoreEl) scoreEl.textContent = faits+' / '+groupe.length+' associé · groupe '
    + (S.vocabGroupNo+1) + ' sur ' + vocNbGroupes(ex);
}
function vocabAutreGroupe(){
  const ex = EXOS.find(e=>e.id==='prVocab');
  if(!ex) return;
  vocGroupeCourant(ex);
  S.vocabGroupNo = (S.vocabGroupNo + 1) % vocNbGroupes(ex);
  S.vocabOrderNo = -1;
  S.vocabPick = null;
  S.fb = {};
  renderVocabPairs();
  const c = document.getElementById('exo-prVocab');
  if(c) c.scrollIntoView({behavior:'smooth', block:'start'});
}

// ── EXERCICE 2 · Je me souviens du mot ────────────────────────────────
// Rappel actif : le mot seul, puis la réponse, puis l'élève dit s'il savait.
// C'est la seule des trois activités qui fasse vraiment travailler la mémoire.
let VR = {paquet:[], i:0, su:0, revoir:[], revele:false};

// Résultats gardés d'un cours à l'autre : les mots « à revoir » repassent
// devant au prochain tirage.
function vocRappelHisto(){ return vocLire(VOC_LS_RAPPEL, {}); }
function vocRappelNoter(mot, su){
  const h = vocRappelHisto();
  const e = h[mot] || {su:0, revoir:0};
  if(su) e.su++; else e.revoir++;
  e.etat = su ? 'su' : 'revoir';
  e.dernier = new Date().toISOString().slice(0,10);
  h[mot] = e;
  vocEcrire(VOC_LS_RAPPEL, h);
}
function vocRappelTirage(){
  const h = vocRappelHisto();
  const rang = i=>{
    const e = h[FC_CARDS[i].word];
    if(!e) return 1;                    // jamais vu
    return e.etat==='revoir' ? 0 : 2;   // à revoir d'abord, su en dernier
  };
  return FC_CARDS.map((c,i)=>i)
    .sort((a,b)=> (rang(a)-rang(b)) || (Math.random()-.5))
    .slice(0, Math.min(VOC_TAILLE_PAQUET, FC_CARDS.length));
}
function vocRappelDemarrer(indices){
  VR = {paquet: indices && indices.length ? indices : vocRappelTirage(),
        i:0, su:0, revoir:[], revele:false};
  vocRappelRender();
}
function vocRappelRender(){
  const host = document.getElementById('vcRappelBody');
  const scoreEl = document.getElementById('score-vcRappel');
  if(!host) return;

  if(VR.i >= VR.paquet.length){
    const n = VR.revoir.length;
    if(scoreEl) scoreEl.textContent = VR.su+' / '+VR.paquet.length+' su';
    let h = '<div class="vc-bilan">'+(n===0
      ? '✓ Vous avez su les '+VR.paquet.length+' mots du paquet.'
      : (n===1 ? '1 mot reste à revoir.' : n+' mots restent à revoir.'))+'</div>';
    if(n) h += '<div class="vc-bilan-s">'+VR.revoir.map(i=>esc(FC_CARDS[i].word)).join(' · ')+'</div>';
    h += '<div class="vc-actions">';
    if(n) h += '<button type="button" class="btn btn-pri" id="vcReprise">Reprendre les mots à revoir</button>';
    h += '<button type="button" class="btn btn-ghost" id="vcNeuf">Un autre paquet de mots</button></div>';
    host.innerHTML = h;
    const rep = document.getElementById('vcReprise');
    if(rep) rep.addEventListener('click', ()=>vocRappelDemarrer(VR.revoir.slice()));
    document.getElementById('vcNeuf').addEventListener('click', ()=>vocRappelDemarrer(null));
    return;
  }

  const c = FC_CARDS[VR.paquet[VR.i]];
  if(scoreEl) scoreEl.textContent = VR.su+' / '+VR.paquet.length+' su';

  let h = '<div class="vc-carte"><div class="vc-mot">'+esc(c.word)+'</div>';
  if(!VR.revele){
    h += '<div class="vc-q">Que veut dire ce mot ?</div>'
       + '<div class="vc-actions"><button type="button" class="btn btn-pri" id="vcVoir">Voir la réponse</button></div></div>';
    host.innerHTML = h;
    document.getElementById('vcVoir').addEventListener('click', ()=>{ VR.revele = true; vocRappelRender(); });
    return;
  }

  const trad = vocTradBalisage();
  h += '</div><div class="vc-rep">'
     + '<div class="vc-def">'+esc(c.def)+'</div>'
     + '<div class="vc-ex">'+c.ex+'</div>'
     + trad.html
     + '<div class="vc-actions">'
     + '<button type="button" class="vc-note vc-note--su" id="vcSu">✓ Je le savais</button>'
     + '<button type="button" class="vc-note vc-note--revoir" id="vcRevoir">↺ À revoir</button>'
     + '</div></div>';
  host.innerHTML = h;
  vocTradBrancher(trad.id, c.word, c.def, c.ex);
  document.getElementById('vcSu').addEventListener('click', ()=>vocRappelSuivant(true));
  document.getElementById('vcRevoir').addEventListener('click', ()=>vocRappelSuivant(false));
}
function vocRappelSuivant(su){
  const idx = VR.paquet[VR.i];
  vocRappelNoter(FC_CARDS[idx].word, su);
  if(su) VR.su++; else VR.revoir.push(idx);
  VR.i++;
  VR.revele = false;
  vocRappelRender();
}

// ── EXERCICE 3 · Le mot et son image ──────────────────────────────────
// Une photo, trois mots, un seul juste. L'ordre des trois boutons est tiré
// au sort à chaque image : autrement la bonne réponse finit toujours au même
// endroit et l'élève répond à la position, pas au mot.
let VI = {ordre:[], i:0, juste:0, choix:[], repondu:false};

function vocImageMots(){ return FC_CARDS.map((c,i)=>i).filter(i=>FC_CARDS[i].img); }
function vocImageDemarrer(){
  VI = {ordre: vocImageMots().sort(()=>Math.random()-.5), i:0, juste:0, choix:[], repondu:false};
  vocImagePrepare();
}
function vocImagePrepare(){
  VI.repondu = false;
  const bon = VI.ordre[VI.i];
  if(bon === undefined){ VI.choix = []; vocImageRender(); return; }
  const leurres = FC_CARDS.map((c,i)=>i).filter(i=>i!==bon)
    .sort(()=>Math.random()-.5).slice(0,2);
  VI.choix = [bon].concat(leurres).sort(()=>Math.random()-.5);
  vocImageRender();
}
function vocImageRender(){
  const host = document.getElementById('vcImageBody');
  const scoreEl = document.getElementById('score-vcImage');
  if(!host) return;
  if(scoreEl) scoreEl.textContent = VI.juste+' / '+VI.ordre.length+' juste';

  if(VI.i >= VI.ordre.length){
    host.innerHTML = '<div class="vc-bilan">✓ Vous avez fait les '+VI.ordre.length+' images. '
      + VI.juste+' bonne'+(VI.juste>1?'s':'')+' réponse'+(VI.juste>1?'s':'')+'.</div>'
      + '<div class="vc-actions"><button type="button" class="btn btn-ghost" id="vcImgNeuf">Recommencer</button></div>';
    document.getElementById('vcImgNeuf').addEventListener('click', vocImageDemarrer);
    return;
  }

  const bon = VI.ordre[VI.i];
  let h = '<img class="vc-photo" src="'+esc(FC_CARDS[bon].img)+'" alt="Photo à associer à un mot de la liste">'
        + '<div class="vc-choix">'
        + VI.choix.map(i=>'<button type="button" class="choice" data-i="'+i+'">'+esc(FC_CARDS[i].word)+'</button>').join('')
        + '</div><div id="vcImgApres"></div>';
  host.innerHTML = h;
  host.querySelectorAll('.choice').forEach(b=>b.addEventListener('click', ()=>vocImageRepondre(parseInt(b.dataset.i,10))));
}
function vocImageRepondre(choisi){
  if(VI.repondu) return;
  VI.repondu = true;
  const bon = VI.ordre[VI.i];
  const ok = choisi === bon;
  if(ok) VI.juste++;
  // Le glyphe accompagne toujours la couleur — la couleur ne dit rien seule.
  document.querySelectorAll('#vcImageBody .choice').forEach(b=>{
    const i = parseInt(b.dataset.i,10);
    b.setAttribute('aria-disabled','true');
    if(i===bon){ b.classList.add(ok?'is-ok':'is-answer'); b.textContent = (ok?'✓ ':'← ')+FC_CARDS[i].word; }
    else if(i===choisi){ b.classList.add('is-no'); b.textContent = '✗ '+FC_CARDS[i].word; }
  });
  const scoreEl = document.getElementById('score-vcImage');
  if(scoreEl) scoreEl.textContent = VI.juste+' / '+VI.ordre.length+' juste';

  const apres = document.getElementById('vcImgApres');
  const c = FC_CARDS[bon];
  const trad = vocTradBalisage();
  apres.innerHTML = '<div class="vc-rep"><div class="vc-def">'+esc(c.def)+'</div>'
    + '<div class="vc-ex">'+c.ex+'</div>' + trad.html
    + '<div class="vc-actions"><button type="button" class="btn btn-pri" id="vcImgSuite">Une autre image</button></div></div>';
  vocTradBrancher(trad.id, c.word, c.def, c.ex);
  document.getElementById('vcImgSuite').addEventListener('click', ()=>{ VI.i++; vocImagePrepare(); });
}

// ── Exercice « texte » : cliquer dans le texte ────────────────────────
// L'élève arme une question, puis clique le passage qui y répond. Les deux
// gestes sont réversibles : recliquer un passage déjà pris le libère, et
// changer de question n'efface rien. C'est ce qui permet de revenir sur une
// réponse sans tout reprendre, comme dans le vrai-faux.
function txArm(exId, qid){
  S.txQ[exId] = (S.txQ[exId] === qid) ? null : qid;
  render();
}
function txPick(exId, segId){
  const ex = EXOS.find(e => e.id === exId);
  if (!ex) return;
  const qid = S.txQ[exId];
  // Un passage déjà attribué se libère d'un clic, même sans question armée :
  // sinon un élève qui se trompe de segment doit deviner quoi faire.
  const dejaA = Object.keys(S.txSel).find(k => S.txSel[k] === segId
                  && ex.rows.some(r => r.id === k));
  if (dejaA && (!qid || dejaA === qid)) {
    delete S.txSel[dejaA]; delete S.fb[dejaA]; render(); return;
  }
  if (!qid) return;
  if (dejaA) delete S.txSel[dejaA];
  S.txSel[qid] = segId;
  delete S.fb[qid];
  S.txQ[exId] = null;
  render();
}
function txCheckAll(exId){
  const ex = EXOS.find(e => e.id === exId);
  if (!ex) return;
  let repondu = 0, justes = 0;
  ex.rows.forEach(r => {
    const seg = S.txSel[r.id];
    if (!seg) return;
    repondu++;
    const ok = seg === r.ok;
    if (ok) justes++;
    S.fb[r.id] = ok ? 'ok' : 'no';
    S.pl[r.id] = {iid:r.id, lbl:seg, cat:'id'};
    trackPlacement(r.id, ok);
  });
  if (repondu >= ex.rows.length) evaluerAide(exId, repondu - justes);
  const sum = document.getElementById('txsum-'+exId);
  if (sum) {
    if (repondu < ex.rows.length) {
      sum.className = 'vf-summary warn';
      sum.textContent = 'Réponds à toutes les questions avant de corriger ('
        + repondu + ' sur ' + ex.rows.length + ').';
    } else {
      sum.className = 'vf-summary ' + (justes === ex.rows.length ? 'ok' : 'warn');
      sum.textContent = justes + ' bonne(s) réponse(s) sur ' + ex.rows.length + '.';
    }
  }
  render();
}
// Le texte, segments compris. On échappe le texte AVANT de poser les balises :
// un article de journal contient des guillemets et des apostrophes, et un
// module qui les rendrait bruts casserait son propre script.
function txHtml(ex){
  const pris = {};
  ex.rows.forEach(r => { if (S.txSel[r.id]) pris[S.txSel[r.id]] = r.id; });
  return (ex.paras || []).map(p => {
    let out = '', reste = p, m;
    const re = /\[\[([A-Za-z0-9_-]+)\|([\s\S]*?)\]\]/;
    while ((m = re.exec(reste))) {
      out += esc(reste.slice(0, m.index));
      const id = m[1], mots = m[2];
      const qid = pris[id];
      let cls = 'tx-seg';
      if (qid) cls += (S.fb[qid] === 'ok') ? ' ok' : (S.fb[qid] === 'no') ? ' no' : ' is-taken';
      out += '<span class="' + cls + '" role="button" tabindex="0"'
           + ' onclick="txPick(\'' + ex.id + '\',\'' + id + '\')"'
           + ' onkeydown="if(event.key===\'Enter\'||event.key===\' \'){event.preventDefault();'
           + 'txPick(\'' + ex.id + '\',\'' + id + '\')}">' + esc(mots) + '</span>';
      reste = reste.slice(m.index + m[0].length);
    }
    return '<p>' + out + esc(reste) + '</p>';
  }).join('');
}
function txMotDuSegment(ex, segId){
  for (const p of (ex.paras || [])) {
    const m = new RegExp('\\[\\[' + segId + '\\|([\\s\\S]*?)\\]\\]').exec(p);
    if (m) return m[1];
  }
  return segId;
}
function vfSelect(zid, lbl) {
  S.vfSel[zid] = lbl;
  delete S.fb[zid];
  const ex = EXOS.find(e=>e.type==='vf' && e.rows.some(r=>r.id===zid));
  if(ex) updateVfScore(ex, false);
  render();
}
function vfCheckAll(exId) {
  const ex = EXOS.find(e => e.id === exId);
  if (!ex) return;
  let answered = 0, correct = 0;
  ex.rows.forEach(r => {
    const sel = S.vfSel[r.id];
    if (!sel) return;
    answered++;
    const ok = sel === r.ok;
    if (ok) correct++;
    S.fb[r.id] = ok ? 'ok' : 'no';
    S.pl[r.id] = {iid:r.id, lbl:sel, cat:'vf'};
    trackPlacement(r.id, ok);
  });
  // Nombre d'énoncés encore faux à cette correction — pas un cumul : corriger
  // deux fois de suite ne doit pas gonfler artificiellement le compte.
  if (answered >= ex.rows.length) evaluerAide(exId, answered - correct);
  const sumEl = document.getElementById('vfsum-'+exId);
  if (sumEl) {
    if (answered < ex.rows.length) {
      sumEl.className = 'vf-summary warn';
      sumEl.textContent = `Réponds à toutes les phrases avant de corriger (${answered}/${ex.rows.length}).`;
    } else {
      sumEl.className = 'vf-summary ok';
      sumEl.textContent = `${correct} / ${ex.rows.length} bonnes réponses`;
    }
  }
  updateVfScore(ex, answered>=ex.rows.length);
  render();
}

// Rend un élément atteignable au clavier (MIGRATION.md §5) : le clic est
// déjà l'interaction principale (sélection puis dépôt) — Entrée/Espace
// déclenchent le même clic.
function kbdable(el){
  el.setAttribute('role','button'); el.tabIndex=0;
  el.addEventListener('keydown',e=>{ if(e.key===' '||e.key==='Enter'){ e.preventDefault(); el.click(); } });
}
// ── DRAG & DROP ───────────────────────────────────────────────────────
let dd = null;
function drg(el, iid, lbl, cat, from) {
  el.draggable = true;
  el.addEventListener('dragstart', e => { dd = {iid,lbl,cat,from:from||null}; e.dataTransfer.setData('text/plain', JSON.stringify(dd)); e.dataTransfer.effectAllowed='move'; setTimeout(()=>el.style.opacity='.45',0); });
  el.addEventListener('dragend', () => { el.style.opacity=''; dd=null; });
}
function drp(el, zid) {
  el.addEventListener('dragover', e => { e.preventDefault(); el.classList.add('dov'); });
  el.addEventListener('dragleave', () => el.classList.remove('dov'));
  el.addEventListener('drop', e => { e.preventDefault(); el.classList.remove('dov'); let d=dd; if(!d){try{d=JSON.parse(e.dataTransfer.getData('text/plain'))}catch{}} if(!d)return; doPlace(zid, d.iid, d.lbl, d.cat, d.from); dd=null; });
}
let ts=null, ghost=null;
// Sur un téléphone, le doigt posé sur une tuile veut le plus souvent faire
// défiler la page — le banc de réponses occupe la bande du bas, c'est de là
// qu'on pousse l'écran. Prendre tout mouvement pour un glisser confisquait
// ce geste : plus moyen d'atteindre les réponses suivantes, et le moindre
// tremblement transformait une sélection en glisser avorté.
//
// D'où l'appui maintenu, la convention de l'iPhone : on glisse ce qu'on a
// d'abord tenu. Un mouvement immédiat reste un défilement, quelle que soit
// sa direction ; un appui bref sans mouvement reste une sélection ; et
// sélectionner puis toucher la case reste le chemin le plus simple.
const TCH_SEUIL = 12;   // px avant de décider — 8 px, c'était un tremblement
const TCH_TENUE = 250;  // ms d'appui maintenu avant qu'un glisser puisse partir
function tch(el, iid, lbl, cat, from) {
  el.addEventListener('touchstart', e => { const t=e.touches[0]; ts={x:t.clientX,y:t.clientY,t0:Date.now(),iid,lbl,cat,from:from||null,el,moved:false,rendu:false}; }, {passive:true});
}
document.addEventListener('touchmove', e => {
  if(!ts || ts.rendu) return;
  const t=e.touches[0], dx=t.clientX-ts.x, dy=t.clientY-ts.y;
  if(!ts.moved && Math.sqrt(dx*dx+dy*dy)>TCH_SEUIL){
    if((Date.now() - ts.t0) < TCH_TENUE){
      ts.rendu = true;   // parti tout de suite : c'est un défilement
      return;
    }
    ts.moved=true;
    const r=ts.el.getBoundingClientRect();
    ghost=ts.el.cloneNode(true);
    ghost.className=ts.el.className+' ghost'; ghost.style.width=r.width+'px';
    ghost.style.left=(t.clientX-r.width/2)+'px'; ghost.style.top=(t.clientY-r.height/2)+'px';
    document.body.appendChild(ghost);
  }
  if(ts.moved && ghost){ e.preventDefault(); ghost.style.left=(t.clientX-ghost.offsetWidth/2)+'px'; ghost.style.top=(t.clientY-ghost.offsetHeight/2)+'px'; }
}, {passive:false});
document.addEventListener('touchend', e => {
  if(!ts) return;
  if(ts.moved && ghost){
    ghost.remove(); ghost=null;
    const t=e.changedTouches[0];
    const zel=document.elementsFromPoint(t.clientX,t.clientY).find(x=>x.dataset&&x.dataset.zid);
    if(zel) doPlace(zel.dataset.zid, ts.iid, ts.lbl, ts.cat, ts.from);
    e.preventDefault();
  }
  ts=null;
});

// ── HELPERS ───────────────────────────────────────────────────────────
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
// Pastille numérotée carrée devant l'en-tête d'exercice (comme .exo__num du
// modèle je-me-prepare.html) — extrait le chiffre de "Exercice N", sinon •.
function exoNumBadge(numText){
  const m = String(numText).match(/\d+/);
  const label = m ? String(+m[0]).padStart(2,'0') : '•';
  return '<span class="exo-num">'+label+'</span>';
}
// Remplace les suites de "___" par un blanc à souligner distinct du texte,
// pour que les espaces entre les vrais mots restent lisibles (sinon tout
// se lit comme une seule ligne confuse de tirets).
function blankify(q){ return esc(q).replace(/_{3,}/g, '<span class="acc-blank"></span>'); }
function usedIds(){return new Set(Object.values(S.pl).map(p=>p.iid))}
function shuffled(arr, seed){
  const a=arr.slice(); let s=seed||42;
  for(let i=a.length-1;i>0;i--){ s=(s*9301+49297)%233280; const j=Math.floor((s/233280)*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
  return a;
}
function mkZone(zid, extra, placeholder){
  const el=document.createElement('div');
  const placed=S.pl[zid], fb=S.fb[zid], z=ZONES[zid];
  let cls=['zone']; if(extra)cls.push(extra);
  if(fb)cls.push('fb-'+fb);
  else if(placed){
    if(z.zcat==='vf'&&(placed.lbl==='VRAI'||placed.lbl==='FAUX'))cls.push(placed.lbl==='VRAI'?'f-vrai':'f-faux');
    else cls.push('filled');
  } else cls.push('empty');
  el.className=cls.join(' ');
  el.dataset.zid=zid;
  el.textContent=placed?placed.lbl:(placeholder||'déposer ici');
  el.addEventListener('click',()=>zoneClick(zid));
  kbdable(el);
  drp(el,zid);
  if(placed&&!fb){drg(el,placed.iid,placed.lbl,placed.cat,zid);tch(el,placed.iid,placed.lbl,placed.cat,zid)}
  return el;
}
function mkBlank(zid){
  const el=document.createElement('span');
  const placed=S.pl[zid], fb=S.fb[zid];
  let cls=['blank'];
  if(fb)cls.push('fb-'+fb); else if(placed)cls.push('filled');
  el.className=cls.join(' ');
  el.dataset.zid=zid;
  el.textContent=placed?placed.lbl:'…';
  el.addEventListener('click',()=>zoneClick(zid));
  kbdable(el);
  drp(el,zid);
  if(placed&&!fb){drg(el,placed.iid,placed.lbl,placed.cat,zid);tch(el,placed.iid,placed.lbl,placed.cat,zid)}
  return el;
}
// La case vide prend la largeur du mot le plus long du banc, mesuré dans le
// style d'une case remplie : plus étroite, elle couperait la réponse déposée ;
// plus large, elle troue la phrase pour rien. On mesure au lieu de compter les
// lettres — « allons attendre » et « IIIIIIIIIIIIIII » n'ont pas la même
// largeur, et la valeur doit suivre le corps du texte, qui change avec l'écran.
const BLANCS = {};
function calerBlancs(mount, mots){
  const p=document.createElement('span');
  p.className='blank filled';
  p.style.cssText='position:absolute;visibility:hidden;min-width:0;white-space:pre';
  mount.appendChild(p);
  let w=0;
  mots.forEach(function(m){p.textContent=m.l; w=Math.max(w,p.getBoundingClientRect().width)});
  p.remove();
  // Un plancher : sur une liste de mots-outils (« le », « la »), la case
  // deviendrait une fente de 30 px — illisible comme cible de dépôt.
  mount.style.setProperty('--blank-w', Math.max(72, Math.ceil(w))+'px');
}
addEventListener('resize', function(){
  Object.keys(BLANCS).forEach(function(k){
    const b=BLANCS[k];
    if(b.mount.isConnected) calerBlancs(b.mount, b.mots);
  });
});
function mkTile(iid,lbl,cat,cls){
  const t=document.createElement('div');
  t.className='tile '+cls+(S.sel&&S.sel.iid===iid&&!S.sel.from?' sel':'');
  t.textContent=lbl;
  t.addEventListener('click',()=>tileClick(iid,lbl,cat));
  kbdable(t);
  drg(t,iid,lbl,cat,null); tch(t,iid,lbl,cat,null);
  return t;
}
function mkImgTile(im,cat){
  const t=document.createElement('div');
  t.className='imgtile'+(S.sel&&S.sel.iid===im.id&&!S.sel.from?' sel':'');
  t.innerHTML='<img src="'+im.src+'" alt="" loading="lazy">';
  t.addEventListener('click',()=>tileClick(im.id,im.id,cat));
  kbdable(t);
  drg(t,im.id,im.id,cat,null); tch(t,im.id,im.id,cat,null);
  return t;
}
function mkImgZone(zid){
  const el=document.createElement('div');
  const placed=S.pl[zid], fb=S.fb[zid];
  let cls=['imgzone']; if(fb)cls.push('fb-'+fb); else if(placed)cls.push('filled'); else cls.push('empty');
  el.className=cls.join(' ');
  el.dataset.zid=zid;
  if(placed){ const src=(ALL_IMAGES.find(i=>i.id===placed.iid)||{}).src; el.innerHTML=src?'<img src="'+src+'" alt="">':''; }
  else{ el.innerHTML='<span class="imgzone-ph">glissez l\'image ici</span>'; }
  el.addEventListener('click',()=>zoneClick(zid));
  kbdable(el);
  drp(el,zid);
  if(placed&&!fb){drg(el,placed.iid,placed.lbl,placed.cat,zid);tch(el,placed.iid,placed.lbl,placed.cat,zid)}
  return el;
}

// ── CONSTRUCTION DU DOM ───────────────────────────────────────────────
function buildStatic(){
  const tabs=document.getElementById('tabs');
  SECTIONS.forEach(sec=>{
    const b=document.createElement('button');
    b.className='tab'; b.id='tab-'+sec.id;
    b.style.setProperty('--sec-color', sec.color);
    b.innerHTML='<span class="tno">'+sec.no+'</span>'+esc(sec.title)+'<span class="tchk">✓</span>';
    b.addEventListener('click',()=>{curSec=sec.id;render();window.scrollTo({top:0,behavior:'smooth'})});
    tabs.appendChild(b);
  });
  const wrap=document.getElementById('sections');
  SECTIONS.forEach(sec=>{
    const d=document.createElement('div');
    d.className='sec'; d.id='sec-'+sec.id;
    d.style.setProperty('--sec-color', sec.color);
    d.style.setProperty('--sec', sec.color);
    let h='';
    // Bloc unique : mise en situation (gris) → dialogue → vocabulaire associé.
    // Tout est dans le même cadre pour qu'on voie le lien entre le dialogue et
    // son vocabulaire (demande de l'utilisateur, 2026-08-03).
    if(sec.dialogue){
      const dia=DIALOGUES[sec.dialogue];
      const titleParts = dia.label.split('—');
      const dTitle = (titleParts[1]||dia.label).trim();
      h+='<div class="dial-sec"><div class="dial-grid">';
      h+='<div><div class="field-label">La situation</div>';
      h+='<p class="situ">'+sec.intro+'</p>';
      h+='<div class="row" style="display:flex;flex-wrap:wrap;gap:10px;margin-top:14px">';
      h+='<button class="btn-lu btn-audio" onclick="playDialogue(\''+sec.dialogue+'\',this)">'+ICON_SPEAK+' Écouter le dialogue</button>';
      h+='<button class="btn btn-ghost" type="button" onclick="toggleScript(this,\''+sec.id+'\')">Lire la transcription</button>';
      h+='</div></div>';
      h+='<div class="dial-aside"><div class="field-label">Dialogue</div>';
      h+='<div class="dial-aside-tit">'+esc(dTitle)+'</div>';
      h+='<div class="dial-aside-n">'+dia.lines.length+' répliques</div></div>';
      h+='</div>';
      h+='<div class="dial-txt is-hidden" id="script-'+sec.id+'">';
      dia.lines.forEach((l,i)=>{
        const cls=(i%2===0)?'mb':'dr';
        h+='<div class="dl"><span class="'+cls+'">'+esc(l[0])+' :</span> '+esc(l[1])+'</div>';
      });
      h+='</div>';
      if(sec.id==='prep'){
        h+='<div class="vocab-sec"><div style="display:flex;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap">';
        h+='<div class="vocab-tag">Vocabulaire</div>';
        h+='<div style="font-size:15px;font-weight:700;">Les mots de ce dialogue — <span style="font-weight:900;cursor:pointer;text-decoration:underline dotted;" onclick="fcOpen(0)">cartes mémoire</span></div></div>';
        h+='<div class="vocab-grid">';
        FC_CARDS.forEach(c=>{h+='<div class="vw" onclick="fcOpenWord(\''+c.word.replace(/'/g,"\\'")+'\')"><span class="dot"></span><span class="w">'+esc(c.word)+'</span></div>'});
        h+='</div>';
        h+='<button class="btn btn-pri" type="button" id="btnVocabToggle" style="margin-top:12px" onclick="toggleVocabExo()">Apprendre les mots de vocabulaire</button>';
        h+='</div>';
      }
      h+='</div>';
    } else {
      h+='<div class="intro">'+sec.intro+'</div>';
    }
    h+='<div class="exs" id="exs-'+sec.id+'"></div>';
    if(sec.next){
      h+='<div class="cta"><div><div class="cta-eyebrow">Prochaine étape</div>';
      h+='<div class="cta-tit">'+esc(sec.next.tit)+'</div>';
      h+='<div class="cta-sub">'+esc(sec.next.sub)+'</div></div>';
      h+='<button class="btn cta-btn" type="button" onclick="document.getElementById(\'tab-'+sec.next.id+'\').click();window.scrollTo({top:0,behavior:\'smooth\'})">Continuer →</button></div>';
    }
    d.innerHTML=h;
    wrap.appendChild(d);
  });
  // cartes d'exercices (sections à moteur)
  EXOS.forEach(ex=>{
    const host=document.getElementById('exs-'+ex.sec);
    const card=document.createElement('div');
    card.className='card'; card.id='exo-'+ex.id;
    if(ex.accent) card.style.setProperty('--sec-color', ex.accent);
    if(ex.id==='prVocab') card.style.display='none';
    let h='';
    if(ex.savoir){
      h+='<div class="savoir'+(ex.savoir.speak?' savoir--pron':'')+'">'
       + '<div class="savoir-band">'+esc(ex.savoir.h ? ex.savoir.h.replace(/^›\s*/,'') : 'Prononciation')+'</div>';
      ex.savoir.rows.forEach((r,ri)=>{
        // Une rangée qui s'ouvre sur un exemple se colore en entier (étiquette
        // comprise) : c'est ce qui la sépare visuellement d'une règle.
        const rowEx = /^\s*<span class=['"]savoir-ex['"]/.test(r[1]);
        h+='<div class="savoir-row'+(rowEx?' is-ex':'')+'"><div class="savoir-key">'+r[0]+'</div><div class="savoir-val">'+r[1];
        if(ex.savoir.speak && r[2]){
          h+='<div class="word-chips">';
          r[2].forEach((w,wi)=>{
            const fid=ex.id+'_savoir_'+ri+'_'+wi;
            const phrase=CARRIER_PHRASES[w];
            const wcLabel = phrase ? esc(phrase).replace(new RegExp('('+esc(w)+')','i'),'<b>$1</b>') : esc(w);
            h+='<div class="word-chip"><span class="wc-word'+(phrase?' wc-phrase':'')+'">'+wcLabel+'</span>';
            // On lit la phrase porteuse, pas le mot seul : c'est ce que la
            // pastille affiche, et surtout un mot isolé ne donne aucun indice
            // de langue au moteur de synthèse — un mot français bref peut se
            // faire lire à l'anglaise sans le contexte d'une phrase.
            h+='<button class="btn btn-ghost" type="button" onclick="playWord(this,\''+jsq(phrase||w)+'\',\''+fid+'\')" title="Écouter">'+ICON_SPEAK+'</button>';
            h+='<button class="btn btn-ghost" type="button" onclick="pronCheck(this,\''+jsq(w)+'\')" title="Répète le mot à voix haute">'+ICON_MIC+'</button>';
            h+='</div>';
          });
          h+='</div>';
        }
        h+='</div></div>';
      });
      if(PLUS[ex.id]){
        h+='<div class="plus-bar"><button class="plus-open" type="button" onclick="plusOpen(\''+ex.id+'\')">'
         + '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>'
         + 'Ouvrir la mini-leçon</button></div>';
      }
      h+='</div><div class="savoir-gap"></div>';
    }
    // ── Exercice « texte » : un texte suivi, ses questions à côté ──
    if(ex.type==='texte'){
      h+='<div class="c-hdr">'+exoNumBadge(ex.num)+'<span class="tag">'+esc(ex.num)+'</span><span class="exo-score" id="score-'+ex.id+'" aria-live="polite">0 / '+ex.rows.length+' répondu</span><span class="ctit">'+esc(ex.tit)+'</span><span class="csub">'+esc(ex.sub||'Choisissez une question, puis cliquez dans le texte le passage qui y répond.')+'</span></div>';
      h+='<div class="tx-grid"><div class="tx-texte" id="txt-'+ex.id+'"></div>';
      h+='<div id="txq-'+ex.id+'"></div></div>';
      h+='<div style="margin-top:14px;display:flex;align-items:center;gap:12px;flex-wrap:wrap">';
      h+='<button class="btn btn-pri" type="button" onclick="txCheckAll(\''+ex.id+'\')">✓ Corriger</button>';
      h+='<div class="vf-summary" id="txsum-'+ex.id+'" aria-live="polite"></div>';
      h+='</div>';
      card.innerHTML=h; host.appendChild(card); return;
    }
    // ── Exercice Vrai/Faux (ou 2 catégories) — colonnes + bouton Corriger ──
    if(ex.type==='vf'){
      const _vfw=Math.max(72, Math.max.apply(null,ex.tiles.map(function(t){return t.length}))*8.5+28);
      card.style.setProperty('--vfw', _vfw+'px');
      h+='<div class="c-hdr">'+exoNumBadge(ex.num)+'<span class="tag">'+esc(ex.num)+'</span><span class="exo-score" id="score-'+ex.id+'" aria-live="polite">0 / '+ex.rows.length+' répondu</span><span class="ctit">'+esc(ex.tit)+'</span><span class="csub">'+esc(ex.sub)+'</span></div>';
      if(!ex.cards) h+='<div class="vf-head"><div class="vf-head-txt"></div><div class="vf-head-opts"><div class="vf-head-opt">'+esc(ex.tiles[0])+'</div><div class="vf-head-opt">'+esc(ex.tiles[1])+'</div></div></div>';
      h+='<div class="rows" id="mount-'+ex.id+'"></div>';
      h+='<div style="margin-top:14px;display:flex;align-items:center;gap:12px;flex-wrap:wrap">';
      h+='<button class="btn btn-pri" type="button" onclick="vfCheckAll(\''+ex.id+'\')">✓ Corriger</button>';
      h+='<div class="vf-summary" id="vfsum-'+ex.id+'" aria-live="polite"></div>';
      h+='</div>';
      card.innerHTML=h; host.appendChild(card); return;
    }
    // ── Exercice à écrire (autocorrection ou correction IA) ──
    if(ex.type==='write'){
      // Si l'exercice a un dialogue, son titre est déjà affiché dans la
      // pastille du dialogue juste en dessous — pas besoin de le répéter ici.
      const titHtml = ex.dialogue ? '' : '<span class="ctit">'+esc(ex.tit)+'</span>';
      h+='<div class="c-hdr">'+exoNumBadge(ex.num)+'<span class="tag">'+esc(ex.num)+'</span>'+titHtml+'<span class="csub">'+esc(ex.sub)+'</span></div>';
      const aiBadge = ex.items.some(it=>!it.accept) ? '<div style="font-size:12px;font-weight:800;color:#0D9488;margin-bottom:10px;display:flex;align-items:center;gap:6px">'+ICON_ASSISTANT+' Un assistant corrige ce que tu écris et te donne une rétroaction.</div>' : '';
      if(ex.dialogue && DIALOGUES[ex.dialogue]){
        const dia=DIALOGUES[ex.dialogue];
        h+='<div class="dial-hd" style="margin-bottom:12px"><div class="d-lbl">'+esc(dia.label)+'</div>';
        h+='<button class="btn-lu" onclick="playDialogue(\''+ex.dialogue+'\',this)">'+ICON_SPEAK+' Écouter</button></div>';
        h+='<details style="margin-bottom:12px"><summary style="cursor:pointer;font-size:13px;font-weight:700;color:var(--ws-accent)">Afficher le texte du dialogue</summary>';
        h+='<div class="dial-txt">';
        dia.lines.forEach((l,i)=>{
          const cls=(i%2===0)?'mb':'dr';
          h+='<div class="dl"><span class="'+cls+'">'+esc(l[0])+' :</span> '+esc(l[1])+'</div>';
        });
        h+='</div></details>';
      }
      h+=aiBadge+'<div class="wlist'+(ex.cols===2?' wcols2':'')+'">';
      ex.items.forEach((it,i)=>{
        h+='<div class="witem"><div class="wq">'+blankify(it.q||'')+'</div>';
        if(it.audio){
          const fid=ex.id+'_'+i;
          h+='<button class="btn btn-ghost wlisten" type="button" onclick="playWord(this,\''+jsq(it.audio)+'\',\''+fid+'\')" style="margin-bottom:8px">'+ICON_SPEAK+' Écouter</button>';
        }
        h+='<div class="wrow"><input class="winput" id="wi_'+ex.id+'_'+i+'" placeholder="'+(it.ph||'Écris ta réponse…')+'" autocomplete="off">';
        h+='<button class="btn btn-pri wbtn" onclick="checkWrite(\''+ex.id+'\','+i+')">Vérifier</button></div>';
        h+='<div class="wfb" id="wf_'+ex.id+'_'+i+'" aria-live="polite"></div></div>';
      });
      h+='</div>';
      card.innerHTML=h; host.appendChild(card); return;
    }
    if(ex.id==='prVocab'){
      // Association par CLIC en deux colonnes (mots / définitions), atteignable
      // au clavier — reprend le modèle je-me-prepare.html au lieu du
      // glisser-déposer générique. Le pointage passe quand même par
      // trackPlacement() pour rester compté dans l'étoile globale.
      h+='<div class="c-hdr">'+exoNumBadge(ex.num)+'<span class="tag">'+esc(ex.num)+'</span><span class="exo-score" id="score-'+ex.id+'" aria-live="polite">0 / '+ex.rows.length+' associé</span><span class="ctit">'+esc(ex.tit)+'</span><span class="csub">'+esc(ex.sub)+'</span></div>';
      h+='<div class="pair-grid"><div class="stack" id="vocab-words"></div><div class="stack" id="vocab-defs"></div></div>';
      h+='<div class="vc-actions" style="margin-top:14px">';
      h+='<button class="btn btn-pri" type="button" id="vocab-suite" onclick="vocabAutreGroupe()">Un autre groupe de mots</button>';
      h+='<button class="btn btn-ghost" type="button" onclick="toggleVocabExo(false)">Fermer</button>';
      h+='</div>';
      card.innerHTML=h;
      host.appendChild(card);
      return;
    }
    h+='<div class="exo-row" style="display:flex;gap:20px;align-items:flex-start;flex-wrap:wrap">';
    h+='<div class="c-hdr">'+exoNumBadge(ex.num)+'<span class="tag">'+esc(ex.num)+'</span><span class="ctit">'+esc(ex.tit)+'</span><span class="csub">'+esc(ex.sub)+'</span></div>';
    h+='<div class="exo-main" style="flex:1;min-width:300px">';
    if(ex.type==='blanks') h+='<p class="blanks-p" id="mount-'+ex.id+'"></p>';
    else h+='<div class="rows" id="mount-'+ex.id+'"></div>';
    h+='</div>';
    const vert=(ex.type==='match'||ex.type==='rows'||ex.type==='imgmatch')?' vert':'';
    // Le banc mesurait 220 px : une seule tuile par rangée, donc une colonne
    // aussi haute que le nombre de réponses, et la carte de l'exercice
    // réservait cette hauteur — un grand vide sous les phrases. À 340 px, les
    // tuiles se rangent deux par deux et le banc redescend à la hauteur de
    // l'énoncé. Les bancs `vert` (phrases entières) gardent leur colonne.
    const bw=ex.type==='imgmatch'?'240px':((ex.type==='match'||ex.type==='rows')?'300px':'340px');
    h+='<div class="bsec b1" style="flex:0 0 '+bw+'"><div class="blbl">'+(ex.bankLbl||'Réponses')+'</div><div class="btiles'+vert+'" id="bank-'+ex.id+'"></div></div>';
    h+='</div>';
    card.innerHTML=h;
    host.appendChild(card);
  });
  injectCustom();
  if(document.getElementById('vocab-words')) vocabBuild();
}

// ── SECTIONS PERSONNALISÉES (oral / écrit / autoéval) ─────────────────
function injectCustom(){

  // Trois productions : la rencontre avec l'assistant, le récit oral corrigé,
  // puis la lettre personnelle. Le jeu de rôle vient en premier parce qu'il
  // sert de répétition aux deux autres.
  //

  // situation du programme — « s'informer auprès d'un spécialiste à propos
  // d'un problème de santé », en production. La production écrite, elle,
  // vient des attentes de fin de cours du niveau, la situation n'ayant aucune
  // intention de production écrite : « il rédige également un courriel pour
  // donner des nouvelles à son entourage [...] ou bien pour décrire et
  // raconter un évènement d'une façon détaillée », et « l'adulte rédige un
  // court texte en organisant ses idées à l'aide de paragraphes ». Le savoir
  // de grammaire du texte « découper, disposer, formuler et présenter le
  // contenu d'une lettre personnelle » en fixe la forme — une lettre
  // personnelle, et non un courriel formel.

    {id:'fatigue', titre:'Huit mois de fatigue', txt:"Tu as attendu <b>sept mois</b> ce rendez-vous. Ta fatigue a commencé en février et ne part pas. Tu as vingt minutes et tu ne sais pas quoi dire de plus que « je suis fatiguée »."},

    {id:'suite', titre:'Et après ?', txt:"La rencontre se termine. Tu n'as pas de diagnostic, et tu dois repartir en sachant <b>ce qui arrive ensuite</b>, avec quelles dates — et avec un papier pour ton employeur."},
  ];
  const ROLE_SUJETS = ["Raconter ton histoire dans l'ordre, avec des repères de temps",
    "Dire un changement plutôt qu'un état : avant je faisais ceci, maintenant non",
    "Donner un exemple précis, avec un lieu et un nombre",
    "Répondre à la question posée, sans minimiser ce que tu vis",
    "Demander qu'on te répète ou qu'on t'explique un mot que tu ne connais pas",
