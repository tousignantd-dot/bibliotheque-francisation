<!DOCTYPE html>
<html lang="fr"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Corrige-moi !</title>
<link rel="stylesheet" href="/assets/design-system/styles.css">
<style>
/* ============================================================
   CORRIGE-MOI ! — pratique orale libre
   Tout vient du système de design (assets/design-system/).
   Ce bloc ne fait que composer les pièces propres à cet écran :
   barre de thèmes, en-tête de conversation, fil de messagerie.
   Aucune valeur en dur : uniquement des var(--*).
   ============================================================ */

/* — Barre de thèmes — */
.themes { display: flex; gap: var(--sp-2); flex-wrap: wrap; }
.theme-pill {
  display: inline-flex; align-items: center; gap: var(--sp-2);
  min-height: var(--tap-min); padding: 0 var(--sp-4);
  border: 1px solid var(--border); border-radius: var(--r-pill);
  background: var(--surface-card); color: var(--text-strong);
  font-family: var(--font-sans); font-size: var(--fs-ui); font-weight: var(--fw-bold);
  line-height: 1; white-space: nowrap; cursor: pointer;
  transition: background var(--dur) var(--ease), border-color var(--dur) var(--ease);
}
.theme-pill:hover { background: var(--paper-100); }
.theme-pill__dot { width: 10px; height: 10px; flex: none; border-radius: 50%; background: var(--th); }
.theme-pill__note { font-weight: var(--fw-semi); color: var(--text-muted); }
/* Choisi = plaque encre, jamais une teinte de plus. */
.theme-pill[aria-pressed="true"] {
  background: var(--sel-bg); border-color: var(--sel-line); color: var(--sel-ink);
}
.theme-pill[aria-pressed="true"]:hover { background: var(--sel-bg); }

/* — En-tête de conversation — */
.conv__head {
  display: flex; align-items: center; gap: var(--sp-3); flex-wrap: wrap;
  background: var(--surface-sunken); border-left: 4px solid var(--th);
}
.conv__num {
  display: inline-flex; align-items: center; justify-content: center;
  width: 34px; height: 34px; flex: none; border-radius: 50%;
  background: var(--th); color: var(--white);
  font-size: var(--fs-ui-sm); font-weight: var(--fw-black);
}
.conv__titre { font-size: var(--fs-body-sm); font-weight: var(--fw-bold); color: var(--th); }
.conv__intro { font-size: var(--fs-ui); font-weight: var(--fw-semi); color: var(--text-muted); }
.conv__score { margin-left: auto; }
/* Sans thème : encre lisible (jamais un filet en guise de texte). */
.conv__head.is-empty { --th: var(--ink-500); }
.conv__head.is-empty .conv__intro { color: var(--ink-500); }

/* — Fil de messagerie — */
.thread {
  display: flex; flex-direction: column; gap: var(--sp-4);
  min-height: 220px; background: var(--surface-page);
}
.msg { display: flex; flex-direction: column; gap: var(--sp-1); max-width: 100%; }
.msg--q { align-items: flex-start; }
.msg--r { align-items: flex-end; }
.msg__who {
  font-size: var(--fs-label); font-weight: var(--fw-bold);
  letter-spacing: .06em; text-transform: uppercase; color: var(--th);
}
.msg__bulle {
  max-width: 78%; padding: var(--sp-3) var(--sp-4); border-radius: var(--r-lg);
  border: 1px solid var(--border); border-left: 4px solid var(--th);
  background: var(--surface-card); color: var(--text-strong);
  font-size: var(--fs-body-sm); font-weight: var(--fw-semi); line-height: var(--lh-body);
}
.msg--r { --th: var(--accent); }
.msg--r .msg__who { color: var(--text-accent); }
.msg--r .msg__bulle {
  background: var(--accent-soft); border-color: var(--accent); color: var(--accent-ink);
}
.msg__dit {
  max-width: 78%; text-align: right;
  font-size: var(--fs-ui); font-weight: var(--fw-medium); font-style: italic; color: var(--text-muted);
}
.msg__juste { font-size: var(--fs-ui); font-weight: var(--fw-bold); color: var(--ok-ink); }
.msg__bloc { max-width: 78%; width: 100%; }
.thread__vide {
  margin: auto; max-width: 420px; text-align: center;
  font-size: var(--fs-body-sm); font-weight: var(--fw-semi); color: var(--text-muted);
}

/* — Zone de réponse — */
.repondre { display: flex; flex-direction: column; gap: var(--sp-3); }
.repondre__mic { display: flex; align-items: center; gap: var(--sp-4); flex-wrap: wrap; }
.repondre__aide { font-size: var(--fs-ui); font-weight: var(--fw-semi); color: var(--text-muted); }
.repondre__saisie { display: flex; align-items: flex-end; gap: var(--sp-3); flex-wrap: wrap; }
.repondre__champ { flex: 1; min-width: 260px; }
.repondre__champ .field--area { min-height: 84px; }
.repondre__actions { display: flex; gap: var(--sp-2); flex-wrap: wrap; }

/* — Bilan — */
.bilan { display: flex; flex-direction: column; gap: var(--sp-3); }
.bilan__titre { font-size: var(--fs-lead); font-weight: var(--fw-black); color: var(--text-strong); }
.bilan__texte { font-size: var(--fs-body-sm); font-weight: var(--fw-medium); color: var(--ink-500); }
.bilan__actions { display: flex; gap: var(--sp-3); flex-wrap: wrap; }

.is-hidden { display: none !important; }
</style>
</head>
<body class="page">

<header class="band">
  <div class="container">
    <div class="band__eyebrow">Francisation · Niveau 4 · Pratique orale libre</div>
    <h1>Corrige-moi !</h1>
    <p class="band__lead">Vous répondez à voix haute. Chaque réponse est corrigée avant la question suivante.</p>
  </div>
</header>

<div class="container">
  <div class="stack" style="padding: var(--sp-6) 0 var(--sp-12)">

    <div>
      <span class="field-label" style="display:block">Thème de conversation</span>
      <div class="themes" id="themes"></div>
    </div>

    <div class="card card--flush">

      <div class="card__row conv__head is-empty" id="convHead">
        <span class="conv__num" id="convNum" aria-hidden="true">—</span>
        <span class="conv__titre" id="convTitre">Aucun thème choisi</span>
        <span class="conv__intro" id="convIntro">Cinq thèmes, six questions chacun.</span>
        <span class="conv__score"><span class="score" id="convScore">—</span></span>
      </div>

      <div class="card__row thread" id="thread" aria-live="polite"></div>

      <div class="card__row repondre is-hidden" id="repondre">
        <div class="repondre__mic" id="micRow">
          <button type="button" class="btn btn--pri" id="micBtn">Parler</button>
          <span class="repondre__aide" id="micAide">Appuyez, puis répondez à la question.</span>
        </div>

        <div class="repondre__saisie is-hidden" id="saisie">
          <div class="repondre__champ">
            <label class="field-label" for="reponse">Votre réponse — corrigez-la avant de l'envoyer</label>
            <textarea id="reponse" class="field field--area" rows="2"></textarea>
          </div>
          <div class="repondre__actions">
            <button type="button" class="btn btn--pri" id="envoyerBtn">Envoyer</button>
            <button type="button" class="btn btn--ghost" id="effacerBtn">Effacer</button>
          </div>
        </div>

        <p class="fb fb--warn is-hidden" id="erreur" aria-live="polite"></p>
      </div>

      <div class="card__row bilan is-hidden" id="bilan">
        <div class="bilan__titre">Dialogue terminé</div>
        <div class="bilan__texte" id="bilanTexte"></div>
        <div class="bilan__actions">
          <button type="button" class="btn btn--pri" id="refaireBtn">Refaire ce thème</button>
          <button type="button" class="btn btn--ghost" id="changerBtn">Choisir un autre thème</button>
        </div>
      </div>

    </div>

  </div>
</div>

<script>
/* ── Contenu : cinq thèmes, six questions chacun ─────────────────── */
const THEMES = [
  { id: 'medecin', couleur: 'var(--acier-600)', tag: 'Chez le médecin', qui: 'Le médecin',
    intro: "Vous êtes chez le médecin. Répondez à ses questions à voix haute.",
    questions: [
      "Bonjour ! Qu'est-ce qui ne va pas aujourd'hui ?",
      "Depuis quand avez-vous ces symptômes ?",
      "Avez-vous de la fièvre ?",
      "Est-ce que vous prenez des médicaments en ce moment ?",
      "Avez-vous des allergies ?",
      "Pouvez-vous me décrire la douleur exactement ?",
    ] },
  { id: 'entrevue', couleur: 'var(--indigo-600)', tag: "Entrevue d'embauche", qui: 'Le recruteur',
    intro: "Vous passez une entrevue d'embauche. Répondez aux questions du recruteur.",
    questions: [
      "Bonjour, merci d'être venu. Pouvez-vous vous présenter ?",
      "Quelle expérience de travail avez-vous ?",
      "Pourquoi voulez-vous travailler pour notre entreprise ?",
      "Quelles sont vos disponibilités ?",
      "Quel est votre plus grand défi au travail ?",
      "Avez-vous des questions pour moi ?",
    ] },
  { id: 'restaurant', couleur: 'var(--ambre-700)', tag: 'Au restaurant', qui: 'Le serveur',
    intro: "Vous êtes au restaurant. Répondez aux questions du serveur.",
    questions: [
      "Bonjour ! Une table pour combien de personnes ?",
      "Qu'est-ce que je vous sers à boire ?",
      "Avez-vous choisi votre plat ?",
      "Avez-vous des allergies alimentaires ?",
      "Voulez-vous voir le menu des desserts ?",
      "Est-ce que tout était à votre goût ?",
    ] },
  { id: 'logement', couleur: 'var(--teal-700)', tag: 'Louer un logement', qui: 'Le propriétaire',
    intro: "Vous appelez pour un appartement à louer. Répondez au propriétaire.",
    questions: [
      "Bonjour, vous appelez pour l'appartement à louer ?",
      "Combien de personnes vont habiter dans l'appartement ?",
      "Avez-vous des animaux de compagnie ?",
      "Quand voulez-vous emménager ?",
      "Avez-vous des questions sur le bail ?",
      "Voulez-vous visiter l'appartement cette semaine ?",
    ] },
  { id: 'classe', couleur: 'var(--green-600)', tag: 'Premier jour de classe', qui: "L'enseignante",
    intro: "C'est votre premier jour de cours. Répondez aux questions de l'enseignante.",
    questions: [
      "Bonjour ! Comment vous appelez-vous ?",
      "D'où venez-vous ?",
      "Depuis combien de temps êtes-vous au Québec ?",
      "Pourquoi apprenez-vous le français ?",
      "Qu'est-ce que vous aimez faire pendant votre temps libre ?",
      "Avez-vous des questions sur le cours ?",
    ] },
];

const studentCode = new URLSearchParams(location.search).get('code') || '';

/* ── État ────────────────────────────────────────────────────────── */
const state = {
  ecran: 'choix',        // 'choix' | 'dialogue' | 'fin'
  theme: null,
  index: 0,
  tours: [],             // { qui, question, original, corrige, memePhrase, erreurs }
  brouillon: '',
  reponseVisible: false,
  ecoute: false,
  micDisponible: true,
  envoiEnCours: false,
  erreur: '',
};

const $ = (id) => document.getElementById(id);
const esc = (s) => (s || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

/* ── Barre de thèmes ─────────────────────────────────────────────── */
function renderThemes() {
  const zone = $('themes');
  zone.innerHTML = '';
  THEMES.forEach((t) => {
    const actif = !!state.theme && state.theme.id === t.id;
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'theme-pill';
    b.style.setProperty('--th', t.couleur);
    b.setAttribute('aria-pressed', actif ? 'true' : 'false');
    b.innerHTML = '<span class="theme-pill__dot" aria-hidden="true"></span>' + esc(t.tag) +
      (actif ? '' : '<span class="theme-pill__note">' + t.questions.length + ' questions</span>');
    b.addEventListener('click', () => demarrer(t));
    zone.appendChild(b);
  });
}

/* ── En-tête de conversation ─────────────────────────────────────── */
function renderEntete() {
  const th = state.theme;
  const head = $('convHead');
  head.classList.toggle('is-empty', !th);
  head.style.setProperty('--th', th ? th.couleur : 'var(--ink-500)');
  const total = th ? th.questions.length : 6;
  $('convNum').textContent = th ? String(THEMES.indexOf(th) + 1).padStart(2, '0') : '—';
  $('convTitre').textContent = th ? th.tag : 'Aucun thème choisi';
  $('convIntro').textContent = th ? th.intro : 'Cinq thèmes, six questions chacun.';
  $('convScore').textContent = !th ? '—'
    : state.ecran === 'fin' ? total + ' / ' + total + ' répondues'
    : 'Question ' + Math.min(state.index + 1, total) + ' / ' + total;
}

/* ── Fil de messagerie ───────────────────────────────────────────── */
function bulleQuestion(qui, texte) {
  const d = document.createElement('div');
  d.className = 'msg msg--q';
  d.style.setProperty('--th', state.theme.couleur);
  d.innerHTML = '<div class="msg__who">' + esc(qui) + '</div>' +
                '<div class="msg__bulle">' + esc(texte) + '</div>';
  return d;
}

function bulleReponse(tour) {
  const d = document.createElement('div');
  d.className = 'msg msg--r';
  let html = '<div class="msg__who">Vous</div>' +
             '<div class="msg__bulle">' + esc(tour.corrige) + '</div>';
  if (tour.memePhrase) {
    html += '<span class="msg__juste">✓ Juste — rien à corriger.</span>';
  } else {
    html += '<div class="msg__dit">Vous avez dit : « ' + esc(tour.original) + ' »</div>';
    const remarques = (tour.erreurs || []).filter((e) => e && e.explication);
    if (remarques.length) {
      html += '<div class="msg__bloc"><div class="fb-box fb-box--no" aria-live="polite">' +
        '<div class="fb-box__title">Ce qui est à revoir</div>' +
        remarques.map((e) => '<div class="fb-box__item">' + esc(e.explication) + '</div>').join('') +
        '</div></div>';
    }
  }
  d.innerHTML = html;
  return d;
}

function renderFil() {
  const fil = $('thread');
  fil.innerHTML = '';
  const th = state.theme;
  if (!th) {
    fil.innerHTML = '<div class="thread__vide">Choisissez un thème ci-dessus : votre interlocuteur ' +
      'posera la première question ici.</div>';
    return;
  }
  state.tours.forEach((t) => {
    fil.appendChild(bulleQuestion(t.qui, t.question));
    fil.appendChild(bulleReponse(t));
  });
  if (state.ecran === 'dialogue' && state.index < th.questions.length) {
    fil.appendChild(bulleQuestion(th.qui, th.questions[state.index]));
  }
  const dernier = fil.lastElementChild;
  if (dernier && state.tours.length) dernier.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
}

/* ── Zone de réponse et bilan ────────────────────────────────────── */
function renderZone() {
  const dialogue = state.ecran === 'dialogue';
  const fin = state.ecran === 'fin';
  $('repondre').classList.toggle('is-hidden', !dialogue);
  $('bilan').classList.toggle('is-hidden', !fin);

  $('micRow').classList.toggle('is-hidden', !state.micDisponible);
  const mic = $('micBtn');
  mic.className = 'btn ' + (state.ecoute ? 'btn--audio' : 'btn--pri');
  mic.textContent = state.ecoute ? "J'ai fini de parler" : 'Parler';
  mic.disabled = state.envoiEnCours;
  $('micAide').textContent = state.ecoute
    ? "J'écoute… parlez maintenant."
    : 'Appuyez, puis répondez à la question.';

  const visible = state.reponseVisible || !state.micDisponible;
  $('saisie').classList.toggle('is-hidden', !visible);
  const champ = $('reponse');
  if (champ.value !== state.brouillon) champ.value = state.brouillon;
  const envoyer = $('envoyerBtn');
  envoyer.textContent = state.envoiEnCours ? 'Correction en cours…' : 'Envoyer';
  envoyer.disabled = state.envoiEnCours || !state.brouillon.trim();

  const err = $('erreur');
  err.textContent = state.erreur;
  err.classList.toggle('is-hidden', !state.erreur);

  if (fin) {
    const n = state.tours.length;
    const parfaits = state.tours.filter((t) => t.memePhrase).length;
    $('bilanTexte').textContent = n + ' réponse' + (n > 1 ? 's' : '') + ' donnée' + (n > 1 ? 's' : '') +
      ', dont ' + parfaits + ' déjà juste' + (parfaits > 1 ? 's' : '') + ' du premier coup.';
  }
}

function render() {
  renderThemes();
  renderEntete();
  renderFil();
  renderZone();
}

/* ── Parcours ────────────────────────────────────────────────────── */
function demarrer(t) {
  state.ecran = 'dialogue';
  state.theme = t;
  state.index = 0;
  state.tours = [];
  state.brouillon = '';
  state.reponseVisible = !state.micDisponible;
  state.erreur = '';
  render();
}

function changerTheme() {
  state.ecran = 'choix';
  state.theme = null;
  state.index = 0;
  state.tours = [];
  state.brouillon = '';
  state.erreur = '';
  render();
}

/* ── Reconnaissance vocale ───────────────────────────────────────── */
let reco = null;
// ── RECONNAISSANCE VOCALE : GARDE-FOU « SUR L'APPAREIL » ──────────────
// webkitSpeechRecognition n'est PAS un moteur local : Chrome expédie l'audio
// capté à ses serveurs, Safari aux siens. Pour une classe de francisation cela
// veut dire la voix d'élèves nouvellement arrivés qui sort du Québec à chaque
// exercice oral — sans passer par notre serveur ni par nos clés, donc sans
// qu'aucun choix d'hébergeur n'y change quoi que ce soit.
//
// La Web Speech API sait maintenant travailler hors ligne : available() dit si
// le paquet de langue est présent, install() le télécharge, et processLocally
// interdit tout envoi réseau. TOUT passe par reconnaissanceLocale() — aucun
// « new SpeechRecognition() » ne doit reparaître ailleurs dans ce fichier.
//
// Strict = pas de reconnaissance locale possible ⇒ pas de reconnaissance du
// tout. Un centre qui préfère le service au confinement peut le lever, et la
// voix repart alors chez l'éditeur du navigateur, en connaissance de cause.
//
// La décision vient du SERVEUR, pas du build : la greffe « sans IA » pose
// window.RECO_STRICTE au chargement, d'après le centre de l'élève. Tant que
// la réponse n'est pas là — et si elle n'arrive jamais — on reste strict.
// C'est le contraire du choix fait pour les routes d'IA, qui ne se replient
// pas sur une panne de réseau : celles-là sont gardées côté serveur de toute
// façon, alors que ce flux-ci ne le traverse pas. Un silence ne doit pas
// ouvrir le micro.
if (window.RECO_STRICTE === undefined) window.RECO_STRICTE = true;
const RECO_LANGS = ['fr-CA'];
const RECO_SRC = () => window.SpeechRecognition || window.webkitSpeechRecognition;
// Le paquet de langue ne se télécharge qu'une fois par appareil, mais il pèse
// lourd : on ne relance pas l'installation à chaque touche de micro.
let _recoInstall = false;

// quality : 'command' pour un mot répété, 'dictation' pour une production
// suivie. Le moteur local ne charge pas le même modèle selon le cas.
async function recoEtat(quality){
  const SRC = RECO_SRC();
  if(!SRC) return 'sans-api';
  // Navigateur d'avant l'API sur appareil : available() n'existe pas, donc
  // rien ne garantit que l'audio reste ici. En mode strict, on renonce.
  if(typeof SRC.available !== 'function') return window.RECO_STRICTE ? 'sans-local' : 'distant';
  let dispo;
  try{ dispo = await SRC.available({langs:RECO_LANGS, quality, processLocally:true}); }
  catch(e){ return window.RECO_STRICTE ? 'sans-local' : 'distant'; }
  if(dispo === 'available') return 'local';
  if(dispo === 'downloadable' || dispo === 'downloading'){
    if(!_recoInstall){
      _recoInstall = true;
      Promise.resolve(SRC.install({langs:RECO_LANGS, processLocally:true}))
        .catch(()=>{}).then(()=>{ _recoInstall = false; });
    }
    return 'telechargement';
  }
  return window.RECO_STRICTE ? 'sans-local' : 'distant';
}

// Rend {rec, etat}. rec vaut null dès que l'exercice ne peut pas écouter.
async function reconnaissanceLocale(quality){
  const etat = await recoEtat(quality);
  if(etat !== 'local' && etat !== 'distant') return {rec:null, etat};
  const rec = new (RECO_SRC())();
  rec.lang = RECO_LANGS[0]; rec.maxAlternatives = 1;
  // processLocally n'est lu qu'au start() : le poser après ne servirait à rien.
  if(etat === 'local'){ try{ rec.processLocally = true; }catch(e){} }
  return {rec, etat};
}

// Un seul texte par état, pour que les trois exercices disent la même chose.
function recoMessage(etat){
  if(etat === 'sans-api')       return "Ce navigateur ne fait pas la reconnaissance vocale. Essaie avec Chrome, Edge ou Safari.";
  if(etat === 'telechargement') return "Préparation de la reconnaissance vocale sur cet appareil — réessaie dans un moment.";
  if(etat === 'sans-local')     return "La reconnaissance vocale hors ligne n'est pas disponible sur cet appareil.";
  return "";
}

const Ctor = RECO_SRC();
if (Ctor) {
  reco = new Ctor();
  reco.lang = 'fr-CA';
  reco.interimResults = false;
  reco.maxAlternatives = 1;
  reco.addEventListener('start', () => { state.ecoute = true; state.erreur = ''; renderZone(); });
  reco.addEventListener('end', () => { state.ecoute = false; renderZone(); });
  reco.addEventListener('result', (e) => {
    state.brouillon = e.results[0][0].transcript;
    state.reponseVisible = true;
    renderZone();
    $('reponse').focus();
  });
  reco.addEventListener('error', (e) => {
    const bloque = e.error === 'not-allowed' || e.error === 'service-not-allowed';
    state.ecoute = false;
    if (bloque) { state.micDisponible = false; state.reponseVisible = true; }
    state.erreur = bloque
      ? 'Le micro est bloqué. Autorisez le micro dans votre navigateur, ou écrivez votre réponse.'
      : e.error === 'no-speech' ? "Je n'ai rien entendu. Reprenez."
      : 'Problème de micro. Vous pouvez écrire votre réponse.';
    renderZone();
  });
} else {
  state.micDisponible = false;
  state.reponseVisible = true;
}

$('micBtn').addEventListener('click', async () => {
  if (!reco) return;
  if (state.ecoute) { reco.stop(); return; }
  state.erreur = '';
  // Le confinement se pose ici, pas à la construction : processLocally n'est
  // lu qu'au démarrage, et l'état du paquet de langue peut changer entre deux
  // touches (téléchargement en cours).
  const etat = await recoEtat('command');
  if (etat !== 'local' && etat !== 'distant') {
    state.erreur = recoMessage(etat);
    state.micDisponible = false;
    state.reponseVisible = true;
    renderZone();
    return;
  }
  try { reco.processLocally = (etat === 'local'); } catch (e) {}
  try { reco.start(); } catch (e) { /* déjà démarré */ }
  renderZone();
});

/* ── Saisie et envoi ─────────────────────────────────────────────── */
$('reponse').addEventListener('input', (e) => {
  state.brouillon = e.target.value;
  $('envoyerBtn').disabled = state.envoiEnCours || !state.brouillon.trim();
});

$('effacerBtn').addEventListener('click', () => {
  state.brouillon = '';
  state.reponseVisible = !state.micDisponible;
  state.erreur = '';
  renderZone();
});

$('envoyerBtn').addEventListener('click', async () => {
  const th = state.theme;
  if (!th) return;
  const texte = state.brouillon.trim();
  if (!texte) return;
  const total = th.questions.length;
  const question = th.questions[Math.min(state.index, total - 1)];

  state.envoiEnCours = true;
  state.erreur = '';
  renderZone();

  let data;
  try {
    const res = await fetch('/api/correct-french', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ code: studentCode, text: texte, question: question }),
    });
    data = await res.json();
    if (!res.ok) {
      state.envoiEnCours = false;
      state.erreur = data.error || 'Une erreur est survenue. Reprenez.';
      renderZone();
      return;
    }
  } catch (e) {
    state.envoiEnCours = false;
    state.erreur = 'Impossible de joindre le service de correction. Vérifiez votre connexion.';
    renderZone();
    return;
  }

  state.tours.push({
    qui: th.qui, question: question,
    original: data.original || texte,
    corrige: data.corrige || texte,
    memePhrase: !!data.memePhrase,
    erreurs: data.erreurs || [],
  });
  state.index += 1;
  state.brouillon = '';
  state.reponseVisible = !state.micDisponible;
  state.envoiEnCours = false;
  state.ecran = state.index >= total ? 'fin' : 'dialogue';
  suivre('exercise_completed', { zonesDone: state.tours.length, score: null });
  noterSeance(th, !!data.memePhrase);
  render();
});

$('refaireBtn').addEventListener('click', () => { if (state.theme) demarrer(state.theme); });
$('changerBtn').addEventListener('click', changerTheme);

/* ── Suivi enseignant ────────────────────────────────────────────── */
/* Un cumul par (élève, thème) : réponses corrigées, réponses justes du
   premier coup, date de la dernière séance. Sans code élève, rien à noter.
   L'appel ne doit jamais bloquer le dialogue : une panne de suivi se tait. */
function noterSeance(theme, memePhrase) {
  if (!studentCode) return;
  fetch('/api/corrige-moi/seance', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      code: studentCode, themeId: theme.id, themeLabel: theme.tag, memePhrase: memePhrase,
    }),
  }).catch(() => {});
}

/* ── Suivi LMS ───────────────────────────────────────────────────── */
function suivre(evenement, donnees) {
  try {
    window.parent.postMessage(Object.assign({ lms: true, event: evenement }, donnees || {}), '*');
  } catch (e) {}
}

render();
</script>
