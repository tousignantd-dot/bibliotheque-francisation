/* ── Exercice « texte » : un texte suivi et ses questions ─────────────── */

  gap:18px;align-items:start}

  font-size:var(--fs-body,17px);position:sticky;top:12px}

  box-shadow:inset 0 -2px 0 var(--line-300,#D8DEE6);transition:background .12s}

  box-shadow:none}

  padding:12px 14px;margin-bottom:10px;cursor:pointer;background:#fff}

.tx-q.ok{border-color:#2F8F4E;background:#F4FBF6}

.hdr-lead{max-width:56ch;margin-top:16px;font-size:19px;font-weight:500;line-height:1.5;color:var(--ws-sub,#6E7175)}
.hdr-lead:empty{display:none}
/* Le trio de l'en-tête — étoile, débit des voix, réinitialiser — tenait sur
   une seule ligne quoi qu'il arrive : environ 400 px demandés dans les 358 px
   d'un téléphone, donc « Réinitialiser » hors de l'écran et la page entière
   qui se poussait de côté. Il revient à la ligne quand il le faut. */
.hdr-r{display:flex;align-items:center;gap:14px;flex-wrap:wrap;row-gap:10px}
#prog-chip{background:var(--hdr-accent-soft,var(--accent-soft));color:var(--hdr-accent,var(--accent-ink));border:1px solid transparent;border-radius:999px;padding:8px 18px;font-size:15px;font-weight:800;white-space:nowrap}

#btn-reset:hover{background:var(--paper-100)}
#btn-reset:hover{background:rgba(255,255,255,.28)}
/* REPRISE-CSS:début — greffé par build/greffe_reprise.py */

.tab{min-height:var(--tap-min);border:1px solid var(--border);border-radius:999px;padding:0 16px;font-family:'Nunito',sans-serif;font-size:14px;font-weight:800;cursor:pointer;background:var(--surface-card);color:var(--text-body);transition:background .15s,border-color .15s;display:inline-flex;align-items:center;gap:8px}

.is-hidden{display:none!important}

.dial-txt{flex:1;min-width:280px;display:flex;flex-direction:column;gap:7px;font-size:20px;font-weight:600;line-height:1.7;padding-right:8px}

.dl{line-height:1.7}.mb{color:#93C5FD;font-weight:800}.dr{color:#7FD4C9;font-weight:800}

.intro{background:#DCEFEB;padding:14px 32px;font-size:17px;font-weight:700;color:#154F68;line-height:1.5;border-bottom:2px solid #B7DED7}

.exs{flex:1;padding:22px 32px 48px;display:flex;flex-direction:column;gap:20px}
.cta{background:var(--ws-ink,#17181A);color:#fff;border-radius:18px;padding:26px 32px;margin:0 32px 32px;display:flex;align-items:center;justify-content:space-between;gap:20px;flex-wrap:wrap}
.cta-eyebrow{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.14em;color:#8FE2B9}
.cta-tit{font-size:22px;font-weight:900;margin-top:6px}

.card{background:#fff;border-radius:18px;padding:22px 26px;box-shadow:0 4px 20px rgba(15,118,110,.08)}

.tag{font-size:13px;font-weight:800;text-transform:uppercase;letter-spacing:.12em;white-space:nowrap}
.ctit,.csub{flex-basis:100%}
.ctit{display:block;font-size:24px;font-weight:900;line-height:1.2}

.exo-score{margin-left:auto;background:var(--ws-accent-bg,#E6F5EE);color:var(--sec-color,var(--ws-accent));padding:6px 12px;border-radius:999px;font-size:13px;font-weight:700;white-space:nowrap}
.pair-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}
@media(max-width:640px){.pair-grid{grid-template-columns:1fr}}
.pair-grid .stack{display:flex;flex-direction:column;gap:8px}
.chip{display:block;width:100%;text-align:left;padding:12px 16px;border-radius:12px;border:1.5px solid var(--ws-line,#EAEAE8);background:#fff;font-family:inherit;font-size:15px;font-weight:600;color:var(--ws-ink,#17181A);cursor:pointer;transition:border-color .15s,background .15s}
.chip:hover{border-color:var(--ws-accent,#0A8F5B)}
.chip.chip-word{font-weight:800}
.chip.is-active{border-color:var(--ws-accent,#0A8F5B);background:var(--ws-accent-bg,#E6F5EE);box-shadow:0 0 0 2px var(--ws-accent-bg,#E6F5EE)}
.chip.is-paired{border-color:var(--ok-line,#34A76B);background:var(--ok-bg,#E8F6EE);color:var(--ok-ink,#0A6B46);cursor:default;opacity:.85}
.chip.is-miss{border-color:var(--no-line,#DC2626);background:var(--no-bg,#FFF6F5)}

.savoir{background:#F1FBF9;border-left:5px solid #1D6B8F;border-radius:0 14px 14px 0;padding:0 22px 16px;margin-bottom:4px;overflow-x:auto}

.word-chip .wc-phrase b{font-weight:800}
.word-chip .btn{padding:0!important;width:48px!important;height:48px!important;min-height:48px!important;display:inline-flex;align-items:center;justify-content:center;font-size:14px;border-radius:50%}   /* HP-ROND */
.icon-svg{width:1em;height:1em;vertical-align:middle;display:inline-block}
.btn .icon-svg{width:15px;height:15px}
.btn-ghost.wlisten .icon-svg,.btn-lu .icon-svg{width:17px;height:17px;margin-right:4px}
@media(max-width:640px){.savoir td:first-child{width:auto}.savoir table,.savoir tbody,.savoir tr,.savoir td{display:block;width:100%}.savoir td{border-bottom:none;padding:4px 0}.savoir tr{padding-bottom:10px;border-bottom:1px dashed #B7DED7;margin-bottom:6px}}

.rows{display:flex;flex-direction:column;gap:8px}
.rrow{display:flex;align-items:center;gap:10px}
.stxt{flex:1;background:#F1F9F7;border-radius:10px;padding:14px 18px;font-size:20px;font-weight:700;color:#123B32;line-height:1.4}
.rrow2{display:grid;grid-template-columns:1fr 1fr;gap:8px;align-items:stretch}
/* Appariement de phrases : la zone de dépôt prenait la moitié de la rangée,
   soit le double de la tuile qui vient s'y poser — une grande case vide
   entre la question et sa réponse. Elle se cale sur la largeur du banc
   (300 px) : la tuile garde sa forme en passant de l'un à l'autre. */
.rrow2.rz{grid-template-columns:minmax(0,1fr) minmax(0,300px)}
/* Appariement d'images : la zone faisait 640 px de large et, en 3:2, plus
   de 420 px de haut — deux énoncés remplissaient l'écran et l'élève devait
   défiler entre la vignette qu'il prend et la case où il la dépose. Elle se
   cale sur le banc ; les vignettes du banc s'y calent aussi, pour que la
   photo garde sa taille en passant de l'un à l'autre. Le 3:2 ne bouge pas. */
.rrow2.rzi{grid-template-columns:minmax(0,1fr) minmax(0,240px)}
.bsec.b1 .imgtile{width:100%}

.qtxt{font-size:20px;font-weight:700;color:#123B32;line-height:1.4}
.timelbl{flex:0 0 90px;background:var(--warn-bg);border-radius:10px;padding:12px 8px;font-size:15px;font-weight:900;color:var(--warn-ink);text-align:center}

textarea,input.txt{width:100%;border:2.5px solid #B7DED7;border-radius:12px;padding:11px 14px;font-family:'Nunito',sans-serif;font-size:15px;font-weight:700;color:#123B32;background:#F7FCFB;resize:vertical}
textarea:focus{outline:none;border-color:#1D6B8F}
.btn{font-family:'Nunito',sans-serif;font-size:15px;font-weight:800;border-radius:10px;padding:11px 18px;cursor:pointer;border:2.5px solid transparent}

.btn-send{background:#12556B;color:#fff}.btn-send:disabled{opacity:.5}
.fb{background:#F0FAF7;border:2px solid #B7DED7;border-radius:12px;padding:14px 16px;display:none;flex-direction:column;gap:8px;margin-top:12px}
.fb.on{display:flex}
.fb-t{font-size:12px;font-weight:900;text-transform:uppercase;letter-spacing:.06em;color:#154F68}
.fb-c{font-size:16px;font-weight:800;color:#154F68;line-height:1.5}
/* La remarque a la taille de la correction : c'est elle qui enseigne. Elle
   était à 13 px et en brun d'avertissement, soit la ligne la plus petite et
   la plus sourde du bloc — la hiérarchie était à l'envers. Sa carte ambre lui
   garde son statut de remarque, que l'encre neutre lui ferait perdre. */
.fb-e{font-size:16px;font-weight:700;color:#5F3803;line-height:1.55;
      background:var(--warn-bg,#FEF6E7);border-left:4px solid var(--warn-line,#D9880B);
      border-radius:0 10px 10px 0;padding:10px 13px}
/* Quand tout est déjà juste, c'est la couleur qui le dit — plus d'emoji. */
.fb-c.fb-bravo{color:var(--ok-ink,#0A6B46)}
/* Le buste signe le bloc, en tête : quelqu'un vient de vous donner des
   conseils, et tout ce qui suit est ce qu'il dit. Une personne se présente
   une fois, pas à chaque phrase. currentColor le met au teal du titre. */
/* Le titre est une étiquette, pas une parole. Il quitte le #154F68 de la
   phrase corrigée — au même teal, les deux se disputaient le premier rang —
   pour un gris ardoise qui n'a AUCUN sens dans ce bloc : le teal y dit la
   correction, l'ambre le conseil, le vert la réussite, et l'étiquette est le
   seul élément qui gagne à n'avoir pas de couleur à lui. L'accent du niveau
   avait été essayé et écarté : l'ocre des niveaux 2 et 3 se confond avec
   l'ambre des conseils (essais/essai-entete-retroaction.html). */
.fb-t{display:flex;align-items:center;color:#6B7A82}
.fb-ic{width:17px;height:17px;flex:0 0 17px;fill:currentColor;margin-right:8px}
.status{font-size:13px;font-weight:800;color:#5E8A82;text-align:center;display:none;margin-top:8px}
.status.on{display:block}
.err{font-size:13px;font-weight:800;color:var(--no-ink);background:var(--no-bg);border:2px solid var(--no-line);border-radius:10px;padding:10px 14px;display:none;margin-top:8px}
.err.on{display:block}

/* ── ESSAI DE STYLE : "Je découvre" seulement (inspiré Wealthsimple) ── */
/* Fond neutre, cartes blanches épurées, police géométrique sobre, accent unique. */
body{
  /* Alias vers le système de design officiel (assets/design-system/) —
     ok-bg/no-bg/warn-bg/sel-bg/drop-bg viennent directement de
     tokens/colors.css (mêmes noms, ne pas les redéclarer ici). */
  --ws-bg:var(--surface-page); --ws-card:var(--surface-card); --ws-ink:var(--text-strong); --ws-sub:var(--text-muted);
  --ws-line:var(--border); --ws-accent:var(--accent); --ws-accent-bg:var(--accent-soft);
  /* Teinte propre à ce module (même couleur que sa plaquette dans le portail
     et la barre du lecteur) — seulement pour l'en-tête, le reste de
     l'interface garde l'accent vert unique du système de design. */
  --hdr-accent:#1D6B8F; --hdr-accent-soft:#E7F0F6;
  --pad-x:32px;      /* gouttière de page — identique partout */
  --pad-card:22px;   /* padding intérieur de TOUS les cadres */
  --bleed:-23px;     /* = -(var(--pad-card) + 1px de bordure) */
  --r-sm:10px; --r-md:18px; --r-pill:999px;
  background:var(--ws-bg);
  color:var(--ws-ink);
}
/* Tous les cadres : même bordure, même padding, même bord gauche/droit. */
.card{
  padding:22px;
  border:1px solid var(--ws-line);
  border-left:4px solid var(--sec-color,var(--ws-accent));
  border-radius:18px;
  box-shadow:0 1px 2px rgba(20,20,20,.04);
  /* `clip` et non `hidden` : les deux découpent l'en-tête débordant aux coins
     arrondis, mais `hidden` fait de la carte un conteneur de défilement, ce qui
     neutralise le `position:sticky` du banc de réponses à l'intérieur. */
  overflow:clip;
  transition:box-shadow .15s ease, transform .15s ease;
}
.card:hover{
  transform:translateY(-1px);
  box-shadow:0 6px 18px rgba(20,20,20,.07);
}
@media (prefers-reduced-motion:reduce){
  .card{transition:none}
  .card:hover{transform:none}
}
.c-hdr:first-child{
  margin:-22px -23px 16px -26px;
  padding:20px 22px 14px 26px;
  background:#FBFBF9;
  border-bottom:1px solid var(--ws-line);
}
.c-hdr:not(:first-child){
  padding-bottom:12px; margin-bottom:16px;
  border-bottom:1px solid var(--ws-line);
}
/* L'en-tête de l'exercice était le premier élément de la COLONNE des énoncés :
   le banc de réponses, colonne voisine, démarrait donc à la hauteur du bandeau
   de titre, très au-dessus des zones de dépôt. L'en-tête occupe maintenant la
   rangée entière (flex-basis:100%), et le banc commence vis-à-vis de la
   première zone à remplir. Le -4px annule le row-gap de 20px de la rangée
   pour retrouver exactement l'espacement d'origine (16px sous le bandeau). */
.exo-row > .c-hdr{flex:0 0 calc(100% + 49px); margin-bottom:-4px}
/* 49px = les débords gauche (26) et droit (23) de `.c-hdr:first-child` :
   sans eux dans la base flex, le bandeau resterait 49px trop court et ne
   rejoindrait pas les bords de la carte. */
.qcard,.blanks-p,.word-chip{
  background:var(--ws-card); border:1px solid var(--ws-line); border-left:1px solid var(--ws-line);
  border-radius:18px; box-shadow:0 1px 2px rgba(20,20,20,.04); color:var(--ws-ink); font-weight:500;
}
/* Prononciation = seul bloc teinté vert de la page — le distingue visuellement
   des cartes blanches qui portent le dialogue et ses exercices. */
.savoir{
  background:var(--ws-card); border:1px solid var(--ws-line); border-left:1px solid var(--ws-line);
  border-radius:18px; box-shadow:0 1px 2px rgba(20,20,20,.04); color:var(--ws-ink); font-weight:500;
}
/* Prononciation seulement (savoir.speak===true) — les autres encadrés de savoir
   (ex. grammaire) restent blancs comme les autres cadres. */
.savoir--pron{
  background:#F6FBF8;
  border-color:#D8ECE2;
  box-shadow:none;
}
/* Les énoncés vivent DANS une carte déjà encadrée (.card) — pas de double cadre :
   simple ligne de séparation entre rangées plutôt qu'une boîte par énoncé. */
.vf-row{background:transparent;border:none;border-radius:0;padding:0}
.stxt{background:transparent;border:none;border-radius:0;box-shadow:none;color:var(--ws-ink);font-weight:500;padding:10px 0}
.rows{gap:8px}
.vf-head{padding:0}
/* Échelle typographique unique : une seule règle pour les étiquettes majuscules.
   NOTE : .tag/.d-lbl/.vocab-tag restent à 15px (hors de ce groupe) — demande
   explicite de l'utilisateur que EXERCICE/VOCABULAIRE/DIALOGUE partagent la
   même taille entre eux, distincte des étiquettes plus discrètes ci-dessous. */
.hdr-eye,.audio-lbl,.savoir-band,
.vf-head-opt,.fb-t,.qlbl,.blbl{
  font-size:12px; font-weight:800; text-transform:uppercase; letter-spacing:.14em;
}
.tag{background:none!important;color:var(--sec,var(--ws-accent))!important;font-weight:800!important}
.ctit{color:var(--ws-ink)!important;font-weight:900!important}
.csub{color:var(--ws-sub)!important;font-weight:500}
.savoir-band{background:var(--ws-ink);color:#fff;border-radius:18px 18px 0 0;margin:0 -23px 16px}
.savoir--pron .savoir-band{background:var(--ws-accent)}
.savoir-gap{background:var(--ws-bg);border-color:var(--ws-line);margin:0 -23px 20px}
.savoir-row{border-bottom:1px solid var(--ws-line)}
.savoir-key{color:var(--ws-sub);font-weight:600}
.savoir-val{color:var(--ws-ink);font-weight:500}
.savoir--pron .savoir-row{border-bottom:1px solid #E4F0EA}
.savoir--pron .savoir-key{color:#4E7C6B}
.savoir--pron .word-chip{background:#fff;border:1px solid #D8ECE2}
.qlbl{color:var(--ws-accent)}
.qtxt,.stxt{color:var(--ws-ink);font-weight:600}
.vf-opt{border-radius:12px;border-color:var(--ws-line);background:var(--ws-card);color:var(--ws-sub);font-weight:600}
/* Après correction, le vert/rouge doit toujours l'emporter sur le bleu de
   sélection (sinon tout reste bleu et on ne voit plus où sont les erreurs). */
.vf-opt.sel.fb-ok{background:var(--ok-bg)!important;border-color:var(--ok-line)!important;color:var(--ok-ink)!important}
.vf-opt.sel.fb-no{background:var(--no-bg)!important;border-color:var(--no-line)!important;color:var(--no-ink)!important}
.tile{border-radius:12px;box-shadow:0 1px 2px rgba(20,20,20,.06)}
.btn,.word-chip .btn{
  font-family:inherit;border-radius:999px;font-weight:600;border:1px solid var(--ws-line);
}
.btn-ghost{background:var(--ws-card);color:var(--ws-ink)}
.btn-pri,.wbtn{background:var(--ws-ink)!important;color:#fff!important;border:none!important}
.winput{border-radius:12px;border-color:var(--ws-line);color:var(--ws-ink);font-weight:500;font-family:inherit}
.winput:focus{border-color:var(--ws-accent)}
.wfb b{color:var(--ok-ink)}
.fb-ok{animation:none!important}
.fb-no{animation:none!important}
.fb-ok::before{content:"✓ ";font-weight:800}
.fb-no::before{content:"✕ ";font-weight:800}
.icon-svg{filter:none;opacity:.75}
/* Badge rond seulement pour les boutons icône SEULE (sans texte à côté) —
   sinon un bouton comme "🔊 Écouter" se retrouve écrasé dans un rond de 34px. */
.btn-ghost:has(.icon-svg):not(.wlisten){
  width:34px;height:34px;padding:0;border-radius:50%;display:inline-flex;
  align-items:center;justify-content:center;background:transparent;border:none;
}
/* Icônes seules (haut-parleur) : pas de cadre, juste l'icône. */
.word-chip .btn{background:transparent!important;border:none!important;box-shadow:none!important}
.word-chip .btn:hover{background:color-mix(in srgb,var(--sec-color,var(--ws-accent)) 12%, transparent)!important}
.btn-ghost.wlisten{
  display:inline-flex;align-items:center;gap:8px;background:var(--ws-bg);
  border:1px solid var(--ws-line);border-radius:999px;padding:9px 18px;color:var(--ws-ink);font-weight:600;
}
.intro{background:var(--ws-card);color:var(--ws-ink);font-weight:600;border:1px solid var(--ws-line);border-radius:18px;margin:22px 32px 0;padding:18px 22px}
.dial-sec{background:var(--ws-card);color:var(--ws-ink);border:1px solid var(--ws-line);border-bottom:1px solid var(--ws-line)!important;border-radius:18px;align-items:stretch;padding:18px 22px;margin:22px 32px 0;overflow:hidden}
.situ{color:var(--ws-ink);opacity:1}
.vocab-sec{
  background:var(--ws-bg); border:none;
  border-top:1px solid var(--ws-line);
  border-radius:0 0 18px 18px;
  margin:18px -23px -19px;
  padding:18px 22px;
}
.vocab-tag{background:var(--ws-accent-bg);color:var(--ws-accent)}
.vw{background:var(--ws-card);border:1px solid var(--ws-line)}
.vw .dot{background:var(--ws-accent)}
.audio-pl{justify-content:center;padding-top:0}
.audio-lbl{color:var(--ws-sub);opacity:1}
.d-lbl{background:var(--ws-accent-bg);color:var(--ws-accent);opacity:1}
.mb{color:#2563EB}
.dr{color:var(--ws-accent)}
.btn-lu{background:var(--ws-bg);color:var(--ws-ink);border:1px solid var(--ws-line);border-radius:999px;font-weight:600}
.btn-lu.btn-audio{background:#DC2626!important;border-color:#DC2626!important;color:#fff!important}
.btn-lu.btn-audio:hover{background:#B91C1C!important;border-color:#B91C1C!important}
.btn-lu.btn-audio .icon-svg{filter:brightness(0) invert(1)!important;opacity:1!important}
/* Graphie-phonie en grille de cartes (modèle je-me-prepare.html) */
.ph-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px}
.ph-card{background:var(--ws-card,#fff);border:1px solid var(--ws-line,#EAEAE8);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:12px}
.ph-top{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.ph-word{font-size:21px;font-weight:900;color:var(--ws-ink,#17181A)}
.ph-word.ph-cache,.stxt.ph-cache{font-size:17px;font-weight:700;color:var(--ws-ink-3,#6B6F76);font-style:italic}
.btn-audio-round{width:44px;height:44px;flex-shrink:0;border-radius:50%;border:none;background:#DC2626;color:#fff;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;transition:background .15s}
.btn-audio-round:hover{background:#B91C1C}
.btn-audio-round .icon-svg{width:18px;height:18px;filter:brightness(0) invert(1)!important;opacity:1!important}
.ph-opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ph-opts .vf-opt{width:auto;flex:1 1 auto}
.savoir--pron .savoir-band{background:var(--sec-color,var(--ws-accent))}

/* ── « Ouvrir la mini-leçon » : mini-leçon en panneau latéral ─────────────
   Le bandeau noir d'un savoir reste un résumé. L'élève qui ne comprend pas
   ouvre ici une leçon complète : explication, anatomie, manipulation,
   exemples, pièges, micro-vérification. Aucun effet sur le score du module. */
.plus-bar{margin:14px var(--bleed) -17px;border-top:1px solid var(--ws-line)}
.savoir-row:has(+ .plus-bar){border-bottom:none}
.plus-open{width:100%;min-height:52px;background:transparent;border:none;border-radius:0 0 17px 17px;font-family:'Nunito',sans-serif;font-size:15px;font-weight:800;color:var(--ws-accent);cursor:pointer;display:flex;align-items:center;justify-content:center;gap:9px;transition:background .15s}
.plus-open:hover{background:var(--ws-accent-bg)}
.plus-open svg{width:17px;height:17px;flex-shrink:0}

#plus-ov{display:none;position:fixed;inset:0;z-index:9500;background:rgba(15,25,35,.5);backdrop-filter:blur(4px)}
#plus-ov.on{display:block}
#plus-panel{position:absolute;top:0;right:0;height:100%;width:min(700px,100%);background:var(--ws-bg);display:flex;flex-direction:column;box-shadow:-16px 0 48px rgba(0,0,0,.28);animation:plusIn .28s cubic-bezier(.22,1,.36,1)}
@keyframes plusIn{from{transform:translateX(48px);opacity:0}to{transform:none;opacity:1}}
@media(prefers-reduced-motion:reduce){#plus-panel{animation:none}}
#plus-hd{background:var(--ws-ink);color:#fff;padding:22px 26px;display:flex;align-items:flex-start;gap:16px;flex-shrink:0}
#plus-eye{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.14em;color:#8FE2B9}
#plus-tit{font-size:27px;font-weight:900;line-height:1.15;margin-top:7px}
#plus-close{margin-left:auto;width:44px;height:44px;flex-shrink:0;border-radius:50%;border:1px solid rgba(255,255,255,.32);background:rgba(255,255,255,.12);color:#fff;font-family:'Nunito',sans-serif;font-size:19px;font-weight:800;cursor:pointer}
#plus-close:hover{background:rgba(255,255,255,.26)}
#plus-body{flex:1;overflow-y:auto;padding:20px 26px 64px;display:flex;flex-direction:column;gap:16px}
.pl-blk{background:var(--ws-card);border:1px solid var(--ws-line);border-radius:18px;padding:20px 22px}
.pl-eye{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.14em;color:var(--ws-sub);margin-bottom:9px}
.pl-h{font-size:20px;font-weight:900;line-height:1.25;margin-bottom:9px}
.pl-p{font-size:17px;font-weight:500;line-height:1.6}
.pl-p b{font-weight:900}
.pl-p em,.pl-note em{font-style:italic;color:var(--ws-accent);font-weight:700}
.pl-note{font-size:15px;font-weight:600;color:var(--ws-sub);line-height:1.5;margin-top:12px}
.pl-end{color:var(--ws-accent);text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:3px}

.pl-ana{display:flex;flex-wrap:wrap;gap:9px;align-items:flex-end;margin:16px 0 4px}
.pl-tok{border:1px solid var(--ws-line);border-radius:14px;padding:9px 14px;background:var(--ws-bg);text-align:center;min-width:74px}
.pl-tok.is-key{border-color:var(--ws-accent);background:var(--ws-accent-bg)}
.pl-tok-lbl{display:block;font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.09em;color:var(--ws-sub);margin-bottom:5px}
.pl-tok-w{display:block;font-size:20px;font-weight:800}

.pl-axe{margin-bottom:14px}
.pl-axe-lbl{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.12em;color:var(--ws-sub);margin-bottom:7px}
.pl-opts{display:flex;gap:8px;flex-wrap:wrap}
.pl-opt{min-height:44px;padding:10px 16px;border-radius:22px;border:1px solid var(--ws-line);background:var(--ws-card);font-family:'Nunito',sans-serif;font-size:15px;font-weight:800;line-height:1.35;text-align:left;color:var(--ws-ink);cursor:pointer;transition:background .15s,border-color .15s}
.pl-opt:hover{border-color:var(--ws-accent)}
.pl-opt.on{background:var(--sel-bg);border-color:var(--sel-line);color:var(--sel-ink)}
.pl-opt.ok{background:var(--ok-bg);border-color:var(--ok-line);color:var(--ok-ink)}
.pl-opt.no{background:var(--no-bg);border-color:var(--no-line);color:var(--no-ink)}
.pl-out{background:var(--ws-ink);color:#fff;border-radius:16px;padding:20px;margin-top:4px;display:flex;align-items:center;justify-content:center;gap:14px;flex-wrap:wrap}
.pl-out-w{font-size:27px;font-weight:900;text-align:center;line-height:1.3}
.pl-out-w.is-long{font-size:21px}
.pl-out-w .pl-end{color:#8FE2B9}
.pl-out-n{flex-basis:100%;text-align:center;font-size:13px;font-weight:800;text-transform:uppercase;letter-spacing:.12em;color:#8FE2B9}
.pl-out .btn-audio-round{width:44px;height:44px}

.pl-ex{display:flex;align-items:center;gap:12px;padding:9px 0;border-bottom:1px solid var(--ws-line)}
.pl-ex:last-child{border-bottom:none}
.pl-ex-w{flex:1;min-width:0;font-size:17px;font-weight:700}
.pl-ex-t{font-size:12.5px;font-weight:800;color:var(--ws-sub);white-space:nowrap}

.pl-trap{padding:13px 0;border-bottom:1px solid var(--ws-line)}
.pl-trap:last-child{border-bottom:none;padding-bottom:0}
.pl-bad,.pl-good{display:flex;gap:9px;align-items:flex-start;font-size:17px;font-weight:700;line-height:1.45}
.pl-bad{color:var(--no-ink)}
.pl-good{color:var(--ok-ink);margin-top:5px}
.pl-why{font-size:15px;font-weight:600;color:var(--ws-sub);line-height:1.5;margin-top:7px}

.pl-q{padding:14px 0;border-bottom:1px solid var(--ws-line)}
.pl-q:last-child{border-bottom:none;padding-bottom:0}
.pl-qtxt{font-size:17px;font-weight:700;line-height:1.5;margin-bottom:10px}
.pl-fb{display:none;font-size:15px;font-weight:700;line-height:1.5;margin-top:10px}
.pl-fb.on{display:block}

@media(max-width:640px){#plus-panel{width:100%}#plus-tit{font-size:23px}#plus-body{padding:16px 18px 56px}.pl-blk{padding:18px}}

/* ── Proposition d'aide après plusieurs erreurs ────────────────────────
   Volontairement discrète et refusable : un panneau qui s'ouvrirait tout
   seul après un échec se lirait comme une punition. Ici l'élève choisit. */
.aide{
  margin-top:16px; padding:14px 16px;
  background:var(--warn-bg); border:1px solid var(--warn-line);
  border-left:4px solid var(--warn-line); border-radius:14px;
  display:flex; align-items:center; gap:14px; flex-wrap:wrap;
}
.aide-txt{flex:1 1 260px; font-size:15.5px; font-weight:600; line-height:1.5; color:var(--warn-ink)}
.aide-txt b{font-weight:900}
.aide-btns{display:flex; gap:8px; flex-wrap:wrap}
.aide .btn-oui{
  min-height:44px; padding:0 18px; border-radius:999px; border:none;
  background:var(--ws-ink); color:#fff;
  font-family:'Nunito',sans-serif; font-size:14.5px; font-weight:800; cursor:pointer;
}
.aide .btn-oui:hover{background:#000}
.aide .btn-non{
  min-height:44px; padding:0 16px; border-radius:999px;
  border:1px solid var(--border); background:transparent; color:var(--text-muted);
  font-family:'Nunito',sans-serif; font-size:14.5px; font-weight:700; cursor:pointer;
}
.aide .btn-non:hover{background:rgba(0,0,0,.04)}
.aide .btn-oui[disabled]{opacity:.45; cursor:default}
.aide .btn-oui .icon-svg{width:16px; height:16px; margin-right:6px;
  filter:brightness(0) invert(1)}
/* Réponse de l'assistant : sur fond blanc, détachée du bandeau d'alerte —
   c'est une explication, pas un message d'erreur de plus. */
.aide-out{display:none; flex-basis:100%}
.aide-out.on{display:block; margin-top:4px; padding:16px 18px;
  background:var(--surface-card); border:1px solid var(--border); border-radius:14px}
.aide-out.wait{font-size:15px; font-weight:600; color:var(--text-muted)}
.aide-out.no{color:var(--no-ink); font-size:15px; font-weight:700}
.ao-k{font-size:11.5px; font-weight:800; text-transform:uppercase;
  letter-spacing:.13em; color:var(--text-muted); margin-bottom:5px}
.ao-k:not(:first-child){margin-top:14px}
.ao-v{font-size:16.5px; font-weight:500; line-height:1.6; color:var(--text-strong)}
.ao-conseil{font-weight:800}
/* Le bloc vers lequel on emmène l'élève s'annonce brièvement, sinon il
   atterrit au milieu du panneau sans savoir pourquoi. */
.pl-blk.is-cible{
  box-shadow:0 0 0 3px var(--ws-accent);
  transition:box-shadow .4s ease;
}

/* ── Banc de réponses collant ──────────────────────────────────────────
   Dans un exercice long, les énoncés défilaient sous le banc de réponses :
   arrivé en bas, l'élève n'avait plus rien à glisser. Le banc reste
   maintenant à l'écran tant qu'on est dans l'exercice.
   --chrome-h est mesuré en JS (la barre d'onglets change de hauteur quand
   elle passe sur deux lignes ou que la bannière de sélection apparaît). */
.bsec.b1{
  position:sticky;
  top:calc(var(--chrome-h,72px) + 12px);
  max-height:calc(100vh - var(--chrome-h,72px) - 40px);
  overflow-y:auto;
  z-index:3;
}
/* En écran étroit, la colonne passe SOUS les énoncés : la coller en haut
   n'aurait aucun effet. On la colle en bas, en bande horizontale. */
@media(max-width:760px){
  /* La colonne des énoncés imposait min-width:300px — plus large que l'espace
     disponible sur un téléphone (375px moins les gouttières), donc les cartes
     et les zones de dépôt étaient rognées à droite par la carte.
     On force les deux colonnes à toute la largeur : elles s'empilent
     franchement au lieu de se disputer une rangée trop étroite. */
  .exo-main{min-width:0!important; flex:1 1 100%!important}
  .bsec.b1{flex:1 1 100%!important}
  .bsec.b1{
    position:sticky; top:auto; bottom:var(--oe-dock-h,0px);
    max-height:none;
    margin:0 calc(-1 * var(--pad-card)) calc(-1 * var(--pad-card));
    border-radius:0;
    border-left:none; border-right:none; border-bottom:none;
    box-shadow:0 -6px 18px rgba(20,20,20,.10);
    padding:10px 14px calc(10px + env(safe-area-inset-bottom));
  }
  .bsec.b1 .blbl{margin-bottom:6px}
  /* Les tuiles reviennent à la ligne. La file horizontale coupait la réponse
     à droite — 245 px de bande visible pour des tuiles de 370 px — et son
     défilement était le seul geste que le glisser-déposer confisquait. Le
     banc se borne à 40 % de l'écran pour ne pas manger l'exercice ; au-delà,
     il défile verticalement, comme le reste de la page. */
  .bsec.b1 .btiles,.bsec.b1 .btiles.vert{
    flex-direction:row; flex-wrap:wrap;
    overflow-x:hidden; overflow-y:auto;
    max-height:52vh;
    justify-content:flex-start;
    gap:8px; padding-bottom:4px;
    -webkit-overflow-scrolling:touch;
  }
  .bsec.b1 .btiles > *{flex:0 1 auto; max-width:100%}
  .bsec.b1 .tile{padding:7px 12px; font-size:16px; box-shadow:0 1px 4px rgba(0,0,0,.07)}
  .bsec.b1 .tn,.bsec.b1 .tv,.bsec.b1 .tf,.bsec.b1 .ta{font-size:16px}
  /* Deux vignettes par rangée, quelle que soit la largeur que le banc
     obtient — elle n'est pas celle de l'écran (305 px pour 390 px de
     téléphone, à cause des marges de la carte). Une largeur fixe de 150 px
     ne tenait pas à deux dans ces 277 px utiles : le banc montrait trois
     photos sur sept. En moitiés, la rangée est pleine par construction. */
  .bsec.b1 .imgtile{width:calc(50% - 4px)}
}
@media(prefers-reduced-motion:no-preference){
  .bsec.b1{scroll-behavior:smooth}
}

/* ── Gouttières d'un téléphone ─────────────────────────────────────────
   32 px de page plus 22 px de carte de chaque côté, c'était 108 px des
   390 px d'un iPhone — 28 % de l'écran perdus avant d'afficher un mot. Les
   valeurs de la page (--pad-x) sont écrites en dur dans les blocs de section
   depuis l'origine : on les reprend ici plutôt que de les refactoriser dans
   les quatre-vingt-sept modules. */
@media(max-width:640px){
  body{--pad-x:16px; --pad-card:16px; --bleed:-17px}
  #hdr{padding:20px 16px 24px}
  #tabs{padding:10px 16px}
  #sel-banner{padding:10px 16px}
  .dial-sec{padding:16px}
  .intro{padding:14px 16px}
  .exs{padding:18px 16px 40px}
  .vocab-sec{padding:14px 16px 18px}
  .cta{padding:22px 18px; margin:0 16px 24px}
  .card{padding:16px}
  /* Les cases à remplir tenaient la moitié d'une ligne de texte en hauteur
     pour un mot déposé : elles se serrent sur le mot, et l'interligne du
     paragraphe suit. */
  .blanks-p{font-size:18px; line-height:1.95}
  .blank{font-size:18px; min-width:var(--blank-w,92px); padding:2px 10px; line-height:1.25}
}


/* ── Lisibilité des encadrés de savoir ────────────────────────────────
   Deux besoins distincts, deux traitements. (1) Repérer les mots qui
   portent la règle : le <b> passe en 900 sur la couleur d'encre, assez
   marqué pour accrocher l'œil sans transformer la ligne en sapin de Noël.
   (2) Distinguer un exemple d'une règle : un exemple se lit comme une
   citation — retrait, filet coloré, italique dans la couleur de la
   section — donc on ne le confond plus avec l'explication qui précède. */
.savoir-val b,.savoir-val strong{font-weight:900;color:var(--ws-ink)}
.savoir-ex{
  display:block; margin:7px 0 1px; padding:8px 12px 8px 13px;
  border-left:3px solid var(--sec-color,var(--ws-accent));
  border-radius:0 10px 10px 0;
  background:#F5F6F7;
  font-style:italic; font-weight:700; line-height:1.45;
  color:var(--sec-color,var(--ws-accent));
}
/* Le fond reprend la couleur de la section, très dilué : --ws-accent-bg est
   vert quelle que soit la section, ce qui jurait avec un filet ambre ou
   rouille. Repli sur le gris neutre ci-dessus si color-mix manque. */
@supports (background:color-mix(in srgb,red 8%,transparent)){
  .savoir-ex{background:color-mix(in srgb,var(--sec-color,#1D6B8F) 8%,transparent)}
}
.savoir-ex + .savoir-ex{margin-top:5px}
/* Dans un exemple, le mot mis en avant reprend la couleur de l'exemple :
   sinon il sortirait du bloc au lieu d'y attirer l'attention. Le <em> des
   modules plus anciens (vert, italique) est repris ici par la même règle,
   sans quoi il jurerait avec un filet ambre ou rouille. */
.savoir-ex b,.savoir-ex strong,.savoir-ex em{color:inherit;font-weight:900;font-style:normal}
/* Rangée entièrement consacrée à des exemples : l'étiquette de gauche
   prend la même couleur, la paire se lit alors comme un seul bloc. */
.savoir-row.is-ex .savoir-key{color:var(--sec-color,var(--ws-accent));font-weight:800}
.savoir--pron .savoir-ex{background:#EEF7F1}
/* Sur téléphone, la grille 34 % / 1fr ne laissait que ~130 px à l'explication :
   les exemples s'y écrasaient sur cinq lignes. L'étiquette passe au-dessus. */
@media(max-width:640px){
  .savoir-row{grid-template-columns:1fr; gap:5px}
  .savoir-key{font-size:15px}
}

/* ── Jeu de rôle de « Je me lance » ─────────────────────────────────────────
   Les trois annonces sont publiques ; tout ce qui fonde l'écart
   d'information reste sur les fiches papier, jamais à l'écran. */
.jr-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;margin:16px 0 4px}
.jr-log{border:1px solid var(--ws-line);border-radius:14px;overflow:hidden;background:var(--ws-card)}
.jr-log-h{background:var(--sec-color,var(--ws-accent));color:#fff;padding:7px 13px;font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.1em}
.jr-log-a{padding:11px 13px;font-size:15px;font-weight:500;line-height:1.5}
.jr-log-a b{font-weight:900}
.jr-sub{margin:20px 0 9px;font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.14em;color:var(--ws-sub)}
.jr-sujets{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:7px 18px}
.jr-sujet{display:flex;align-items:center;gap:9px;font-size:15px;font-weight:600}
.jr-box{width:13px;height:13px;border:2px solid var(--sec-color,var(--ws-accent));border-radius:3px;flex-shrink:0}
.jr-gram{margin-top:18px;padding:13px 16px;border-radius:14px;background:var(--ws-bg);font-size:15px;font-weight:500;line-height:1.55}
.jr-gram-t{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.14em;color:var(--ws-sub);margin-bottom:6px}
.jr-print{margin-top:18px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.jr-print .btn{text-decoration:none}
.jr-print-n{font-size:14px;font-weight:500;color:var(--ws-sub);line-height:1.45}
@media(max-width:640px){.jr-sujets{grid-template-columns:1fr}}

/* Conversation avec l'assistant */
.jr-sep{height:1px;background:var(--ws-line);margin:24px var(--bleed) 20px}
.jr-choix-l{font-size:14px;font-weight:700;color:var(--ws-sub);margin:12px 0 7px}
.jr-opts{display:flex;gap:8px;flex-wrap:wrap}
.jr-opt{min-height:44px;padding:10px 16px;border-radius:22px;border:1px solid var(--ws-line);background:var(--ws-card);font-family:'Nunito',sans-serif;font-size:15px;font-weight:800;color:var(--ws-ink);cursor:pointer;transition:background .15s,border-color .15s}
.jr-opt:hover{border-color:var(--sec-color,var(--ws-accent))}
.jr-opt.on{background:var(--sel-bg);border-color:var(--sel-line);color:var(--sel-ink)}
/* JR-DESIGN-4A */
/* ── Jeu de rôle · écran de départ (remise design_handoff_jeu_de_role, 4a) ──
   Les tuiles gardent `.jr-opt` — c'est ce que balaient jrChoisir() et
   jrModeVoix(). Ce bloc vient APRÈS `.jr-opt.on` dans la feuille : à
   spécificité égale, c'est lui qui gagne, et l'annonce choisie échappe donc à
   la plaque encre pour prendre le filet vert que demande la remise. */
.jr-annonces{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px;margin:16px 0 0}
.jr-tuile{display:flex;flex-direction:column;align-items:stretch;justify-content:flex-start;
  padding:0;min-height:0;border-radius:18px;overflow:hidden;text-align:left;
  border:1px solid var(--ws-line);background:var(--ws-card);font-weight:600;transition:border-color .14s}
.jr-tuile.on{background:var(--ws-card);color:var(--ws-ink);
  border:2px solid var(--sec-color,var(--ws-accent))}
.jr-tuile:hover{border-color:var(--sec-color,var(--ws-accent))}
.jr-band{display:flex;align-items:center;gap:8px;padding:12px 20px;font-size:13px;font-weight:900;
  letter-spacing:.14em;text-transform:uppercase;background:var(--surface-sunken,#FBFBFA);
  border-bottom:1px solid var(--ws-line);color:var(--ws-sub)}
.jr-tuile.on .jr-band{background:var(--sec-color,var(--ws-accent));color:#fff;border-bottom-color:transparent}
.jr-tuile .jr-band-on{display:none}
.jr-tuile.on .jr-band-on{display:flex;align-items:center;gap:8px}
.jr-tuile.on .jr-band-off{display:none}
.jr-tuile-c{display:flex;flex-direction:column;gap:8px;padding:20px;flex:1}
.jr-tuile-t{font-size:24px;font-weight:900;color:var(--ws-ink);line-height:1.2}
.jr-tuile-d{font-size:17px;font-weight:600;color:var(--ws-sub);line-height:1.5}
.jr-tuile-d b{font-weight:900;color:var(--ws-ink)}
.jr-tuile.on .jr-tuile-d b{color:var(--sec-color,var(--ws-accent))}

.jr-reglages{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:16px}
.jr-carte{border:1px solid var(--ws-line);border-radius:18px;background:var(--ws-card);padding:20px}
.jr-champ-l{font-size:13px;font-weight:800;text-transform:uppercase;letter-spacing:.12em;
  color:var(--ws-sub);margin-bottom:12px}
.jr-tuiles{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.jr-tuiles .jr-opt{display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:8px;padding:16px;min-height:96px;border-radius:10px;text-align:center;font-size:17px;font-weight:700}
.jr-tuiles .jr-opt svg{flex-shrink:0}
/* La rangée « Écouter sans lire » est posée par greffe_ecouter_sans_lire.py
   juste après #jrModes : elle tombe donc dans la carte, sous les deux tuiles. */
.jr-carte #jrEcoute{margin-top:12px}
.jr-carte #jrEcoute .jr-opt{width:100%;min-height:44px;font-size:15px}
#jrMic svg{width:26px;height:26px}

.jr-bande{margin-top:16px;display:flex;align-items:center;justify-content:space-between;gap:24px;
  flex-wrap:wrap;padding:20px;border-radius:18px;background:var(--surface-band,#EDF6F1);
  border:1px solid var(--border-tint,var(--ws-line))}
.jr-bande-t{font-size:13px;font-weight:800;text-transform:uppercase;letter-spacing:.12em;
  color:var(--accent-ink,var(--ws-accent));margin-bottom:4px}
.jr-bande-p{font-size:17px;font-weight:600;color:var(--ws-ink);max-width:56ch;line-height:1.5}
.jr-bande .btn{flex-shrink:0;white-space:nowrap;min-height:52px;padding:0 24px;font-size:16px;font-weight:800}

.jr-rappel{margin-top:32px}
.jr-rappel-t{font-size:13px;font-weight:800;text-transform:uppercase;letter-spacing:.12em;
  color:var(--ws-sub);margin-bottom:12px}
.jr-rappel-g{display:grid;grid-template-columns:repeat(auto-fit,minmax(45%,1fr));gap:20px 24px;padding:20px;border-radius:18px;
  background:var(--surface-band,#EDF6F1);border:1px solid var(--border-tint,var(--ws-line))}
.jr-rappel-l{font-size:17px;font-weight:600;color:var(--ws-sub)}
.jr-rappel-x{font-size:17px;font-weight:700;color:var(--ws-ink);margin-top:2px;line-height:1.45}
/* La structure visée était en gras ; la remise la veut en teinte acier. Le gras
   reste dans le contenu des modules — c'est la couleur qui porte le repérage. */
.jr-rappel-x b{font-weight:700;font-style:normal;color:var(--acier-600,#1D6B8F)}
@media(max-width:900px){
  .jr-annonces{grid-template-columns:1fr}
  .jr-reglages,.jr-rappel-g{grid-template-columns:1fr}
}

/* Le bouton qui lance la conversation prend la couleur de la tâche au lieu de
   l'encre commune : c'est l'action à repérer dans un bloc qui contient déjà
   trois autres boutons noirs. `!important` parce que .btn-pri impose l'encre
   avec la même arme un peu plus haut. */
#jrStart{background:var(--sec-color,#C0573A)!important}
#jrStart:hover{filter:brightness(1.08)}
.jr-fil{margin:18px 0 12px;display:flex;flex-direction:column;gap:10px;max-height:420px;overflow-y:auto}
.jr-b{padding:11px 15px;border-radius:16px;font-size:16px;font-weight:500;line-height:1.55;max-width:82%}
.jr-b-q{display:block;font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.12em;opacity:.72;margin-bottom:4px}
.jr-b-ia{background:var(--ws-bg);border:1px solid var(--ws-line);align-self:flex-start;border-bottom-left-radius:5px}
.jr-b-moi{background:var(--sel-bg);color:var(--sel-ink);align-self:flex-end;border-bottom-right-radius:5px}
/* « Écouter sans lire » : la bulle de l'assistant garde sa place et son bouton
   de réécoute, seul son texte s'efface. Ce que l'élève a dit, lui, reste
   lisible — il doit pouvoir relire sa propre phrase. */
.jr-sans-texte .jr-b-ia .jr-txt{display:none}
.jr-sans-texte .jr-b-ia::after{content:'Texte caché — touchez le haut-parleur pour réécouter';
  display:block;font-size:13px;font-weight:700;font-style:italic;opacity:.6}
#jrEcoute{margin-top:10px}
.jr-saisie{display:flex;gap:9px;align-items:center}
.jr-saisie input{flex:1;min-height:46px;padding:10px 15px;border-radius:23px;border:1px solid var(--ws-line);background:var(--ws-card);font-family:'Nunito',sans-serif;font-size:16px;font-weight:500;color:var(--ws-ink)}
.jr-saisie input:focus{outline:none;border-color:var(--sec-color,var(--ws-accent))}
.jr-fin{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
/* Le bouton de réécoute est posé dans la bulle, pas à côté : il doit rester
   attaché à sa réplique quand le fil défile. */
.jr-b-ia{position:relative;padding-right:46px}
.jr-redire{position:absolute;top:9px;right:9px;width:30px;height:30px;border-radius:50%;border:1px solid var(--ws-line);background:var(--ws-card);cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0}
.jr-redire:hover{border-color:var(--sec-color,var(--ws-accent))}
.jr-redire .icon-svg{width:15px;height:15px}
.jr-mic{display:flex;align-items:center;gap:13px;margin:0 0 13px}
/* Au repos, le micro suit les autres boutons d'action du module (encre) ;
   l'enregistrement passe au rouge. La couleur de section est rouille dans
   cette tâche — l'utiliser au repos rendait les deux états indistincts. */
#jrMic{width:56px;height:56px;border-radius:50%;border:none;background:var(--ws-ink);color:#fff;font-size:23px;cursor:pointer;flex-shrink:0;transition:transform .12s,background .15s}
#jrMic:hover{transform:scale(1.05)}
#jrMic.rec{background:#C4362F;animation:jrPulse 1.3s ease-in-out infinite}
@keyframes jrPulse{0%,100%{box-shadow:0 0 0 0 rgba(180,52,47,.45)}50%{box-shadow:0 0 0 11px rgba(180,52,47,0)}}
@media(prefers-reduced-motion:reduce){#jrMic.rec{animation:none}}
.jr-mic-l{font-size:15px;font-weight:600;color:var(--ws-sub)}
@media(max-width:640px){.jr-b{max-width:92%}}

/* ── SECTION VOCABULAIRE ───────────────────────────────────────────────
   Trois exercices sur la même liste de mots + la traduction en langue
   maternelle. Aucune couleur en dur : tout passe par les jetons du système
   de design (assets/design-system/tokens/), déjà aliasés en --ws-* par le
   gabarit. Rien sous 17 px, cibles ≥ 44 px, la couleur jamais seule. */

/* Le gabarit fige .chip et .csub à 15 px. La charte est explicite : « jamais
   15 px pour un énoncé », consigne et définition valent --fs-body-sm (17 px) ;
   seuls les libellés d'interface (bouton 15 px, sur-titre 13 px) descendent
   plus bas. On remonte donc les deux, mais dans la seule section vocabulaire :
   le reste du module garde ses tailles tant qu'on ne l'a pas repris. */
#exo-prVocab .chip,#exo-vcRappel .chip,#exo-vcImage .chip{font-size:17px;line-height:1.5}
#exo-prVocab .csub,#exo-vcRappel .csub,#exo-vcImage .csub{font-size:17px}

/* En-tête de la section : le choix de la langue, mémorisé pour tous les modules. */
.voc-head{display:flex;align-items:center;gap:12px;flex-wrap:wrap;
  background:var(--ws-card);border:1px solid var(--ws-line);border-radius:var(--r-md);
  padding:16px var(--pad-card);margin-bottom:16px}
.voc-head-t{font-size:17px;font-weight:800;color:var(--ws-ink)}
.voc-head-s{font-size:17px;font-weight:500;color:var(--ws-sub);flex-basis:100%}
.voc-lang{font-family:inherit;font-size:17px;font-weight:700;color:var(--ws-ink);
  background:var(--ws-card);border:2px solid var(--ws-line);border-radius:var(--r-sm);
  padding:10px 14px;min-height:44px;cursor:pointer}
.voc-lang:hover{border-color:var(--ws-accent)}

/* Le bloc de traduction — masqué tant que l'élève ne le demande pas : une
   traduction visible d'emblée et le français n'est plus traité. */
.voc-tr{margin-top:14px;padding:14px 16px;border-radius:var(--r-sm);
  background:var(--ws-accent-bg);border:1px solid var(--ws-line)}
.voc-tr[hidden]{display:none}
.voc-tr-mot{font-size:19px;font-weight:900;color:var(--ws-ink);line-height:1.4}
.voc-tr-def{font-size:17px;font-weight:500;color:var(--ws-ink);line-height:1.6;margin-top:6px}
.voc-tr-ex{font-size:17px;font-weight:500;color:var(--ws-sub);line-height:1.6;margin-top:6px}
.voc-tr[dir="rtl"]{text-align:right}
.voc-tr-att{font-size:17px;font-weight:600;color:var(--ws-sub)}
/* Signalement : discret, mais atteignable au clavier et assez grand au doigt. */
.voc-flag{display:inline-block;margin-top:10px;padding:6px 0;min-height:44px;
  background:none;border:none;font-family:inherit;font-size:17px;font-weight:600;
  color:var(--ws-sub);text-decoration:underline dotted;cursor:pointer}
.voc-flag:hover{color:var(--ws-ink)}
.voc-flag[disabled]{cursor:default;text-decoration:none;opacity:.8}

/* ── Exercice 2 · Je me souviens du mot ─────────────────────────────── */
.vc-carte{text-align:center;padding:8px 0 4px}
.vc-mot{font-size:30px;font-weight:900;color:var(--ws-ink);line-height:1.25;
  margin-bottom:8px;word-break:break-word}
.vc-q{font-size:17px;font-weight:600;color:var(--ws-sub);margin-bottom:18px}
.vc-rep{text-align:left;border-top:1px solid var(--ws-line);margin-top:18px;padding-top:16px}
.vc-def{font-size:19px;font-weight:700;color:var(--ws-ink);line-height:1.55}
.vc-ex{font-size:17px;font-weight:500;color:var(--ws-sub);line-height:1.6;margin-top:8px}
.vc-ex strong{color:var(--ws-ink);font-weight:800}
.vc-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}
.vc-actions .btn{min-height:44px}
/* Notation : chaque bouton porte un glyphe, jamais la couleur seule. */
.vc-note{flex:1 1 200px;min-height:44px;font-family:inherit;font-size:17px;font-weight:800;
  border-radius:var(--r-sm);border:2px solid var(--ws-line);background:var(--ws-card);
  color:var(--ws-ink);cursor:pointer;padding:11px 16px}
.vc-note--su:hover{border-color:var(--ok-line);background:var(--ok-bg);color:var(--ok-ink)}
.vc-note--revoir:hover{border-color:var(--warn-line);background:var(--warn-bg);color:var(--warn-ink)}
.vc-bilan{font-size:19px;font-weight:800;color:var(--ws-ink);line-height:1.5;
  text-align:center;padding:10px 0 4px}
.vc-bilan-s{font-size:17px;font-weight:500;color:var(--ws-sub);margin-top:8px}

/* ── Exercice 3 · Le mot et son image ───────────────────────────────── */
.vc-photo{display:block;width:100%;max-width:380px;margin:0 auto 18px;
  aspect-ratio:3/2;object-fit:contain;border-radius:var(--r-md);
  border:1px solid var(--ws-line);background:var(--ws-bg)}
.vc-choix{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
.choice{min-height:44px;font-family:inherit;font-size:17px;font-weight:800;
  border-radius:var(--r-sm);border:2px solid var(--ws-line);background:var(--ws-card);
  color:var(--ws-ink);cursor:pointer;padding:12px 16px;text-align:center;
  transition:border-color .15s,background .15s}
.choice:hover{border-color:var(--ws-accent)}
.choice[aria-disabled="true"]{pointer-events:none}
/* Les trois états portent un glyphe ajouté en JS (✓ ✗ ←) : la couleur ne
   porte jamais l'information à elle seule. */
.choice.is-ok{border-color:var(--ok-line);background:var(--ok-bg);color:var(--ok-ink)}
.choice.is-no{border-color:var(--no-line);background:var(--no-bg);color:var(--no-ink)}
.choice.is-answer{border-style:dashed;border-color:var(--ok-line);color:var(--ok-ink)}

/* Focus clavier visible sur tout ce que la section ajoute. */

// ═══════════════════════════════════════════════════════════════════════
//  CHOISIR LA SUITE — Module interactif Niveau 6 (FLS)

  if(own) return own;
  try{ return new URLSearchParams(window.parent.location.search).get('code')||''; }catch(e){ return ''; }
}
const studentCode=getCode();

// ── DIALOGUES ─────────────────────────────────────────────────────────
const DIALOGUES = {
  // Quatre dialogues, un par section. Au niveau 6, ils font dix-huit à vingt
  // répliques et non dix à seize : la compétence vise « des discours détaillés
  // et structurés », et une conversation de trois répliques n'en est pas un.
  // Le même dossier — celui de Bintou — revient dans les quatre, sous quatre
  // formes différentes : le comptoir, l'entretien à deux, la lecture à deux
  // voix, la rencontre à quatre.
  //
  // Six personnages, quatre timbres. Voir l'en-tête de
  // generer_audio_module_n6_etablissement.py : deux personnages ne partagent
  // une voix que s'ils ne se répondent jamais.

  prep: {
    label: "Dialogue — Au comptoir de l'accueil, un mardi midi",
    lines: [
      ["BINTOU","Bonjour. Je m'excuse, je ne sais pas si c'est ici qu'il faut demander ça."],
      ["RÉAL","Bonjour. Demandez toujours, on verra bien. Vous êtes en francisation ?"],
      ["BINTOU","Oui, au local 214, le soir. Bintou Sangaré. Je finis mon dernier cours en février et je voudrais savoir ce que je fais après."],
      ["RÉAL","Ah. Ça, c'est une belle question, et ce n'est pas à moi qu'il faut la poser."],
      ["BINTOU","Ce n'est pas vous qui vous occupez des inscriptions ?"],
      ["RÉAL","Des inscriptions, oui. Des dossiers, des relevés de notes, des changements d'horaire, des attestations : tout ce qui est papier passe par le comptoir. Mais choisir un programme, c'est autre chose. Ça, c'est l'orientation."],
      ["BINTOU","L'orientation, c'est une personne ?"],
      ["RÉAL","C'est une personne, oui. Pascal Lachapelle, conseiller d'orientation. Il est ici le lundi et le jeudi. Son métier, c'est justement de s'asseoir avec quelqu'un et de regarder avec lui ce qui est possible."],
      ["BINTOU","Et il décide si je peux entrer dans un programme ?"],
      ["RÉAL","Non. Personne ne décide en parlant. Lui, il vous explique, il calcule vos préalables, il vous dit où ça bloque. La décision, elle arrive après, par écrit, du centre de formation professionnelle."],
      ["BINTOU","Par écrit."],
      ["RÉAL","Toujours par écrit. Ici, une chose qui compte finit toujours en papier : un avis, une lettre, une ligne dans votre dossier. Ce qui se dit au comptoir ne compte pas."],
      ["BINTOU","Et mon enseignant, monsieur Béliveau, il sert à quoi là-dedans ?"],
      ["RÉAL","À dire où vous en êtes en français, et ça pèse lourd. Il vous voit trois soirs par semaine ; le conseiller, lui, vous verra une heure. Amenez-le à la rencontre si vous en avez une."],
      ["BINTOU","Il y a une rencontre ?"],
      ["RÉAL","Il y en a une quand le dossier est assez avancé pour ça. Plusieurs personnes autour de la même table, une heure, et on repart avec un plan écrit. Mais commencez par l'orientation, sinon vous arriverez à la rencontre les mains vides."],
      ["BINTOU","D'accord. Qu'est-ce que je dois faire, alors ?"],
      ["RÉAL","Remplissez ceci — demande de rencontre, une page — et rapportez-le-moi. Écrivez en bas ce que vous cherchez : deux lignes suffisent, mais qu'elles soient précises. « Je veux de l'information » ne veut rien dire ; « je veux savoir quels préalables il me manque pour un DEP » veut dire quelque chose."],
      ["BINTOU","Et j'apporte quoi, à la rencontre ?"],
      ["RÉAL","Vos papiers. Tous vos papiers, même ceux que vous croyez inutiles. C'est le conseiller qui trie, pas vous."],
    ]
  },

  t1: {
    label: "Dialogue — Une heure avec le conseiller d'orientation",
    lines: [
      ["PASCAL","Entrez, madame Sangaré. Assoyez-vous. J'ai lu votre demande : vous cherchez à savoir quels préalables il vous manque. C'est déjà plus clair que la moitié de ce que je reçois."],
      ["BINTOU","Merci. Je me demande surtout par où commencer. J'ai travaillé six ans dans une pharmacie à Bamako, et ici je suis commis de soir depuis deux ans."],
      ["PASCAL","Commis dans une pharmacie ?"],
      ["BINTOU","Oui. Je range, je place les commandes, je réponds au téléphone. Ce que je faisais là-bas, je ne le fais plus ici."],
      ["PASCAL","Et vous aimeriez le refaire."],
      ["BINTOU","J'y pense tous les soirs. Mais je ne sais pas quoi faire de mes années là-bas. Personne ne me dit si ça compte ou si ça ne compte pas."],
      ["PASCAL","Alors commençons par là, parce que c'est là que les gens se découragent. Le programme qui mène à ce métier ici, c'est un diplôme d'études professionnelles : assistance technique en pharmacie. Un DEP."],
      ["BINTOU","Et pour y entrer ?"],
      ["PASCAL","Trois chemins. Le premier : un diplôme d'études secondaires, ou son équivalent reconnu. Le deuxième : avoir seize ans au trente septembre et les unités de quatrième secondaire en langue d'enseignement, en langue seconde et en mathématiques. Le troisième, celui qui vous concerne : avoir dix-huit ans et réussir le test de développement général, plus les préalables particuliers du programme."],
      ["BINTOU","Ça fait beaucoup de mots. Le test, il remplace le diplôme ?"],
      ["PASCAL","Non, et c'est la confusion la plus fréquente. Le test de développement général ouvre la porte d'un DEP, rien d'autre. Celui qui donne une équivalence de cinquième secondaire, c'est l'autre : le test d'équivalence de niveau de scolarité, sept épreuves, dont deux en français."],
      ["BINTOU","Et mes six ans de pharmacie, dans tout ça ?"],
      ["PASCAL","Ils ne remplacent aucun préalable. Ils servent ailleurs, et ils servent beaucoup : en stage, en entrevue, et devant un jury de reconnaissance des acquis. Ce n'est pas la même porte, mais ce n'est pas rien."],
      ["BINTOU","J'ai aussi un papier du ministère de l'Immigration. Une évaluation comparative."],
      ["PASCAL","Vous l'avez avec vous ?"],
      ["BINTOU","Oui. On m'a dit que c'était une équivalence."],
      ["PASCAL","On vous l'a mal dit, et ça arrive chaque semaine. Ce document est un avis d'expert : il dit à quel niveau d'ici vos études de là-bas se comparent. Ce n'est pas une équivalence de diplôme, ça ne remplace pas un permis, et ça ne garantit l'admission à aucun programme. Gardez-le : il explique votre parcours. Mais ne bâtissez pas votre année dessus."],
      ["BINTOU","Bon. Alors qu'est-ce que je fais, concrètement ?"],
      ["PASCAL","Trois choses, dans cet ordre. Vous finissez votre francisation en février — le français est le préalable dont dépendent tous les autres. Vous vous inscrivez au test de développement général : la prochaine séance est le vingt-huit novembre, l'inscription se fait au comptoir. Et vous demandez la description officielle du programme au centre de formation professionnelle, celle où les préalables particuliers sont écrits noir sur blanc."],
      ["BINTOU","Et si je rate le test ?"],
      ["PASCAL","Vous le reprenez. Personne ne le réussit deux fois par plaisir, mais personne n'est fermé après un échec non plus. On se revoit en janvier, et cette fois on aura des papiers à regarder au lieu de suppositions."],
    ]
  },

  t2: {
    label: "Dialogue — Deux papiers sur la table de la cafétéria",
    lines: [
      ["ROSA","Tu as reçu quoi, finalement ? Tu avais l'air blanche en sortant du comptoir."],
      ["BINTOU","Deux papiers. La description du programme, quatre pages, et un avis officiel du centre de formation professionnelle. Une page, celui-là. C'est la page qui me fait peur."],
      ["ROSA","Montre. Ah, ça commence par « Avis d'admission conditionnelle ». Conditionnelle, ça veut dire quoi ?"],
      ["BINTOU","Que je suis acceptée, mais pas vraiment."],
      ["ROSA","Non, attends, ce n'est pas ce qui est écrit. Regarde la ligne encadrée : la place est réservée jusqu'au six février, et elle est libérée si la condition n'est pas remplie à cette date."],
      ["BINTOU","Et la condition, c'est le test."],
      ["ROSA","C'est le test. « La candidate fournira la preuve de réussite du test de développement général. » Fournira. Au futur."],
      ["BINTOU","Pourquoi au futur ? Ce n'est pas une prédiction, c'est une obligation."],
      ["ROSA","C'est comme ça qu'ils écrivent. Chez nous aussi, à l'hôpital, tout était au futur. « Le patient se présentera à jeun. » Ça veut dire : présentez-vous à jeun, et ne discutez pas."],
      ["BINTOU","Et cette phrase-là : « Les documents se déposent au secrétariat avant le premier février » ? Qui les dépose ?"],
      ["ROSA","Toi. Ils ne le disent pas, mais c'est toi. Ils écrivent comme si les papiers marchaient tout seuls."],
      ["BINTOU","Ça me mêle. Quand personne n'est nommé, je ne sais jamais qui doit bouger."],
      ["ROSA","C'est le piège de ces textes-là. Prends l'habitude : quand tu lis « se dépose », « se remplit », « s'obtient », demande-toi tout de suite par qui. Neuf fois sur dix, c'est toi."],
      ["BINTOU","Regarde la description du programme, maintenant. La première page ne parle même pas du programme."],
      ["ROSA","Elle raconte l'histoire du centre. « Le centre ouvrit ses portes en mille neuf cent soixante-huit. » Ouvrit."],
      ["BINTOU","Personne ne parle comme ça."],
      ["ROSA","Personne ne le parle, mais tout le monde l'écrit. Dans ma classe du soir, mon enseignant appelle ça le temps des livres. Tu n'as pas à l'écrire : tu as juste à comprendre que « ouvrit », c'est « a ouvert »."],
      ["BINTOU","Et les préalables particuliers, ils sont où ?"],
      ["ROSA","Page trois, dans l'encadré gris, sous le titre en gras. C'est toujours dans l'encadré, ce qui compte. Le reste, c'est de la présentation."],
    ]
  },

  t3: {
    label: "Dialogue — La rencontre du 14 novembre, local 118",
    lines: [
      ["PASCAL","Merci d'être là. On a une heure. Madame Sangaré, je résume pour tout le monde en trois phrases, puis vous corrigerez si je me trompe."],
      ["BINTOU","D'accord."],
      ["PASCAL","Bintou Sangaré termine sa francisation en février. Elle vise le DEP en assistance technique en pharmacie. Elle a un avis d'admission conditionnelle, et la condition est la réussite du test de développement général."],
      ["BINTOU","C'est exact. J'ajoute une chose : le test est le vingt-huit novembre, et je suis inscrite."],
      ["AMÉLIE","C'est noté. De mon côté, je veux qu'une chose soit claire dès maintenant : le centre de formation professionnelle n'accorde aucun délai après le six février. Ce n'est pas de la sévérité, c'est le calendrier des groupes."],
      ["MARC-OLIVIER","Si je peux me permettre — sur le français, je n'ai aucune inquiétude. Bintou lit des textes officiels depuis septembre et elle les lit mieux que la moitié du groupe. Ce qui l'arrête, ce n'est pas la langue, c'est le vocabulaire administratif."],
      ["AMÉLIE","Ce n'est pas rien non plus. Nos consignes de laboratoire sont écrites comme cet avis-là."],
      ["MARC-OLIVIER","Justement. On travaille ça en classe depuis un mois."],
      ["BINTOU","Est-ce que je peux poser une question ?"],
      ["PASCAL","Allez-y."],
      ["BINTOU","Si je réussis le test le vingt-huit et que la preuve arrive en janvier, est-ce que ça suffit ?"],
      ["AMÉLIE","Si la preuve est au dossier avant le six février, oui, ça suffit. Ce que je demande, c'est que vous ne l'apportiez pas le cinq au soir."],
      ["BINTOU","Je le déposerai la semaine où je le reçois."],
      ["PASCAL","Écrivons-le. Amélie, il faudrait que le plan de formation mentionne cette date, sinon on la retrouvera nulle part en janvier."],
      ["AMÉLIE","Je l'écris. Autre chose : j'aimerais que madame Sangaré vienne visiter le laboratoire avant de décider. Beaucoup de gens s'inscrivent sans avoir vu la place où ils passeront neuf mois."],
      ["BINTOU","Pour ma part, je préférerais y aller après le test. Si j'y vais avant, je vais penser à ça pendant l'épreuve."],
      ["AMÉLIE","C'est raisonnable. Le trois décembre, alors."],
      ["MARC-OLIVIER","Une dernière chose, et j'y tiens : que quelqu'un lui envoie le compte rendu de cette rencontre par écrit. On a dit quatre dates en une heure."],
      ["PASCAL","Ça part demain. Madame Sangaré, à mon avis, votre dossier est en bien meilleur état que vous ne le croyez : ce qui vous manque, c'est un papier, et il a une date."],
      ["BINTOU","Merci. C'est la première fois que je sors d'ici avec quelque chose d'écrit."],
    ]
  },
};

  {id:'prep', no:'<img class="icon-svg tno-play" src="/assets/interactive/module-n6-etablissement/icons/play.svg" alt="">', title:'Je découvre', color:'#A5335F',

   intro:"Bintou Sangaré a trente-quatre ans. Elle est arrivée du Mali il y a trois ans et elle est commis de soir dans une pharmacie de quartier, à Sherbrooke ; le soir, trois fois par semaine, elle suit sa francisation au Centre d'éducation des adultes des Deux-Ruisseaux. Elle termine en février, et elle ne sait pas ce qui vient après. Au comptoir de l'accueil, Réal Duquette lui apprend d'abord une chose que personne ne dit à voix haute : dans un établissement, ce qui compte finit toujours en papier, et chaque question a sa personne.",

  {id:'t1', no:'1', title:"Défi 1 · La rencontre d'orientation", color:'#1D6B8F',
   lead:"Suivre un entretien d'une heure du début à la fin : les trois portes d'entrée d'un programme, ce qui compte et ce qui ne compte pas, et les mots qui renvoient à ce qui vient d'être dit.",

   dialogue:'t1', next:{id:'t2', tit:'Défi 2 · Les papiers du centre', sub:"Lire une description de programme et un avis officiel : ce qui est décidé, par qui, et pour quand."}},

   lead:"Lire un document scolaire officiel et une description de programme : trouver la condition, la date, l'encadré — et comprendre qui doit bouger quand personne n'est nommé.",

   dialogue:'t2', next:{id:'t3', tit:'Défi 3 · La rencontre du 14 novembre', sub:"Prendre sa place autour d'une table où quatre personnes parlent de votre dossier."}},

const FC_CARDS = [
  // Seize mots. La situation « Communication avec le personnel de
  // l'établissement » du niveau 6 n'a aucun lexique rattaché : ils sont
  // inventés à partir du seul savoir lexical qui la nomme — « vocabulaire lié
  // au domaine scolaire et aux programmes d'études : matières, orientation,
  // enseignement individualisé, etc. »
  //
  // Cinq mots pour les personnes et les papiers du centre, cinq pour la
  // démarche d'orientation, trois pour les écrits officiels, trois pour la

     ["« est-ce que » se change en « si »","<span class='savoir-ex'>Est-ce que mes années comptent ? → Je me demande <b>si</b> mes années comptent.</span> Devant « il », « si » s'écrit <b>s'il</b> — et jamais « si il »."],

     ["Avec un infinitif, c'est encore plus court","Quand le sujet est le même des deux côtés, on garde le mot interrogatif et on met l'infinitif. <span class='savoir-ex'>Je ne sais pas <b>comment</b> m'inscrire. · Je ne sais pas <b>quoi</b> faire de mes six ans.</span> Attention : c'est <b>quoi</b>, pas « que »."],
     ["Les verbes qui réclament cette forme","se demander, savoir, ignorer, vouloir savoir, dire, expliquer, demander, comprendre. Après eux, la question s'assied et ne se lève plus."],
   ]},

  {sec:'t2', id:'t2prog', type:'texte', num:'Exercice 1', tit:'Ce que dit la description du programme', color:'#B45309',

     "Trois voies mènent à l'admission. La première demande [[des|un diplôme d'études secondaires ou son équivalent reconnu]]. La deuxième s'adresse à la personne qui a seize ans au 30 septembre de l'année scolaire du début de la formation et qui détient [[unites|les unités de 4e secondaire en langue d'enseignement, en langue seconde et en mathématiques]]. La troisième s'adresse à la personne de dix-huit ans et plus : elle exige [[tdg|la réussite du test de développement général]] ainsi que les préalables particuliers du programme.",

     "Les demandes se déposent au secrétariat du pavillon B. [[limite|Le 6 février est la dernière journée où une place réservée demeure disponible]] ; passé cette date, elle est offerte à la personne suivante sur la liste.",

  {sec:'t2', id:'t2avis', type:'texte', num:'Exercice 2', tit:"L'avis d'admission conditionnelle", color:'#B45309',

   savoir:{h:"› Lire un avis officiel — à écouter et à répéter", speak:true, rows:[
     ["Le papier qui informe d'une décision","Un <b>avis officiel</b> ne se discute pas au comptoir : il annonce ce que l'établissement a décidé, et il porte toujours une date. Répondre à un avis se fait par écrit, jamais de vive voix.", ["un avis officiel"]],
     ["Une acceptation qui n'en est pas tout à fait une","Une <b>admission conditionnelle</b> réserve la place, elle ne la donne pas : elle tient tant qu'une condition écrite est remplie avant une date écrite. Passé cette date, la place repart.", ["une admission conditionnelle"]],
     ["Là où l'on met ce qu'il ne faut pas manquer","L'<b>encadré</b> d'un document contient la condition, la date limite ou le montant. Si tu ne dois lire qu'une chose sur une page, lis ce qui est entouré d'un trait.", ["un encadré"]],
     ["Le futur qui n'annonce rien","« La candidate fournira » n'est pas une prédiction : c'est un ordre poli. L'administration écrit au futur simple ce que la vie courante dirait à l'impératif."],
     ["Le verbe sans personne","« Les documents se déposent au secrétariat » ne dit pas qui les dépose. Neuf fois sur dix, c'est toi. Quand tu lis « se dépose », « se remplit », « s'obtient », demande-toi tout de suite par qui."],

     "Madame, votre demande d'admission au programme Assistance technique en pharmacie a été reçue le 21 octobre 2026. [[reserve|Une place vous est réservée dans le groupe qui commence le 2 mars 2027]]. Cette réservation est conditionnelle.",

  {sec:'t2', id:'t2ps', type:'match', num:'Exercice 3', tit:'Le temps qu\'on écrit et qu\'on ne parle pas', color:'#B45309',
   sub:"La première page de la description raconte l'histoire du centre. Associe chaque forme écrite à ce qu'on dirait à voix haute.",
   bankLbl:"Ce qu'on dirait à voix haute", zonePh:"glisse l'équivalent parlé ici",
   savoir:{h:"› Le passé simple : à reconnaître, jamais à écrire", rows:[
     ["Où tu le rencontreras","Dans les brochures, les historiques d'établissement, les romans, les documentaires. Jamais dans une conversation, jamais dans un courriel, jamais dans ce que tu écriras toi-même."],
     ["Ce que le programme demande","<b>Reconnaître les verbes courants à la 3e personne</b> et <b>associer le passé simple au passé composé</b>. C'est tout. Personne ne te demandera d'en produire un."],
     ["Les terminaisons à repérer","<b>-a</b> et <b>-èrent</b> pour les verbes en -er : <span class='savoir-ex'>il ouvrit… non : il ferma, ils fermèrent</span> ; <b>-it</b> et <b>-irent</b> ailleurs : <span class='savoir-ex'>il ouvrit, ils ouvrirent</span> ; <b>-ut</b> et <b>-urent</b> pour un troisième groupe : <span class='savoir-ex'>il reçut, ils reçurent</span>."],
     ["Les trois qui reviennent partout","<b>il fut</b> (il a été) · <b>il eut</b> (il a eu) · <b>il fit</b> (il a fait). Apprends ces trois-là et tu comprendras la moitié des historiques."],
     ["La façon de le lire","Traduis-le en passé composé dans ta tête et continue à lire. Ne t'arrête pas dessus : il ne porte jamais l'information importante d'un document administratif, il porte le décor."],
   ]},
   rows:[

  {sec:'t2', id:'t2passif', type:'write', num:'Exercice 4', tit:'Quand personne n\'est nommé', color:'#B45309', cols:2,
   sub:"Récris le verbe entre parenthèses à la forme des documents officiels : « se » suivi du verbe au présent.",
   savoir:{h:"› Le verbe pronominal à sens passif", rows:[
     ["Ce que c'est","Un verbe précédé de <b>se</b> qui ne veut pas dire « soi-même ». <span class='savoir-ex'>Les demandes <b>se déposent</b> au secrétariat.</span> Les demandes ne se déposent pas toutes seules : quelqu'un les dépose, et ce quelqu'un n'est pas nommé."],
     ["Pourquoi l'administration l'emploie","Parce qu'elle décrit une règle, pas un geste de quelqu'un en particulier. Le règlement vaut pour tout le monde, donc il ne nomme personne."],
     ["La question à se poser chaque fois","<b>Par qui ?</b> Neuf fois sur dix, la réponse est : par toi. <span class='savoir-ex'>Le formulaire se remplit en ligne. → C'est toi qui le remplis.</span>"],
     ["Comment le former","<b>se</b> + le verbe au présent, à la 3e personne, accordé avec ce qui subit l'action. <span class='savoir-ex'>la demande <b>se dépose</b> · les demandes <b>se déposent</b></span> Devant une voyelle, « se » devient « s' » : <span class='savoir-ex'>ce papier <b>s'obtient</b> au comptoir</span>."],

   savoir:{h:"› Le futur simple qui n'annonce pas l'avenir", rows:[
     ["Deux emplois, un seul temps","Le futur simple annonce ce qui arrivera — <span class='savoir-ex'>Le groupe commencera le 2 mars.</span> — mais il donne aussi un <b>ordre poli</b> : <span class='savoir-ex'>La candidate fournira la preuve de sa réussite.</span> Ce n'est pas une prédiction : c'est une obligation."],

     ["Comment on le forme","L'infinitif, plus les terminaisons <b>-ai, -as, -a, -ons, -ez, -ont</b>. <span class='savoir-ex'>déposer → vous dépos<b>erez</b> · fournir → elle fourn<b>ira</b></span>"],

     ["Ce qu'il faut en faire","Le traduire à l'impératif dans sa tête. <span class='savoir-ex'>Vous vous présenterez au local 118. → Présentez-vous au local 118.</span> Un élève qui lit ça comme une possibilité manque une obligation."],

     ["Le rendez-vous à plusieurs","Une <b>rencontre de suivi</b> réunit autour d'une table les personnes qui ont chacune une partie du dossier. Elle a une durée annoncée, et ce qui n'y est pas dit ne s'y décidera pas.", ["une rencontre de suivi"]],

     ["La trace de ce qui a été dit","Un <b>compte rendu</b> rapporte les décisions d'une rencontre. Le demander n'est ni impoli ni méfiant : c'est ce qui distingue une conversation d'un engagement.", ["un compte rendu"]],

const ZONES = {};
EXOS.forEach(ex => {
  if (ex.type === 'vf')     ex.rows.forEach(r => ZONES[r.id] = {cv:r.ok, zcat:'vf', exo:ex.id});
  if (ex.type === 'match')  ex.rows.forEach(r => ZONES[r.id] = {cv:r.aid, zcat:'id', exo:ex.id});

  if (ex.type === 'imgmatch') ex.rows.forEach(r => ZONES[r.id] = {cv:(r.ok!==undefined?r.ok:r.aid), zcat:'id', exo:ex.id});
  if (ex.type === 'rows')   ex.rows.forEach(r => ZONES[r.id] = {cv:r.cv, zcat:'id', exo:ex.id});
  if (ex.type === 'blanks') ex.segs.filter(s=>s.k==='b').forEach(s =>

// ── LMS TRACKING ──────────────────────────────────────────────────────
function lmsTrack(event, data) {
  try { window.parent.postMessage(Object.assign({lms:true, event:event}, data||{}), '*'); } catch(e) {}
  try {
    const up = new URLSearchParams(window.parent.location.search);
    const code = up.get('code'), actId = parseInt(up.get('activityId'))||null, title = up.get('title')||'';
    if (code && actId) {
      fetch('/api/student/progress', {
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify(Object.assign({code, activityId:actId, activityTitle:title, event}, data||{})),
      }).catch(()=>{});
    }
  } catch(e2) {}
}
const TR = {attempts:{}, correct:{}};
function trackPlacement(zid, ok) {
  if (ok && !TR.correct[zid]) {
    TR.correct[zid] = true;
    if (!(zid in TR.attempts)) TR.attempts[zid] = 0;
    const zonesDone = Object.keys(TR.correct).length;
    const firstTry = Object.keys(TR.correct).filter(k => (TR.attempts[k]||0)===0).length;
    const totalErrors = Object.keys(TR.attempts).reduce((s,k)=>s+(TR.attempts[k]||0),0);
    lmsTrack('exercise_completed', {zones:TOTAL_ZONES, zonesDone, firstTry, totalErrors});
  } else if (!ok && !TR.correct[zid]) {
    TR.attempts[zid] = (TR.attempts[zid]||0) + 1;
  }
  updateChip();
}

const AUDIO_V = '15';

// pour remplacer les emojis par une image (ex. '<img src="/assets/interactive/module-n6-etablissement/icons/speaker.svg">').
const ICON_SPEAK = '<img class="icon-svg" src="/assets/interactive/module-n6-etablissement/icons/speaker.svg" alt="Écouter">';

function charSlug(name){ return name.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/'/g,'').replace(/\s+/g,'_'); }

function playDialogue(dialId, btn){
  if(dlgBtn===btn && dlgState==='playing'){ pauseDialogue(); return; }
  if(dlgBtn===btn && dlgState==='paused'){ resumeDialogue(); return; }

/* VITESSE-VOIX:début — greffé par build/greffe_vitesse.py */
/* Le débit des MP3 est figé à la production ; celui de la lecture ne l'est
   pas. `playbackRate` étire le son sans le régénérer — et `preservesPitch`
   empêche la voix de descendre dans les graves en ralentissant, ce qui la
   rendrait plus difficile à comprendre, pas plus facile. Le choix suit
   l'élève d'un module à l'autre : celui qui a besoin de lent en a besoin
   partout. */
const VIT_CRANS = [
  {v:1,    lbl:'Débit normal'},
  {v:0.8,  lbl:'Débit lent'},
];
let vitCran = 0;
try{ vitCran = Math.min(1, Math.max(0, parseInt(localStorage.getItem('saaf-vitesse'),10) || 0)); }catch(e){}
const vitFacteur = ()=> VIT_CRANS[vitCran].v;
/* Le facteur d'un `Audio`, posé à la création — et reposé sur celui qui joue
   déjà, pour que le réglage s'entende tout de suite plutôt qu'au prochain
   extrait. */
function vitAudio(a){
  if(!a) return a;
  try{ a.preservesPitch = a.mozPreservesPitch = a.webkitPreservesPitch = true; }catch(e){}
  try{ a.playbackRate = vitFacteur(); }catch(e){}
  return a;
}
/* Les replis en synthèse vocale ont leur propre échelle de débit : le facteur
   s'y multiplie au lieu de s'y substituer, sinon le repli parlerait plus vite
   que le MP3 qu'il remplace. */
const vitTaux = base => Math.max(0.1, base * vitFacteur());
function vitAppliquer(){
  const b = document.getElementById('btn-vitesse');
  if(b){ b.textContent = VIT_CRANS[vitCran].lbl; b.setAttribute('data-cran', String(vitCran)); }
  if(typeof dlgAudio !== 'undefined' && dlgAudio) vitAudio(dlgAudio);
  // `dataset.palier` marque un son déjà ralenti à la synthèse : y ajouter
  // un playbackRate le ralentirait deux fois.
  if(typeof jrAudio !== 'undefined' && jrAudio && !jrAudio.dataset.palier) vitAudio(jrAudio);
}
document.addEventListener('DOMContentLoaded', ()=>{
  const b = document.getElementById('btn-vitesse');
  if(!b) return;
  b.addEventListener('click', ()=>{
    vitCran = (vitCran + 1) % VIT_CRANS.length;
    try{ localStorage.setItem('saaf-vitesse', String(vitCran)); }catch(e){}
    vitAppliquer();
  });
  vitAppliquer();
});
/* VITESSE-VOIX:fin */
function playAudioQueue(urls, idx, btn, dialId, allowFallback){
  if(idx>=urls.length){ finishDialogue(btn,dialId); return; }
  dlgAudio=vitAudio(new Audio(urls[idx]));
  dlgUsingSpeech=false;
  dlgState='playing'; btn.textContent='⏸ Pause';
  dlgAudio.onended=()=>playAudioQueue(urls, idx+1, btn, dialId, false);
  dlgAudio.onerror=()=>{
    if(allowFallback && idx===0){ playSpeechQueue(dlgFallbackLines, btn, dialId); }
    else{ playAudioQueue(urls, idx+1, btn, dialId, false); }
  };
  dlgAudio.play().catch(()=>{ if(allowFallback && idx===0){ playSpeechQueue(dlgFallbackLines, btn, dialId); } });
}
function playSpeechQueue(lines, btn, dialId){
  try{
    speechSynthesis.cancel();
    dlgUsingSpeech=true;
    const voices = speechSynthesis.getVoices();
    const fr = voices.filter(v=>/^fr/i.test(v.lang));
    lines.forEach((l,i)=>{
      const u=new SpeechSynthesisUtterance(l[1]);
      u.lang='fr-CA'; u.rate=vitTaux(0.95); u.pitch=(i%2===0)?1.12:0.9;
      if(fr.length) u.voice=(i%2===0)?fr[0]:(fr[1]||fr[0]);
      speechSynthesis.speak(u);
    });
    dlgState='playing'; btn.textContent='⏸ Pause';
    clearInterval(dlgPollIv);
    dlgPollIv=setInterval(()=>{
      if(!speechSynthesis.speaking){ clearInterval(dlgPollIv); finishDialogue(btn,dialId); }
    },400);
  }catch(e){}
}
function jsq(s){ return String(s).replace(/\\/g,'\\\\').replace(/'/g,"\\'"); }
// ── LECTURE AUDIO D'UN MOT OU D'UNE PHRASE ISOLÉE (synthèse vocale) ────
function speakText(btn, text){
  try{
    speechSynthesis.cancel();
    const old = btn ? btn.innerHTML : null;
    const reset = ()=>{ if(btn){ btn.disabled=false; btn.innerHTML=old; } };
    if(btn){ btn.disabled=true; btn.innerHTML=ICON_SPEAK+' …'; }
    const doSpeak = ()=>{
      try{
        const u=new SpeechSynthesisUtterance(text);
        u.lang='fr-CA'; u.rate=vitTaux(0.9);
        const voices=speechSynthesis.getVoices();
        const fr=voices.find(v=>/^fr/i.test(v.lang));
        if(fr) u.voice=fr;
        u.onend=reset; u.onerror=reset;
        speechSynthesis.speak(u);
        // Filet de sécurité : Chrome laisse parfois speechSynthesis coincé
        // sans jamais déclencher onend/onerror.
        setTimeout(()=>{ if(!speechSynthesis.speaking) reset(); }, 8000);
      }catch(e){ reset(); }
    };
    // Chrome ignore parfois un speak() appelé juste après cancel() dans le
    // même tick : un court délai évite ce bug connu.
    setTimeout(doSpeak, 60);
  }catch(e){}
}
// Essaie un vrai MP3 (assets/interactive/<module>/sons/<fileId>.mp3), retombe
// sur la synthèse vocale si le fichier est absent.
function playWord(btn, text, fileId){
  if(!fileId){ speakText(btn, text); return; }
  const url = `/assets/interactive/${MODULE_SLUG}/sons/${fileId}.mp3?v=${AUDIO_V}`;
  const old = btn ? btn.innerHTML : null;
  const reset = ()=>{ if(btn){ btn.disabled=false; btn.innerHTML=old; } };
  if(btn){ btn.disabled=true; btn.innerHTML=ICON_SPEAK+' …'; }
  const a=vitAudio(new Audio(url));
  a.onended=reset;
  a.onerror=()=>{ reset(); speakText(btn, text); };
  a.play().catch(()=>{ reset(); speakText(btn, text); });
}
