<!DOCTYPE html>
<html lang="fr"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>C'est l'heure des nouvelles ? — Module Niveau 4</title>
<link rel="stylesheet" href="/assets/design-system/styles.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#EDF6F4;font-family:'Nunito','Arial Rounded MT Bold',sans-serif;color:#123B32}
body{display:flex;flex-direction:column;min-height:100vh}
::-webkit-scrollbar{width:6px;height:6px}::-webkit-scrollbar-track{background:rgba(0,0,0,.04);border-radius:3px}::-webkit-scrollbar-thumb{background:rgba(0,0,0,.15);border-radius:3px}

#chrome{position:sticky;top:0;z-index:200}
#hdr{background:var(--hdr-accent-soft,var(--surface-band));color:var(--text-strong);padding:32px 32px 40px;display:flex;align-items:flex-start;justify-content:space-between;flex-wrap:wrap;gap:16px;border-bottom:1px solid var(--border-tint);flex-shrink:0}
.hdr-l{display:flex;align-items:center;gap:14px;flex:1 1 420px;min-width:0}
.hdr-ic{width:44px;height:44px;background:rgba(255,255,255,.18);border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:22px}
.hdr-eye{display:flex;align-items:center;gap:8px;font-size:var(--fs-label);font-weight:var(--fw-bold);text-transform:uppercase;letter-spacing:var(--ls-label);color:var(--hdr-accent,var(--text-accent));line-height:1}
.hdr-eye::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--hdr-accent,var(--accent));flex-shrink:0}
.hdr-h1{font-size:clamp(38px,6vw,62px);font-weight:900;line-height:1.05;margin:10px 0 0;letter-spacing:-.02em;color:var(--text-strong)}
.hdr-lead{max-width:56ch;margin-top:16px;font-size:19px;font-weight:500;line-height:1.5;color:var(--ws-sub,#6E7175)}
.hdr-lead:empty{display:none}
.hdr-r{display:flex;align-items:center;gap:14px}
#prog-chip{background:var(--hdr-accent-soft,var(--accent-soft));color:var(--hdr-accent,var(--accent-ink));border:1px solid transparent;border-radius:999px;padding:8px 18px;font-size:15px;font-weight:800;white-space:nowrap}
#btn-reset{background:var(--surface-card);color:var(--text-strong);border:1px solid var(--border);border-radius:999px;padding:10px 18px;font-family:'Nunito',sans-serif;font-size:15px;font-weight:800;cursor:pointer;white-space:nowrap;transition:background .15s}
#btn-reset:hover{background:var(--paper-100)}
#btn-reset:hover{background:rgba(255,255,255,.28)}

#tabs{position:sticky;top:0;z-index:5;background:rgba(247,247,245,.94);backdrop-filter:blur(8px);display:flex;gap:8px;padding:12px 32px;border-bottom:1px solid var(--border);flex-wrap:wrap}
.tab{min-height:var(--tap-min);border:1px solid var(--border);border-radius:999px;padding:0 16px;font-family:'Nunito',sans-serif;font-size:14px;font-weight:800;cursor:pointer;background:var(--surface-card);color:var(--text-body);transition:background .15s,border-color .15s;display:inline-flex;align-items:center;gap:8px}
.tab:hover{background:var(--paper-50)}
.tab .tno{width:9px;height:9px;border-radius:50%;background:var(--sec-color,var(--accent));flex-shrink:0;font-size:0;overflow:hidden}
.tab .tno-play{display:none}
.tab.on{background:var(--sel-bg);border-color:var(--sel-line);color:var(--sel-ink)}
.tab.on .tno{background:currentColor}
.tab.done{background:var(--ok-bg);border-color:var(--ok-line);color:var(--ok-ink)}
.tab .tchk{display:none;font-size:15px}
.tab.done .tchk{display:inline}

#sel-banner{background:var(--warn-bg);border-bottom:3px solid var(--warn-line);padding:10px 32px;display:none;align-items:center;gap:10px;font-size:19px;font-weight:800;color:var(--warn-ink);flex-shrink:0}
#sel-banner.on{display:flex}

.sec{display:none;flex-direction:column;border-top:3px solid var(--sec-color,transparent)}
.sec.on{display:flex}

.dial-sec{background:#123B32;color:#E8F5F2;padding:16px 32px;display:flex;flex-direction:column;gap:14px;border-bottom:4px solid #1D6B8F;flex-shrink:0}
.situ{font-size:17px;font-weight:600;line-height:1.5;opacity:.72}
.dial-grid{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:24px;align-items:center}
.field-label{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.14em;color:var(--ws-sub,#8A8D91);margin-bottom:6px}
.dial-aside{text-align:right;border-left:1px solid var(--ws-line,#EAEAE8);padding-left:24px;min-width:180px}
.dial-aside-tit{font-size:15px;font-weight:800}
.dial-aside-n{font-size:13px;font-weight:600;color:var(--ws-sub,#8A8D91);margin-top:6px}
.is-hidden{display:none!important}
@media(max-width:640px){.dial-grid{grid-template-columns:1fr}.dial-aside{text-align:left;border-left:none;border-top:1px solid var(--ws-line,#EAEAE8);padding:12px 0 0}}
.dial-hd{display:flex;align-items:center;justify-content:flex-start;gap:12px;flex-wrap:wrap}
.dial-hd .d-lbl{margin-bottom:0}
.dial-hd .btn-lu{width:auto;flex:0 0 auto;display:inline-flex;align-items:center;gap:8px;padding:5px 16px;border-radius:999px;font-size:14px;background:#DC2626!important;border-color:#DC2626!important;color:#fff!important}
.dial-hd .btn-lu .icon-svg{filter:brightness(0) invert(1)!important;opacity:1!important}
.dial-hd .btn-lu:hover{background:#B91C1C;border-color:#B91C1C}
.dial-hd .btn-lu .icon-svg{width:17px;height:17px}
.audio-pl{flex:0 0 160px;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding-top:6px;gap:10px}
.audio-lbl{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.15em;opacity:.6;text-align:center}
.btn-lu{background:rgba(255,255,255,.12);color:#E8F5F2;border:2px solid rgba(255,255,255,.35);border-radius:999px;padding:12px 22px;font-family:'Nunito',sans-serif;font-size:15px;font-weight:800;cursor:pointer;transition:all .15s;text-align:center;line-height:1.3;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px}
.btn-lu.big{padding:16px 20px;font-size:18px;display:flex;align-items:center;justify-content:center;gap:10px}
.btn-lu.big .icon-svg{width:22px;height:22px}
.btn-lu:hover{background:rgba(255,255,255,.25)}
.btn-lu.done{background:var(--ok-bg);border-color:var(--ok-line);color:var(--ok-ink)}
.dial-txt{flex:1;min-width:280px;display:flex;flex-direction:column;gap:7px;font-size:20px;font-weight:600;line-height:1.7;padding-right:8px}
.d-lbl{display:inline-block;background:rgba(255,255,255,.14);border-radius:999px;padding:5px 16px;font-size:15px;font-weight:800;text-transform:uppercase;letter-spacing:.1em;color:#7FD4C9;margin-bottom:6px;opacity:1}
.dl{line-height:1.7}.mb{color:#93C5FD;font-weight:800}.dr{color:#7FD4C9;font-weight:800}

.intro{background:#DCEFEB;padding:14px 32px;font-size:17px;font-weight:700;color:#154F68;line-height:1.5;border-bottom:2px solid #B7DED7}

.exs{flex:1;padding:22px 32px 48px;display:flex;flex-direction:column;gap:20px}
.cta{background:var(--ws-ink,#17181A);color:#fff;border-radius:18px;padding:26px 32px;margin:0 32px 32px;display:flex;align-items:center;justify-content:space-between;gap:20px;flex-wrap:wrap}
.cta-eyebrow{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.14em;color:#8FE2B9}
.cta-tit{font-size:22px;font-weight:900;margin-top:6px}
.cta-sub{font-size:14.5px;font-weight:500;color:#C7C9CC;margin-top:8px;max-width:50ch}
.cta-btn{background:var(--ws-accent,#0A8F5B)!important;color:#fff!important;border:none!important;font-size:15px;padding:12px 22px;flex-shrink:0}

.card{background:#fff;border-radius:18px;padding:22px 26px;box-shadow:0 4px 20px rgba(15,118,110,.08)}
.c-hdr{display:flex;align-items:center;flex-wrap:wrap;gap:10px;margin-bottom:20px;padding-bottom:16px;border-bottom:1px solid var(--border)}
.exo-num{flex-shrink:0;width:32px;height:32px;border-radius:10px;display:flex;align-items:center;justify-content:center;background:var(--accent-soft);color:var(--sec-color,var(--ws-accent));font-size:14px;font-weight:900}
.tag{font-size:13px;font-weight:800;text-transform:uppercase;letter-spacing:.12em;white-space:nowrap}
.ctit,.csub{flex-basis:100%}
.ctit{display:block;font-size:24px;font-weight:900;line-height:1.2}
.csub{display:block;font-size:15px;font-weight:600}
.exo-score{margin-left:auto;background:var(--ws-accent-bg,#E6F5EE);color:var(--sec-color,var(--ws-accent));padding:6px 12px;border-radius:999px;font-size:13px;font-weight:700;white-space:nowrap}
.pair-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}
@media(max-width:640px){.pair-grid{grid-template-columns:1fr}}
.pair-grid .stack{display:flex;flex-direction:column;gap:8px}
.chip{display:block;width:100%;text-align:left;padding:12px 16px;border-radius:12px;border:1.5px solid var(--ws-line,#EAEAE8);background:#fff;font-family:inherit;font-size:15px;font-weight:600;color:var(--ws-ink,#17181A);cursor:pointer;transition:border-color .15s,background .15s}
.chip:hover{border-color:var(--ws-accent,#0A8F5B)}
.chip.chip-word{font-weight:800}
.chip.is-active{border-color:var(--ws-accent,#0A8F5B);background:var(--ws-accent-bg,#E6F5EE);box-shadow:0 0 0 2px var(--ws-accent-bg,#E6F5EE)}
.chip.is-paired{border-color:var(--ok-line,#34A76B);background:var(--ok-bg,#E8F6EE);color:var(--ok-ink,#0A6B46);cursor:default;opacity:.85}
.chip.is-miss{border-color:var(--no-line,#DC2626);background:var(--no-bg,#FFF6F5)}
.chip[aria-disabled="true"]{pointer-events:none}

.savoir{background:#F1FBF9;border-left:5px solid #1D6B8F;border-radius:0 14px 14px 0;padding:0 22px 16px;margin-bottom:4px;overflow-x:auto}
.savoir-gap{background:#EDF6F4;height:20px;margin:0 -26px 20px;border-top:1px solid rgba(15,118,110,.1);border-bottom:1px solid rgba(15,118,110,.1)}
.savoir-band{background:#1D6B8F;color:#fff;font-size:12.5px;font-weight:800;text-transform:uppercase;letter-spacing:.14em;padding:9px 22px;margin:0 -22px 16px;border-radius:0 14px 0 0}
.savoir-row{display:grid;grid-template-columns:34% 1fr;gap:10px;padding:10px 0;border-bottom:1px dashed #B7DED7}
.savoir-row:last-child{border-bottom:none}
.savoir-key{font-weight:900;color:#154F68;font-size:17px}
.savoir-val{font-size:17px;font-weight:600;line-height:1.5}
.savoir em{font-style:italic;color:#0A6B57}
.word-chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.word-chip{display:flex;flex-wrap:wrap;align-items:center;gap:6px;background:#FFFFFF;border:1.5px solid #CFE9E3;border-radius:20px;padding:4px 6px 4px 14px}
.word-chip .wc-word{font-weight:800;color:#123B32;font-size:15px;margin-right:2px;white-space:nowrap}
.word-chip .wc-phrase{font-weight:500;white-space:normal}
.word-chip .wc-phrase b{font-weight:800}
.word-chip .btn{padding:0!important;width:40px!important;height:40px!important;display:inline-flex;align-items:center;justify-content:center;font-size:14px;border-radius:14px}
.icon-svg{width:1em;height:1em;vertical-align:middle;display:inline-block}
.btn .icon-svg{width:15px;height:15px}
.btn-ghost.wlisten .icon-svg,.btn-lu .icon-svg{width:17px;height:17px;margin-right:4px}
.word-chip .pron-fb{flex-basis:100%;order:99;margin:4px 0 0}
@media(max-width:640px){.savoir td:first-child{width:auto}.savoir table,.savoir tbody,.savoir tr,.savoir td{display:block;width:100%}.savoir td{border-bottom:none;padding:4px 0}.savoir tr{padding-bottom:10px;border-bottom:1px dashed #B7DED7;margin-bottom:6px}}

.rows{display:flex;flex-direction:column;gap:8px}
.rrow{display:flex;align-items:center;gap:10px}
.stxt{flex:1;background:#F1F9F7;border-radius:10px;padding:14px 18px;font-size:20px;font-weight:700;color:#123B32;line-height:1.4}
.rrow2{display:grid;grid-template-columns:1fr 1fr;gap:8px;align-items:stretch}
.qcard{background:#F0FAF7;border-left:4px solid #1D6B8F;border-radius:0 10px 10px 0;padding:12px 16px;display:flex;flex-direction:column;justify-content:center}
.qlbl{font-size:13px;font-weight:800;color:#1D6B8F;text-transform:uppercase;letter-spacing:.1em;margin-bottom:4px}
.qtxt{font-size:20px;font-weight:700;color:#123B32;line-height:1.4}
.timelbl{flex:0 0 90px;background:var(--warn-bg);border-radius:10px;padding:12px 8px;font-size:15px;font-weight:900;color:var(--warn-ink);text-align:center}
.blanks-p{font-size:20px;line-height:2.9;font-weight:600;color:#123B32}

.zone{display:flex;align-items:center;justify-content:center;min-height:54px;border-radius:10px;font-weight:800;font-family:'Nunito',sans-serif;cursor:pointer;transition:background .18s,border-color .18s,color .18s,transform .12s;user-select:none;text-align:center;padding:10px 14px;border:2.5px solid;line-height:1.35}
.zone.empty{background:var(--drop-bg);border-color:var(--drop-line);border-style:dashed;color:#5A6B7D;font-size:17px}
.zone.dov{background:#E0F2FE!important;border-color:#38BDF8!important;border-style:solid!important;transform:scale(1.02)}
.zvf{min-width:150px;font-size:20px}
.f-vrai{background:var(--ok-bg);border-color:var(--ok-line);border-style:solid;color:var(--ok-ink)}
.f-faux{background:var(--no-bg);border-color:var(--no-line);border-style:solid;color:var(--no-ink)}
.zone.filled{background:var(--sel-bg);border-color:var(--sel-line);border-style:solid;color:var(--sel-ink);font-size:17px}
.fb-ok{background:var(--ok-bg)!important;border-color:var(--ok-line)!important;border-style:solid!important;color:var(--ok-ink)!important}
.fb-no{background:var(--no-bg)!important;border-color:var(--no-line)!important;border-style:solid!important;color:var(--no-ink)!important;animation:shk .5s ease}
@keyframes shk{0%,100%{transform:translateX(0)}20%{transform:translateX(-6px)}60%{transform:translateX(6px)}80%{transform:translateX(-3px)}}

.vf-head{display:flex;align-items:center;gap:10px;margin-bottom:6px;padding:0 12px}
.vf-head-txt{flex:1}
.vf-head-opts{display:flex;gap:8px;flex:0 0 auto}
.vf-head-opt{width:72px;flex:0 0 72px;text-align:center;font-size:12px;font-weight:900;color:#64748B;text-transform:uppercase;letter-spacing:.06em}
.vf-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:#F8FDFC;border:1.5px solid #DCEEEA;border-radius:12px;padding:10px 12px}
.vf-row .stxt{background:transparent;padding:4px 0}
.vf-opts{display:flex;gap:8px;flex:0 0 auto;margin-left:auto}
.pron-fb{flex-basis:100%;font-size:13px;font-weight:800;display:inline-block;margin:2px 0 4px}
.pron-fb.ok{color:var(--ok-ink)}
.pron-fb.no{color:var(--no-ink)}
.pron-fb.warn{color:var(--warn-ink)}
.vf-opt{width:72px;flex:0 0 72px;min-height:44px;border-radius:10px;border:2.5px solid #CBD5E1;background:#F8FAFC;color:#64748B;font-weight:800;font-family:'Nunito',sans-serif;cursor:pointer;transition:background .15s,border-color .15s,color .15s}
.vf-opt:hover{border-color:#94A3B8}
.vf-opt.sel{background:var(--sel-bg)!important;border-color:var(--sel-line)!important;border-style:solid;color:var(--sel-ink)!important}
.vf-opt.fb-ok{background:var(--ok-bg)!important;border-color:var(--ok-line)!important;border-style:solid!important;color:var(--ok-ink)!important}
.vf-opt.fb-no{background:var(--no-bg)!important;border-color:var(--no-line)!important;border-style:solid!important;color:var(--no-ink)!important}
.vf-summary{font-size:13px;font-weight:800}
.vf-summary.ok{color:var(--ok-ink)}
.vf-summary.warn{color:var(--warn-ink)}

.blank{display:inline-block;min-width:130px;padding:4px 14px;margin:0 3px;border-radius:8px;font-weight:800;vertical-align:middle;cursor:pointer;transition:background .18s,border-color .18s,color .18s;user-select:none;border:2.5px dashed #93C5D6;background:#F0F9FF;color:#94A3B8;font-size:20px;text-align:center}
.blank.filled{border-style:solid;border-color:var(--sel-line);background:var(--sel-bg);color:var(--sel-ink)}
.blank.fb-ok{border-style:solid;border-color:var(--ok-line);background:var(--ok-bg);color:var(--ok-ink)}
.blank.fb-no{border-style:solid;border-color:var(--no-line);background:var(--no-bg);color:var(--no-ink);animation:shk .5s ease}
.blank.dov{border-style:solid;border-color:var(--sel-line);background:var(--sel-bg)}

.bsec{border-radius:12px;padding:14px 12px;flex-shrink:0}
.bsec.b1{background:#EDF6F4;border:1.5px solid #B7DED7}
.blbl{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.14em;margin-bottom:10px;color:#1D6B8F}
.btiles{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.btiles.vert{flex-direction:column;flex-wrap:nowrap}

.tile{border-radius:10px;font-weight:800;font-family:'Nunito',sans-serif;cursor:grab;transition:all .15s;user-select:none;border:2.5px solid;box-shadow:0 2px 7px rgba(0,0,0,.08);padding:10px 14px;display:flex;align-items:center;justify-content:center;text-align:center;line-height:1.35}
.tile:active{cursor:grabbing;transform:scale(1.04);box-shadow:0 5px 14px rgba(0,0,0,.15)}
.tile.sel{background:var(--warn-bg)!important;border-color:var(--warn-line)!important;color:var(--warn-ink)!important;box-shadow:0 0 0 4px rgba(217,136,11,.22),0 2px 7px rgba(0,0,0,.08)!important;transform:translateY(-1px)}
.tv{background:var(--ok-bg);border-color:var(--ok-line);color:var(--ok-ink);font-size:20px;padding:13px 22px}
.tf{background:var(--no-bg);border-color:var(--no-line);color:var(--no-ink);font-size:20px;padding:13px 22px}
.tn{background:var(--ws-card);border-color:var(--ws-line);color:var(--ws-ink);font-size:17px}
.ta{background:var(--warn-bg);border-color:var(--warn-line);color:var(--warn-ink);font-size:15px}
.bempty{font-size:13px;color:#5A6B7D;font-weight:600;text-align:center;padding:8px 0;font-style:italic}

.ghost{position:fixed;z-index:9999;pointer-events:none;opacity:.88;transform:scale(1.06) rotate(1.5deg);box-shadow:0 8px 24px rgba(0,0,0,.25);border-radius:10px}

/* Association image */
.imgtile{width:100px;height:100px;border-radius:10px;overflow:hidden;cursor:grab;border:2.5px solid #5EEAD4;box-shadow:0 2px 7px rgba(0,0,0,.08);transition:all .15s;flex:none}
.imgtile img{width:100%;height:100%;object-fit:cover;display:block;pointer-events:none}
.imgtile:active{cursor:grabbing;transform:scale(1.04)}
.imgtile.sel{border-color:#FBBF24;box-shadow:0 0 0 4px rgba(245,158,11,.22)}
.imgzone{width:100%;min-height:110px;border-radius:10px;border:2.5px dashed #93C5D6;background:#F0F9FF;display:flex;align-items:center;justify-content:center;cursor:pointer;overflow:hidden;transition:all .15s}
.imgzone img{width:100%;height:100%;object-fit:cover;display:block;pointer-events:none}
.imgzone-ph{font-size:13px;color:#5A6B7D;padding:10px}
.imgzone.dov{border-color:var(--sel-line);background:var(--sel-bg)}
.imgzone.filled{border-style:solid;border-color:var(--sel-line)}
.imgzone.fb-ok{border-style:solid;border-color:var(--ok-line)}
.imgzone.fb-no{border-style:solid;border-color:var(--no-line);animation:shk .5s ease}

#fc-overlay{display:none;position:fixed;inset:0;z-index:9000;background:rgba(15,25,35,.6);backdrop-filter:blur(5px);align-items:center;justify-content:center}
#fc-overlay.on{display:flex}
#fc-box{background:#1D6B8F;border-radius:24px;padding:44px 56px;max-width:760px;width:92%;box-shadow:0 24px 64px rgba(0,0,0,.4);display:flex;flex-direction:column;align-items:center;gap:20px;animation:fcPop .3s cubic-bezier(.34,1.4,.64,1)}
@keyframes fcPop{from{transform:scale(.82);opacity:0}to{transform:scale(1);opacity:1}}
#fc-counter{font-size:12px;font-weight:900;text-transform:uppercase;letter-spacing:.22em;color:rgba(255,255,255,.5)}
#fc-word{font-size:36px;font-weight:900;color:#fff;text-align:center;line-height:1.2;border-bottom:2px solid rgba(255,255,255,.18);padding-bottom:18px;width:100%}
#fc-def{font-size:21px;font-weight:700;color:#fff;line-height:1.6;text-align:center}
#fc-ex{font-size:18px;font-weight:600;color:rgba(255,255,255,.78);line-height:1.6;text-align:center;font-style:italic}
#fc-ex strong{font-weight:900;font-style:normal;color:#fff}
#fc-def.hidden,#fc-ex.hidden{display:none}
#fc-reveal-btn{background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.4);color:#fff;border-radius:8px;padding:12px 20px;font-family:'Nunito',sans-serif;font-size:14px;font-weight:800;cursor:pointer}
#fc-reveal-btn:hover{background:rgba(255,255,255,.38)}
#fc-reveal-btn.hidden{display:none}
#fc-btns{display:flex;gap:14px;margin-top:6px;flex-wrap:wrap;justify-content:center}
.fc-btn{background:rgba(255,255,255,.15);border:2px solid rgba(255,255,255,.38);color:#fff;border-radius:10px;padding:10px 22px;font-family:'Nunito',sans-serif;font-size:15px;font-weight:800;cursor:pointer}
.fc-btn:hover{background:rgba(255,255,255,.28)}

.vocab-sec{background:#EDF6F4;border-bottom:3px solid rgba(15,118,110,.15);padding:14px 32px 18px}
.vocab-tag{background:#1D6B8F;color:#fff;border-radius:999px;padding:5px 16px;font-size:15px;font-weight:800;text-transform:uppercase;letter-spacing:.1em}
.vocab-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px 20px}
.vw{display:flex;align-items:baseline;gap:8px;padding:7px 10px;border-radius:8px;background:rgba(255,255,255,.6);cursor:pointer}
.vw span.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#1D6B8F;flex-shrink:0}
.vw span.w{font-size:17px;font-weight:700;color:#123B32}

/* Sections personnalisées (oral / écrit / autoéval) */
.custom{max-width:none}
.custom .lead,.custom .wq,.custom .self-txt{max-width:68ch}
.lead{font-size:15px;font-weight:700;color:#3B6156;line-height:1.6;margin-bottom:14px}
/* Blocs de production (oral / écrit) — refonte */
.prod-eyebrow{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.prod-num{flex:none;width:26px;height:26px;border-radius:8px;background:#E6F5EE;color:#0A8F5B;font-size:13px;font-weight:900;display:flex;align-items:center;justify-content:center}
.prod-kind{font-size:12px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:#0A8F5B}
.prod-tit{font-size:26px;font-weight:900;line-height:1.2;color:#17181A;margin:0 0 8px}
.prod-lead{margin:0 0 20px;font-size:16px;font-weight:600;line-height:1.6;color:#6E7175;max-width:62ch;text-wrap:pretty}
.plan{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:24px}
.plan-step{border:1px solid #EAEAE8;border-left:4px solid #0A8F5B;border-radius:12px;padding:14px 16px;background:#FCFCFB}
.plan-no{font-size:11px;font-weight:900;letter-spacing:.12em;color:#0A8F5B;margin-bottom:6px}
.plan-t{font-size:17px;font-weight:800;color:#17181A;margin-bottom:6px}
.plan-ex{font-size:14px;font-weight:600;font-style:italic;line-height:1.5;color:#6E7175}
.rec-panel{border:1px solid #EAEAE8;border-radius:16px;background:#F7F7F5;overflow:hidden;margin-bottom:12px}
.rec-steps{display:flex;background:#fff;border-bottom:1px solid #EAEAE8}
.rec-step{flex:1;display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:3px solid transparent}
.rec-step .n{flex:none;width:24px;height:24px;border-radius:999px;background:#EAEAE8;color:#6E7175;font-size:12px;font-weight:900;display:flex;align-items:center;justify-content:center}
.rec-step .l{font-size:14px;font-weight:800;color:#6E7175}
.rec-step.on{border-bottom-color:#0A8F5B}
.rec-step.on .n{background:#0A8F5B;color:#fff}
.rec-step.on .l{color:#17181A}
.rec-body{display:flex;align-items:center;gap:22px;padding:24px 26px}
#recBtn{flex:none;width:88px;height:88px;border-radius:999px;border:none;background:#DC2626;box-shadow:0 4px 16px rgba(220,38,38,.28);cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0}
#recBtn .dot{display:block;width:26px;height:26px;border-radius:999px;background:#fff;transition:border-radius .15s ease}
#recBtn.recording{animation:pulse 1.2s infinite}
#recBtn.recording .dot{border-radius:5px;width:24px;height:24px}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(220,38,38,.45)}70%{box-shadow:0 0 0 16px rgba(220,38,38,0)}100%{box-shadow:0 0 0 0 rgba(220,38,38,0)}}
.rec-lbl{font-size:19px;font-weight:800;color:#17181A;margin-bottom:4px}
.rec-hint{font-size:15px;font-weight:600;color:#6E7175}
.req{border:1px solid #EAEAE8;border-radius:14px;overflow:hidden;margin-bottom:20px}
.req-hd{background:#F7F7F5;border-bottom:1px solid #EAEAE8;padding:10px 16px;font-size:13px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:#6E7175}
.req-grid{display:grid;grid-template-columns:1fr 1fr}
.req-it{display:flex;align-items:center;gap:12px;min-height:52px;padding:8px 16px;cursor:pointer;border-bottom:1px solid #EAEAE8;font-size:16px;font-weight:700;color:#17181A}
.req-it:nth-child(odd){border-right:1px solid #EAEAE8}
.req-it:nth-last-child(-n+2){border-bottom:none}
.req-it input{position:absolute;opacity:0;width:0;height:0}
.req-box{flex:none;width:24px;height:24px;border-radius:7px;border:2px solid #D6D6D2;background:#fff;display:flex;align-items:center;justify-content:center;color:#fff;font-size:14px;font-weight:900}
.req-it input:checked + .req-box{background:#0A8F5B;border-color:#0A8F5B}
.req-it input:checked + .req-box::after{content:"✓"}
.req-it input:focus-visible + .req-box{outline:3px solid #0A8F5B;outline-offset:2px}
.req-note{border-top:1px solid #EAEAE8;background:#E6F5EE;padding:10px 16px;font-size:14px;font-weight:700;color:#0A6B46}
.mail{border:2px solid #EAEAE8;border-radius:14px;overflow:hidden}
.mail-row{display:flex;gap:8px;align-items:baseline;padding:12px 16px;border-bottom:1px solid #EAEAE8;background:#FCFCFB}
.mail-k{flex:none;width:56px;font-size:13px;font-weight:800;color:#6E7175}
.mail-v{font-size:15px;font-weight:700;color:#17181A}
.mail textarea{width:100%;box-sizing:border-box;display:block;border:none;border-radius:0;background:#fff;padding:16px;min-height:150px;font-size:16px;font-weight:600;line-height:1.7;color:#17181A}
.mail textarea::placeholder{color:#6E7175}
.mail textarea:focus{outline:3px solid #0A8F5B;outline-offset:-3px;border-color:transparent}
.mail-foot{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;padding:12px 16px;border-top:1px solid #EAEAE8;background:#FCFCFB}
.mail-count{font-size:14px;font-weight:700;color:#6E7175}
.btn-prod{min-height:44px;padding:11px 22px;border:none;border-radius:10px;background:#0A8F5B;color:#fff;font-family:'Nunito',sans-serif;font-size:16px;font-weight:800;cursor:pointer}
.btn-prod:hover{background:#087A4D}
.prod-tools{display:flex;flex-direction:column;gap:12px}
.prod-tools .btn-pri{background:#0A8F5B;border-color:transparent}
.prod-tools .btn-pri:hover{background:#087A4D}
.prod-tools .btn-ghost{background:#F7F7F5;color:#17181A;border-color:#EAEAE8}
.prod-tools .btn-ghost:hover{background:#EFEFEC}
.prod-tools .btn-send{background:#0A6B46}
@media(max-width:720px){
  .plan{grid-template-columns:1fr}
  .rec-steps{flex-direction:column}
  .rec-step{border-bottom:1px solid #EAEAE8;border-left:3px solid transparent}
  .rec-step.on{border-left-color:#0A8F5B;border-bottom-color:#EAEAE8}
  .req-grid{grid-template-columns:1fr}
  .req-it,.req-it:nth-child(odd){border-right:none;border-bottom:1px solid #EAEAE8}
  .rec-body{flex-direction:column;text-align:center}
}
textarea,input.txt{width:100%;border:2.5px solid #B7DED7;border-radius:12px;padding:11px 14px;font-family:'Nunito',sans-serif;font-size:15px;font-weight:700;color:#123B32;background:#F7FCFB;resize:vertical}
textarea:focus{outline:none;border-color:#1D6B8F}
.btn{font-family:'Nunito',sans-serif;font-size:15px;font-weight:800;border-radius:10px;padding:11px 18px;cursor:pointer;border:2.5px solid transparent}
.btn-pri{background:#1D6B8F;color:#fff}.btn-pri:hover{background:#154F68}.btn-pri:disabled{opacity:.5;cursor:not-allowed}
.btn-ghost{background:#EDF6F4;color:#1D6B8F;border-color:#B7DED7}.btn-ghost:hover{background:#DCEFEB}
.btn-send{background:#12556B;color:#fff}.btn-send:disabled{opacity:.5}
.fb{background:#F0FAF7;border:2px solid #B7DED7;border-radius:12px;padding:14px 16px;display:none;flex-direction:column;gap:8px;margin-top:12px}
.fb.on{display:flex}
.fb-t{font-size:12px;font-weight:900;text-transform:uppercase;letter-spacing:.06em;color:#154F68}
.fb-c{font-size:15px;font-weight:800;color:#154F68;line-height:1.5}
.fb-e{font-size:13px;font-weight:700;color:var(--warn-ink);line-height:1.5;padding-left:14px;position:relative}
.fb-e::before{content:"•";position:absolute;left:2px}
.status{font-size:13px;font-weight:800;color:#5E8A82;text-align:center;display:none;margin-top:8px}
.status.on{display:block}
.err{font-size:13px;font-weight:800;color:var(--no-ink);background:var(--no-bg);border:2px solid var(--no-line);border-radius:10px;padding:10px 14px;display:none;margin-top:8px}
.err.on{display:block}
.sent{font-size:13px;font-weight:800;color:#12556B}
.selfrow{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:11px 0;border-bottom:1px solid #DCEFEB}
.self-txt{font-size:15px;font-weight:800;color:#123B32}
.self-opts{display:flex;gap:6px}
.self-opts button{width:44px;height:44px;border-radius:9px;border:2px solid #B7DED7;background:#fff;font-size:19px;cursor:pointer}
.self-opts button.sel{border-color:#1D6B8F;background:#DCEFEB}
.hidden{display:none!important}

/* Exercices à écrire */
.wlist{display:flex;flex-direction:column;gap:14px}
.witem{background:#F7FCFB;border:1.5px solid #B7DED7;border-radius:12px;padding:13px 16px}
.wq{font-size:15px;font-weight:800;color:#123B32;line-height:1.45;margin-bottom:8px}
.acc-blank{display:inline-block;min-width:22px;height:.9em;border-bottom:2.5px solid currentColor;margin:0 3px;vertical-align:baseline;opacity:.55}
.wrow{display:flex;gap:8px;flex-wrap:wrap}
.winput{flex:1;min-width:180px;border:2.5px solid #B7DED7;border-radius:9px;padding:9px 13px;font-family:'Nunito',sans-serif;font-size:15px;font-weight:700;color:#123B32;background:#fff}
.winput:focus{outline:none;border-color:#1D6B8F}
.winput.good{border-color:var(--ok-line);background:var(--ok-bg)}
.wbtn{flex:0 0 auto;padding:12px 16px}
.wfb{font-size:13px;font-weight:700;line-height:1.5;margin-top:8px;display:none}
.wfb.ok,.wfb.no,.wfb.wait{display:block}
.wfb.ok{color:var(--ok-ink)}.wfb.no{color:var(--warn-ink)}.wfb.wait{color:#4A6F68}
.wfb b{color:#154F68}

@media(max-width:900px){.vocab-grid{grid-template-columns:1fr 1fr}.rrow2{grid-template-columns:1fr}}

/* ── ESSAI DE STYLE : "Je découvre" seulement (inspiré Wealthsimple) ── */
/* Fond neutre, cartes blanches épurées, police géométrique sobre, accent unique. */
body{
  /* Alias vers le système de design officiel (assets/design-system/) —
     ok-bg/no-bg/warn-bg/sel-bg/drop-bg viennent directement de
     tokens/colors.css (mêmes noms, ne pas les redéclarer ici). */
  --ws-bg:var(--surface-page); --ws-card:var(--surface-card); --ws-ink:var(--text-strong); --ws-sub:var(--text-muted);
  --ws-line:var(--border); --ws-accent:var(--accent); --ws-accent-bg:var(--accent-soft);
  /* Teinte propre à ce module (même couleur que sa plaquette dans le portail
     et la barre du lecteur) — seulement pour l'en-tête, le reste de
     l'interface garde l'accent vert unique du système de design. */
  --hdr-accent:#0D7A6F; --hdr-accent-soft:#DCF2EF;
  --pad-x:32px;      /* gouttière de page — identique partout */
  --pad-card:22px;   /* padding intérieur de TOUS les cadres */
  --bleed:-23px;     /* = -(var(--pad-card) + 1px de bordure) */
  --r-sm:10px; --r-md:18px; --r-pill:999px;
  background:var(--ws-bg);
  color:var(--ws-ink);
}
/* Tous les cadres : même bordure, même padding, même bord gauche/droit. */
.card{
  padding:22px;
  border:1px solid var(--ws-line);
  border-left:4px solid var(--sec-color,var(--ws-accent));
  border-radius:18px;
  box-shadow:0 1px 2px rgba(20,20,20,.04);
  /* `clip` et non `hidden` : les deux découpent l'en-tête débordant aux coins
     arrondis, mais `hidden` fait de la carte un conteneur de défilement, ce qui
     neutralise le `position:sticky` du banc de réponses à l'intérieur. */
  overflow:clip;
  transition:box-shadow .15s ease, transform .15s ease;
}
.card:hover{
  transform:translateY(-1px);
  box-shadow:0 6px 18px rgba(20,20,20,.07);
}
@media (prefers-reduced-motion:reduce){
  .card{transition:none}
  .card:hover{transform:none}
}
.c-hdr:first-child{
  margin:-22px -23px 16px -26px;
  padding:20px 22px 14px 26px;
  background:#FBFBF9;
  border-bottom:1px solid var(--ws-line);
}
.c-hdr:not(:first-child){
  padding-bottom:12px; margin-bottom:16px;
  border-bottom:1px solid var(--ws-line);
}
.qcard,.blanks-p,.word-chip{
  background:var(--ws-card); border:1px solid var(--ws-line); border-left:1px solid var(--ws-line);
  border-radius:18px; box-shadow:0 1px 2px rgba(20,20,20,.04); color:var(--ws-ink); font-weight:500;
}
/* Prononciation = seul bloc teinté vert de la page — le distingue visuellement
   des cartes blanches qui portent le dialogue et ses exercices. */
.savoir{
  background:var(--ws-card); border:1px solid var(--ws-line); border-left:1px solid var(--ws-line);
  border-radius:18px; box-shadow:0 1px 2px rgba(20,20,20,.04); color:var(--ws-ink); font-weight:500;
}
/* Prononciation seulement (savoir.speak===true) — les autres encadrés de savoir
   (ex. grammaire) restent blancs comme les autres cadres. */
.savoir--pron{
  background:#F6FBF8;
  border-color:#D8ECE2;
  box-shadow:none;
}
/* Les énoncés vivent DANS une carte déjà encadrée (.card) — pas de double cadre :
   simple ligne de séparation entre rangées plutôt qu'une boîte par énoncé. */
.vf-row{background:transparent;border:none;border-radius:0;padding:0}
.stxt{background:transparent;border:none;border-radius:0;box-shadow:none;color:var(--ws-ink);font-weight:500;padding:10px 0}
.rows{gap:8px}
.vf-head{padding:0}
/* Échelle typographique unique : une seule règle pour les étiquettes majuscules.
   NOTE : .tag/.d-lbl/.vocab-tag restent à 15px (hors de ce groupe) — demande
   explicite de l'utilisateur que EXERCICE/VOCABULAIRE/DIALOGUE partagent la
   même taille entre eux, distincte des étiquettes plus discrètes ci-dessous. */
.hdr-eye,.audio-lbl,.savoir-band,
.vf-head-opt,.fb-t,.qlbl,.blbl{
  font-size:12px; font-weight:800; text-transform:uppercase; letter-spacing:.14em;
}
.tag{background:none!important;color:var(--sec,var(--ws-accent))!important;font-weight:800!important}
.ctit{color:var(--ws-ink)!important;font-weight:900!important}
.csub{color:var(--ws-sub)!important;font-weight:500}
.savoir-band{background:var(--ws-ink);color:#fff;border-radius:18px 18px 0 0;margin:0 -23px 16px}
.savoir--pron .savoir-band{background:var(--ws-accent)}
.savoir-gap{background:var(--ws-bg);border-color:var(--ws-line);margin:0 -23px 20px}
.savoir-row{border-bottom:1px solid var(--ws-line)}
.savoir-key{color:var(--ws-sub);font-weight:600}
.savoir-val{color:var(--ws-ink);font-weight:500}
.savoir--pron .savoir-row{border-bottom:1px solid #E4F0EA}
.savoir--pron .savoir-key{color:#4E7C6B}
.savoir--pron .word-chip{background:#fff;border:1px solid #D8ECE2}
.qlbl{color:var(--ws-accent)}
.qtxt,.stxt{color:var(--ws-ink);font-weight:600}
.vf-opt{border-radius:12px;border-color:var(--ws-line);background:var(--ws-card);color:var(--ws-sub);font-weight:600}
/* Après correction, le vert/rouge doit toujours l'emporter sur le bleu de
   sélection (sinon tout reste bleu et on ne voit plus où sont les erreurs). */
.vf-opt.sel.fb-ok{background:var(--ok-bg)!important;border-color:var(--ok-line)!important;color:var(--ok-ink)!important}
.vf-opt.sel.fb-no{background:var(--no-bg)!important;border-color:var(--no-line)!important;color:var(--no-ink)!important}
.tile{border-radius:12px;box-shadow:0 1px 2px rgba(20,20,20,.06)}
.btn,.word-chip .btn{
  font-family:inherit;border-radius:999px;font-weight:600;border:1px solid var(--ws-line);
}
.btn-ghost{background:var(--ws-card);color:var(--ws-ink)}
.btn-pri,.wbtn{background:var(--ws-ink)!important;color:#fff!important;border:none!important}
.winput{border-radius:12px;border-color:var(--ws-line);color:var(--ws-ink);font-weight:500;font-family:inherit}
.winput:focus{border-color:var(--ws-accent)}
.wfb b{color:var(--ok-ink)}
.fb-ok{animation:none!important}
.fb-no{animation:none!important}
.fb-ok::before{content:"✓ ";font-weight:800}
.fb-no::before{content:"✕ ";font-weight:800}
.pron-fb.ok::before{content:"✓ "}
.pron-fb.no::before{content:"✕ "}
.icon-svg{filter:none;opacity:.75}
/* Badge rond seulement pour les boutons icône SEULE (sans texte à côté) —
   sinon un bouton comme "🔊 Écouter" se retrouve écrasé dans un rond de 34px. */
.btn-ghost:has(.icon-svg):not(.wlisten){
  width:34px;height:34px;padding:0;border-radius:50%;display:inline-flex;
  align-items:center;justify-content:center;background:transparent;border:none;
}
/* Icônes seules (haut-parleur, micro) : pas de cadre, juste l'icône. */
.word-chip .btn,.ph-mic{background:transparent!important;border:none!important;box-shadow:none!important}
.word-chip .btn:hover,.ph-mic:hover{background:rgba(0,0,0,.05)!important}
.btn-ghost.wlisten{
  display:inline-flex;align-items:center;gap:8px;background:var(--ws-bg);
  border:1px solid var(--ws-line);border-radius:999px;padding:9px 18px;color:var(--ws-ink);font-weight:600;
}
.pron-fb{color:var(--ws-sub);font-weight:600;font-size:13px}
.pron-fb.ok{color:var(--ok-ink)}
.pron-fb.no{color:var(--no-ink)}
.intro{background:var(--ws-card);color:var(--ws-ink);font-weight:600;border:1px solid var(--ws-line);border-radius:18px;margin:22px 32px 0;padding:18px 22px}
.dial-sec{background:var(--ws-card);color:var(--ws-ink);border:1px solid var(--ws-line);border-bottom:1px solid var(--ws-line)!important;border-radius:18px;align-items:stretch;padding:18px 22px;margin:22px 32px 0;overflow:hidden}
.situ{color:var(--ws-ink);opacity:1}
.vocab-sec{
  background:var(--ws-bg); border:none;
  border-top:1px solid var(--ws-line);
  border-radius:0 0 18px 18px;
  margin:18px -23px -19px;
  padding:18px 22px;
}
.vocab-tag{background:var(--ws-accent-bg);color:var(--ws-accent)}
.vw{background:var(--ws-card);border:1px solid var(--ws-line)}
.vw .dot{background:var(--ws-accent)}
.audio-pl{justify-content:center;padding-top:0}
.audio-lbl{color:var(--ws-sub);opacity:1}
.d-lbl{background:var(--ws-accent-bg);color:var(--ws-accent);opacity:1}
.mb{color:#2563EB}
.dr{color:var(--ws-accent)}
.btn-lu{background:var(--ws-bg);color:var(--ws-ink);border:1px solid var(--ws-line);border-radius:999px;font-weight:600}
.btn-lu.btn-audio{background:#DC2626!important;border-color:#DC2626!important;color:#fff!important}
.btn-lu.btn-audio:hover{background:#B91C1C!important;border-color:#B91C1C!important}
.btn-lu.btn-audio .icon-svg{filter:brightness(0) invert(1)!important;opacity:1!important}
/* Graphie-phonie en grille de cartes (modèle je-me-prepare.html) */
.ph-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px}
.ph-card{background:var(--ws-card,#fff);border:1px solid var(--ws-line,#EAEAE8);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:12px}
.ph-top{display:flex;align-items:center;gap:12px}
.ph-word{font-size:21px;font-weight:900;color:var(--ws-ink,#17181A)}
.btn-audio-round{width:44px;height:44px;flex-shrink:0;border-radius:50%;border:none;background:#DC2626;color:#fff;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;transition:background .15s}
.btn-audio-round:hover{background:#B91C1C}

/* ── « En apprendre plus » : mini-leçon en panneau latéral ─────────────
   Le bandeau noir d'un savoir reste un résumé. L'élève qui ne comprend pas
   ouvre ici une leçon complète : explication, anatomie, manipulation,
   exemples, pièges, micro-vérification. Aucun effet sur le score du module. */
.plus-bar{margin:14px var(--bleed) -17px;border-top:1px solid var(--ws-line)}

#plus-ov{display:none;position:fixed;inset:0;z-index:9500;background:rgba(15,25,35,.5);backdrop-filter:blur(4px)}

/* ── Proposition d'aide après plusieurs erreurs ────────────────────────
   Volontairement discrète et refusable : un panneau qui s'ouvrirait tout
   seul après un échec se lirait comme une punition. Ici l'élève choisit. */
.aide{
  margin-top:16px; padding:14px 16px;
  background:var(--warn-bg); border:1px solid var(--warn-line);
  border-left:4px solid var(--warn-line); border-radius:14px;
  display:flex; align-items:center; gap:14px; flex-wrap:wrap;
}
.aide-txt{flex:1 1 260px; font-size:15.5px; font-weight:600; line-height:1.5; color:var(--warn-ink)}
.aide-txt b{font-weight:900}
.aide-btns{display:flex; gap:8px; flex-wrap:wrap}
.aide .btn-oui{
  min-height:44px; padding:0 18px; border-radius:999px; border:none;
  background:var(--ws-ink); color:#fff;
  font-family:'Nunito',sans-serif; font-size:14.5px; font-weight:800; cursor:pointer;
}
.aide .btn-oui:hover{background:#000}
.aide .btn-non{
  min-height:44px; padding:0 16px; border-radius:999px;
  border:1px solid var(--border); background:transparent; color:var(--text-muted);
  font-family:'Nunito',sans-serif; font-size:14.5px; font-weight:700; cursor:pointer;
}
.aide .btn-non:hover{background:rgba(0,0,0,.04)}
.aide .btn-oui[disabled]{opacity:.45; cursor:default}
.aide .btn-oui .icon-svg{width:16px; height:16px; margin-right:6px;
  filter:brightness(0) invert(1)}
/* Réponse de l'assistant : sur fond blanc, détachée du bandeau d'alerte —
   c'est une explication, pas un message d'erreur de plus. */
.aide-out{display:none; flex-basis:100%}
.aide-out.on{display:block; margin-top:4px; padding:16px 18px;
  background:var(--surface-card); border:1px solid var(--border); border-radius:14px}
.aide-out.wait{font-size:15px; font-weight:600; color:var(--text-muted)}
.aide-out.no{color:var(--no-ink); font-size:15px; font-weight:700}
.ao-k{font-size:11.5px; font-weight:800; text-transform:uppercase;
  letter-spacing:.13em; color:var(--text-muted); margin-bottom:5px}
.ao-k:not(:first-child){margin-top:14px}
.ao-v{font-size:16.5px; font-weight:500; line-height:1.6; color:var(--text-strong)}
.ao-conseil{font-weight:800}
/* Le bloc vers lequel on emmène l'élève s'annonce brièvement, sinon il
   atterrit au milieu du panneau sans savoir pourquoi. */
.pl-blk.is-cible{
  box-shadow:0 0 0 3px var(--ws-accent);
  transition:box-shadow .4s ease;
}

/* ── Banc de réponses collant ──────────────────────────────────────────
   Dans un exercice long, les énoncés défilaient sous le banc de réponses :
   arrivé en bas, l'élève n'avait plus rien à glisser. Le banc reste
   maintenant à l'écran tant qu'on est dans l'exercice.
   --chrome-h est mesuré en JS (la barre d'onglets change de hauteur quand
   elle passe sur deux lignes ou que la bannière de sélection apparaît). */
.bsec.b1{
  position:sticky;
  top:calc(var(--chrome-h,72px) + 12px);
  max-height:calc(100vh - var(--chrome-h,72px) - 40px);
  overflow-y:auto;
  z-index:3;
}
/* En écran étroit, la colonne passe SOUS les énoncés : la coller en haut
   n'aurait aucun effet. On la colle en bas, en bande horizontale. */
@media(max-width:760px){
  /* La colonne des énoncés imposait min-width:300px — plus large que l'espace
     disponible sur un téléphone (375px moins les gouttières), donc les cartes
     et les zones de dépôt étaient rognées à droite par la carte.
     On force les deux colonnes à toute la largeur : elles s'empilent
     franchement au lieu de se disputer une rangée trop étroite. */
  .exo-main{min-width:0!important; flex:1 1 100%!important}
  .bsec.b1{flex:1 1 100%!important}
  .bsec.b1{
    position:sticky; top:auto; bottom:0;
    max-height:none;
    margin:0 -22px -22px;
    border-radius:0;
    border-left:none; border-right:none; border-bottom:none;
    box-shadow:0 -6px 18px rgba(20,20,20,.10);
    padding:10px 14px calc(10px + env(safe-area-inset-bottom));
  }
  .bsec.b1 .blbl{margin-bottom:6px}
  /* Les tuiles s'alignent en file et défilent horizontalement plutôt que
     d'empiler une colonne qui mangerait tout l'écran. */
  .bsec.b1 .btiles,.bsec.b1 .btiles.vert{
    flex-direction:row; flex-wrap:nowrap;
    overflow-x:auto; overflow-y:hidden;
    justify-content:flex-start;
    gap:8px; padding-bottom:4px;
    -webkit-overflow-scrolling:touch;
  }
  .bsec.b1 .btiles > *{flex:0 0 auto}
}
@media(prefers-reduced-motion:no-preference){
  .bsec.b1{scroll-behavior:smooth}
}

/* ── Lisibilité des encadrés de savoir ────────────────────────────────
   Deux besoins distincts, deux traitements. (1) Repérer les mots qui
   portent la règle : le <b> passe en 900 sur la couleur d'encre, assez
   marqué pour accrocher l'œil sans transformer la ligne en sapin de Noël.
   (2) Distinguer un exemple d'une règle : un exemple se lit comme une
   citation — retrait, filet coloré, italique dans la couleur de la
   section — donc on ne le confond plus avec l'explication qui précède. */
.savoir-val b,.savoir-val strong{font-weight:900;color:var(--ws-ink)}
.savoir-ex{
  display:block; margin:7px 0 1px; padding:8px 12px 8px 13px;
  border-left:3px solid var(--sec-color,var(--ws-accent));
  border-radius:0 10px 10px 0;
  background:#F5F6F7;
  font-style:italic; font-weight:700; line-height:1.45;
  color:var(--sec-color,var(--ws-accent));
}
/* Le fond reprend la couleur de la section, très dilué : --ws-accent-bg est
   vert quelle que soit la section, ce qui jurait avec un filet ambre ou
   rouille. Repli sur le gris neutre ci-dessus si color-mix manque. */
@supports (background:color-mix(in srgb,red 8%,transparent)){
  .savoir-ex{background:color-mix(in srgb,var(--sec-color,#1D6B8F) 8%,transparent)}
}
.savoir-ex + .savoir-ex{margin-top:5px}
/* Dans un exemple, le mot mis en avant reprend la couleur de l'exemple :
   sinon il sortirait du bloc au lieu d'y attirer l'attention. Le <em> des
   modules plus anciens (vert, italique) est repris ici par la même règle,
   sans quoi il jurerait avec un filet ambre ou rouille. */
.savoir-ex b,.savoir-ex strong,.savoir-ex em{color:inherit;font-weight:900;font-style:normal}
/* Rangée entièrement consacrée à des exemples : l'étiquette de gauche
   prend la même couleur, la paire se lit alors comme un seul bloc. */
.savoir-row.is-ex .savoir-key{color:var(--sec-color,var(--ws-accent));font-weight:800}
.savoir--pron .savoir-ex{background:#EEF7F1}
/* Sur téléphone, la grille 34 % / 1fr ne laissait que ~130 px à l'explication :
   les exemples s'y écrasaient sur cinq lignes. L'étiquette passe au-dessus. */
@media(max-width:640px){
  .savoir-row{grid-template-columns:1fr; gap:5px}
  .savoir-key{font-size:15px}
}

/* Focus clavier visible partout (B.4) */
:focus-visible{outline:3px solid var(--ws-accent);outline-offset:2px;border-radius:inherit}
textarea:focus-visible,.winput:focus-visible{outline:none;border-color:var(--ws-accent)}

<script>
// ═══════════════════════════════════════════════════════════════════════

// ── SECTIONS ──────────────────────────────────────────────────────────

// ── EXERCICES ─────────────────────────────────────────────────────────

// ── LMS TRACKING ──────────────────────────────────────────────────────
function lmsTrack(event, data) {
  try { window.parent.postMessage(Object.assign({lms:true, event:event}, data||{}), '*'); } catch(e) {}
  try {
    const up = new URLSearchParams(window.parent.location.search);
    const code = up.get('code'), actId = parseInt(up.get('activityId'))||null, title = up.get('title')||'';
    if (code && actId) {
      fetch('/api/student/progress', {
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify(Object.assign({code, activityId:actId, activityTitle:title, event}, data||{})),
      }).catch(()=>{});
    }
  } catch(e2) {}
}
const TR = {attempts:{}, correct:{}};
function trackPlacement(zid, ok) {
  if (ok && !TR.correct[zid]) {
    TR.correct[zid] = true;
    if (!(zid in TR.attempts)) TR.attempts[zid] = 0;
    const zonesDone = Object.keys(TR.correct).length;

    const totalErrors = Object.keys(TR.attempts).reduce((s,k)=>s+(TR.attempts[k]||0),0);
    lmsTrack('exercise_completed', {zones:TOTAL_ZONES, zonesDone, firstTry, totalErrors});
  } else if (!ok && !TR.correct[zid]) {
    TR.attempts[zid] = (TR.attempts[zid]||0) + 1;
  }
  updateChip();
}

function charSlug(name){ return name.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/'/g,'').replace(/\s+/g,'_'); }

function playDialogue(dialId, btn){
  if(dlgBtn===btn && dlgState==='playing'){ pauseDialogue(); return; }
  if(dlgBtn===btn && dlgState==='paused'){ resumeDialogue(); return; }

function playAudioQueue(urls, idx, btn, dialId, allowFallback){
  if(idx>=urls.length){ finishDialogue(btn,dialId); return; }
  dlgAudio=new Audio(urls[idx]);
  dlgUsingSpeech=false;
  dlgState='playing'; btn.textContent='⏸ Pause';
  dlgAudio.onended=()=>playAudioQueue(urls, idx+1, btn, dialId, false);
  dlgAudio.onerror=()=>{
    if(allowFallback && idx===0){ playSpeechQueue(dlgFallbackLines, btn, dialId); }
    else{ playAudioQueue(urls, idx+1, btn, dialId, false); }
  };
  dlgAudio.play().catch(()=>{ if(allowFallback && idx===0){ playSpeechQueue(dlgFallbackLines, btn, dialId); } });
}
function playSpeechQueue(lines, btn, dialId){
  try{
    speechSynthesis.cancel();
    dlgUsingSpeech=true;
    const voices = speechSynthesis.getVoices();
    const fr = voices.filter(v=>/^fr/i.test(v.lang));
    lines.forEach((l,i)=>{
      const u=new SpeechSynthesisUtterance(l[1]);
      u.lang='fr-CA'; u.rate=0.95; u.pitch=(i%2===0)?1.12:0.9;
      if(fr.length) u.voice=(i%2===0)?fr[0]:(fr[1]||fr[0]);
      speechSynthesis.speak(u);
    });
    dlgState='playing'; btn.textContent='⏸ Pause';
    clearInterval(dlgPollIv);
    dlgPollIv=setInterval(()=>{
      if(!speechSynthesis.speaking){ clearInterval(dlgPollIv); finishDialogue(btn,dialId); }
    },400);
  }catch(e){}
}

// ── LECTURE AUDIO D'UN MOT OU D'UNE PHRASE ISOLÉE (synthèse vocale) ────
function speakText(btn, text){
  try{
    speechSynthesis.cancel();
    const old = btn ? btn.innerHTML : null;
    const reset = ()=>{ if(btn){ btn.disabled=false; btn.innerHTML=old; } };
    if(btn){ btn.disabled=true; btn.innerHTML=ICON_SPEAK+' …'; }
    const doSpeak = ()=>{
      try{
        const u=new SpeechSynthesisUtterance(text);
        u.lang='fr-CA'; u.rate=0.9;
        const voices=speechSynthesis.getVoices();
        const fr=voices.find(v=>/^fr/i.test(v.lang));
        if(fr) u.voice=fr;
        u.onend=reset; u.onerror=reset;
        speechSynthesis.speak(u);
        // Filet de sécurité : Chrome laisse parfois speechSynthesis coincé
        // sans jamais déclencher onend/onerror.
        setTimeout(()=>{ if(!speechSynthesis.speaking) reset(); }, 8000);
      }catch(e){ reset(); }
    };
    // Chrome ignore parfois un speak() appelé juste après cancel() dans le
    // même tick : un court délai évite ce bug connu.
    setTimeout(doSpeak, 60);
  }catch(e){}
}
// Essaie un vrai MP3 (assets/interactive/<module>/sons/<fileId>.mp3), retombe
// sur la synthèse vocale si le fichier est absent.
function playWord(btn, text, fileId){
  if(!fileId){ speakText(btn, text); return; }
  const url = `/assets/interactive/${MODULE_SLUG}/sons/${fileId}.mp3?v=${AUDIO_V}`;
  const old = btn ? btn.innerHTML : null;
  const reset = ()=>{ if(btn){ btn.disabled=false; btn.innerHTML=old; } };
  if(btn){ btn.disabled=true; btn.innerHTML=ICON_SPEAK+' …'; }
  const a=new Audio(url);
  a.onended=reset;
  a.onerror=()=>{ reset(); speakText(btn, text); };
  a.play().catch(()=>{ reset(); speakText(btn, text); });
}
// ── VÉRIFICATION DE PRONONCIATION (reconnaissance vocale native, "Je découvre" seulement) ──
function normPron(s){
  return String(s).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9\s]/g,'').replace(/\s+/g,' ').trim();
}
// Certains mots courts sont mal transcrits par la reconnaissance vocale du
// navigateur (nombres écrits en chiffres, homophones) même bien prononcés —
// liste d'équivalences acceptées en plus de la comparaison normale.
const PRON_ALIASES = {
  'treize': ['13'],
  'tot': ['sot','seau','saut','sceau'],
};
function pronMatches(said, target){
  if(said===target || said.includes(target) || target.includes(said)) return true;
  const alts = PRON_ALIASES[target] || [];
  return alts.some(a=>said===a || said.includes(a) || a.includes(said));
}
// RÈGLE (validée par l'utilisateur le 2026-08-03 après test) : un mot isolé
// (surtout une seule syllabe) est toujours plus difficile à reconnaître pour
// le moteur de reconnaissance vocale du navigateur qu'un mot dans une phrase
// avec du contexte. CHAQUE mot demandé en lecture/prononciation isolée doit
// donc être présenté dans une courte phrase, avec le mot cible en gras —
// jamais le mot tout seul. L'élève lit la phrase, mais on vérifie seulement
// que le mot cible apparaît dans ce qui a été entendu (pronMatches fait déjà
// cette vérification par inclusion — aucun changement de logique requis).
// ⚠️ À reproduire dans TOUS les futurs modules dès qu'un mot isolé est
// demandé en prononciation (voir aussi memory: cours-niveau4-modules.md).
const CARRIER_PHRASES = {};
function pronCheck(btn, expected){
  const SRC = window.SpeechRecognition || window.webkitSpeechRecognition;
  let fb = btn.nextElementSibling && btn.nextElementSibling.classList.contains('pron-fb') ? btn.nextElementSibling : null;
  if(!fb){ fb=document.createElement('span'); fb.className='pron-fb'; fb.setAttribute('aria-live','polite'); btn.insertAdjacentElement('afterend', fb); }
  if(!SRC){ fb.className='pron-fb warn'; fb.textContent='Reconnaissance vocale non supportée (utilise Chrome).'; return; }
  const old = btn.innerHTML;
  btn.classList.remove('fb-ok','fb-no');
  btn.disabled=true; btn.innerHTML=ICON_MIC+' …';
  fb.className='pron-fb'; fb.textContent='Écoute en cours…';
  const reset=()=>{ btn.disabled=false; btn.innerHTML=old; };
  const target = normPron(expected);
  let done=false, lastInterim='';
  const rec = new SRC();
  // interimResults:true — les mots très courts ("tôt", "mer"...) sont parfois
  // coupés par la détection de silence avant qu'un résultat final n'arrive ;
  // on garde le dernier résultat provisoire comme filet de secours.
  rec.lang='fr-CA'; rec.interimResults=true; rec.maxAlternatives=1;
  const evaluate=(heard)=>{
    heard=heard.trim();
    const said = normPron(heard);
    const ok = pronMatches(said, target);
    reset();
    btn.classList.add(ok?'fb-ok':'fb-no');
    fb.className='pron-fb '+(ok?'ok':'no');
    fb.textContent = ok ? '✓ Bien prononcé !' : ('✗ On a entendu : « '+heard+' »');
    setTimeout(()=>{ btn.classList.remove('fb-ok','fb-no'); }, 4000);
  };
  rec.onresult=e=>{
    const res=e.results[e.results.length-1];
    if(res.isFinal){ done=true; evaluate(res[0].transcript); }
    else{ lastInterim=res[0].transcript; }
  };
  rec.onerror=e=>{
    if(!done){
      done=true;
      if(lastInterim){ evaluate(lastInterim); return; }
      reset();
      fb.className='pron-fb warn';
      fb.textContent = e.error==='not-allowed' ? 'Micro refusé — autorise l\'accès au micro.' : 'Aucun son détecté, réessaie.';
    }
  };
  // Filet de sécurité : certains navigateurs déclenchent onend sans jamais
  // appeler onresult(final) ni onerror (silence, coupure) — sans ce filet le
  // message restait bloqué sur « Écoute en cours… ». On récupère le dernier
  // résultat provisoire s'il y en a un, plutôt que de déclarer un échec.
  rec.onend=()=>{
    if(!done){
      done=true;
      if(lastInterim){ evaluate(lastInterim); return; }
      reset();
      fb.className='pron-fb warn';
      fb.textContent='Aucun son détecté, réessaie.';
    }
  };
  setTimeout(()=>{
    if(!done){
      done=true;
      try{ rec.stop(); }catch(e){}
      if(lastInterim){ evaluate(lastInterim); return; }
      reset();
      fb.className='pron-fb warn';
      fb.textContent='Aucun son détecté, réessaie.';
    }
  }, 7000);
  try{ rec.start(); }catch(e){ done=true; reset(); fb.className='pron-fb warn'; fb.textContent='Impossible de démarrer le micro.'; }
}

// ── LOGIQUE DE PLACEMENT ──────────────────────────────────────────────
function checkOk(zid, iid, lbl) {
  const z = ZONES[zid];
  if (!z) return false;
  if (z.zcat === 'vf' || z.zcat === 'lbl') return lbl === z.cv;
  return iid === z.cv;
}
function doPlace(zid, iid, lbl, cat, from) {
  if (from === zid) { S.sel = null; render(); return; }
  if (from && from !== zid) { if (S.pl[zid]) S.pl[from] = S.pl[zid]; else delete S.pl[from]; delete S.fb[from]; delete S.fb[zid]; }
  else if (!from && S.pl[zid]) { delete S.pl[zid]; delete S.fb[zid]; }
  S.pl[zid] = {iid, lbl, cat}; S.sel = null;
  const ok = checkOk(zid, iid, lbl);
  S.fb[zid] = ok ? 'ok' : 'no';
  trackPlacement(zid, ok);
  render();
  setTimeout(() => { delete S.fb[zid]; if (!ok) delete S.pl[zid]; render(); }, ok ? 1400 : 850);
}
function zoneClick(zid) {
  if (S.sel) { doPlace(zid, S.sel.iid, S.sel.lbl, S.sel.cat, S.sel.from); }
  else if (S.pl[zid] && !S.fb[zid]) {
    const {iid,lbl,cat} = S.pl[zid];
    delete S.pl[zid]; delete S.fb[zid];
    S.sel = {iid,lbl,cat,from:zid}; render();
  }
}
function tileClick(iid, lbl, cat) {
  if (S.sel && S.sel.iid === iid && !S.sel.from) S.sel = null;
  else S.sel = {iid,lbl,cat,from:null};
  render();
}

// Compteur en direct dans l'en-tête d'exercice (exo-score), comme le modèle.
function updateVfScore(ex, checked){
  const el = document.getElementById('score-'+ex.id);
  if(!el) return;
  if(!checked){
    const answered = ex.rows.filter(r=>S.vfSel[r.id]).length;
    el.textContent = answered+' / '+ex.rows.length+' répondu';
  } else {
    const correct = ex.rows.filter(r=>S.vfSel[r.id]===r.ok).length;
    el.textContent = correct+' / '+ex.rows.length+' juste';
  }
}
// ── Association mot ↔ définition par CLIC (deux colonnes), pas de
// glisser-déposer — atteignable au clavier, comme je-me-prepare.html.
function renderVocabPairs(){
  const ex = EXOS.find(e=>e.id==='prVocab');
  if(!ex) return;
  const wordsEl = document.getElementById('vocab-words');
  const defsEl = document.getElementById('vocab-defs');
  if(!wordsEl || !defsEl) return;
  if(!S.vocabOrder) S.vocabOrder = ex.rows.map((r,i)=>i).sort(()=>Math.random()-.5);

  wordsEl.innerHTML = ex.rows.map((r,i)=>{
    const done = S.vocabPairs[r.id] !== undefined;
    const cls = 'chip chip-word'+(done?' is-paired':(S.vocabPick===r.id?' is-active':''));
    return '<button type="button" class="'+cls+'" data-w="'+esc(r.id)+'"'+(done?' aria-disabled="true"':'')+'>'+esc(r.q)+'</button>';
  }).join('');
  const takenDefIds = Object.values(S.vocabPairs);
  defsEl.innerHTML = S.vocabOrder.map(idx=>{
    const r = ex.rows[idx];
    const done = takenDefIds.includes(r.aid);
    const cls = 'chip'+(done?' is-paired':(S.fb[r.aid]==='no'?' is-miss':''));
    return '<button type="button" class="'+cls+'" data-d="'+esc(r.aid)+'"'+(done?' aria-disabled="true"':'')+'>'+esc(r.a)+'</button>';
  }).join('');

  wordsEl.querySelectorAll('[data-w]').forEach(b=>b.addEventListener('click',()=>{
    const wid = b.dataset.w;
    if(S.vocabPairs[wid] !== undefined) return;
    S.vocabPick = (S.vocabPick===wid) ? null : wid;
    S.fb = {};
    renderVocabPairs();
  }));
  defsEl.querySelectorAll('[data-d]').forEach(b=>b.addEventListener('click',()=>{
    const did = b.dataset.d;
    if(Object.values(S.vocabPairs).includes(did) || S.vocabPick===null) return;
    const row = ex.rows.find(r=>r.id===S.vocabPick);
    const ok = row && row.aid===did;
    if(ok){ S.vocabPairs[S.vocabPick] = did; S.vocabPick=null; S.fb={}; trackPlacement(row.id, true); }
    else { S.fb[did]='no'; trackPlacement(row?row.id:did, false); }
    renderVocabPairs();
  }));

  const n = Object.keys(S.vocabPairs).length;
  const scoreEl = document.getElementById('score-'+ex.id);
  if(scoreEl) scoreEl.textContent = n+' / '+ex.rows.length+' associé';
}

function vfSelect(zid, lbl) {
  S.vfSel[zid] = lbl;
  delete S.fb[zid];
  const ex = EXOS.find(e=>e.type==='vf' && e.rows.some(r=>r.id===zid));

}
function vfCheckAll(exId) {
  const ex = EXOS.find(e => e.id === exId);
  if (!ex) return;
  let answered = 0, correct = 0;
  ex.rows.forEach(r => {
    const sel = S.vfSel[r.id];
    if (!sel) return;
    answered++;
    const ok = sel === r.ok;
    if (ok) correct++;
    S.fb[r.id] = ok ? 'ok' : 'no';
    S.pl[r.id] = {iid:r.id, lbl:sel, cat:'vf'};
    trackPlacement(r.id, ok);
  });
  // Nombre d'énoncés encore faux à cette correction — pas un cumul : corriger
  // deux fois de suite ne doit pas gonfler artificiellement le compte.
  if (answered >= ex.rows.length) evaluerAide(exId, answered - correct);
  const sumEl = document.getElementById('vfsum-'+exId);
  if (sumEl) {
    if (answered < ex.rows.length) {
      sumEl.className = 'vf-summary warn';
      sumEl.textContent = `Réponds à toutes les phrases avant de corriger (${answered}/${ex.rows.length}).`;
    } else {
      sumEl.className = 'vf-summary ok';
      sumEl.textContent = `${correct} / ${ex.rows.length} bonnes réponses`;
    }
  }
  updateVfScore(ex, answered>=ex.rows.length);
  render();
}

// ── DRAG & DROP ───────────────────────────────────────────────────────
let dd = null;
function drg(el, iid, lbl, cat, from) {
  el.draggable = true;
  el.addEventListener('dragstart', e => { dd = {iid,lbl,cat,from:from||null}; e.dataTransfer.setData('text/plain', JSON.stringify(dd)); e.dataTransfer.effectAllowed='move'; setTimeout(()=>el.style.opacity='.45',0); });
  el.addEventListener('dragend', () => { el.style.opacity=''; dd=null; });
}
function drp(el, zid) {
  el.addEventListener('dragover', e => { e.preventDefault(); el.classList.add('dov'); });
  el.addEventListener('dragleave', () => el.classList.remove('dov'));
  el.addEventListener('drop', e => { e.preventDefault(); el.classList.remove('dov'); let d=dd; if(!d){try{d=JSON.parse(e.dataTransfer.getData('text/plain'))}catch{}} if(!d)return; doPlace(zid, d.iid, d.lbl, d.cat, d.from); dd=null; });
}
let ts=null, ghost=null;
function tch(el, iid, lbl, cat, from) {
  el.addEventListener('touchstart', e => { const t=e.touches[0]; ts={x:t.clientX,y:t.clientY,iid,lbl,cat,from:from||null,el,moved:false}; }, {passive:true});
}
document.addEventListener('touchmove', e => {
  if(!ts) return;
  const t=e.touches[0], dx=t.clientX-ts.x, dy=t.clientY-ts.y;
  if(!ts.moved && Math.sqrt(dx*dx+dy*dy)>8){
    ts.moved=true;
    const r=ts.el.getBoundingClientRect();
    ghost=ts.el.cloneNode(true);
    ghost.className=ts.el.className+' ghost'; ghost.style.width=r.width+'px';
    ghost.style.left=(t.clientX-r.width/2)+'px'; ghost.style.top=(t.clientY-r.height/2)+'px';
    document.body.appendChild(ghost);
  }
  if(ts.moved && ghost){ e.preventDefault(); ghost.style.left=(t.clientX-ghost.offsetWidth/2)+'px'; ghost.style.top=(t.clientY-ghost.offsetHeight/2)+'px'; }
}, {passive:false});
document.addEventListener('touchend', e => {
  if(!ts) return;
  if(ts.moved && ghost){
    ghost.remove(); ghost=null;
    const t=e.changedTouches[0];
    const zel=document.elementsFromPoint(t.clientX,t.clientY).find(x=>x.dataset&&x.dataset.zid);
    if(zel) doPlace(zel.dataset.zid, ts.iid, ts.lbl, ts.cat, ts.from);
    e.preventDefault();
  }
  ts=null;
});

// Remplace les suites de "___" par un blanc à souligner distinct du texte,

function shuffled(arr, seed){
  const a=arr.slice(); let s=seed||42;
  for(let i=a.length-1;i>0;i--){ s=(s*9301+49297)%233280; const j=Math.floor((s/233280)*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
  return a;
}
function mkZone(zid, extra, placeholder){
  const el=document.createElement('div');
  const placed=S.pl[zid], fb=S.fb[zid], z=ZONES[zid];
  let cls=['zone']; if(extra)cls.push(extra);
  if(fb)cls.push('fb-'+fb);
  else if(placed){
    if(z.zcat==='vf'&&(placed.lbl==='VRAI'||placed.lbl==='FAUX'))cls.push(placed.lbl==='VRAI'?'f-vrai':'f-faux');
    else cls.push('filled');
  } else cls.push('empty');
  el.className=cls.join(' ');
  el.dataset.zid=zid;
  el.textContent=placed?placed.lbl:(placeholder||'déposer ici');
  el.addEventListener('click',()=>zoneClick(zid));
  kbdable(el);
  drp(el,zid);
  if(placed&&!fb){drg(el,placed.iid,placed.lbl,placed.cat,zid);tch(el,placed.iid,placed.lbl,placed.cat,zid)}
  return el;
}
function mkBlank(zid){
  const el=document.createElement('span');
  const placed=S.pl[zid], fb=S.fb[zid];
  let cls=['blank'];
  if(fb)cls.push('fb-'+fb); else if(placed)cls.push('filled');
  el.className=cls.join(' ');
  el.dataset.zid=zid;
  el.textContent=placed?placed.lbl:'…';
  el.addEventListener('click',()=>zoneClick(zid));
  kbdable(el);
  drp(el,zid);
  if(placed&&!fb){drg(el,placed.iid,placed.lbl,placed.cat,zid);tch(el,placed.iid,placed.lbl,placed.cat,zid)}
  return el;
}
function mkTile(iid,lbl,cat,cls){
  const t=document.createElement('div');
  t.className='tile '+cls+(S.sel&&S.sel.iid===iid&&!S.sel.from?' sel':'');
  t.textContent=lbl;
  t.addEventListener('click',()=>tileClick(iid,lbl,cat));
  kbdable(t);
  drg(t,iid,lbl,cat,null); tch(t,iid,lbl,cat,null);
  return t;
}
function mkImgTile(im,cat){
  const t=document.createElement('div');
  t.className='imgtile'+(S.sel&&S.sel.iid===im.id&&!S.sel.from?' sel':'');
  t.innerHTML='<img src="'+im.src+'" alt="" loading="lazy">';
  t.addEventListener('click',()=>tileClick(im.id,im.id,cat));
  kbdable(t);
  drg(t,im.id,im.id,cat,null); tch(t,im.id,im.id,cat,null);
  return t;
}
function mkImgZone(zid, im){
  const el=document.createElement('div');
  const placed=S.pl[zid], fb=S.fb[zid];
  let cls=['imgzone']; if(fb)cls.push('fb-'+fb); else if(placed)cls.push('filled'); else cls.push('empty');
  el.className=cls.join(' ');
  el.dataset.zid=zid;
  if(placed){ const src=(ALL_IMAGES.find(i=>i.id===placed.iid)||{}).src; el.innerHTML=src?'<img src="'+src+'" alt="">':''; }
  else{ el.innerHTML='<span class="imgzone-ph">glissez l\'image ici</span>'; }
  el.addEventListener('click',()=>zoneClick(zid));
  kbdable(el);
  drp(el,zid);
  if(placed&&!fb){drg(el,placed.iid,placed.lbl,placed.cat,zid);tch(el,placed.iid,placed.lbl,placed.cat,zid)}
  return el;
}

// ── CONSTRUCTION DU DOM ───────────────────────────────────────────────
function buildStatic(){
  const tabs=document.getElementById('tabs');
  SECTIONS.forEach(sec=>{
    const b=document.createElement('button');
    b.className='tab'; b.id='tab-'+sec.id;
    b.style.setProperty('--sec-color', sec.color);
    b.innerHTML='<span class="tno">'+sec.no+'</span>'+esc(sec.title)+'<span class="tchk">✓</span>';
    b.addEventListener('click',()=>{curSec=sec.id;render();window.scrollTo({top:0,behavior:'smooth'})});
    tabs.appendChild(b);
  });
  const wrap=document.getElementById('sections');
  SECTIONS.forEach(sec=>{
    const d=document.createElement('div');
    d.className='sec'; d.id='sec-'+sec.id;
    d.style.setProperty('--sec-color', sec.color);
    d.style.setProperty('--sec', sec.color);
    let h='';
    // Bloc unique : mise en situation (gris) → dialogue → vocabulaire associé.
    // Tout est dans le même cadre pour qu'on voie le lien entre le dialogue et
    // son vocabulaire (demande de l'utilisateur, 2026-08-03).
    if(sec.dialogue){
      const dia=DIALOGUES[sec.dialogue];
      const titleParts = dia.label.split('—');
      const dTitle = (titleParts[1]||dia.label).trim();
      h+='<div class="dial-sec"><div class="dial-grid">';
      h+='<div><div class="field-label">La situation</div>';
      h+='<p class="situ">'+sec.intro+'</p>';
      h+='<div class="row" style="display:flex;flex-wrap:wrap;gap:10px;margin-top:14px">';
      h+='<button class="btn-lu btn-audio" onclick="playDialogue(\''+sec.dialogue+'\',this)">'+ICON_SPEAK+' Écouter le dialogue</button>';
      h+='<button class="btn btn-ghost" type="button" onclick="toggleScript(this,\''+sec.id+'\')">Lire la transcription</button>';
      h+='</div></div>';
      h+='<div class="dial-aside"><div class="field-label">Dialogue</div>';
      h+='<div class="dial-aside-tit">'+esc(dTitle)+'</div>';
      h+='<div class="dial-aside-n">'+dia.lines.length+' répliques</div></div>';
      h+='</div>';
      h+='<div class="dial-txt is-hidden" id="script-'+sec.id+'">';
      dia.lines.forEach((l,i)=>{
        const cls=(i%2===0)?'mb':'dr';
        h+='<div class="dl"><span class="'+cls+'">'+esc(l[0])+' :</span> '+esc(l[1])+'</div>';
      });
      h+='</div>';
      if(sec.id==='prep'){
        h+='<div class="vocab-sec"><div style="display:flex;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap">';
        h+='<div class="vocab-tag">Vocabulaire</div>';
        h+='<div style="font-size:15px;font-weight:700;">Les mots de ce dialogue — <span style="font-weight:900;cursor:pointer;text-decoration:underline dotted;" onclick="fcOpen(0)">cartes mémoire</span></div></div>';
        h+='<div class="vocab-grid">';
        FC_CARDS.forEach(c=>{h+='<div class="vw" onclick="fcOpenWord(\''+c.word.replace(/'/g,"\\'")+'\')"><span class="dot"></span><span class="w">'+esc(c.word)+'</span></div>'});
        h+='</div>';
        h+='<button class="btn btn-pri" type="button" id="btnVocabToggle" style="margin-top:12px" onclick="toggleVocabExo()">Apprendre les mots de vocabulaire</button>';
        h+='</div>';
      }
      h+='</div>';
    } else {
      h+='<div class="intro">'+sec.intro+'</div>';
    }
    h+='<div class="exs" id="exs-'+sec.id+'"></div>';
    if(sec.next){
      h+='<div class="cta"><div><div class="cta-eyebrow">Prochaine étape</div>';
      h+='<div class="cta-tit">'+esc(sec.next.tit)+'</div>';
      h+='<div class="cta-sub">'+esc(sec.next.sub)+'</div></div>';
      h+='<button class="btn cta-btn" type="button" onclick="document.getElementById(\'tab-'+sec.next.id+'\').click();window.scrollTo({top:0,behavior:\'smooth\'})">Continuer →</button></div>';
    }
    d.innerHTML=h;
    wrap.appendChild(d);
  });
  // cartes d'exercices (sections à moteur)
  EXOS.forEach(ex=>{
    const host=document.getElementById('exs-'+ex.sec);
    const card=document.createElement('div');
    card.className='card'; card.id='exo-'+ex.id;
    if(ex.accent) card.style.setProperty('--sec-color', ex.accent);
    if(ex.id==='prVocab') card.style.display='none';
    let h='';
    if(ex.savoir){
      h+='<div class="savoir'+(ex.savoir.speak?' savoir--pron':'')+'">'
       + '<div class="savoir-band">'+esc(ex.savoir.h ? ex.savoir.h.replace(/^›\s*/,'') : 'Prononciation')+'</div>';
      ex.savoir.rows.forEach((r,ri)=>{
        // Une rangée qui s'ouvre sur un exemple se colore en entier (étiquette
        // comprise) : c'est ce qui la sépare visuellement d'une règle.
        const rowEx = /^\s*<span class=['"]savoir-ex['"]/.test(r[1]);
        h+='<div class="savoir-row'+(rowEx?' is-ex':'')+'"><div class="savoir-key">'+r[0]+'</div><div class="savoir-val">'+r[1];
        if(ex.savoir.speak && r[2]){
          h+='<div class="word-chips">';
          r[2].forEach((w,wi)=>{
            const fid=ex.id+'_savoir_'+ri+'_'+wi;
            const phrase=CARRIER_PHRASES[w];
            const wcLabel = phrase ? esc(phrase).replace(new RegExp('('+esc(w)+')','i'),'<b>$1</b>') : esc(w);
            h+='<div class="word-chip"><span class="wc-word'+(phrase?' wc-phrase':'')+'">'+wcLabel+'</span>';
            // On lit la phrase porteuse, pas le mot seul : c'est ce que la
            // pastille affiche, et surtout un mot isolé ne donne aucun indice
            // de langue au moteur de synthèse — un mot français bref peut se
            // faire lire à l'anglaise sans le contexte d'une phrase.
            h+='<button class="btn btn-ghost" type="button" onclick="playWord(this,\''+jsq(phrase||w)+'\',\''+fid+'\')" title="Écouter">'+ICON_SPEAK+'</button>';
            h+='<button class="btn btn-ghost" type="button" onclick="pronCheck(this,\''+jsq(w)+'\')" title="Répète le mot à voix haute">'+ICON_MIC+'</button>';
            h+='</div>';
          });
          h+='</div>';
        }
        h+='</div></div>';
      });
      if(PLUS[ex.id]){
        h+='<div class="plus-bar"><button class="plus-open" type="button" onclick="plusOpen(\''+ex.id+'\')">'
         + '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>'
         + 'En apprendre plus</button></div>';
      }
      h+='</div><div class="savoir-gap"></div>';
    }
    // ── Exercice Vrai/Faux (ou 2 catégories) — colonnes + bouton Corriger ──
    if(ex.type==='vf'){
      h+='<div class="c-hdr">'+exoNumBadge(ex.num)+'<span class="tag">'+esc(ex.num)+'</span><span class="exo-score" id="score-'+ex.id+'" aria-live="polite">0 / '+ex.rows.length+' répondu</span><span class="ctit">'+esc(ex.tit)+'</span><span class="csub">'+esc(ex.sub)+'</span></div>';
      if(!ex.cards) h+='<div class="vf-head"><div class="vf-head-txt"></div><div class="vf-head-opts"><div class="vf-head-opt">'+esc(ex.tiles[0])+'</div><div class="vf-head-opt">'+esc(ex.tiles[1])+'</div></div></div>';
      h+='<div class="rows" id="mount-'+ex.id+'"></div>';
      h+='<div style="margin-top:14px;display:flex;align-items:center;gap:12px;flex-wrap:wrap">';
      h+='<button class="btn btn-pri" type="button" onclick="vfCheckAll(\''+ex.id+'\')">✓ Corriger</button>';
      h+='<div class="vf-summary" id="vfsum-'+ex.id+'" aria-live="polite"></div>';
      h+='</div>';
      card.innerHTML=h; host.appendChild(card); return;
    }
    // ── Exercice à écrire (autocorrection ou correction IA) ──
    if(ex.type==='write'){
      // Si l'exercice a un dialogue, son titre est déjà affiché dans la
      // pastille du dialogue juste en dessous — pas besoin de le répéter ici.
      const titHtml = ex.dialogue ? '' : '<span class="ctit">'+esc(ex.tit)+'</span>';
      h+='<div class="c-hdr">'+exoNumBadge(ex.num)+'<span class="tag">'+esc(ex.num)+'</span>'+titHtml+'<span class="csub">'+esc(ex.sub)+'</span></div>';
      const aiBadge = ex.items.some(it=>!it.accept) ? '<div style="font-size:12px;font-weight:800;color:#0D9488;margin-bottom:10px;display:flex;align-items:center;gap:6px">'+ICON_ASSISTANT+' Un assistant corrige ce que tu écris et te donne une rétroaction.</div>' : '';
      if(ex.dialogue && DIALOGUES[ex.dialogue]){
        const dia=DIALOGUES[ex.dialogue];
        h+='<div class="dial-hd" style="margin-bottom:12px"><div class="d-lbl">'+esc(dia.label)+'</div>';
        h+='<button class="btn-lu" onclick="playDialogue(\''+ex.dialogue+'\',this)">'+ICON_SPEAK+' Écouter</button></div>';
        h+='<details style="margin-bottom:12px"><summary style="cursor:pointer;font-size:13px;font-weight:700;color:var(--ws-accent)">Afficher le texte du dialogue</summary>';
        h+='<div class="dial-txt">';
        dia.lines.forEach((l,i)=>{
          const cls=(i%2===0)?'mb':'dr';
          h+='<div class="dl"><span class="'+cls+'">'+esc(l[0])+' :</span> '+esc(l[1])+'</div>';
        });
        h+='</div></details>';
      }
      h+=aiBadge+'<div class="wlist">';
      ex.items.forEach((it,i)=>{
        h+='<div class="witem"><div class="wq">'+blankify(it.q||'')+'</div>';
        if(it.audio){
          const fid=ex.id+'_'+i;
          h+='<button class="btn btn-ghost wlisten" type="button" onclick="playWord(this,\''+jsq(it.audio)+'\',\''+fid+'\')" style="margin-bottom:8px">'+ICON_SPEAK+' Écouter</button>';
        }
        h+='<div class="wrow"><input class="winput" id="wi_'+ex.id+'_'+i+'" placeholder="'+(it.ph||'Écris ta réponse…')+'" autocomplete="off">';
        h+='<button class="btn btn-pri wbtn" onclick="checkWrite(\''+ex.id+'\','+i+')">Vérifier</button></div>';
        h+='<div class="wfb" id="wf_'+ex.id+'_'+i+'" aria-live="polite"></div></div>';
      });
      h+='</div>';
      card.innerHTML=h; host.appendChild(card); return;
    }
    if(ex.id==='prVocab'){
      // Association par CLIC en deux colonnes (mots / définitions), atteignable
      // au clavier — reprend le modèle je-me-prepare.html au lieu du
      // glisser-déposer générique. Le pointage passe quand même par
      // trackPlacement() pour rester compté dans l'étoile globale.
      h+='<div class="c-hdr">'+exoNumBadge(ex.num)+'<span class="tag">'+esc(ex.num)+'</span><span class="exo-score" id="score-'+ex.id+'" aria-live="polite">0 / '+ex.rows.length+' associé</span><span class="ctit">'+esc(ex.tit)+'</span><span class="csub">'+esc(ex.sub)+'</span></div>';
      h+='<div class="pair-grid"><div class="stack" id="vocab-words"></div><div class="stack" id="vocab-defs"></div></div>';
      h+='<button class="btn btn-ghost" type="button" style="margin-top:14px" onclick="toggleVocabExo(false)">Fermer</button>';
      card.innerHTML=h;
      host.appendChild(card);
      return;
    }
    h+='<div style="display:flex;gap:20px;align-items:flex-start;flex-wrap:wrap">';
    h+='<div class="exo-main" style="flex:1;min-width:300px">';
    h+='<div class="c-hdr">'+exoNumBadge(ex.num)+'<span class="tag">'+esc(ex.num)+'</span><span class="ctit">'+esc(ex.tit)+'</span><span class="csub">'+esc(ex.sub)+'</span></div>';
    if(ex.type==='blanks') h+='<p class="blanks-p" id="mount-'+ex.id+'"></p>';
    else h+='<div class="rows" id="mount-'+ex.id+'"></div>';
    h+='</div>';
    const vert=(ex.type==='match'||ex.type==='rows'||ex.type==='imgmatch')?' vert':'';
    const bw=ex.type==='imgmatch'?'240px':((ex.type==='match'||ex.type==='rows')?'300px':'220px');
    h+='<div class="bsec b1" style="flex:0 0 '+bw+'"><div class="blbl">'+(ex.bankLbl||'Réponses')+'</div><div class="btiles'+vert+'" id="bank-'+ex.id+'"></div></div>';
    h+='</div>';
    card.innerHTML=h;
    host.appendChild(card);
  });
  injectCustom();
  if(document.getElementById('vocab-words')) renderVocabPairs();
}
