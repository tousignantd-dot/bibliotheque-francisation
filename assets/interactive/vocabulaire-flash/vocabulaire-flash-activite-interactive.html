<!DOCTYPE html>
<html lang="fr"><head>
<meta charset="utf-8">
<!-- Le zoom reste possible : jamais user-scalable=no (règle du système de design). -->
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vocabulaire — Cartes mémoire</title>
<link rel="stylesheet" href="/assets/design-system/styles.css">
<style>
/* ══════════════════════════════════════════════════════════════════════
   Cartes mémoire · surcouche du système de design
   Tout ce qui suit n'existe que parce que l'application a des objets que
   les composants ne couvrent pas : la carte de révision, la barre de
   segments, les trois boutons d'auto-évaluation. Aucune couleur en dur :
   uniquement des jetons de assets/design-system/tokens/.
   ══════════════════════════════════════════════════════════════════════ */
body { --sec: var(--green-600); --sec-soft: var(--green-100); }

/* ── Bandeau clair (jamais foncé, jamais coloré en aplat) ───────────── */
.vf-band { padding: var(--sp-5) 0; }
.vf-band__in {
  max-width: 720px; margin: 0 auto; padding: 0 var(--gutter);
  display: flex; flex-wrap: wrap; align-items: center;
  justify-content: space-between; gap: var(--sp-4);
}
.vf-band__t { font-size: var(--fs-h2); font-weight: var(--fw-black);
  letter-spacing: var(--ls-title); line-height: var(--lh-title); margin-top: var(--sp-2); }
.vf-tools { display: flex; flex-wrap: wrap; align-items: center; gap: var(--sp-2); }
.vf-lang { width: auto; min-width: 180px; background: var(--surface-card); font-weight: var(--fw-semi); }

/* Compteurs : le blanc les détache du bandeau vert clair. */
.vf-chip {
  display: inline-flex; align-items: center; min-height: 34px;
  padding: 0 var(--sp-4); border: 1px solid var(--border-tint); border-radius: var(--r-pill);
  background: var(--surface-card); color: var(--text-accent);
  font-size: var(--fs-ui-sm); font-weight: var(--fw-bold); white-space: nowrap;
}
.vf-chip:empty { display: none; }

/* ── Colonne de travail ─────────────────────────────────────────────── */
.vf-main { max-width: 720px; margin: 0 auto; padding: var(--sp-8) var(--gutter) var(--sp-12); }
.vf-stack { display: flex; flex-direction: column; gap: var(--sp-4); }

/* ── Écran de départ ────────────────────────────────────────────────── */
.vf-stats { display: flex; gap: var(--sp-3); margin-bottom: var(--sp-5); }
.vf-stat { flex: 1; background: var(--surface-sunken); border: 1px solid var(--border);
  border-radius: var(--r-sm); padding: var(--sp-3) var(--sp-4); text-align: center; }
.vf-stat__n { font-size: var(--fs-h3); font-weight: var(--fw-black); color: var(--text-strong); }
.vf-stat__l { font-size: var(--fs-meta); font-weight: var(--fw-bold);
  letter-spacing: .06em; text-transform: uppercase; color: var(--text-muted); }

.vf-grp { font-size: var(--fs-label); font-weight: var(--fw-bold);
  letter-spacing: var(--ls-label); text-transform: uppercase; color: var(--text-muted);
  margin: var(--sp-8) 0 var(--sp-3); }
.vf-grp:first-of-type { margin-top: var(--sp-5); }

.vf-liste { display: flex; align-items: center; gap: var(--sp-5); margin-bottom: var(--sp-3); }
.vf-liste__txt { flex: 1; min-width: 0; }
.vf-liste__t { font-size: var(--fs-body); font-weight: var(--fw-black);
  line-height: 1.35; margin-bottom: var(--sp-2); }
.vf-liste__sub { font-size: var(--fs-ui-sm); font-weight: var(--fw-semi); color: var(--text-muted); }
.vf-du   { color: var(--warn-ink); font-weight: var(--fw-bold); }
.vf-fini { color: var(--ok-ink);   font-weight: var(--fw-bold); }
.vf-vide { text-align: center; font-size: var(--fs-body-sm);
  font-weight: var(--fw-medium); color: var(--text-muted); line-height: var(--lh-loose); }

/* Barre de maîtrise d'une liste — le pourcentage est toujours doublé
   du décompte écrit juste dessous : la couleur ne dit rien seule. */
.vf-bar { height: 6px; border-radius: 3px; background: var(--paper-200);
  overflow: hidden; margin-bottom: var(--sp-2); }
.vf-bar span { display: block; height: 100%; background: var(--accent);
  transition: width var(--dur) var(--ease); }

/* ── Barre de parcours de la session ────────────────────────────────── */
.vf-segs { display: flex; gap: var(--sp-1); }
.vf-seg { height: 5px; flex: 1; border-radius: 3px; background: var(--paper-200); }
.vf-seg.is-done { background: var(--accent); }

/* ── La carte ───────────────────────────────────────────────────────── */
.vf-carte { display: flex; flex-direction: column; align-items: center;
  text-align: center; gap: var(--sp-4); padding: var(--sp-8) var(--sp-6); min-height: 240px;
  justify-content: center; }
.vf-domaine { font-size: var(--fs-label); font-weight: var(--fw-black);
  letter-spacing: var(--ls-label); text-transform: uppercase; color: var(--sec); }
.vf-def { font-size: var(--fs-lead); font-weight: var(--fw-semi);
  line-height: var(--lh-loose); color: var(--text-strong); max-width: 46ch; }
.vf-mot { font-size: var(--fs-h2); font-weight: var(--fw-black); color: var(--text-strong); }
.vf-ex { font-size: var(--fs-body-sm); font-weight: var(--fw-medium); font-style: italic;
  color: var(--text-body); line-height: var(--lh-loose); max-width: 46ch; }
.vf-dos { display: flex; flex-direction: column; align-items: center;
  gap: var(--sp-3); width: 100%; padding-top: var(--sp-4);
  border-top: 1px solid var(--border); }

/* Zone de réponse. Le champ reste à 17 px : la réponse doit être relisible. */
.vf-saisie { display: flex; flex-direction: column; align-items: center;
  gap: var(--sp-3); width: 100%; }
.vf-saisie .field { max-width: 340px; text-align: center;
  font-size: var(--fs-body); font-weight: var(--fw-bold); }
.vf-saisie .field.is-no { border-color: var(--no-line); background: var(--no-bg); color: var(--no-ink); }
.vf-actions { display: flex; gap: var(--sp-2); width: 100%; max-width: 340px; }
.vf-actions .btn { flex: 1; }
.vf-fb { min-height: 22px; }

/* Banc de mots : l'élève qui n'arrive pas à écrire le mot le reconnaît
   dans la liste. Ce sont les mots de la session, rangés par ordre
   alphabétique — l'ordre des cartes ne doit rien trahir. */
.vf-choix { width: 100%; max-width: 420px; }
.vf-choix__t { font-size: var(--fs-meta); font-weight: var(--fw-black);
  letter-spacing: .06em; text-transform: uppercase; color: var(--text-muted);
  margin-bottom: var(--sp-2); }
.vf-choix__l { display: flex; flex-wrap: wrap; justify-content: center; gap: var(--sp-2); }
.vf-choix__b { min-height: var(--tap-min); padding: 0 var(--sp-4);
  border: 1px solid var(--border); border-radius: var(--r-pill);
  background: var(--surface-card); color: var(--text-strong);
  font-family: var(--font-sans); font-size: var(--fs-ui-sm);
  font-weight: var(--fw-semi); cursor: pointer;
  transition: background var(--dur) var(--ease), border-color var(--dur) var(--ease); }
.vf-choix__b:hover { background: var(--paper-100); border-color: var(--border-strong, var(--border)); }
.vf-choix__b:disabled { opacity: .5; cursor: default; }

/* Glisser-déposer. Écrire le mot reste la voie principale — c'est ce qui
   ancre l'orthographe — mais l'élève qui bloque devait cliquer une étiquette,
   geste sans rapport avec ce qu'il fait dans les modules. Il glisse donc ici
   comme il glisse là-bas, et le champ devient la zone de dépôt.
   Le glissement passe par les événements « pointer » et non par l'API
   drag-and-drop de HTML : celle-ci ne fonctionne pas au doigt, et la moitié
   de la classe travaille sur tablette. */
.vf-choix__b:not(:disabled) { cursor: grab; touch-action: none; }
.vf-choix__b.is-prise { opacity: .35; cursor: grabbing; }
.vf-choix__fant { position: fixed; z-index: 60; pointer-events: none;
  transform: translate(-50%, -50%); box-shadow: var(--sh-2, 0 6px 18px rgba(20,20,20,.18));
  background: var(--surface-card); }
.vf-choix__aide { font-size: var(--fs-meta); color: var(--text-muted);
  margin-bottom: var(--sp-2); }
/* La cible ne s'annonce que pendant le glissement : un champ en pointillé
   en permanence dirait « ne pas écrire ici », l'inverse de ce qu'on veut. */
.vf-saisie .field.is-cible { border-style: dashed; border-width: 2px;
  border-color: var(--accent); background: var(--accent-soft); }

/* Traduction : un encadré creusé, sous un filet, comme le rail « Mes outils ».
   L'étiquette est en CSS pour que le script puisse écrire en textContent. */
.vf-trad { width: 100%; max-width: 420px; text-align: left;
  border: 1px solid var(--border); border-radius: var(--r-sm);
  background: var(--surface-sunken); padding: var(--sp-3) var(--sp-4);
  font-size: var(--fs-body-sm); font-weight: var(--fw-medium);
  color: var(--text-body); line-height: var(--lh-loose); }
.vf-trad::before { content: "Traduction"; display: block; margin-bottom: var(--sp-1);
  font-size: var(--fs-meta); font-weight: var(--fw-black);
  letter-spacing: .06em; text-transform: uppercase; color: var(--text-muted); }
.vf-trad b { font-size: var(--fs-body); font-weight: var(--fw-black); color: var(--text-strong); }

/* ── Auto-évaluation ────────────────────────────────────────────────
   Trois états, trois mots. La teinte ne fait que doubler le mot, et
   aucune n'est un aplat saturé : le seul rouge plein reste l'audio. */
.vf-rates { display: grid; grid-template-columns: repeat(3, 1fr); gap: var(--sp-2); }
.vf-rate { min-height: var(--tap-comfort); padding: 0 var(--sp-3);
  border: 1px solid var(--border); border-radius: var(--r-pill);
  background: var(--surface-card); font-family: var(--font-sans);
  font-size: var(--fs-ui-sm); font-weight: var(--fw-bold); cursor: pointer;
  transition: background var(--dur) var(--ease); }
.vf-rate--no   { background: var(--no-bg);   border-color: var(--no-line);   color: var(--no-ink); }
.vf-rate--warn { background: var(--warn-bg); border-color: var(--warn-line); color: var(--warn-ink); }
.vf-rate--ok   { background: var(--ok-bg);   border-color: var(--ok-line);   color: var(--ok-ink); }
.vf-rate:hover { background: var(--surface-card); }

/* ── Écran final ────────────────────────────────────────────────────── */
#endView { display: none; text-align: center; }
#endView.on { display: block; }
#endView h2 { margin-bottom: var(--sp-3); }
#endView p { font-size: var(--fs-body-sm); font-weight: var(--fw-medium);
  color: var(--text-muted); line-height: var(--lh-loose); margin-bottom: var(--sp-6); }

.hidden { display: none; }

@media (max-width: 560px) {
  .vf-band__in, .vf-main { padding-left: var(--sp-5); padding-right: var(--sp-5); }
  .vf-liste { flex-direction: column; align-items: stretch; gap: var(--sp-3); }
  .vf-rates { grid-template-columns: 1fr; }
}
</style>
</head>
<body class="page">

<header class="band vf-band">
  <div class="vf-band__in">
    <div>
      <p class="band__eyebrow">Francisation · Niveau 4</p>
      <h1 class="vf-band__t">Vocabulaire — Cartes mémoire</h1>
    </div>
    <div class="vf-tools">
      <label class="u-visually-hidden" for="langSelect">Ma langue maternelle</label>
      <select id="langSelect" class="field vf-lang">
        <option value="">Choisir ma langue</option>
        <option value="anglais">English</option>
        <option value="espagnol">Español</option>
        <option value="arabe">العربية</option>
        <option value="créole haïtien">Kreyòl ayisyen</option>
        <option value="mandarin">中文</option>
        <option value="portugais">Português</option>
        <option value="tagalog">Tagalog</option>
        <option value="vietnamien">Tiếng Việt</option>
        <option value="hindi">हिन्दी</option>
        <option value="ourdou">اردو</option>
        <option value="bengali">বাংলা</option>
        <option value="russe">Русский</option>
        <option value="ukrainien">Українська</option>
        <option value="roumain">Română</option>
        <option value="persan">فارسی</option>
        <option value="turc">Türkçe</option>
        <option value="italien">Italiano</option>
        <option value="__autre__">Autre…</option>
      </select>
      <span class="vf-chip" id="streak-chip"></span>
      <span class="vf-chip" id="prog-chip"></span>
    </div>
  </div>
</header>

<main class="vf-main">
  <div class="vf-stack">

    <div id="startView">
      <div class="card">
        <div class="vf-stats" id="startStats"></div>
        <button class="btn btn--pri" id="startBtn" style="width:100%">Réviser ce qui est dû</button>
      </div>
      <div id="listes"></div>
    </div>

    <div id="sessionView" class="hidden">
      <div class="vf-stack">
        <div class="vf-segs" id="progbar"></div>
        <div class="card vf-carte">
          <span class="vf-domaine" id="cardDomaine"></span>
          <p class="vf-def" id="cardFront"></p>
          <button class="btn btn--ghost btn--sm" id="translateDefBtn">Traduire la définition</button>
          <div class="vf-trad hidden" id="translationDefBox"></div>

          <div class="vf-saisie" id="guessZone">
            <label class="u-visually-hidden" for="guessInput">Écrivez le mot</label>
            <input type="text" id="guessInput" class="field" placeholder="Écrivez le mot ici…"
                   autocomplete="off" autocapitalize="off" spellcheck="false">
            <p class="vf-fb" id="guessFeedback" aria-live="polite"></p>
            <div class="vf-actions">
              <button class="btn btn--ghost" id="giveUpBtn">Je ne sais pas</button>
              <button class="btn btn--pri" id="checkGuessBtn">Vérifier</button>
            </div>
            <button class="btn btn--ghost btn--sm" id="listeMotsBtn"
                    aria-expanded="false" aria-controls="listeMotsBox">Choisir dans la liste</button>
            <div class="vf-choix hidden" id="listeMotsBox">
              <p class="vf-choix__t">Les mots de la session</p>
              <p class="vf-choix__aide">Glissez un mot dans la case — ou touchez-le.</p>
              <div class="vf-choix__l" id="listeMotsL"></div>
            </div>
          </div>

          <div id="cardBack" class="vf-dos hidden">
            <div class="vf-mot" id="cardWord"></div>
            <p class="vf-ex" id="cardExemple"></p>
            <button class="btn btn--ghost btn--sm" id="translateBtn">Traduire dans ma langue</button>
            <div class="vf-trad hidden" id="translationBox"></div>
          </div>
        </div>
        <div class="vf-rates hidden" id="rateActions">
          <button class="vf-rate vf-rate--no" id="btnEncore">Encore</button>
          <button class="vf-rate vf-rate--warn" id="btnDifficile">Difficile</button>
          <button class="vf-rate vf-rate--ok" id="btnFacile">Facile</button>
        </div>
      </div>
    </div>

    <div id="endView" class="card">
      <h2>Session terminée</h2>
      <p id="endSummary"></p>
      <button class="btn btn--pri" id="restartBtn">Nouvelle session</button>
    </div>

  </div>
</main>

<script>
const params = new URLSearchParams(location.search);
const studentCode = params.get('code') || '';
let listeDemandee = params.get('liste') || '';   // liste à ouvrir d'emblée

let cards = [];
let idx = 0;
let revealed = false;
let counts = { encore: 0, difficile: 0, facile: 0 };
let streak = 0;
let bestStreak = 0;
let cachedTranslation = null; // {wordId, traduction, definitionTraduite, exempleTraduit}
let listeEnCours = '';        // titre de la liste révisée, '' = tout ce qui est dû

/* ── Langue maternelle ─────────────────────────────────────────────── */
const langSelect = document.getElementById('langSelect');
const savedLang = localStorage.getItem('vocabLang') || '';
const savedLangLabel = localStorage.getItem('vocabLangLabel') || '';
if (savedLang && [...langSelect.options].some(o => o.value === savedLang)) {
  langSelect.value = savedLang;
} else if (savedLangLabel) {
  const opt = document.createElement('option');
  opt.value = savedLangLabel; opt.textContent = savedLangLabel;
  langSelect.insertBefore(opt, langSelect.querySelector('option[value="__autre__"]'));
  langSelect.value = savedLangLabel;
}

langSelect.addEventListener('change', () => {
  if (langSelect.value === '__autre__') {
    const custom = prompt('Quelle est votre langue maternelle ?');
    if (custom && custom.trim()) {
      const label = custom.trim();
      const opt = document.createElement('option');
      opt.value = label; opt.textContent = label;
      langSelect.insertBefore(opt, langSelect.querySelector('option[value="__autre__"]'));
      langSelect.value = label;
      localStorage.setItem('vocabLang', label);
      localStorage.setItem('vocabLangLabel', label);
    } else {
      langSelect.value = savedLang || '';
    }
  } else {
    localStorage.setItem('vocabLang', langSelect.value);
    localStorage.removeItem('vocabLangLabel');
  }
});

/* ── Mes listes ────────────────────────────────────────────────────────
   Une liste par activité offerte à l'élève. L'écran ne décide de rien : il
   affiche ce que le serveur compte, pour que la fiche de l'enseignante et le
   portail de l'élève ne se contredisent jamais. */
async function chargerListes(){
  const stats = document.getElementById('startStats');
  const zone = document.getElementById('listes');
  try {
    const res = await fetch('/api/vocab/listes?code=' + encodeURIComponent(studentCode));
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || '');

    stats.innerHTML =
      '<div class="vf-stat"><div class="vf-stat__n">' + data.dueTotal + '</div><div class="vf-stat__l">à revoir aujourd\'hui</div></div>' +
      '<div class="vf-stat"><div class="vf-stat__n">' + data.newTotal + '</div><div class="vf-stat__l">mots jamais vus</div></div>';
    document.getElementById('startBtn').disabled = (data.dueTotal + data.newTotal) === 0;

    const listes = data.listes || [];
    if (!listes.length) {
      zone.innerHTML = '<div class="card vf-vide">Aucune liste de mots pour le moment.<br>Elles arrivent avec les modules de votre cours.</div>';
      return;
    }
    let h = '';
    ['cours', 'atelier'].forEach(cat => {
      const groupe = listes.filter(l => l.categorie === cat);
      if (!groupe.length) return;
      h += '<div class="vf-grp">' + (cat === 'cours' ? 'Les mots de mes modules' : 'Les mots de mes ateliers') + '</div>';
      groupe.forEach(l => { h += carteListe(l); });
    });
    zone.innerHTML = h;
    zone.querySelectorAll('button[data-liste]').forEach(b => {
      b.addEventListener('click', () => startSession(b.dataset.liste, b.dataset.titre));
    });

    // Le rail « Mes outils » d'un module ouvre directement sa propre liste :
    // l'élève a déjà choisi en cliquant là-bas, on ne le refait pas choisir.
    // Une seule fois, sinon revenir à l'écran des listes la relancerait.
    if (listeDemandee) {
      const voulue = listes.find(l => String(l.activityId) === listeDemandee);
      listeDemandee = '';
      if (voulue) startSession(voulue.activityId, voulue.titre);
    }
  } catch (e) {
    // Fichier ouvert hors du portail, serveur éteint : l'écran le dit au lieu
    // de rester vide, mais rien ne bloque.
    stats.innerHTML = '';
    zone.innerHTML = '<div class="card vf-vide">Impossible de charger vos listes.<br>Vérifiez votre connexion, puis rouvrez la page.</div>';
  }
}

function carteListe(l){
  const pct = l.total ? Math.round((l.mastered / l.total) * 100) : 0;
  const fini = l.total > 0 && l.mastered === l.total;
  // L'état porte toujours un mot, jamais la seule couleur.
  let sous = '<strong>' + l.mastered + ' / ' + l.total + '</strong> mots maîtrisés';
  if (fini) sous = '<span class="vf-fini">✓ Liste maîtrisée</span> — ' + l.total + ' mots';
  else if (l.due) sous += ' · <span class="vf-du">' + l.due + ' à revoir aujourd\'hui</span>';
  else if (l.new) sous += ' · ' + l.new + ' à découvrir';
  return '<div class="card vf-liste">' +
    '<div class="vf-liste__txt">' +
      '<div class="vf-liste__t">' + escHtml(l.titre) + '</div>' +
      '<div class="vf-bar"><span style="width:' + pct + '%"></span></div>' +
      '<div class="vf-liste__sub">' + sous + '</div>' +
    '</div>' +
    '<button class="btn ' + (fini ? 'btn--ghost' : 'btn--pri') + '" data-liste="' + l.activityId + '" data-titre="' + escHtml(l.titre) + '">' +
      (fini ? 'Revoir' : 'Réviser') + '</button>' +
  '</div>';
}

document.getElementById('startBtn').addEventListener('click', () => startSession('', ''));

async function startSession(activityId, titre){
  listeEnCours = titre || '';
  try {
    const res = await fetch('/api/vocab/session?code=' + encodeURIComponent(studentCode) + '&n=10' + (activityId ? '&activityId=' + encodeURIComponent(activityId) : ''));
    const data = await res.json();
    if (!res.ok || !data.cards || data.cards.length === 0) {
      // Une liste terminée n'a plus rien à servir avant la prochaine échéance :
      // c'est une bonne nouvelle, pas une erreur.
      alert(listeEnCours
        ? 'Rien à réviser dans cette liste aujourd\'hui. Revenez demain.'
        : 'Rien à réviser aujourd\'hui. Revenez demain.');
      return;
    }
    cards = data.cards;
    buildListeMots();
    idx = 0;
    counts = { encore: 0, difficile: 0, facile: 0 };
    streak = 0;
    bestStreak = 0;
    updateStreakChip();
    document.getElementById('startView').classList.add('hidden');
    document.getElementById('sessionView').classList.remove('hidden');
    document.getElementById('endView').classList.remove('on');
    renderCard();
  } catch (e) {
    alert('Impossible de charger les cartes. Vérifiez votre connexion.');
  }
}

function buildProgbar(){
  const bar = document.getElementById('progbar');
  bar.innerHTML = '';
  cards.forEach((_, i) => {
    const seg = document.createElement('div');
    seg.className = 'vf-seg' + (i < idx ? ' is-done' : '');
    bar.appendChild(seg);
  });
}

function renderCard(){
  const c = cards[idx];
  document.getElementById('prog-chip').textContent = 'Carte ' + (idx+1) + ' / ' + cards.length;
  document.getElementById('cardDomaine').textContent = c.domaine;
  document.getElementById('cardFront').textContent = c.definition;
  document.getElementById('cardBack').classList.add('hidden');
  document.getElementById('rateActions').classList.add('hidden');
  document.getElementById('cardWord').textContent = c.mot;
  document.getElementById('cardExemple').textContent = c.exemple;

  const translationBox = document.getElementById('translationBox');
  translationBox.classList.add('hidden');
  translationBox.textContent = '';
  const translateBtn = document.getElementById('translateBtn');
  translateBtn.disabled = false;
  translateBtn.textContent = 'Traduire dans ma langue';
  translateBtn.classList.remove('hidden');

  const translationDefBox = document.getElementById('translationDefBox');
  translationDefBox.classList.add('hidden');
  translationDefBox.textContent = '';
  const translateDefBtn = document.getElementById('translateDefBtn');
  translateDefBtn.disabled = false;
  translateDefBtn.textContent = 'Traduire la définition';
  translateDefBtn.classList.remove('hidden');

  const guessInput = document.getElementById('guessInput');
  guessInput.value = '';
  guessInput.disabled = false;
  guessInput.classList.remove('is-good', 'is-no');
  document.getElementById('guessFeedback').textContent = '';
  document.getElementById('guessFeedback').className = 'vf-fb';
  document.getElementById('guessZone').classList.remove('hidden');
  document.getElementById('checkGuessBtn').disabled = false;
  document.getElementById('giveUpBtn').disabled = false;
  document.getElementById('listeMotsBtn').disabled = false;
  document.querySelectorAll('#listeMotsL .vf-choix__b').forEach(b => b.disabled = false);
  majListeMots();

  cachedTranslation = null;
  revealed = false;
  buildProgbar();
  guessInput.focus();
}

/* ── Banc de mots ───────────────────────────────────────────────────
   Le bouton reste ouvert d'une carte à l'autre : l'élève qui a besoin de
   l'appui en a besoin partout, il ne va pas le rouvrir vingt fois. */
let listeMotsOuverte = localStorage.getItem('vocabListeMots') === '1';

function buildListeMots(){
  const zone = document.getElementById('listeMotsL');
  zone.innerHTML = '';
  const mots = [...new Set(cards.map(c => c.mot))]
    .sort((a, b) => a.localeCompare(b, 'fr'));
  mots.forEach(mot => {
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'vf-choix__b';
    b.textContent = mot;
    b.addEventListener('click', () => {
      // Un glissement se termine par un pointerup, que le navigateur fait
      // suivre d'un clic quand il a eu lieu sur l'étiquette : sans ce
      // garde-fou, le mot serait déposé deux fois.
      if (b.dataset.glisse) return;
      deposerMot(mot);
    });
    armerGlissement(b, mot);
    zone.appendChild(b);
  });
}

/* Un mot déposé vaut un mot écrit : même chemin de vérification, donc même
   rétroaction et même comptage. */
function deposerMot(mot){
  if (revealed) return;
  document.getElementById('guessInput').value = mot;
  document.getElementById('checkGuessBtn').click();
}

/* Glisser une étiquette jusqu'au champ.
   Le clic reste branché : le glissement ne remplace rien, il s'ajoute. Un
   déplacement de moins de 6 px n'est donc pas un glissement mais un clic, et
   on le laisse au navigateur — sinon toucher une étiquette ne ferait plus
   rien sur tablette. */
function armerGlissement(bouton, mot){
  const SEUIL = 6;
  bouton.addEventListener('pointerdown', ev => {
    if (revealed || bouton.disabled || ev.button > 0) return;
    const champ = document.getElementById('guessInput');
    const depart = {x: ev.clientX, y: ev.clientY};
    let fantome = null;

    const surLeChamp = e => {
      const r = champ.getBoundingClientRect();
      return e.clientX >= r.left && e.clientX <= r.right
          && e.clientY >= r.top && e.clientY <= r.bottom;
    };
    const bouger = e => {
      if (!fantome) {
        if (Math.hypot(e.clientX - depart.x, e.clientY - depart.y) < SEUIL) return;
        fantome = bouton.cloneNode(true);
        fantome.classList.add('vf-choix__fant');
        fantome.style.width = bouton.offsetWidth + 'px';
        fantome.style.height = bouton.offsetHeight + 'px';
        document.body.appendChild(fantome);
        bouton.classList.add('is-prise');
        // La capture garde les événements sur l'étiquette même quand le doigt
        // sort de son cadre — sans quoi le glissement s'arrête au premier
        // pixel franchi. Elle échoue si le pointeur n'est plus actif : le
        // glissement continue alors sans elle plutôt que de se rompre.
        try { bouton.setPointerCapture(e.pointerId); } catch (_) {}
      }
      fantome.style.left = e.clientX + 'px';
      fantome.style.top = e.clientY + 'px';
      champ.classList.toggle('is-cible', surLeChamp(e));
    };
    const lacher = e => {
      bouton.removeEventListener('pointermove', bouger);
      bouton.removeEventListener('pointerup', lacher);
      bouton.removeEventListener('pointercancel', lacher);
      champ.classList.remove('is-cible');
      if (!fantome) return;                 // simple clic : au gestionnaire de clic
      fantome.remove();
      bouton.classList.remove('is-prise');
      // Le drapeau ne vaut que pour le clic immédiat, celui que le navigateur
      // émet dans la foulée du pointerup. Il est levé au tour de boucle
      // suivant : un glissement relâché À CÔTÉ du champ n'émet aucun clic, et
      // un drapeau laissé en place rendrait l'étiquette muette au clic suivant.
      bouton.dataset.glisse = '1';
      setTimeout(() => { delete bouton.dataset.glisse; }, 0);
      if (surLeChamp(e)) deposerMot(mot);
    };
    bouton.addEventListener('pointermove', bouger);
    bouton.addEventListener('pointerup', lacher);
    bouton.addEventListener('pointercancel', lacher);
  });
}

function majListeMots(){
  const btn = document.getElementById('listeMotsBtn');
  const box = document.getElementById('listeMotsBox');
  btn.setAttribute('aria-expanded', listeMotsOuverte ? 'true' : 'false');
  btn.textContent = listeMotsOuverte ? 'Cacher la liste' : 'Choisir dans la liste';
  box.classList.toggle('hidden', !listeMotsOuverte);
}

document.getElementById('listeMotsBtn').addEventListener('click', () => {
  listeMotsOuverte = !listeMotsOuverte;
  localStorage.setItem('vocabListeMots', listeMotsOuverte ? '1' : '0');
  majListeMots();
});

function normalizeGuess(s){
  return (s || '')
    .trim().toLowerCase()
    .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
    .replace(/^(un |une |le |la |les |l')/, '')
    .trim();
}

function revealCard(){
  if (revealed) return;
  revealed = true;
  document.getElementById('cardBack').classList.remove('hidden');
  document.getElementById('rateActions').classList.remove('hidden');
  document.getElementById('guessInput').disabled = true;
  document.getElementById('checkGuessBtn').disabled = true;
  document.getElementById('giveUpBtn').disabled = true;
  document.getElementById('listeMotsBtn').disabled = true;
  document.querySelectorAll('#listeMotsL .vf-choix__b').forEach(b => b.disabled = true);
}

/* Le compteur de série est un repère, pas une récompense : un mot, un
   nombre, aucune animation. */
function updateStreakChip(){
  const chip = document.getElementById('streak-chip');
  chip.textContent = streak > 1 ? 'Série de ' + streak : '';
}

function markGuessCorrect(guessInput, feedback){
  guessInput.classList.remove('is-no');
  guessInput.classList.add('is-good');
  streak++;
  bestStreak = Math.max(bestStreak, streak);
  updateStreakChip();
  feedback.className = 'vf-fb fb fb--ok';
  feedback.textContent = 'Juste.';
  setTimeout(revealCard, 500);
}

function markGuessWrong(guessInput, feedback){
  guessInput.classList.remove('is-good');
  guessInput.classList.add('is-no');
  streak = 0;
  updateStreakChip();
  feedback.className = 'vf-fb fb fb--no';
  feedback.textContent = 'Ce n’est pas le mot. Réessayez, ou affichez la réponse.';
}

document.getElementById('checkGuessBtn').addEventListener('click', async () => {
  const c = cards[idx];
  const guessInput = document.getElementById('guessInput');
  const feedback = document.getElementById('guessFeedback');
  const checkBtn = document.getElementById('checkGuessBtn');
  const guessValue = guessInput.value;

  if (normalizeGuess(guessValue) === normalizeGuess(c.mot)) {
    markGuessCorrect(guessInput, feedback);
    return;
  }
  if (!guessValue.trim()) {
    markGuessWrong(guessInput, feedback);
    return;
  }

  // Pas de correspondance exacte : on demande un second avis avant de
  // refuser, pour accepter les variantes valides (« médecin spécialiste »
  // pour « spécialiste », synonymes, articles en trop, etc.).
  checkBtn.disabled = true;
  feedback.className = 'vf-fb fb fb--warn';
  feedback.textContent = 'Vérification…';
  try {
    const res = await fetch('/api/vocab/check-answer', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ code: studentCode, wordId: c.id, guess: guessValue }),
    });
    const data = await res.json();
    checkBtn.disabled = false;
    if (res.ok && data.correct) {
      markGuessCorrect(guessInput, feedback);
    } else {
      markGuessWrong(guessInput, feedback);
    }
  } catch (err) {
    checkBtn.disabled = false;
    markGuessWrong(guessInput, feedback);
  }
});

document.getElementById('guessInput').addEventListener('keydown', (e) => {
  if (e.key === 'Enter') document.getElementById('checkGuessBtn').click();
});

document.getElementById('giveUpBtn').addEventListener('click', () => {
  streak = 0;
  updateStreakChip();
  revealCard();
});

async function getTranslation(){
  const c = cards[idx];
  if (cachedTranslation && cachedTranslation.wordId === c.id) return cachedTranslation;
  const res = await fetch('/api/vocab/translate', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({ code: studentCode, wordId: c.id, language: langSelect.value }),
  });
  const data = await res.json();
  if (!res.ok) throw new Error(data.error || 'Traduction indisponible pour le moment.');
  cachedTranslation = Object.assign({ wordId: c.id }, data);
  return cachedTranslation;
}

document.getElementById('translateDefBtn').addEventListener('click', async () => {
  const lang = langSelect.value;
  if (!lang || lang === '__autre__') {
    alert('Choisissez d’abord votre langue maternelle, en haut de la page.');
    return;
  }
  const btn = document.getElementById('translateDefBtn');
  const box = document.getElementById('translationDefBox');
  btn.disabled = true;
  btn.textContent = 'Traduction en cours…';
  try {
    const data = await getTranslation();
    box.textContent = data.definitionTraduite;
    box.classList.remove('hidden');
    btn.classList.add('hidden');
  } catch (err) {
    box.textContent = err.message;
    box.classList.remove('hidden');
    btn.disabled = false;
    btn.textContent = 'Traduire la définition';
  }
});

document.getElementById('translateBtn').addEventListener('click', async () => {
  const lang = langSelect.value;
  if (!lang || lang === '__autre__') {
    alert('Choisissez d’abord votre langue maternelle, en haut de la page.');
    return;
  }
  const translateBtn = document.getElementById('translateBtn');
  const translationBox = document.getElementById('translationBox');
  translateBtn.disabled = true;
  translateBtn.textContent = 'Traduction en cours…';
  try {
    const data = await getTranslation();
    translationBox.innerHTML = '<b>' + escHtml(data.traduction) + '</b><br>' + escHtml(data.exempleTraduit);
    translationBox.classList.remove('hidden');
    translateBtn.classList.add('hidden');
  } catch (err) {
    translationBox.textContent = err.message;
    translationBox.classList.remove('hidden');
    translateBtn.disabled = false;
    translateBtn.textContent = 'Traduire dans ma langue';
  }
});

function escHtml(s){
  return (s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function rate(quality){
  const c = cards[idx];
  counts[quality]++;
  fetch('/api/vocab/answer', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({ code: studentCode, wordId: c.id, quality }),
  }).catch(() => {});

  idx++;
  if (idx >= cards.length) {
    endSession();
  } else {
    renderCard();
  }
}

document.getElementById('btnEncore').addEventListener('click', () => rate('encore'));
document.getElementById('btnDifficile').addEventListener('click', () => rate('difficile'));
document.getElementById('btnFacile').addEventListener('click', () => rate('facile'));

function endSession(){
  document.getElementById('sessionView').classList.add('hidden');
  document.getElementById('endView').classList.add('on');
  // La meilleure série ne s'affiche qu'à partir de deux : « série de 1 » ne
  // dit rien, et « série : 0 » ressemble à un reproche.
  document.getElementById('endSummary').textContent =
    (listeEnCours ? listeEnCours + ' — ' : '') +
    cards.length + ' mots revus : ' + counts.facile + ' faciles, ' + counts.difficile + ' difficiles, ' + counts.encore + ' à revoir.'
    + (bestStreak > 1 ? ' Meilleure série : ' + bestStreak + '.' : '');
  document.getElementById('prog-chip').textContent = '';
  document.getElementById('streak-chip').textContent = '';
  lmsTrack('exercise_completed', { zonesDone: cards.length, score: Math.round((counts.facile / cards.length) * 100) });
}

document.getElementById('restartBtn').addEventListener('click', () => {
  document.getElementById('endView').classList.remove('on');
  document.getElementById('startView').classList.remove('hidden');
  // On recharge : la session vient de faire monter des mots de boîte, les
  // barres doivent le montrer tout de suite.
  chargerListes();
});

function lmsTrack(event, data) {
  try { window.parent.postMessage(Object.assign({lms: true, event: event}, data||{}), '*'); } catch(e) {}
}

chargerListes();
</script>
